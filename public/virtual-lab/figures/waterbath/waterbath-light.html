<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bể ổn nhiệt</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(700px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình bể ổn nhiệt. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt trên .wb-machine: --heat (0–1, nước nóng), --steam (0–1), --glow (0–1, tấm gia nhiệt),
   --dev (0–1, kết tủa và vòng hiện dần), data-boil (sủi bọt), data-lid="open|closed". Màu dung dịch đặt qua --c. */
.iso {
  --wb-cav-top: #262c31;
  --wb-cav-0: #171b1f;
  --wb-cav-1: #1b2024;
  --wb-cav-2: #20262a;
  --wb-cav-3: #252b30;
  --wb-water: #3b8fd0;
  --wb-hot: #ff7a45;
  --wb-steam: #cfdbe2;
  --wb-glass: #a9cfdd;
  --wb-heater: #b4643a;
  --wb-heater-hot: #ff5a2e;
  --wb-rubber: #121416;
  --wb-bezel: #0d0f11;
  --wb-lcd: #050807;
  --wb-digits: #59f08c;
  --wb-set: #ffc65a;
  --wb-icon: #2c3a33;
  --wb-heat-on: #ff8a3d;
  --wb-alarm: #ff4b3a;
  --wb-keytext: #9aa3aa;
  --wb-void: #0c0f12;
  --wb-slot: #0e1114;
  --wb-cord: #15181b;
}
.iso[data-theme="light"] {
  --wb-cav-top: #c3cacf;
  --wb-cav-0: #aab1b6;
  --wb-cav-1: #b2b9be;
  --wb-cav-2: #b9c0c5;
  --wb-cav-3: #c0c7cc;
  --wb-water: #2f80d6;
  --wb-hot: #e8551f;
  --wb-steam: #f2f6f8;
  --wb-glass: #8fb9cc;
  --wb-heater: #c27040;
  --wb-heater-hot: #e8481c;
  --wb-rubber: #3a3f44;
  --wb-bezel: #23282c;
  --wb-lcd: #0a100d;
  --wb-digits: #59f08c;
  --wb-set: #ffc65a;
  --wb-icon: #34463c;
  --wb-heat-on: #ff8a3d;
  --wb-alarm: #ff4b3a;
  --wb-keytext: #c4ccd2;
  --wb-void: #59626a;
  --wb-slot: #6b747b;
  --wb-cord: #3a3f44;
}

/* Lòng bể inox: tông riêng, hơi ngả màu hơi nước khi bể sôi */
.wb-cavity .iso-top { fill: color-mix(in oklab, var(--wb-cav-top), var(--wb-steam) calc(var(--steam, 0) * 14%)); }
.wb-cavity .iso-shade[data-shade="0"] { fill: var(--wb-cav-0); stroke: none; }
.wb-cavity .iso-shade[data-shade="1"] { fill: var(--wb-cav-1); stroke: none; }
.wb-cavity .iso-shade[data-shade="2"] { fill: var(--wb-cav-2); stroke: none; }
.wb-cavity .iso-shade[data-shade="3"] { fill: var(--wb-cav-3); stroke: none; }

/* Lòng vỏ máy thấy qua cửa sổ cắt: tối hơn vỏ ngoài */
.wb-floor .iso-top { fill: color-mix(in oklab, var(--anatomy-shade-1), var(--wb-cav-0) 45%); }
.wb-inside .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-1), var(--wb-cav-0) 60%); stroke: none; }
/* Lòng nắp mái nhìn từ dưới: nửa mái trước tối hơn nửa sau */
.wb-under { fill: var(--anatomy-shade-0); fill-opacity: 0.55; }

/* Nước: trong mờ, ấm dần theo nhiệt độ */
.wb-water .iso-fill { fill: color-mix(in oklab, var(--wb-water), var(--wb-hot) calc(var(--heat, 0) * 28%)); fill-opacity: 0.12; }
.wb-water .iso-top { fill: color-mix(in oklab, var(--wb-water), var(--wb-hot) calc(var(--heat, 0) * 28%)); fill-opacity: 0.22; }
.wb-water .iso-shade { fill: color-mix(in oklab, var(--wb-water), var(--wb-hot) calc(var(--heat, 0) * 28%)); fill-opacity: 0.1; stroke: none; }
.wb-water .iso-edge { stroke: color-mix(in oklab, var(--wb-water), var(--anatomy-lo) 40%); }

/* Thuỷ tinh ống nghiệm, dung dịch, kết tủa, vòng màu (màu lấy từ --c của từng lớp) */
.wb-glass .iso-fill { fill: var(--wb-glass); fill-opacity: 0.1; }
.wb-glass .iso-top, .wb-glass .iso-shade { fill: var(--wb-glass); fill-opacity: 0.16; stroke: none; }
.wb-glass .iso-solid[data-seamless] > .iso-shade[data-shade], .wb-glass .iso-solid[data-seamless] > .iso-top { stroke: none; }
.wb-liq .iso-fill { fill: var(--c); fill-opacity: 0.6; }
.wb-liq .iso-shade { fill: var(--c); fill-opacity: 0.35; stroke: none; }
.wb-liq .iso-top { fill: color-mix(in oklab, var(--c), #ffffff 22%); fill-opacity: 0.85; }
.wb-liq .iso-edge { stroke: color-mix(in oklab, var(--c), var(--anatomy-lo) 45%); }
.wb-ppt, .wb-ring { opacity: var(--dev, 1); }
.wb-ppt .iso-fill { fill: var(--c); }
.wb-ppt .iso-shade { fill: color-mix(in oklab, var(--c), #000000 18%); stroke: none; }
.wb-ppt .iso-top { fill: color-mix(in oklab, var(--c), #ffffff 12%); }
.wb-ring .iso-fill, .wb-ring .iso-top { fill: var(--c); }
.wb-ring .iso-shade { fill: color-mix(in oklab, var(--c), #000000 15%); stroke: none; }

.iso .wb-liq .iso-solid > .iso-shade[data-shade], .iso .wb-liq .iso-solid > .iso-top,
.iso .wb-ppt .iso-solid > .iso-shade[data-shade], .iso .wb-ppt .iso-solid > .iso-top,
.iso .wb-ring .iso-solid > .iso-shade[data-shade], .iso .wb-ring .iso-solid > .iso-top { stroke: none; }

/* Tấm gia nhiệt silicone: đỏ dần khi đang đun */
.wb-heater .iso-top, .wb-heater .iso-shade { fill: color-mix(in oklab, var(--wb-heater), var(--wb-heater-hot) calc(var(--glow, 0) * 70%)); stroke: none; }

/* Cao su, khung bảng điều khiển màu đen, dây nguồn */
.wb-rubber .iso-top, .wb-rubber .iso-shade { fill: color-mix(in oklab, var(--wb-rubber) 80%, var(--anatomy-shade-1)); stroke: none; }
.wb-rubber .tb-body, .wb-cord .tb-body { fill: var(--wb-cord); }
.wb-bezel .iso-top, .wb-bezel .iso-shade { fill: color-mix(in oklab, var(--wb-bezel) 85%, var(--anatomy-shade-1)); stroke: none; }
.wb-lcd { fill: var(--wb-lcd); }
.wb-digits { font-family: var(--anatomy-mono); fill: var(--wb-digits); }
.wb-unit { font-family: var(--anatomy-mono); fill: var(--wb-digits); opacity: 0.8; }
.wb-set { font-family: var(--anatomy-mono); fill: var(--wb-set); }
.wb-key { font-family: var(--anatomy-mono); fill: var(--wb-keytext); }
.iso .wb-icon { fill: none; stroke: var(--wb-icon); stroke-width: 0.9px; stroke-linecap: round; }
.iso .wb-heat { fill: none; stroke: var(--wb-icon); stroke-width: 1.1px; stroke-linecap: round; transition: stroke 0.2s var(--anatomy-ease); }
.iso .wb-heat[data-on] { stroke: var(--wb-heat-on); }
.iso .wb-alarm { fill: none; stroke: var(--wb-icon); stroke-width: 0.9px; stroke-linejoin: round; }
.iso .wb-alarm[data-on] { stroke: var(--wb-alarm); }
.wb-dot { fill: var(--anatomy-lit); }
.wb-void { fill: var(--wb-void); }
.wb-slot { fill: var(--wb-slot); }

/* Bọt khí ở mặt cắt của nước và hơi nước */
.wb-bubble { fill: var(--wb-steam); fill-opacity: 0.75; stroke: color-mix(in oklab, var(--wb-water), var(--anatomy-lo) 30%); stroke-width: 0.3px; vector-effect: non-scaling-stroke; opacity: 0; }
.wb-machine[data-boil] .wb-bubble { animation: wb-bubble var(--d, 2s) linear infinite; animation-delay: calc(var(--i) * -0.27s); }
@keyframes wb-bubble { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 0.9; } 85% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-40px); } }
.wb-wisp, .wb-leak { fill: var(--wb-steam); opacity: 0; filter: blur(3px); }
.wb-machine[data-lid="open"] .wb-wisp { animation: wb-rise 2.8s ease-in-out infinite; animation-delay: calc(var(--i) * -0.4s); }
.wb-machine[data-lid="closed"] .wb-leak { animation: wb-leak 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.8s); }
@keyframes wb-leak { 0% { opacity: 0; transform: translateY(2px); } 35% { opacity: calc(var(--steam, 0) * 0.2); } 100% { opacity: 0; transform: translateY(-26px); } }
@keyframes wb-rise { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: calc(var(--steam, 0) * 0.34); } 100% { opacity: 0; transform: translateY(-46px); } }
@media (prefers-reduced-motion: reduce) {
  .wb-machine[data-boil] .wb-bubble, .wb-machine[data-lid] .wb-wisp, .wb-machine[data-lid] .wb-leak { animation: none; }
  .wb-machine[data-boil] .wb-bubble { opacity: 0.7; }
  .wb-machine[data-lid="open"] .wb-wisp { opacity: calc(var(--steam, 0) * 0.22); }
  .wb-machine[data-lid="closed"] .wb-leak { opacity: calc(var(--steam, 0) * 0.12); }
}

/* Chú giải các ống dưới hình (HTML) */
.wb-legend { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px/1.4 var(--anatomy-mono); color: var(--anatomy-muted); }
.wb-legend li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.wb-legend .sw { width: 10px; height: 14px; border-radius: 1px 1px 5px 5px; border: 1px solid var(--anatomy-lo); flex: none; }
.wb-legend .pp { width: 10px; height: 4px; border-radius: 2px; flex: none; }
.wb-legend .rg { width: 10px; height: 2px; flex: none; }
.wb-legend li[data-hot] { color: var(--anatomy-text); }

.wb-stage { touch-action: pan-y; cursor: pointer; }
.wb-stage:focus { outline: none; }

và ống xả vẽ theo cấu tạo điển hình, không theo sơ đồ của hãng; vị trí van xả chưa xác minh. Đồng hồ trong hình chạy nhanh hơn thực tế.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)

    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];

function runsOf(flags, want) {
    const count = flags.length;

    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];

    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

        else if (run) {

}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;

    const b = faces[k];

    const y = a[1] + b[1];

    const [s0] = meridian[i];

  };

    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));

      refine(mid, b, depth + 1);

    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);

}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const r1 = side[side.length - 1][1];

  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));

  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";

  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");

  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

function shapeOf(meridian, P, smooth) {

    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));

  const tones = [];
  for (let j = 0; j < n; j++) {

    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));

  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);

    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);

    outline: edges.join(""),

function prismOf(F, polygon, s0, s1, P) {

  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;

  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];

    const c = (slope * aV - least * norm) / flat;

  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {

  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));

function pathLength(points) {

function cut(points, from, to) {

function spiral(F, s, r0, r1, a0, a1, steps = 28) {

// Mô hình bể ổn nhiệt (theo Memmert Waterbath WNB 10), dùng chung cho bản dựng (Node), trang hình (trình duyệt)
// và sau này cho lõi mô phỏng của app (src/core). Module thuần: không DOM, không Three.js, không import file khác.
//
// Nguồn số liệu:
// - Datasheet Memmert "Waterbaths WNB, WNE, WPE" (01/2022,
//   https://analytics-shop.com/media/Hersteller/Kataloge/memmert-us/Memmert_Waterbaths_WNB_WNE.pdf):
//   WNB 10: khoảng 10 L; lòng bể inox 350 × 210 × 140 mm (dài × rộng × sâu); vỏ dài 578 mm, rộng 356 mm,
//   cao 238 mm với nắp phẳng và 337 mm với nắp mái; mực nước tối thiểu 97 mm, tối đa 120 mm; dải làm việc
//   từ nhiệt độ phòng + 5 K tới +95 °C cộng mức sôi; dải đặt +10 tới +95 °C và mức sôi; dao động ±0,1 K;
//   phân bố ±0,25 K; khoảng 1200 W; gia nhiệt diện rộng ở ba mặt ngoài lòng bể; khoảng 13 kg.
//   Bản vẽ kích thước: ngăn điều khiển 164 mm ở đầu trái, chân 15 mm, lề lòng bể 67 mm (trước) và 79 mm (sau).
//   Phụ kiện: giá ống 2 hàng 24 lỗ Ø18 mm rộng 50 mm (E02022); khay đáy đục lỗ 2 độ cao 30 hoặc 60 mm;
//   nắp mái inox B02642.
// - Một datasheet Memmert cùng đời: độ phân giải hiển thị 0,1 °C tới 99,9 °C, 1 °C từ 100 °C (chưa xác minh riêng cho WNB).
// - Nhiệt dung riêng của nước 4,18 J/(g·K) (khoảng 20–60 °C, NIST Chemistry WebBook / CRC Handbook);
//   ẩn nhiệt hoá hơi ở 100 °C 2257 J/g (CRC Handbook); nhiệt dung riêng inox 304 khoảng 0,50 J/(g·K).
// Số ước tính, chưa xác minh với hãng: lòng bể inox khoảng 3 kg; hiệu suất truyền nhiệt 90 %;
// hệ số mất nhiệt 6 W/K khi đậy nắp mái và 9 W/K khi mở nắp (gồm cả bay hơi), chọn để 8 L nước từ 20 °C
// tới sôi mất khoảng 1 giờ (tối thiểu lý thuyết với 1200 W là khoảng 38 phút).

const WNB10 = {
  outer: { length: 578, width: 356, heightFlat: 238, heightGable: 337, feet: 15 },
  bath: { length: 350, width: 210, depth: 140 },
  control: 164, // ngăn điều khiển ở đầu trái mặt trước
  margin: { front: 67, back: 79 },
  level: { min: 97, max: 120, drawn: 110 }, // mực nước (mm từ đáy lòng bể); hình vẽ dùng 110
  setRange: [10, 95], // trên 95 °C là mức sôi
  boilStage: 100,
  stability: 0.1, // ±K theo thời gian
  uniformity: 0.25, // ±K trong bể
  powerW: 1200,
  massKg: 13,
  efficiency: 0.9,
  steelKg: 3,
  lossWK: { closed: 6, open: 9 },
  room: 22,
};

const WATER = { cp: 4.18, latent: 2257, rho: 1, boil: 100 };
const STEEL_CP = 0.5;

// Giá ống và ống nghiệm vẽ trong hình (bước lỗ và chiều dài giá chưa xác minh)
const RACK = { holes: 12, rows: 2, pitch: 25, hole: 18, width: 50, length: 320 };
const TUBE = { od: 16, length: 150, wall: 0.7, maxTubes: 10 };

/** Thể tích nước (L) trong lòng bể ở mực `depthMm`. */
const waterLitres = (depthMm = WNB10.level.drawn) => (WNB10.bath.length * WNB10.bath.width * depthMm) / 1e6;

/** Nhiệt dung (J/K) của nước và lòng bể. */
function heatCapacity(depthMm = WNB10.level.drawn) {
  return waterLitres(depthMm) * 1000 * WATER.rho * WATER.cp + WNB10.steelKg * 1000 * STEEL_CP;
}

/** Nhiệt độ đích của bộ điều khiển: đặt trên 95 °C là mức sôi (đun hết công suất, nước dừng ở 100 °C). */
const targetOf = (setC) => (setC > WNB10.setRange[1] ? WATER.boil : Math.max(WNB10.setRange[0], setC));
const isBoilStage = (setC) => setC > WNB10.setRange[1];

/**
 * Nhiệt độ nước sau `seconds` giây đun từ `fromC`, theo cân bằng nhiệt một nút:
 * C·dT/dt = P·η − UA·(T − T_phòng). Khi tới nhiệt độ đích thì bộ điều khiển PID giữ ở đó (đun sôi thì nước dừng ở 100 °C).
 * Nguội (đích thấp hơn nước) theo hằng số thời gian C/UA.
 */
function tempAfter(seconds, { fromC = WNB10.room, setC = 100, lid = "closed", depthMm = WNB10.level.drawn, room = WNB10.room } = {}) {
  const C = heatCapacity(depthMm);
  const UA = WNB10.lossWK[lid === "open" ? "open" : "closed"];
  const goal = targetOf(setC);
  const tau = C / UA;
  const decay = Math.exp(-Math.max(0, seconds) / tau);
  if (fromC <= goal) {
    const inf = room + (WNB10.powerW * WNB10.efficiency) / UA;
    return Math.min(goal, inf + (fromC - inf) * decay);
  }
  return Math.max(goal, room + (fromC - room) * decay);
}

/** Số phút để nước từ `fromC` lên `toC` (Infinity nếu công suất không đủ bù mất nhiệt). */
function heatUpMinutes({ fromC = WNB10.room, toC = 100, lid = "closed", depthMm = WNB10.level.drawn, room = WNB10.room } = {}) {
  const C = heatCapacity(depthMm);
  const UA = WNB10.lossWK[lid === "open" ? "open" : "closed"];
  const inf = room + (WNB10.powerW * WNB10.efficiency) / UA;
  if (toC <= fromC) return 0;
  if (toC >= inf) return Infinity;
  return ((C / UA) * Math.log((inf - fromC) / (inf - toC))) / 60;
}

/** Nước bay hơi khi đang sôi (g/phút): phần công suất không mất ra ngoài đi vào ẩn nhiệt hoá hơi. */
function boilOffGPerMin({ lid = "closed", room = WNB10.room } = {}) {
  const UA = WNB10.lossWK[lid === "open" ? "open" : "closed"];
  return (Math.max(0, WNB10.powerW * WNB10.efficiency - UA * (WATER.boil - room)) / WATER.latent) * 60;
}

/** Chữ trên màn hình: 0,1 °C tới 99,9 °C, số nguyên từ 100 °C. */
function displayText(T) {
  if (T >= 99.95) return String(Math.round(T));
  return T.toFixed(1).replace(".", ",");
}

/** Mức hơi nước 0–1 trên mặt nước (bắt đầu từ 90 °C, đầy ở 100 °C) và có sủi bọt không (từ 95 °C). */
const steamOf = (T) => Math.min(1, Math.max(0, (T - 90) / 10));
const bubblesAt = (T) => T >= 95;

// Lượt đun mẫu khi không có #run: 5 ống thử Fehling sau 5 phút cách thuỷ sôi
// (2 mL Fehling A+B và 1 mL mẫu 1 % ≈ 3 mL, cao khoảng 24 mm trong ống 16 × 150 mm).
const DEMO_RUN = {
  setC: 100,
  waterC: 99.6,
  lid: "open",
  minutes: 5,
  tubes: [
    { label: "Glucose", color: "#6f8f4a", level: 0.16, precipitate: "#b2381c", ring: null },
    { label: "Fructose", color: "#7a8a44", level: 0.16, precipitate: "#b2381c", ring: null },
    { label: "Maltose", color: "#4f8a8c", level: 0.16, precipitate: "#a8452a", ring: null },
    { label: "Sucrose", color: "#2563c7", level: 0.16, precipitate: null, ring: null },
    { label: "ĐC nước", color: "#2563c7", level: 0.16, precipitate: null, ring: null },
  ],
};

const COLOR = /^(#[0-9a-f]{3,8}|(rgb|hsl)a?\([0-9.,%\s/deg]+\)|[a-z]{3,20})$/i;
const colorOf = (c, fallback) => (typeof c === "string" && COLOR.test(c.trim()) ? c.trim() : fallback);
const num = (v, fallback) => (typeof v === "number" && Number.isFinite(v) ? v : fallback);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/** Chuẩn hoá dữ liệu #run (thiếu thì lấy theo lượt mẫu, kẹp vào dải hợp lệ, tối đa 10 ống). */
function runOf(run) {
  const r = run && typeof run === "object" ? run : DEMO_RUN;
  const setC = clamp(num(r.setC, DEMO_RUN.setC), WNB10.setRange[0], WATER.boil);
  const waterC = clamp(num(r.waterC, targetOf(setC)), 0, WATER.boil);
  const tubes = (Array.isArray(r.tubes) ? r.tubes : run ? [] : DEMO_RUN.tubes).slice(0, TUBE.maxTubes).map((t, i) => ({
    label: String(t?.label ?? `Ống ${i + 1}`).slice(0, 28),
    color: colorOf(t?.color, "#9cc3d4"),
    level: clamp(num(t?.level, 0.16), 0, 0.6),
    precipitate: t?.precipitate ? colorOf(t.precipitate, null) : null,
    ring: t?.ring ? colorOf(t.ring, null) : null,
  }));
  return { setC, waterC, lid: r.lid === "closed" ? "closed" : "open", minutes: clamp(num(r.minutes, 0), 0, 600), tubes };
}

/** Lỗ dùng cho n ống: xếp giữa hàng trước của giá 12 lỗ. */
function holesFor(n) {
  const start = Math.floor((RACK.holes - n) / 2);
  return Array.from({ length: n }, (_, i) => start + i);
}
// Nắp mái inox (gable cover) của bể ổn nhiệt (theo nắp Memmert B02642 cho WNB 10): viền đứng bốn phía, hai mái
// nghiêng gặp nhau ở sống mái chạy dọc bể, hai đầu hồi tam giác, tay cầm thanh tròn ở hai đầu hồi, hai lá bản lề.
// Nắp quay quanh trục bản lề ở mép sau (song song với x). Dùng chung cho bản dựng và trang (dựng lại theo góc).
// Toạ độ trong nắp: y' hướng về phía trước tính từ trục bản lề, z' hướng lên; nắp đóng khi θ = 0.

function makeLid(k, G, P, D) {
  const { H, x0, x1 } = D;
  const V = G.viewOf(P);
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);

  // Tiết diện nắp (y', z'): mép sau, mép trước, viền đứng, sống mái
  const [Y0, Y1] = D.span;
  const SK = D.skirt;
  const RIDGE = D.ridge;
  const YM = (Y0 + Y1) / 2;
  const SHELL = [[Y0, D.base], [Y1, D.base], [Y1, SK], [YM, RIDGE], [Y0, SK]];
  const LEAF = [[D.knuckle - 0.2, -1.2], [Y0 + 3, -1.2], [Y0 + 3, 1.2], [D.knuckle - 0.2, 1.2]];

  const frameAt = (theta) => {
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    return G.frameOf(H, [1, 0, 0], [0, c, s], [0, -s, c]);
  };
  const local = (F, x, y, z) => G.add3(G.add3(G.add3(F.o, G.mul3(F.a, x)), G.mul3(F.u, y)), G.mul3(F.v, z));
  const path3 = (F, pts, closed = false) => k.pathOf(pts.map(([x, y, z]) => at(local(F, x, y, z))), closed);
  const underVisible = (theta) => G.dot3(G.mul3(frameAt(theta).v, -1), V) > 0;

  // Tay cầm: thanh tròn ở đầu hồi, gần mép trước, chìa ra theo ±x; chân đế tròn hàn vào đầu hồi
  const HANDLE = { y: Y1 - 26, z: SK + 6, out: 20, r: 3.2, boss: 5.5 };
  function handleParts(F, side) {
    const xe = side < 0 ? x0 : x1;
    const dir = G.mul3(F.a, side);
    const HF = G.frameOf(local(F, xe, HANDLE.y, HANDLE.z), dir, F.u, F.v);
    return { HF, xe };
  }

  function svg(theta) {
    const F = frameAt(theta);
    const prism = (poly, a, b) => G.prismOf(F, poly, a, b, P);
    const under = underVisible(theta);
    // Mặt dưới thấy được khi nắp mở: lòng nắp rỗng (viền trong và sống mái nhìn từ dưới)
    const inner = under
      ? `<path class="wb-under" d="${path3(F, [[x0 + D.t, YM, D.base], [x1 - D.t, YM, D.base], [x1 - D.t, Y1 - D.t, D.base], [x0 + D.t, Y1 - D.t, D.base]], true)}"/>` +
        Ln(path3(F, [[x0 + D.t, Y0 + D.t, D.base], [x1 - D.t, Y0 + D.t, D.base], [x1 - D.t, Y1 - D.t, D.base], [x0 + D.t, Y1 - D.t, D.base]], true), { tone: "lo" }) +
        Ln(path3(F, [[x0 + D.t, YM, D.base], [x1 - D.t, YM, D.base]]), { tone: "faint" })
      : "";
    const shell = S(prism(SHELL, x0, x1), { tone: "mid", inner });
    const handles = [-1, 1].map((side) => {
      const { HF } = handleParts(F, side);
      const boss = S(G.disc(0, 1.6, HANDLE.boss, HF, P, { steps: 24 }), { tone: "lo" });
      const rod = S(G.solidOf([[1.6, HANDLE.r], [HANDLE.out - 1.6, HANDLE.r], [HANDLE.out, HANDLE.r - 1.2, 1]], HF, P, { steps: 24 }), { tone: "hi" });
      return { side, markup: boss + rod, near: G.dot3(G.mul3(F.a, side), V) > 0 };
    });
    const leaves = D.hinges.map(([a, b]) => S(prism(LEAF, a, b), { tone: "lo" })).join("");
    const far = handles.filter((h) => !h.near).map((h) => h.markup).join("");
    const near = handles.filter((h) => h.near).map((h) => h.markup).join("");
    return far + leaves + shell + near;
  }

  function shapes(theta, A) {
    const F = frameAt(theta);
    const meta = (name) => ({ name, owner: "lid" });
    // Nắp là tấm tôn: ghi từng tấm (hai viền, hai mái, hai đầu hồi) để ống nghiệm nằm trong lòng nắp không bị coi là xuyên
    const t = D.t;
    const sheets = [
      ["lid.skirtF", [[Y1 - t, D.base], [Y1, D.base], [Y1, SK], [Y1 - t, SK]]],
      ["lid.skirtB", [[Y0, D.base], [Y0 + t, D.base], [Y0 + t, SK], [Y0, SK]]],
      ["lid.slopeF", [[Y1 - t, SK], [Y1, SK], [YM, RIDGE], [YM, RIDGE - t * 1.6]]],
      ["lid.slopeB", [[Y0, SK], [Y0 + t, SK], [YM, RIDGE - t * 1.6], [YM, RIDGE]]],
    ];
    return [
      ...sheets.map(([name, poly]) => A.prism(F, poly, x0, x1, meta(name))),
      A.prism(F, SHELL, x0, x0 + t, meta("lid.endL")),
      A.prism(F, SHELL, x1 - t, x1, meta("lid.endR")),
      ...D.hinges.map(([a, b], i) => A.prism(F, LEAF, a, b, meta(`lid.leaf${i}`))),
      ...[-1, 1].flatMap((side) => {
        const { HF } = handleParts(F, side);
        return [A.disc(HF, 0, 1.6, HANDLE.boss, meta(`lid.boss${side}`)), A.solid(HF, [[1.6, HANDLE.r], [HANDLE.out - 1.6, HANDLE.r], [HANDLE.out, HANDLE.r - 1.2, 1]], meta(`lid.handle${side}`))];
      }),
    ];
  }

  // Góc mà nắp nằm dọc theo tia nhìn: dưới góc này nắp phủ lên thân, trên góc này thân phủ lên nắp
  const flip = Math.atan2(V[2], V[1]);

  return { svg, shapes, underVisible, frameAt, flip, local };
}
// Ống nghiệm 16 × 150 mm trong giá của bể ổn nhiệt: thành thuỷ tinh đáy tròn, dung dịch, kết tủa ở đáy, vòng màu.
// Dùng chung cho bản dựng (Node: vẽ lượt mẫu và ghi hình dạng để kiểm tra) và trang (vẽ lại theo #run).
// Mỗi ống cắt thành ba khúc theo chiều cao để xếp thứ tự vẽ đúng với giá và nước:
//   khúc 0: từ đáy ống tới mặt dưới tấm lỗ của giá; khúc 1: từ mặt trên tấm lỗ tới mặt nước; khúc 2: trên mặt nước.

function makeTubes(k, G, P, D) {
  const { L, r, wall, cuts } = D;
  const rin = r - wall;
  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);
  const UP = (x, y, z) => G.frameOf([x, y, z], [0, 0, 1], [1, 0, 0], [0, 1, 0]);
  const PIECES = [[0, cuts[0]], [cuts[1], cuts[2]], [cuts[2], L]];
  const LIP = 2;

  // Bán kính ngoài và trong theo s (đáy là nửa cầu bán kính r)
  const rOut = (s) => (s >= L - LIP ? r + 0.6 : s >= r ? r : Math.sqrt(Math.max(0, r * r - (r - s) ** 2)));
  const rIn = (s) => (s >= r ? rin : Math.sqrt(Math.max(0, rin * rin - (r - s) ** 2)));
  const BASE = r - rin; // đáy trong

  // Đoạn profile [a, b] của một mặt tròn xoay r(s); đoạn cong đánh dấu trơn
  function profile(rad, a, b, start) {
    const pts = [];
    const curve = [0.12, 0.5, 1.1, 2, 3.1, 4.4, 5.9, r].filter((s) => s >= start);
    const knots = [a, ...curve.filter((s) => s > a + 0.05 && s < b - 0.05), b];
    for (const s of knots) pts.push(s < r ? [s, Math.max(0.05, rad(s)), 1] : [s, rad(s)]);
    return pts;
  }
  function glassProfile(a, b) {
    const pts = profile(rOut, a, Math.min(b, L - LIP), 0);
    if (b > L - LIP) pts.push([L - LIP, r + 0.6], [b, r + 0.6]);
    return pts;
  }

  // Các lớp bên trong theo dữ liệu một ống: kết tủa, dung dịch, vòng, dung dịch
  function layers(spec) {
    if (!spec || !(spec.level > 0)) return [];
    const top = Math.min(L - 6, Math.max(BASE + 2, spec.level * L));
    const out = [];
    let s = BASE;
    if (spec.precipitate) {
      const p = Math.min(top - 0.5, BASE + 7.5);
      out.push({ s0: s, s1: p, cls: "wb-ppt", color: spec.precipitate });
      s = p;
    }
    if (spec.ring && top - s > 6) {
      const at = s + (top - s) * 0.55;
      out.push({ s0: s, s1: at, cls: "wb-liq", color: spec.color });
      out.push({ s0: at, s1: at + 2.4, cls: "wb-ring", color: spec.ring });
      s = at + 2.4;
    }
    if (top > s) out.push({ s0: s, s1: top, cls: "wb-liq", color: spec.color, surface: true });
    return out;
  }

  function svg(x, y, z0, piece, spec) {
    const [a, b] = PIECES[piece];
    const F = UP(x, y, z0);
    let inside = "";
    for (const layer of layers(spec)) {
      const s0 = Math.max(a, layer.s0);
      const s1 = Math.min(b, layer.s1);
      if (s1 - s0 < 0.05) continue;
      const prof = profile(rIn, s0, s1, BASE);
      const meniscus = layer.surface && layer.s1 <= b + 1e-6 ? Ln(G.circleOf(F, s1, rIn(s1) - 0.2, P, 40), { tone: "faint" }) : "";
      inside += `<g class="${layer.cls}" style="--c:${layer.color}">${S(G.solidOf(prof, F, P, { steps: 40 }), { tone: "hi", crease: "none" })}${meniscus}</g>`;
    }
    const glass = S(G.solidOf(glassProfile(a, b), F, P, { steps: 40 }), { tone: "mid", crease: "none", inner: b >= L ? Ln(G.circleOf(F, L, rin, P, 40), { tone: "faint" }) : "" });
    return `${inside}<g class="wb-glass">${glass}</g>`;
  }

  function shape(x, y, z0, piece, A, meta) {
    const [a, b] = PIECES[piece];
    return A.solid(UP(x, y, z0), glassProfile(a, b), meta);
  }

  return { svg, shape, layers, PIECES };
}
// Phần chạy trong trang: nắp mái bản lề (lò xo, chốt khi gần đóng), ống nghiệm vẽ theo #run, đồng hồ đếm giờ đun
// (kết tủa và vòng màu hiện dần), nhiệt độ nước theo mô hình khi đổi nhiệt độ đặt, màn hình, biểu tượng gia nhiệt,
// bọt khí và hơi nước khi nước từ 95 °C, chú giải các ống, vòng giới thiệu.
const D = {"P":{"origin":[317.06098278849385,418.27511905616234],"scale":0.6202499257986538,"azimuth":112,"elevation":32},"lid":{"H":[0,-111,231.2],"x0":-133,"x1":233,"span":[4,230],"base":-4,"skirt":10,"ridge":105.80000000000001,"t":1.2,"knuckle":4,"hinges":[[-95,-65],[165,195]]},"lidOpen":1.8325957145940461,"flip":0.5930233723777132,"tubes":{"L":150,"r":8,"wall":0.7,"cuts":[60,62,78]},"holes":[[-87.5,69],[-62.5,69],[-37.5,69],[-12.5,69],[12.5,69],[37.5,69],[62.5,69],[87.5,69],[112.5,69],[137.5,69],[162.5,69],[187.5,69]],"z0":118};
const P = D.P;
const kk = { iso, pathOf, solidSvg, lineSvg, dotsSvg, roundedPlan };
const LIDM = makeLid(kk, G, P, D.lid);
const TUBEM = makeTubes(kk, G, P, D.tubes);
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const $ = (sel) => svgEl.querySelector(sel);
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const legend = stage.querySelector("[data-legend]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

// Lượt đun do app truyền qua địa chỉ (…waterbath.html#run=<JSON>, JSON qua encodeURIComponent):
// { setC: 100, waterC: 99.6, lid: "open"|"closed", minutes: 5,
//   tubes: [{ label: "Glucose", color: "#6f8f4a", level: 0.16, precipitate: "#b2381c"|null, ring: null|"#…" }] } (tối đa 10 ống)
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
const R0 = runOf(RUN);
const HOLES = holesFor(R0.tubes.length);
const LID_OPEN = D.lidOpen;
const SPEEDS = [10, 30, 120]; // giây mô phỏng mỗi giây thật
const el = {
  machine: $('[data-part="machine"]'),
  closed: $('[data-slot="closed"]'),
  open: $('[data-slot="open"]'),
  disp: $('[data-part="disp"]'),
  set: $('[data-part="disp-set"]'),
  heat: $('[data-part="heat"]'),
  alarm: $('[data-part="alarm"]'),
};

const state = {
  setC: R0.setC,
  water: R0.waterC,
  driven: false, // nhiệt độ nước chạy theo mô hình (sau khi đổi nhiệt độ đặt hoặc khi đếm giờ)
  lid: { x: R0.lid === "open" ? LID_OPEN : 0, v: 0, target: R0.lid === "open" ? LID_OPEN : 0 },
  elapsed: R0.minutes * 60,
  running: false,
  speed: 1,
  hover: -1,
};
let lidDrawn = null;
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches;
let tour = { step: "wait", wait: 2.6 };
let idleTimer = 0;
let clockT = 0;

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const dec = (v, d = 1) => v.toFixed(d).replace(".", ",");
const mmss = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
const total = () => R0.minutes * 60;

// ——— Ống nghiệm và chú giải theo #run ———
function drawTubes() {
  const used = new Map(HOLES.map((h, i) => [h, R0.tubes[i]]));
  for (const node of svgEl.querySelectorAll("[data-tube]")) {
    const h = Number(node.dataset.tube);
    const piece = Number(node.dataset.piece);
    const spec = used.get(h);
    const [x, y] = D.holes[h];
    node.innerHTML = spec ? TUBEM.svg(x, y, D.z0, piece, spec) : "";
  }
  legend.replaceChildren(
    ...R0.tubes.map((t, i) => {
      const li = document.createElement("li");
      li.dataset.i = String(i);
      const sw = document.createElement("span");
      sw.className = "sw";
      sw.style.background = t.color;
      li.append(sw);
      if (t.precipitate) {
        const pp = document.createElement("span");
        pp.className = "pp";
        pp.style.background = t.precipitate;
        li.append(pp);
      }
      if (t.ring) {
        const rg = document.createElement("span");
        rg.className = "rg";
        rg.style.background = t.ring;
        li.append(rg);
      }
      li.append(document.createTextNode(`${i + 1} · ${t.label}`));
      return li;
    }),
  );
}

function drawLid() {
  const th = state.lid.x;
  const key = th.toFixed(4);
  if (key === lidDrawn) return;
  lidDrawn = key;
  const markup = LIDM.svg(th);
  if (th > D.flip) { el.open.innerHTML = markup; el.closed.innerHTML = ""; }
  else { el.closed.innerHTML = markup; el.open.innerHTML = ""; }
}
function stepLid(dt, calm) {
  const L = state.lid;
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const w = 1 / 0.32;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  L.x = clamp(L.x, 0, LID_OPEN);
  // Nắp nặng: gần chạm mép bể thì đặt hẳn xuống
  if (L.target === 0 && L.x < 0.02) { L.x = 0; L.v = 0; return false; }
  if (Math.abs(L.target - L.x) < 1e-4 && Math.abs(L.v) < 1e-4) { L.x = L.target; L.v = 0; return false; }
  return true;
}
const lidClosed = () => state.lid.x === 0 && state.lid.target === 0;
const lidName = () => (state.lid.target === 0 ? "closed" : "open");

const heatingNow = () => isBoilStage(state.setC) || state.water < targetOf(state.setC) - 0.3;

function draw(calm) {
  drawLid();
  const T = state.water;
  const m = el.machine;
  const heating = heatingNow();
  m.style.setProperty("--heat", clamp((T - 20) / 80, 0, 1).toFixed(3));
  m.style.setProperty("--steam", steamOf(T).toFixed(3));
  m.style.setProperty("--glow", heating ? "0.85" : "0.2");
  const dev = total() > 0 ? clamp(state.elapsed / total(), 0, 1) : 1;
  m.style.setProperty("--dev", dev.toFixed(3));
  m.toggleAttribute("data-boil", bubblesAt(T));
  m.dataset.lid = state.lid.x > 0.3 ? "open" : "closed";
  if (el.disp.textContent !== displayText(T)) el.disp.textContent = displayText(T);
  const setTxt = isBoilStage(state.setC) ? "100" : String(Math.round(state.setC));
  if (el.set.textContent !== setTxt) el.set.textContent = setTxt;
  // Đèn gia nhiệt: sáng liền khi đun lên hoặc ở mức sôi; khi giữ nhiệt PID đóng ngắt theo chu kỳ
  const blink = !heating && T > 30 && !calm && (clockT % 1) < 0.35;
  el.heat.toggleAttribute("data-on", heating || blink);
  el.alarm.toggleAttribute("data-on", T > targetOf(state.setC) + 10);
  drawReadout();
}

function drawReadout() {
  let line;
  if (state.hover >= 0) {
    const t = R0.tubes[state.hover];
    const bits = [t.precipitate ? "có kết tủa" : "không kết tủa", t.ring ? "có vòng màu" : ""].filter(Boolean).join(" · ");
    line = `ống ${state.hover + 1} · ${t.label} · ${bits}`;
  } else {
    const set = isBoilStage(state.setC) ? "mức sôi" : `đặt ${Math.round(state.setC)} °C`;
    const time = total() > 0 ? ` · ${mmss(Math.min(state.elapsed, total()))}/${mmss(total())}` : "";
    const lid = state.lid.target === 0 ? (state.lid.x === 0 ? "nắp đóng" : "đang đóng nắp") : state.lid.x > LID_OPEN - 1e-3 ? "nắp mở" : "đang mở nắp";
    line = `nước ${displayText(state.water)} °C · ${set}${time} · ${lid}`;
  }
  if (readout.textContent !== line) readout.textContent = line;
}

function toggleLid() {
  state.lid.target = state.lid.target > 0 ? 0 : LID_OPEN;
  say(state.lid.target > 0 ? "Mở nắp." : "Đóng nắp mái: nước ngưng chảy ngược về bể.");
}
function startStop() {
  if (state.running) { state.running = false; say("Dừng đếm giờ."); return; }
  if (state.elapsed >= total()) state.elapsed = 0;
  state.running = true;
  state.driven = true;
  say(total() > 0 ? `Đếm giờ đun ${R0.minutes} phút.` : "Đun.");
}
function changeSet(dir) {
  let s = isBoilStage(state.setC) ? 96 : Math.round(state.setC);
  s = clamp(s + dir, 10, 96);
  state.setC = s > 95 ? 100 : s;
  state.driven = true;
  say(isBoilStage(state.setC) ? "Mức sôi: đun hết công suất, nước dừng ở 100 °C." : `Đặt ${state.setC} °C.`);
}
function reset() {
  Object.assign(state, { setC: R0.setC, water: R0.waterC, driven: false, elapsed: total(), running: false });
  state.lid.target = R0.lid === "open" ? LID_OPEN : 0;
}

function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "wait") { state.lid.target = 0; tour = { step: "closing", wait: 0.4 }; }
  else if (tour.step === "closing") { if (lidClosed()) { state.elapsed = 0; state.running = total() > 0; tour = { step: "running", wait: 0 }; } }
  else if (tour.step === "running") { if (!state.running) { state.lid.target = LID_OPEN; tour = { step: "show", wait: 4.5 }; } }
  else if (tour.step === "show") { reset(); tour = { step: "wait", wait: 1.2 }; }
}

function tick(t) {
  const dt = previous ? Math.min((t - previous) / 1000, 1 / 30) : 1 / 60;
  previous = t;
  const calm = still.matches;
  clockT += dt;
  if (touring && !calm) tourStep(dt);
  const moving = stepLid(dt, calm);
  const sim = dt * SPEEDS[state.speed];
  if (state.running) {
    state.elapsed += sim;
    if (state.elapsed >= total()) { state.elapsed = total(); state.running = false; say(`Hết ${R0.minutes} phút: lấy ống ra.`); }
  }
  let warming = false;
  if (state.driven) {
    const next = tempAfter(sim, { fromC: state.water, setC: state.setC, lid: lidName() });
    warming = Math.abs(next - state.water) > 1e-4;
    state.water = next;
  }
  draw(calm);
  const busy = touring || moving || state.running || warming || (!calm && state.water > 30);
  frame = visible && busy && !calm ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible && !still.matches) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 2.6 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || state.running) return; touring = true; tour = { step: "wait", wait: 0.8 }; loop(); }, 10000);
}
function settleStill() {
  // Giảm chuyển động: không hoạt cảnh, mọi thay đổi cho kết quả ngay
  stepLid(0, true);
  if (state.running) { state.elapsed = total(); state.running = false; }
  if (state.driven) state.water = tempAfter(36000, { fromC: state.water, setC: state.setC, lid: lidName() });
  draw(true);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (key === " " || key === "Enter" || key === "Escape" || key.startsWith("Arrow")) event.preventDefault();
  else return;
  takeOver();
  if (key === "Enter") toggleLid();
  else if (key === " ") startStop();
  else if (key === "ArrowRight") changeSet(1);
  else if (key === "ArrowLeft") changeSet(-1);
  else if (key === "ArrowUp") state.speed = Math.min(SPEEDS.length - 1, state.speed + 1);
  else if (key === "ArrowDown") state.speed = Math.max(0, state.speed - 1);
  else if (key === "Escape") { reset(); say("Đặt lại theo lượt đun."); }
  if (still.matches) settleStill();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest("[data-slot]")) toggleLid();
  else startStop();
  stage.focus({ preventScroll: true });
  if (still.matches) settleStill();
  loop();
});
function hoverAt(target) {
  const node = target?.closest?.("[data-tube]");
  const h = node && node.childElementCount ? Number(node.dataset.tube) : -1;
  const i = HOLES.indexOf(h);
  if (i === state.hover) return;
  state.hover = i;
  for (const li of legend.children) li.toggleAttribute("data-hot", Number(li.dataset.i) === i);
  drawReadout();
}
svgEl.addEventListener("pointermove", (event) => hoverAt(event.target));
svgEl.addEventListener("pointerleave", () => hoverAt(null));
stage.addEventListener("focus", () => say(readout.textContent));

drawTubes();
draw(still.matches);
</script></body></html>
