<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nồi hấp tiệt trùng</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>/* Màu riêng của hình nồi hấp. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt trên nhóm máy: --heat (0–1, nước nóng), --steam (0–1, hơi trong buồng), --glow (điện trở),
   --tape (0–1, vạch băng chỉ thị sẫm lại), data-locked, data-boil, data-exhaust. */
.iso {
  --ac-cav-top: #20262b;
  --ac-cav-0: #151a1e;
  --ac-cav-1: #191e22;
  --ac-cav-2: #1d2327;
  --ac-cav-3: #22282d;
  --ac-steam: #c9d6de;
  --ac-water: #3b8fd0;
  --ac-hot: #ff6a3d;
  --ac-glass: #9cc3d4;
  --ac-media: #e2b04a;
  --ac-foil: #b9c2c8;
  --ac-cap: #3d7be0;
  --ac-tape: #e9dfc2;
  --ac-stripe-0: #d2c28e;
  --ac-stripe-1: #1c1712;
  --ac-bottle: #cfd9de;
  --ac-red: #ff4b3a;
  --ac-lock: #ff9f1c;
  --ac-panel: #1a1f23;
  --ac-lcd: #0c1a14;
  --ac-lcd-ink: #7dffb0;
  --ac-lamp-off: #2b3330;
  --ac-lamp-on: #ffb547;
  --ac-dial: #e9edef;
  --ac-dial-ink: #1d2327;
  --ac-void: #0b0f12;
}
.iso[data-theme="light"] {
  --ac-cav-top: #b9c0c5;
  --ac-cav-0: #a7aeb3;
  --ac-cav-1: #aeb5ba;
  --ac-cav-2: #b5bcc1;
  --ac-cav-3: #bcc3c8;
  --ac-steam: #f4f7f9;
  --ac-water: #2f7fd6;
  --ac-hot: #e0461f;
  --ac-glass: #8fb9cc;
  --ac-media: #d99a1e;
  --ac-foil: #9aa4ab;
  --ac-cap: #2b67cf;
  --ac-tape: #f1e8cf;
  --ac-stripe-0: #c9b679;
  --ac-stripe-1: #241c14;
  --ac-bottle: #e3eaee;
  --ac-red: #e2341f;
  --ac-lock: #e07a00;
  --ac-panel: #2a3238;
  --ac-lcd: #10261c;
  --ac-lcd-ink: #8dffbd;
  --ac-lamp-off: #48524d;
  --ac-lamp-on: #ffb547;
  --ac-dial: #fbfcfc;
  --ac-dial-ink: #1d2327;
  --ac-void: #2b3238;
}

/* Lòng buồng inox: tông tối riêng, ngả sang màu hơi nước khi buồng đầy hơi */
.ac-cavity .iso-top { fill: color-mix(in oklab, var(--ac-cav-top), var(--ac-steam) calc(var(--steam, 0) * 22%)); }
.ac-cavity .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--ac-cav-0), var(--ac-steam) calc(var(--steam, 0) * 18%)); stroke: none; }
.ac-cavity .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--ac-cav-1), var(--ac-steam) calc(var(--steam, 0) * 18%)); stroke: none; }
.ac-cavity .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--ac-cav-2), var(--ac-steam) calc(var(--steam, 0) * 18%)); stroke: none; }
.ac-cavity .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--ac-cav-3), var(--ac-steam) calc(var(--steam, 0) * 18%)); stroke: none; }

/* Nước: trong mờ, ấm dần theo nhiệt độ */
.ac-water .iso-fill { fill: color-mix(in oklab, var(--ac-water), var(--ac-hot) calc(var(--heat, 0) * 35%)); fill-opacity: 0.22; }
.ac-water .iso-top { fill: color-mix(in oklab, var(--ac-water), var(--ac-hot) calc(var(--heat, 0) * 35%)); fill-opacity: 0.3; }
.ac-water .iso-shade { fill: color-mix(in oklab, var(--ac-water), var(--ac-hot) calc(var(--heat, 0) * 35%)); fill-opacity: 0.2; stroke: none; }
.ac-water .iso-edge { stroke: color-mix(in oklab, var(--ac-water), var(--anatomy-lo) 40%); }

/* Điện trở đỏ lên khi đang đun */
.ac-heater .tb-body { fill: color-mix(in oklab, var(--anatomy-paper), var(--ac-hot) calc(var(--glow, 0) * 55%)); }
.ac-heater .tb-shine { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--ac-hot) calc(var(--glow, 0) * 70%)); }

/* Thuỷ tinh trong suốt, dịch môi trường, giấy bạc, nắp chai */
.ac-glass .iso-fill { fill: var(--ac-glass); fill-opacity: 0.16; }
.ac-glass .iso-top, .ac-glass .iso-shade { fill: var(--ac-glass); fill-opacity: 0.2; stroke: none; }
.ac-media .iso-fill { fill: var(--ac-media); fill-opacity: 0.55; }
.ac-media .iso-top, .ac-media .iso-shade { fill: color-mix(in oklab, var(--ac-media), var(--anatomy-paper) 15%); fill-opacity: 0.7; stroke: none; }
.ac-foil .iso-top, .ac-foil .iso-shade { fill: color-mix(in oklab, var(--ac-foil) 70%, var(--anatomy-shade-2)); stroke: none; }
.ac-cap .iso-top, .ac-cap .iso-shade { fill: color-mix(in oklab, var(--ac-cap) 75%, var(--anatomy-shade-1)); stroke: none; }
.ac-tape .iso-top, .ac-tape .iso-shade { fill: var(--ac-tape); stroke: none; }
.ac-stripes .iso-line { stroke: color-mix(in oklab, var(--ac-stripe-0), var(--ac-stripe-1) calc(var(--tape, 0) * 100%)); stroke-width: 1.1px; }

/* Bình xả nhựa trong mờ */
.ac-bottle .iso-fill { fill: var(--ac-bottle); fill-opacity: 0.18; }
.ac-bottle .iso-top, .ac-bottle .iso-shade { fill: var(--ac-bottle); fill-opacity: 0.3; stroke: none; }
.ac-bottle-lid .iso-top, .ac-bottle-lid .iso-shade { fill: color-mix(in oklab, var(--ac-bottle) 55%, var(--anatomy-shade-1)); stroke: none; }
.ac-bwater .iso-top { fill-opacity: 0.35; }

/* Hơi nước trong buồng và ở lưới thoát hơi */
.ac-wisp { fill: var(--ac-steam); opacity: 0; filter: blur(3px); }
.ac-machine[data-boil] .ac-wisp { animation: ac-rise 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * -0.52s); }
@keyframes ac-rise { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: calc(var(--steam, 0) * 0.32); } 100% { opacity: 0; transform: translateY(-34px); } }
.ac-bubble { fill: var(--ac-steam); opacity: 0; }
.ac-machine[data-exhaust] .ac-bubble { animation: ac-bubble 1.1s linear infinite; animation-delay: calc(var(--i) * -0.18s); }
@keyframes ac-bubble { 0% { opacity: 0.9; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-8px); } }
.ac-puff { fill: var(--ac-steam); opacity: 0; filter: blur(1.5px); }
.ac-machine[data-exhaust] .ac-puff { animation: ac-puff 1.8s ease-out infinite; animation-delay: calc(var(--i) * -0.36s); }
@keyframes ac-puff { 0% { opacity: 0.55; transform: translate(0, 0) scale(0.6); } 100% { opacity: 0; transform: translate(10px, -22px) scale(1.6); } }
@media (prefers-reduced-motion: reduce) {
  .ac-machine[data-boil] .ac-wisp, .ac-machine[data-exhaust] .ac-bubble, .ac-machine[data-exhaust] .ac-puff { animation: none; }
  .ac-machine[data-boil] .ac-wisp { opacity: calc(var(--steam, 0) * 0.2); }
}

/* Khoá liên động: chốt ở móc phải sáng cam khi khoá */
.ac-bolt .iso-top, .ac-bolt .iso-shade { fill: var(--anatomy-shade-1); stroke: none; transition: fill 0.25s var(--anatomy-ease); }
.ac-machine[data-locked] .ac-bolt .iso-top, .ac-machine[data-locked] .ac-bolt .iso-shade { fill: var(--ac-lock); }

/* Bảng điều khiển trên nắp */
.ac-panel { fill: var(--ac-panel); }
.ac-lcd { fill: var(--ac-lcd); }
.ac-digits, .ac-unit { font-family: var(--anatomy-mono); fill: var(--ac-lcd-ink); }
.ac-unit { opacity: 0.75; }
.ac-keytext { font-family: var(--anatomy-mono); fill: var(--anatomy-muted); }
.ac-key { fill: var(--anatomy-shade-1); stroke: var(--anatomy-lo); stroke-width: 0.4px; vector-effect: non-scaling-stroke; }
.ac-start { fill: color-mix(in oklab, var(--anatomy-shade-1), var(--ac-lamp-on) 30%); }
.iso .ac-lamp, .iso .ac-stage { fill: var(--ac-lamp-off); transition: fill 0.2s var(--anatomy-ease); }
.iso .ac-lamp[data-on], .iso .ac-stage[data-on] { fill: var(--ac-lamp-on); }
.iso .ac-lamp[data-lamp="lid"][data-on] { fill: var(--ac-red); }

/* Đồng hồ áp suất */
.ac-dial { fill: var(--ac-dial); }
.ac-dialtext { font-family: var(--anatomy-mono); fill: var(--ac-dial-ink); }
.ac-red { fill: none; stroke: var(--ac-red); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
.iso .ac-needle { stroke: var(--ac-red); stroke-width: 1.2px; }
.ac-hub { fill: var(--ac-dial-ink); }
.ac-gauge-ring { fill: none; }

.ac-slot { fill: var(--anatomy-shade-0); }
.ac-void { fill: var(--ac-void); }
.ac-blade { fill: var(--anatomy-shade-2); }
.ac-hub2 { fill: var(--anatomy-top); }
.ac-gasket .iso-top, .ac-gasket .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-0), var(--ac-void) 45%); stroke: none; }

.ac-stage { touch-action: pan-y; cursor: pointer; }
.ac-stage:focus { outline: none; }

g><span class="ac-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Kim đồng hồ áp suất: áp suất dư của hơi bão hoà trong buồng</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Băng chỉ thị: vạch chéo sẫm lại sau khi gặp hơi nước 121 °C</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Nước đáy buồng: điện trở đun sôi, hơi đẩy khí ra van xả rồi xuống bình xả</span></span><span class="iso-caption">Nồi hấp vẽ theo Tomy SX-500 (41 × 47,7 × 97 cm, buồng φ325 × 733 mm, 58 L, điện trở 2 kW, khoảng 3 L nước), hông phải tháo tấm che và buồng cắt dọc. Điện trở đun nước dưới đáy; hơi nước đẩy khí ra qua van xả mở xuống bình xả có nước, máy giữ 100 °C một lúc cho hết khí rồi đóng van. Hơi bão hoà ở 121 °C có áp suất tuyệt đối khoảng 204 kPa, đồng hồ chỉ 0,103 MPa. Bào tử Geobacillus stearothermophilus có D121 ≈ 2,0 phút và z = 10 °C, nên 20 phút ở 121 °C giảm khoảng 10 log; giá trị F0 cộng dồn theo nhiệt độ của dịch trong bình, vốn nóng chậm hơn buồng. Hết giờ, van mở xả áp, quạt làm nguội buồng; khoá liên động chỉ nhả nắp khi áp suất về 0 và buồng còn dưới 80 °C (máy cho chỉnh 60–100 °C). Khí còn sót làm buồng nguội hơn ở cùng áp suất (định luật Dalton, minh hoạ). Bên trong (điện trở, van, đường ống) vẽ theo cấu tạo điển hình và sơ đồ đường ống trong manual, không theo bản vẽ của hãng.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

const SHADES = 4;

          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],

      `<path class="ac-lcd" d="${rr(-24, 22, -QH + 2, QH - 2, 1.2, 3)}"/>`,
      `<path class="iso-line" data-tone="mid" d="${rr(-24, 22, -QH + 2, QH - 2, 1.2, 3)}"/>`,
      `<text class="ac-digits" data-part="disp-temp" x="12" y="-2.6" font-size="7.6" text-anchor="end">121</text>`,
      `<text class="ac-unit" x="14" y="-2.6" font-size="3">°C</text>`,
      `<text class="ac-digits" data-part="disp-time" x="12" y="7.6" font-size="7.6" text-anchor="end">0:20</text>`,
      `<text class="ac-unit" x="14" y="7.6" font-size="3">h:m</text>`,
      `<text class="ac-unit" data-part="disp-mpa" x="-21" y="-6.4" font-size="3">0,00 MPa</text>`,

      ...STAGES.map(([name, u, w]) => `<path class="ac-stage" data-lamp="${name}" d="${rr(u - 4, u + 4, w - 0.9, w + 0.9, 0.9, 2)}"/>`),
      `<path class="iso-line" data-tone="faint" d="${rr(-70, -34, -QH + 2, QH - 2, 1.4, 3)}"/>`,
      ...keys.map(([u, w]) => `<path class="ac-key" d="${rr(u - 2.8, u + 2.8, w - 2.4, w + 2.4, 0.8, 2)}"/>`),
      `<path class="ac-start" data-part="start" d="${rr(46, 66, -9.4, -1.6, 2.4, 3)}"/>`,
      `<path class="iso-line" data-tone="lo" d="${rr(46, 66, -9.4, -1.6, 2.4, 3)}"/>`,
      `<path class="ac-key" d="${rr(46, 66, 1.6, 9.4, 2.4, 3)}"/>`,
      `<text class="ac-keytext" x="56" y="-4.4" font-size="2.6" text-anchor="middle">START</text>`,
      `<text class="ac-keytext" x="56" y="6.6" font-size="2.6" text-anchor="middle">STOP</text>`,

  }

  function svg(theta) {
    const F = frameAt(theta);
    const prism = (poly, x0, x1) => G.prismOf(F, poly, x0, x1, P);
    const AX = G.frameOf(H, [1, 0, 0], [0, 1, 0], [0, 0, 1]);
    const knuckles = D.knuckles.map(([x0, x1]) => S(G.disc(x0, x1, D.knuckleR, AX, P, { steps: 28 }), { tone: "mid" })).join("");
    const arms = D.knuckles.map(([x0, x1]) => S(prism(ARM, x0, x1), { tone: "mid" })).join("");
    const DF = discFrame(F);
    const disc = S(G.disc(0, D.disc.t, D.disc.r, DF, P, { bevel: 0.6 }), { tone: "hi", inner: underVisible(theta) ? Ln(G.circleOf(DF, D.disc.t, D.disc.r - 10, P), { tone: "faint" }) : "" });
    const gasket = S(G.ringBand(D.disc.t, D.disc.t + D.gasket.t, D.gasket.rIn, D.gasket.rOut, DF, P), { tone: "lo", className: "ac-gasket" });
    const bolt = underVisible(theta) ? S(G.disc(D.disc.t, D.disc.t + 1.6, 4, DF, P, { steps: 24 }), { tone: "mid" }) + k.dotsSvg(G.dotsOf(DF, D.disc.t, D.gasket.rIn - 7, 12, P, { all: true }), { size: 0.55, tone: "mid" }) : "";
    const seam = Ln(path3(F, [[half, D.rear, D.seam], [half, D.front, D.seam]]), { tone: "faint" });
    const shell = S(prism(SHELL, -half, half), { tone: "mid", inner: G.dot3([1, 0, 0], V) > 0 ? seam : "" });
    const handle = S(prism(HANDLE, -D.handle.x, D.handle.x), { tone: "hi" });
    const grip = topVisible(theta) ? Ln(path3(F, [[-D.handle.x + 6, D.front + D.handle.out, (D.handle.z[0] + D.handle.z[1]) / 2], [D.handle.x - 6, D.front + D.handle.out, (D.handle.z[0] + D.handle.z[1]) / 2]]), { tone: "lo", free: true }) : "";
    const vent = topVisible(theta) ? Ln(path3(F, roundPoly([[-30, 40, D.top], [30, 40, D.top], [30, 70, D.top], [-30, 70, D.top]], [6, 6, 6, 6], 4), true), { tone: "faint" }) + Ln(path3(F, roundPoly([[-22, 46, D.top], [22, 46, D.top], [22, 64, D.top], [-22, 64, D.top]], [4, 4, 4, 4], 4), true), { tone: "faint" }) : "";
    if (underVisible(theta)) return knuckles + arms + shell + handle + disc + gasket + bolt;
    return knuckles + arms + disc + gasket + shell + vent + (topVisible(theta) && theta < 0.6 ? panel(F) : "") + handle + grip;
  }

  function shapes(theta, A) {
    const F = frameAt(theta);
    const DF = discFrame(F);
    const meta = (name) => ({ name, owner: "lid" });
    const AX = G.frameOf(H, [1, 0, 0], [0, 1, 0], [0, 0, 1]);
    return [
      A.prism(F, SHELL, -half, half, meta("lid.shell")),
      A.prism(F, HANDLE, -D.handle.x, D.handle.x, meta("lid.handle")),
      A.disc(DF, 0, D.disc.t, D.disc.r, meta("lid.disc")),
      A.ring(DF, D.disc.t, D.disc.t + D.gasket.t, D.gasket.rIn, D.gasket.rOut, meta("lid.gasket")),
      ...D.knuckles.map(([x0, x1], i) => A.disc(AX, x0, x1, D.knuckleR, meta(`lid.knuckle${i}`))),
      ...D.knuckles.map(([x0, x1], i) => A.prism(F, ARM, x0, x1, meta(`lid.arm${i}`))),
    ];
  }

  // Góc mà vỏ nắp nằm dọc theo tia nhìn: dưới góc này nắp phủ lên thân, trên góc này thân phủ lên nắp.
  const flip = Math.atan2(V[2], V[1]);

  return { svg, shapes, underVisible, topVisible, flip, frameAt };
}
// Mô hình nồi hấp tiệt trùng (theo Tomy SX-500), dùng chung cho bản dựng (Node), trang (trình duyệt)
// và sau này cho lõi mô phỏng của app (src/core). Module thuần: không DOM, không Three.js.
//
// Nguồn số liệu:
// - Tomy SX-300/500/700 Operator's Manual, ID No. 21006.12, 01/2014
//   (https://groups.oist.jp/sites/default/files/imce/u430/TOMY_Autoclave.pdf):
//   buồng φ325 × 733 mm, 58 L (dùng được 50 L), thép SUS304; tiệt trùng 105–135 °C (0,019–0,212 MPa);
//   áp suất làm việc tối đa 0,25 MPa; đồng hồ áp 0–0,4 MPa; điện trở 2,0 kW; nước khoảng 3,0 L;
//   khoá nắp nhả ở 97 °C (mặc định của hãng, chỉnh 60–100 °C); hoàn tất khi buồng còn 60 °C;
//   chạy dịch lỏng lâu hơn: 2 L +4 phút, 5 L +8 phút, 10 L +15 phút (ở 121 °C 20 phút);
//   đồ đem hấp chỉ nên chiếm tối đa 50 % thể tích buồng; không hấp chai đậy kín.
// - Phương trình Antoine của nước (hằng số theo mmHg, °C; Dortmund Data Bank, chép trong
//   https://en.wikipedia.org/wiki/Antoine_equation): 1–100 °C A 8,07131 B 1730,63 C 233,426;
//   99–374 °C A 8,14019 B 1810,94 C 244,485. Kiểm lại: 121 °C → 204 kPa tuyệt đối (≈ 1,03 bar dư),
//   134 °C → 302 kPa; khớp bảng hơi bão hoà trong 0,5 %.
// - Bào tử Geobacillus stearothermophilus (chỉ thị sinh học cho hấp hơi nước, ISO 11138-3):
//   D121 ≥ 1,5 phút, thường 1,5–2,5 phút; z ≈ 10 °C. Mô hình dùng D121 = 2,0 phút, quần thể 10⁶ bào tử.
// - F0: số phút tương đương ở 121,1 °C với z = 10 °C (dược điển, Ph. Eur. 5.1.5).
// - Khí còn trong buồng (minh hoạ, theo bảng cổ điển của Perkins 1969, "Principles and Methods of
//   Sterilization in Health Sciences"): ở 1,03 bar dư, đuổi hết khí 121 °C, đuổi 2/3 khí 115 °C,
//   đuổi 1/2 khí 112 °C, không đuổi khí 100 °C. Mô hình định luật Dalton: khí còn lại giữ áp riêng
//   phần (tỉ lệ khí × 1 atm), hơi nước chỉ còn phần áp suất còn lại, nên nóng kém hơn ở cùng áp suất.
// Các số ước tính, chưa xác minh với hãng: khối thép buồng (~20 kg, thành 3 mm), hiệu suất gia nhiệt
// 85 %, thời gian đuổi khí ở 100 °C (5 phút), hằng số xả áp (2 phút) và hằng số nguội có quạt (30 phút).

const ATM = 101.325; // kPa

const SX500 = {
  chamber: { d: 325, depth: 733, volumeL: 58, effectiveL: 50 },
  heaterW: 2000,
  efficiency: 0.85,
  waterL: 3.0,
  steelKg: 20,
  setRange: [105, 135],
  maxGaugeMPa: 0.25,
  gaugeMaxMPa: 0.4,
  unlockC: 80, // khoá nắp nhả khi buồng ≤ 80 °C (máy cho chỉnh 60–100 °C, mặc định của hãng 97 °C)
  doneC: 60,
  room: 25,
  purgeMin: 5,
  exhaustTauMin: 2,
  coolTauMin: 30,
};

const SPORE = { name: "Geobacillus stearothermophilus", d121: 2.0, z: 10, n0: 1e6 };

/** Áp suất hơi nước bão hoà (kPa tuyệt đối) ở nhiệt độ T (°C), phương trình Antoine. */
function psat(T) {
  const [A, B, C] = T < 100 ? [8.07131, 1730.63, 233.426] : [8.14019, 1810.94, 244.485];
  return 10 ** (A - B / (C + T)) * 0.133322;
}

/** Nhiệt độ sôi (°C) của nước ở áp suất tuyệt đối P (kPa): nghịch đảo của psat. */
function tsat(P) {
  const mmHg = Math.max(1e-6, P) / 0.133322;
  const hi = 1810.94 / (8.14019 - Math.log10(mmHg)) - 244.485;
  if (hi >= 100) return hi;
  return 1730.63 / (8.07131 - Math.log10(mmHg)) - 233.426;
}

/** Áp suất dư (MPa) mà đồng hồ chỉ, từ áp suất tuyệt đối (kPa). */
const gaugeMPa = (P) => Math.max(0, (P - ATM) / 1000);

/**
 * Nhiệt độ thật trong buồng khi còn khí (minh hoạ, Dalton): ở áp suất tuyệt đối P (kPa), phần khí
 * còn lại `air` (0–1, so với lượng khí ban đầu ở 1 atm, nhiệt độ phòng) giữ áp riêng phần air × airKPa(room).
 * air = 0 → hơi bão hoà tinh khiết; air = 1 → gần 100 °C dù đồng hồ chỉ 0,1 MPa.
 */
function tempWithAir(P, air, room = 25) {
  return tsat(Math.max(1, P - air * airKPa(room)));
}

/** Áp riêng phần (kPa) của lượng khí ban đầu trong buồng: 1 atm trừ hơi nước ở nhiệt độ phòng. */
const airKPa = (room = 25) => ATM - psat(room);

/** Giá trị D (phút) của bào tử ở nhiệt độ T: D(T) = D121 · 10^((121 − T)/z). */
function dValue(T, spore = SPORE) {
  return spore.d121 * 10 ** ((121 - T) / spore.z);
}

/** Tốc độ chết (log/phút) ở nhiệt độ T: 1/D(T). Dưới 100 °C coi như bằng 0. */
function killRate(T, spore = SPORE) {
  return T < 100 ? 0 : 1 / dValue(T, spore);
}

/** Tốc độ gây chết tương đương F0 (phút ở 121,1 °C mỗi phút) ở nhiệt độ T, z = 10 °C. */
function lethality(T) {
  return T < 100 ? 0 : 10 ** ((T - 121.1) / 10);
}

/** Số phút cần kéo dài khi hấp dịch lỏng (bảng của hãng: 2 L +4, 5 L +8, 10 L +15), nội suy tuyến tính. */
function liquidExtraMin(L) {
  const pts = [[0, 0], [2, 4], [5, 8], [10, 15]];
  if (L >= 10) return 15 + (L - 10) * 1.4;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    if (L <= x1) return y0 + ((L - x0) * (y1 - y0)) / (x1 - x0);
  }
  return 15;
}

/**
 * Chai đậy kín (minh hoạ, vì sao hãng cấm): khí trong chai nóng lên ở thể tích không đổi cộng hơi nước bão hoà.
 * Trả về áp suất trong chai (kPa tuyệt đối) và chênh lệch với buồng (kPa) khi buồng ở áp suất chamberP.
 */
function sealedBottle(T, chamberP, fillC = 25) {
  const air = (ATM - psat(fillC)) * ((T + 273.15) / (fillC + 273.15));
  const inside = air + psat(T);
  return { inside, diff: inside - chamberP };
}

/**
 * Mô phỏng một chu trình theo các pha của máy (manual mục 2-1): gia nhiệt (van xả mở, hơi đuổi khí),
 * giữ 100 °C đuổi khí, đóng van tăng nhiệt tăng áp, tiệt trùng, xả áp, hạ nhiệt (quạt), nhả khoá nắp, hoàn tất 60 °C.
 * opts: { temp (°C), holdMin, loadL (lít dịch), load (phần thể tích buồng bị chiếm, 0–1), purge (false = không đuổi khí),
 *         sealed (chai đậy kín), unlockC, step (s) }.
 * Trả về { samples, phases, total, opts }; mỗi mẫu: { t, phase, T, Tload, P, gauge, air, valve, heater, fan,
 *         locked, log, f0, tape, unlock, done }.
 */
function simulate(opts = {}, m = SX500, spore = SPORE) {
  const o = {
    temp: Math.min(m.setRange[1], Math.max(m.setRange[0], Number(opts.temp ?? 121))),
    holdMin: Math.min(120, Math.max(0, Number(opts.holdMin ?? 20))),
    loadL: Math.max(0, Number(opts.loadL ?? 1.5)),
    load: Math.min(1, Math.max(0, Number(opts.load ?? 0.3))),
    purge: opts.purge !== false,
    sealed: Boolean(opts.sealed),
    unlockC: Math.min(100, Math.max(60, Number(opts.unlockC ?? m.unlockC))),
    step: opts.step ?? 2,
  };
  // Nhiệt dung toàn khối (kJ/K): nước trong buồng, thép buồng, dịch và thuỷ tinh của mẻ hấp.
  const C = m.waterL * 4.186 + m.steelKg * 0.5 + o.loadL * 4.186 + o.loadL * 0.6 * 0.84;
  const rate = ((m.heaterW / 1000) * m.efficiency) / C; // K/s
  // Dịch trong bình theo sau nhiệt độ buồng với hằng số thời gian khớp bảng kéo dài của hãng.
  const tauLoad = Math.max(10, (liquidExtraMin(o.loadL) * 60) / 3);
  // Đuổi khí: hơi sinh ra (kg/s) thay thể tích buồng; xếp quá 50 % buồng thì khí khó thoát hơn.
  const steamKgS = ((m.heaterW / 1000) * m.efficiency) / 2257;
  const chamberSteamKg = (m.chamber.volumeL / 1000) * 0.598 * (1 - o.load * 0.5);
  const tauPurge = (chamberSteamKg / steamKgS) * (1 + 4 * Math.max(0, o.load - 0.5));
  const Pset = psat(o.temp);
  const dt = o.step;

  let t = 0;
  let phase = "heat";
  let phaseAt = 0;
  let T = m.room;
  let Tload = m.room;
  let P = ATM;
  let air = 1;
  let log = 0;
  let f0 = 0;
  let tape = 0;
  let exhaustFrom = Pset;
  let coolFrom = 100;
  let unlockAt = null;
  const samples = [];
  const phases = [{ phase, t: 0 }];
  const go = (next) => {
    phase = next;
    phaseAt = t;
    phases.push({ phase, t });
  };
  const push = () => {
    const locked = phase !== "done" && (unlockAt === null || t < unlockAt);
    samples.push({
      t,
      phase,
      T,
      Tload,
      P,
      gauge: gaugeMPa(P),
      air,
      valve: phase === "heat" || phase === "purge" ? 1 : phase === "exhaust" ? 0.8 : phase === "cool" || phase === "done" ? 1 : 0,
      heater: phase === "heat" || phase === "purge" || phase === "pressurize" ? 1 : phase === "hold" ? 0.35 : 0,
      fan: phase === "exhaust" || phase === "cool" ? 1 : 0,
      locked,
      log,
      f0,
      tape: 1 - Math.exp(-tape / 3),
      unlock: unlockAt !== null && t >= unlockAt,
      done: phase === "done",
    });
  };
  push();
  for (let guard = 0; guard < 40000 && phase !== "done"; guard++) {
    t += dt;
    const age = t - phaseAt;
    if (phase === "heat") {
      T = Math.min(100, T + rate * dt);
      if (o.purge) {
        // Van xả mở: hơi sinh ra từ khoảng 90 °C đẩy khí ra bình xả.
        air *= Math.exp((-dt / tauPurge) * Math.min(1, Math.max(0, (T - 90) / 10)));
        P = ATM;
        if (T >= 100) go("purge");
      } else {
        // Không đuổi khí (minh hoạ): van đóng từ đầu, khí giữ nguyên áp riêng phần.
        P = Math.max(ATM, psat(T) + air * airKPa(m.room));
        if (P >= Pset) { P = Pset; T = tempWithAir(P, air, m.room); go("hold"); }
        else if (T >= 100) go("pressurize");
      }
    } else if (phase === "purge") {
      air *= Math.exp(-dt / tauPurge);
      if (age >= m.purgeMin * 60) go("pressurize");
    } else if (phase === "pressurize") {
      // Van đóng: năng lượng làm nước nóng thêm; áp suất = hơi bão hoà + khí còn lại.
      T = Math.min(o.temp + 20, T + rate * dt);
      P = Math.max(ATM, psat(T) + air * airKPa(m.room));
      if (P >= Pset) P = Pset;
      T = tempWithAir(P, air, m.room);
      if (P >= Pset) go("hold");
    } else if (phase === "hold") {
      P = Pset;
      T = tempWithAir(P, air, m.room);
      if (age >= o.holdMin * 60) {
        exhaustFrom = P;
        go("exhaust");
      }
    } else if (phase === "exhaust") {
      P = ATM + (exhaustFrom - ATM) * Math.exp(-age / (m.exhaustTauMin * 60));
      air *= Math.exp(-dt / 30); // khí còn lại theo hơi ra ngoài
      T = Math.min(T, tempWithAir(P, air, m.room));
      if (gaugeMPa(P) < 0.0005) {
        P = ATM;
        coolFrom = T;
        go("cool");
      }
    } else if (phase === "cool") {
      P = ATM;
      T = m.room + (coolFrom - m.room) * Math.exp(-age / (m.coolTauMin * 60));
      if (unlockAt === null && T <= o.unlockC) unlockAt = t;
      if (T <= m.doneC) go("done");
    }
    Tload += (T - Tload) * (1 - Math.exp(-dt / tauLoad));
    log += (killRate(Tload, spore) * dt) / 60;
    f0 += (lethality(Tload) * dt) / 60;
    if (air < 0.5 && T > 100) tape += (10 ** ((T - 121) / 10) * dt) / 60;
    push();
  }
  return { samples, phases, total: t, opts: o, unlockAt: unlockAt ?? t, holdAt: phases.find((p) => p.phase === "hold")?.t ?? 0 };
}

/** Trạng thái ở giây t (nội suy tuyến tính giữa hai mẫu). */
function stateAt(sim, t) {
  const s = sim.samples;
  if (t <= 0) return s[0];
  if (t >= sim.total) return s[s.length - 1];
  const i = Math.min(s.length - 2, Math.floor(t / sim.opts.step));
  const a = s[i];
  const b = s[i + 1];
  const k = (t - a.t) / (b.t - a.t);
  const mix = (key) => a[key] + (b[key] - a[key]) * k;
  return { ...a, T: mix("T"), Tload: mix("Tload"), P: mix("P"), gauge: mix("gauge"), air: mix("air"), log: mix("log"), f0: mix("f0"), tape: mix("tape"), t };
}

/** Bào tử còn sống trên một chỉ thị sinh học 10⁶ sau số log đã giảm. */
const survivors = (log, spore = SPORE) => spore.n0 * 10 ** -log;

/** Tên pha hiển thị (tiếng Việt, theo đèn "work monitor" trên bảng điều khiển). */
const PHASE_NAME = {
  ready: "Sẵn sàng",
  heat: "Gia nhiệt · đuổi khí",
  purge: "Giữ 100 °C · đuổi khí",
  pressurize: "Tăng nhiệt, tăng áp",
  hold: "Tiệt trùng",
  exhaust: "Xả áp",
  cool: "Hạ nhiệt",
  done: "Hoàn tất",
};

const fmtClock = (s) => {
  const m = Math.floor(Math.max(0, s) / 60);
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
};
// Phần chạy trong trang: nắp bản lề có khoá liên động, chu trình hấp theo mô hình, đồng hồ áp suất,
// bảng điều khiển trên nắp, nước nóng, hơi nước, xả khí xuống bình xả, quạt làm nguội, băng chỉ thị, vòng giới thiệu.
const D = {"P":{"origin":[308.7910059417159,677.1892645273986],"scale":0.8017772938393248,"azimuth":38,"elevation":30},"lid":{"H":[0,-106,449],"rear":6,"front":222,"top":37,"chamfer":[[222,23],[189,37]],"seam":9,"half":96,"handle":{"x":70,"out":4.4,"z":[5,15]},"disc":{"y":98,"r":90,"t":3},"gasket":{"rIn":81,"rOut":88,"t":2},"knuckles":[[-96,-84],[84,96]],"knuckleR":3.5},"lidOpen":1.3264502315156903,"flip":0.7532961786260434,"dial":{"max":0.4,"red":0.25,"sweep":270}};
const P = D.P;
const LIDM = makeLid({ iso, pathOf, solidSvg, lineSvg, dotsSvg, roundedPlan }, G, P, D.lid);
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const $ = (sel) => svgEl.querySelector(sel);
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

// Chương trình do app truyền qua địa chỉ (…autoclave.html#run=<JSON>):
// { temp: 121, holdMin: 20, loadL: 1.5, purge: true, sealed: false, name: "…" }
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
const SIM = simulate(RUN ?? {});
const O = SIM.opts;

const el = {
  machine: $('[data-part="machine"]'),
  closed: $('[data-slot="closed"]'),
  open: $('[data-slot="open"]'),
  needle: $('[data-part="needle"]'),
  blades: $('[data-part="blades"]'),
};

const SPEEDS = [30, 60, 120, 240, 480];
const TOUR_SPEED = 3;
const LID_OPEN = D.lidOpen;
const state = {
  lid: { x: LID_OPEN, v: 0, target: LID_OPEN },
  started: false, // đã bấm chạy (khoá liên động có hiệu lực)
  run: false,
  t: 0,
  speed: 2,
  fan: 0,
  arm: false,
};
let lidDrawn = null;
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches;
let tour = { step: "wait", wait: 1.6 };
let idleTimer = 0;
let lastPhase = "";

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const dec = (v, d = 1) => v.toFixed(d).replace(".", ",");
const now = () => (state.started ? stateAt(SIM, state.t) : null);
const locked = () => { const s = now(); return Boolean(s && s.locked); };

function drawLid() {
  const th = state.lid.x;
  const key = th.toFixed(4);
  if (key === lidDrawn) return false;
  lidDrawn = key;
  const markup = LIDM.svg(th);
  if (th > D.flip) { el.open.innerHTML = markup; el.closed.innerHTML = ""; }
  else { el.closed.innerHTML = markup; el.open.innerHTML = ""; }
  return true;
}
function stepLid(dt, calm) {
  const L = state.lid;
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const w = 1 / 0.34;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.min(LID_OPEN, Math.max(0, L.x));
  // Gioăng ép: nắp về sát miệng buồng thì móc khoá kéo đóng hẳn
  if (L.target === 0 && L.x < 0.03) { L.x = 0; L.v = 0; return false; }
  if (Math.abs(L.target - L.x) < 1e-4 && Math.abs(L.v) < 1e-4) { L.x = L.target; L.v = 0; return false; }
  return true;
}
const lidClosed = () => state.lid.x === 0 && state.lid.target === 0;
const lidOpen = () => state.lid.x > LID_OPEN - 1e-3;

const dialAngle = (mpa) => -D.dial.sweep / 2 + (D.dial.sweep * Math.min(D.dial.max, Math.max(0, mpa))) / D.dial.max;
function lamp(name, on) {
  for (const node of svgEl.querySelectorAll(`[data-lamp="${name}"]`)) node.toggleAttribute("data-on", on);
}
function text(part, value) {
  const node = svgEl.querySelector(`[data-part="${part}"]`);
  if (node && node.textContent !== value) node.textContent = value;
}

function draw(dt, calm) {
  drawLid();
  const s = now();
  const T = s ? s.T : SX500.room;
  const gauge = s ? s.gauge : 0;
  const phase = s ? s.phase : "ready";
  const m = el.machine;
  m.style.setProperty("--heat", Math.min(1, Math.max(0, (T - SX500.room) / 96)).toFixed(3));
  const steam = s ? Math.min(1, Math.max(0, (T - 90) / 10)) * (1 - s.air * 0.6) : 0;
  m.style.setProperty("--steam", steam.toFixed(3));
  m.style.setProperty("--glow", (s && state.run ? s.heater : 0).toFixed(2));
  m.style.setProperty("--tape", (s ? s.tape : 0).toFixed(3));
  m.toggleAttribute("data-locked", locked());
  m.toggleAttribute("data-boil", Boolean(s && T > 96 && (state.run || phase === "exhaust")));
  m.toggleAttribute("data-exhaust", Boolean(s && state.run && (phase === "exhaust" || (s.valve > 0.5 && T > 97 && phase !== "cool" && phase !== "done"))));
  el.needle.setAttribute("transform", `rotate(${dialAngle(gauge).toFixed(2)})`);
  // Quạt làm nguội chạy khi xả áp và hạ nhiệt
  if (!calm && s && state.run && s.fan) {
    state.fan = (state.fan + dt * 14) % (Math.PI * 2);
    el.blades.setAttribute("transform", `rotate(${((state.fan * 180) / Math.PI).toFixed(1)})`);
  }
  // Bảng điều khiển trên nắp (dựng lại cùng nắp, nên ghi lại mỗi khung)
  text("disp-temp", s ? String(Math.round(T)) : String(O.temp));
  const left = s && phase === "hold" ? O.holdMin * 60 - (state.t - SIM.holdAt) : O.holdMin * 60;
  text("disp-time", fmtClock(Math.max(0, left) + (phase === "hold" ? 59 : 0)));
  text("disp-mpa", `${dec(gauge, 2)} MPa`);
  lamp("lid", !lidClosed());
  lamp("bottle", false);
  lamp("water", false);
  lamp("heat", phase === "heat" || phase === "purge" || phase === "pressurize");
  lamp("hold", phase === "hold");
  lamp("exhaust", phase === "exhaust" || phase === "cool");
  lamp("done", Boolean(s && (s.unlock || phase === "done")) && (calm || phase === "done" || Math.floor(performance.now() / 500) % 2 === 0));
  drawReadout(s);
}

function drawReadout(s) {
  const who = RUN?.name ? ` · ${String(RUN.name).slice(0, 24)}` : "";
  let line;
  if (!s) {
    line = lidOpen() ? `nắp mở · ${O.temp} °C ${O.holdMin} phút` : state.lid.target === 0 ? `nắp đóng · ${O.temp} °C ${O.holdMin} phút` : "đang đóng/mở nắp";
  } else {
    const name = PHASE_NAME[s.phase].toLowerCase();
    const log = s.log >= 0.05 ? ` · −${dec(s.log)} log` : "";
    const air = !O.purge && s.air > 0.3 ? " · còn khí" : "";
    let warn = "";
    if (O.sealed && (s.phase === "exhaust" || s.phase === "cool")) warn = ` · chai kín chênh ${dec(sealedBottle(s.Tload, s.P).diff / 100)} bar`;
    const lock = s.locked ? "" : " · nhả khoá";
    line = `${name} · ${dec(s.T)} °C · ${dec(s.gauge, 3)} MPa${log}${air}${warn}${lock}${who}`;
  }
  if (readout.textContent !== line) readout.textContent = line;
  const phase = s ? s.phase : "";
  if (phase && phase !== lastPhase) {
    lastPhase = phase;
    const extra = phase === "hold" ? ` ${O.temp} °C, ${O.holdMin} phút.` : phase === "cool" ? " Áp suất về 0, quạt làm nguội." : phase === "done" ? " Buồng còn 60 °C." : ".";
    say(`${PHASE_NAME[phase]}${extra}`);
  }
}

function start() {
  if (state.started && !state.run && state.t < SIM.total) { state.run = true; say("Chạy tiếp."); return; }
  if (!lidClosed()) { state.lid.target = 0; state.arm = true; say("Đóng nắp trước khi chạy."); return; }
  state.started = true;
  state.run = true;
  state.t = 0;
  lastPhase = "";
}
function pause() { if (state.run) { state.run = false; say("Tạm dừng (máy thật sẽ chuyển sang xả áp)."); } }
function reset() {
  if (locked()) { say("Nắp đang khoá: chờ áp suất về 0 và buồng nguội."); return false; }
  state.started = false; state.run = false; state.t = 0; lastPhase = ""; return true;
}
function toggleLid() {
  if (state.lid.target === 0 && locked()) {
    const s = now();
    say(s.gauge > 0.0005 ? `Nắp đang khoá: còn ${dec(s.gauge, 3)} MPa.` : `Nắp đang khoá: buồng ${dec(s.T)} °C, chờ dưới ${O.unlockC} °C.`);
    return;
  }
  if (state.lid.target === 0 && state.started) { state.started = false; state.run = false; state.t = 0; }
  state.lid.target = state.lid.target > 0 ? 0 : LID_OPEN;
  state.arm = false;
  say(state.lid.target > 0 ? "Mở nắp." : "Đóng nắp.");
}

function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "wait") { state.lid.target = 0; tour = { step: "closing", wait: 0.3 }; }
  else if (tour.step === "closing") { if (lidClosed()) { state.speed = TOUR_SPEED; start(); tour = { step: "running", wait: 0 }; } }
  else if (tour.step === "running") { if (state.t >= SIM.total) tour = { step: "hold", wait: 2.4 }; }
  else if (tour.step === "hold") { reset(); state.lid.target = LID_OPEN; tour = { step: "rest", wait: 2.6 }; }
  else if (tour.step === "rest") tour = { step: "wait", wait: 0.2 };
}

function tick(t) {
  const dt = previous ? Math.min((t - previous) / 1000, 1 / 30) : 1 / 60;
  previous = t;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  const moving = stepLid(dt, calm);
  if (state.arm && lidClosed()) { state.arm = false; start(); }
  if (state.run) {
    state.t += dt * SPEEDS[state.speed];
    if (state.t >= SIM.total) { state.t = SIM.total; state.run = false; say("Hoàn tất: buồng còn 60 °C, mở nắp được."); }
  }
  draw(dt, calm);
  const busy = !calm || moving;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 1.6 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || state.run) return; touring = true; tour = { step: "wait", wait: 0.6 }; loop(); }, 9000);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (key === " " || key === "Enter" || key === "Escape" || key.startsWith("Arrow")) event.preventDefault();
  else return;
  takeOver();
  if (key === " ") {
    if (still.matches && state.started) {
      // Giảm chuyển động: mỗi lần bấm nhảy sang đầu pha kế tiếp
      const next = SIM.phases.find((p) => p.t > state.t + 1);
      state.t = next ? next.t + 1 : SIM.total;
      state.run = false;
    } else if (state.run) pause();
    else start();
  } else if (key === "Enter") toggleLid();
  else if (key === "Escape") { if (reset()) say("Dừng và đặt lại."); }
  else if (key === "ArrowRight" || key === "ArrowUp") state.speed = Math.min(SPEEDS.length - 1, state.speed + 1);
  else if (key === "ArrowLeft" || key === "ArrowDown") state.speed = Math.max(0, state.speed - 1);
  if (still.matches) { stepLid(0, true); if (state.arm && lidClosed()) { state.arm = false; start(); state.run = false; } draw(0, true); }
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest("[data-slot]")) toggleLid();
  else if (state.run) pause();
  else start();
  stage.focus({ preventScroll: true });
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) {
  // Giảm chuyển động: một khung tiêu biểu (nắp đóng và khoá, giữa pha tiệt trùng).
  state.lid = { x: 0, v: 0, target: 0 };
  state.started = true;
  state.run = false;
  state.t = SIM.holdAt + Math.min(10, O.holdMin / 2) * 60;
}
draw(1 / 60, still.matches);
</script></body></html>
