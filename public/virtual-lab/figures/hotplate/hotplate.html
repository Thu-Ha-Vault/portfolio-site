<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Máy khuấy từ gia nhiệt</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>/* Màu riêng của hình máy khuấy từ gia nhiệt: mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt trên .hp-stage: --heat (0–1, nước nóng), --glow (0–1, điện trở đỏ), --plate (0–1, mặt đế nóng), --steam (0–1). */
.iso {
  --hp-glass: #9cc3d4;
  --hp-liquid: #4f9fd8;
  --hp-liquid-top: #8cc8f0;
  --hp-warm: #ff9a4d;
  --hp-funnel: #0d2233;
  --hp-hot: #ff5a2e;
  --hp-coil: #a07a5c;
  --hp-fibre-mix: 34%;
  --hp-groove: #0f1214;
  --hp-steam: #c9d6de;
  --hp-lcd: #0b1418;
  --hp-lcd-ink: #9ce8ff;
  --hp-lcd-dim: #2b3a40;
  --hp-warn: #ffb23e;
  --hp-pointer: #ffffff;
  --hp-dark: #0b0d0f;
  --hp-dark-mix: 58%;
  --hp-dark-line: #59616a;
  --hp-dark-faint: #2c3238;
  --hp-pcb: #1d4a2e;
  --hp-mag-n: #d9564a;
  --hp-mag-s: #4a78d9;
  --hp-ceramic: #e8ecef;
  --hp-ceramic-mix: 16%;
}
.iso[data-theme="light"] {
  --hp-glass: #b4cfdb;
  --hp-liquid: #3b8fd0;
  --hp-liquid-top: #9fd0f2;
  --hp-warm: #ef7d2a;
  --hp-funnel: #16486e;
  --hp-hot: #e8481c;
  --hp-coil: #9a7458;
  --hp-fibre-mix: 70%;
  --hp-groove: #3a4046;
  --hp-steam: #8fa3ae;
  --hp-lcd: #142026;
  --hp-lcd-ink: #9ce8ff;
  --hp-lcd-dim: #33454d;
  --hp-warn: #ffb23e;
  --hp-pointer: #111111;
  --hp-dark: #4c535a;
  --hp-dark-mix: 55%;
  --hp-dark-line: #2f3439;
  --hp-dark-faint: #4a5056;
  --hp-pcb: #2f6b45;
  --hp-mag-n: #c8463a;
  --hp-mag-s: #3a68c8;
  --hp-ceramic: #ffffff;
  --hp-ceramic-mix: 60%;
}

/* Thuỷ tinh trong suốt của cốc */
.hp-glass .iso-fill { fill: var(--hp-glass); fill-opacity: 0.12; }
.hp-glass .iso-top, .hp-glass .iso-shade { fill: var(--hp-glass); fill-opacity: 0.16; stroke: none; }
.hp-glass .iso-solid[data-seamless] > .iso-shade[data-shade], .hp-glass .iso-solid[data-seamless] > .iso-top { stroke: none; }

/* Nước: trong mờ, ngả ấm theo nhiệt độ */
.hp-liquid { fill: color-mix(in oklab, var(--hp-liquid), var(--hp-warm) calc(var(--heat, 0) * 24%)); fill-opacity: 0.4; }
.hp-liquid-top { fill: color-mix(in oklab, var(--hp-liquid-top), var(--hp-warm) calc(var(--heat, 0) * 22%)); fill-opacity: 0.7; stroke: var(--hp-liquid); stroke-width: 0.3px; vector-effect: non-scaling-stroke; }
.hp-funnel { fill: var(--hp-funnel); fill-opacity: 0.55; }
.hp-cavity { fill: var(--hp-liquid-top); fill-opacity: 0.45; }
.hp-funnel-line { fill: none; stroke: var(--hp-liquid); stroke-width: 0.4px; vector-effect: non-scaling-stroke; }
.hp-streak { fill: none; stroke: var(--hp-liquid-top); stroke-width: 0.6px; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.hp-bubbles circle { fill: var(--hp-liquid-top); fill-opacity: 0.55; stroke: var(--hp-liquid); stroke-width: 0.3px; vector-effect: non-scaling-stroke; }

/* Mặt đế ceramic trắng, ửng đỏ khi nóng */
.hp-plate .iso-top, .hp-fibre .iso-top { fill: color-mix(in oklab, color-mix(in oklab, var(--hp-ceramic) var(--hp-ceramic-mix), var(--anatomy-top)), var(--hp-hot) calc(var(--plate, 0) * 22%)); }
.hp-plate .iso-shade, .hp-fibre .iso-shade { fill: color-mix(in oklab, color-mix(in oklab, var(--hp-ceramic) var(--hp-ceramic-mix), var(--anatomy-shade-2)), var(--hp-hot) calc(var(--plate, 0) * 30%)); stroke: none; }
.hp-fibre .iso-top { fill: color-mix(in oklab, var(--hp-ceramic) var(--hp-fibre-mix), var(--anatomy-top)); }
.hp-fibre .iso-shade { fill: color-mix(in oklab, var(--hp-ceramic) var(--hp-fibre-mix), var(--anatomy-shade-2)); stroke: none; }

/* Tấm cách nhiệt sợi gốm, rãnh và dây điện trở xoắn: đỏ lên theo công suất */
.hp-groove { fill: var(--hp-groove); fill-opacity: 0.55; }
.hp-coil { fill: color-mix(in oklab, var(--hp-coil), var(--hp-hot) calc(var(--glow, 0) * 90%)); stroke: var(--anatomy-lo); stroke-width: 0.4px; vector-effect: non-scaling-stroke; }
.hp-coil-core { fill: color-mix(in oklab, var(--hp-groove), var(--hp-warn) calc(var(--glow, 0) * 80%)); }

/* Vỏ và bảng điều khiển màu tối: giữ bốn mức sáng */
.hp-panel .iso-fill, .hp-rubber .iso-fill { fill: color-mix(in oklab, var(--hp-dark) var(--hp-dark-mix), var(--anatomy-paper)); }
.hp-panel .iso-top, .hp-rubber .iso-top { fill: color-mix(in oklab, var(--hp-dark) var(--hp-dark-mix), var(--anatomy-top)); }
.hp-panel .iso-shade[data-shade="0"], .hp-rubber .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--hp-dark) var(--hp-dark-mix), var(--anatomy-shade-0)); }
.hp-panel .iso-shade[data-shade="1"], .hp-rubber .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--hp-dark) var(--hp-dark-mix), var(--anatomy-shade-1)); }
.hp-panel .iso-shade[data-shade="2"], .hp-rubber .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--hp-dark) var(--hp-dark-mix), var(--anatomy-shade-2)); }
.hp-panel .iso-shade[data-shade="3"], .hp-rubber .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--hp-dark) var(--hp-dark-mix), var(--anatomy-shade-3)); }
.hp-panel .iso-solid[data-seamless] > .iso-shade[data-shade], .hp-rubber .iso-solid[data-seamless] > .iso-top { stroke: none; }
.hp-panel .iso-line, .hp-rubber .iso-line { stroke: var(--hp-dark-line); }
.hp-panel .iso-line[data-tone="faint"], .hp-rubber .iso-line[data-tone="faint"] { stroke: var(--hp-dark-faint); }

/* Màn hình LCD */
.hp-lcd .iso-top, .hp-lcd .iso-fill { fill: var(--hp-lcd); }
.hp-lcd-big, .hp-lcd-small { font-family: var(--anatomy-mono); fill: var(--hp-lcd-ink); }
.hp-lcd-small { opacity: 0.78; }
.hp-icon { fill: none; stroke: var(--hp-lcd-dim); stroke-width: 0.6px; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.hp-stage[data-heating] .hp-icon { stroke: var(--hp-warn); }
.hp-hot { fill: var(--hp-lcd-dim); }
.hp-stage[data-hot] .hp-hot { fill: var(--hp-warn); }
.hp-probe-icon { fill: var(--hp-lcd-dim); }
.hp-stage[data-probe] .hp-probe-icon { fill: var(--hp-lcd-ink); }
.hp-pointer-dot { fill: var(--hp-pointer); }

/* Nam châm: hai cực khác màu (màu là nội dung: cực bắc, cực nam) */
.hp-mag[data-pole="n"] .iso-top, .hp-mag[data-pole="n"] .iso-shade { fill: color-mix(in oklab, var(--hp-mag-n) 60%, var(--anatomy-shade-1)); stroke: none; }
.hp-mag[data-pole="s"] .iso-top, .hp-mag[data-pole="s"] .iso-shade { fill: color-mix(in oklab, var(--hp-mag-s) 60%, var(--anatomy-shade-1)); stroke: none; }

/* Bo mạch */
.hp-pcb .iso-top, .hp-pcb .iso-shade { fill: color-mix(in oklab, var(--hp-pcb) 70%, var(--anatomy-shade-1)); stroke: none; }

/* Hơi nước trên miệng cốc */
.hp-wisp { fill: var(--hp-steam); opacity: 0; filter: blur(3px); }
.hp-stage[data-steam] .hp-wisp { animation: hp-rise 2.8s ease-in-out infinite; animation-delay: calc(var(--i) * -0.47s); }
@keyframes hp-rise { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: calc(var(--steam, 0) * 0.4); } 100% { opacity: 0; transform: translateY(-30px); } }
@media (prefers-reduced-motion: reduce) {
  .hp-stage[data-steam] .hp-wisp { animation: none; opacity: calc(var(--steam, 0) * 0.25); }
}

.hp-stage { touch-action: pan-y; cursor: pointer; }
.hp-stage:focus { outline: none; }
.hp-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }

path class="iso-line" data-tone="faint" d="M280 370.1L265.2 374.3"/></g></g><g class="hp-steam" data-part="steam"><ellipse class="hp-wisp" style="--i:0" cx="361.29" cy="158.57" rx="4" ry="7"/><ellipse class="hp-wisp" style="--i:1" cx="341.48" cy="156.13" rx="5" ry="9"/><ellipse class="hp-wisp" style="--i:2" cx="349.55" cy="147.84" rx="6" ry="7"/><ellipse class="hp-wisp" style="--i:3" cx="367.28" cy="152.42" rx="4" ry="9"/><ellipse class="hp-wisp" style="--i:4" cx="354.64" cy="159.53" rx="5" ry="7"/><ellipse class="hp-wisp" style="--i:5" cx="340.17" cy="153.12" rx="6" ry="9"/></g></svg><span class="hp-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Kim hai núm: nhiệt độ đặt (trái) và tốc độ khuấy 50–1500 vòng/phút (phải)</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Cặp nam châm trên mô tơ kéo con khuấy PTFE quay theo; nước xoáy thành phễu</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Dây điện trở 1000 W dưới mặt đế; tam giác trên màn hình: mặt đế còn trên 50 °C</span></span><span class="iso-caption">Máy vẽ theo IKA C-MAG HS 7 control (220 × 88 × 354 mm, 4 kg): điện trở 1000 W dưới mặt đế ceramic 180 × 180 mm, mặt đế tới 500 °C, mạch an toàn chỉnh được 100–650 °C, khuấy 50–1500 vòng/phút, đầu dò PT1000 (±0,5 K). Cốc 250 mL (ISO 3819, Ø70 × 95 mm) có 200 mL nước. Có đầu dò, máy điều khiển theo nhiệt độ nước: mặt đế nóng tới vài trăm độ rồi hạ dần, nước lên 79 °C sau khoảng 9 phút và vượt quá 0,8 K. Không có đầu dò, máy chỉ giữ nhiệt độ mặt đế: đặt 80 °C thì nước dừng ở khoảng 59 °C. Ở 100 °C nhiệt thêm vào chỉ làm nước bay hơi (2257 J/g). Con khuấy 30 mm văng khỏi tâm khi tốc độ vượt khoảng 1250 vòng/phút. Nhiệt dung mặt đế, hệ số truyền nhiệt, độ sâu phễu và ngưỡng văng là số minh hoạ, chọn để 1 L nước lên khoảng 5 K/phút như datasheet. Dây điện trở, tấm cách nhiệt, mô tơ và nam châm vẽ theo cấu tạo điển hình, không theo sơ đồ của hãng; ổ đầu dò vẽ ở hông cho dễ thấy. Hình chạy nhanh hơn thực tế (1 giây bằng 40 giây).</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];

    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }

    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])

    }
    let fill;

    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;

function sideOf(meridian) {

  let last = m - 1;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const r1 = side[side.length - 1][1];

  const top = aV > 0 ? facing + Math.PI : facing;

  const R = right.map((point) => iso(point, P));

  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";

      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    midS.push(Math.sin(t));

    crease: creases.join(""),
    top: buckets[4].join(""),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  for (let j = 0; j < n; j++) {

    tones.push(bandOf(dot3(normal, L)));

    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);

function prismOf(F, polygon, s0, s1, P) {

function sphereOf(centre, r, P, { steps = 48 } = {}) {

  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;

  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];

    const c = (slope * aV - least * norm) / flat;

  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));

  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);

      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));

  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));

function pathLength(points) {

function cut(points, from, to) {
  const out = [];
  let walked = 0;

    const a = points[index - 1];
    const b = points[index];

      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));

const pointAlong = (points, at) => {

// - Dẫn nhiệt mặt đế → nước G = g·A_đáy·(0,55 + 0,45·s), g = 140 W/(m²·K), s là mức khuấy 0–1. Chọn g để 1 L nước
//   trong cốc 1 L, mặt đế 500 °C, lên được khoảng 5,6 K/phút (datasheet: 5 K/phút); khi đó 200 mL trong cốc 250 mL,
//   khuấy 600 vòng/phút, đầu dò đặt 80 °C, đi từ 25 lên 79 °C trong khoảng 8,5 phút, vượt quá dưới 1 K.
//   Không có đầu dò, mặt đế đặt 80 °C thì 200 mL nước chỉ ổn định ở khoảng 59 °C.
// - Mất nhiệt của nước: hA = 10 W/(m²·K) × diện tích thành ướt và mặt thoáng; bay hơi dưới điểm sôi
//   Q = 60 W/(m²·kPa) × A_mặt thoáng × (p_bão hoà(T) − 0,5·p_bão hoà(T_phòng)).
// - Điều khiển: không có đầu dò thì giữ mặt đế ở nhiệt độ đặt (nước ổn định thấp hơn nhiệt độ đặt);
//   có đầu dò thì điều khiển PI có bù trước theo nhiệt độ nước (k_p = 10, k_i = 0,05/s), mặt đế được nóng tới
//   500 °C và không quá mạch an toàn.
// - Chênh nhiệt đáy – mặt nước: ΔT = Q_vào / (10 + 60·s) W/K. Con khuấy văng (mất đồng bộ) trên tốc độ
//   n_c = 1250 × (30/L)^0,5 × μ^−0,25 × (V/200 mL)^0,15 vòng/phút (L: chiều dài con khuấy mm, μ: độ nhớt mPa·s).
// - Độ sâu phễu xoáy Δ = (0,12·ω·R)²/g, không quá 0,55 chiều cao cột nước.

const G0 = 9.80665; // m/s²
const CP_WATER = 4.18; // J/(g·K)
const LATENT = 2257; // J/g ở 100 °C
const BOIL_C = 100; // °C ở 1 atm

/** Thông số máy (IKA C-MAG HS 7 control). Kích thước mm. */
const HS7 = {
  model: "IKA C-MAG HS 7 control",
  size: { width: 220, height: 88, depth: 354 },
  mass: 4, // kg
  heaterW: 1000,
  plate: { w: 180, d: 180, material: "ceramic" },
  plateMax: 500,
  plateStep: 5, // K, đặt nhiệt độ mặt đế
  mediumStep: 1, // K, đặt nhiệt độ môi trường (có đầu dò)
  safety: [100, 650], // °C, mạch an toàn chỉnh được
  safetyDefault: 550, // °C (giá trị cố định của bản C-MAG HS 7 thường; dùng làm mặc định)
  rpm: [50, 1500],
  rpmStep: 10,
  motorW: 9,
  maxVolumeL: 20,
  barLength: [30, 80], // mm
  ptRange: [-10, 400],
  accuracy: { plate: 5, pt1000: 0.5, etsD5: 0.5, etsD6: 0.2 }, // ±K
  heatRate1L: 5, // K/phút, 1 L nước trong cốc H1500
  hotTopC: 50, // °C, đèn báo mặt đế còn nóng (chưa xác minh với manual)
};

/** Cốc dạng thấp ISO 3819 (đường kính ngoài, chiều cao, mm). */
const BEAKERS = [
  { ml: 250, od: 70, h: 95 },
  { ml: 600, od: 90, h: 125 },
  { ml: 1000, od: 105, h: 145 },
  { ml: 50, od: 42, h: 60 }, // cốc nhỏ trên bàn hoá học của app (ISO 3819 dạng thấp, theo catalogue DWK)
];
const BEAKER = { ...BEAKERS[0], wall: 1.5, bottom: 1.5 };
const BAR = { length: 30, d: 6, ring: 7 }; // con khuấy PTFE hình trụ có vòng xoay giữa (mm)

/** Tham số minh hoạ của mô hình nhiệt (xem đầu file). */
const THERMAL = {
  room: 25,
  plateC: 400, // J/K
  plateLoss: 1.0, // W/K
  g: 140, // W/(m²·K)
  hAir: 10, // W/(m²·K)
  evap: 60, // W/(m²·kPa)
  rh: 0.5,
  kp: 10, // K mặt đế / K sai lệch
  ki: 0.05, // K mặt đế / (K·s), chỉ tích phân khi sai lệch dưới 3 K
  band: 4, // K, dải tỉ lệ của bộ điều khiển công suất mặt đế
};

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/** Áp suất hơi bão hoà của nước (kPa), phương trình Antoine 1–100 °C. */
function psat(T) {
  return 10 ** (8.07131 - 1730.63 / (233.426 + Math.min(T, 100))) * 0.133322;
}

/** Cốc ISO 3819 nhỏ nhất chứa được thể tích (mL); bán kính trong và chiều cao cột nước (mm). */
function beakerFor(volumeMl, beakerMl = 0) {
  const sizes = [...BEAKERS].sort((x, y) => x.ml - y.ml);
  const b = sizes.find((x) => x.ml >= Math.max(volumeMl, beakerMl)) ?? sizes[sizes.length - 1];
  const rIn = b.od / 2 - BEAKER.wall;
  const area = Math.PI * rIn * rIn; // mm²
  return { ...b, rIn, area, level: (volumeMl * 1000) / area };
}

/**
 * Tốc độ con khuấy bắt đầu văng ra khỏi tâm (mất đồng bộ với nam châm), minh hoạ.
 * @param {{ barMm?: number, viscosity?: number, volumeMl?: number }} o barMm: chiều dài con khuấy; viscosity: mPa·s
 * @returns {number} vòng/phút
 */
function spinOutRpm({ barMm = BAR.length, viscosity = 1, volumeMl = 200 } = {}) {
  return 1250 * Math.sqrt(30 / barMm) * viscosity ** -0.25 * (Math.max(20, volumeMl) / 200) ** 0.15;
}

/** Độ nhớt của nước (mPa·s) theo nhiệt độ (Vogel, gần đúng 0–100 °C: 1,00 ở 20 °C, 0,35 ở 80 °C). */
function waterViscosity(T) {
  return 0.02939 * Math.exp(507.88 / (T + 273.15 - 149.3));
}

/**
 * Con khuấy và chất lỏng ở một tốc độ đặt.
 * @param {{ rpm: number, volumeMl?: number, viscosity?: number, barMm?: number }} o
 * @returns {{ coupled: boolean, limit: number, barRpm: number, stir: number, vortexMm: number }}
 *   coupled: con khuấy còn bám theo nam châm; limit: tốc độ văng; barRpm: tốc độ thật của con khuấy;
 *   stir: mức khuấy 0–1 (dùng cho truyền nhiệt và độ đồng đều); vortexMm: độ sâu phễu xoáy.
 */
function stirOf({ rpm, volumeMl = 200, viscosity = 1, barMm = BAR.length }) {
  const limit = spinOutRpm({ barMm, viscosity, volumeMl });
  const coupled = rpm <= limit;
  const barRpm = coupled ? rpm : Math.min(rpm, limit) * 0.35;
  const stir = clamp(barRpm / 400, 0, 1);
  const b = beakerFor(volumeMl);
  const w = (2 * Math.PI * barRpm) / 60;
  const depth = ((0.12 * w * (b.rIn / 1000)) ** 2 / G0) * 1000;
  return { coupled, limit, barRpm, stir, vortexMm: Math.min(0.55 * b.level, depth) };
}

/** Trạng thái đầu của một lượt gia nhiệt. */
function initialState({ volumeMl = 200, roomC = THERMAL.room, beakerMl = 0 } = {}) {
  return { t: 0, T: roomC, Tp: roomC, m: volumeMl, I: 0, duty: 0, boiling: false, evaporated: 0, beakerMl: Math.max(beakerMl, volumeMl) };
}

/**
 * Một bước mô phỏng nhiệt (dt giây). Thay đổi `s` tại chỗ và trả về chính nó.
 * @param {object} s trạng thái từ initialState
 * @param {{ setC: number, probe: boolean, heat: boolean, rpm: number, safetyC?: number, roomC?: number }} u
 */
function stepHeat(s, u, dt, th = THERMAL) {
  const room = u.roomC ?? th.room;
  const b = beakerFor(Math.max(1, s.m), s.beakerMl);
  const st = stirOf({ rpm: u.rpm, volumeMl: Math.max(1, s.m), viscosity: waterViscosity(s.T) });
  const level = (Math.max(0, s.m) * 1000) / b.area / 1000; // m
  const aBase = b.area / 1e6; // m²
  const aWet = aBase + 2 * Math.PI * (b.rIn / 1000) * level;
  const G = s.m > 0.5 ? th.g * aBase * (0.55 + 0.45 * st.stir) : 0.02;
  const plateMax = Math.min(HS7.plateMax, u.safetyC ?? HS7.safetyDefault);
  // Bộ điều khiển
  let target;
  if (!u.heat) { target = room; s.I = 0; }
  else if (u.probe && s.m > 0.5) {
    // PI có bù trước: mặt đế cần để giữ nước ở nhiệt độ đặt = đặt + tổn thất ở nhiệt độ đặt / G
    const err = u.setC - s.T;
    const set = Math.min(u.setC, BOIL_C);
    const lossAtSet = th.hAir * (aWet + aBase) * (set - room) + Math.max(0, th.evap * aBase * (psat(set) - th.rh * psat(room)));
    if (Math.abs(err) < 3) s.I = clamp(s.I + th.ki * err * dt, -30, 30);
    target = clamp(u.setC + lossAtSet / G + th.kp * err + s.I, room, plateMax);
  } else target = clamp(u.setC, room, plateMax);
  s.duty = u.heat ? clamp((target - s.Tp) / th.band, 0, 1) : 0;
  const qHeater = s.duty * HS7.heaterW;
  const qLiquid = G * (s.Tp - s.T);
  const qPlateLoss = th.plateLoss * (s.Tp - room);
  s.Tp += ((qHeater - qLiquid - qPlateLoss) / th.plateC) * dt;
  // Nước
  if (s.m > 0.5) {
    const qAir = th.hAir * aWet * (s.T - room) + th.hAir * aBase * (s.T - room);
    const qEvap = Math.max(0, th.evap * aBase * (psat(s.T) - th.rh * psat(room)));
    const mc = s.m * CP_WATER;
    let next = s.T + ((qLiquid - qAir - qEvap) * dt) / mc;
    s.evaporated += (qEvap * dt) / LATENT;
    s.m -= (qEvap * dt) / LATENT;
    s.boiling = false;
    if (next >= BOIL_C) {
      // Phần nhiệt vượt quá đưa nước lên 100 °C dùng để hoá hơi (2257 J/g)
      const extra = (next - BOIL_C) * mc;
      const gone = extra / LATENT;
      s.m = Math.max(0, s.m - gone);
      s.evaporated += gone;
      next = BOIL_C;
      s.boiling = qLiquid - qAir - qEvap > 0;
    }
    s.T = next;
  } else {
    s.m = 0;
    s.T += ((s.Tp - s.T) * dt) / 60; // cốc cạn: thuỷ tinh nóng theo mặt đế
  }
  s.t += dt;
  s.gradient = s.m > 0.5 ? Math.max(0, qLiquid) / (10 + 60 * st.stir) : 0;
  s.stir = st;
  s.qLiquid = qLiquid;
  s.eta = qHeater > 0 ? qLiquid / qHeater : 0;
  return s;
}

/**
 * Đường gia nhiệt của nước trong cốc.
 * @param {{ volumeMl?: number, setC?: number, probe?: boolean, minutes?: number, rpm?: number, roomC?: number,
 *           safetyC?: number, beakerMl?: number, dt?: number, every?: number }} o
 *   volumeMl: thể tích nước; setC: nhiệt độ đặt (của nước nếu có đầu dò, của mặt đế nếu không);
 *   minutes: thời gian chạy; every: khoảng lấy mẫu (giây) của chuỗi kết quả.
 * @returns {{ series: { min: number, liquid: number, plate: number, volume: number, boiling: boolean }[],
 *   final: object, reachMin: number|null, maxLiquid: number, evaporatedMl: number, steadyLiquid: number }}
 *   reachMin: phút đầu tiên nước cách nhiệt độ đặt dưới 1 K (null nếu không đạt).
 */
function heat({ volumeMl = 200, setC = 80, probe = true, minutes = 15, rpm = 600, roomC = THERMAL.room, safetyC, beakerMl = 0, dt = 0.5, every = 30 } = {}) {
  const s = initialState({ volumeMl, roomC, beakerMl });
  const series = [];
  let reachMin = null;
  let maxLiquid = s.T;
  const steps = Math.round((minutes * 60) / dt);
  const sample = Math.max(1, Math.round(every / dt));
  const push = () => series.push({ min: s.t / 60, liquid: s.T, plate: s.Tp, volume: s.m, boiling: s.boiling });
  push();
  for (let i = 1; i <= steps; i++) {
    stepHeat(s, { setC, probe, heat: true, rpm, roomC, safetyC }, dt);
    maxLiquid = Math.max(maxLiquid, s.T);
    if (reachMin === null && Math.abs(s.T - (probe ? setC : Math.min(setC, BOIL_C))) < 1) reachMin = s.t / 60;
    if (i % sample === 0) push();
  }
  return { series, final: { ...s }, reachMin, maxLiquid, evaporatedMl: s.evaporated, steadyLiquid: probe ? setC : steadyNoProbe({ volumeMl, plateC: setC, rpm, roomC }) };
}

/**
 * Nhiệt độ nước ổn định khi không có đầu dò và mặt đế giữ ở plateC (giải lặp cân bằng nhiệt).
 * Không vượt 100 °C (khi đó nước sôi).
 */
function steadyNoProbe({ volumeMl = 200, plateC = 80, rpm = 600, roomC = THERMAL.room, th = THERMAL } = {}) {
  const b = beakerFor(volumeMl);
  const st = stirOf({ rpm, volumeMl });
  const aBase = b.area / 1e6;
  const aWet = aBase + 2 * Math.PI * (b.rIn / 1000) * (b.level / 1000);
  const G = th.g * aBase * (0.55 + 0.45 * st.stir);
  let lo = roomC;
  let hi = Math.max(roomC, plateC);
  for (let i = 0; i < 50; i++) {
    const T = (lo + hi) / 2;
    const net = G * (plateC - T) - th.hAir * (aWet + aBase) * (T - roomC) - Math.max(0, th.evap * aBase * (psat(T) - th.rh * psat(roomC)));
    if (net > 0) lo = T;
    else hi = T;
  }
  return Math.min(BOIL_C, (lo + hi) / 2);
}

/**
 * Lượng nước bay hơi (g ≈ mL) khi nước đang sôi nhận công suất thực netW trong `minutes` phút: netW·t/2257.
 */
function boilOff({ netW, minutes }) {
  return (netW * minutes * 60) / LATENT;
}

/**
 * Lượt chạy đầy đủ, dùng cho app và cho hình: { volumeMl, setC, rpm, probe, minutes } → tóm tắt và chuỗi số liệu.
 * Nhiệt độ đặt được làm tròn theo bước của máy (1 K có đầu dò, 5 K mặt đế), tốc độ theo bước 10 vòng/phút.
 */
function runOf({ volumeMl = 200, setC = 80, rpm = 600, probe = true, minutes = 15 } = {}) {
  const v = clamp(Number(volumeMl) || 200, 20, 250);
  const step = probe ? HS7.mediumStep : HS7.plateStep;
  const set = clamp(Math.round((Number(setC) || 80) / step) * step, 30, probe ? HS7.ptRange[1] : HS7.plateMax);
  const n = clamp(Math.round((Number(rpm) || 0) / HS7.rpmStep) * HS7.rpmStep, 0, HS7.rpm[1]);
  const run = heat({ volumeMl: v, setC: set, probe: !!probe, minutes: clamp(Number(minutes) || 15, 1, 120), rpm: n });
  return { volumeMl: v, setC: set, rpm: n, probe: !!probe, minutes: clamp(Number(minutes) || 15, 1, 120), stir: stirOf({ rpm: n, volumeMl: v }), ...run };
}

const fmtDec = (v, d = 1) => v.toFixed(d).replace(".", ",");
const fmtInt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
// Phần chuyển động của máy khuấy từ: con khuấy PTFE trong cốc, cặp nam châm trên mô tơ, khối nước có phễu xoáy,
// bọt khí khi gần sôi. Module thuần (không DOM): bản dựng và trang cùng gọi, nhận kit `k` và lathe `G` từ ngoài.

const hull2 = (points) => {
  const pts = [...points].sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop();
  lower.pop();
  return lower.concat(upper);
};

/**
 * @param {object} k kit (cần iso, pathOf, solidSvg)
 * @param {object} G lathe (cần frameOf, solidOf, ringBand, prismOf)
 * @param {object} P phép chiếu
 * @param {{ c: number[], floor: number, rIn: number, bar: { length: number, d: number, ring: number }, mag: object }} cfg
 *   c: tâm đáy trong của cốc (x, y) và z của đáy trong; rIn: bán kính trong; mag: cặp nam châm { c, z0, z1, r, half, w }
 */
function makeStir(k, G, P, cfg) {
  const at = (p) => k.iso(p, P);
  const f2 = (v) => v.toFixed(2);
  const [cx, cy] = cfg.c;
  const ring = (z, r, n = 48) => k.pathOf(Array.from({ length: n }, (_, i) => {
    const a = (i / n) * Math.PI * 2;
    return at([cx + r * Math.cos(a), cy + r * Math.sin(a), z]);
  }), true);
  const B = cfg.bar;
  const half = B.length / 2;
  const rb = B.d / 2;
  const zBar = cfg.floor + B.ring; // tâm con khuấy: vòng giữa chạm đáy
  const barProfile = [[-half, 0], [-half + 0.35, rb * 0.62, 1], [-half + 1.1, rb * 0.9, 1], [-half + 2.2, rb], [half - 2.2, rb], [half - 1.1, rb * 0.9, 1], [half - 0.35, rb * 0.62, 1], [half, 0]];

  /** Con khuấy ở góc theta (rad), lệch tâm (dx, dy) khi văng. */
  function bar(theta, [dx, dy] = [0, 0], tilt = 0) {
    const o = [cx + dx, cy + dy, zBar + tilt * 2];
    const a = [Math.cos(theta), Math.sin(theta), tilt * 0.12];
    const n = Math.hypot(...a);
    const ax = a.map((v) => v / n);
    const F = G.frameOf(o, ax, [-Math.sin(theta), Math.cos(theta), 0], [0, 0, 1]);
    const body = k.solidSvg(G.solidOf(barProfile, F, P, { steps: 20 }), { tone: "hi" });
    const pivot = k.solidSvg(G.ringBand(-1.1, 1.1, rb, B.ring, F, P, { steps: 24 }), { tone: "mid" });
    // nửa sau của vòng, thân, rồi nửa trước: vẽ vòng sau thân là đủ vì vòng bao quanh thân
    return `<g class="hp-ptfe">${body}${pivot}</g>`;
  }

  const M = cfg.mag;
  /** Cặp nam châm trên đĩa mang ở góc theta: khối gần người xem vẽ sau. */
  function magnets(theta) {
    const F = G.frameOf([M.c[0], M.c[1], 0], [0, 0, 1], [Math.cos(theta), Math.sin(theta), 0], [-Math.sin(theta), Math.cos(theta), 0]);
    const parts = [1, -1].map((sign) => {
      const centre = [M.c[0] + sign * (M.r0 + M.r1) / 2 * Math.cos(theta), M.c[1] + sign * (M.r0 + M.r1) / 2 * Math.sin(theta), M.z0];
      const [u0, u1] = sign > 0 ? [M.r0, M.r1] : [-M.r1, -M.r0];
      const poly = [[u0, -M.w], [u1, -M.w], [u1, M.w], [u0, M.w]];
      return { depth: k.depthOf(centre, P), svg: `<g class="hp-mag" data-pole="${sign > 0 ? "n" : "s"}">${k.solidSvg(G.prismOf(F, poly, M.z0, M.z1, P), { tone: "mid" })}</g>` };
    });
    parts.sort((a, b) => a.depth - b.depth);
    return parts.map((p) => p.svg).join("");
  }

  /**
   * Khối nước: thân (bao lồi đáy và mặt thoáng ở thành), mặt thoáng, phễu xoáy (các vòng đồng mức), bọt khí.
   * @param {{ level: number, depth: number, swirl: number, bubbles: number[][] }} o level: z mặt thoáng khi đứng yên;
   *   depth: độ sâu phễu (mm); swirl: góc xoay của vệt dòng; bubbles: [[x, y, z, r], ...]
   */
  function liquid({ level, depth = 0, swirl = 0, bubbles = [] }) {
    const R = cfg.rIn;
    const zw = level + depth / 2;
    const pts = [];
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * Math.PI * 2;
      pts.push(at([cx + R * Math.cos(a), cy + R * Math.sin(a), cfg.floor]));
      pts.push(at([cx + R * Math.cos(a), cy + R * Math.sin(a), zw]));
    }
    const h = hull2(pts);
    const body = `M${h.map(([x, y]) => `${f2(x)} ${f2(y)}`).join("L")}Z`;
    let out = `<path class="hp-liquid" d="${body}"/><path class="hp-liquid-top" d="${ring(zw, R)}"/>`;
    if (depth > 0.3) {
      const zAt = (f) => zw - depth * (1 - f * f);
      const lines = [0.78, 0.56, 0.36].map((f) => ring(zAt(f), R * f, 40)).join("");
      const core = ring(zAt(0.18), R * 0.18, 24);
      // Khoang không khí của phễu (thấy qua thành cốc khi phễu sâu): bao lồi các vòng đồng mức
      const cav = [];
      for (const f of [0.8, 0.6, 0.42, 0.28, 0.16, 0.06]) for (let i = 0; i < 32; i++) {
        const a = (i / 32) * Math.PI * 2;
        cav.push(at([cx + R * f * Math.cos(a), cy + R * f * Math.sin(a), zAt(f)]));
      }
      const ch = hull2(cav);
      out += `<path class="hp-cavity" d="M${ch.map(([x, y]) => `${f2(x)} ${f2(y)}`).join("L")}Z"/>`;
      const arcs = [0.78, 0.56].map((f, j) => {
        const p = [];
        for (let i = 0; i <= 10; i++) {
          const a = swirl * (1 + 0.5 * j) + j * 2.3 + (i / 10) * 1.2;
          p.push(at([cx + R * f * Math.cos(a), cy + R * f * Math.sin(a), zAt(f)]));
        }
        return k.pathOf(p);
      }).join("");
      out += `<path class="hp-funnel-line" d="${lines}"/><path class="hp-funnel" d="${core}"/><path class="hp-streak" data-free="" d="${arcs}"/>`;
    }
    if (bubbles.length) out += `<g class="hp-bubbles">${bubbles.map(([x, y, z, r]) => { const p = at([x, y, z]); return `<circle cx="${f2(p[0])}" cy="${f2(p[1])}" r="${f2(r)}"/>`; }).join("")}</g>`;
    return out;
  }

  return { bar, magnets, liquid, zBar };
}
// Phần chạy trong trang: gia nhiệt theo mô hình hai nút (mặt đế – nước) của model.mjs, mô tơ quay cặp nam châm,
// con khuấy bám theo (hoặc văng khi quá nhanh), phễu xoáy, bọt khí gần sôi, hơi nước, màn hình và đèn báo mặt đế nóng.
const D = {"P":{"origin":[290.65439362820916,337.7103534468144],"scale":0.7734148091672259,"azimuth":33,"elevation":26},"stir":{"c":[0,-77],"floor":89.5,"rIn":33.5,"bar":{"length":30,"d":6,"ring":7},"mag":{"c":[0,-77],"z0":54,"z1":61,"r0":9,"r1":23,"w":6}},"beaker":{"z0":88,"h":95,"area":3525.652355491145},"probe":{"c":[-14,-98],"r":1.5,"tip":99.5,"holder":[222,238],"handle":[238,268],"hr":4.5}};
const P = D.P;
const kk = { iso, pathOf, solidSvg, depthOf };
const STIRM = makeStir(kk, G, P, D.stir);
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const $ = (sel) => svgEl.querySelector(sel);
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const WARP = 40; // 1 giây thật = 40 giây mô phỏng

// Lượt chạy của người dùng do app truyền qua địa chỉ (…hotplate.html#run=<JSON>): { volumeMl, setC, rpm, probe, minutes }
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
const PLAN = RUN ? (({ volumeMl, setC, rpm, probe, minutes }) => ({ volumeMl, setC, rpm, probe, minutes }))(runOf(RUN)) : null;

const el = {
  bar: $('[data-part="bar"]'),
  magnets: $('[data-part="magnets"]'),
  liquid: $('[data-part="liquid"]'),
  setT: $('[data-part="set-t"]'),
  actT: $('[data-part="act-t"]'),
  unitT: $('[data-part="unit-t"]'),
  setN: $('[data-part="set-n"]'),
  actN: $('[data-part="act-n"]'),
  knobT: $('[data-part="knob-temp"]'),
  knobN: $('[data-part="knob-speed"]'),
};

const clampN = (v, a, b) => Math.min(b, Math.max(a, v));
const follow = (x, target, dt, tau, calm) => (calm ? target : target + (x - target) * Math.exp(-dt / tau));
const fmt1 = (v) => v.toFixed(1).replace(".", ",");
const clock = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;

const state = {
  volume: PLAN?.volumeMl ?? 200,
  setC: PLAN?.setC ?? 80,
  rpmSet: PLAN?.rpm ?? 600,
  heatOn: false,
  probe: PLAN ? PLAN.probe : true,
  sim: initialState({ volumeMl: PLAN?.volumeMl ?? 200 }),
  motor: 0, // vòng/phút thật của mô tơ
  phi: 2.2, // góc nam châm (vẽ theo nhịp hoạt nghiệm)
  theta: 2.2, // góc con khuấy
  wob: 0, // độ văng 0–1
  funnel: 0,
  glow: 0,
  knobT: 0,
  knobN: 0,
  time: 0,
  barKey: "",
  liqKey: "",
};
state.sim.stir = stirOf({ rpm: 0, volumeMl: state.volume });
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches;
let tour = { step: "wait", wait: 1.4 };
let idleTimer = 0;
let lastPhase = "";

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const setRange = () => (state.probe ? [30, 300] : [30, HS7.plateMax]);
const setStep = () => (state.probe ? HS7.mediumStep : HS7.plateStep);
const setTemp = (v) => { const [a, b] = setRange(); const s = setStep(); state.setC = clampN(Math.round(v / s) * s, a, b); };
const setRpm = (v) => { state.rpmSet = v < HS7.rpm[0] ? 0 : clampN(Math.round(v / HS7.rpmStep) * HS7.rpmStep, HS7.rpm[0], HS7.rpm[1]); };

function stepSim(dtReal, calm) {
  const st = state.sim;
  let simDt = dtReal * WARP;
  while (simDt > 1e-6) {
    const h = Math.min(0.5, simDt);
    stepHeat(st, { setC: state.setC, probe: state.probe, heat: state.heatOn, rpm: state.motor }, h);
    simDt -= h;
  }
  state.time = st.t;
  // Mô tơ và con khuấy
  state.motor = follow(state.motor, state.rpmSet, dtReal, state.rpmSet > state.motor ? 0.5 : 0.7, calm);
  if (state.motor < 3 && state.rpmSet === 0) state.motor = 0;
  const sto = stirOf({ rpm: state.motor, volumeMl: Math.max(1, st.m), viscosity: waterViscosity(st.T) });
  state.wob = follow(state.wob, sto.coupled ? 0 : 1, dtReal, 0.35, calm);
  // Nhịp hoạt nghiệm: tối đa khoảng 2,4 vòng mỗi giây trên hình
  const rate = (rpm) => 2 * Math.PI * 2.4 * (rpm / HS7.rpm[1]);
  if (!calm) {
    state.phi = (state.phi + dtReal * rate(state.motor)) % (Math.PI * 2);
    if (sto.coupled && state.wob < 0.5) state.theta = state.phi - 0.15 * state.wob;
    else state.theta = (state.theta + dtReal * rate(sto.barRpm) * (0.6 + 0.4 * Math.sin(state.time * 0.9))) % (Math.PI * 2);
  }
  state.funnel = follow(state.funnel, st.m > 1 ? sto.vortexMm : 0, dtReal, 0.6, calm);
  if (state.funnel < 0.05 && sto.vortexMm === 0) state.funnel = 0;
  const glowTarget = clampN((st.Tp - 90) / 320, 0, 1) * (0.45 + 0.55 * st.duty);
  state.glow = follow(state.glow, glowTarget, dtReal, 0.4, calm);
  state.knobT = follow(state.knobT, -135 + 270 * (state.setC / setRange()[1]), dtReal, 0.15, calm);
  state.knobN = follow(state.knobN, -135 + 270 * (state.rpmSet / HS7.rpm[1]), dtReal, 0.15, calm);
  state.sto = sto;
}

function bubblesAt() {
  const st = state.sim;
  const n = st.boiling ? 12 : st.T > 86 ? Math.round(((st.T - 86) / 14) * 8) : 0;
  if (!n || st.m < 1) return [];
  const level = D.stir.floor + (st.m * 1000) / D.beaker.area;
  const out = [];
  for (let i = 0; i < n; i++) {
    const ph = still.matches ? (i + 0.5) / n : (state.time / WARP * (0.7 + 0.05 * i) + i / n) % 1;
    const a = i * 2.39996 + 0.4;
    const r = 6 + ((i * 7) % 22);
    const z = D.stir.floor + 3 + ph * (level - D.stir.floor - 6);
    out.push([D.stir.c[0] + r * Math.cos(a), D.stir.c[1] + r * Math.sin(a), z, 0.5 + ph * (st.boiling ? 1.3 : 0.8)]);
  }
  return out;
}

function draw() {
  const st = state.sim;
  const w = state.wob;
  const off = [w * 5 * Math.cos(state.time * 0.7), w * 5 * Math.sin(state.time * 0.53)];
  const barKey = `${state.theta.toFixed(3)}:${off[0].toFixed(2)}:${off[1].toFixed(2)}`;
  if (barKey !== state.barKey) {
    state.barKey = barKey;
    el.bar.innerHTML = STIRM.bar(state.theta, off, w * Math.sin(state.time * 3.1) * 0.6);
    el.magnets.innerHTML = STIRM.magnets(state.phi);
  }
  const level = D.stir.floor + (Math.max(0, st.m) * 1000) / D.beaker.area;
  const bubbles = bubblesAt();
  const liqKey = `${level.toFixed(2)}:${state.funnel.toFixed(2)}:${state.phi.toFixed(2)}:${bubbles.map((b) => b[2].toFixed(1)).join(",")}`;
  if (liqKey !== state.liqKey) {
    state.liqKey = liqKey;
    el.liquid.innerHTML = st.m > 0.5 ? STIRM.liquid({ level, depth: state.funnel, swirl: state.phi, bubbles }) : "";
  }
  // Biến màu cho CSS
  stage.style.setProperty("--heat", clampN((st.T - 25) / 75, 0, 1).toFixed(3));
  stage.style.setProperty("--glow", state.glow.toFixed(3));
  stage.style.setProperty("--plate", clampN((st.Tp - 50) / 350, 0, 1).toFixed(3));
  stage.style.setProperty("--steam", clampN((st.T - 65) / 30, 0, 1).toFixed(3));
  const flag = (name, on) => { if (on) stage.setAttribute(name, ""); else stage.removeAttribute(name); };
  flag("data-hot", st.Tp > HS7.hotTopC);
  flag("data-heating", state.heatOn && st.duty > 0.05);
  flag("data-probe", state.probe);
  flag("data-steam", st.T > 65 && st.m > 0.5);
  // Màn hình
  const text = (node, value) => { if (node.textContent !== value) node.textContent = value; };
  text(el.setT, state.heatOn ? `ĐẶT ${state.setC} °C` : `TẮT · ${state.setC} °C`);
  text(el.actT, state.probe ? fmt1(st.T) : String(Math.round(st.Tp)));
  text(el.unitT, state.probe ? "°C · NƯỚC" : "°C · MẶT ĐẾ");
  text(el.setN, state.rpmSet ? `ĐẶT ${state.rpmSet}` : "KHUẤY TẮT");
  text(el.actN, String(Math.round(state.motor / 10) * 10));
  el.knobT.setAttribute("transform", `rotate(${state.knobT.toFixed(2)})`);
  el.knobN.setAttribute("transform", `rotate(${state.knobN.toFixed(2)})`);
  drawReadout();
}

function drawReadout() {
  const st = state.sim;
  const sto = state.sto;
  let t = `nước ${fmt1(st.T)} °C · mặt đế ${Math.round(st.Tp)} °C · ${Math.round(state.motor / 10) * 10} v/p · ${clock(state.time)}`;
  if (st.m < 0.5) t = `cốc cạn · mặt đế ${Math.round(st.Tp)} °C`;
  else if (st.boiling) t = `sôi 100 °C · còn ${Math.round(st.m)} mL · ${clock(state.time)}`;
  else if (!state.heatOn && st.Tp > HS7.hotTopC) t = `tắt · mặt đế ${Math.round(st.Tp)} °C · còn nóng`;
  else if (!state.heatOn && st.T < 25.5) t = `sẵn sàng · ${Math.round(st.m)} mL nước`;
  if (readout.textContent !== t) readout.textContent = t;
  let phase = "";
  if (st.m < 0.5) phase = "Nước đã cạn.";
  else if (st.boiling) phase = "Nước sôi: nhiệt thêm vào chỉ làm nước bay hơi.";
  else if (sto && !sto.coupled && state.motor > 0) phase = "Con khuấy văng khỏi tâm, không còn bám theo nam châm.";
  else if (state.heatOn && state.probe && Math.abs(st.T - state.setC) < 1) phase = "Nước đạt nhiệt độ đặt.";
  else if (!state.heatOn && st.Tp > HS7.hotTopC) phase = "Đã tắt gia nhiệt: mặt đế còn nóng.";
  if (phase && phase !== lastPhase) { lastPhase = phase; say(phase); }
}

function busy() {
  const st = state.sim;
  return touring || state.heatOn || st.Tp > 25.5 || st.T > 25.5 || state.motor > 0 || state.rpmSet > 0 || state.funnel > 0 || state.wob > 0.01 || state.glow > 0.002;
}

function resetWater() {
  state.sim = initialState({ volumeMl: state.volume });
  state.sim.stir = stirOf({ rpm: 0, volumeMl: state.volume });
  state.liqKey = "";
}

function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  const st = state.sim;
  if (PLAN) {
    if (tour.step === "wait") { state.heatOn = true; tour = { step: "run", wait: 0 }; say(`Đun ${state.volume} mL, đặt ${state.setC} °C, ${state.rpmSet} vòng/phút.`); }
    else if (tour.step === "run") { if (state.time >= PLAN.minutes * 60) { state.heatOn = false; touring = false; say(`Hết ${PLAN.minutes} phút: tắt gia nhiệt.`); } }
    return;
  }
  if (tour.step === "wait") { state.heatOn = true; state.probe = true; state.setC = 80; state.rpmSet = 600; tour = { step: "heating", wait: 0 }; say("Bật khuấy 600 vòng/phút và gia nhiệt, đầu dò đặt 80 °C."); }
  else if (tour.step === "heating") { if (st.T >= 79.5 || state.time > 16 * 60) tour = { step: "hold", wait: 3 }; }
  else if (tour.step === "hold") { state.rpmSet = 1400; tour = { step: "fast", wait: 3.6 }; say("Tăng lên 1400 vòng/phút: con khuấy văng khỏi tâm."); }
  else if (tour.step === "fast") { state.rpmSet = 600; tour = { step: "slow", wait: 2.4 }; say("Hạ về 600 vòng/phút: con khuấy bắt lại nam châm."); }
  else if (tour.step === "slow") { state.heatOn = false; state.rpmSet = 0; tour = { step: "cooling", wait: 0 }; say("Tắt gia nhiệt và khuấy: đèn báo mặt đế nóng vẫn sáng."); }
  else if (tour.step === "cooling") { if (st.Tp < HS7.hotTopC || state.time > 40 * 60) tour = { step: "rest", wait: 1.6 }; }
  else if (tour.step === "rest") { resetWater(); tour = { step: "wait", wait: 1.4 }; say("Thay cốc nước mới."); }
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  stepSim(dt, calm);
  draw();
  frame = visible && !calm && busy() ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 1.4 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || state.heatOn || state.motor > 0 || PLAN) return; touring = true; resetWater(); tour = { step: "wait", wait: 0.6 }; run(); }, 12000);
}
// Giảm chuyển động: chạy mô phỏng tới trạng thái cuối ngay (không hoạt cảnh)
function settleCalm(minutes) {
  const st = state.sim;
  const steps = Math.round((minutes * 60) / 0.5);
  for (let i = 0; i < steps; i++) stepHeat(st, { setC: state.setC, probe: state.probe, heat: state.heatOn, rpm: state.rpmSet }, 0.5);
  state.motor = state.rpmSet;
  stepSim(0, true);
  draw();
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (![" ", "Enter", "p", "P", "Escape", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(key)) return;
  event.preventDefault();
  takeOver();
  const big = event.shiftKey ? 10 : 1;
  if (key === " " || key === "Enter") { state.heatOn = !state.heatOn; say(state.heatOn ? `Bật gia nhiệt, đặt ${state.setC} °C.` : "Tắt gia nhiệt."); }
  else if (key === "p" || key === "P") { state.probe = !state.probe; setTemp(state.setC); say(state.probe ? "Cắm đầu dò: máy điều khiển theo nhiệt độ nước." : "Rút đầu dò: máy chỉ giữ nhiệt độ mặt đế."); }
  else if (key === "ArrowRight") setTemp(state.setC + setStep() * big);
  else if (key === "ArrowLeft") setTemp(state.setC - setStep() * big);
  else if (key === "ArrowUp") setRpm(state.rpmSet === 0 ? HS7.rpm[0] : state.rpmSet + 50 * (event.shiftKey ? 4 : 1));
  else if (key === "ArrowDown") setRpm(state.rpmSet - 50 * (event.shiftKey ? 4 : 1));
  else if (key === "Escape") { state.heatOn = false; state.rpmSet = 0; state.motor = 0; resetWater(); say("Đặt lại: cốc nước mới, máy tắt."); }
  if (still.matches) settleCalm(state.heatOn ? 12 : 0);
  run();
});
svgEl.addEventListener("click", () => {
  takeOver();
  state.heatOn = !state.heatOn;
  if (state.heatOn && state.rpmSet === 0) state.rpmSet = 600;
  say(state.heatOn ? "Bật gia nhiệt." : "Tắt gia nhiệt.");
  stage.focus({ preventScroll: true });
  if (still.matches) settleCalm(state.heatOn ? 12 : 0);
  run();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) {
  // Khung tiêu biểu đứng yên: đang đun có đầu dò, khuấy 600 vòng/phút, sau 12 phút (hoặc hết lượt chạy của người dùng)
  state.heatOn = true;
  if (!PLAN) { state.probe = true; state.setC = 80; state.rpmSet = 600; }
  settleCalm(PLAN ? PLAN.minutes : 12);
} else {
  stepSim(1 / 60, true);
  draw();
}
</script></body></html>
