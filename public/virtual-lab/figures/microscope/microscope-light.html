<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kính hiển vi quang học</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình kính hiển vi. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt --lamp (0–1) trên nhóm máy: LED, thấu kính và tụ quang sáng lên theo nó. */
.iso {
  --mc-glass: #9fc4cf;
  --mc-light: #fff2c4;
  --mc-led: #fff6d8;
  --mc-oil: #e8c66a;
  --mc-rubber: #222426;
  --mc-pcb: #2d5a3c;
  --mc-bottle: #6b4a1e;
  --mc-band-4: #e5484d;
  --mc-band-10: #f2c94c;
  --mc-band-40: #6cc4ee;
  --mc-band-100: #f2f2f2;
  --mc-band-oil: #0d0d0d;
  --mc-cav-top: #1b1e20;
  --mc-cav-0: #111315;
  --mc-cav-1: #141618;
  --mc-cav-2: #17191c;
  --mc-cav-3: #1a1d20;
  /* Thị trường qua thị kính: nền sáng của đèn, thuốc nhuộm, viền tối của ống thị kính */
  --mc-view-bg: #f3efe2;
  --mc-view-rim: #050505;
  --mc-view-ring: #6a6a6a;
  --mc-iodine-wall: #8a5a16;
  --mc-iodine-cell: #e9d39a;
  --mc-iodine-nucleus: #7a4610;
  --mc-rbc: #e08a86;
  --mc-rbc-pale: #f3c6bd;
  --mc-wbc: #6a3d8f;
  --mc-plt: #8a5ab0;
  --mc-smear: #f6e4dc;
}
.iso[data-theme="light"] {
  --mc-glass: #7fb0c0;
  --mc-light: #ffcf4a;
  --mc-led: #ffb800;
  --mc-oil: #d4a21c;
  --mc-rubber: #3a3c3e;
  --mc-pcb: #3f8a59;
  --mc-bottle: #8c5f22;
  --mc-band-4: #d93a3f;
  --mc-band-10: #e8b62a;
  --mc-band-40: #49acdc;
  --mc-band-100: #ffffff;
  --mc-band-oil: #111111;
  --mc-cav-top: #ccd0d3;
  --mc-cav-0: #bcc1c5;
  --mc-cav-1: #c3c8cc;
  --mc-cav-2: #cacfd3;
  --mc-cav-3: #d1d6da;
  --mc-view-bg: #f6f2e6;
  --mc-view-rim: #1a1a1a;
  --mc-view-ring: #8a8a8f;
  --mc-iodine-wall: #85520f;
  --mc-iodine-cell: #ecd8a2;
  --mc-iodine-nucleus: #6e3d0a;
  --mc-rbc: #dc7f7a;
  --mc-rbc-pale: #f1c0b6;
  --mc-wbc: #62358a;
  --mc-plt: #8452ab;
  --mc-smear: #f7e7df;
}

/* Kính (lam kính, lá kính, thấu kính): trong mờ để thấy vật phía dưới */
.mc-glass .iso-fill { fill: var(--mc-glass); fill-opacity: 0.12; }
.mc-glass .iso-top { fill: color-mix(in oklab, var(--mc-glass), var(--mc-light) calc(var(--lamp, 0) * 35%)); fill-opacity: 0.32; }
.mc-glass .iso-shade { fill: var(--mc-glass); fill-opacity: 0.42; }
.mc-cover .iso-top { fill-opacity: 0.2; }
.mc-field .iso-top, .mc-field .iso-shade { fill: color-mix(in oklab, var(--mc-glass), var(--mc-light) calc(var(--lamp, 0) * 80%)); fill-opacity: 0.85; }
.mc-led .iso-top, .mc-led .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--mc-led) calc(var(--lamp, 0) * 100%)); stroke: none; }
.mc-led { filter: drop-shadow(0 0 calc(var(--lamp, 0) * 4px) var(--mc-light)); }
.mc-oil { opacity: 0; transition: opacity 0.35s var(--anatomy-ease, ease); }
.mc-scope[data-oil] .mc-oil { opacity: 1; }
.mc-oil .iso-top, .mc-oil .iso-shade { fill: var(--mc-oil); fill-opacity: 0.75; stroke: none; }
.mc-rubber .iso-top, .mc-rubber .iso-shade { fill: var(--mc-rubber); stroke: none; }
.mc-pcb .iso-top, .mc-pcb .iso-shade { fill: color-mix(in oklab, var(--mc-pcb) 55%, var(--anatomy-shade-0)); stroke: none; }
.mc-bottle .iso-top, .mc-bottle .iso-shade { fill: color-mix(in oklab, var(--mc-bottle) 70%, var(--anatomy-shade-1)); stroke: none; }
.mc-frost .iso-top { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--anatomy-hi) 12%); }
.mc-cavity .iso-top { fill: var(--mc-cav-top); }
.mc-cavity .iso-shade[data-shade="0"] { fill: var(--mc-cav-0); }
.mc-cavity .iso-shade[data-shade="1"] { fill: var(--mc-cav-1); }
.mc-cavity .iso-shade[data-shade="2"] { fill: var(--mc-cav-2); }
.mc-cavity .iso-shade[data-shade="3"] { fill: var(--mc-cav-3); }

.mc-slot { fill: var(--anatomy-shade-0); }

/* Vòng màu trên vật kính (mã màu độ phóng đại; vòng đen: dùng dầu) */
.mc-band .iso-top, .mc-band .iso-shade { stroke: none; }
.mc-band[data-mag="4"] .iso-top, .mc-band[data-mag="4"] .iso-shade { fill: var(--mc-band-4); }
.mc-band[data-mag="10"] .iso-top, .mc-band[data-mag="10"] .iso-shade { fill: var(--mc-band-10); }
.mc-band[data-mag="40"] .iso-top, .mc-band[data-mag="40"] .iso-shade { fill: var(--mc-band-40); }
.mc-band[data-mag="100"] .iso-top, .mc-band[data-mag="100"] .iso-shade { fill: var(--mc-band-100); }
.mc-band[data-mag="oil"] .iso-top, .mc-band[data-mag="oil"] .iso-shade { fill: var(--mc-band-oil); }
.mc-band .iso-shade[data-shade="0"], .mc-band .iso-shade[data-shade="1"] { filter: brightness(0.82); }

/* Mẫu nhuộm trên lam kính */
.mc-patch { fill: var(--mc-iodine-cell); fill-opacity: 0.55; stroke: none; }
.mc-patch[data-specimen="blood"] { fill: var(--mc-rbc); fill-opacity: 0.4; }

/* Ô thị trường */
.mc-stage { position: relative; touch-action: pan-y; cursor: pointer; }
.mc-stage:focus { outline: none; }
.mc-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.mc-view { position: absolute; left: var(--vx, 4%); top: var(--vy, 6%); width: var(--vs, 30%); aspect-ratio: 1; border-radius: 50%; pointer-events: none; }
.mc-view canvas { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--mc-view-rim); }
.mc-view-ring { position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--mc-view-ring); box-shadow: inset 0 0 0 4px var(--anatomy-paper), inset 0 0 0 5px var(--mc-view-ring); }

(198 × 398 × 386 mm, 5,9 kg), góc trước phải của đế cắt mở. Đèn LED 0,5 W chiếu lên qua thấu kính hội tụ và thấu kính trường, tụ quang Abbe (NA 1,25) gom ánh sáng vào mẫu; màng chắn sáng chỉnh bằng cần gạt. Mâm vật kính quay vào trong, bốn vật kính plan achromat đồng tiêu 45 mm: 4× NA 0,10 (WD 27,8 mm), 10× NA 0,25 (8,0 mm), 40× NA 0,65 (0,6 mm), 100× dầu NA 1,25 (0,13 mm). Độ phóng đại tổng bằng vật kính × thị kính 10×; thị trường bằng 20 mm chia độ phóng đại vật kính; độ phân giải d = 0,61 λ / NA với λ = 550 nm. Lấy nét bằng nâng bàn, hành trình 15 mm, chốt chặn trên. Vật kính 100× phải có giọt dầu soi (n = 1,515) giữa đầu vật kính và lá kính; thiếu dầu thì ảnh tối và nhòe. Bên trong đế (bo LED, tản nhiệt, thấu kính hội tụ), thanh răng lấy nét và cơ cấu bàn vẽ theo cấu tạo điển hình, không theo sơ đồ của hãng.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }

function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {

                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);

    if (run)

}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);

        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;

    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)

    }

        for (let index = 0; index < count; index++) {

                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const R = right.map((point) => iso(point, P));

  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    top: buckets[4].join(""),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);

function sphereOf(centre, r, P, { steps = 48 } = {}) {

  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },

function solidOf(profile, F, P, options = {}) {

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {

  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;

    const [sb, rb] = profile[index];

    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;

    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];

    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];

    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {

function circleOf(F, s, r, P, steps = 0) {

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {

//   ví dụ https://www.slideshare.net/slideshow/as-biology-lesson-2-measuring-cells/14109308), nhân khoảng 10–20 µm;

  size: { w: 198, d: 398, h: 386 }, // mm

  stageTop: 190, // mm, cao mặt bàn ở đỉnh hành trình (theo bản vẽ kích thước)

/** Vật kính của CX23 (plan achromat). wd: khoảng cách làm việc (mm), n: chiết suất môi trường giữa vật kính và lá kính. */
const OBJECTIVES = [
  { mag: 4, NA: 0.1, wd: 27.8, immersion: "air", n: 1.0, color: "red" },
  { mag: 10, NA: 0.25, wd: 8.0, immersion: "air", n: 1.0, color: "yellow" },
  { mag: 40, NA: 0.65, wd: 0.6, immersion: "air", n: 1.0, color: "lightblue" },

  coverslip: 0.17, // mm, lá kính số 1½
  slide: 1.0, // mm, lam kính 76 × 26 × 1
  coarseStroke: 15, // mm

  finePerTurn: 100, // µm mỗi vòng (giả định)
  stopAbove: 100, // µm: chốt chặn đặt cao hơn vị trí nét 0,1 mm (thấp hơn WD của 100×)

const LAMBDA = 550; // nm, ánh sáng xanh lục giữa phổ nhìn thấy
const OIL_N = 1.515; // dầu soi kính

const EYE_E = (250e3 * Math.tan(Math.PI / 180 / 60)) / EYEPIECE.mag; // µm ở ảnh trung gian, ≈ 7,3

/** Vật kính theo độ phóng đại (4, 10, 40, 100). Không có thì trả về 40×. */
const objectiveOf = (mag) => OBJECTIVES.find((o) => o.mag === Number(mag)) ?? OBJECTIVES[2];

/** Độ phóng đại tổng = vật kính × thị kính. */
const totalMagnification = (objective, eyepiece = EYEPIECE) => objectiveOf(objective.mag ?? objective).mag * eyepiece.mag;

/** Độ phân giải Rayleigh d = 0,61 λ / NA, kết quả µm. */
const resolution = (NA, lambda = LAMBDA) => (0.61 * lambda) / 1000 / NA;

/** Đường kính thị trường trên mẫu (mm) = FN / độ phóng đại vật kính. */
const fieldOfView = (mag, fn = EYEPIECE.fn) => fn / mag;

/**
 * Độ sâu trường (µm): λ n / NA² + n e / (M · NA).
 * @param {{NA:number, mag:number, n?:number}} o vật kính
 * @param {{lambda?:number, e?:number}} [opt] λ (nm) và e (µm ở ảnh trung gian, mặc định theo mắt qua thị kính 10×)
 */
function depthOfField(o, { lambda = LAMBDA, e = EYE_E } = {}) {
  const n = o.n ?? 1;
  return ((lambda / 1000) * n) / (o.NA * o.NA) + (n * e) / (o.mag * o.NA);
}

/** Chiều dài thân vật kính từ vai tới đầu (mm): đồng tiêu 45 mm trừ WD và lá kính. */
const objectiveLength = (o) => FOCUS.parfocal - o.wd - FOCUS.coverslip;

const clampStage = (z) => Math.min(STAGE_RANGE[1], Math.max(STAGE_RANGE[0], z));

/** Góc quay của núm (độ) khi bàn đi được dz µm: núm thô theo hành trình mỗi vòng, núm tinh theo 100 µm/vòng. */
const knobTurn = (dz, which = "coarse") => (dz / (which === "fine" ? FOCUS.finePerTurn : FOCUS.coarsePerTurn * 1000)) * 360;

/**
 * Trạng thái ảnh với vật kính, vị trí bàn và dầu soi.
 * @param {{objective?:number, stage?:number, oil?:boolean}} s objective: 4|10|40|100; stage: µm so với vị trí nét; oil: có giọt dầu giữa vật kính và lá kính
 * @returns {{objective:object, total:number, fov:number, resolution:number, dof:number, defocus:number, blur:number, sharpness:number, brightness:number, oilMissing:boolean, oilWasted:boolean, label:string}}
 *   fov mm; resolution, dof, defocus, blur µm (bán kính vết mờ trên mẫu); sharpness, brightness 0–1.
 */
function viewState({ objective = 40, stage = 0, oil = false } = {}) {
  const o = objectiveOf(objective);
  const oilMissing = o.immersion === "oil" && !oil;
  const oilWasted = o.immersion !== "oil" && oil && o.mag >= 40; // dầu dính vào vật kính khô 40×: ảnh mờ, phải lau
  const n = oilMissing ? 1.0 : o.n;
  const NA = oilMissing ? Math.min(o.NA, 0.95) : o.NA;
  const dz = clampStage(stage);
  const dof = depthOfField({ ...o, n, NA });
  const res = resolution(NA);
  const cone = Math.tan(Math.asin(Math.min(0.999, NA / n)));
  const aberr = oilMissing ? 1.5 : oilWasted ? 2.5 : 0;
  const geo = Math.max(0, Math.abs(dz) - dof / 2) * cone;
  const blur = Math.hypot(res / 2, geo, aberr);
  const sharpness = 1 / (1 + (Math.abs(dz) / dof) ** 2) / (oilMissing || oilWasted ? 2 : 1);
  const brightness = oilMissing ? 0.45 : 1;
  const focus = Math.abs(dz) <= dof / 2 ? "nét" : Math.abs(dz) <= dof * 3 ? "hơi mờ" : "mờ";
  const label = oilMissing ? `${focus === "nét" ? "nhòe" : focus} · thiếu dầu` : oilWasted ? "nhòe · dầu dính vật kính khô" : focus;
  return { objective: o, total: totalMagnification(o), fov: fieldOfView(o.mag), resolution: res, dof, defocus: dz, blur, sharpness, brightness, oilMissing, oilWasted, label };
}

/** Mẫu có sẵn. size: kích thước đặc trưng (µm). */
const SPECIMENS = {
  onion: { name: "Biểu bì vảy hành", stain: "iodine (Lugol)", cell: { length: 230, width: 80 }, nucleus: 15 },
  blood: { name: "Phết máu", stain: "Wright-Giemsa", rbc: 7.5, wbc: 11, platelet: 2.5 },
};
const specimenOf = (id) => (SPECIMENS[id] ? id : "onion");
// Mâm vật kính xoay (kiểu quay vào trong) với bốn vật kính, dựng lại theo góc xoay φ.
// Dùng chung cho bản dựng (Node: ghi hình dạng từng tư thế cho bước kiểm tra) và trang (vẽ lại mỗi khung khi xoay).
// Trục mâm nghiêng β so với phương thẳng đứng, đầu dưới ngả về phía tay cầm (−x); mỗi vật kính lệch β so với trục mâm,
// nên vật kính ở vị trí làm việc (góc 0) thẳng đứng trên trục quang, ba cái còn lại ngả về phía sau, chừa chỗ trên bàn.
// D: { C, beta, rho, h, objectives: [{ mag, L, profile, band:[s0,s1], oil:[s0,s1]|null, tip }], turret }

function makeNose(k, G, P, D) {
  const V = G.viewOf(P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);
  const b = D.beta;
  const A = [-Math.sin(b), 0, -Math.cos(b)]; // trục mâm, hướng xuống
  const UPA = G.mul3(A, -1);
  const R0 = [Math.cos(b), 0, -Math.sin(b)]; // hướng bán kính tới vật kính làm việc
  const W = [0, 1, 0];
  const TF = G.frameOf(D.C, UPA, R0, W); // khung của mâm: s dọc trục lên trên
  const radial = (a) => G.add3(G.mul3(R0, Math.cos(a)), G.mul3(W, Math.sin(a)));
  const STEP = Math.PI / 2;

  // Khung của vật kính thứ i khi mâm xoay φ: gốc ở vai vật kính, trục a hướng xuống dọc thân.
  function objFrame(i, phi) {
    const a = phi - i * STEP;
    const r = radial(a);
    const seat = G.add3(G.add3(D.C, G.mul3(A, D.h)), G.mul3(r, D.rho));
    const axis = G.add3(G.mul3(A, Math.cos(b)), G.mul3(r, Math.sin(b)));
    return G.frameAlong(seat, axis);
  }

  const T = D.turret;
  const turretProfile = [[T.s0, T.ring], [T.ringTop, T.ring], [T.ringTop + 2, T.ring - 2, 1], [T.ringTop + 4, T.ring - 6, 1], [T.top, T.topR]];

  // Mâm có đáy phẳng (mặt phẳng Π vuông góc với trục mâm); mọi vật kính nằm dưới Π, chỉ mép vai lẫn vào trong mâm.
  // Nhìn từ trên xuống, mâm luôn che vật kính ở chỗ chồng nhau, nên vẽ hết vật kính trước rồi mới vẽ mâm.
  function parts(phi) {
    const list = D.objectives.map((o, i) => {
      const F = objFrame(i, phi);
      const mid = G.add3(F.o, G.mul3(F.a, o.L / 2));
      return { o, i, F, depth: G.dot3(mid, V) };
    });
    return list.sort((x, y) => x.depth - y.depth);
  }

  function objectiveSvg({ o, F }) {
    const grip = k.fadedSvg(G.ribsOf(F, D.grip[0], D.grip[1], o.profile[2][1], 24, P, { fade: [0.1, 0.55] }), { tone: "lo" });
    const body = S(G.solidOf(o.profile, F, P, { smooth: false }), {
      tone: "mid",
      inner: grip + Ln(G.arcOf(F, D.grip[1], o.profile[2][1], P), { tone: "faint" }),
    });
    const band = `<g class="mc-band" data-mag="${o.mag}">${S(G.ringBand(o.band[0], o.band[1], o.bandR - 0.3, o.bandR + 0.25, F, P, { steps: 40 }), { tone: "hi", crease: "none" })}</g>`;
    const oil = o.oil ? `<g class="mc-band" data-mag="oil">${S(G.ringBand(o.oil[0], o.oil[1], o.oilR - 0.3, o.oilR + 0.25, F, P, { steps: 32 }), { tone: "lo", crease: "none" })}</g>` : "";
    const lens = Ln(G.circleOf(F, o.L, o.tip * 0.62, P, 24), { tone: "lo" });
    return `<g data-obj="${o.mag}">${body}${band}${oil}${lens}</g>`;
  }

  function lo(phi) {
    return parts(phi).map(objectiveSvg).join("");
  }
  // Thân mâm tròn xoay nên hình không đổi theo φ; chỉ các khía trên vòng cầm xoay theo
  let turretBody = null;
  function hi(phi) {
    turretBody ??= [G.solidOf(turretProfile, TF, P), Ln(G.arcOf(TF, T.ringTop, T.ring, P), { tone: "faint" }), S(G.disc(T.top, T.mountTop, T.mountR, TF, P), { tone: "lo" })];
    const ribs = k.fadedSvg(G.ribsOf(TF, 0.2, T.ringTop - 0.2, T.ring, 48, P, { phase: phi, fade: [0.12, 0.55] }), { tone: "lo" });
    return S(turretBody[0], { tone: "mid", inner: ribs + turretBody[1] }) + turretBody[2];
  }

  // Hình dạng thật để kiểm tra (mỗi tư thế nghỉ một bộ)
  function shapes(phi, A_, tag) {
    return parts(phi).map(({ o, F }) => A_.solid(F, o.profile, { name: `nose${tag}.obj${o.mag}`, owner: "nose" }));
  }
  function turretShapes(A_, tag) {
    return [
      A_.solid(TF, turretProfile, { name: `nose${tag}.turret`, owner: "nose" }),
      A_.disc(TF, T.top, T.mountTop, T.mountR, { name: `nose${tag}.mount`, owner: "nose" }),
    ];
  }
  const tipOf = (i, phi) => {
    const F = objFrame(i, phi);
    return G.add3(F.o, G.mul3(F.a, D.objectives[i].L));
  };
  return { lo, hi, shapes, turretShapes, objFrame, tipOf, TF, A, STEP, mountCentre: G.add3(D.C, G.mul3(UPA, T.mountTop)) };
}
// Phần chạy trong trang: núm chỉnh thô/tinh nâng hạ bàn, mâm vật kính xoay, kẹp mẫu dịch X, giọt dầu soi,
// ô thị trường vẽ mẫu (biểu bì hành nhuộm iodine hoặc phết máu Wright-Giemsa) theo mô hình quang học trong model.mjs.
const D = {"P":{"origin":[343.7088762993773,451.4064786054124],"scale":1.0251868032929858,"azimuth":40,"elevation":30},"nose":{"C":[40.750833828339644,0,245.1989032523092],"beta":0.2617993877991494,"rho":21,"h":4,"grip":[2.2,8],"turret":{"s0":-4,"ring":32,"ringTop":5,"top":11,"topR":18,"mountTop":15,"mountR":16},"objectives":[{"mag":4,"L":17.029999999999998,"profile":[[0,10.5],[2.2,10.5],[2.2,9.6],[13.029999999999998,9.6],[16.029999999999998,7.4],[17.029999999999998,6.2]],"tip":6.2,"band":[9,10.8],"bandR":9.6,"oil":null,"oilR":7.2,"front":false},{"mag":10,"L":36.83,"profile":[[0,10.5],[2.2,10.5],[2.2,9.6],[23.83,9.6],[28.83,6.6],[35.43,5.2],[36.83,4.1]],"tip":4.1,"band":[12,13.8],"bandR":9.6,"oil":null,"oilR":7.2,"front":false},{"mag":40,"L":44.23,"profile":[[0,10.5],[2.2,10.5],[2.2,9.6],[26.5,9.6],[28,7.2],[41.23,7.2],[43.23,5],[44.23,3.4]],"tip":3.4,"band":[12,13.8],"bandR":9.6,"oil":null,"oilR":7.2,"front":true},{"mag":100,"L":44.699999999999996,"profile":[[0,10.5],[2.2,10.5],[2.2,9.6],[26.5,9.6],[28,7.2],[41.699999999999996,7.2],[43.699999999999996,5],[44.699999999999996,2.6]],"tip":2.6,"band":[12,13.8],"bandR":9.6,"oil":[38.49999999999999,40.099999999999994],"oilR":7.2,"front":true}]},"travel":15,"pose":2,"knob":{"frame":{"o":[-72,0,96],"a":[0,1,0],"u":[0,0,1],"v":[1,0,0]},"coarse":{"s0":54,"s1":74,"r":24},"fine":{"s0":74,"s1":92,"r":13}},"xy":{"x":14,"y":72,"kx":[108,138,9.5],"ky":[144,158,11]},"slide":{"x0":47,"x1":73,"y0":-38,"y1":38,"z0":190,"z1":191},"cover":{"x0":49,"x1":71,"y0":-11,"y1":11,"z1":191.17},"slots":[{"lo":"lo0","hi":"hi0"},{"lo":"lo1","hi":"hi1"},{"lo":"lo2","hi":"hi2"},{"lo":"lo3","hi":"hi3"}]};
const P = D.P;

const stage = document.querySelector(".iso-stage");

  fine: { x: 0, target: 0 }, // µm do núm tinh
  slideX: { x: 0, target: 0 }, // mm, dịch theo X của người dùng (trục y của hình)

if (RUN && Number.isFinite(Number(RUN.focus))) state.coarse = { x: clampStage(Number(RUN.focus)), target: clampStage(Number(RUN.focus)) };

let frame = 0;

// ——— Thao tác ———
function setObjective(index) {
  index = ((index % 4) + 4) % 4;
  const turns = Math.round((state.phi.x - index * STEP) / TAU);
  state.pose = index;
  state.phiTarget = index * STEP + turns * TAU;
  const v = viewState({ objective: magNow(), stage: stageTarget(), oil: state.oil });
  say(`Vật kính ${magNow()}×, NA ${decimal(v.objective.NA, 2)}: độ phóng đại ${v.total}×, thị trường ${decimal(v.fov, 2)} mm.${v.oilMissing ? " Cần nhỏ dầu soi." : ""}`);
}
state.phiTarget = state.phi.x;
function focusBy(dz, which) {
  const total = stageTarget();
  const next = clampStage(total + dz);
  const step = next - total;
  if (which === "fine") state.fine.target += step;
  else state.coarse.target += step;
  if (step !== dz) say(next >= STAGE_RANGE[1] ? "Bàn chạm chốt chặn trên." : "Bàn đã xuống hết hành trình 15 mm.");
}
function moveX(dx) { state.slideX.target = clampX(state.slideX.target + dx); }

// ——— Mô phỏng theo thời gian ———
const follow = (s, dt, tau, calm) => {
  if (calm) { s.x = s.target; return false; }
  s.x += (s.target - s.x) * (1 - Math.exp(-dt / tau));
  if (Math.abs(s.target - s.x) < 1e-3) { s.x = s.target; return false; }
  return true;
};
function stepPhi(dt, calm) {
  const L = state.phi;
  if (calm) { L.x = state.phiTarget; L.v = 0; return false; }
  const w = 1 / 0.16;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (state.phiTarget - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  // Chốt bi của mâm: gần tới vị trí thì bật vào khấc
  if (Math.abs(state.phiTarget - L.x) < 0.004) { L.x = state.phiTarget; L.v = 0; return false; }

}
function update(dt, calm) {
  const a = follow(state.coarse, dt, 0.22, calm);
  const b = follow(state.fine, dt, 0.12, calm);
  const c = follow(state.slideX, dt, 0.25, calm);
  const d = stepPhi(dt, calm);
  const target = state.oil ? 1 : 0;
  state.oilShown = target;
  return a || b || c || d;
}

// ——— Vẽ phần máy ———
const knobF = D.knob.frame;
const UPXY = G.frameOf([D.xy.x, D.xy.y, 0], [0, 0, 1], [1, 0, 0], [0, 1, 0]);
let lastKnob = "";
function drawMachine() {
  const z = stageZ();
  const dz = (z - STAGE_RANGE[1]) / 1000; // mm so với đỉnh hành trình (≤ 0)
  const dy = state.slideX.x;
  const tStage = translateAlong(P, [0, 0, dz]);
  const tSlide = translateAlong(P, [0, dy, dz]);
  for (const g of el.moving) g.setAttribute("transform", g.dataset.move === "slide" ? tSlide : tStage);
  // Núm thô quay theo hành trình của núm thô; núm tinh nằm ngoài cùng trục nên quay theo cả hai
  const coarseA = (knobTurn(state.coarse.x, "coarse") * Math.PI) / 180;
  const fineA = coarseA + (knobTurn(state.fine.x, "fine") * Math.PI) / 180;
  const kxA = (dy / 20) * TAU; // giả định 20 mm mỗi vòng núm X
  const key = `${coarseA.toFixed(4)}|${fineA.toFixed(4)}|${kxA.toFixed(4)}`;
  if (key !== lastKnob) {
    lastKnob = key;
    const C = D.knob.coarse;
    const F = D.knob.fine;
    el.ribsCoarse.innerHTML = fadedSvg(G.ribsOf(knobF, C.s0, C.s1, C.r, 64, P, { phase: coarseA, fade: [0.08, 0.5] }), { tone: "lo" });
    el.ribsFine.innerHTML = fadedSvg(G.ribsOf(knobF, F.s0, F.s1, F.r, 40, P, { phase: fineA, fade: [0.08, 0.5] }), { tone: "lo" });
    el.ticksFine.innerHTML = lineSvg(G.spokesOf(knobF, F.s1, 8.6, F.r, 40, P, { phase: fineA }), { tone: "lo" });
    const [x0, x1, rx] = D.xy.kx;
    el.ribsKx.innerHTML = fadedSvg(G.ribsOf(UPXY, x0, x1, rx, 36, P, { phase: kxA, fade: [0.08, 0.5] }), { tone: "lo" });
  }
  // Mâm vật kính: vẽ lại vào chỗ của tư thế nghỉ gần nhất
  const phi = state.phi.x;
  const pose = (((Math.round(phi / STEP) % 4) + 4) % 4);
  const phiKey = phi.toFixed(4);
  if (pose !== drawnPose || phiKey !== drawnPhi) {
    if (pose !== drawnPose) el.slots.forEach((s, i) => { if (i !== pose) { s.lo.innerHTML = ""; s.hi.innerHTML = ""; } });
    el.slots[pose].lo.innerHTML = NOSEM.lo(phi);
    el.slots[pose].hi.innerHTML = NOSEM.hi(phi);
    drawnPose = pose;
    drawnPhi = phiKey;
  }
  el.scope.toggleAttribute("data-oil", state.oil);
  el.scope.style.setProperty("--lamp", "1");
}

// Vùng mẫu trên lam kính (µm, gốc ở tâm lam): biên dạng khép kín, dùng cho cả hình lam kính và ô thị trường
function blobR(spec, a) {
  if (spec === "blood") return 9000 * (1 + 0.1 * Math.sin(2 * a + 0.4) + 0.04 * Math.sin(5 * a + 1.3));
  return 7200 * (1 + 0.09 * Math.sin(3 * a + 1) + 0.05 * Math.sin(5 * a + 2.2) + 0.03 * Math.sin(7 * a));
}
const inBlob = (spec, x, y) => Math.hypot(x, y) < blobR(spec, Math.atan2(y, x));
function drawPatch() {
  const S = D.slide;
  const pts = [];
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * TAU;
    const r = Math.min(blobR(state.specimen, a), 10500) / 1000;
    // x mẫu (X người dùng) dọc trục y của hình, y mẫu dọc trục x
    pts.push(iso([(S.x0 + S.x1) / 2 + Math.max(-10.6, Math.min(10.6, r * Math.sin(a))), Math.max(-10.6, Math.min(10.6, r * Math.cos(a))), S.z1 + 0.02], P));
  }
  el.patch.innerHTML = `<path class="mc-patch" data-specimen="${state.specimen}" d="${pathOf(pts, true)}"/>`;
}

// ——— Ô thị trường ———
const hash = (a, b, c = 0) => {
  let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const css = (name) => getComputedStyle(stage).getPropertyValue(name).trim() || "#888";
let colors = null;
let grain = null;
function palette() {
  colors = {
    bg: css("--mc-view-bg"), rim: css("--mc-view-rim"), wall: css("--mc-iodine-wall"), cell: css("--mc-iodine-cell"), nucleus: css("--mc-iodine-nucleus"),
    rbc: css("--mc-rbc"), rbcPale: css("--mc-rbc-pale"), wbc: css("--mc-wbc"), plt: css("--mc-plt"), smear: css("--mc-smear"),
  };
  // Hạt mịn cho phết máu ở độ phóng đại thấp (mỗi hạt là vài hồng cầu, nhỏ hơn 1 px)
  const g = document.createElement("canvas");
  g.width = g.height = 64;
  const gx = g.getContext("2d");
  for (let i = 0; i < 900; i++) {
    gx.fillStyle = hash(i, 7) < 0.5 ? colors.rbc : colors.rbcPale;
    gx.globalAlpha = 0.35 + 0.4 * hash(i, 9);
    gx.fillRect(Math.floor(hash(i, 1) * 64), Math.floor(hash(i, 2) * 64), 1, 1);
  }
  grain = g;
}

function drawOnion(c, s, cx, cy, R) {
  // Tế bào xếp thành hàng dọc theo X; mỗi hàng cao ~80 µm, mỗi tế bào dài ~230 µm, vách ngang lệch ngẫu nhiên
  const H = SPECIMENS.onion.cell.width;
  const Lc = SPECIMENS.onion.cell.length;
  const j0 = Math.floor((cy - R) / H) - 1;
  const j1 = Math.ceil((cy + R) / H) + 1;
  const wall = Math.max(0.7, 2.6 * s);
  const edgeAt = (j, k) => k * Lc + hash(j, 11) * Lc + (hash(j, k, 3) - 0.5) * 90;
  const rowY = (j, x) => j * H + 10 * Math.sin(x / 400 + j * 1.7) + (hash(j, 5) - 0.5) * 12;
  const X = (x) => (x - cx) * s;
  const Y = (y) => (y - cy) * s;
  c.lineJoin = "round";
  for (let j = j0; j <= j1; j++) {
    const k0 = Math.floor((cx - R) / Lc) - 2;
    const k1 = Math.ceil((cx + R) / Lc) + 2;
    for (let k = k0; k <= k1; k++) {
      const xa = edgeAt(j, k);
      const xb = edgeAt(j, k + 1);
      const xm = (xa + xb) / 2;
      if (!inBlob("onion", xm, j * H + H / 2)) continue;
      const ya0 = rowY(j, xa), ya1 = rowY(j + 1, xa), yb0 = rowY(j, xb), yb1 = rowY(j + 1, xb);
      c.beginPath();
      c.moveTo(X(xa), Y(ya0));
      c.lineTo(X(xb), Y(yb0));
      c.lineTo(X(xb + (hash(j, k + 1, 8) - 0.5) * 30), Y(yb1));
      c.lineTo(X(xa + (hash(j, k, 8) - 0.5) * 30), Y(ya1));
      c.closePath();
      c.globalAlpha = 0.55 + 0.25 * hash(j, k, 4);
      c.fillStyle = colors.cell;
      c.fill();
      c.globalAlpha = 0.9;
      c.strokeStyle = colors.wall;
      c.lineWidth = wall;
      c.stroke();
      // Nhân và hạch nhân
      const nx = xa + (0.25 + 0.5 * hash(j, k, 6)) * (xb - xa);
      const ny = (ya0 + ya1) / 2 + (hash(j, k, 7) - 0.5) * 30;
      const nr = SPECIMENS.onion.nucleus / 2;
      c.globalAlpha = 0.85;
      c.fillStyle = colors.nucleus;
      c.beginPath();
      c.ellipse(X(nx), Y(ny), Math.max(0.5, nr * 1.25 * s), Math.max(0.4, nr * s), 0.2, 0, TAU);
      c.fill();
      if (s > 0.4) {
        c.globalAlpha = 0.9;
        c.fillStyle = colors.wall;
        c.beginPath();
        c.arc(X(nx + 2), Y(ny - 1), 2.2 * s, 0, TAU);
        c.fill();
      }
    }
  }
  c.globalAlpha = 1;
}

function drawBlood(c, s, cx, cy, R) {
  const rbc = SPECIMENS.blood.rbc;
  const X = (x) => (x - cx) * s;
  const Y = (y) => (y - cy) * s;
  if (rbc * s < 1.6) {
    // Độ phóng đại thấp: hồng cầu nhỏ hơn 1–2 px, thấy thành nền hồng lấm tấm; bạch cầu là chấm tím
    const pat = c.createPattern(grain, "repeat");
    const k = Math.max(0.25, (rbc * s) / 1.2);
    pat.setTransform(new DOMMatrix([k, 0, 0, k, -cx * s, -cy * s]));
    c.save();
    c.beginPath();
    for (let i = 0; i <= 72; i++) {
      const a = (i / 72) * TAU;
      const r = blobR("blood", a);
      c.lineTo(X(r * Math.cos(a)), Y(r * Math.sin(a)));
    }
    c.clip();
    c.fillStyle = colors.smear;
    c.fillRect(-R * s, -R * s, 2 * R * s, 2 * R * s);
    c.fillStyle = pat;
    c.fillRect(-R * s, -R * s, 2 * R * s, 2 * R * s);
    c.restore();
  } else {
    const g = 9; // µm, lưới đặt hồng cầu (lớp đơn, phủ khoảng 60 %)
    for (let i = Math.floor((cx - R) / g); i <= Math.ceil((cx + R) / g); i++) {
      for (let j = Math.floor((cy - R) / g); j <= Math.ceil((cy + R) / g); j++) {
        if (hash(i, j, 21) > 0.82) continue;
        const x = i * g + (hash(i, j, 22) - 0.5) * 5;
        const y = j * g + (hash(i, j, 23) - 0.5) * 5;
        if (!inBlob("blood", x, y)) continue;
        const r = (rbc / 2) * (0.9 + 0.2 * hash(i, j, 24));
        c.fillStyle = colors.rbc;
        c.beginPath();
        c.arc(X(x), Y(y), r * s, 0, TAU);
        c.fill();
        if (r * s > 2) {
          c.fillStyle = colors.rbcPale;
          c.beginPath();
          c.arc(X(x), Y(y), r * s * 0.42, 0, TAU);
          c.fill();
        }
      }
    }
    // Tiểu cầu
    const gp = 14;
    c.fillStyle = colors.plt;
    for (let i = Math.floor((cx - R) / gp); i <= Math.ceil((cx + R) / gp); i++) {
      for (let j = Math.floor((cy - R) / gp); j <= Math.ceil((cy + R) / gp); j++) {
        if (hash(i, j, 31) > 0.22) continue;
        const x = i * gp + hash(i, j, 32) * gp;
        const y = j * gp + hash(i, j, 33) * gp;
        if (!inBlob("blood", x, y)) continue;
        c.beginPath();
        c.arc(X(x), Y(y), Math.max(0.5, (SPECIMENS.blood.platelet / 2) * s), 0, TAU);
        c.fill();
      }
    }
  }
  // Bạch cầu: trung tính (nhân 3 thuỳ) hoặc lympho (nhân tròn lớn)
  const gw = 70;
  for (let i = Math.floor((cx - R) / gw); i <= Math.ceil((cx + R) / gw); i++) {
    for (let j = Math.floor((cy - R) / gw); j <= Math.ceil((cy + R) / gw); j++) {
      if (hash(i, j, 41) > 0.09) continue;
      const x = i * gw + hash(i, j, 42) * gw;
      const y = j * gw + hash(i, j, 43) * gw;
      if (!inBlob("blood", x, y)) continue;
      const r = (SPECIMENS.blood.wbc / 2) * s;
      c.fillStyle = colors.rbcPale;
      c.beginPath();
      c.arc(X(x), Y(y), Math.max(0.6, r), 0, TAU);
      c.fill();
      c.fillStyle = colors.wbc;
      if (r < 2.5) {
        c.beginPath();
        c.arc(X(x), Y(y), Math.max(0.6, r * 0.8), 0, TAU);
        c.fill();
      } else if (hash(i, j, 44) < 0.6) {
        for (let l = 0; l < 3; l++) {
          const a = l * 2.1 + hash(i, j, 45) * 6;
          c.beginPath();
          c.arc(X(x) + Math.cos(a) * r * 0.42, Y(y) + Math.sin(a) * r * 0.42, r * 0.34, 0, TAU);
          c.fill();
        }
      } else {
        c.beginPath();
        c.arc(X(x) + r * 0.08, Y(y), r * 0.78, 0, TAU);
        c.fill();
      }
    }
  }
}

// Lớp mẫu sắc nét vẽ một lần cho mỗi (vật kính, vị trí lam, mẫu); khi chỉ lấy nét thì chỉ đổi độ mờ lúc ghép.
const sharp = document.createElement("canvas");
const sctx = sharp.getContext("2d");
let sharpKey = "";
function drawView(v) {
  const size = canvas.clientWidth || 160;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const px = Math.round(size * dpr);
  if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
  if (!colors) palette();
  const Rv = px / 2 - 1; // bán kính thị trường trên ảnh (px)
  const fovUm = v.fov * 1000;
  const s = (2 * Rv) / fovUm; // px mỗi µm
  const pad = 30;
  const W2 = px + 2 * pad;
  // Ảnh qua kính hiển vi bị đảo 180°: dịch lam sang phải thì ảnh chạy sang trái
  const cx = -state.slideX.x * 1000;
  const cy = 0;
  const key = `${px}|${v.objective.mag}|${cx.toFixed(1)}|${state.specimen}|${colors.bg}`;
  if (key !== sharpKey) {
    sharpKey = key;
    sharp.width = sharp.height = W2;
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.fillStyle = colors.bg;
    sctx.fillRect(0, 0, W2, W2);
    sctx.translate(W2 / 2, W2 / 2);
    sctx.rotate(Math.PI);
    const R = (W2 / 2) * Math.SQRT2 / s;
    if (state.specimen === "blood") drawBlood(sctx, s, cx, cy, R);
    else drawOnion(sctx, s, cx, cy, R);
  }
  const blurPx = Math.min(28, v.blur * s);
  const contrast = 1 / (1 + (blurPx / (12 * dpr)) ** 2);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, px, px);
  ctx.save();
  ctx.beginPath();
  ctx.arc(px / 2, px / 2, Rv, 0, TAU);
  ctx.clip();
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, px, px);
  // Lệch nét: ảnh nhoè theo bán kính vết mờ của mô hình, độ tương phản giảm dần
  ctx.globalAlpha = contrast;
  ctx.filter = blurPx > 0.35 ? `blur(${blurPx.toFixed(2)}px)` : "none";
  ctx.drawImage(sharp, -pad, -pad);
  ctx.filter = "none";
  ctx.globalAlpha = 1;
  // Độ sáng (thiếu dầu ở 100× thì tối) và viền tối dần ở mép thị trường
  if (v.brightness < 1) {
    ctx.fillStyle = `rgba(0,0,0,${(1 - v.brightness).toFixed(3)})`;
    ctx.fillRect(0, 0, px, px);
  }
  const vg = ctx.createRadialGradient(px / 2, px / 2, Rv * 0.7, px / 2, px / 2, Rv);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.28)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, px, px);
  ctx.restore();
}

function draw() {
  drawMachine();
  const v = viewState({ objective: magNow(), stage: stageZ(), oil: state.oil });
  const key = `${magNow()}|${stageZ().toFixed(2)}|${state.slideX.x.toFixed(4)}|${state.oil}|${state.specimen}|${canvas.clientWidth}|${document.body.dataset.theme}`;
  if (key !== viewKey) { viewKey = key; drawView(v); }
  const turning = Math.abs(state.phi.x - state.phiTarget) > 0.01;
  const text = turning ? `đổi vật kính → ${magNow()}×` : `${v.total}× · Ø ${decimal(v.fov, 2)} mm · ${v.label}`;
  if (readout.textContent !== text) readout.textContent = text;
}

// ——— Vòng giới thiệu: 4× lấy nét thô → tinh, dịch mẫu, 10×, 40×, nhỏ dầu, 100×, hạ bàn, lau dầu, đổi mẫu ———
const TOUR = [
  { t: 1.0, run: () => { setObjective(0); state.oil = false; state.coarse.target = -1500; state.fine.target = 0; say("Vật kính 4×, bàn hạ thấp: ảnh mờ."); } },
  { t: 2.2, run: () => { state.coarse.target = -60; say("Vặn núm thô nâng bàn tới gần vị trí nét."); } },
  { t: 1.6, run: () => { state.fine.target = 60; say("Vặn núm tinh: ảnh nét."); } },
  { t: 1.6, run: () => { moveX(1.5); say("Dịch mẫu theo X bằng núm bàn cơ."); } },
  { t: 1.8, run: () => setObjective(1) },
  { t: 1.8, run: () => setObjective(2) },
  { t: 1.2, run: () => { state.fine.target += 4; } },
  { t: 1.4, run: () => { state.fine.target -= 4; } },
  { t: 2.4, run: () => { setObjective(3); say("Vật kính 100× chưa có dầu: ảnh tối và nhòe."); } },
  { t: 1.4, run: () => setObjective(2) },
  { t: 3.6, run: () => { state.oil = true; setObjective(3); say("Xoay mâm, nhỏ dầu soi lên lá kính rồi đưa vật kính 100× vào: ảnh sáng và nét."); } },
  { t: 2.6, run: () => { state.coarse.target = -1500; say("Hạ bàn, xoay về 4×, lau dầu."); } },
  { t: 1.0, run: () => { setObjective(0); state.oil = false; moveX(-1.5); } },
  { t: 1.4, run: () => nextSpecimen() },
];
function tourStep(dt) {
  tour.t -= dt;
  if (tour.t > 0) return;
  const step = TOUR[tour.step % TOUR.length];
  step.run();
  tour.t = step.t;
  tour.step = (tour.step + 1) % TOUR.length;
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  const moving = update(dt, calm);
  draw();
  frame = visible && !calm && (touring || moving) ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: 0, t: 0 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches) return; touring = true; loop(); }, 12000);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const k = event.key;
  let handled = true;
  if (k === "ArrowUp" || k === "ArrowDown") {
    const sign = k === "ArrowUp" ? 1 : -1;
    if (event.shiftKey) focusBy(sign * FOCUS.fineStep, "fine");
    else focusBy(sign * 250, "coarse");
  } else if (k === "PageUp" || k === "PageDown") focusBy((k === "PageUp" ? 1 : -1) * 10 * FOCUS.fineStep, "fine");
  else if (k === "ArrowRight" || k === "ArrowLeft") moveX((k === "ArrowRight" ? 1 : -1) * (event.shiftKey ? 0.05 : 0.5));
  else if (k === " " || k === "Enter") setObjective(state.pose + 1);
  else if (["1", "2", "3", "4"].includes(k)) setObjective(Number(k) - 1);
  else if (k === "o" || k === "O") toggleOil();
  else if (k === "s" || k === "S") nextSpecimen();
  else handled = false;
  if (!handled) return;
  event.preventDefault();
  takeOver();
  if (still.matches) update(1, true);
  draw();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest('[data-name^="nose@"]')) setObjective(state.pose + 1);
  else if (event.target.closest('[data-name^="knob."]')) focusBy(event.shiftKey ? -250 : 250, "coarse");
  else setObjective(state.pose + 1);
  stage.focus({ preventScroll: true });
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

new ResizeObserver(() => { viewKey = ""; draw(); }).observe(canvas);

drawPatch();
if (still.matches && !RUN) {
  // Khung tiêu biểu: 40×, đúng nét, biểu bì hành nhuộm iodine
  setObjective(2);
}
update(1, true);
draw();
</script></body></html>
