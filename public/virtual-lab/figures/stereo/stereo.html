<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kính lúp soi nổi</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>/* Màu riêng của hình kính lúp soi nổi. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt data-co2 trên nhóm máy khi CO₂ chảy, --lamp (0–1) cho đèn LED. */
.iso {
  --st-glass: #9fc4cf;
  --st-light: #fff2c4;
  --st-led: #fff6d8;
  --st-acrylic: #b9d6de;
  --st-porous: #ecebe4;
  --st-porous-top: #f6f5ef;
  --st-hose: #d9e3e6;
  --st-rubber: #222426;
  --st-wood: #8a5a2b;
  --st-bristle: #3a2a1c;
  --st-food: #b98a3e;
  --st-cotton: #e9e4d6;
  --st-oil: #d8b860;
  --st-switch-on: #3fbf6a;
  --st-switch-off: #5a5d60;
  --st-float: #e5484d;
  --st-index: #e5484d;
  --st-fly: #2a221c;
  --st-fly-eye: #d23a3a;
  --st-fly-eye-white: #f3efe4;
  --st-fly-black: #050505;
  --st-pile-m: #4c8fd6;
  --st-pile-f: #d6619a;
  /* Trường nhìn: mặt tấm trắng dưới đèn LED */
  --st-view-bg: #efeee6;
  --st-view-rim: #050505;
  --st-view-ring: #6a6a6a;
  --st-view-grain: #d9d6ca;
  --fly-eye-red: #c3262c;
  --fly-eye-red-rim: #7d1418;
  --fly-eye-white: #f7f3ea;
  --fly-eye-white-rim: #b9b2a3;
  --fly-body: #b48a55;
  --fly-thorax: #9a7343;
  --fly-band: #4a3320;
  --fly-leg: #6e5232;
  --fly-body-black: #2a2522;
  --fly-thorax-black: #221d1a;
  --fly-band-black: #0e0c0b;
  --fly-leg-black: #1d1917;
  --fly-wing: rgba(170, 185, 200, 0.42);
  --fly-vein: rgba(90, 80, 70, 0.55);
  --fly-comb: #0a0a0a;
}
.iso[data-theme="light"] {
  --st-glass: #7fb0c0;
  --st-light: #ffcf4a;
  --st-led: #ffb800;
  --st-acrylic: #9cc4d0;
  --st-porous: #f4f3ee;
  --st-porous-top: #ffffff;
  --st-hose: #c7d6da;
  --st-rubber: #3a3c3e;
  --st-wood: #a26a33;
  --st-bristle: #4a3624;
  --st-food: #c99a4a;
  --st-cotton: #f2eee2;
  --st-oil: #e0bd52;
  --st-switch-on: #239a4d;
  --st-switch-off: #8a8d90;
  --st-float: #d93a3f;
  --st-index: #d93a3f;
  --st-fly: #2a221c;
  --st-fly-eye: #c42c2c;
  --st-fly-eye-white: #ffffff;
  --st-fly-black: #000000;
  --st-pile-m: #2f78c4;
  --st-pile-f: #c64886;
  --st-view-bg: #f3f2ea;
  --st-view-rim: #1a1a1a;
  --st-view-ring: #8a8a8f;
  --st-view-grain: #dedbd0;
}

/* Thuỷ tinh: trong mờ để thấy vật bên trong */
.st-glass .iso-fill { fill: var(--st-glass); fill-opacity: 0.1; }
.st-glass .iso-top { fill: var(--st-glass); fill-opacity: 0.22; }
.st-glass .iso-shade { fill: var(--st-glass); fill-opacity: 0.3; }
/* Vật liệu có màu: mỗi lớp đặt --mat, bốn sắc độ và mặt trên suy ra từ nó (giữ bóng bốn tông, kể cả mặt cong mịn) */
.st-mat {
  --anatomy-shade-0: color-mix(in oklab, var(--mat) 64%, #000);
  --anatomy-shade-1: color-mix(in oklab, var(--mat) 74%, #000);
  --anatomy-shade-2: color-mix(in oklab, var(--mat) 86%, #000);
  --anatomy-shade-3: var(--mat);
  --anatomy-top: color-mix(in oklab, var(--mat) 86%, #fff);
  --anatomy-lit-top: color-mix(in oklab, var(--mat) 80%, #fff);
  --anatomy-lit-shade: var(--mat);
}
.st-acrylic { --mat: var(--st-acrylic); }
.st-porous { --mat: var(--st-porous); --anatomy-top: var(--st-porous-top); --anatomy-lit-top: var(--st-porous-top); }
.st-rubber { --mat: var(--st-rubber); }
.st-wood { --mat: var(--st-wood); }
.st-bristle { --mat: var(--st-bristle); }
.st-food { --mat: var(--st-food); }
.st-cotton { --mat: var(--st-cotton); }
.st-oil { --mat: var(--st-oil); }
.st-index { --mat: var(--st-index); }
.st-led-on { --mat: var(--st-switch-on); }
.st-switch { --mat: var(--st-switch-off); }
.st-rig[data-co2] .st-switch { --mat: var(--st-switch-on); }
.st-hose .tb-body { fill: color-mix(in oklab, var(--st-hose) 40%, var(--anatomy-paper)); }
.st-slot { fill: var(--anatomy-shade-0); }
.st-led .iso-top, .st-led .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--st-led) calc(var(--lamp, 1) * 100%)); }
.st-led { filter: drop-shadow(0 0 calc(var(--lamp, 1) * 3px) var(--st-light)); }
.st-float { fill: var(--st-float); }
.st-pool { fill: var(--st-light); opacity: 0.13; }

/* Ruồi trên tấm (vẽ nhỏ theo phép chiếu) */
.st-fly { fill: var(--st-fly); }
.st-fly[data-black] { fill: var(--st-fly-black); }
.st-fly-eye { fill: var(--st-fly-eye); }
.st-fly-eye[data-white] { fill: var(--st-fly-eye-white); }
.st-fly-wing { fill: var(--fly-wing); }
.st-pile { fill: none; stroke-width: 0.6; }
.st-pile[data-pile="M"] { stroke: var(--st-pile-m); }
.st-pile[data-pile="F"] { stroke: var(--st-pile-f); }
.st-beam { fill: var(--st-light); opacity: calc(var(--lamp, 1) * 0.16); }

/* Ô trường nhìn */
.st-stage { position: relative; touch-action: pan-y; cursor: pointer; }
.st-stage:focus { outline: none; }
.st-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.st-view { position: absolute; left: var(--vx, 3%); top: var(--vy, 3%); width: var(--vs, 30%); aspect-ratio: 1; border-radius: 50%; pointer-events: none; }
.st-view-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.st-view-bg { fill: var(--st-view-bg); }
.st-view-vignette { fill: url(#st-vignette); }
.st-view-rim { fill: none; stroke: var(--st-view-rim); stroke-width: 2; }
.st-view-grain { fill: var(--st-view-grain); }
.st-view-ring { position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--st-view-ring); box-shadow: inset 0 0 0 4px var(--anatomy-paper), inset 0 0 0 5px var(--st-view-ring); }
.st-view-pile { fill: none; stroke-width: 1.2; stroke-dasharray: 3 3; }
.st-view-pile[data-pile="M"] { stroke: var(--st-pile-m); }
.st-view-pile[data-pile="F"] { stroke: var(--st-pile-f); }
.st-view-cross { stroke: var(--st-view-ring); stroke-width: 0.6; opacity: 0.5; }
.st-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Điện thoại: tiêu đề dài xuống dòng, không đè lên "Fig 20" */
@media (max-width: 520px) {
  .iso-plate-corner[data-corner="title"] { white-space: normal; text-align: right; max-width: 70%; line-height: 1.35; font-size: 9.5px; }

hìn Ø 32,8–4,9 mm</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Ô tròn: trường nhìn qua thị kính 10× (FN 22); ♂ nhỏ, đầu bụng tròn sẫm, có lược sinh dục; ♀ to, bụng nhọn có sọc</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Số đọc: độ phóng đại · trường nhìn (mm) · độ nét · thời gian gây mê; ✗ gạt nhầm giới, † ruồi chết vì CO₂. X bỏ ruồi vào lọ dầu, R đổ lọ ruồi mới</span></span><span class="iso-caption">Kính lúp soi nổi vẽ theo Olympus SZ61 (hệ quang Greenough, zoom 0,67×–4,5×, tỉ lệ 6,7 : 1) với vật kính 1× có sẵn (NA 0,071, khoảng cách làm việc 110 mm) và thị kính 10× số trường 22: độ phóng đại tổng 6,7×–45×, trường nhìn bằng 22 mm chia hệ số zoom. Độ sâu trường theo công thức Berek λ/(2NA²) + 340 µm/(NA·M), giả định NA tăng theo zoom. Tấm CO₂ theo Flystuff Flypad 59-114 (8,1 × 11,6 cm, mặt polyethylene xốp 3 mm trên đế acrylic 12 mm, ống 1/8 in), nối với bộ chỉnh lưu lượng 5–15 L/phút; đèn LED cổ ngỗng kiểu SCHOTT KL 300 LED. Ruồi để trên tấm 2–3 phút là đủ; tắt CO₂ thì khoảng một phút sau ruồi tỉnh, phơi càng lâu càng tỉnh chậm và để hàng chục phút thì một phần ruồi chết, con đực nhiều hơn (thời gian tỉnh và tỉ lệ chết là ước lượng minh hoạ theo Shen 2020 và Bartholomew 2015). Ruồi đã phân loại gạt vào hai đống ♂ và ♀; ruồi gạt vào lọ dầu là bỏ. Đế trụ, khối lấy nét và bộ chỉnh lưu lượng vẽ theo cấu tạo điển hình, không theo bản vẽ của hãng.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];

const PAD = { w: 81, d: 116, top: 3, base: 12, barb: 3, flow: [5, 15] }; // mm; L/phút
const LIGHT = { box: [114, 107, 61], neck: 500, neckR: 3.5 }; // mm

const LAMBDA = 0.55; // µm
/** Các mức zoom có khấc trên núm (vạch khắc trên núm zoom của SZ61). */
const ZOOM_STOPS = [0.67, 0.8, 1, 1.25, 1.6, 2, 2.5, 3, 3.5, 4, 4.5];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
/** Giới hạn zoom trong khoảng 0,67–4,5. */
const clampZoom = (z) => clamp(Number(z) || 1, STEREO.zoom[0], STEREO.zoom[1]);

/** Độ phóng đại tổng = zoom × vật kính phụ × thị kính. */
const totalMagnification = (zoom, aux = 1, eyepiece = EYEPIECE.mag) => clampZoom(zoom) * auxOf(aux).mag * eyepiece;

/** Đường kính trường nhìn trên mẫu (mm) = FN / (zoom × vật kính phụ). */
const fieldOfView = (zoom, aux = 1, fn = EYEPIECE.fn) => fn / (clampZoom(zoom) * auxOf(aux).mag);

/** NA phía vật ở mức zoom này (giả định tỉ lệ với zoom, bằng NA của hãng ở zoom 4,5×). */
const numericalAperture = (zoom, aux = 1) => (auxOf(aux).NA * clampZoom(zoom)) / STEREO.zoom[1];

/** Khoảng cách làm việc (mm) từ đáy vật kính tới mặt mẫu. */
const workingDistance = (aux = 1) => auxOf(aux).wd;

/**
 * Độ sâu trường quan sát bằng mắt (mm), công thức Berek: λ/(2 NA²) + 340 µm/(NA · M).
 * @param {number} zoom hệ số zoom 0,67–4,5
 * @param {number} [aux] vật kính phụ (0,5; 0,75; 1; 1,5; 2)
 */
function depthOfField(zoom, aux = 1) {
  const NA = numericalAperture(zoom, aux);
  const M = totalMagnification(zoom, aux);
  return (LAMBDA / (2 * NA * NA) + 340 / (NA * M)) / 1000;
}

/** Độ phân giải Rayleigh trên mẫu (µm) = 0,61 λ / NA. */
const resolution = (zoom, aux = 1) => (0.61 * LAMBDA) / numericalAperture(zoom, aux);

/**
 * Ảnh qua thị kính với zoom và độ lệch nét.
 * @param {{zoom?:number, aux?:number, defocus?:number}} s defocus: mm, dương = đầu kính cao hơn vị trí nét
 * @returns {{zoom:number, total:number, fov:number, NA:number, dof:number, blur:number, sharpness:number, label:string}}
 *   fov, dof mm; blur: bán kính vết mờ trên mẫu (mm); sharpness 0–1.
 */
function viewState({ zoom = 1, aux = 1, defocus = 0 } = {}) {
  const z = clampZoom(zoom);
  const NA = numericalAperture(z, aux);
  const dof = depthOfField(z, aux);
  const out = Math.max(0, Math.abs(defocus) - dof / 2);
  const blur = Math.hypot(resolution(z, aux) / 2000, out * Math.tan(Math.asin(NA)));
  const sharpness = 1 / (1 + (Math.abs(defocus) / dof) ** 2);
  const label = Math.abs(defocus) <= dof / 2 ? "nét" : Math.abs(defocus) <= dof * 2 ? "hơi mờ" : "mờ";
  return { zoom: z, total: totalMagnification(z, aux), fov: fieldOfView(z, aux), NA, dof, blur, sharpness, label };
}

// ——— Gây mê CO₂ ———
const CO2 = {
  advised: [2, 3], // phút nên để trên tấm
  max: 5, // phút, không nên vượt
  wakeBase: 1.0, // phút để ruồi bắt đầu cử động sau khi rời CO₂ (ước lượng minh hoạ)
  wakePerMin: 0.06, // phút thêm cho mỗi phút đã phơi CO₂ (ước lượng minh hoạ)
  deathFrom: 15, // phút: dưới mức này coi như không chết vì CO₂ (minh hoạ)
  deathMax: 0.35, // tỉ lệ chết tiệm cận của con cái khi phơi rất lâu (minh hoạ)
  deathTau: 120, // phút
  maleFactor: 1.5, // con đực nhạy hơn (Shen 2020: đực bị ảnh hưởng nhiều hơn)
};

/** Thời gian (phút) từ lúc tắt CO₂ tới lúc ruồi bắt đầu bò, theo tổng thời gian đã phơi CO₂ (phút). */
const wakeTime = (exposure) => CO2.wakeBase + CO2.wakePerMin * Math.max(0, exposure);

/**
 * Xác suất ruồi chết vì phơi CO₂ quá lâu (minh hoạ, theo xu hướng của Shen 2020).
 * @param {number} exposure phút
 * @param {"M"|"F"} sex
 */
function co2Mortality(exposure, sex = "F") {
  const t = Math.max(0, exposure - CO2.deathFrom);
  const p = CO2.deathMax * (1 - Math.exp(-t / CO2.deathTau)) * (sex === "M" ? CO2.maleFactor : 1);
  return Math.min(0.95, p);
}

/** Lời khuyên sau khi gây mê, theo tổng thời gian phơi (phút). */
function co2Advice(exposure) {
  if (exposure <= CO2.max) return { level: "ok", text: "Thời gian gây mê an toàn; cho ruồi hồi phục trong lọ mới trước khi làm thí nghiệm hành vi." };
  if (exposure <= 30) return { level: "warn", text: "Gây mê quá 5 phút: ruồi tỉnh chậm, khả năng leo trèo giảm tới khoảng 24 giờ." };
  return { level: "bad", text: "Gây mê quá lâu: một phần ruồi chết (con đực nhiều hơn), ruồi còn sống cần ít nhất 48 giờ hồi phục." };
}

// ——— Ruồi giấm ———
/** Số đo minh hoạ của ruồi trưởng thành (mm). */
const FLY = { lengthF: 2.5, lengthM: 2.0, width: 0.9 };

/** Chuẩn hoá một ruồi: { sex: "M"|"F", white, black, vestigial }. */
const normalizeFly = (f = {}) => ({
  sex: String(f.sex ?? "F").toUpperCase().startsWith("M") || f.sex === "♂" ? "M" : "F",
  white: Boolean(f.white),
  black: Boolean(f.black),
  vestigial: Boolean(f.vestigial),
});

/**
 * Mô tả hình dáng ruồi theo kiểu hình (để vẽ và để hiện chữ).
 * @param {{sex?:string, white?:boolean, black?:boolean, vestigial?:boolean}} fly
 * @returns {{sex:"M"|"F", length:number, sexLabel:string, eye:string, body:string, wing:string, abdomen:string, sexComb:boolean, label:string}}
 */
function flyLook(fly) {
  const f = normalizeFly(fly);
  const male = f.sex === "M";
  const eye = f.white ? "mắt trắng" : "mắt đỏ";
  const body = f.black ? "thân đen" : "thân xám";
  const wing = f.vestigial ? "cánh cụt" : "cánh dài";
  return {
    sex: f.sex,
    length: male ? FLY.lengthM : FLY.lengthF,
    sexLabel: male ? "đực" : "cái",
    eye,
    body,
    wing,
    abdomen: male ? "đầu bụng tròn, các đốt cuối sẫm liền" : "đầu bụng nhọn, sọc sẫm tách rời",
    sexComb: male,
    label: `${male ? "♂" : "♀"} ${eye}, ${body}, ${wing}`,
  };
}

const n2 = (v) => Math.round(v * 100) / 100;
/**
 * Hình ruồi nhìn từ trên xuống, đầu hướng lên trên, dạng chuỗi SVG (không cần DOM).
 * Khung 3 × 3 mm: viewBox -50..50, 1 đơn vị = 0,03 mm; ruồi cái dài 2,5 mm, ruồi đực 2 mm.
 * Màu là biến CSS có giá trị mặc định, trang có thể đổi bằng --fly-*.
 * @param {{sex?:string, white?:boolean, black?:boolean, vestigial?:boolean}} fly
 * @param {number} [size] cạnh hình vuông (px)
 * @param {{asleep?:boolean, step?:number, id?:string}} [opt] asleep: chân co lại (đang mê); step: pha bước chân 0–1
 * @returns {string} `<svg …>…</svg>`
 */
function flySvg(fly, size = 48, { asleep = false, step = 0 } = {}) {
  const f = normalizeFly(fly);
  const male = f.sex === "M";
  const k = (male ? FLY.lengthM : FLY.lengthF) / FLY.lengthF; // tỉ lệ so với ruồi cái
  const c = {
    eye: f.white ? "var(--fly-eye-white, #f4efe4)" : "var(--fly-eye-red, #c3262c)",
    eyeRim: f.white ? "var(--fly-eye-white-rim, #b9b2a3)" : "var(--fly-eye-red-rim, #7d1418)",
    body: f.black ? "var(--fly-body-black, #2a2522)" : "var(--fly-body, #b48a55)",
    thorax: f.black ? "var(--fly-thorax-black, #221d1a)" : "var(--fly-thorax, #9a7343)",
    band: f.black ? "var(--fly-band-black, #0e0c0b)" : "var(--fly-band, #4a3320)",
    leg: f.black ? "var(--fly-leg-black, #1d1917)" : "var(--fly-leg, #6e5232)",
    wing: "var(--fly-wing, rgba(190, 200, 210, 0.42))",
    vein: "var(--fly-vein, rgba(90, 80, 70, 0.55))",
    comb: "var(--fly-comb, #0a0a0a)",
  };
  const s = (v) => n2(v * k);
  const parts = [];
  // Chân: ba đôi, đang mê thì co sát thân, đang bò thì duỗi theo pha bước
  const legs = [
    [-12, -6, -26, -22],
    [-13, 2, -30, 4],
    [-12, 9, -27, 28],
  ];
  legs.forEach(([x0, y0, x1, y1], i) => {
    const swing = asleep ? 0 : Math.sin((step + i / 3) * Math.PI * 2) * 4;
    const fold = asleep ? 0.55 : 1;
    for (const side of [-1, 1]) {
      const ph = side * (i % 2 === 0 ? 1 : -1);
      const xm = x0 + (x1 - x0) * 0.55 * fold;
      const ym = y0 + (y1 - y0) * 0.5 * fold + swing * ph * 0.5;
      const xe = x0 + (x1 - x0) * fold;
      const ye = y0 + (y1 - y0) * fold + swing * ph;
      parts.push(`<path d="M${s(-x0 * side)} ${s(y0)}L${s(-xm * side)} ${s(ym)}L${s(-xe * side)} ${s(ye)}" fill="none" stroke="${c.leg}" stroke-width="${s(1.6)}" stroke-linecap="round" stroke-linejoin="round"/>`);
      // Lược sinh dục: chấm đen ở đốt bàn thứ nhất của chân trước (chỉ con đực)
      if (male && i === 0) parts.push(`<ellipse cx="${s(-xm * side)}" cy="${s(ym)}" rx="${s(2.2)}" ry="${s(1.4)}" fill="${c.comb}"/>`);
    }
  });
  // Bụng: cái dài, đầu nhọn, sọc tách rời; đực ngắn, tròn, các đốt cuối sẫm liền
  const ab = male ? { cy: 18, rx: 12, ry: 15 } : { cy: 22, rx: 14, ry: 20 };
  const abPath = male
    ? `M${s(-ab.rx)} ${s(ab.cy - 6)}C${s(-ab.rx)} ${s(ab.cy - ab.ry - 2)} ${s(ab.rx)} ${s(ab.cy - ab.ry - 2)} ${s(ab.rx)} ${s(ab.cy - 6)}C${s(ab.rx)} ${s(ab.cy + ab.ry * 0.9)} ${s(-ab.rx)} ${s(ab.cy + ab.ry * 0.9)} ${s(-ab.rx)} ${s(ab.cy - 6)}Z`
    : `M${s(-ab.rx)} ${s(ab.cy - 8)}C${s(-ab.rx)} ${s(ab.cy - ab.ry - 2)} ${s(ab.rx)} ${s(ab.cy - ab.ry - 2)} ${s(ab.rx)} ${s(ab.cy - 8)}C${s(ab.rx)} ${s(ab.cy + 8)} ${s(4)} ${s(ab.cy + ab.ry - 2)} 0 ${s(ab.cy + ab.ry + 2)}C${s(-4)} ${s(ab.cy + ab.ry - 2)} ${s(-ab.rx)} ${s(ab.cy + 8)} ${s(-ab.rx)} ${s(ab.cy - 8)}Z`;
  const clipId = `fa${male ? "m" : "f"}${f.black ? "b" : ""}`;
  parts.push(`<clipPath id="${clipId}"><path d="${abPath}"/></clipPath>`);
  parts.push(`<path d="${abPath}" fill="${c.body}"/>`);
  const bands = [];
  if (male) {
    for (const y of [ab.cy - 8, ab.cy - 2]) bands.push(`<rect x="${s(-ab.rx)}" y="${s(y)}" width="${s(ab.rx * 2)}" height="${s(2.6)}" fill="${c.band}"/>`);
    bands.push(`<rect x="${s(-ab.rx)}" y="${s(ab.cy + 3)}" width="${s(ab.rx * 2)}" height="${s(ab.ry)}" fill="${c.band}"/>`);
  } else {
    for (let i = 0; i < 5; i++) bands.push(`<rect x="${s(-ab.rx)}" y="${s(ab.cy - 12 + i * 6.4)}" width="${s(ab.rx * 2)}" height="${s(2.4)}" fill="${c.band}"/>`);
  }
  parts.push(`<g clip-path="url(#${clipId})">${bands.join("")}</g>`);
  // Cánh: hai cánh dài trong suốt có gân, hoặc hai mẩu cánh cụt nhăn
  if (f.vestigial) {
    for (const side of [-1, 1]) parts.push(`<path d="M${s(6 * side)} ${s(-2)}Q${s(15 * side)} ${s(0)} ${s(12 * side)} ${s(8)}Q${s(9 * side)} ${s(5)} ${s(5 * side)} ${s(4)}Z" fill="${c.wing}" stroke="${c.vein}" stroke-width="${s(0.8)}"/>`);
  } else {
    for (const side of [-1, 1]) {
      const a = side > 0 ? 14 : -14;
      parts.push(`<g transform="rotate(${a} ${s(4 * side)} ${s(-2)})"><ellipse cx="${s(4 * side)}" cy="${s(22)}" rx="${s(9)}" ry="${s(25)}" fill="${c.wing}" stroke="${c.vein}" stroke-width="${s(0.7)}"/><path d="M${s(4 * side)} ${s(-1)}L${s(4 * side)} ${s(44)}M${s(4 * side)} ${s(6)}L${s(10 * side)} ${s(40)}M${s(4 * side)} ${s(8)}L${s(-1 * side)} ${s(38)}" fill="none" stroke="${c.vein}" stroke-width="${s(0.6)}"/></g>`);
    }
  }
  // Ngực, đầu, mắt kép, râu
  parts.push(`<ellipse cx="0" cy="${s(-4)}" rx="${s(12)}" ry="${s(13)}" fill="${c.thorax}"/>`);
  parts.push(`<path d="M${s(-6)} ${s(-12)}Q0 ${s(-15)} ${s(6)} ${s(-12)}" fill="none" stroke="${c.band}" stroke-width="${s(0.7)}" opacity="0.6"/>`);
  parts.push(`<ellipse cx="0" cy="${s(-22)}" rx="${s(11)}" ry="${s(7)}" fill="${c.body}"/>`);
  for (const side of [-1, 1]) parts.push(`<ellipse cx="${s(8 * side)}" cy="${s(-22)}" rx="${s(5.2)}" ry="${s(6.6)}" fill="${c.eye}" stroke="${c.eyeRim}" stroke-width="${s(0.8)}"/>`);
  parts.push(`<path d="M${s(-2.5)} ${s(-28)}L${s(-4)} ${s(-32)}M${s(2.5)} ${s(-28)}L${s(4)} ${s(-32)}" stroke="${c.leg}" stroke-width="${s(1.4)}" stroke-linecap="round"/>`);
  const px = n2(size);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" width="${px}" height="${px}" overflow="visible">${parts.join("")}</svg>`;
}

/** Ruồi mặc định trên tấm khi không có dữ liệu người dùng: F1 của phép lai hai cặp tính trạng và vài đột biến. */
const DEFAULT_FLIES = [
  { sex: "F", white: false, black: false, vestigial: false },
  { sex: "M", white: false, black: false, vestigial: false },
  { sex: "M", white: true, black: false, vestigial: false },
  { sex: "F", white: false, black: true, vestigial: true },
  { sex: "M", white: false, black: true, vestigial: true },
  { sex: "F", white: false, black: false, vestigial: false },
  { sex: "M", white: true, black: false, vestigial: false },
  { sex: "F", white: false, black: true, vestigial: false },
  { sex: "M", white: false, black: false, vestigial: true },
  { sex: "F", white: true, black: false, vestigial: false },
];

/** Bộ sinh số ngẫu nhiên có hạt giống (mulberry32), để bố trí ruồi lặp lại được. */
function rng(seed = 1) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * Rải ruồi lên tấm CO₂ (toạ độ mm, gốc ở tâm tấm, u dọc cạnh 116 mm, v dọc cạnh 81 mm).
 * Ruồi đầu tiên nằm giữa trường nhìn; ruồi chết theo co2Mortality với hạt giống cố định.
 * @param {object[]} flies danh sách { sex, white, black, vestigial }
 * @param {{seed?:number, co2Minutes?:number, spread?:number}} [opt]
 */
function scatterFlies(flies, { seed = 7, co2Minutes = 0, spread = 16 } = {}) {
  const r = rng(seed);
  return flies.map((fly, i) => {
    const f = normalizeFly(fly);
    const a = r() * Math.PI * 2;
    const d = i === 0 ? 0 : spread * Math.sqrt(r()) + 2;
    return {
      ...f,
      id: i,
      u: d * Math.cos(a),
      v: d * Math.sin(a) * 0.8,
      heading: r() * 360,
      dead: r() < co2Mortality(co2Minutes, f.sex),
      wakeJitter: 0.8 + 0.4 * r(),
      pile: null,
    };
  });
}

    step: 0,
  }));
  state.flies.forEach((f) => { f.dead = f.fate < co2Mortality(f.exposure, f.sex); });
  state.sorted = { M: 0, F: 0 };
  state.wrong = 0;
  state.offFor = 0;
}
pour(Math.max(0, Number(RUN?.co2Minutes) || 0));

let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches && !RUN;
let tour = { step: 0, t: 0.8 };
let idleTimer = 0;
const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const decimal = (v, d = 1) => v.toFixed(d).replace(".", ",");
const clock = (min) => `${Math.floor(min)}:${String(Math.floor((min % 1) * 60)).padStart(2, "0")}`;

// ——— Thao tác ———
function zoomTo(z) {
  state.zoom.target = clampZoom(z);
  const v = viewState({ zoom: state.zoom.target });
  say(`Zoom ${decimal(v.zoom, 2)}×: độ phóng đại ${decimal(v.total, 1)}×, trường nhìn Ø ${decimal(v.fov, 1)} mm, độ sâu trường ${decimal(v.dof, 2)} mm.`);
}
function zoomStep(sign) {
  const z = state.zoom.target;
  const stops = D.zoom.stops;
  const next = sign > 0 ? stops.find((s) => s > z + 1e-3) ?? stops[stops.length - 1] : [...stops].reverse().find((s) => s < z - 1e-3) ?? stops[0];
  zoomTo(next);
}
function focusBy(d) { state.focus.target = Math.max(-D.travel, Math.min(D.travel, state.focus.target + d)); }
function setCo2(on) {
  if (on === state.co2) return;
  state.co2 = on;
  if (on) {
    state.offFor = 0;
    say("Bật CO₂: ruồi trên tấm mê lại sau vài giây.");
  } else {
    const live = state.flies.filter((f) => !f.gone && !f.dead);
    const t = live.length ? wakeTime(Math.max(...live.map((f) => f.exposure))) : 0;
    say(`Tắt CO₂ sau ${clock(live.length ? Math.max(...live.map((f) => f.exposure)) : 0)} gây mê: ruồi tỉnh sau khoảng ${decimal(t, 1)} phút. ${co2Advice(live.length ? Math.max(...live.map((f) => f.exposure)) : 0).text}`);
  }
}
const onPad = (f) => !f.gone && !f.inMorgue;
const centreFly = () => {
  const fov = viewState({ zoom: state.zoom.target }).fov;
  let best = null;
  for (const f of state.flies) {
    if (!onPad(f) || f.pile) continue;
    const d = Math.hypot(f.u, f.v);
    if (d <= fov / 2 && (!best || d < best.d)) best = { f, d };
  }
  return best?.f ?? null;
};
const nextFly = (skip) => {
  let best = null;
  for (const f of state.flies) {
    if (!onPad(f) || f.pile || f === skip) continue;
    const d = Math.hypot(f.u, f.v);
    if (!best || d < best.d) best = { f, d };
  }
  return best?.f ?? null;
};
// Cọ: tâm đầu lông ở toạ độ tấm (u, v); nhấc lên 6 mm khi di chuyển giữa các chỗ
const restTip = () => ({ x: 0, y: 0, z: 0 });
const tipAt = (u, v, lift = 0) => ({ x: D.xo + v - D.brush.x, y: u - D.brush.tip, z: D.padTop + 2.4 - D.brush.z + lift });
function sort(key) {
  if (state.jobs.length) return;
  const f = centreFly();
  if (!f) { say("Không có ruồi chưa phân loại trong trường nhìn: tăng trường nhìn (giảm zoom) hoặc chờ cọ đưa ruồi vào giữa."); return; }
  const look = flyLook(f);
  const dest = PILES[key];
  const wrong = key !== "X" && key !== f.sex;
  const after = nextFly(f);
  const jobs = [];
  const pos = { ...state.brush };
  const go = (to, t, carry = null, done = null) => { jobs.push({ from: null, to, t, carry, done }); };
  go({ ...pos, z: 20 }, 0.35);
  go(tipAt(f.u + 2, f.v + 1, 6), 0.6);
  go(tipAt(f.u + 2, f.v + 1, 0), 0.25);
  go(tipAt(dest.u + 2, dest.v + 1, 0), 0.9, f, () => {
    if (key === "X") { f.inMorgue = true; state.morgue += 1; say(`Bỏ ruồi ${look.label} vào lọ dầu.`); }
    else {
      f.pile = key;
      state.sorted[key] += 1;
      if (wrong) state.wrong += 1;
      say(wrong ? `Nhầm: đây là ruồi ${look.sexLabel} (${look.abdomen}${look.sexComb ? ", có lược sinh dục" : ""}) mà gạt vào đống ${key === "M" ? "♂" : "♀"}.` : `Ruồi ${look.label}: gạt vào đống ${key === "M" ? "♂" : "♀"}.`);
    }
  });
  go(tipAt(dest.u + 2, dest.v + 1, 6), 0.25);
  if (after) {
    go(tipAt(after.u + 2, after.v + 1, 6), 0.7);
    go(tipAt(after.u + 2, after.v + 1, 0), 0.25);
    go(tipAt(2, 1, 0), 0.8, after);
    go(tipAt(2, 1, 6), 0.25);
  }
  go({ ...tipAt(after ? 2 : dest.u + 2, after ? 1 : dest.v + 1, 6), z: 20 }, 0.3);
  go({ x: 0, y: 0, z: 20 }, 0.6);
  go(restTip(), 0.35);
  state.jobs = jobs;
  if (still.matches) finishJobs();
}
function finishJobs() {
  for (const j of state.jobs) {
    if (j.carry) { const tip = j.to; j.carry.u = tip.y + D.brush.tip - 2; j.carry.v = tip.x + D.brush.x - D.xo - 1; }
    j.done?.();
  }
  state.jobs = [];
  state.brush = restTip();
}

// ——— Mô phỏng theo thời gian ———
const follow = (s, dt, tau, calm) => {
  if (calm) { s.x = s.target; return false; }
  s.x += (s.target - s.x) * (1 - Math.exp(-dt / tau));
  if (Math.abs(s.target - s.x) < 1e-4) { s.x = s.target; return false; }
  return true;
};
const ease = (t) => t * t * (3 - 2 * t);
const inPad = (f) => {
  const x = D.xo + f.v;
  return x > D.pad.x0 && x < D.pad.x1 && f.u > D.pad.y0 && f.u < D.pad.y1;
};
function updateFlies(dt, calm) {
  const minutes = dt * MIN_PER_SEC;
  let moving = false;
  if (!state.co2) state.offFor += minutes;
  for (const f of state.flies) {
    if (f.gone || f.inMorgue) continue;
    if (state.co2) {
      f.exposure += minutes;
      if (!f.dead && f.fate < co2Mortality(f.exposure, f.sex)) f.dead = true;
      f.awake = false;
      continue;
    }
    if (f.dead) continue;
    if (!f.awake && (calm || state.offFor >= wakeTime(f.exposure) * f.wakeJitter)) { f.awake = true; f.pile = null; }
    if (!f.awake || state.carry === f) continue;
    if (calm) { f.gone = true; continue; }
    moving = true;
    // Bò ngẫu nhiên, hướng đổi dần; ra khỏi mép tấm thì bay đi
    f.walk += dt;
    f.heading += Math.sin(f.walk * 1.3 + f.id) * 70 * dt;
    const a = ((f.heading - 90) * Math.PI) / 180;
    f.u += Math.cos(a) * WALK * dt;
    f.v += Math.sin(a) * WALK * dt;
    f.step = (f.step + dt * 4) % 1;
    if (!inPad(f)) f.gone = true;
  }
  return moving || (!state.co2 && state.flies.some((f) => !f.gone && !f.inMorgue && !f.dead));
}
function updateBrush(dt, calm) {
  if (!state.jobs.length) { state.carry = null; return false; }
  if (calm) { finishJobs(); return false; }
  const j = state.jobs[0];
  if (!j.from) { j.from = { ...state.brush }; j.k = 0; }
  j.k = Math.min(1, j.k + dt / j.t);
  const e = ease(j.k);
  state.brush = { x: j.from.x + (j.to.x - j.from.x) * e, y: j.from.y + (j.to.y - j.from.y) * e, z: j.from.z + (j.to.z - j.from.z) * e };
  state.carry = j.carry;
  if (j.carry) { j.carry.u = state.brush.y + D.brush.tip - 2; j.carry.v = state.brush.x + D.brush.x - D.xo - 1; j.carry.awake = false; }
  if (j.k >= 1) { state.jobs.shift(); j.done?.(); }
  return true;
}
function update(dt, calm) {
  const a = follow(state.zoom, dt, 0.25, calm);
  const b = follow(state.focus, dt, 0.18, calm);
  const c = updateBrush(dt, calm);
  const d = updateFlies(dt, calm);
  return a || b || c || d;
}

// ——— Vẽ máy ———
const ZF = D.zoom.frame;
const FKF = D.focus.frame;
const lnZ = Math.log(0.67);
const lnSpan = Math.log(4.5) - lnZ;
const zoomAngle = (z) => ((Math.log(z) - lnZ) / lnSpan) * 1.5 * Math.PI; // núm quay 270° từ 0,67× tới 4,5×
let lastKnob = "";
function drawMachine() {
  const dz = state.focus.x;
  const t = translateAlong(P, [0, 0, dz]);
  for (const g of el.head) g.setAttribute("transform", t);
  const b = state.brush;
  const tb = translateAlong(P, [b.x, b.y, b.z]);
  for (const g of el.brush) g.setAttribute("transform", tb);
  const za = zoomAngle(state.zoom.x);
  const fa = (dz / 2) * TAU; // giả định 2 mm mỗi vòng núm lấy nét
  const key = `${za.toFixed(4)}|${fa.toFixed(4)}`;
  if (key !== lastKnob) {
    lastKnob = key;
    el.ribsZoom.innerHTML = fadedSvg(G.ribsOf(ZF, D.zoom.s0, D.zoom.s1 - 4, D.zoom.r, 48, P, { phase: -za, fade: [0.08, 0.5], seams: "last" }), { tone: "lo" });
    el.ribsFocus.innerHTML = fadedSvg(G.ribsOf(FKF, D.focus.s0, D.focus.s1, D.focus.r, 36, P, { phase: fa, fade: [0.08, 0.5] }), { tone: "lo" });
    // Vạch các mức zoom trên mặt núm, mọc từ mép núm vào trong; vạch đang dùng ở đỉnh núm
    const ticks = D.zoom.stops.map((s, i) => {
      const ang = Math.PI / 2 + zoomAngle(s) - za;
      const p0 = iso(G.pointOf(ZF, D.zoom.s1, D.zoom.r - 0.05, ang), P);
      const p1 = iso(G.pointOf(ZF, D.zoom.s1, D.zoom.r - 5, ang), P);
      return [i % 2 === 0, `M${p0[0].toFixed(2)} ${p0[1].toFixed(2)}L${p1[0].toFixed(2)} ${p1[1].toFixed(2)}`];
    });
    el.ticksZoom.innerHTML = lineSvg(ticks.filter((t) => t[0]).map((t) => t[1]).join(""), { tone: "hi" }) + lineSvg(ticks.filter((t) => !t[0]).map((t) => t[1]).join(""), { tone: "lo" });
  }
  el.rig.toggleAttribute("data-co2", state.co2);
  // Bi nổi trong ống đo lưu lượng: khoảng 10 L/phút khi bật
  const m = D.meter;
  const zf = state.co2 ? m.z0 + 2.6 + (m.z1 - m.z0 - 5.2) * 0.55 : m.z0 + 2.6;
  const c = iso([m.x, m.y, zf], P);
  const r = 2.4 * G.scaleOf(P);
  el.float.innerHTML = `<circle class="st-float" cx="${c[0].toFixed(2)}" cy="${c[1].toFixed(2)}" r="${r.toFixed(2)}"/>`;
}

// Ruồi trên tấm trong hình máy: hình thoi nhỏ theo hướng đầu, mắt là chấm; phóng to 1,6 lần cho dễ thấy
function flyMark(f) {
  const L = f.sex === "M" ? 2.0 : 2.5;
  const Wd = 0.9;
  const a = ((f.heading - 90) * Math.PI) / 180;
  const ca = Math.cos(a), sa = Math.sin(a);
  const pt = (s, w) => iso([D.xo + f.v + sa * s + ca * w, f.u + ca * s - sa * w, D.padTop + 0.2], P);
  const pts = [pt(L, 0), pt(0.1, Wd), pt(-L, 0), pt(0.1, -Wd)];
  const d = `M${pts.map((p) => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join("L")}Z`;
  const e = pt(L * 0.7, 0);
  return `<path class="st-fly"${f.black ? " data-black" : ""} d="${d}"/><circle class="st-fly-eye"${f.white ? " data-white" : ""} cx="${e[0].toFixed(2)}" cy="${e[1].toFixed(2)}" r="0.7"/>`;
}
function ellipseOn(u, v, r, cls, extra = "") {
  const pts = [];
  for (let i = 0; i < 40; i++) {
    const a = (i / 40) * TAU;
    pts.push(iso([D.xo + v + r * Math.cos(a), u + r * Math.sin(a), D.padTop + 0.1], P));
  }
  return `<path class="${cls}"${extra} d="M${pts.map((p) => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join("L")}Z"/>`;
}
let vialDrawn = false;
function drawPad() {
  const out = [ellipseOn(-4, -6, 30, "st-pool"), ellipseOn(PILES.M.u, PILES.M.v, 6, "st-pile", ' data-pile="M"'), ellipseOn(PILES.F.u, PILES.F.v, 6, "st-pile", ' data-pile="F"')];
  for (const f of state.flies) if (onPad(f)) out.push(flyMark(f));
  el.flies.innerHTML = out.join("");
  // Ruồi trong lọ dầu: chấm nổi trên mặt dầu
  const mo = [];
  for (let i = 0; i < Math.min(state.morgue, 14); i++) {
    const a = i * 2.4;
    const rr = 3 + (i % 3) * 3.4;
    const p = iso([D.morgue.x + rr * Math.cos(a), D.morgue.y + rr * Math.sin(a), 30.1], P);
    mo.push(`<circle class="st-fly" cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="0.9"/>`);
  }
  el.morgueFlies.innerHTML = mo.join("");
  if (!vialDrawn) {
    vialDrawn = true;
    const vf = [];
    const r = rng(5);
    for (let i = 0; i < 9; i++) {
      const a = -0.2 + r() * 1.6;
      const z = 32 + r() * 48;
      const p = iso([D.vial.x + (D.vial.r - 0.6) * Math.cos(a), D.vial.y + (D.vial.r - 0.6) * Math.sin(a), z], P);
      vf.push(`<circle class="st-fly" cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="0.85"/>`);
    }
    el.vialFlies.innerHTML = vf.join("");
  }
}

// ——— Ô trường nhìn: ảnh thẳng chiều (kính soi nổi không đảo ảnh); lên trên = xa người dùng ———
const grain = (() => {
  const r = rng(11);
  return Array.from({ length: 900 }, () => ({ u: (r() - 0.5) * 70, v: (r() - 0.5) * 70, s: 0.08 + r() * 0.16 }));
})();
const flyCache = new Map();
function drawView() {
  const v = viewState({ zoom: state.zoom.x, defocus: state.focus.x });
  const s = 198 / v.fov; // đơn vị viewBox mỗi mm
  const R = v.fov / 2 + 2;
  const parts = [];
  for (const g of grain) {
    if (Math.abs(g.u) > R || Math.abs(g.v) > R) continue;
    parts.push(`<circle class="st-view-grain" cx="${(g.u * s).toFixed(1)}" cy="${(g.v * s).toFixed(1)}" r="${Math.max(0.4, g.s * s).toFixed(2)}"/>`);
  }
  for (const key of ["M", "F"]) {
    const p = PILES[key];
    if (Math.hypot(p.u, p.v) - 6 < R) parts.push(`<circle class="st-view-pile" data-pile="${key}" cx="${(p.u * s).toFixed(1)}" cy="${(p.v * s).toFixed(1)}" r="${(6 * s).toFixed(1)}"/>`);
  }
  for (const f of state.flies) {
    if (!onPad(f) || Math.hypot(f.u, f.v) > R + 2) continue;
    const asleep = !f.awake;
    const k = `${f.sex}${f.white ? 1 : 0}${f.black ? 1 : 0}${f.vestigial ? 1 : 0}${asleep ? "z" : Math.round(f.step * 8)}`;
    if (!flyCache.has(k)) flyCache.set(k, flySvg(f, 100, { asleep, step: f.step }).replace(/width="100" height="100"/, 'x="-50" y="-50" width="100" height="100"'));
    const size = 3 * s;
    parts.push(`<g transform="translate(${(f.u * s).toFixed(2)} ${(f.v * s).toFixed(2)}) rotate(${f.heading.toFixed(1)}) scale(${(size / 100).toFixed(4)})"${f.dead ? ' opacity="0.85"' : ""}>${flyCache.get(k)}</g>`);
  }
  // Đầu cọ trong trường nhìn
  if (state.jobs.length && state.brush.z < 8) {
    const bu = state.brush.y + D.brush.tip;
    const bv = state.brush.x + D.brush.x - D.xo;
    if (Math.hypot(bu, bv) < R + 4) parts.push(`<g transform="translate(${(bu * s).toFixed(1)} ${(bv * s).toFixed(1)})"><path d="M0 0L${(1.2 * s).toFixed(1)} ${(40 * s).toFixed(1)}L${(-1.2 * s).toFixed(1)} ${(40 * s).toFixed(1)}Z" fill="var(--st-bristle)" opacity="0.9"/></g>`);
  }
  viewFlies.innerHTML = parts.join("");
  viewBlur.setAttribute("stdDeviation", Math.min(12, v.blur * s).toFixed(2));
  return v;
}

function draw() {
  drawMachine();
  drawPad();
  const v = drawView();
  const live = state.flies.filter((f) => onPad(f));
  const dead = live.filter((f) => f.dead).length;
  const exp = state.flies.length ? Math.max(...state.flies.map((f) => f.exposure)) : 0;
  const co2 = state.co2 ? `CO₂ ${clock(exp)}` : `tắt ${clock(state.offFor)}`;
  const sortTxt = `♂${state.sorted.M} ♀${state.sorted.F}${state.wrong ? ` ✗${state.wrong}` : ""}${dead ? ` †${dead}` : ""}`;
  const text = `${decimal(v.total, v.total < 10 ? 1 : 0)}× · Ø ${decimal(v.fov, 1)} · ${v.label} · ${co2} · ${sortTxt}`;
  if (readout.textContent !== text) readout.textContent = text;
}

// ——— Vòng giới thiệu ———
const sortCentre = () => { const f = centreFly(); if (f) sort(f.dead ? "X" : f.sex); };
const TOUR = [
  { t: 1.6, run: () => { zoomTo(0.67); say("Ruồi nằm mê trên tấm CO₂; zoom 0,67× thấy cả đám ruồi."); } },
  { t: 2.0, run: () => zoomTo(2) },
  { t: 1.6, run: () => zoomTo(3.5) },
  { t: 1.4, run: () => { focusBy(3); say("Lệch nét 3 mm: ảnh mờ."); } },
  { t: 1.6, run: () => { state.focus.target = 0; say("Vặn núm lấy nét: ảnh nét."); } },
  { t: 1.2, run: () => zoomTo(2) },
  { t: 0.6, run: sortCentre },
  { t: 0.6, run: sortCentre },
  { t: 0.6, run: sortCentre },
  { t: 1.0, run: () => zoomTo(0.67) },
  { t: 18.0, run: () => setCo2(false) },
  { t: 2.0, run: () => { setCo2(true); pour(0); say("Đổ một lọ ruồi mới lên tấm, bật CO₂."); } },
];
function tourStep(dt) {
  if (state.jobs.length) return; // chờ cọ gạt xong
  tour.t -= dt;
  if (tour.t > 0) return;
  const step = TOUR[tour.step % TOUR.length];
  step.run();
  tour.t = step.t;
  tour.step = (tour.step + 1) % TOUR.length;
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  const moving = update(dt, calm);
  draw();
  frame = visible && !calm && (touring || moving || state.co2) ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: 0, t: 0 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || RUN) return; touring = true; loop(); }, 12000);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const k = event.key;
  let handled = true;
  if (k === "ArrowUp" || k === "ArrowDown") zoomStep(k === "ArrowUp" ? 1 : -1);
  else if (k === "ArrowRight" || k === "ArrowLeft") focusBy((k === "ArrowRight" ? 1 : -1) * (event.shiftKey ? 0.1 : 0.5));
  else if (k === " " || k === "Enter") setCo2(!state.co2);
  else if (k === "m" || k === "M") sort("M");
  else if (k === "f" || k === "F") sort("F");
  else if (k === "x" || k === "X") sort("X");
  else if (k === "r" || k === "R") { pour(0); setCo2(true); say("Đổ một lọ ruồi mới lên tấm CO₂."); }
  else handled = false;
  if (!handled) return;
  event.preventDefault();
  takeOver();
  if (still.matches) update(0, true);
  draw();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest('[data-name^="zoom."]')) zoomStep(event.shiftKey ? -1 : 1);
  else if (event.target.closest('[data-name^="focus."]')) focusBy(event.shiftKey ? -0.5 : 0.5);
  else if (event.target.closest('[data-name^="reg."]')) setCo2(!state.co2);
  else { const f = centreFly(); if (f) sort(f.dead ? "X" : f.sex); }
  stage.focus({ preventScroll: true });
  if (still.matches) update(0, true);
  draw();
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches && !RUN) zoomTo(2);
update(0, true);
draw();
</script></body></html>
