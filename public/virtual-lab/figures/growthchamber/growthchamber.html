<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Buồng sinh trưởng</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(700px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>/* Màu riêng của hình buồng sinh trưởng. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt trên nhóm máy: --lamp (0–1, đèn sáng), --heat (0–1, dàn sưởi), --cool (0–1, dàn lạnh),
   --humid (0–1, bộ tạo ẩm), data-open (cửa mở), data-warn (có lưu ý).
   Màu vật liệu (vỏ, bọt PU, vỏ trong, nhôm, đồng, khay, chậu…) được bản dựng sinh thêm từ các token này. */
.iso {
  --gc-skin: #e6e9ea;
  --gc-head: #9aa3a6;
  --gc-foam: #c9a842;
  --gc-liner: #e8eef0;
  --gc-panel: #dfe6e8;
  --gc-steel: #c2ccd4;
  --gc-alu: #aeb8c0;
  --gc-copper: #c9763f;
  --gc-dark: #2a2f33;
  --gc-tray: #1a1c1d;
  --gc-pot: #2b2e2c;
  --gc-stake: #c8a96b;
  --gc-tank: #b9cdd6;
  --gc-heater: #9b9fa2;
  --gc-glow: #ff7a2e;
  --gc-frost: #8fc6ff;
  --gc-gasket: #0f1113;
  --gc-glass: #9cc8da;
  --gc-barrier: #f4f1e2;
  --gc-lampc: #fff1c9;
  --gc-hole: #0a0c0d;
  --gc-void: #07090a;
  --gc-soil: #3b2a1e;
  --gc-water: #3f86b8;
  --gc-mist: #dcefff;
  --gc-leaf-u: #5fa847;
  --gc-leaf-d: #3f7c33;
  --gc-leaf-old: #c2b54a;
  --gc-leaf-dead: #9a7f4a;
  --gc-leaf-line: #1f3a18;
  --gc-stem: #6fb04f;
  --gc-tendril: #8cc56a;
  --gc-purple: #b05fd0;
  --gc-white: #f3f0ea;
  --gc-calyx: #4e8c3b;
  --gc-pod: #6ab84a;
  --gc-pod-dry: #c9b27a;
  --gc-seed: #9ccf72;
  --gc-bezel: #111417;
  --gc-screen: #0b1d2b;
  --gc-ink: #e6f3ff;
  --gc-ink-dim: #8fb0c8;
  --gc-day: #f2c94c;
  --gc-night: #1e3550;
  --gc-red: #ff4b3a;
  --gc-led-g: #4be08a;
  --gc-led-b: #4aa8ff;
  --gc-key: #23282c;
}
.iso[data-theme="light"] {
  --gc-skin: #ffffff;
  --gc-head: #b7c0c3;
  --gc-foam: #f0cf5c;
  --gc-liner: #ffffff;
  --gc-panel: #f4f7f8;
  --gc-steel: #d5dde4;
  --gc-alu: #c3ccd3;
  --gc-copper: #d9824a;
  --gc-dark: #3a4046;
  --gc-tray: #2e3133;
  --gc-pot: #3d413e;
  --gc-stake: #d9bb7c;
  --gc-tank: #cfe0e8;
  --gc-heater: #b2b6b9;
  --gc-glow: #f26a1b;
  --gc-frost: #6aa9e6;
  --gc-gasket: #3a3f44;
  --gc-glass: #8fbfd3;
  --gc-barrier: #fbf8ea;
  --gc-lampc: #ffe7a3;
  --gc-hole: #3a4046;
  --gc-void: #2a2f33;
  --gc-soil: #5a4030;
  --gc-water: #4b95c8;
  --gc-mist: #9fc6e8;
  --gc-leaf-u: #67b24c;
  --gc-leaf-d: #4c8a3a;
  --gc-leaf-old: #cdbf4f;
  --gc-leaf-dead: #a88a52;
  --gc-leaf-line: #2c5222;
  --gc-stem: #5ea543;
  --gc-tendril: #6fae4d;
  --gc-purple: #a14fc4;
  --gc-white: #fbfaf6;
  --gc-calyx: #4a8a38;
  --gc-pod: #5cab3e;
  --gc-pod-dry: #c4a96a;
  --gc-seed: #8cc463;
  --gc-bezel: #1c2126;
  --gc-screen: #0e2233;
  --gc-ink: #eef7ff;
  --gc-ink-dim: #9dbbd1;
  --gc-day: #f2c230;
  --gc-night: #23405e;
  --gc-red: #e2341f;
  --gc-led-g: #23a855;
  --gc-led-b: #2f8be0;
  --gc-key: #3a4046;
}

/* Ánh sáng trong buồng: ban ngày sáng, ban đêm tối đi (đèn tắt) */
.gc-machine { --lamp: 1; --heat: 0; --cool: 0; --humid: 0; }
.gc-machine .gc-in { filter: brightness(calc(0.58 + 0.42 * var(--lamp))); }
.iso[data-theme="light"] .gc-machine .gc-in { filter: brightness(calc(0.78 + 0.22 * var(--lamp))); }
.gc-pool { fill: var(--gc-lampc); opacity: calc(var(--lamp) * 0.16); filter: blur(6px); pointer-events: none; }
.iso[data-theme="light"] .gc-pool { opacity: calc(var(--lamp) * 0.4); }
.gc-lip { fill: color-mix(in oklab, var(--gc-void), var(--gc-lampc) calc(var(--lamp) * 100%)); }
.gc-barrier .iso-top, .gc-barrier .iso-shade, .gc-barrier .iso-fill { fill: color-mix(in oklab, var(--gc-glass), var(--gc-lampc) calc(var(--lamp) * 70%)); fill-opacity: calc(0.3 + 0.45 * var(--lamp)); }

/* Kính cửa sổ: trong mờ, hai vệt phản chiếu */
.gc-glass .iso-fill { fill: var(--gc-glass); fill-opacity: 0.06; }
.gc-glass .iso-top, .gc-glass .iso-shade { fill: var(--gc-glass); fill-opacity: 0.14; }
.gc-glass .iso-shade[data-shade="3"], .gc-glass .iso-shade[data-shade="2"] { fill-opacity: 0.1; }
.gc-glint { fill: #ffffff; opacity: 0.07; pointer-events: none; }
.iso[data-theme="light"] .gc-glint { opacity: 0.35; }

/* Dàn sưởi đỏ lên khi sưởi, dàn lạnh ngả xanh khi làm lạnh */
.gc-heater .iso-top { fill: color-mix(in oklab, color-mix(in oklab, var(--anatomy-top), var(--gc-heater) 45%), var(--gc-glow) calc(var(--heat) * 75%)); }
.gc-heater .iso-shade { fill: color-mix(in oklab, color-mix(in oklab, var(--anatomy-shade-2), var(--gc-heater) 45%), var(--gc-glow) calc(var(--heat) * 60%)) !important; }
.gc-alu[data-coil] .iso-top { fill: color-mix(in oklab, color-mix(in oklab, var(--anatomy-top), var(--gc-alu) 36%), var(--gc-frost) calc(var(--cool) * 45%)); }

/* Mặt phẳng phụ */
.gc-void { fill: var(--gc-void); }
.gc-hole { fill: var(--gc-hole); opacity: 0.85; }
.gc-blade { fill: var(--anatomy-shade-2); }
.gc-hub { fill: var(--anatomy-top); }
.gc-soil { fill: var(--gc-soil); stroke: var(--anatomy-lo); stroke-width: 0.5px; }
.gc-water { fill: var(--gc-water); opacity: 0.75; }
.gc-copper-f { fill: var(--gc-copper); }
.gc-key { fill: var(--gc-key); }
.gc-screw { fill: var(--anatomy-shade-0); stroke: var(--anatomy-lo); stroke-width: 0.4px; }
.gc-led-g { fill: var(--gc-led-g); }
.gc-led-b { fill: color-mix(in oklab, var(--anatomy-lo), var(--gc-led-b) calc(var(--humid) * 100%)); }

/* Cây đậu */
.gc-stem { fill: var(--gc-stem); stroke: var(--gc-leaf-line); stroke-width: 0.4px; stroke-linejoin: round; }
.gc-leaf { stroke: var(--gc-leaf-line); stroke-width: 0.4px; stroke-linejoin: round; }
.gc-leaf[data-f="u"] { fill: var(--gc-leaf-u); }
.gc-leaf[data-f="d"] { fill: var(--gc-leaf-d); }
.gc-leaf.gc-a1[data-f="u"], .gc-leaf.gc-a1[data-f="d"] { fill: color-mix(in oklab, var(--gc-leaf-u), var(--gc-leaf-old) 50%); }
.gc-leaf.gc-a2[data-f="u"], .gc-leaf.gc-a2[data-f="d"] { fill: var(--gc-leaf-old); }
.gc-leaf.gc-a3[data-f="u"], .gc-leaf.gc-a3[data-f="d"] { fill: var(--gc-leaf-dead); }
.gc-vein { fill: none; stroke: var(--gc-leaf-line); stroke-width: 0.35px; opacity: 0.55; }
.gc-tendril { fill: none; stroke: var(--gc-tendril); stroke-width: 0.6px; stroke-linecap: round; }
.gc-flower { stroke: var(--anatomy-lo); stroke-width: 0.35px; }
.gc-purple { fill: var(--gc-purple); }
.gc-white { fill: var(--gc-white); }
.gc-wing.gc-purple { fill: color-mix(in oklab, var(--gc-purple), #000 18%); }
.gc-calyx { fill: var(--gc-calyx); }
.gc-pod { fill: color-mix(in oklab, var(--gc-pod), var(--gc-pod-dry) calc(var(--ripe, 0) * 100%)); stroke: var(--gc-leaf-line); stroke-width: 0.4px; }
.gc-seed { fill: color-mix(in oklab, var(--gc-seed), var(--gc-pod-dry) calc(var(--ripe, 0) * 100%)); opacity: 0.8; }

/* Bảng điều khiển */
.gc-bezel { fill: var(--gc-bezel); }
.gc-screen { fill: var(--gc-screen); }
.gc-ink, .gc-ink-dim { font-family: var(--anatomy-mono); fill: var(--gc-ink); }
.gc-ink-dim { fill: var(--gc-ink-dim); }
.gc-machine[data-warn] [data-part="disp-prog"] { fill: var(--gc-red); }
.gc-bar-night { fill: var(--gc-night); }
.gc-bar-day { fill: var(--gc-day); }
.gc-bar-mark { fill: var(--gc-ink); }

/* Hơi sương của bộ tạo ẩm */
.gc-mist { fill: var(--gc-mist); opacity: 0; filter: blur(2px); pointer-events: none; transform-box: fill-box; transform-origin: center; }
.gc-machine .gc-mist { animation: gc-rise 2.6s ease-out infinite; animation-delay: calc(var(--i) * -0.43s); }
@keyframes gc-rise { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 30% { opacity: calc(0.12 + var(--humid) * 0.45); } 100% { opacity: 0; transform: translate(0, -46px) scale(1.5); } }
@media (prefers-reduced-motion: reduce) {
  .gc-machine .gc-mist { animation: none; opacity: calc(0.08 + var(--humid) * 0.3); }
}

.gc-stage { touch-action: pan-y; cursor: pointer; }
.gc-stage:focus { outline: none; }

gcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Đậu Hà Lan: thân dài theo độ-ngày (nền 4,4 °C), ra hoa rồi có quả</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Vách sau cắt lộ: bộ tạo ẩm siêu âm, dàn lạnh, dàn sưởi, ba quạt sau tấm đục lỗ</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Trần đèn LED sau tấm chắn kính; cảm biến nhiệt – ẩm trên vách phải</span></span><span class="iso-caption">Buồng sinh trưởng vẽ theo Conviron GEN1000 một tầng: ngoài 1040 × 825 × 1960 mm, lòng rộng 955 mm, cao trồng 1180 mm trên 0,525 m², đèn LED tới 2050 µmol/m²/s, 7–50 °C khi bật đèn và 4–45 °C khi tắt đèn, tạo ẩm tới 90 % RH khi tắt đèn. Chương trình cho đậu Hà Lan 18/14 °C, 16 giờ sáng, 400 µmol/m²/s cho ánh sáng tích luỹ DLI = 400 × 16 × 0,0036 = 23,0 mol/m²/ngày và 11,6 độ-ngày mỗi ngày (nền 4,4 °C), nên ngày 48 cây đã nhận 557 °C·ngày và cao khoảng 101 cm. Giống thân cao của Mendel dài 1,8–2,1 m, vượt chỗ trống 102 cm dưới tấm chắn: ngọn sẽ bò ngang dưới đèn. Mở cửa 1 phút lúc đèn sáng, không khí lên khoảng 20,3 °C và RH tụt còn 54 %, hồi phục sau khoảng 2 và 4 phút. Khoang khí sau vách, vị trí quạt, dạng đường cong chiều cao và hằng số hồi phục là cấu tạo điển hình hoặc minh hoạ, không theo tài liệu của hãng.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");

    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {
      out.from += TAU;
      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;
    if (end >= from && start <= to) {
      const t0 = Math.max(0, (from - start) / (length || 1));
      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));
    }
    walked = end;
  }
  return out;
}

const pointAlong = (points, at) => {
  const piece = cut(points, at, at + 0.01);
  return piece[0] ?? points[points.length - 1];
};

function tangentAlong(points, at) {
  const total = pathLength(points);
  const a = pointAlong(points, Math.max(0, at - 0.6));
  const b = pointAlong(points, Math.min(total, at + 0.6));
  return unit3(sub3(b, a));
}

function spiral(F, s, r0, r1, a0, a1, steps = 28) {
  const out = [];

function doorOpen(seconds, prog, on = true) {
  const tg = targets(prog, on);
  let s = steady(prog, on);
  s = step(s, Math.max(0, seconds), { prog, on, door: 1 });
  const open = { ...s };
  let t = 0;
  let recoverT = null;
  let recoverRH = null;
  while (t < 3600 && (recoverT === null || recoverRH === null)) {
    if (recoverT === null && Math.abs(s.T - tg.T) <= 0.5) recoverT = t / 60;
    if (recoverRH === null && Math.abs(s.RH - tg.RH) <= 3) recoverRH = t / 60;
    s = step(s, 5, { prog, on, door: 0 });
    t += 5;
  }
  return { T: open.T, RH: open.RH, dT: open.T - tg.T, dRH: open.RH - tg.RH, recoverT: recoverT ?? 60, recoverRH: recoverRH ?? 60 };
}

/** Giờ trong ngày dạng "hh:mm" từ số giây kể từ 00:00 ngày 0. */
const clockOf = (t) => {
  const m = Math.floor((((t / 60) % 1440) + 1440) % 1440);
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
};
// Phần chạy trong trang: đồng hồ ảo (một ngày ≈ 48 giây), đèn bật tắt theo quang kỳ, quạt quay, hơi sương của bộ tạo ẩm,
// cửa bản lề (mở cửa thì nhiệt độ và độ ẩm lệch rồi hồi phục theo model.mjs), đổi chương trình, tua ngày cho cây lớn,
// màn hình chương trình ngày/đêm, vòng giới thiệu. Giảm chuyển động: một khung đứng yên.
const D = {"P":{"origin":[220.12043886404115,552.4029336302444],"scale":0.8210654503330677,"azimuth":48,"elevation":30},"door":{"H":[106,-133],"u":[3,263],"v":[-16.5,-3],"z":[20,379],"gasket":1.5,"window":{"u":[90.5,175.5],"z":[88,325]},"panes":[[-12,-11.4],[-7,-6.4]],"trim":3,"handle":{"u":[238,244],"z":[176,246]},"knuckles":[[72,90],[316,334]],"bracket":{"x":[84,108.5],"y":[-135.5,-130],"h":14},"knuckleR":2.5},"doorOpen":1.7453292519943295,"pots":[{"x":-20,"y":-72,"i":0,"stake":[-26.5,-78.5]},{"x":-20,"y":0,"i":1,"stake":[-26.5,-6.5]},{"x":-20,"y":72,"i":2,"stake":[-26.5,65.5]},{"x":52,"y":-72,"i":3,"stake":[45.5,-78.5]},{"x":52,"y":0,"i":4,"stake":[45.5,-6.5]},{"x":52,"y":72,"i":5,"stake":[45.5,65.5]}],"pot":{"z0":37,"h":40,"r0":15,"r1":20,"lip":0.9,"soil":75,"reach":30},"top":326,"fans":3};
const P = D.P;
const DM = makeDoor({ iso, pathOf, solidSvg, lineSvg, roundedPlan, slabOf }, G, P, D.door);
const PL = makePlants(iso, depthOf, P);
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const $ = (sel) => svgEl.querySelector(sel);
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

// Kịch bản do app truyền qua địa chỉ (…growthchamber.html#run=<JSON>):
// { dayC: 18, nightC: 14, rh: 70, ppfd: 400, photoperiod: 16, day: 30, variety: "tall" | "dwarf", name: "…" }
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
const START = program(RUN ?? DEFAULT);
const LIST = RUN ? [{ ...START, name: START.name || "Chương trình của bạn" }, ...PROGRAMS.map((p) => program({ ...p, day: START.day, variety: START.variety, name: p.name }))] : PROGRAMS.map((p) => program({ ...p, day: START.day, variety: START.variety, name: p.name }));

const el = {
  machine: $('[data-part="machine"]'),
  closed: $('[data-slot="door-closed"]'),
  open: $('[data-slot="door-open"]'),
  fans: [...svgEl.querySelectorAll("[data-fan]")],
  plants: [...svgEl.querySelectorAll("[data-plant]")],
  day0: $('[data-part="bar-day0"]'),
  day1: $('[data-part="bar-day1"]'),
  mark: $('[data-part="bar-mark"]'),
};

const OPEN = D.doorOpen;
const DAY = 86400;
const state = {
  idx: 0,
  prog: LIST[0],
  t: START.day * DAY + 10 * 3600,
  gdd: gddPerDay(LIST[0]) * (START.day + 10 / 24),
  air: null,
  door: { x: 0, v: 0, target: 0 },
  want: false,
  doorS: 0,
  closedAt: null,
  lamp: 1,
  fan: 0,
  shown: D.pots.map(() => 0),
  drawnKey: D.pots.map(() => ""),
  clock: 0,
};
state.air = { ...steady(state.prog, lightsOn(state.prog, 10)), heat: 0, cool: 0, humid: 0 };
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches;
let tour = { step: "wait", wait: 2.4 };
let idleTimer = 0;
let doorDrawn = null;

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const dayOf = () => Math.floor(state.t / DAY);
const hourOf = () => (state.t / 3600) % 24;
const jitter = (i) => 1 + (((i * 37) % 11) - 5) * 0.012; // mỗi cây lệch vài phần trăm (minh hoạ)

function drawDoor() {
  const th = state.door.x;
  const key = th.toFixed(4);
  if (key === doorDrawn) return;
  doorDrawn = key;
  const markup = DM.parts(th, th > 0.6 ? "o" : "c");
  if (th > 0.6) { el.open.innerHTML = markup; el.closed.innerHTML = ""; }
  else { el.closed.innerHTML = markup; el.open.innerHTML = ""; }
}

function drawPlants(calm) {
  const plant = plantAt(state.gdd, state.prog.variety);
  D.pots.forEach((p, i) => {
    const target = plant.height * 2.5 * jitter(i);
    const s = state.shown;
    s[i] = calm || Math.abs(target - s[i]) < 0.05 ? target : s[i] + (target - s[i]) * 0.12;
    const g = Math.round(state.gdd / 4);
    const key = `${s[i].toFixed(1)}|${g}`;
    if (key === state.drawnKey[i]) return;
    state.drawnKey[i] = key;
    el.plants[i].innerHTML = PL.plantSvg({ base: [p.x + 1, p.y + 1, D.pot.soil], stake: p.stake, top: D.top, length: s[i], gdd: state.gdd, variety: state.prog.variety, seed: p.i + 1, color: "purple", ripe: plant.ripe, senescence: plant.senescence, reach: D.pot.reach });
  });
  return plant;
}

// Lò xo giảm chấn tới hạn; gần đóng thì chốt hẳn (gioăng từ tính hút cửa)
function stepSpring(L, dt, calm, tau, max) {
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const w = 1 / tau;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.min(max, Math.max(0, L.x));
  if (L.target === 0 && L.x < 0.02 * max) { L.x = 0; L.v = 0; return false; }
  if (Math.abs(L.target - L.x) < 1e-4 * max && Math.abs(L.v) < 1e-4) { L.x = L.target; L.v = 0; return false; }
  return true;
}
const doorFrac = () => Math.min(1, state.door.x / OPEN);
const isOpen = () => state.door.x > 0.02;
// Tốc độ đồng hồ ảo: một ngày ≈ 48 s; khi cửa mở và lúc hồi phục chậm lại để thấy nhiệt độ, độ ẩm thay đổi
function speed() {
  if (isOpen()) return 6;
  if (state.closedAt !== null) return 24;
  return 1800;
}
function recovered() {
  const tg = targets(state.prog, lightsOn(state.prog, hourOf()));
  return Math.abs(state.air.T - tg.T) < 0.3 && Math.abs(state.air.RH - tg.RH) < 1.5;
}

function advance(simDt) {
  // Chia bước để không bỏ qua lúc đèn bật/tắt
  let left = simDt;
  while (left > 1e-6) {
    const h = Math.min(left, 600);
    const on = lightsOn(state.prog, hourOf());
    state.air = step(state.air, h, { prog: state.prog, on, door: doorFrac() });
    state.gdd += (gddPerDay(state.prog) * h) / DAY;
    state.t += h;
    left -= h;
  }
}

function update(dt, calm) {
  state.clock += dt;
  const simDt = calm ? 0 : dt * speed();
  if (simDt > 0) advance(simDt);
  if (isOpen()) { state.doorS += simDt; state.closedAt = null; }
  else {
    if (state.doorS > 0) state.closedAt = state.t;
    state.doorS = 0;
    if (state.closedAt !== null && (recovered() || state.t - state.closedAt > 1800)) state.closedAt = null;
  }
  const on = lightsOn(state.prog, hourOf());
  const target = on ? 1 : 0;
  state.lamp = calm ? target : state.lamp + (target - state.lamp) * Math.min(1, dt * 3);
  if (!calm) {
    state.fan = (state.fan + dt * 9) % 360;
    el.fans.forEach((f, i) => f.setAttribute("transform", `rotate(${((state.fan * (i % 2 ? -57 : 57)) % 360).toFixed(1)})`));
  }
}

function text(part, value) {
  const node = svgEl.querySelector(`[data-part="${part}"]`);
  if (node && node.textContent !== value) node.textContent = value;
}

function draw(calm) {
  drawDoor();
  const plant = drawPlants(calm);
  const p = state.prog;
  const hour = hourOf();
  const on = lightsOn(p, hour);
  const a = state.air;
  const m = el.machine;
  const warn = [...warnings(p), ...p.notes];
  m.style.setProperty("--lamp", state.lamp.toFixed(3));
  m.style.setProperty("--heat", (a.heat ?? 0).toFixed(3));
  m.style.setProperty("--cool", (a.cool ?? 0).toFixed(3));
  m.style.setProperty("--humid", (a.humid ?? 0).toFixed(3));
  m.toggleAttribute("data-open", isOpen());
  m.toggleAttribute("data-warn", warn.length > 0);
  // Màn hình: nhiệt độ, độ ẩm, đèn, giờ, thanh chương trình 24 giờ (phần vàng là lúc đèn sáng), tên chương trình
  text("disp-temp", fmt(a.T));
  text("disp-rh", fmt(a.RH, 0));
  text("disp-light", on ? `☀ ${p.ppfd} µmol` : "☾ đèn tắt");
  text("disp-clock", clockOf(state.t));
  text("disp-prog", `${p.dayC}/${p.nightC} °C · ${p.photoperiod} h · RH ${p.rh}`);
  const x0 = -20 + (40 * DYN.lightsOnHour) / 24;
  const end = DYN.lightsOnHour + p.photoperiod;
  el.day0.setAttribute("x", x0.toFixed(2));
  el.day0.setAttribute("width", ((40 * (Math.min(24, end) - DYN.lightsOnHour)) / 24).toFixed(2));
  el.day1.setAttribute("width", ((40 * Math.max(0, end - 24)) / 24).toFixed(2));
  el.mark.setAttribute("x", (-20 + (40 * hour) / 24 - 0.4).toFixed(2));
  const tg = targets(p, on);
  let line;
  if (isOpen()) line = `cửa mở ${mmss(state.doorS)} · ${fmt(a.T)} °C · ${fmt(a.RH, 0)} % (đặt ${fmt(tg.T, 0)} · ${fmt(tg.RH, 0)})`;
  else if (state.closedAt !== null) line = `hồi phục ${mmss(state.t - state.closedAt)} · ${fmt(a.T)} °C · ${fmt(a.RH, 0)} %`;
  else {
    line = `${on ? "☀" : "☾"} ngày ${dayOf()} · ${clockOf(state.t)} · ${fmt(a.T)} °C · ${fmt(a.RH, 0)} % · ${plant.touching ? "chạm trần" : `${fmt(plant.height, 0)} cm`}`;
  }
  if (readout.textContent !== line) readout.textContent = line;
}

function toggleDoor() {
  state.want = !state.want;
  state.door.target = state.want ? OPEN : 0;
  say(state.want ? "Mở cửa: không khí phòng tràn vào, nhiệt độ và độ ẩm lệch khỏi điểm đặt." : "Đóng cửa: bộ điều khiển kéo nhiệt độ và độ ẩm về điểm đặt.");
}
function nextProgram() {
  state.idx = (state.idx + 1) % LIST.length;
  state.prog = LIST[state.idx];
  const p = state.prog;
  const dl = daily(p);
  const w = [...warnings(p), ...p.notes];
  say(`Chương trình ${p.name}: ${p.dayC}/${p.nightC} °C, ${p.photoperiod} giờ sáng, ${p.ppfd} µmol/m²/s, RH ${p.rh} %, DLI ${fmt(dl.dli)} mol/m²/ngày, ${fmt(dl.gdd)} °C·ngày mỗi ngày.${w.length ? ` Lưu ý: ${w.join("; ")}.` : ""}`);
}
function skipDays(n) {
  for (let i = 0; i < n; i++) advance(DAY);
  const plant = plantAt(state.gdd, state.prog.variety);
  say(`Ngày ${dayOf()}: ${fmt(state.gdd, 0)} °C·ngày, cây ${STAGE_VI[plant.stage]}, thân dài ${fmt(plant.height, 0)} cm${plant.touching ? ", ngọn đã chạm tấm chắn đèn" : ""}.`);
}
function resetAll() {
  state.idx = 0;
  state.prog = LIST[0];
  state.t = START.day * DAY + 10 * 3600;
  state.gdd = gddPerDay(state.prog) * (START.day + 10 / 24);
  state.air = { ...steady(state.prog, true), heat: 0, cool: 0, humid: 0 };
  state.want = false;
  state.door.target = 0;
  state.doorS = 0;
  state.closedAt = null;
}

// Vòng giới thiệu: mở cửa khoảng 45 giây (thời gian ảo), đóng, chờ hồi phục, tua 7 ngày, lặp lại; quá ngày 100 thì đặt lại.
function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "wait") { if (!state.want) toggleDoor(); tour = { step: "open", wait: 0 }; }
  else if (tour.step === "open") { if (state.doorS >= 45) { toggleDoor(); tour = { step: "closing", wait: 0 }; } }
  else if (tour.step === "closing") { if (state.door.x === 0) tour = { step: "recover", wait: 0 }; }
  else if (tour.step === "recover") { if (state.closedAt === null) tour = { step: "grow", wait: 3, n: 0 }; }
  else if (tour.step === "grow") {
    if (tour.n < 7) { skipDays(1); tour = { step: "grow", wait: 0.35, n: tour.n + 1 }; }
    else tour = { step: "rest", wait: 6 };
  } else if (tour.step === "rest") {
    if (dayOf() > 100) resetAll();
    tour = { step: "wait", wait: 0.4 };
  }
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  const moving = stepSpring(state.door, dt, calm, 0.3, OPEN);
  update(dt, calm);
  draw(calm);
  frame = visible && (!calm || moving) ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 2.4 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches) return; touring = true; tour = { step: "wait", wait: 0.6 }; loop(); }, 14000);
}
// Giảm chuyển động: cửa tới đích ngay; khi cửa mở, không khí lấy theo 45 giây mở cửa
function settleNow() {
  stepSpring(state.door, 0, true, 1, OPEN);
  if (state.want) {
    const on = lightsOn(state.prog, hourOf());
    state.air = step({ ...steady(state.prog, on) }, 45, { prog: state.prog, on, door: 1 });
    state.doorS = 45;
  } else {
    state.air = { ...steady(state.prog, lightsOn(state.prog, hourOf())), heat: 0, cool: 0, humid: 0 };
    state.doorS = 0;
    state.closedAt = null;
  }
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  if (![" ", "Enter", "Escape", "d", "w"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === "Enter") toggleDoor();
  else if (key === " ") nextProgram();
  else if (key === "d") skipDays(1);
  else if (key === "w") skipDays(7);
  else { resetAll(); say(`Đặt lại: ngày ${START.day}, 10:00, cửa đóng.`); }
  if (still.matches) settleNow();
  draw(still.matches);
  loop();
});
svgEl.addEventListener("click", () => {
  takeOver();
  toggleDoor();
  if (still.matches) settleNow();
  stage.focus({ preventScroll: true });
  draw(still.matches);
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

// Khung tiêu biểu đứng yên khi giảm chuyển động: cửa mở 45 giây (thời gian ảo), thấy cây trong buồng
if (still.matches) { state.want = true; state.door.target = OPEN; settleNow(); }
draw(still.matches);
</script></body></html>
