<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Máy đọc vi đĩa</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình máy đọc vi đĩa. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt --flash (0–1, đèn xenon chớp) trên nhóm máy; đèn, chùm sáng đổi theo nó.
   Màu dung dịch trong giếng là màu vật lý tính từ model (wellColour), giống nhau ở hai giao diện. */
.iso {
  --pr-cav-top: #1b1e21;
  --pr-cav-0: #121416;
  --pr-cav-1: #15181a;
  --pr-cav-2: #191c1f;
  --pr-cav-3: #1d2023;
  --pr-plinth: #2c3033;
  --pr-bezel: #050607;
  --pr-led: #3b82ff;
  --pr-flash: #bfe3ff;
  --pr-beam: #9fd0ff;
  --pr-glass: #2b3a44;
  --pr-pcb: #1f5a3a;
  --pr-belt: #0d0d0d;
  --pr-fibre: #e08a2a;
  --pr-plate: #c8d2d8;
  --pr-empty: #20262a;
  --pr-scr-bg: #182026;
  --pr-scr-bar: #26313a;
  --pr-scr-ink: #d3dee6;
  --pr-scr-dim: #8796a2;
  --pr-heat-0: #1f2a33;
  --pr-heat-1: #5aa9ff;
  --pr-cell-ink: #d9e6f0;
  --pr-cell-ink-hi: #07121c;
  --pr-ax: #6c7a86;
  --pr-pt: #ffffff;
  --pr-fit: #ffb347;
  --pr-sample: #5aa9ff;
}
.iso[data-theme="light"] {
  --pr-cav-top: #c4c9cd;
  --pr-cav-0: #b3b9be;
  --pr-cav-1: #babfc4;
  --pr-cav-2: #c1c6ca;
  --pr-cav-3: #c8cdd1;
  --pr-plinth: #9aa1a7;
  --pr-bezel: #1d2328;
  --pr-led: #1f6bff;
  --pr-flash: #6fb4ff;
  --pr-beam: #2f7fe0;
  --pr-glass: #d6e3ea;
  --pr-pcb: #3f8a5c;
  --pr-belt: #2a2d30;
  --pr-fibre: #e07a12;
  --pr-plate: #f1f5f8;
  --pr-empty: #e3e8ec;
  --pr-scr-bg: #f2f5f8;
  --pr-scr-bar: #d9e0e6;
  --pr-scr-ink: #26323c;
  --pr-scr-dim: #5f6d78;
  --pr-heat-0: #eaf1f7;
  --pr-heat-1: #1d5fbf;
  --pr-cell-ink: #1f2b35;
  --pr-cell-ink-hi: #ffffff;
  --pr-ax: #7b8792;
  --pr-pt: #1d2328;
  --pr-fit: #d9480f;
  --pr-sample: #1d5fbf;
}

/* Khoang đo bên trong: tông tối riêng để đọc như lòng máy */
.pr-cavity .iso-top { fill: var(--pr-cav-top); }
.pr-cavity .iso-shade[data-shade="0"] { fill: var(--pr-cav-0); stroke: none; }
.pr-cavity .iso-shade[data-shade="1"] { fill: var(--pr-cav-1); stroke: none; }
.pr-cavity .iso-shade[data-shade="2"] { fill: var(--pr-cav-2); stroke: none; }
.pr-cavity .iso-shade[data-shade="3"] { fill: var(--pr-cav-3); stroke: none; }

.pr-plinth .iso-top, .pr-plinth .iso-shade { fill: color-mix(in oklab, var(--pr-plinth) 70%, var(--anatomy-shade-1)); stroke: none; }
.pr-bezel .iso-top, .pr-bezel .iso-shade { fill: var(--pr-bezel); stroke: none; }
.pr-pcb .iso-top, .pr-pcb .iso-shade { fill: color-mix(in oklab, var(--pr-pcb) 55%, var(--anatomy-shade-0)); stroke: none; }
.pr-belt .iso-top, .pr-belt .iso-shade { fill: var(--pr-belt); stroke: none; }
.pr-led .iso-top, .pr-led .iso-shade { fill: var(--pr-led); stroke: none; }
.pr-glass .iso-top, .pr-glass .iso-shade { fill: color-mix(in oklab, var(--pr-glass), var(--pr-beam) calc(var(--flash, 0) * 60%)); stroke: none; }
.pr-plate .iso-top { fill: var(--pr-plate); }
.pr-plate .iso-shade { fill: color-mix(in oklab, var(--pr-plate) 80%, var(--anatomy-shade-1)); stroke: none; }
.pr-lamp .iso-top, .pr-lamp .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--pr-flash) calc(18% + var(--flash, 0) * 82%)); stroke: none; }
.pr-lamp { filter: drop-shadow(0 0 calc(var(--flash, 0) * 6px) var(--pr-flash)); }
.pr-fibre .tb-body { fill: color-mix(in oklab, var(--pr-fibre) 70%, var(--anatomy-paper)); }
.pr-fibre .tb-shine { fill: color-mix(in oklab, var(--pr-fibre) 40%, #ffffff); }
.pr-fibre .tb-shade { fill: color-mix(in oklab, var(--pr-fibre) 60%, #000000); }
.pr-beam { fill: none; stroke: var(--pr-beam); stroke-width: 1.1px; stroke-linecap: round; opacity: calc(var(--beam, 0)); filter: drop-shadow(0 0 1.5px var(--pr-beam)); }
.pr-well { stroke: none; }
.pr-well[data-empty] { fill: var(--pr-empty) !important; }

/* Màn hình cảm ứng và màn hình laptop */
.pr-scr-bg { fill: var(--pr-scr-bg); }
.pr-scr-bar { fill: var(--pr-scr-bar); }
.pr-scr-track { fill: var(--pr-scr-bar); }
.pr-scr-fill { fill: var(--pr-heat-1); }
.pr-scr-title, .pr-scr-text { font-family: var(--anatomy-mono); fill: var(--pr-scr-ink); }
.pr-scr-dim { font-family: var(--anatomy-mono); fill: var(--pr-scr-dim); }
.pr-cell, .pr-tcell { fill: color-mix(in oklab, var(--pr-heat-0), var(--pr-heat-1) calc(var(--t, 0) * 100%)); }
[data-pending] > .pr-cell, .pr-tcell[data-pending] { fill: var(--pr-scr-bar); }
.pr-cell-text { font-family: var(--anatomy-mono); fill: var(--pr-cell-ink); }
.pr-cell-text[data-hi] { fill: var(--pr-cell-ink-hi); }
.pr-ax { fill: none; stroke: var(--pr-ax); stroke-width: 0.5px; }
.pr-pt { fill: var(--pr-pt); }
.pr-fit { fill: none; stroke: var(--pr-fit); stroke-width: 0.9px; }
.pr-smp { fill: none; stroke: var(--pr-sample); stroke-width: 0.6px; }
.pr-ax-text { font-family: var(--anatomy-mono); fill: var(--pr-scr-dim); }

.pr-stage { touch-action: pan-y; cursor: pointer; }
.pr-stage:focus { outline: none; }
.pr-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }

<span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Khay chạy trên ray X/Y bằng hai động cơ bước và dây đai, đọc quét theo cột</span></span><span class="iso-caption">Máy đọc vi đĩa vẽ theo Agilent BioTek Epoch 2 bản màn hình cảm ứng (32 × 32,3 × 39,5 cm, 11,3 kg), hông phải tháo tấm che. Đèn xenon chớp qua monochromator chọn một bước sóng trong 200–999 nm (độ rộng dải 2,9 nm); sợi quang đưa ánh sáng tới đầu quang phía trên khay, ánh sáng đi xuyên giếng tới photodiode phía dưới. Máy có một kênh đo: khay chạy trên ray để đưa lần lượt từng giếng vào chùm sáng, đọc quét 96 giếng trong 8 s. Độ hấp thụ A = log(I₀/I) = ε·l·c, trong đó quang trình l là chiều cao cột chất lỏng (200 µL trong giếng 96 khoảng 0,6 cm) chứ không phải 1 cm như cuvet. Dải đo 0–4 OD, sai số dưới 1 % ở 2 OD. Ví dụ là thí nghiệm Bradford: Coomassie G-250 gắn protein chuyển từ nâu đỏ sang xanh lam, đọc ở 595 nm; đường chuẩn BSA hơi cong nên hồi quy tuyến tính chỉ đúng trong khoảng 125–1 000 µg/mL. Vị trí đèn, monochromator, sợi quang, ray và bo mạch bên trong vẽ theo cấu tạo điển hình, hãng không công bố sơ đồ.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;

    const { origin } = projection;

    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

const tenth = (value) => {

        [x + radius, y + radius, 180],

    const out = [];

        for (let step = 0; step <= count; step++) {

    if (sorted.length < 3)

    const lower = [];

function runsOf(flags, want) {

function extrude(ring, z, height, projection, options = {}) {

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const R = right.map((point) => iso(point, P));

  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    top: buckets[4].join(""),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

//   Dáng đường chuẩn (độ hấp thụ của mẫu trắng, độ cong) là ước lượng theo đường chuẩn điển hình, chưa xác minh:
//   A595 mẫu trắng ≈ 0,45; A thực (đã trừ trắng) = Amax·c/(K + c), Amax = 2,25, K = 3 000 µg/mL ở 255 µL.
//
// p-nitrophenol: ε405 = 18 500 L·mol⁻¹·cm⁻¹ ở pH ≥ 9,8 (Sigma-Aldrich, "Enzymatic Assay of Alkaline
//   Phosphatase (DEA assay)"), cùng hằng số với figures/spectro/model.mjs. Động học phosphatase kiềm với pNPP:
//   Km ≈ 0,5 mM là giá trị điển hình, chưa xác minh cho điều kiện này.
//
// Sai số của máy (mô hình): độ lệch ngẫu nhiên σ = 0,25 % · A + 0,0005 OD (coi độ lặp 0,5 % ở 2,0 OD là
//   khoảng 2σ), độ lệch hệ thống của cả đĩa trong ±0,5 % (nửa độ đúng 1 %), ánh sáng lạc 0,03 % làm bão hoà ở
//   OD cao, trên 4,0 OD máy báo "OVRFLW" (cách Gen5 hiển thị giếng tràn thang; chưa xác minh chữ hiển thị),
//   làm tròn 0,001 OD. Sai số pipet (CV 1 % cho 200–250 µL, 2 % cho 5 µL) là ước lượng, chưa xác minh.

/** Thông số máy. Đơn vị ghi ở từng trường. */
const SPEC = {
  model: "Epoch 2",
  range: [200, 999], // nm, bước 1 nm
  bandwidth: 2.9, // nm
  wlAccuracy: 2, // ± nm
  wlRepeat: 0.2, // ± nm
  odRange: [0, 4], // OD
  resolution: 0.001, // OD, phần mềm trên máy (0,0001 dưới Gen5)
  accuracy: [[2.0, 0.01], [2.5, 0.03]], // [OD, sai số tương đối tối đa]
  linearity: 0.01, // trong 0–2,5 OD
  repeat: 0.005, // ở 2,0 OD
  stray: 0.0003, // 0,03 % ở 230 nm
  sweep96: 8, // s, đọc quét 96 giếng
  sweep384: 14, // s
  incubation: 65, // °C tối đa
  power: 60, // W tối đa, nguồn ngoài 24 V DC
  size: [323, 395.4, 320], // mm, rộng × sâu × cao (bản màn hình cảm ứng)
  mass: 11.34, // kg
  lamp: "xenon flash",
  detector: "photodiode",
};

/** Vi đĩa 96 giếng chuẩn SLAS, giếng Corning đáy phẳng. Đơn vị mm, µL. */
const PLATE = {
  size: [127.76, 85.48], // rộng (cột 1→12) × sâu (hàng A→H)
  height: 14.35,
  a1: [14.38, 11.24], // tâm A1 cách mép trái, mép trên
  pitch: 9,
  rows: 8,
  cols: 12,
  well: { top: 6.86, bottom: 6.35, depth: 10.67, max: 360 },
};

const ROWS = "ABCDEFGH";
/** Tên giếng từ chỉ số hàng r (0–7) và cột c (0–11): (0, 0) → "A1". */
const wellId = (r, c) => `${ROWS[r]}${c + 1}`;
/** Đổi "B7" → { r: 1, c: 6 }; trả null nếu tên không hợp lệ. */
function parseWell(id) {
  const m = /^([A-Ha-h])(\d{1,2})$/.exec(String(id).trim());
  if (!m) return null;
  const r = ROWS.indexOf(m[1].toUpperCase());
  const c = Number(m[2]) - 1;
  return c >= 0 && c < PLATE.cols ? { r, c } : null;
}
/** Toạ độ tâm giếng (mm) so với tâm đĩa: x theo cột, y theo hàng (A ở phía sau, y âm). */
function wellOffset(r, c) {
  const [w, d] = PLATE.size;
  return [PLATE.a1[0] + c * PLATE.pitch - w / 2, PLATE.a1[1] + r * PLATE.pitch - d / 2];
}

/**
 * Quang trình (cm) của cột chất lỏng thể tích V (µL) trong giếng hình nón cụt (bỏ qua mặt khum).
 * @param {number} volume  µL (= mm³)
 * @param {object} well     kích thước giếng { top, bottom, depth } tính bằng mm
 * @returns {number} cm
 */
function pathLength(volume, well = PLATE.well) {
  const r0 = well.bottom / 2;
  const k = (well.top / 2 - r0) / well.depth;
  const vol = (h) => (Math.PI * h * (r0 * r0 + r0 * (r0 + k * h) + (r0 + k * h) ** 2)) / 3;
  let lo = 0;
  let hi = well.depth;
  if (volume >= vol(hi)) return hi / 10;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    if (vol(mid) < volume) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 20;
}

/**
 * Định luật Beer–Lambert: A = ε·l·c.
 * @param {number} eps  L·mol⁻¹·cm⁻¹
 * @param {number} l    quang trình, cm
 * @param {number} c    nồng độ, mol/L
 */
const beerLambert = (eps, l, c) => eps * l * c;

/** Bộ sinh số ngẫu nhiên có hạt (mulberry32), để chạy lại cho cùng kết quả. Trả hàm () → [0, 1). */
function rng(seed = 1) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/** Số ngẫu nhiên phân phối chuẩn N(0, 1) (Box–Muller). */
function gauss(rand) {
  const u = Math.max(1e-12, rand());
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand());
}

/** Độ hấp thụ nền của giếng polystyrene có chất lỏng không màu (ước lượng, chưa xác minh). */
const PLATE_BLANK = 0.045;

/**
 * Máy đọc một giếng có độ hấp thụ thật A: ánh sáng lạc, độ lệch hệ thống của đĩa, nhiễu ngẫu nhiên,
 * làm tròn theo độ phân giải. Trên 4,0 OD trả về Infinity (máy báo "OVRFLW").
 * @param {number} A      độ hấp thụ thật của giếng (gồm cả nền đĩa)
 * @param {function} rand hàm ngẫu nhiên từ rng()
 * @param {object} opt    { gain: hệ số lệch hệ thống của đĩa (mặc định 1), resolution }
 */
function measure(A, rand, { gain = 1, resolution = SPEC.resolution } = {}) {
  const T = 10 ** -Math.max(0, A);
  const seen = -Math.log10((T + SPEC.stray) / (1 + SPEC.stray));
  const noisy = seen * gain + (0.0025 * seen + 0.0005) * gauss(rand);
  if (noisy > SPEC.odRange[1]) return Infinity;
  return Math.max(0, Math.round(noisy / resolution) * resolution);
}

/** Độ lệch hệ thống của một đĩa (hệ số nhân), trong ±0,5 %. */
const plateGain = (rand) => 1 + 0.005 * (2 * rand() - 1);

/** Chữ hiển thị của một giá trị OD: "0,452", "OVRFLW", hoặc "—" khi không có. */
function formatOD(A, digits = 3) {
  if (A === Infinity) return "OVRFLW";
  if (A === null || A === undefined || Number.isNaN(A)) return "—";
  return A.toFixed(digits).replace(".", ",");
}

// ——— Bradford (Coomassie G-250, 595 nm) ———

/** Thông số thí nghiệm Bradford trên vi đĩa (Bio-Rad Quick Start, quy trình vi đĩa chuẩn). */
const BRADFORD = {
  lambda: 595,
  sample: 5, // µL mẫu hoặc chuẩn
  dye: 250, // µL thuốc thử 1×
  blank: 0.45, // A595 của mẫu trắng ở 255 µL, ước lượng
  amax: 2.25, // A595 thực tối đa khi c → ∞ ở 255 µL, ước lượng
  k: 3000, // µg/mL, nồng độ cho nửa Amax, ước lượng
  standards: [0, 125, 250, 500, 750, 1000, 1500, 2000], // µg/mL BSA
  linear: [125, 1000], // µg/mL, khoảng tuyến tính theo Bio-Rad
};

/**
 * Độ hấp thụ thật ở 595 nm của một giếng Bradford (gồm nền đĩa và thuốc nhuộm tự do).
 * @param {number} c       nồng độ protein trong mẫu, µg/mL
 * @param {object} opt     { sample, dye } µL; quang trình tỉ lệ theo tổng thể tích
 */
function bradfordA(c, { sample = BRADFORD.sample, dye = BRADFORD.dye } = {}) {
  const ref = pathLength(BRADFORD.sample + BRADFORD.dye);
  const scale = pathLength(sample + dye) / ref;
  const dilution = (sample / (sample + dye)) / (BRADFORD.sample / (BRADFORD.sample + BRADFORD.dye));
  const cc = Math.max(0, c) * dilution;
  return PLATE_BLANK + scale * (BRADFORD.blank + (BRADFORD.amax * cc) / (BRADFORD.k + cc));
}

// ——— p-nitrophenol (405 nm) ———

/** Thông số p-nitrophenol và phosphatase kiềm trên vi đĩa. */
const PNP = {
  lambda: 405,
  eps: 18500, // L·mol⁻¹·cm⁻¹, pH ≥ 9,8
  volume: 200, // µL mỗi giếng
  standards: [0, 10, 25, 50, 75, 100, 150, 200], // µmol/L
  km: 0.5, // mmol/L, phosphatase kiềm với pNPP, điển hình, chưa xác minh
};

/**
 * Độ hấp thụ thật ở 405 nm của p-nitrophenol nồng độ c (µmol/L) trong V µL.
 */
const pnpA = (c, volume = PNP.volume) => PLATE_BLANK + beerLambert(PNP.eps, pathLength(volume), Math.max(0, c) * 1e-6);

/**
 * Đọc động học phản ứng phosphatase kiềm + pNPP ở 405 nm: sản phẩm p-nitrophenol tăng theo
 * Michaelis–Menten, cơ chất giảm dần. Trả các lần đọc { t (s), A (OD đo), P (µmol/L) }.
 * @param {object} opt { vmax µmol/L/phút, s0 mmol/L, km mmol/L, volume µL, interval s, duration s, seed }
 */
function pnpKinetic({ vmax = 12, s0 = 2, km = PNP.km, volume = PNP.volume, interval = 30, duration = 600, seed = 7 } = {}) {
  const rand = rng(seed);
  const gain = plateGain(rand);
  const out = [];
  let P = 0;
  const dt = 1;
  for (let t = 0; t <= duration; t += dt) {
    if (t % interval === 0) out.push({ t, P, A: measure(pnpA(P, volume), rand, { gain }) });
    const S = Math.max(0, s0 - P / 1000);
    P += ((vmax * S) / (km + S)) * (dt / 60);
  }
  return out;
}

// ——— Đường chuẩn ———

/**
 * Hồi quy tuyến tính bình phương nhỏ nhất y = slope·x + intercept, kèm R².
 * @param {Array<[number, number]>} points  các điểm [x, y]
 */
function linearFit(points) {
  const pts = points.filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));
  const n = pts.length;
  if (n < 2) return { slope: NaN, intercept: NaN, r2: NaN, n };
  const mx = pts.reduce((s, [x]) => s + x, 0) / n;
  const my = pts.reduce((s, [, y]) => s + y, 0) / n;
  let sxx = 0;
  let sxy = 0;
  let syy = 0;
  for (const [x, y] of pts) {
    sxx += (x - mx) ** 2;
    sxy += (x - mx) * (y - my);
    syy += (y - my) ** 2;
  }
  const slope = sxy / sxx;
  const intercept = my - slope * mx;
  const ssr = pts.reduce((s, [x, y]) => s + (y - (slope * x + intercept)) ** 2, 0);
  return { slope, intercept, r2: syy > 0 ? 1 - ssr / syy : 1, n };
}

/** Nội suy nồng độ từ độ hấp thụ theo đường chuẩn tuyến tính: x = (A − b) / a. */
const interpolate = (fit, A) => (A - fit.intercept) / fit.slope;

// ——— Đĩa mẫu ———

/**
 * Bố trí đĩa Bradford: cột 1–3 là dãy chuẩn BSA lặp ba (hàng A–H = 0 … 2 000 µg/mL),
 * cột 4–12 là 24 mẫu chưa biết lặp ba (mẫu i ở hàng i % 8, nhóm cột 4–6, 7–9, 10–12).
 * Trả { assay, lambda, wells: { id: OD đo }, standards: { id: µg/mL }, samples: { id: tên mẫu }, truth: { tên: µg/mL } }.
 * @param {object} opt { seed, unknowns: mảng 24 nồng độ thật µg/mL (tuỳ chọn) }
 */
function bradfordPlate({ seed = 3, unknowns } = {}) {
  const rand = rng(seed);
  const gain = plateGain(rand);
  const truth = {};
  const wells = {};
  const standards = {};
  const samples = {};
  const conc = unknowns ?? Array.from({ length: 24 }, () => Math.round(80 + 2050 * rand()));
  for (let c = 0; c < PLATE.cols; c++) {
    for (let r = 0; r < PLATE.rows; r++) {
      const id = wellId(r, c);
      let x;
      if (c < 3) {
        x = BRADFORD.standards[r];
        standards[id] = x;
      } else {
        const name = `M${r + 1 + 8 * Math.floor((c - 3) / 3)}`;
        x = conc[r + 8 * Math.floor((c - 3) / 3)];
        samples[id] = name;
        truth[name] = x;
      }
      // Sai số pipet: 5 µL mẫu CV 2 %, 250 µL thuốc thử CV 1 %
      const sample = BRADFORD.sample * (1 + 0.02 * gauss(rand));
      const dye = BRADFORD.dye * (1 + 0.01 * gauss(rand));
      wells[id] = measure(bradfordA(x, { sample, dye }), rand, { gain });
    }
  }
  return { assay: "bradford", lambda: BRADFORD.lambda, unit: "µg/mL", wells, standards, samples, truth };
}

/**
 * Đĩa p-nitrophenol điểm cuối ở 405 nm: cột 1–3 là dãy chuẩn pNP (0–200 µmol/L) lặp ba,
 * cột 4–12 là 24 mẫu sản phẩm phản ứng lặp ba. Cùng dạng kết quả với bradfordPlate.
 */
function pnpPlate({ seed = 5, unknowns } = {}) {
  const rand = rng(seed);
  const gain = plateGain(rand);
  const truth = {};
  const wells = {};
  const standards = {};
  const samples = {};
  const conc = unknowns ?? Array.from({ length: 24 }, () => Math.round(5 + 190 * rand()));
  for (let c = 0; c < PLATE.cols; c++) {
    for (let r = 0; r < PLATE.rows; r++) {
      const id = wellId(r, c);
      let x;
      if (c < 3) {
        x = PNP.standards[r];
        standards[id] = x;
      } else {
        const name = `M${r + 1 + 8 * Math.floor((c - 3) / 3)}`;
        x = conc[r + 8 * Math.floor((c - 3) / 3)];
        samples[id] = name;
        truth[name] = x;
      }
      const volume = PNP.volume * (1 + 0.01 * gauss(rand));
      wells[id] = measure(pnpA(x, volume), rand, { gain });
    }
  }
  return { assay: "pnp", lambda: PNP.lambda, unit: "µmol/L", wells, standards, samples, truth };
}

/**
 * Phân tích một lần đọc: trừ trung bình mẫu trắng (giếng chuẩn nồng độ 0), dựng đường chuẩn tuyến tính
 * từ các giếng chuẩn, nội suy nồng độ của từng mẫu (trung bình các giếng lặp).
 * @param {object} run  { wells: { id: OD }, standards?: { id: nồng độ }, samples?: { id: tên } }
 * @param {object} opt  { range: [min, max] chỉ dùng các chuẩn trong khoảng này để fit (giữ cả mẫu trắng) }
 * @returns {{ blank, fit, points: Array<[x, A]>, samples: Array<{ name, wells, A, c, out }>, range }}
 */
function analyse(run, { range } = {}) {
  const std = run.standards ?? {};
  const ids = Object.keys(std).filter((id) => Number.isFinite(run.wells?.[id]));
  const blanks = ids.filter((id) => std[id] === 0).map((id) => run.wells[id]);
  const blank = blanks.length ? blanks.reduce((s, a) => s + a, 0) / blanks.length : 0;
  const points = ids.map((id) => [std[id], run.wells[id] - blank]);
  const used = range ? points.filter(([x]) => x === 0 || (x >= range[0] && x <= range[1])) : points;
  const fit = linearFit(used);
  const xs = points.map(([x]) => x);
  const top = xs.length ? Math.max(...xs) : 0;
  const groups = new Map();
  for (const [id, name] of Object.entries(run.samples ?? {})) {
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(id);
  }
  const samples = [...groups].map(([name, wells]) => {
    const values = wells.map((id) => run.wells?.[id]).filter((a) => a !== undefined);
    const over = values.some((a) => a === Infinity);
    const A = over ? Infinity : values.reduce((s, a) => s + a, 0) / Math.max(1, values.length);
    const c = over ? NaN : interpolate(fit, A - blank);
    return { name, wells, A, c, out: over || !(c >= 0 && c <= top) };
  });
  return { blank, fit, points, samples, range: [0, top] };
}

// ——— Màu và thời gian ———

/**
 * Màu nhìn thấy của dung dịch trong giếng (RGB 0–255). Bradford: trộn từ nâu đỏ (thuốc nhuộm tự do) tới
 * xanh lam (gắn protein) theo phần đã gắn. Chất khác: mỗi kênh R, G, B (610, 545, 450 nm) bị hấp thụ theo
 * dải Gauss quanh bước sóng đo, σ = 45 nm (gần đúng để tô màu, không phải phổ thật).
 */
function wellColour(lambda, A, assay) {
  if (!Number.isFinite(A)) return [20, 30, 60];
  if (assay === "bradford") {
    const f = Math.min(1, Math.max(0, (A - PLATE_BLANK - BRADFORD.blank) / 1.1));
    const brown = [176, 112, 72];
    const blue = [36, 78, 178];
    return brown.map((v, i) => Math.round(v + (blue[i] - v) * Math.sqrt(f)));
  }
  const a = Math.max(0, A - PLATE_BLANK);
  return [610, 545, 450].map((centre) => Math.round(250 * 10 ** (-a * 1.4 * Math.exp(-0.5 * ((centre - lambda) / 45) ** 2))));
}

/**
 * Lịch đọc quét: đọc theo cột (1 → 12), trong mỗi cột quét hàng A → H rồi H → A ở cột kế (kiểu rắn bò).
 * Trả về vị trí đang đọc ở thời điểm t (s) kể từ lúc bắt đầu: { col, row (số thực), done, index }.
 * @param {number} t
 * @param {number} total  thời gian đọc cả đĩa, s (mặc định 8 s theo hãng)
 */
function sweepAt(t, total = SPEC.sweep96) {
  const per = total / PLATE.cols;
  if (t >= total) return { col: PLATE.cols - 1, row: PLATE.cols % 2 ? PLATE.rows - 1 : 0, done: true, index: PLATE.rows * PLATE.cols };
  const col = Math.max(0, Math.floor(t / per));
  const u = Math.min(1, Math.max(0, (t - col * per) / (per * 0.82))); // 18 % thời gian để dời sang cột kế
  const along = u * (PLATE.rows - 1);
  const row = col % 2 ? PLATE.rows - 1 - along : along;
  return { col, row, done: false, index: col * PLATE.rows + Math.floor(along + 1e-9) + 1 };
}

/** Thứ tự các giếng được đọc (để tô bản đồ lần lượt): mảng id theo lịch sweepAt. */
function readOrder() {
  const out = [];
  for (let c = 0; c < PLATE.cols; c++) for (let i = 0; i < PLATE.rows; i++) out.push(wellId(c % 2 ? PLATE.rows - 1 - i : i, c));
  return out;
}

return { SPEC, PLATE, ROWS, wellId, parseWell, wellOffset, formatOD, analyse, bradfordPlate, pnpPlate, wellColour, sweepAt, readOrder, BRADFORD, PNP };})();
// Cửa lật của khe khay vi đĩa: bản lề ở mép trên ô cửa (trục song song với x), lật vào trong và lên trên
// khi khay đi ra. Dùng chung cho bản dựng (ghi hình dạng) và trang (dựng lại mỗi khung hình).
// Trong cửa: u hướng xuống dọc cửa (khi đóng), v hướng ra ngoài (khi đóng); θ = 0 là đóng, θ = OPEN là mở.

function makeFlap(k, G, P, D) {
  const { H, half, height, t, cx } = D;
  const V = G.viewOf(P);
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);

  const frameAt = (theta) => G.frameOf([cx, H[1], H[2]], [1, 0, 0], [0, -Math.sin(theta), -Math.cos(theta)], [0, Math.cos(theta), -Math.sin(theta)]);
  const local = (F, x, u, v) => G.add3(G.add3(G.add3(F.o, G.mul3(F.a, x)), G.mul3(F.u, u)), G.mul3(F.v, v));

  draw();
  const busy = !calm && (touring || moving || ["closing", "opening", "seek", "read", "home"].includes(state.phase) || (state.curve > 0 && state.curve < 1) || state.flash > 1e-3);
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 2.2 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches) return; touring = true; loop(); }, 9000);
}
// Giảm chuyển động: chạy hết các pha ngay, không hoạt cảnh
function settleNow() { for (let i = 0; i < 8; i++) update(1, true); }

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.key !== " " && event.key !== "Enter" && event.key !== "Escape") return;
  event.preventDefault();
  takeOver();
  if (event.key === " ") startRead();
  else toggleDrawer();
  if (still.matches) settleNow();
  draw();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest("[data-slot]")) toggleDrawer();
  else startRead();
  if (still.matches) settleNow();
  draw();
  stage.focus({ preventScroll: true });
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) {
  // Khung tiêu biểu: khay đã vào, đọc xong 96 giếng, bản đồ và đường chuẩn đã hiện.
  state.flap = { x: 0, v: 0, target: 0 };
  state.dx = { x: 0, v: 0, target: 0 };
  state.dy = { x: 0, v: 0, target: 0 };
  state.shown = READ_COUNT;
  state.curve = 1;
  setPhase("done");
}
draw();
