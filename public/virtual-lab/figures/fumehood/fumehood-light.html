<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tủ hút khí độc</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình tủ hút khí độc. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt --clutter, --light (0–1) trên nhóm máy và data-alarm trên svg. */
.iso {
  --fh-room: #b9b39a;
  --fh-dirty: #e0a46a;
  --fh-gas: #c8642a;
  --fh-glass: #7fb3c8;
  --fh-flask: #a9c9d6;
  --fh-liquid: #3fb39a;
  --fh-amber: #8a5a2b;
  --fh-glass-b: #c9d6dd;
  --fh-pe: #e6e2d4;
  --fh-epoxy: #3a3a36;
  --fh-liner: #ece8de;
  --fh-lamp: #fff4d6;
  --fh-void: #070707;
  --fh-lcd-bg: #0f2a1e;
  --fh-lcd-ink: #8ff0b8;
  --fh-lcd-alarm: #ff8a7a;
  --fh-led-off: #2b3330;
  --fh-led-ok: #4be08a;
  --fh-led-alarm: #ff4b3a;
  --fh-key-on: #4be08a;
  --fh-handle: #3a3a3a;
  --fh-tote: #4a78b0;
  --fh-cable: #c9c3b0;
}
.iso[data-theme="light"] {
  --fh-room: #8e876b;
  --fh-dirty: #c27a3a;
  --fh-gas: #a8461a;
  --fh-glass: #9cc8da;
  --fh-flask: #b9d8e4;
  --fh-liquid: #1f9a80;
  --fh-amber: #9a6232;
  --fh-glass-b: #dfe9ee;
  --fh-pe: #ffffff;
  --fh-epoxy: #55554f;
  --fh-liner: #ffffff;
  --fh-lamp: #fff1c2;
  --fh-void: #3a3d40;
  --fh-lcd-bg: #12362a;
  --fh-lcd-ink: #9df5c4;
  --fh-lcd-alarm: #ffb0a4;
  --fh-led-off: #b9c2bd;
  --fh-led-ok: #23a855;
  --fh-led-alarm: #e2341f;
  --fh-key-on: #23a855;
  --fh-handle: #9a9aa0;
  --fh-tote: #3c6fb3;
  --fh-cable: #6b665a;
}

/* Chú giải: vạch đỏ là NO₂ (nâu), vạch xanh lá là khí đã lẫn khí độc */
.iso-swatch[data-mark="red"] path { stroke: var(--fh-gas); }
.iso-swatch[data-mark="green"] path { stroke: var(--fh-dirty); }

/* Vật liệu có màu: pha màu vào từng tông để vẫn còn khối */
.fh-epoxy .iso-top { fill: color-mix(in oklab, var(--fh-epoxy) 55%, var(--anatomy-top)); }
.fh-epoxy .iso-shade { fill: color-mix(in oklab, var(--fh-epoxy) 50%, var(--anatomy-shade-1)); }
.fh-liner .iso-top { fill: color-mix(in oklab, var(--fh-liner) 40%, var(--anatomy-top)); }
.fh-pe .iso-top { fill: color-mix(in oklab, var(--fh-pe) 45%, var(--anatomy-top)); }
.fh-pe .iso-shade { fill: color-mix(in oklab, var(--fh-pe) 35%, var(--anatomy-shade-1)); }
.fh-handle .iso-top, .fh-handle .iso-shade { fill: color-mix(in oklab, var(--fh-handle) 60%, var(--anatomy-shade-1)); }

/* Kính cường lực của kính trượt và kính cố định: trong mờ */
.fh-glass .iso-fill { fill: var(--fh-glass); fill-opacity: 0.08; }
.fh-glass .iso-top, .fh-glass .iso-shade { fill: var(--fh-glass); fill-opacity: 0.16; }
.fh-glass .iso-shade[data-shade="3"], .fh-glass .iso-shade[data-shade="2"] { fill-opacity: 0.12; }

/* Bình nón thuỷ tinh và dung dịch Cu(NO₃)₂ xanh lục bên trong */
.fh-flask .iso-fill { fill: var(--fh-flask); fill-opacity: 0.1; }
.fh-flask .iso-top, .fh-flask .iso-shade { fill: var(--fh-flask); fill-opacity: 0.22; }
.fh-liquid .iso-top { fill: color-mix(in oklab, var(--fh-liquid) 75%, var(--anatomy-top)); stroke: color-mix(in oklab, var(--fh-liquid) 75%, var(--anatomy-top)); }
.fh-liquid .iso-shade { fill: color-mix(in oklab, var(--fh-liquid) 65%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--fh-liquid) 65%, var(--anatomy-shade-1)); }
.fh-mouth { fill-opacity: 0.85; }

/* Chai thuỷ tinh nâu (acid) và chai trong: tô cả nét viền tông để bề mặt cong không lộ đường nối */
.fh-amber .iso-top { fill: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-top)); stroke: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-top)); }
.fh-amber .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-shade-0)); stroke: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-shade-0)); }
.fh-amber .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-shade-1)); }
.fh-amber .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-shade-2)); stroke: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-shade-2)); }
.fh-amber .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-shade-3)); stroke: color-mix(in oklab, var(--fh-amber) 55%, var(--anatomy-shade-3)); }
.fh-glass-b .iso-top { fill: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-top)); stroke: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-top)); }
.fh-glass-b .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-shade-0)); stroke: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-shade-0)); }
.fh-glass-b .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-shade-1)); }
.fh-glass-b .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-shade-2)); stroke: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-shade-2)); }
.fh-glass-b .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-shade-3)); stroke: color-mix(in oklab, var(--fh-glass-b) 35%, var(--anatomy-shade-3)); }

/* Vật cản: thùng nhựa xanh; hiện theo --clutter */
.fh-clutter-item { opacity: var(--clutter, 0); }
.fh-tote .iso-top { fill: color-mix(in oklab, var(--fh-tote) 55%, var(--anatomy-top)); }
.fh-tote .iso-shade { fill: color-mix(in oklab, var(--fh-tote) 50%, var(--anatomy-shade-1)); }

/* Đèn LED dưới trần */
.fh-lamp .iso-top, .fh-lamp .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--fh-lamp) calc(var(--light, 0) * 85%)); stroke: none; }
.fh-lamp { filter: drop-shadow(0 0 calc(var(--light, 0) * 2px) var(--fh-lamp)); }

.fh-void { fill: var(--fh-void); }
.iso .fh-cable { stroke: var(--fh-cable); stroke-width: 0.9px; }

/* Bộ báo luồng khí: màn LCD, đèn báo, nút tắt còi; khi báo động màn đổi màu chữ */
.fh-lcd { fill: var(--fh-lcd-bg); }
.fh-lcd-text { font-family: var(--anatomy-mono); fill: var(--fh-lcd-ink); }
svg[data-alarm] .fh-lcd-text { fill: var(--fh-lcd-alarm); }
.fh-mute { fill: var(--anatomy-shade-1); }
.iso .fh-led { fill: var(--fh-led-off); transition: fill 0.2s var(--anatomy-ease); }
.iso .fh-led[data-led="ok"][data-on] { fill: var(--fh-led-ok); }
.iso .fh-led[data-led="alarm"][data-on] { fill: var(--fh-led-alarm); }
.iso .fh-key[data-on] .iso-top, .iso .fh-key[data-on] .iso-shade { fill: color-mix(in oklab, var(--fh-key-on) 70%, var(--anatomy-shade-2)); }

/* Đám khí NO₂ */
.fh-gas-stop { stop-color: var(--fh-gas); }
.fh-cloud { opacity: 0; pointer-events: none; transform-box: fill-box; transform-origin: center; }

/* Hạt khí */
.fh-particles { pointer-events: none; }
.fh-p { fill: none; stroke: var(--fh-room); stroke-width: 2px; stroke-linecap: round; opacity: 0; vector-effect: non-scaling-stroke; }
.fh-p[data-k="dirty"] { stroke: var(--fh-dirty); }
.fh-p[data-k="gas"] { stroke: var(--fh-gas); stroke-width: 3px; }

.fh-stage { touch-action: pan-y; cursor: pointer; }
.fh-stage:focus { outline: none; }
.fh-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }

alarm" cx="36" cy="62" r="5"/><circle class="fh-mute" cx="80" cy="64" r="8"/><path class="iso-line" data-tone="lo" d="M80 56A8 8 0 1 1 79.99 56Z"/></g></g><g class="fh-particles" data-layer="outer"><ellipse class="fh-cloud" data-cloud="out" cx="260.7" cy="431.5" rx="34.9" ry="18.5" fill="url(#fh-gas-grad)"/></g></g></svg><span class="fh-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>NO₂ (khí nâu) sinh ra từ Cu + HNO₃ đặc trong bình nón</span><span class="iso-key"><svg class="iso-swatch" data-mark="green" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Khí đã lẫn khí độc: sau vách ngăn, trong buồng áp và ống thải</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Khí phòng hút vào qua cửa kính và khe dưới gờ khí động</span></span><span class="iso-caption">Tủ vẽ theo Labconco Protector XStream 5 ft (ngoài 1524 × 958 × 1499 mm, mặt làm việc 1273 × 691 mm, kính trượt đứng có cáp và ròng rọc, chặn kính ở 457 mm = 18&quot;, mở hết 711 mm = 28&quot;, cổ ống thải 325 mm), hông phải và góc trên bên phải cắt bỏ. Tủ chạy lưu lượng không đổi 580 CFM (985 m³/h): vận tốc mặt cửa = lưu lượng / diện tích cửa, nên ở chặn 18&quot; được 0,51 m/s (100 fpm); nâng kính hết 28&quot; chỉ còn 0,33 m/s, dưới ngưỡng báo 0,41 m/s (80 fpm), bộ báo kêu và khí độc bắt đầu thoát ra vùng thở. Hạ kính thấp thì cửa bypass phía trên mở dần, vận tốc chỉ lên khoảng 0,8 m/s. Vật cản che khe dưới vách ngăn làm khí quẩn ở mặt bàn và tràn ra cửa; người đi ngang tạo gió ngang kéo khí ra; tắt quạt thì NO₂ (nặng hơn không khí 1,6 lần) tràn ra phòng. Nồng độ NO₂ ở vùng thở so với giới hạn ngắn hạn 1 ppm (NIOSH), trần 5 ppm (OSHA), IDLH 13 ppm. Hạt chuyển động chậm khoảng 3 lần so với thật. Bên trong trụ (đối trọng, ròng rọc), buồng áp và quạt vẽ theo cấu tạo điển hình; hệ số rò ở vùng thở là số minh hoạ, không phải số đo của model.</span></figcaption></figure></main><script type="module">// Mô hình tủ hút khí độc (fume hood) để bàn, dùng chung cho bản dựng (Node), trang hình (trình duyệt)
// và lõi mô phỏng của app. Module thuần: không DOM, không Three.js.
//
// Máy làm mẫu: Labconco Protector XStream 5 ft (mã 110510021, có 2 vòi dịch vụ và ổ cắm đôi), đặt trên
// tủ đế chứa hoá chất. Nguồn:
// - Trang sản phẩm Labconco Protector XStream (https://labconco.com/product/protector-xstream-laboratory-hoods/24):
//   · kính trượt đứng bằng kính an toàn cường lực, "cable and pulley"; chặn kính ở độ mở 18" (457 mm);
//   · tầm nhìn 37,5" (953 mm) từ mặt bàn tới tấm đầu (header panel);
//   · ống thải inox sơn tĩnh điện, đường kính trong 12,8" (325 mm);
//   · vách ngăn sau Opti-Zone có khe vát, hệ vách hút xuống kép phía sau, tháo rời để lau;
//   · gờ khí động Eco-Foil có khe Clean-Sweep, khe giữ dây điện hai bên; cấp khí pha loãng phía trên (bypass),
//     tương thích lưu lượng thay đổi (VAV); tay nắm kính có khe Clean-Sweep;
//   · lót vách composite gia cường sợi thuỷ tinh chịu hoá chất, chỉ số lan lửa < 25 (ASTM E84);
//   · đèn LED kín hơi, công tắc đèn và quạt đạt ADA; 2 vòi dịch vụ van đồng thau rèn (gas, nước lạnh), ổ GFCI;
//   · thử nghiệm: ASHRAE 110, ANSI Z9.5, SEFA 1, NFPA 45, UL 61010-1.
// - Bảng lưu lượng thải của Labconco (bản chép ở BSI Lab,
//   https://bsilab.com/product/labconco-protector-xstream-laboratory-fume-hoods), bản 5 ft:
//   · kính mở 28" (100 %): 100 fpm → 930 CFM (s.p. 0,26), 80 fpm → 745 CFM, 60 fpm → 560 CFM;
//   · kính mở 18" (62,5 %): 100 fpm → 580 CFM (s.p. 0,12), 80 fpm → 465 CFM, 60 fpm → 350 CFM;
//   · khối lượng bản 5 ft: 238 kg (525 lb).
// - Kích thước bản 5 ft (Terra Universal, SKU 110510021): ngoài 60" × 37,7" × 59" (1524 × 958 × 1499 mm),
//   mặt làm việc 50,1" × 27,2" (1273 × 691 mm), độ mở lớn nhất 28" (711 mm).
// - Bộ báo luồng khí Labconco Guardian Digital (https://labconco.com/p/guardian-digital-airflow-monitors):
//   màn LCD hiện vận tốc mặt cửa; ngưỡng chỉnh được 50–250 fpm bằng máy đo vận tốc; dưới ngưỡng thì còi kêu
//   và đèn đỏ sáng, tắt còi bằng một nút.
// - ANSI/ASSP Z9.5 và ASHRAE 110 (tóm tắt: Lab Manager, https://www.labmanager.com/conducting-proper-face-velocity-testing-for-lab-fume-hoods-35211;
//   LBNL qua https://casrai.org/guides/ashrae-110-fume-hood-testing): bản Z9.5 cũ ghi 80–120 fpm, bản 2022 gợi ý 80–100 fpm
//   làm điểm bắt đầu; thử khí đánh dấu SF₆ 4 L/min, nồng độ ở vùng thở của ma-nơ-canh ≤ 0,05 ppm ("AM 0,05")
//   khi thử tại xưởng, ≤ 0,1 ppm khi thử tại chỗ lắp.
// - NO₂: NIOSH Pocket Guide (https://www.cdc.gov/niosh/npg/npgd0454.html): REL giới hạn ngắn hạn 1 ppm,
//   IDLH 13 ppm; OSHA PEL trần 5 ppm. Phản ứng Cu + 4 HNO₃ (đặc) → Cu(NO₃)₂ + 2 NO₂ + 2 H₂O.
//
// Giả định (chưa xác minh):
// - Tủ chạy lưu lượng không đổi (CAV) 580 CFM, đủ 100 fpm (0,508 m/s) ở chặn kính 18". Chiều rộng hiệu dụng của
//   cửa 1179 mm suy ra từ bảng (580 CFM chia 100 fpm chia 18"); mặt làm việc rộng 1273 mm. Kính đóng hẳn vẫn còn
//   khe Clean-Sweep dưới gờ khí động, tính như cửa cao 25 mm.
// - Diện tích bypass mở dần khi kính hạ dưới 300 mm, lớn nhất 0,30 m² (Labconco không công bố số).
// - Ngưỡng báo động của Guardian đặt 80 fpm (0,41 m/s), lấy theo cận dưới của Z9.5 bản cũ.
// - Chế độ VAV: giữ 0,508 m/s, lưu lượng từ 150 CFM (tối thiểu, giả định) tới 930 CFM.
// - Hệ số rò ở vùng thở theo vận tốc, độ mở, vật cản trước vách ngăn và người đi ngang: con số MINH HOẠ,
//   dựng cho đúng chiều hướng của các nghiên cứu ASHRAE 110, không phải số đo của model này.
// - Nguồn NO₂ minh hoạ: 5 g phoi đồng trong HNO₃ đặc dư, phản ứng trong khoảng 2 phút.

const CFM = 0.0004719474; // m³/s cho 1 ft³/min
const FPM = 0.00508; // m/s cho 1 ft/min

/** Thông số tủ (Labconco Protector XStream 5 ft). Chiều dài mm, vận tốc m/s, lưu lượng m³/s trừ khi ghi khác. */
const HOOD = {
  model: "Labconco Protector XStream 5 ft (110510021)",
  outside: { width: 1524, depth: 958, height: 1499 },
  workArea: { width: 1273, depth: 691 },
  sightline: 953,
  collarId: 325,
  mass: 238, // kg
  sashMax: 711, // 28"
  sashStop: 457, // 18"
  openingWidth: 1179, // mm, hiệu dụng (suy ra, xem đầu file)
  slot: 25, // mm, khe Clean-Sweep dưới gờ khí động (giả định)
  bypass: { below: 300, area: 0.3 }, // mm, m² (giả định)
  exhaustTable: {
    // CFM theo vận tốc mặt cửa (fpm), bản 5 ft
    open28: { 100: 930, 80: 745, 60: 560 },
    open18: { 100: 580, 80: 465, 60: 350 },
  },
  target: 100 * FPM, // 0,508 m/s
  flowCav: 580 * CFM, // 0,2737 m³/s = 985 m³/h
  vavMin: 150 * CFM, // giả định
  vavMax: 930 * CFM,
  alarmLow: 80 * FPM, // 0,406 m/s, ngưỡng Guardian (giả định)
  cap: 2.5, // m/s, vận tốc qua khe hẹp bão hoà quanh mức này (giả định)
  tracer: { rate: 4, pass: 0.05, passInstalled: 0.1 }, // L/min, ppm (ASHRAE 110 / ANSI Z9.5)
  no2: { stel: 1, ceiling: 5, idlh: 13, twa: 0.2 }, // ppm (NIOSH, OSHA; TWA 0,2 ppm theo ACGIH, chưa đối chiếu)
};
const UNITS = { CFM, FPM };

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/**
 * Trạng thái kính theo độ mở.
 * @param {number} sash độ mở (mm, từ mặt trên gờ khí động tới mép dưới kính)
 * @returns {"closed"|"low"|"work"|"high"} đóng, thấp (dưới 150 mm), làm việc (tới chặn 18"), cao quá chặn
 */
function sashState(sash, h = HOOD) {
  if (sash <= 2) return "closed";
  if (sash < 150) return "low";
  return sash <= h.sashStop + 2 ? "work" : "high";
}

/**
 * Diện tích cửa trước (m²): chiều rộng hiệu dụng × độ mở; kính đóng vẫn còn khe Clean-Sweep.
 * @param {number} sash mm
 */
function openingArea(sash, h = HOOD) {
  return (h.openingWidth / 1000) * (Math.max(sash, h.slot) / 1000);
}

/**
 * Diện tích bypass phía trên (m²): mở dần khi kính hạ dưới h.bypass.below, giữ cho vận tốc không vọt lên khi đóng kính.
 * @param {number} sash mm
 * @param {"cav"|"vav"} [mode] tủ VAV không dùng bypass (van điều chỉnh lưu lượng thay vào)
 */
function bypassArea(sash, mode = "cav", h = HOOD) {
  if (mode === "vav") return 0;
  return h.bypass.area * clamp((h.bypass.below - sash) / h.bypass.below, 0, 1);
}

/**
 * Lưu lượng thải (m³/s).
 * CAV: không đổi (580 CFM). VAV: theo diện tích cửa để giữ vận tốc đích, kẹp trong [vavMin, vavMax].
 * @param {number} sash mm
 * @param {{ mode?: "cav"|"vav", fan?: boolean }} [opts]
 * @returns {number}
 */
function exhaustFlow(sash, { mode = "cav", fan = true } = {}, h = HOOD) {
  if (!fan) return 0;
  if (mode === "vav") return clamp(h.target * openingArea(sash, h), h.vavMin, h.vavMax);
  return h.flowCav;
}

/**
 * Vận tốc mặt cửa (m/s) = lưu lượng qua cửa / diện tích cửa. Với tủ bypass, lưu lượng chia cho cửa và bypass
 * theo diện tích; qua khe rất hẹp vận tốc bão hoà quanh h.cap.
 * @param {number} sashMm độ mở kính (mm)
 * @param {{ mode?: "cav"|"vav", fan?: boolean }} [opts]
 * @returns {number} m/s
 */
function faceVelocity(sashMm, { mode = "cav", fan = true } = {}, h = HOOD) {
  const q = exhaustFlow(sashMm, { mode, fan }, h);
  if (q <= 0) return 0;
  const raw = q / (openingArea(sashMm, h) + bypassArea(sashMm, mode, h));
  return raw / (1 + (raw / h.cap) ** 4) ** 0.25;
}

/**
 * Hệ số rò ở vùng thở (MINH HOẠ): nồng độ khí đánh dấu (ppm) ở vùng thở khi nhả 4 L/min trong tủ, như phép thử
 * ASHRAE 110. Đạt khi ≤ 0,05 ppm.
 * - 0,40–0,65 m/s: khoảng 0,01 ppm. Dưới 0,40 m/s tăng 10 lần mỗi 0,1 m/s. Trên 0,65 m/s và kính mở > 250 mm,
 *   xoáy sau người làm tăng rò.
 * - Kính cao hơn chặn 18": ×(1 + 2·phần vượt/254 mm). Kính dưới 150 mm: tấm kính che chắn, ×0,2.
 * - Vật cản che khe dưới của vách ngăn: dòng quẩn ở mặt bàn, ×100. Người đi ngang (gió ngang ~1 m/s): ×20.
 * - Quạt tắt: khí tự lan ra theo đối lưu, 5 ppm khi kính gần đóng tới 65 ppm khi mở hết.
 * @param {{ velocity: number, sash: number, fan?: boolean, clutter?: boolean, walk?: boolean }} s
 * @returns {{ ppm: number, log10: number, pass: boolean }}
 */
function containment({ velocity, sash, fan = true, clutter = false, walk = false }, h = HOOD) {
  let ppm;
  if (!fan) ppm = sash <= 2 ? 0.5 : 5 + 60 * clamp(sash / h.sashMax, 0, 1);
  else {
    ppm = 0.01;
    if (velocity < 0.4) ppm *= 10 ** ((0.4 - velocity) / 0.1);
    if (velocity > 0.65 && sash > 250) ppm *= 10 ** ((velocity - 0.65) / 0.35);
    if (sash > h.sashStop) ppm *= 1 + (2 * (sash - h.sashStop)) / 254;
    if (sash < 150) ppm *= 0.2;
    if (clutter) ppm *= 100;
  }
  if (walk) ppm *= 20;
  ppm = Math.min(ppm, 200);
  return { ppm, log10: Math.log10(ppm), pass: ppm <= h.tracer.pass + 1e-12 };
}

/**
 * Lưu lượng khí sinh ra (L/min) từ một phản ứng trong tủ. NO₂: Cu + 4 HNO₃ → Cu(NO₃)₂ + 2 NO₂ + 2 H₂O,
 * 2 mol NO₂ cho 1 mol Cu, thể tích mol 24,45 L ở 25 °C.
 * @param {"NO2"|"none"} gas
 * @param {{ grams?: number, minutes?: number }} [opts] khối lượng Cu (g), thời gian phản ứng (phút)
 * @returns {number} L/min
 */
function gasSource(gas = "NO2", { grams = 5, minutes = 2 } = {}) {
  if (gas !== "NO2") return 0;
  return ((2 * grams) / 63.55) * 24.45 / minutes;
}

/**
 * Nồng độ ở vùng thở (ppm) từ hệ số rò: tỉ lệ thuận với lưu lượng nguồn so với 4 L/min của phép thử.
 * @param {number} leakPpm hệ số rò (ppm ở 4 L/min) từ containment()
 * @param {number} sourceLpm lưu lượng khí sinh ra (L/min)
 */
function breathingZone(leakPpm, sourceLpm, h = HOOD) {
  return (leakPpm * sourceLpm) / h.tracer.rate;
}

/**
 * Mức nguy hiểm của NO₂ ở vùng thở.
 * @param {number} ppm
 * @returns {"safe"|"stel"|"ceiling"|"idlh"} dưới 1 ppm, vượt giới hạn ngắn hạn, vượt trần OSHA, vượt IDLH
 */
function no2Level(ppm, h = HOOD) {
  if (ppm >= h.no2.idlh) return "idlh";
  if (ppm >= h.no2.ceiling) return "ceiling";
  if (ppm >= h.no2.stel) return "stel";
  return "safe";
}

/**
 * Toàn bộ trạng thái tủ cho một lựa chọn của người dùng.
 * @param {{ sash?: number, fan?: boolean, clutter?: boolean, walk?: boolean, mode?: "cav"|"vav", gas?: "NO2"|"none" }} [input]
 * @returns {{ sash: number, sashState: string, fan: boolean, mode: string, clutter: boolean, walk: boolean,
 *   flow: number, flowM3h: number, velocity: number, bypass: number, alarms: string[], leak: object,
 *   gas: { name: string, source: number, ppm: number, level: string }, safe: boolean, message: string }}
 *   bypass: phần mở của bypass (0–1); alarms: "airflow" (vận tốc dưới ngưỡng hoặc quạt tắt), "sash" (kính cao quá chặn);
 *   safe: tủ giữ được khí (đạt AM 0,05 hoặc kính đóng) và NO₂ ở vùng thở dưới 1 ppm.
 */
function hoodState({ sash = HOOD.sashStop, fan = true, clutter = false, walk = false, mode = "cav", gas = "NO2" } = {}, h = HOOD) {
  sash = clamp(Number(sash) || 0, 0, h.sashMax);
  mode = mode === "vav" ? "vav" : "cav";
  const flow = exhaustFlow(sash, { mode, fan }, h);
  const velocity = faceVelocity(sash, { mode, fan }, h);
  const state = sashState(sash, h);
  const bypass = fan ? bypassArea(sash, mode, h) / h.bypass.area : 0;
  const leak = containment({ velocity, sash, fan, clutter, walk }, h);
  const source = gasSource(gas);
  const ppm = breathingZone(leak.ppm, source, h);
  const level = no2Level(ppm, h);
  const alarms = [];
  if (!fan || velocity < h.alarmLow) alarms.push("airflow");
  if (state === "high") alarms.push("sash");
  const safe = (leak.pass || state === "closed") && level === "safe" && fan;
  let message;
  if (!fan) message = source > 0 ? "Quạt tắt: NO₂ tràn ra phòng" : "Quạt tắt: tủ không hút";
  else if (clutter) message = "Vật cản che khe dưới vách ngăn: khí quẩn ra cửa";
  else if (alarms.includes("airflow")) message = "Vận tốc dưới 0,41 m/s: báo động";
  else if (walk) message = "Người đi ngang: gió ngang kéo khí ra";
  else if (state === "high") message = "Kính cao quá chặn 457 mm";
  else if (state === "closed") message = "Kính đóng: khí qua khe gờ khí động";
  else message = "An toàn";
  return {
    sash, sashState: state, fan: Boolean(fan), mode, clutter: Boolean(clutter), walk: Boolean(walk),
    flow, flowM3h: flow * 3600, velocity, bypass, alarms, leak,
    gas: { name: gas, source, ppm, level }, safe, message,
  };
}

    for (const p of lane.parts) {
      const f = p.pos * n;
      const i = Math.min(n - 1, Math.floor(f));
      const t = f - i;
      const a = s[i];
      const b = s[i + 1];
      const side = t < 0.5 ? a[3] : b[3];
      const off = p.dx + (side === 1 ? gx * p.pos : 0);
      const x = a[0] + (b[0] - a[0]) * t + D.ex[0] * off;

function drawSash() {
  const s = state.sash.x;
  if (drawnShare !== null && Math.abs(s - drawnShare) < 1e-5) return;
  drawnShare = s;
  const slot = movers.map((part) => {
    const key = part.key + part.lift * s;
    let i = 0;
    while (i < staticKeys.length && staticKeys[i] <= key) i++;
    return { part, i, key };
  });
  slot.sort((a, b) => a.key - b.key);
  for (let j = slot.length - 1; j >= 0; j--) {
    const { part, i } = slot[j];
    part.node.setAttribute("transform", `translate(${(part.mx * s).toFixed(2)} ${(part.my * s).toFixed(2)})`);
    const before = j + 1 < slot.length && slot[j + 1].i === i ? slot[j + 1].part.node : i < staticNodes.length ? staticNodes[i] : layers.outer;
    if (part.node.nextSibling !== before) doc.insertBefore(part.node, before);
  }
  for (const { c, line, dot } of cables) {
    const ax = c.a[0] + c.m[0] * s;
    const ay = c.a[1] + c.m[1] * s;
    line.setAttribute("d", `M${ax.toFixed(1)} ${ay.toFixed(1)}L${c.b[0]} ${c.b[1]}`);
    dot.setAttribute("cx", ax.toFixed(1));
    dot.setAttribute("cy", ay.toFixed(1));
  }
}
function stepSash(dt, calm) {
  const L = state.sash;
  if (calm) { L.x = L.target; L.v = 0; return false; }
  // kính có đối trọng nên nhẹ tay: lò xo mềm, tắt dần đủ để không vọt quá nấc
  const stiffness = 30;
  const damping = 11;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (stiffness * (L.target - L.x) - damping * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.max(0, Math.min(1, L.x));
  if (L.target === 0 && L.x < 0.004) { L.x = 0; L.v = 0; return false; }
  if (Math.abs(L.target - L.x) < 2e-4 && Math.abs(L.v) < 2e-4) { L.x = L.target; L.v = 0; return false; }
  return true;
}

const say = (text) => { state.note = null; if (status.textContent !== text) status.textContent = text; };
const note = (text) => { say(text); state.note = { text, until: state.clock + 2.8 }; };
function model() {
  return hoodState({ sash: state.sash.x * D.sashMax, fan: state.fan, clutter: state.clutter, walk: walking(), mode: state.mode, gas: state.gas });
}
function setSash(mm) {
  state.sash.target = mm / D.sashMax;
  if (mm > HOOD.sashStop + 2) note(`Kính ${mm} mm: vượt chặn 18"`);
  else say(mm <= 2 ? "Hạ kính đóng hẳn." : `Kính mở ${mm} mm.`);
}
function sashStep(dir) {
  const now = Math.round(state.sash.target * D.sashMax);
  const list = dir > 0 ? STOPS.filter((s) => s > now + 1) : STOPS.filter((s) => s < now - 1).reverse();
  if (list.length) setSash(list[0]);
}
function toggleFan() { state.fan = !state.fan; state.alarmMuted = false; say(state.fan ? "Bật quạt hút." : "Tắt quạt hút."); }
function toggleClutter() { state.clutter = !state.clutter; say(state.clutter ? "Đặt thùng và chai sát vách ngăn: che khe dưới." : "Dọn vật cản khỏi vách ngăn."); }
function walkPast() { state.walk = 3.2; note("Người đi ngang: gió ngang"); }

const ease = (cur, target, dt, tau) => cur + (target - cur) * (1 - Math.exp(-dt / tau));
function update(dt, calm) {
  state.clock += dt;
  if (state.walk > 0) state.walk = Math.max(0, state.walk - dt);
  const m = model();
  for (const lane of Object.values(LANES)) {
    const on = Number(lane.on(m));
    const speed = lane.speed(m) * (on > 0 ? 1 : 0);
    lane.level = calm ? on : ease(lane.level, on, dt, on > lane.level ? 0.5 : 0.8);
    if (lane.level < 1e-3 && on === 0) lane.level = 0;
    lane.v = calm ? 0 : ease(lane.v, speed, dt, m.fan ? 0.5 : 1.4);
    if (!calm) for (const p of lane.parts) {
      p.pos += (dt * lane.v * 1000 * D.slow) / lane.path.length;
      if (p.pos >= 1) p.pos -= 1;
    }
  }
  // gió ngang: lên nhanh khi người đi qua, tắt dần
  const gustTarget = walking() ? Math.sin(Math.min(1, state.walk / 3.2) * Math.PI) || (state.walkHeld ? 0.6 : 0) : 0;
  state.gust = calm ? (walking() ? 0.6 : 0) : ease(state.gust, gustTarget, dt, 0.4);
  const cloudFlask = m.gas.source > 0 ? (m.fan ? 0.55 : 1) : 0;
  const cloudOut = m.gas.source > 0 && m.sash >= 90 ? escapeOf(m) : 0;
  state.cloud = calm ? [cloudFlask, cloudOut] : [ease(state.cloud[0], cloudFlask, dt, 0.8), ease(state.cloud[1], cloudOut, dt, 1.2)];
  // quạt tắt: khí tích lại trong buồng, đám khí ở miệng bình lớn dần
  const grow = m.gas.source > 0 && !m.fan ? 2.4 : 1;
  state.grow = calm ? grow : ease(state.grow, grow, dt, 2.5);
  state.clutterLevel = calm ? Number(state.clutter) : ease(state.clutterLevel, Number(state.clutter), dt, 0.25);
  return m;
}

const ppmText = (v) => (v >= 10 ? v.toFixed(0) : v >= 1 ? vn(v, 1) : v >= 0.1 ? vn(v, 2) : vn(v, 3));
function draw(m) {
  drawSash();
  placeParticles();
  // đám khí phồng xẹp chậm quanh tâm (biên độ nhỏ), đứng yên khi giảm chuyển động
  const breathe = still.matches ? 1 : 1 + 0.08 * Math.sin(state.clock * 1.3);
  clouds.flask.style.opacity = state.cloud[0].toFixed(3);
  clouds.out.style.opacity = state.cloud[1].toFixed(3);
  clouds.flask.style.transform = `scale(${(breathe * state.grow).toFixed(3)})`;
  // đám khí ngoài tủ đặt theo làn khí đang thoát (cao hay thấp theo độ mở kính)
  const lane = (state.sash.x * D.sashMax >= 400 ? LANES.gasEscapeHigh : LANES.gasEscapeLow).path.samples;
  const c = lane[Math.floor(lane.length * 0.72)];
  clouds.out.setAttribute("cx", c[0]);
  clouds.out.setAttribute("cy", c[1]);
  clouds.out.style.transform = `scale(${breathe.toFixed(3)})`;
  doc.style.setProperty("--clutter", state.clutterLevel.toFixed(3));
  doc.style.setProperty("--light", "1");
  const air = m.alarms.includes("airflow");
  const value = m.fan ? vn(m.velocity) : "0,00";
  const line = !m.fan ? "QUẠT TẮT" : air ? "THẤP · BÁO" : m.sashState === "high" ? "KÍNH CAO" : "OK";
  if (lcd.value.textContent !== value) lcd.value.textContent = value;
  if (lcd.line.textContent !== line) lcd.line.textContent = line;
  leds.ok.toggleAttribute("data-on", m.fan && !air);
  leds.alarm.toggleAttribute("data-on", air && (still.matches || Math.floor(state.clock * 2.4) % 2 === 0));
  keyFan?.toggleAttribute("data-on", m.fan);
  keyLight?.toggleAttribute("data-on", true);
  svgEl.toggleAttribute("data-alarm", air);
  let tail;
  if (!m.fan) tail = "quạt tắt";
  else if (m.clutter) tail = "vật cản";
  else if (air) tail = "báo động";
  else if (walking()) tail = "gió ngang";
  else if (m.sashState === "high") tail = "kính cao";
  else tail = "an toàn";
  if (m.gas.level !== "safe") tail = { stel: "vượt 1 ppm", ceiling: "vượt trần", idlh: "vượt IDLH" }[m.gas.level];
  let text = m.gas.source > 0 ? `${vn(m.velocity)} m/s · NO₂ ${ppmText(m.gas.ppm)} ppm · ${tail}` : `${vn(m.velocity)} m/s · ${Math.round(m.flowM3h)} m³/h · ${tail}`;
  if (state.note && state.clock < state.note.until) text = state.note.text;
  if (readout.textContent !== text) readout.textContent = text;
}

// ——— Vòng lặp, tour tự chạy ———
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches && !RUN;
const TOUR = [
  [4, () => setSash(305)],
  [4, () => setSash(152)],
  [4, () => setSash(HOOD.sashMax)],
  [5.5, () => setSash(HOOD.sashStop)],
  [4, () => { if (!state.clutter) toggleClutter(); }],
  [5.5, () => { if (state.clutter) toggleClutter(); }],
  [3, () => walkPast()],
  [4.5, () => { if (state.fan) toggleFan(); }],
  [5.5, () => { if (!state.fan) toggleFan(); }],
];
let tour = { i: 0, wait: TOUR[0][0] };
let idleTimer = 0;
function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  TOUR[tour.i][1]();
  tour.i = (tour.i + 1) % TOUR.length;
  tour.wait = TOUR[tour.i][0];
}
function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  stepSash(dt, calm);
  draw(update(dt, calm));
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches) return; tour = { i: 0, wait: 1 }; touring = true; loop(); }, 12000);
}
function settleStill() {
  stepSash(0, true);
  draw(update(0, true));
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  if (!["ArrowUp", "ArrowDown", " ", "c", "w"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === "ArrowUp") sashStep(1);
  else if (key === "ArrowDown") sashStep(-1);
  else if (key === " ") toggleFan();
  else if (key === "c") toggleClutter();
  else walkPast();
  if (still.matches) settleStill();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest('[data-name^="sash."]')) {
    const now = Math.round(state.sash.target * D.sashMax);
    const next = STOPS.find((s) => s > now + 1);
    setSash(next ?? 0);
  } else if (event.target.closest(".fh-clutter-item, [data-name^='hood.baffle']")) toggleClutter();
  else toggleFan();
  stage.focus({ preventScroll: true });
  if (still.matches) settleStill();
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));
settleStill();
</script></body></html>
