<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bình nitơ lỏng</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình bình nitơ lỏng. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt trên nhóm cảnh: --fog (0–1, sương tràn từ cổ), --fill (0–1, đang rót); trên vạch LED: data-on;
   trên đèn LOW LEVEL: data-on, data-flash; trên nút RESET: data-on; trên cảnh: data-alarm (còi đang kêu). */
.iso {
  --ln-cav-top: #1c2126;
  --ln-cav-0: #121619;
  --ln-cav-1: #161a1e;
  --ln-cav-2: #1a1f23;
  --ln-cav-3: #1f2429;
  --ln-section: #3a4148;
  --ln-vacuum: #090b0d;
  --ln-mli: #9aa7b0;
  --ln-neck: #6f6a4c;
  --ln-liquid: #8fc4e8;
  --ln-liquid-top: #b9dcf3;
  --ln-box: #d9dde0;
  --ln-cork: #a27d4f;
  --ln-black: #0c0d0e;
  --ln-glove: #3f73c9;
  --ln-visor: #a9cbe0;
  --ln-paper: #e7e4da;
  --ln-window: #0b0c0c;
  --ln-seg-off: #2a1a10;
  --ln-seg: #ff8a24;
  --ln-lamp-off: #2a1a1a;
  --ln-lamp: #ff4a3a;
  --ln-button: #23272a;
  --ln-reset-off: #17301f;
  --ln-reset: #3ee07a;
  --ln-fog: #dfe9f0;
  --ln-pour: #a8d4f2;
}
.iso[data-theme="light"] {
  --ln-cav-top: #b7bec4;
  --ln-cav-0: #a3aab0;
  --ln-cav-1: #aab1b7;
  --ln-cav-2: #b1b8be;
  --ln-cav-3: #b8bfc5;
  --ln-section: #d7dbdf;
  --ln-vacuum: #4a5258;
  --ln-mli: #e4e9ec;
  --ln-neck: #b9b18a;
  --ln-liquid: #4f9fd8;
  --ln-liquid-top: #7cb8e4;
  --ln-box: #fbfbfa;
  --ln-cork: #b88a52;
  --ln-black: #2b2e31;
  --ln-glove: #2f63c0;
  --ln-visor: #7fb1d2;
  --ln-paper: #fffdf6;
  --ln-window: #16181a;
  --ln-seg-off: #3a2618;
  --ln-seg: #ff8a24;
  --ln-lamp-off: #3a2a2a;
  --ln-lamp: #ff3b2b;
  --ln-button: #3a4044;
  --ln-reset-off: #1d3a27;
  --ln-reset: #39d873;
  --ln-fog: #9fb6c6;
  --ln-pour: #5aa9e0;
}

/* Lòng bình trong (thép trong bóng tối): tông tối riêng */
.ln-cavity .iso-fill { fill: var(--ln-cav-0); }
.ln-cavity .iso-top { fill: var(--ln-cav-top); }
.ln-cavity .iso-shade[data-shade="0"] { fill: var(--ln-cav-0); stroke: var(--ln-cav-0); stroke-width: 0.4px; }
.ln-cavity .iso-shade[data-shade="1"] { fill: var(--ln-cav-1); stroke: var(--ln-cav-1); stroke-width: 0.4px; }
.ln-cavity .iso-shade[data-shade="2"] { fill: var(--ln-cav-2); stroke: var(--ln-cav-2); stroke-width: 0.4px; }
.ln-cavity .iso-shade[data-shade="3"] { fill: var(--ln-cav-3); stroke: var(--ln-cav-3); stroke-width: 0.4px; }
.ln-neck .iso-fill, .ln-neck .iso-shade { fill: color-mix(in oklab, var(--ln-neck) 55%, var(--ln-cav-1)); stroke: none; }

/* Mặt cắt: kim loại sáng, khoảng chân không tối, lớp cách nhiệt ánh bạc */
.ln-section .iso-fill, .ln-section .iso-shade { fill: var(--ln-section); stroke: none; }
.ln-vacuum { fill: var(--ln-vacuum); }
.ln-mli { stroke: var(--ln-mli); stroke-opacity: 0.75; }

/* LN2: trong mờ, xanh nhạt; mặt thoáng sáng hơn */
.ln-liquid .iso-fill { fill: var(--ln-liquid); fill-opacity: 0.2; }
.ln-liquid .iso-top { fill: var(--ln-liquid-top); fill-opacity: 0.34; }
.ln-liquid .iso-shade { fill: var(--ln-liquid); fill-opacity: 0.16; stroke: none; }
.ln-liquid .iso-edge { stroke: color-mix(in oklab, var(--ln-liquid), var(--anatomy-lo) 35%); }

/* Hộp cryo (nhựa trắng), thép giá, nút bần, nắp đen, găng, tấm che, giấy nhãn */
.ln-box .iso-top, .ln-box .iso-shade { fill: color-mix(in oklab, var(--ln-box) 42%, var(--anatomy-shade-2)); stroke: none; }
.ln-box .iso-top { fill: color-mix(in oklab, var(--ln-box) 55%, var(--anatomy-shade-3)); }
.ln-cork .iso-top, .ln-cork .iso-shade { fill: color-mix(in oklab, var(--ln-cork) 62%, var(--anatomy-shade-1)); stroke: none; }
.ln-black .iso-top, .ln-black .iso-shade { fill: color-mix(in oklab, var(--ln-black) 80%, var(--anatomy-shade-1)); stroke: none; }
.ln-glove .iso-top, .ln-glove .iso-shade { fill: color-mix(in oklab, var(--ln-glove) 65%, var(--anatomy-shade-1)); stroke: none; }
.ln-visor .iso-fill { fill: var(--ln-visor); fill-opacity: 0.14; }
.ln-visor .iso-top, .ln-visor .iso-shade { fill: var(--ln-visor); fill-opacity: 0.22; stroke: none; }
.ln-paper .iso-top, .ln-paper .iso-shade { fill: color-mix(in oklab, var(--ln-paper) 55%, var(--anatomy-shade-2)); stroke: none; }

/* Bộ đo mức: cửa sổ LED, 8 vạch, đèn LOW LEVEL, nút RESET */
.ln-window { fill: var(--ln-window); }
.ln-seg { fill: var(--ln-seg-off); transition: fill 0.2s var(--anatomy-ease); }
.ln-seg[data-on] { fill: var(--ln-seg); }
.ln-lamp { fill: var(--ln-lamp-off); }
.ln-lamp[data-on] { fill: var(--ln-lamp); }
.ln-button { fill: var(--ln-button); }
.ln-reset { fill: var(--ln-reset-off); }
.ln-reset[data-on] { fill: var(--ln-reset); }
[data-flash] { animation: ln-flash 0.9s steps(2, jump-none) infinite; }
@keyframes ln-flash { 50% { opacity: 0.2; } }

/* Sương trắng (hơi nước ngưng tụ) tràn ra từ cổ khi mở nắp, lớp hơi lạnh trên mặt LN2, dòng LN2 rót vào */
.ln-fog ellipse, .ln-mist ellipse { fill: var(--ln-fog); }
.ln-fog { opacity: var(--fog, 0); pointer-events: none; }
.ln-fog ellipse { opacity: 0.18; transform-box: fill-box; transform-origin: center; animation: ln-drift 3.6s linear infinite; animation-delay: calc(var(--i) * -0.45s); }
@keyframes ln-drift {
  0% { transform: translate(0, -4px) scale(0.6); opacity: 0; }
  20% { opacity: 0.36; }
  100% { transform: translate(var(--dx, 0px), var(--dy, 40px)) scale(1.9); opacity: 0; }
}
.ln-mist { pointer-events: none; }
.ln-mist ellipse { opacity: calc(0.07 + var(--fog, 0) * 0.08); }
.ln-pour-col { fill: url(#ln-pour-grad); }
.ln-pour-stop0 { stop-color: var(--ln-pour); stop-opacity: 0; }
.ln-pour-stop1 { stop-color: var(--ln-pour); stop-opacity: 0.85; }
.ln-splash { fill: var(--ln-fog); opacity: 0.5; }
@media (prefers-reduced-motion: reduce) {
  .ln-fog ellipse { animation: none; opacity: 0.09; transform: translate(calc(var(--dx, 0px) * 0.7), calc(var(--dy, 40px) * 0.7)) scale(1.5); }
  [data-flash] { animation: none; }
}

.ln-stage { touch-action: pan-y; cursor: pointer; }
.ln-stage:focus { outline: none; }
.ln-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }

<span class="ln-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Giá phía trước: 10 hộp cryo, mỗi hộp 10 × 10 lọ 2 mL; nhấc lên qua cổ bình</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Màn LED 8 vạch của bộ đo mức siêu âm trên nắp, đèn LOW LEVEL và nút RESET</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Khoảng chân không và các lớp cách nhiệt giữa vỏ ngoài và bình trong</span></span><span class="iso-caption">Bình vẽ theo Thermo Scientific Locator 4 Plus (Ø 55,9 cm, cao 100,3 cm kể cả nắp, thêm 2,5 cm bộ đo mức và 10,2 cm xe đẩy): 121 L LN2, 4 giá × 10 hộp = 4 000 lọ 2 mL ngập trong LN2, cổ Ø 21,5 cm. LN2 sôi ở −196 °C và bay hơi tĩnh 0,99 L/ngày, nên một lần nạp đầy giữ được khoảng 122 ngày; mức không được vượt 55,8 cm (đỉnh giá). Bộ đo mức siêu âm (sai số ±2&quot;) bật đèn LOW LEVEL khi còn dưới 5 cm (khoảng ngày 111 sau khi nạp đầy) và kêu còi dưới 2,5 cm; trước khi nhấc nắp phải bấm RESET. Mỗi lít LN2 bay hơi thành khoảng 694 L khí N₂ không màu (sương trắng là hơi nước ngưng tụ): 30 L bay hơi trong một tháng là 20,6 m³ khí; trong phòng kín 30 m³, chỉ cần 2,9 L bay hơi là O₂ xuống 19,5 %, và 10 L đổ ra làm O₂ còn 16,1 % — vì vậy phòng cần thông gió và máy đo O₂, người thao tác đeo găng cryo và tấm che mặt. Pha hơi trên mặt LN2 lạnh dần xuống dưới; đường nhiệt độ theo độ cao chỉ minh hoạ. Vỏ chân không, lớp cách nhiệt và giá vẽ theo cấu tạo điển hình, không theo bản vẽ của hãng. Hình tua nhanh (1 ngày mỗi bước phím).</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];
        });
        const insetTop = inset.map(([x, y]) => iso([x, y, z + height], projection));
        bevel = runsOf(facing, true)
            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))
            .join("");
    }
    return {
        fill,
        outline: outline.join(""),
        crease: crease.join(""),
        top: pathOf(oriented(top), true),
        shades: buckets.map((paths) => paths.join("")),
        bevel,

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

    return `<g class="ln-cork">${S(G.disc(-D.cork.h, 0, D.cork.r, F, P, { bevel: 0.6 }), { tone: "mid", inner: arcs })}</g>`;
  }
  function capSvg() {
    const seam = Ln(G.arcOf(F, C.rim, C.r, P), { tone: "faint" });
    const cap = `<g class="ln-capshell">${S(G.lathe(CAP, F, P, { smooth: true }), { tone: "mid", inner: seam })}</g>`;
    const housing = S(k.slabOf(plan, D.z + H.s0, H.s1 - H.s0, P, 4, 0.5), { tone: "hi" });
    return cap + housing + topSvg() + faceSvg();
  }
  function svg(which = "all") {
    if (which === "cork") return corkSvg();
    if (which === "cap") return capSvg();
    return corkSvg() + capSvg();
  }
  function shapes(A, which = "all", prefix = "lid") {
    const meta = (name) => ({ name: `${prefix}.${name}`, owner: prefix });
    const cork = [A.disc(F, -D.cork.h, 0, D.cork.r, meta("cork"))];
    const cap = [A.solid(F, CAP, meta("cap")), A.slab(plan, D.z + H.s0, H.s1 - H.s0, meta("monitor"), 4)];
    if (which === "cork") return cork;
    if (which === "cap") return cap;
    return [...cork, ...cap];
  }
  return { svg, shapes, SEG };
}
// Giá đứng bằng thép không gỉ và chồng 10 hộp cryo (hộp 2", 10 × 10 lọ) của bình nitơ lỏng.
// Dùng chung cho bản dựng (Node: hình và hình dạng để kiểm tra) và trang (dựng lại giá đang nhấc,
// và phần giá nằm trên mặt LN2 mỗi khi mức LN2 đổi).
// Toạ độ của giá: u hướng ra thành bình (theo bán kính), v theo tiếp tuyến, z lên; tâm giá ở (cx, cy).
// Giá hở hai mặt u = ±35 để rút hộp, hai tấm bên ở v = ±(33,2…34,8), quai ở mép trong (u < 0) vươn lên phía cổ bình.

function makeRack(k, G, P, D) {
  const V = G.viewOf(P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);
  const f2 = (v) => Math.round(v * 100) / 100;
  const { half, box, boxes, tray, plate, rod, tab } = D;
  const stackTop = tray + boxes * box; // từ đáy giá
  const top = stackTop + plate.over; // đỉnh tấm bên
  const rodTop = top + rod.h;

  function frameAt(cx, cy, angle) {
    const u = [Math.cos(angle), Math.sin(angle), 0];
    const v = [-Math.sin(angle), Math.cos(angle), 0];
    return G.frameOf([cx, cy, 0], [0, 0, 1], u, v);
  }
  const world = (F, u, v, z) => [F.o[0] + F.u[0] * u + F.v[0] * v, F.o[1] + F.u[1] * u + F.v[1] * v, z];
  const rect = (u0, u1, v0, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];
  const SQ = rect(-half.box, half.box, -half.boxV, half.boxV);
  const TRAY = rect(-half.rack, half.rack, -half.rack, half.rack);
  // Bốn thanh góc (thép chữ L dẹt) ở hai mặt bên v = ±(boxV…rack), để thấy chồng hộp giữa các thanh
  const POST = (su, sv) => {
    const u0 = su > 0 ? half.rack - 8 : -half.rack;
    const v0 = sv > 0 ? half.boxV : -half.rack;
    return rect(u0, u0 + 8, v0, v0 + (half.rack - half.boxV));
  };
  const BAR = rect(-half.rack, -half.rack + 4, -half.boxV, half.boxV);
  const TAB = rect(-half.rack, -half.rack + tab.d, -tab.w, tab.w);

  // Các phần của giá ở đáy z0, chỉ phần nằm trên `from` (dùng để vẽ phần khô trên mặt LN2).
  function parts(cx, cy, angle, z0, from = -Infinity) {
    const F = frameAt(cx, cy, angle);
    const clip = (a, b) => [Math.max(a, from), b];
    const nearSide = G.dot3(F.v, V) > 0 ? 1 : -1;
    const list = [];
    const prism = (name, poly, a, b, extra = {}) => {
      const [s0, s1] = clip(a, b);
      if (s1 - s0 > 0.05) list.push({ name, poly, s0, s1, F, ...extra });
    };
    const posts = [[1, 1], [1, -1], [-1, 1], [-1, -1]].map(([su, sv]) => ({ su, sv, d: G.dot3(G.add3(G.mul3(F.u, su), G.mul3(F.v, sv)), V) }));
    posts.sort((a, b) => a.d - b.d);
    prism("tray", TRAY, z0, z0 + tray);
    for (const p of posts.filter((p) => p.sv !== nearSide)) prism(`post${p.su > 0 ? "o" : "i"}${p.sv > 0 ? "a" : "b"}`, POST(p.su, p.sv), z0, z0 + top);
    prism("stack", SQ, z0 + tray, z0 + stackTop, { stack: true });
    prism("bar", BAR, z0 + stackTop, z0 + top);
    for (const p of posts.filter((p) => p.sv === nearSide)) prism(`post${p.su > 0 ? "o" : "i"}${p.sv > 0 ? "a" : "b"}`, POST(p.su, p.sv), z0, z0 + top);
    const [r0, r1] = clip(z0 + top, z0 + rodTop);
    if (r1 - r0 > 0.05) list.push({ name: "rod", rod: true, s0: r0, s1: r1, F, at: [-half.rack + 2, 0] });
    prism("tab", TAB, z0 + rodTop, z0 + rodTop + tab.h, { tab: true });
    return list;
  }

  // Vạch nối giữa các hộp: nửa gần của chu vi chồng hộp ở mỗi mặt nối, kết thúc đúng ở cạnh đứng của khối.
  function seams(F, z0, s0, s1) {
    const ring = SQ.map(([u, v]) => world(F, u, v, 0).slice(0, 2));
    let d = "";
    for (let i = 1; i < boxes; i++) {
      const z = z0 + tray + i * box;
      if (z > s0 + 0.3 && z < s1 - 0.3) d += k.ringSeam(ring, z, P);
    }
    // Đường nắp hộp: mỗi hộp có nắp cao 1/4 hộp
    for (let i = 0; i < boxes; i++) {
      const z = z0 + tray + (i + 0.78) * box;
      if (z > s0 + 0.3 && z < s1 - 0.3) d += k.ringSeam(ring, z, P);
    }
    return d;
  }
  // Nhãn trên mặt hộp quay ra ngoài (u = +box) nếu mặt đó nhìn thấy: khung kín, không có đầu nét.
  function labels(F, z0, s0, s1) {
    const face = G.dot3(F.u, V) > 0.05 ? 1 : G.dot3(F.u, V) < -0.05 ? -1 : 0;
    if (!face) return "";
    let d = "";
    for (let i = 0; i < boxes; i++) {
      const zc = z0 + tray + (i + 0.36) * box;
      if (zc - 4 < s0 || zc + 4 > s1) continue;
      const pts = [[-14, zc - 3.6], [14, zc - 3.6], [14, zc + 3.6], [-14, zc + 3.6]].map(([v, z]) => k.iso(world(F, face * half.box, v * face, z), P));
      d += k.pathOf(pts, true);
    }
    return d;
  }

  function svg(cx, cy, angle, z0, { from = -Infinity, lit = false, cls = "" } = {}) {
    const out = [];
    for (const p of parts(cx, cy, angle, z0, from)) {
      if (p.rod) {
        const R = G.frameOf(world(p.F, p.at[0], p.at[1], 0), [0, 0, 1], p.F.u, p.F.v);
        out.push(S(G.disc(p.s0, p.s1, rod.r, R, P, { steps: 14 }), { tone: "mid" }));
        continue;
      }
      const paths = G.prismOf(p.F, p.poly, p.s0, p.s1, P);
      if (p.stack) {
        const inner = Ln(seams(p.F, z0, p.s0, p.s1), { tone: "faint" });
        const lab = labels(p.F, z0, p.s0, p.s1);
        out.push(`<g class="ln-box${lit ? " ln-box-lit" : ""}">${S(paths, { tone: lit ? "hi" : "mid", lit, inner })}${lab ? Ln(lab, { tone: "lo" }) : ""}</g>`);
      } else if (p.tab) {
        const c = world(p.F, -half.rack + tab.d / 2, 0, p.s1);
        const ring = k.pathOf(Array.from({ length: 16 }, (_, i) => k.iso([c[0] + 2.2 * Math.cos((i / 16) * 2 * Math.PI), c[1] + 2.2 * Math.sin((i / 16) * 2 * Math.PI), p.s1], P)), true);
        out.push(S(paths, { tone: "mid", inner: "" }) + Ln(ring, { tone: "lo" }));
      } else out.push(`<g class="ln-steel">${S(paths, { tone: "mid" })}</g>`);
    }
    return cls ? `<g class="${cls}">${out.join("")}</g>` : out.join("");
  }

  function shapes(A, cx, cy, angle, z0, prefix, owner) {
    return parts(cx, cy, angle, z0).map((p) => {
      if (p.rod) {
        const R = G.frameOf(world(p.F, p.at[0], p.at[1], 0), [0, 0, 1], p.F.u, p.F.v);
        return A.disc(R, p.s0, p.s1, rod.r, { name: `${prefix}.rod`, owner });
      }
      return A.prism(p.F, p.poly, p.s0, p.s1, { name: `${prefix}.${p.name}`, owner });
    });
  }

  return { svg, shapes, parts, frameAt, top, rodTop, stackTop, height: rodTop + tab.h, f2 };
}
// Mô hình bình nitơ lỏng bảo quản mẫu, dùng chung cho bản dựng (Node), trang hình (trình duyệt) và lõi mô phỏng của app.
// Module thuần: không DOM, không Three.js.

//     còi kêu liên tục và màn LED nhấp nháy khi bình hết LN2 hoặc bộ đo lỗi;
//     phải bấm RESET (chế độ Reset/Hold, không đo) trước khi nhấc nắp; để Hold quá 5 phút thì còi kêu;
//     sau khi đậy lại cần khoảng 15 phút để sương trong cổ tan và số đo ổn định.
// - Manual LT509X1 (2008), bảng phụ tùng: Locator 4 Plus có 4 giá, 10 hộp mỗi giá (40 hộp), lọ 2,0 mL Ø 13,5 × 48,3 mm:
//   https://knowledge1.thermofisher.com/Manual_Repository/LT509X1-EN_-_Rev_01_-_Locator_and_Locator_Plus_Cryobiological_Storage_Vessel_and_Liquid_Nitrogen_Level_Monitor_Operating_Manual
// - Trang sản phẩm CY509108 (Thermo Fisher): cổ bình Ø trong 8,5" (21,5 cm), thời gian giữ tĩnh 122 ngày,
//   giữ mẫu dưới −180 °C kể cả khi còn dưới 2" (5 cm) LN2, khối lượng vận chuyển 53,5 kg, có tiếp điểm báo động khô:
//   https://www.thermofisher.com/order/catalog/product/CY509108

// - Tỉ lệ giãn nở LN2 → khí: 1 : 694 (từ điểm sôi tới 20 °C), USDA ARS "Liquid Nitrogen Safety":
//   https://www.ars.usda.gov/northeast-area/docs/safety-health-and-environmental-training/liquid-nitrogen-safety/
//   (kiểm lại: LN2 0,807 kg/L ở 77 K, N2 khí 1,165 kg/m³ ở 20 °C, 1 atm → khoảng 693.)
// - O2 trong không khí khô 20,9 % theo thể tích; ngưỡng thiếu O2 19,5 % (OSHA 29 CFR 1910.146, cũng ghi trong manual).
//
// Giả định (chưa xác minh):
// - Mức LN2 tỉ lệ thuận với thể tích: tiết diện = 121 L / 55,8 cm ≈ 2,17 L/cm (bình trong Ø khoảng 52 cm),
//   bỏ qua thể tích giá và hộp chiếm chỗ, bỏ qua đáy cong.
// - Nhiệt độ pha hơi theo độ cao trên mặt LN2 chỉ minh hoạ: −196 °C ở mặt thoáng, tăng chậm tới −180 °C ở
//   khoảng 50 cm (khớp câu "dưới −180 °C khi còn dưới 5 cm LN2" của hãng với hộp trên cùng cao khoảng 52 cm),
//   rồi tăng nhanh trong cổ bình. Hãng không công bố đường nhiệt độ.
// - Ước tính O2 coi khí N2 trộn đều trong phòng kín, không thông gió: O2 = 20,9 × (1 − V_khí / V_phòng).
// - Mở nắp làm tăng bay hơi nhưng hãng không công bố lượng tăng, nên mô hình bỏ qua.

/** Thông số bình (Thermo Scientific Locator 4 Plus, CY509108). */
const VESSEL = {
  model: "Thermo Scientific Locator 4 Plus (CY509108)",
  capacityL: 121, // L, lưu mẫu pha lỏng
  evapLPerDay: 0.99, // L/ngày, bay hơi tĩnh
  holdingDays: 122, // ngày, thời gian giữ tĩnh (hãng)
  maxFillCm: 55.8, // cm, mức cao nhất khi đã đặt giá
  heightCm: 100.3, // cm, kể cả nắp
  diameterCm: 55.9, // cm
  neckCm: 21.5, // cm, đường kính trong cổ
  monitorCm: 2.54, // cm, bộ đo mức làm cao thêm
  cartCm: 10.16, // cm, xe đẩy làm cao thêm
  shipKg: 53.5,
  racks: 4,
  boxesPerRack: 10,
  vialsPerBox: 100, // hộp System 100, 10 × 10 lọ
  vials: 4000,
  sampleLimitC: -180, // giữ mẫu dưới mức này kể cả khi còn dưới 5 cm LN2 (hãng)
};

/** Bộ đo mức siêu âm gắn trên nắp. */
const MONITOR = {
  segments: 8,
  accuracyCm: 5.08, // ±2"
  lowCm: 5.08, // đèn LOW LEVEL
  alarmCm: 2.54, // còi và báo động từ xa
  holdAlarmMin: 5, // Reset/Hold quá 5 phút thì còi kêu
  settleMin: 15, // sương trong cổ tan sau khoảng 15 phút
};

/** Tính chất nitơ lỏng và không khí. */
const LN2 = {
  boilC: -196, // °C ở 1 atm (manual ghi −196 °C; chính xác −195,8 °C)
  expansion: 694, // L khí ở 20 °C cho 1 L lỏng
  o2Air: 20.9, // % thể tích
  o2Limit: 19.5, // % ngưỡng thiếu oxy
};

/** Tiết diện bình trong (L cho mỗi cm chiều cao), giả định mức tỉ lệ thuận với thể tích. */
const AREA_L_PER_CM = VESSEL.capacityL / VESSEL.maxFillCm;

/** Chiều cao mặt LN2 trên đáy bình (cm) khi bình chứa `litres` lít. */
const levelCm = (litres) => Math.max(0, litres) / AREA_L_PER_CM;

/** Thể tích LN2 (L) ứng với mức `cm` trên đáy bình. */
const litresAt = (cm) => Math.max(0, cm) * AREA_L_PER_CM;

/** Thời gian giữ tĩnh (ngày) từ lúc bình có `startL` lít tới khi cạn. */
const holdingDays = (startL = VESSEL.capacityL) => Math.max(0, startL) / VESSEL.evapLPerDay;

/**
 * LN2 còn lại sau `days` ngày đậy nắp, bắt đầu từ `startL` lít (mặc định đầy).
 * @returns {{litres:number, cm:number, fraction:number, evaporated:number, empty:boolean}}
 *   litres: lít còn lại; cm: mức trên đáy; fraction: phần của dung tích 121 L;
 *   evaporated: lít đã bay hơi; empty: đã cạn.
 */
function levelAfter(days, startL = VESSEL.capacityL) {
  const start = Math.min(VESSEL.capacityL, Math.max(0, startL));
  const litres = Math.max(0, start - VESSEL.evapLPerDay * Math.max(0, days));
  return { litres, cm: levelCm(litres), fraction: litres / VESSEL.capacityL, evaporated: start - litres, empty: litres <= 1e-9 };
}

/** Số ngày từ lúc bình có `startL` lít tới khi mức LN2 xuống còn `cm` cm. */
const daysUntil = (cm, startL = VESSEL.capacityL) => Math.max(0, (startL - litresAt(cm)) / VESSEL.evapLPerDay);

/**
 * Nhiệt độ pha hơi (°C) ở độ cao `heightCm` trên mặt LN2. Đường minh hoạ, không theo số đo của hãng:
 * −196 °C ở mặt thoáng, −180 °C ở 50 cm, rồi tăng nhanh trong cổ bình tới khoảng −70 °C ở 75 cm.
 */
function vaporTemp(heightCm) {
  const h = Math.max(0, heightCm);
  if (h <= 50) return LN2.boilC + 16 * (h / 50) ** 1.5;
  return -180 + 110 * Math.min(1, (h - 50) / 25) ** 1.2;
}

/** Thể tích khí N2 (m³, 20 °C) sinh ra khi `litres` lít LN2 bay hơi hết. */
const gasM3 = (litres) => (Math.max(0, litres) * LN2.expansion) / 1000;

/**
 * Nồng độ O2 (% thể tích) ước tính khi `litresLN2` lít LN2 bay hơi trong phòng kín `roomM3` m³,
 * khí trộn đều, không thông gió: O2 = 20,9 × (1 − V_khí / V_phòng), không âm.
 */
function oxygenPercent(litresLN2, roomM3 = 30) {
  const room = Math.max(1e-6, roomM3);
  return Math.max(0, LN2.o2Air * (1 - gasM3(litresLN2) / room));
}

/** Lượng LN2 (L) bay hơi trong phòng `roomM3` m³ thì O2 chạm ngưỡng 19,5 %. */
const litresToO2Limit = (roomM3 = 30) => ((1 - LN2.o2Limit / LN2.o2Air) * roomM3 * 1000) / LN2.expansion;

/**
 * Trạng thái bộ đo mức siêu âm ở mức LN2 `level` (cm trên đáy).
 * @param {number} level  cm
 * @param {{hold?:boolean, holdMin?:number}} opt  hold: đang ở chế độ Reset/Hold (nắp đã nhấc); holdMin: số phút đã Hold.
 * @returns {{state:string, segments:number, lowLamp:boolean, audible:boolean, flash:boolean, reset:boolean, text:string}}
 *   state: "ok" | "low" (dưới 2") | "alarm" (dưới 1") | "empty" | "hold" | "hold-alarm".
 */
function alarmState(level, { hold = false, holdMin = 0 } = {}) {
  if (hold) {
    const over = holdMin > MONITOR.holdAlarmMin;
    return { state: over ? "hold-alarm" : "hold", segments: 0, lowLamp: false, audible: over, flash: false, reset: true, text: over ? "HOLD quá 5 phút · còi" : "RESET/HOLD · không đo" };
  }
  const cm = Math.max(0, level);
  const segments = cm <= 1e-6 ? 0 : Math.max(1, Math.min(MONITOR.segments, Math.ceil((cm / VESSEL.maxFillCm) * MONITOR.segments)));
  if (cm <= 0.05) return { state: "empty", segments: 0, lowLamp: true, audible: true, flash: true, reset: false, text: "CẠN · còi liên tục" };
  if (cm < MONITOR.alarmCm) return { state: "alarm", segments, lowLamp: true, audible: true, flash: false, reset: false, text: "dưới 1\" · còi" };
  if (cm < MONITOR.lowCm) return { state: "low", segments, lowLamp: true, audible: false, flash: false, reset: false, text: "LOW LEVEL · dưới 2\"" };
  return { state: "ok", segments, lowLamp: false, audible: false, flash: false, reset: false, text: "bình thường" };

  state.queue = [];
  if (state.fill) return;
  if (state.rack.target !== 0) { lowerRack(); state.queue.push("open", "fill"); return; }
  if (!lidOff()) { openLid(); state.queue.push("fill"); return; }
  startFill();
}
function startFill() { state.fill = { age: 0, stop: 0, from: state.shown.x }; say("Rót LN2 qua cổ bình tới vạch 55,8 cm."); }
function stepDays(delta) {
  if (state.fill) return;
  state.days = clamp(Math.round(state.days + delta), 0, 400);
}
function runQueue() {
  const next = state.queue[0];
  if (!next) return;
  if (next === "lift" && lidOff()) { state.queue.shift(); liftRack(); }
  else if (next === "open" && rackDown()) { state.queue.shift(); openLid(); }
  else if (next === "fill" && lidOff() && rackDown()) { state.queue.shift(); startFill(); }
  else if (next === "close" && rackDown()) { state.queue.shift(); closeLid(); }
}

function update(dt, calm) {
  state.clock += dt;
  let moving = settleTo(state.lid, state.lid.target, dt, 0.32, calm);
  moving = settleTo(state.rack, state.rack.target, dt, 0.42, calm) || moving;
  if (state.lid.x > 1) state.lid.x = 1;
  if (state.rack.x > 1) state.rack.x = 1;
  if (state.lid.x < 0) state.lid.x = 0;
  if (state.rack.x < 0) state.rack.x = 0;
  if (state.lid.target === 0 && state.lid.x < 0.004) { state.lid.x = 0; state.lid.v = 0; }
  if (state.rack.target === 0 && state.rack.x < 0.003) { state.rack.x = 0; state.rack.v = 0; }
  runQueue();
  // Rót: mức tăng tới vạch tối đa (121 L), xong thì đặt lại đồng hồ: ngày 0 sau khi nạp đầy.
  const full = VESSEL.capacityL;
  if (state.fill) {
    const f = state.fill;
    f.age += dt;
    if (calm) { state.shown.x = full; state.shown.v = 0; f.stop = f.age; f.age += 1; }
    else if (!f.stop) {
      state.shown.x = Math.min(full, state.shown.x + dt * 32);
      if (state.shown.x >= full) f.stop = f.age;
    }
    if (f.stop && f.age > f.stop + 0.45) { state.fill = null; state.startL = full; state.days = 0; state.shown.x = full; say("Đã nạp đầy 121 L. Đậy nắp lại."); }
    moving = true;
  } else moving = settleTo(state.shown, litresNow(), dt, 0.35, calm) || moving;
  // Nắp đã nhấc: đồng hồ HOLD tua nhanh (1 giây = 1 phút)
  if (state.lid.x > 0 && !calm) state.holdMin += dt;
  if (state.lid.x === 0) state.holdMin = 0;
  const fogTarget = state.lid.x > 0.25 ? (state.fill ? 1 : 0.75) : 0;
  state.fog = calm ? fogTarget : state.fog + (fogTarget - state.fog) * (1 - Math.exp(-dt / 0.6));
  if (Math.abs(state.fog - fogTarget) < 1e-3) state.fog = fogTarget;
  return moving || Math.abs(state.fog - fogTarget) > 0;
}

function draw() {
  drawLid();
  drawRack();
  drawLiquid();
  drawPour();
  el.scene.style.setProperty("--fog", state.fog.toFixed(3));
  const a = drawMonitor();
  drawReadout(a);
}

// ——— Vòng giới thiệu: các ngày trôi qua tới khi đèn LOW LEVEL bật, nhấc nắp, nạp đầy, nhấc giá, hạ giá, đậy nắp ———
function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  const s = tour.step;
  if (s === "wait") tour = { step: "aging", wait: 0 };
  else if (s === "aging") {
    const low = levelCm(litresNow()) < MONITOR.lowCm;
    if (low || state.days >= 300) tour = { step: "low", wait: 2 };
    else { state.days += 3; tour = { step: "aging", wait: 0.07 }; }
  } else if (s === "low") { refill(); tour = { step: "filling", wait: 0.5 }; }
  else if (s === "filling") { if (!state.fill && lidOff()) tour = { step: "lift", wait: 1.2 }; }
  else if (s === "lift") { liftRack(); tour = { step: "up", wait: 0.4 }; }
  else if (s === "up") { if (state.rack.x >= 1) tour = { step: "lower", wait: 2.2 }; }
  else if (s === "lower") { toggleLid(); tour = { step: "closing", wait: 0.5 }; }
  else if (s === "closing") { if (lidOn()) tour = { step: "rest", wait: 2.4 }; }
  else if (s === "rest") { state.days = START.days; state.startL = START.litres; tour = { step: "wait", wait: 0.6 }; }
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  const moving = update(dt, calm);
  draw();
  const busy = !calm && (touring || moving || state.queue.length > 0 || state.lid.x > 0);
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 1.6 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches) return; touring = true; tour = { step: "wait", wait: 0.6 }; loop(); }, 9000);
}
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);

// Giảm chuyển động: mỗi lệnh nhảy thẳng tới kết quả (chạy hết hàng đợi trong một khung).
function settleCalm() {
  if (!still.matches) return;
  for (let i = 0; i < 6; i++) update(0, true);
}
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  const keys = ["Enter", "Escape", "ArrowLeft", "ArrowRight", "r", "R", "f", "F"];
  if (!keys.includes(key)) return;
  event.preventDefault();
  takeOver();
  const step = event.shiftKey ? 10 : 1;
  if (key === "Enter") toggleLid();
  else if (key === "r" || key === "R") toggleRack();
  else if (key === "f" || key === "F") refill();
  else if (key === "ArrowRight") stepDays(step);
  else if (key === "ArrowLeft") stepDays(-step);
  else if (key === "Escape") { state.queue = []; state.fill = null; state.days = START.days; state.startL = START.litres; if (!rackDown()) { lowerRack(); state.queue.push("close"); } else closeLid(); }
  settleCalm();
  draw();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest('[data-slot="cork"], [data-slot="cap"], [data-slot="table"], [data-slot="air"]')) toggleLid();
  else if (event.target.closest('[data-part="rack"]')) toggleRack();
  else if (event.target.closest('[data-part="liquid"], [data-part="dry"]')) refill();
  settleCalm();
  draw();
  stage.focus({ preventScroll: true });
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) update(0, true);
draw();
</script></body></html>
