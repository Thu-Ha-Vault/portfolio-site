<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cân phân tích</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình cân phân tích. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt trên nhóm máy: --load (0–1, dòng điện qua cuộn dây theo tải), --glass (độ mờ kính). */
.iso {
  --bl-shell: #c4c9cc;
  --bl-frame-top: #2c3034;
  --bl-frame-0: #1c1f22;
  --bl-frame-1: #212427;
  --bl-frame-2: #26292d;
  --bl-frame-3: #2c3034;
  --bl-cav-top: #1d2124;
  --bl-cav-0: #14171a;
  --bl-cav-1: #181b1e;
  --bl-cav-2: #1c2023;
  --bl-cav-3: #202427;
  --bl-glass: #8fc4e8;
  --bl-glass-edge: #9fc9e4;
  --bl-alu: #aab3ba;
  --bl-magnet: #3a4046;
  --bl-coil: #c9773a;
  --bl-coil-hot: #ffb36b;
  --bl-pcb: #1f5a3a;
  --bl-void: #0b0e10;
  --bl-powder: #f4f6f7;
  --bl-boat: #6f8fa8;
  --bl-boat-in: #2a3640;
  --bl-hdpe: #d9dde0;
  --bl-cap: #2f6fb6;
  --bl-label: #1a2228;
  --bl-key: #262b30;
  --bl-vial: #1b2a22;
  --bl-bubble: #b8ffcf;
  --bl-scr-bg: #0e171f;
  --bl-scr-bar: #1a2732;
  --bl-scr-ink: #dbe9f2;
  --bl-scr-dim: #7f97a6;
  --bl-scr-big: #f2f7fa;
  --bl-scr-msg: #f2c14e;
  --bl-scr-warn: #ff8a5a;
  --bl-scr-ok: #5fd08a;
  --bl-scr-fill: #5fb4ff;
  --bl-glint: #ffffff;
  --bl-soot: #000000;
}
.iso[data-theme="light"] {
  --bl-shell: #f2f4f5;
  --bl-frame-top: #6c7378;
  --bl-frame-0: #4f565b;
  --bl-frame-1: #575e63;
  --bl-frame-2: #5f666b;
  --bl-frame-3: #676e73;
  --bl-cav-top: #c3c8cc;
  --bl-cav-0: #b2b8bc;
  --bl-cav-1: #b9bfc3;
  --bl-cav-2: #c0c5c9;
  --bl-cav-3: #c7ccd0;
  --bl-glass: #3f8fcf;
  --bl-glass-edge: #4f86ad;
  --bl-alu: #c9d0d5;
  --bl-magnet: #5d646a;
  --bl-coil: #b8622a;
  --bl-coil-hot: #e0761c;
  --bl-pcb: #2f7d52;
  --bl-void: #2b3238;
  --bl-powder: #ffffff;
  --bl-boat: #5b7d98;
  --bl-boat-in: #c9d6e0;
  --bl-hdpe: #ffffff;
  --bl-cap: #2a64a8;
  --bl-label: #22303a;
  --bl-key: #3a4148;
  --bl-vial: #dff3e6;
  --bl-bubble: #ffffff;
  --bl-scr-bg: #f3f7fa;
  --bl-scr-bar: #dce5ec;
  --bl-scr-ink: #22303a;
  --bl-scr-dim: #6a7d8a;
  --bl-scr-big: #101a22;
  --bl-scr-msg: #9a6a00;
  --bl-scr-warn: #c8421f;
  --bl-scr-ok: #1f8a4c;
  --bl-scr-fill: #1c6fd6;
  --bl-glint: #ffffff;
  --bl-soot: #1b1f22;
}

/* Vỏ nhôm đúc sơn của đế và màn hình: pha nhẹ về màu vỏ */
.bl-shell .iso-top { fill: color-mix(in oklab, var(--anatomy-top), var(--bl-shell) 30%); }
.bl-shell .iso-shade { stroke: none; }
.bl-shell .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--anatomy-shade-0), var(--bl-shell) 18%); }
.bl-shell .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--anatomy-shade-1), var(--bl-shell) 20%); }
.bl-shell .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--anatomy-shade-2), var(--bl-shell) 22%); }
.bl-shell .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--bl-shell) 24%); }
/* Sàn trong đế: tối hơn vì ở trong khoang */
.bl-cavity .iso-top { fill: var(--bl-cav-top); }
.bl-cavity .iso-shade[data-shade="0"] { fill: var(--bl-cav-0); stroke: none; }
.bl-cavity .iso-shade[data-shade="1"] { fill: var(--bl-cav-1); stroke: none; }
.bl-cavity .iso-shade[data-shade="2"] { fill: var(--bl-cav-2); stroke: none; }
.bl-cavity .iso-shade[data-shade="3"] { fill: var(--bl-cav-3); stroke: none; }
/* Thép không gỉ: các tông của kit, mặt trên sáng hơn */
.bl-steel .iso-top { fill: color-mix(in oklab, var(--anatomy-top), var(--bl-glint) 12%); }
/* Nhôm của khối cảm biến */
.bl-alu .iso-top { fill: color-mix(in oklab, var(--anatomy-top), var(--bl-alu) 30%); }
.bl-alu .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-2), var(--bl-alu) 26%); stroke: none; }
.bl-alu .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--anatomy-shade-0), var(--bl-alu) 18%); }
.bl-magnet .iso-top, .bl-magnet .iso-shade { fill: color-mix(in oklab, var(--bl-magnet) 70%, var(--anatomy-shade-0)); stroke: none; }
/* Cuộn dây đồng: sáng lên theo dòng điện (--load) */
.iso .bl-coil .iso-solid > .iso-top, .iso .bl-coil .iso-solid > .iso-shade, .iso .bl-coil.iso-solid > .iso-top, .iso .bl-coil.iso-solid > .iso-shade { fill: color-mix(in oklab, var(--bl-coil), var(--bl-coil-hot) calc(var(--load, 0) * 100%)); stroke: none; }
.bl-coil { filter: drop-shadow(0 0 calc(var(--load, 0) * 2.5px) var(--bl-coil-hot)); }
.bl-pcb .iso-top, .bl-pcb .iso-shade { fill: color-mix(in oklab, var(--bl-pcb) 55%, var(--anatomy-shade-0)); stroke: none; }
.bl-void { fill: var(--bl-void); }

/* Kính buồng cân: trong suốt, viền xanh nhạt */
.bl-glass .iso-fill { fill-opacity: 0.08; }
.bl-glass .iso-top, .bl-glass .iso-shade { fill: var(--bl-glass); fill-opacity: 0.1; stroke: none; }
.bl-glass .iso-edge, .bl-glass .iso-crease { stroke: var(--bl-glass-edge); }

/* Thuyền cân polystyrene và bột */
.bl-boat .iso-top, .bl-boat .iso-shade { fill: color-mix(in oklab, var(--bl-boat) 45%, var(--anatomy-paper)); stroke: none; }
.bl-boat-in { fill: color-mix(in oklab, var(--bl-boat-in) 70%, var(--anatomy-paper)); }
.iso .bl-powder .iso-solid > .iso-top, .iso .bl-powder .iso-solid > .iso-shade, .iso .bl-powder .iso-solid > .iso-fill { fill: var(--bl-powder); stroke: none; }
.iso .bl-powder .iso-solid > .iso-shade[data-shade="0"], .iso .bl-powder .iso-solid > .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--bl-powder) 82%, var(--anatomy-shade-1)); }
.bl-powder-fill { fill: var(--bl-powder); }
.bl-grains circle { fill: var(--bl-powder); stroke: var(--anatomy-lo); stroke-width: 0.25px; vector-effect: non-scaling-stroke; }

/* Lọ HDPE trắng, nắp xanh, nhãn */
.bl-hdpe .iso-top { fill: color-mix(in oklab, var(--anatomy-top), var(--bl-hdpe) 45%); }
.bl-hdpe .iso-shade { stroke: none; }
.bl-hdpe .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--anatomy-shade-0), var(--bl-hdpe) 24%); }
.bl-hdpe .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--anatomy-shade-1), var(--bl-hdpe) 28%); }
.bl-hdpe .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--anatomy-shade-2), var(--bl-hdpe) 32%); }
.bl-hdpe .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--bl-hdpe) 36%); }
.bl-cap .iso-top, .bl-cap .iso-shade { fill: color-mix(in oklab, var(--bl-cap) 55%, var(--anatomy-shade-1)); stroke: none; }
.bl-label { font-family: var(--anatomy-mono); fill: var(--bl-label); font-weight: 600; }
.iso:not([data-theme="light"]) .bl-label { fill: var(--anatomy-hi); }

/* Phím và bọt thuỷ trên màn hình */
.bl-key { fill: var(--bl-key); }
.bl-vial { fill: var(--bl-vial); }
.bl-bubble { fill: var(--bl-bubble); stroke: var(--anatomy-lo); stroke-width: 0.3px; vector-effect: non-scaling-stroke; }

/* Màn hình cảm ứng */
.bl-scr-bg { fill: var(--bl-scr-bg); }
.bl-scr-bar { fill: var(--bl-scr-bar); }
.bl-scr-ink, .bl-scr-dim, .bl-scr-big, .bl-scr-msg, .bl-scr-warn { font-family: var(--anatomy-mono); }
.bl-scr-ink { fill: var(--bl-scr-ink); }
.bl-scr-big { fill: var(--bl-scr-big); font-weight: 500; }
.bl-scr-dim { fill: var(--bl-scr-dim); }
.bl-scr-msg { fill: var(--bl-scr-msg); }
.bl-scr-msg[data-ok] { fill: var(--bl-scr-ok); }
.bl-scr-warn { fill: var(--bl-scr-warn); }
.bl-scr-sym { fill: none; stroke: var(--bl-scr-ink); stroke-width: 0.6px; vector-effect: non-scaling-stroke; }
.bl-scr-dot { fill: var(--bl-scr-ink); }
.bl-scr-track { fill: var(--bl-scr-bar); }
.bl-scr-fill { fill: var(--bl-scr-fill); }
.bl-scr-tick { fill: none; stroke: var(--bl-scr-ok); stroke-width: 0.8px; vector-effect: non-scaling-stroke; }

.bl-stage { touch-action: pan-y; cursor: pointer; }
.bl-stage:focus { outline: none; }

heo USP &lt;41&gt;, 2 × s / m ≤ 0,10 % nên lượng cân tối thiểu là 160 mg. Lệch thăng bằng 1° làm số đọc nhỏ đi 152 ppm; chân chỉnh phía trước bù được mặt bàn nghiêng 2 %. Khối nhôm, đòn bẩy, cuộn dây, cảm biến quang và bo mạch vẽ theo cấu tạo điển hình, không theo sơ đồ của hãng; nhiễu khi mở cửa và cách số đọc ổn định là minh hoạ.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };

function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {

    return (x * cosA + y * sinA) * cosE + z * sinE;

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

function pathOf(points, closed = false) {
    if (!points.length)

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];

        area += ax * by - bx * ay;

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

function runsOf(flags, want) {

function extrude(ring, z, height, projection, options = {}) {

    const [vx, vy] = towardViewer(projection);

    const y = a[1] + b[1];

function sideOf(meridian) {

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const top = aV > 0 ? facing + Math.PI : facing;

  const R = right.map((point) => iso(point, P));

  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";

    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  const tones = [];
  for (let j = 0; j < n; j++) {

    tones.push(bandOf(dot3(normal, L)));

  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {

    buckets[key].push(d);
    fills.push(d);

    fills.push(d);

function prismOf(F, polygon, s0, s1, P) {

//     nghiêng tới ±2 %; bọt thuỷ trên đầu màn hình; buồng kính (PBT và kính) có cửa trượt; tấm sàn buồng và đĩa cân
//     bằng thép không gỉ 1.4404. Cửa hông mở 140 mm, khi mở thò ra sau máy 99 mm (bản vẽ kích thước).
//
// Phép cân:
//   - Lực đẩy không khí (OIML D 28 "Conventional value of the result of weighing in air", 2004, và OIML R 111-1):
//     cân được hiệu chỉnh bằng quả cân khối lượng riêng quy ước 8000 kg/m³ trong không khí 1,2 kg/m³, nên số đọc là
//     "khối lượng quy ước". Khối lượng thật: m_thật = m_đọc × (1 − ρ_kk/ρ_quả cân) / (1 − ρ_kk/ρ_mẫu).
//   - Khối lượng riêng chất rắn (CRC Handbook of Chemistry and Physics; PubChem): NaCl 2,17 g/cm³,
//     kali hydro phthalate (KHP) 1,636 g/cm³, glucose 1,54 g/cm³, sucrose 1,587 g/cm³, CuSO₄·5H₂O 2,286 g/cm³,
//     nước 0,998 g/cm³ ở 20 °C.
//   - USP <41> (từ 2013): độ lặp lại đạt khi 2 × s / m ≤ 0,10 %; nếu s < 0,41 d thì lấy s = 0,41 d (d là độ đọc).
//     Với s điển hình 0,08 mg: m_min = 2 × 0,08 mg / 0,001 = 160 mg, khớp tờ thông số.
//   - Cân lệch thăng bằng một góc θ: cảm biến chỉ đo thành phần trọng lực vuông góc với đĩa, số đọc nhân cos θ
//     (so với lúc hiệu chỉnh). Hình học, không cần nguồn riêng.
//
// Phần minh hoạ, chưa xác minh (ghi rõ để người dùng không nhầm là số đo thật):
//   - Nhiễu khi mở cửa kính (độ lệch chuẩn 0,6 mg và trôi chậm ±1 mg): luồng khí làm số đọc dao động; hãng không cho số.
//   - Mẫu ấm hơn buồng cân: dòng đối lưu làm mẫu "nhẹ đi" khoảng 0,1 mg mỗi kelvin với vật nhỏ, giảm dần theo thời gian.
//   - Mẫu tích điện tĩnh: số đọc trôi chậm, không ổn định.
//   - Thời gian đáp ứng: số đọc tiến tới giá trị mới theo hàm mũ có dao động tắt dần, chọn để vào trong 0,05 mg sau 2 s.
//   - Khối lượng thuyền cân polystyrene nhỏ 0,3816 g; một thìa bột 90–210 mg; khối lượng riêng đổ đống của bột
//     (để vẽ đống bột) và góc nghỉ 35°.

/** Thông số máy (đơn vị ghi ở từng trường). */
const SPEC = {
  model: "MS204TS",
  capacity: 220, // g
  nominal: 200, // g, tải danh định
  d: 0.0001, // g, độ đọc
  repeatLimit: 0.1, // mg
  repeat: 0.08, // mg, điển hình (độ lệch chuẩn)
  linearityLimit: 0.2, // mg
  linearity: 0.06, // mg, điển hình
  sensitivityOffset: 0.8, // mg ở tải danh định, sau hiệu chỉnh trong
  tempDrift: 1.5, // ppm/°C
  minUSP: 0.16, // g, dung sai 0,10 %, k = 2, ở 5 % tải
  min1: 0.016, // g, dung sai 1 %
  minOIML: 0.01, // g
  settle: 2, // s
  pan: 90, // mm, đường kính đĩa cân
  usableHeight: 236, // mm, chiều cao dùng được trong buồng kính
  size: [204, 347, 348], // mm rộng × sâu × cao
  mass: 5.9, // kg
  warmup: 60, // phút với máy 0,1 mg
  levelRange: 2, // %, độ nghiêng mặt bàn bù được bằng chân chỉnh
  doorTravel: 140, // mm, cửa hông mở
  doorBehind: 99, // mm, cửa mở thò ra sau máy
  power: [12, 10], // V một chiều, W
  ambient: [10, 30], // °C
};

/** Lực đẩy không khí theo OIML D 28 / R 111: khối lượng riêng quy ước (kg/m³). */
const AIR = { rhoAir: 1.2, rhoWeights: 8000 };

/**
 * Chất rắn để cân: khối lượng riêng thật (g/cm³, CRC/PubChem), khối lượng mol (g/mol),
 * khối lượng riêng đổ đống (g/cm³, minh hoạ, chỉ để vẽ đống bột).
 */
const SUBSTANCES = {
  NaCl: { name: "NaCl", rho: 2.17, molar: 58.44, bulk: 1.2 },
  KHP: { name: "KHP", rho: 1.636, molar: 204.22, bulk: 0.8 },
  glucose: { name: "glucose", rho: 1.54, molar: 180.16, bulk: 0.75 },
  sucrose: { name: "sucrose", rho: 1.587, molar: 342.3, bulk: 0.85 },
  "CuSO4·5H2O": { name: "CuSO₄·5H₂O", rho: 2.286, molar: 249.69, bulk: 1.1 },
};
/** Thuyền cân polystyrene nhỏ (minh hoạ): khối lượng g, khối lượng riêng g/cm³. */
const BOAT = { mass: 0.3816, rho: 1.05 };
/** Một thìa bột (g, minh hoạ). */
const SCOOP = [0.09, 0.21];
/** Góc nghỉ của đống bột (độ, minh hoạ). */
const REPOSE = 35;
/** Nhiễu và trôi khi mở cửa kính (mg, minh hoạ). */
const DOOR_NOISE = { sd: 0.6, wander: 1.0 };

/** Bộ sinh số ngẫu nhiên có hạt giống (mulberry32), trả về hàm cho số trong [0, 1). */
function rng(seed = 1) {
  let a = seed >>> 0 || 1;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/** Số ngẫu nhiên phân phối chuẩn N(0, 1) từ hàm rng (Box–Muller). */
function gauss(rand) {
  const u = Math.max(1e-12, rand());
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand());
}

/** Làm tròn theo độ đọc của cân (mặc định 0,1 mg). @param {number} g @returns {number} */
const roundToD = (g, d = SPEC.d) => Math.round(g / d) * d;

/**
 * Hệ số đổi khối lượng thật ra số đọc (khối lượng quy ước) do lực đẩy không khí.
 * @param {number} rhoSample khối lượng riêng của vật, g/cm³
 * @returns {number} số đọc / khối lượng thật (nhỏ hơn 1 khi vật nhẹ hơn thép)
 */
function buoyancyFactor(rhoSample, { rhoAir = AIR.rhoAir, rhoWeights = AIR.rhoWeights } = {}) {
  const ra = rhoAir / 1000; // g/cm³
  return (1 - ra / rhoSample) / (1 - ra / (rhoWeights / 1000));
}
/**
 * Hiệu chỉnh lực đẩy không khí: khối lượng thật từ số đọc.
 * m_thật = m_đọc × (1 − ρ_kk/ρ_quả cân) / (1 − ρ_kk/ρ_mẫu)
 * @param {number} mRead số đọc, g
 * @param {number} rhoSample khối lượng riêng của mẫu, g/cm³
 * @returns {number} khối lượng thật, g
 */
function buoyancy(mRead, rhoSample, opts) {
  return mRead / buoyancyFactor(rhoSample, opts);
}

/**
 * Hệ số do cân lệch thăng bằng: chỉ thành phần trọng lực vuông góc với đĩa được đo.
 * @param {number} tiltDeg góc nghiêng hiện tại, độ
 * @param {number} [adjustedDeg] góc nghiêng lúc hiệu chỉnh trong (FACT), độ
 * @returns {number} cos θ / cos θ_hiệu chỉnh
 */
function tiltFactor(tiltDeg = 0, adjustedDeg = 0) {
  const r = Math.PI / 180;
  return Math.cos(tiltDeg * r) / Math.cos(adjustedDeg * r);
}
/** Độ dốc (%) của một góc nghiêng (độ). */
const slopePercent = (tiltDeg) => Math.tan((tiltDeg * Math.PI) / 180) * 100;

/**
 * Độ lệch chuẩn của số đọc (mg) theo điều kiện cân.
 * @param {{doorsOpen?: boolean, charge?: number}} [o] charge: mức tích điện 0–1 (minh hoạ)
 */
function noiseSd({ doorsOpen = false, charge = 0 } = {}) {
  const base = SPEC.repeat;
  const door = doorsOpen ? DOOR_NOISE.sd : 0;
  return Math.sqrt(base * base + door * door) + 0.3 * charge;
}

/**
 * Số mg mẫu ấm "nhẹ đi" do đối lưu (minh hoạ): 0,1 mg mỗi kelvin, giảm dần với hằng số thời gian 300 s.
 * @param {number} deltaK mẫu ấm hơn buồng cân bao nhiêu kelvin @param {number} [t] số giây đã đặt lên đĩa
 */
const warmError = (deltaK = 0, t = 0) => -0.1 * deltaK * Math.exp(-t / 300);

/**
 * Số đọc của cân cho một khối lượng thật trên đĩa.
 * @param {number} trueMassG khối lượng thật của mẫu (không kể vật chứa), g
 * @param {object} [o]
 * @param {number} [o.container] khối lượng thật của vật chứa (thuyền cân), g
 * @param {boolean|number} [o.tare] true: đã trừ bì đúng vật chứa; số: lượng bì (g, theo số đọc) đã trừ; false/0: chưa trừ bì
 * @param {boolean} [o.doorsOpen] cửa kính đang mở
 * @param {number} [o.tilt] góc lệch thăng bằng, độ
 * @param {number} [o.rhoSample] khối lượng riêng của mẫu, g/cm³ (mặc định NaCl); null để bỏ lực đẩy không khí
 * @param {number} [o.warmK] mẫu ấm hơn buồng bao nhiêu kelvin (minh hoạ)
 * @param {number} [o.charge] mức tích điện 0–1 (minh hoạ)
 * @param {number} [o.seed] hạt giống cho nhiễu; null để bỏ nhiễu
 * @returns {{ shown: number, raw: number, sd: number, net: number, stable: boolean, text: string, flags: string[] }}
 *   shown: số hiện trên màn (đã làm tròn 0,1 mg); raw: trước khi làm tròn; net: số đọc không nhiễu của mẫu
 */
function read(trueMassG, { container = BOAT.mass, tare = true, doorsOpen = false, tilt = 0, rhoSample = SUBSTANCES.NaCl.rho, warmK = 0, charge = 0, seed = 1 } = {}) {
  const tf = tiltFactor(tilt);
  const bf = (rho) => (rho ? buoyancyFactor(rho) : 1);
  const sample = trueMassG * bf(rhoSample) * tf;
  const box = container * bf(BOAT.rho) * tf;
  const tareG = tare === true ? box : typeof tare === "number" ? tare : 0;
  const sd = noiseSd({ doorsOpen, charge });
  const rand = seed == null ? null : rng(seed);
  const noise = rand ? (gauss(rand) * sd) / 1000 : 0;
  const wander = rand && doorsOpen ? ((rand() * 2 - 1) * DOOR_NOISE.wander) / 1000 : 0;
  const drift = (warmError(warmK) + (charge ? 1.5 * charge : 0)) / 1000;
  const net = sample + box - tareG;
  const raw = net + noise + wander + drift;
  const shown = roundToD(raw);
  const flags = [];
  if (doorsOpen) flags.push("Cửa kính đang mở: luồng khí làm số đọc dao động, không ổn định.");
  if (Math.abs(tilt) > 0.05) flags.push(`Cân lệch thăng bằng ${fmt(tilt, 1)}°: số đọc nhỏ đi ${fmt((1 - tf) * 1e6, 0)} ppm.`);
  if (tare === false || tare === 0) flags.push("Chưa trừ bì: số đọc gồm cả khối lượng thuyền cân.");
  if (warmK) flags.push("Mẫu ấm hơn buồng cân: dòng đối lưu làm mẫu nhẹ đi, số đọc trôi.");
  if (charge) flags.push("Mẫu tích điện tĩnh: số đọc trôi, không ổn định.");
  const m = trueMassG * bf(rhoSample);
  if (m > 0 && m < minWeight()) flags.push(`Dưới khối lượng tối thiểu USP ${fmt(minWeight() * 1000, 0)} mg: sai số tương đối ${fmt(relUncertainty(m) * 100, 2)} % > 0,10 %.`);
  if (sample + box > SPEC.capacity) flags.push("Quá tải: vượt 220 g.");
  const stable = !doorsOpen && !charge && !warmK;
  return { shown, raw, sd, net, stable, text: fmtG(shown), flags };
}

/**
 * Khối lượng tối thiểu (g) theo USP <41>: 2 × s / m ≤ dung sai, s không nhỏ hơn 0,41 d.
 * @param {{sd?: number, tol?: number, k?: number}} [o] sd: độ lệch chuẩn mg; tol: dung sai tương đối
 */
function minWeight({ sd = SPEC.repeat, tol = 0.001, k = 2 } = {}) {
  const s = Math.max(sd, 0.41 * SPEC.d * 1000);
  return (k * s) / 1000 / tol;
}
/** Sai số tương đối 2 × s / m của một lần cân m (g). */
const relUncertainty = (mG, sd = SPEC.repeat) => (2 * Math.max(sd, 0.41 * SPEC.d * 1000)) / 1000 / mG;

/**
 * Số đọc trong lúc cân ổn định sau khi tải thay đổi Δ (g): tắt dần theo hàm mũ có dao động (minh hoạ),
 * vào trong 0,05 mg sau thời gian ổn định 2 s với Δ tới 200 mg.
 * @param {number} delta bước tải, g @param {number} t số giây từ lúc tải thay đổi
 */
const transient = (delta, t) => delta * Math.exp(-t / 0.22) * Math.cos((2 * Math.PI * t) / 0.7);
/** Cân báo ổn định khi đã qua thời gian ổn định và nhiễu không vượt một độ đọc. */
const isStable = (t, { doorsOpen = false, charge = 0 } = {}) => t >= SPEC.settle && noiseSd({ doorsOpen, charge }) <= SPEC.d * 1000;

/**
 * Kích thước đống bột hình nón (mm) cho một khối lượng (g) và chất (để vẽ).
 * @returns {{ r: number, h: number }}
 */
function pileOf(massG, key = "NaCl") {
  const s = SUBSTANCES[key] ?? SUBSTANCES.NaCl;
  const v = (Math.max(0, massG) / s.bulk) * 1000; // mm³
  const t = Math.tan((REPOSE * Math.PI) / 180);
  const r = Math.cbrt((3 * v) / (Math.PI * t));
  return { r, h: r * t };
}

/** Số dạng Việt Nam (dấu phẩy thập phân). */
function fmt(v, digits = 1) {
  return Number(v).toFixed(digits).replace("-", "−").replace(".", ",");
}
/** Số đọc của cân, 4 chữ số thập phân (g). */
const fmtG = (g) => fmt(roundToD(g) === 0 ? 0 : roundToD(g), 4);

/** Ví dụ chuẩn: cân 0,5844 g NaCl (0,01 mol) vào thuyền cân đã trừ bì. */
const DEMO = { mass: 0.5844, tared: true, doorsOpen: false, substance: "NaCl", seed: 7 };

return { SPEC, AIR, SUBSTANCES, BOAT, SCOOP, DOOR_NOISE, DEMO, rng, gauss, roundToD, buoyancyFactor, buoyancy, tiltFactor, slopePercent, noiseSd, read, minWeight, relUncertainty, transient, isStable, pileOf, fmt, fmtG };})();
// Phần chạy trong trang: cửa kính trượt, trừ bì, xúc bột bằng thìa (hạt rơi, đống bột lớn dần), số đọc dao động
// rồi ổn định (ký hiệu chưa ổn định), bọt thuỷ khi cân lệch, vòng giới thiệu.
const D = {"P":{"origin":[230.09121247271736,358.28705672192666],"scale":0.6909620543745746,"azimuth":40,"elevation":30},"door":{"travel":140,"step":[0.6695,-0.2809]},"sp":{"rest":[0,0],"lift":[0,-30.28],"side":[-90.72,-8.19],"door":[-90.72,8.46],"over":[-175.2,-40.52],"tap":[-175.2,-20.08]},"spoonAt":[2,-36,101],"pan":[0,-35],"boatFloor":84,"vial":{"x":-86,"y":14,"r":6,"shift":[0.6,3.6]},"up":[0,-0.7569],"tiltStep":1,"screen":{"w":144,"bar":[6,138]}};
const P = D.P;
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const $ = (sel) => svgEl.querySelector(sel);
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const el = {
  machine: $('[data-part="machine"]'),
  closed: $('[data-slot="closed"]'),
  open: $('[data-slot="open"]'),
  pile: $('[data-part="pile"]'),
  scoop: $('[data-part="scoop"]'),
  spatula: $('[data-part="spatula"]'),
  grains: $('[data-part="grains"]'),
  bubble: $('[data-part="bubble"]'),
  label: $('[data-part="bottle-label"]'),
  subst: $('[data-part="subst"]'),
  level: $('[data-part="level"]'),
  unstable: $('[data-part="unstable"]'),
  net: $('[data-part="net"]'),
  value: $('[data-part="value"]'),
  bar: $('[data-part="bar"]'),
  goal: $('[data-part="goal"]'),
  msg: $('[data-part="msg"]'),
};

// Dữ liệu do app truyền qua địa chỉ (…balance.html#run=<JSON>):
//   { mass: 0.5844, tared: true, doorsOpen: false, substance: "NaCl", tilt?: 0, seed?: 1, reading?: 0.5842, goal?: 0.5844 }
//   mass: khối lượng thật của chất trong thuyền cân (g); số hiện trên màn do mô hình tính (lực đẩy không khí, nhiễu);
//   reading (tuỳ chọn): ép số hiện khi cân đã ổn định đúng bằng giá trị này.
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
const num = (v, def) => (typeof v === "number" && Number.isFinite(v) ? v : def);
const SUBST = RUN?.substance && M.SUBSTANCES[RUN.substance] ? RUN.substance : M.DEMO.substance;
const GOAL = Math.max(1e-4, num(RUN?.goal, num(RUN?.mass, M.DEMO.mass)));
const rand = M.rng(num(RUN?.seed, 11));
const gauss = () => M.gauss(rand);

const TRAVEL = D.door.travel;
const state = {
  door: { x: 0, v: 0, target: 0 },
  pile: 0, // g, khối lượng thật của bột trong thuyền
  boat: M.BOAT.mass, // g, khối lượng thật của thuyền đang trên đĩa
  tare: 0, // g, lượng bì đã trừ (theo số đọc)
  tarePending: false,
  tareAt: -10,
  tilt: 0,
  bubble: [0, 0],
  trans: { delta: 0, at: -10 },

let frame = 0;

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const doorsOpen = () => state.door.x > 4;
const rho = () => M.SUBSTANCES[SUBST].rho;

// ——— Số đọc: mô hình cho giá trị không nhiễu; trang thêm quá độ, nhiễu, làm tròn 0,1 mg ———
function targetNow() {
  return M.read(state.pile, { container: state.boat, tare: state.tare, doorsOpen: doorsOpen(), tilt: state.tilt, rhoSample: rho(), seed: null }).net;
}
function stableNow() {
  return !state.spat.pour && M.isStable(state.clock - state.trans.at, { doorsOpen: doorsOpen() });
}
function updateReading(dt, calm) {
  const t = targetNow();
  if (Math.abs(t - state.target) > 1e-9) {
    // Tải đổi: số đọc đi tiếp từ chỗ đang hiện, tắt dần về giá trị mới
    const shown = state.target + M.transient(state.trans.delta, state.clock - state.trans.at);
    state.trans = { delta: calm ? 0 : shown - t, at: calm ? state.clock - 10 : state.clock };
    state.target = t;
  }
  const sd = M.noiseSd({ doorsOpen: doorsOpen() }) / 1000;
  const stable = stableNow();
  // Khi ổn định, màn giữ số; khi chưa ổn định số mới cập nhật khoảng 8 lần mỗi giây
  const every = stable ? 2.4 : 0.12;
  const justStable = stable && !state.wasStable;
  state.wasStable = stable;
  if (calm) state.noise = 0;
  else if (justStable || state.clock - state.noiseAt > every) {
    const wander = doorsOpen() ? (Math.sin(state.clock * 1.7) * 0.6 + Math.sin(state.clock * 0.53 + 1) * 0.4) * (M.DOOR_NOISE.wander / 1000) : 0;
    state.noise = (stable ? M.SPEC.repeat / 1000 : sd) * gauss() * (stable ? 0.6 : 1) + wander;
    state.noiseAt = state.clock;
  }
  state.raw = state.target + (calm ? 0 : M.transient(state.trans.delta, state.clock - state.trans.at)) + state.noise;
  if (state.tarePending && stable) {
    state.tare += state.target;
    state.tarePending = false;
    state.tareAt = state.clock;
    state.target = targetNow();
    state.trans = { delta: 0, at: state.clock - 10 };
    state.noise = 0;
    state.raw = state.target;
    say("Trừ bì: màn về 0,0000 g.");
  }
}

// ——— Cửa kính hông phải: lò xo giảm chấn tới hạn, chốt khi gần đóng ———
function stepDoor(dt, calm) {
  const L = state.door;
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const w = 1 / 0.22;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.min(TRAVEL, Math.max(0, L.x));
  if (L.target === 0 && L.x < 0.6) { L.x = 0; L.v = 0; return false; }
  if (Math.abs(L.target - L.x) < 0.02 && Math.abs(L.v) < 0.02) { L.x = L.target; L.v = 0; return false; }
  return true;
}
function setDoor(open) {
  if (!open && state.spat.task && state.spat.task.i <= INSIDE_LAST) { say("Chờ thìa ra khỏi buồng cân rồi đóng cửa."); return; }
  state.door.target = open ? TRAVEL : 0;
  say(open ? "Mở cửa kính hông: luồng khí làm số đọc dao động." : "Đóng cửa kính.");
}
function drawDoor() {
  const x = state.door.x;
  const s = D.door.step;
  const openSlot = x > TRAVEL / 2;
  const d = openSlot ? x - TRAVEL : x;
  const tr = `translate(${(s[0] * d).toFixed(2)} ${(s[1] * d).toFixed(2)})`;
  el.open.style.display = openSlot ? "" : "none";
  el.closed.style.display = openSlot ? "none" : "";
  (openSlot ? el.open : el.closed).setAttribute("transform", tr);
}

// ——— Thìa: chuỗi điểm dừng; đổ bột khi gõ nhẹ trên thuyền cân ———
const PATH = [
  { to: "lift", s: 0.6 }, { to: "side", s: 1.0 }, { to: "door", s: 0.4 }, { waitDoor: true }, { to: "over", s: 1.1 }, { to: "tap", s: 0.6 },
  { pour: 1.1 }, { to: "over", s: 0.5 }, { to: "door", s: 1.0 }, { to: "side", s: 0.4 }, { to: "lift", s: 1.0 }, { to: "rest", s: 0.5 }, { refill: 0.5 },
];
const INSIDE_LAST = 8; // chỉ số bước cuối còn ở trong buồng cân
const ease = (t) => t * t * (3 - 2 * t);
function scoop() {
  if (state.spat.task) return;
  if (state.tarePending) return;
  const m = M.SCOOP[0] + (M.SCOOP[1] - M.SCOOP[0]) * rand();
  state.spat.task = { i: 0, t: 0, from: [0, 0], amount: m, poured: 0 };
  if (!doorsOpen()) setDoor(true);
  say(`Xúc một thìa ${M.SUBSTANCES[SUBST].name} từ lọ.`);
}
function stepSpatula(dt, calm) {
  const S = state.spat;
  const task = S.task;
  if (!task) return false;
  if (calm) {
    state.pile += task.amount - task.poured;
    S.task = null; S.at = [0, 0]; S.load = 1; S.pour = 0;
    state.grains = [];
    return false;
  }
  const seg = PATH[task.i];
  if (seg.waitDoor) {
    if (state.door.target !== TRAVEL) setDoor(true);
    if (state.door.x >= TRAVEL - 2) { task.i += 1; task.t = 0; }
    return true;
  }
  task.t += dt;
  const span = seg.s ?? seg.pour ?? seg.refill;
  const f = Math.min(1, task.t / span);
  if (seg.to) {
    const to = D.sp[seg.to];
    const e = ease(f);
    S.at = [task.from[0] + (to[0] - task.from[0]) * e, task.from[1] + (to[1] - task.from[1]) * e];
  }
  if (seg.pour) {
    // Gõ nhẹ: thìa rung lên xuống, bột rơi thành hạt; đống bột lớn dần theo lượng đã rơi
    const amp = Math.sin(task.t * 2 * Math.PI * 5) * 1.4 * (1 - f);
    S.at = [D.sp.tap[0] + D.up[0] * amp, D.sp.tap[1] + D.up[1] * amp];
    S.pour = 1;
    const want = task.amount * ease(f);
    state.pile += want - task.poured;
    task.poured = want;
    S.load = 1 - f;
    if (Math.random() < 0.9) for (let n = 0; n < 2; n++) state.grains.push({ t: 0, dx: (Math.random() - 0.5) * 4, dy: (Math.random() - 0.5) * 4, life: 0.32 + Math.random() * 0.1 });
    if (f >= 1) { S.pour = 0; say(`Đã thêm ${M.fmt(task.amount * 1000, 1)} mg vào thuyền cân.`); }
  }
  if (seg.refill) S.load = f;
  if (f >= 1) {
    task.from = [...S.at];
    task.i += 1;
    task.t = 0;
    if (task.i >= PATH.length) { S.task = null; S.at = [0, 0]; S.load = 1; }
  }
  return true;
}
function stepGrains(dt) {
  const top = D.boatFloor + M.pileOf(state.pile, SUBST).h;
  const g = [];
  for (const p of state.grains) { p.t += dt; if (p.t < p.life) g.push(p); }
  state.grains = g;
  return { top };
}
function drawGrains(top) {
  if (!state.grains.length) { if (el.grains.firstChild) el.grains.innerHTML = ""; return; }
  const s = D.spoonAt;
  el.grains.innerHTML = state.grains
    .map((p) => {
      const f = p.t / p.life;
      const z = s[2] - 1 - (s[2] - 1 - top) * f * f;
      const [x, y] = iso([s[0] + p.dx * (1 - f * 0.6) - 2, s[1] + p.dy * (1 - f * 0.6) + 1, z], P);
      return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="0.55"/>`;
    })
    .join("");
}

// ——— Đống bột: dựng lại khi khối lượng đổi ———
function drawPile() {
  if (Math.abs(state.pile - state.shownPile) < 0.0015 && !(state.pile === 0 && state.shownPile !== 0)) return;
  state.shownPile = state.pile;
  if (state.pile < 2e-4) { el.pile.innerHTML = ""; return; }
  const { r, h } = M.pileOf(state.pile, SUBST);
  const F = G.frameOf([D.pan[0], D.pan[1], D.boatFloor], [0, 0, 1], [1, 0, 0], [0, 1, 0]);
  el.pile.innerHTML = solidSvg(G.solidOf([[0, r], [h, 0]], F, P, { steps: 40 }), { tone: "hi", lit: true });
}

// ——— Trừ bì, thăng bằng, thay thuyền ———
function tare() {
  if (state.spat.task && state.spat.pour) return;
  state.tarePending = true;
  say(doorsOpen() ? "Trừ bì: chờ đóng cửa và số đọc ổn định." : "Trừ bì: chờ số đọc ổn định.");
}
function toggleLevel() {
  state.tilt = state.tilt ? 0 : D.tiltStep;
  say(state.tilt ? `Kê lệch ${M.fmt(state.tilt, 0)}° (${M.fmt(M.slopePercent(state.tilt), 1)} %): bọt thuỷ ra khỏi vòng, số đọc nhỏ đi ${M.fmt((1 - M.tiltFactor(state.tilt)) * 1e6, 0)} ppm.` : "Chỉnh chân cân: bọt thuỷ về giữa vòng.");
}
function newBoat() {
  if (state.spat.task) return;
  state.pile = 0;
  state.boat = M.BOAT.mass * (1 + (rand() - 0.5) * 0.02);
  state.tarePending = false;
  say("Thay thuyền cân mới: số đọc là chênh lệch khối lượng hai thuyền; trừ bì lại.");
}

// ——— Vẽ ———
function draw() {
  drawDoor();
  drawPile();
  el.spatula.setAttribute("transform", `translate(${state.spat.at[0].toFixed(2)} ${state.spat.at[1].toFixed(2)})`);
  el.scoop.style.opacity = state.spat.load.toFixed(3);
  // Bọt thuỷ: lệch về phía cao (ra trước, xuôi dốc màn hình)
  el.bubble.setAttribute("transform", `translate(${state.bubble[0].toFixed(2)} ${state.bubble[1].toFixed(2)})`);
  const gross = state.boat + state.pile;
  el.machine.style.setProperty("--load", Math.min(1, 0.35 + 0.65 * Math.min(1, gross / 1.2) + Math.min(0.3, Math.abs(M.transient(state.trans.delta, state.clock - state.trans.at)) * 200)).toFixed(3));

  const stable = stableNow() && !state.tarePending;
  const net = M.roundToD(state.raw);
  let text = M.fmtG(net);
  if (RUN && typeof RUN.reading === "number" && stable && Math.abs(state.pile - num(RUN.mass, 0)) < 1e-9) text = M.fmtG(RUN.reading);
  const taringFlash = state.clock - state.tareAt < 0.35;
  const shownText = state.tarePending && !doorsOpen() ? "– – – – –" : taringFlash ? "– – – – –" : text;
  if (el.value.textContent !== shownText) el.value.textContent = shownText;
  el.unstable.style.opacity = stable ? "0" : "1";
  el.net.style.opacity = state.tare ? "1" : "0";
  el.level.textContent = state.tilt ? "Lệch thăng bằng" : "";
  const frac = Math.max(0, Math.min(1.2, net / GOAL));
  const [b0, b1] = D.screen.bar;
  const goalX = D.screen.w - 30;
  const x1 = b0 + Math.max(0.1, frac * (goalX - b0));
  el.bar.setAttribute("d", `M${b0} 47L${Math.min(b1, x1).toFixed(2)} 47L${Math.min(b1, x1).toFixed(2)} 52L${b0} 52Z`);
  const inTol = state.tare && Math.abs(net - GOAL) <= GOAL * 0.001;
  const below = state.tare && state.pile > 0 && net > 0 && net < M.minWeight();
  let msg;
  let ok = false;
  if (state.tarePending) msg = doorsOpen() ? "Trừ bì: đóng cửa kính trước." : "Đang trừ bì…";
  else if (doorsOpen()) msg = "Cửa kính mở: số đọc dao động.";
  else if (!stable) msg = "Chờ ổn định…";
  else if (state.tilt) msg = "Cân lệch: chỉnh hai chân trước.";
  else if (!state.tare) msg = "Chưa trừ bì: số gồm cả thuyền cân.";
  else if (below) msg = `Dưới ${M.fmt(M.minWeight() * 1000, 0)} mg (USP): sai số > 0,10 %.`;
  else if (inTol) { msg = "Đạt đích ±0,1 %."; ok = true; }
  else if (state.pile === 0) msg = "Ổn định. Xúc bột vào thuyền.";
  else { msg = "Ổn định."; ok = true; }
  if (el.msg.textContent !== msg) el.msg.textContent = msg;
  el.msg.toggleAttribute("data-ok", ok);

  const trueMass = state.pile;
  let r;
  if (state.spat.pour) r = `đang đổ bột · ${shownText} g`;
  else if (state.spat.task) r = state.spat.task.i < 3 ? "thìa mang bột tới cửa buồng cân" : state.spat.task.i === 3 ? "chờ cửa kính mở" : state.spat.task.i < 6 ? "thìa vào trên thuyền cân" : "thìa về lọ";
  else if (state.tarePending) r = doorsOpen() ? "chờ đóng cửa để trừ bì" : "đang trừ bì";
  else if (doorsOpen()) r = `cửa mở · ${shownText} g, dao động`;
  else if (!stable) r = `${shownText} g · chờ ổn định`;
  else if (state.tare && state.pile > 0) r = `${shownText} g · ổn định · thật ${M.fmt(trueMass, 4)} g`;
  else r = `${shownText} g · ổn định${state.tare ? "" : " · chưa trừ bì"}`;
  if (state.tilt && !state.spat.task) r += " · lệch 1°";
  if (readout.textContent !== r) readout.textContent = r;
}

// ——— Vòng giới thiệu ———
const TOUR = [
  () => { if (state.pile > 0 || state.tare) newBoat(); return { wait: 1.6 }; },
  () => { tare(); return { wait: 0.3 }; },
  () => (state.tarePending ? null : { wait: 1.2 }),
  () => { scoop(); return { wait: 0.2 }; },
  () => (state.spat.task ? null : { wait: 0.5 }),
  () => { scoop(); return { wait: 0.2 }; },
  () => (state.spat.task ? null : { wait: 0.5 }),
  () => { scoop(); return { wait: 0.2 }; },
  () => (state.spat.task ? null : { wait: 0.8 }),
  () => { setDoor(false); return { wait: 0.4 }; },
  () => (stableNow() && !doorsOpen() ? { wait: 3.4 } : null),
  () => { toggleLevel(); return { wait: 3 }; },
  () => { toggleLevel(); return { wait: 2.4 }; },
];
function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  const next = TOUR[tour.step % TOUR.length]();
  if (next) tour = { step: (tour.step + 1) % TOUR.length, wait: next.wait };
  else tour.wait = 0;
}

function update(dt, calm) {
  state.clock += dt;
  const want = state.tilt ? [D.vial.shift[0], D.vial.shift[1]] : [0, 0];
  const k = calm ? 1 : 1 - Math.exp(-dt / 0.35);
  state.bubble = [state.bubble[0] + (want[0] - state.bubble[0]) * k, state.bubble[1] + (want[1] - state.bubble[1]) * k];
  updateReading(dt, calm);
}
function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  const doorMoving = stepDoor(dt, calm);
  const spMoving = stepSpatula(dt, calm);
  const { top } = stepGrains(dt);
  update(dt, calm);
  draw();
  drawGrains(top);
  const settling = !stableNow() || state.tarePending || Math.abs(state.bubble[1] - (state.tilt ? D.vial.shift[1] : 0)) > 0.01 || state.clock - state.tareAt < 0.4;
  const busy = !calm && (touring || doorMoving || spMoving || state.grains.length > 0 || settling || doorsOpen());
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: 0, wait: 1.4 }; }
  clearTimeout(idleTimer);
  if (RUN) return;
  idleTimer = setTimeout(() => { if (still.matches) return; touring = true; tour = { step: 0, wait: 0.4 }; loop(); }, 12000);
}
function settleCalm() {
  if (!still.matches) return;
  stepDoor(0, true); stepSpatula(0, true);
  for (let i = 0; i < 4; i++) update(3, true);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (![" ", "d", "t", "l", "escape"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === " ") scoop();
  else if (key === "d") setDoor(state.door.target === 0);
  else if (key === "t") tare();
  else if (key === "l") toggleLevel();
  else if (key === "escape") newBoat();
  settleCalm();
  draw();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest('[data-name^="door@"]')) setDoor(state.door.target === 0);
  else if (event.target.closest('[data-name="term.face"]')) tare();
  else scoop();
  settleCalm();
  stage.focus({ preventScroll: true });
  draw();
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

// Trạng thái đầu: thuyền cân trên đĩa, chưa trừ bì (hoặc theo dữ liệu của app)
el.label.textContent = M.SUBSTANCES[SUBST].name;
el.subst.textContent = M.SUBSTANCES[SUBST].name;
el.goal.textContent = `Đích ${M.fmt(GOAL, 4)} g`;
if (RUN) {
  state.pile = Math.max(0, num(RUN.mass, 0));
  state.tilt = num(RUN.tilt, 0);
  if (RUN.tared !== false) state.tare = M.read(0, { container: state.boat, tare: false, tilt: state.tilt, seed: null }).net;
  if (RUN.doorsOpen) state.door = { x: TRAVEL, v: 0, target: TRAVEL };
} else if (still.matches) {
  // Khung tiêu biểu: cửa đóng, đã trừ bì, 0,5844 g NaCl trong thuyền, số đọc ổn định
  state.pile = M.DEMO.mass;
  state.tare = M.read(0, { container: state.boat, tare: false, seed: null }).net;
}
state.target = targetNow();
state.raw = state.target;
state.trans = { delta: 0, at: -10 };
state.bubble = state.tilt ? [...D.vial.shift] : [0, 0];
draw();
</script></body></html>
