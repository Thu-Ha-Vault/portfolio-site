<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Máy PCR</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình máy PCR: mỗi màu là một token, có giá trị cho giao diện sáng và tối. */
.iso {
  --tc-hot: #ff6a3d;
  --tc-cold: #5aa9ff;
  --tc-screen-bg: #0c161e;
  --tc-screen-ink: #d6ebf5;
  --tc-screen-dim: #6c8797;
  --tc-trace: #ffb547;
  --tc-led: #4be08a;
  --tc-void: #0b0f12;
}
.iso[data-theme="light"] {
  --tc-hot: #e0461f;
  --tc-cold: #2f7fd6;
  --tc-screen-bg: #1d2b36;
  --tc-screen-ink: #e9f2f7;
  --tc-screen-dim: #8fa6b4;
  --tc-trace: #ffb03b;
  --tc-led: #2fb562;
  --tc-void: #2b3238;
}

/* Block, gốm Peltier và tản nhiệt ngả màu theo nhiệt độ: live code đặt --tint và --amt. */
.tc-heat .iso-top { fill: color-mix(in oklab, var(--anatomy-top), var(--tint, var(--anatomy-top)) var(--amt, 0%)); }
.tc-heat .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--anatomy-shade-0), var(--tint, var(--anatomy-shade-0)) var(--amt, 0%)); stroke: none; }
.tc-heat .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--anatomy-shade-1), var(--tint, var(--anatomy-shade-1)) var(--amt, 0%)); stroke: none; }
.tc-heat .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--anatomy-shade-2), var(--tint, var(--anatomy-shade-2)) var(--amt, 0%)); stroke: none; }
.tc-heat .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--tint, var(--anatomy-shade-3)) var(--amt, 0%)); stroke: none; }

.tc-void { fill: var(--tc-void); }
.tc-slot { fill: var(--anatomy-shade-0); }
.tc-tongue { fill: var(--anatomy-shade-2); }
.tc-plate { fill: var(--anatomy-top); }
.tc-pellet { fill: var(--anatomy-shade-0); stroke: var(--anatomy-lo); stroke-width: 0.3px; vector-effect: non-scaling-stroke; }
.tc-blade { fill: var(--anatomy-shade-2); }
.tc-hub { fill: var(--anatomy-top); }
.tc-bezel { fill: var(--anatomy-shade-0); fill-rule: evenodd; }

.tc-glass { fill: var(--tc-screen-bg); }
.tc-grid { fill: none; stroke: var(--tc-screen-dim); stroke-width: 0.4px; vector-effect: non-scaling-stroke; stroke-dasharray: 1.5 1.5; opacity: 0.6; }
.tc-trace { fill: none; stroke: var(--tc-trace); stroke-width: 1.1px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.tc-trace-set { fill: none; stroke: var(--tc-screen-dim); stroke-width: 0.5px; vector-effect: non-scaling-stroke; opacity: 0.8; }
.tc-dot { fill: var(--tc-trace); }
.tc-text, .tc-big, .tc-small { font-family: var(--anatomy-mono); fill: var(--tc-screen-ink); }
.tc-big { font-weight: 500; }
.tc-small { fill: var(--tc-screen-dim); }
[data-part="led"] circle { fill: var(--tc-led); }
[data-part="led"] { transition: opacity 0.25s var(--anatomy-ease); }

.tc-stage { touch-action: pan-y; cursor: pointer; }
.tc-stage:focus { outline: none; }
.tc-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.tc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

à quạt: thải nhiệt khi block hạ nhiệt</span></span><span class="iso-caption">Máy PCR vẽ theo Bio-Rad T100 (26 × 47 × 23 cm), hông phải tháo tấm che. Mỗi chu kỳ, block đổi nhiệt ở tốc độ trung bình 2,5 °C/s: 94 °C trong 30 s để tách đôi DNA, 55 °C trong 30 s để mồi bắt cặp, 72 °C trong 1 phút để Taq polymerase kéo dài mạch mới. Bốn module Peltier dưới block bơm nhiệt vào block khi tăng nhiệt và hút nhiệt ra, đẩy xuống tản nhiệt, khi hạ nhiệt; quạt quay nhanh hơn khi tản nhiệt nóng. Nắp gia nhiệt giữ 105 °C và ép lên nắp ống để hơi nước không đọng lại. Chương trình đầy đủ (94 °C 2 phút, 30 chu kỳ, 72 °C 5 phút, giữ 4 °C) mất 1 giờ 23 phút; hình chạy nhanh hơn thực tế. Số bản sao giả định 10⁴ bản khuôn, hiệu suất 95 %, bão hoà quanh 5×10¹¹. Cấu tạo bên trong vẽ theo thiết kế Peltier điển hình, không theo sơ đồ của hãng.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");

function roundedPlan({ x, y, w, d, r }, steps = 8) {

    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {

    for (let index = 0; index < points.length; index++) {

    const lower = [];

        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);

    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {

    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

function extrude(ring, z, height, projection, options = {}) {

            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {

    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));

    if (x.groups.size !== y.groups.size) return false;

    levels[0].groups.get(tone).forEach((arc, index) => {

    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));

      refine(mid, b, depth + 1);

    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }

  return buckets;
}

function sideOf(meridian) {

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));

  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");

  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));

  return { fill, outline, gap };

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    midS.push(Math.sin(t));

  const tones = [];

    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);

  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

    shape.forEach(([s, r], index) => {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  const L = lightOf(P);

  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);

  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));

  const tones = [];
  for (let j = 0; j < n; j++) {

    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));

  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }

    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));

    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));

    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",

    shades: buckets.slice(0, 4).map((list) => list.join("")),

function prismOf(F, polygon, s0, s1, P) {

function stadium(r0, r1, offset, steps = 32) {

function sphereOf(centre, r, P, { steps = 48 } = {}) {

    const arms = D.knuckles.map(([x0, x1]) => S(prism(ARM, x0, x1), { tone: "mid" })).join("");
    const shell = S(prism(SHELL, -half, half), {
      tone: "hi",
      lit: D.lit,
      inner: sideVisible ? Ln(path3(F, [[half, D.rear, D.seam], [half, D.front, D.seam]]), { tone: "faint" }) : "",
    });
    const handle = S(prism(HANDLE, -D.handle, D.handle), { tone: "mid" });
    const frame = S(prism(FRAME, IX - D.innerHalf, IX + D.innerHalf), { tone: "lo" });
    const plate = S(prism(PLATE, IX - D.innerHalf + 2.5, IX + D.innerHalf - 2.5), { tone: "mid" });
    const top = topVisible(theta) ? Ln(path3(F, insetTop, true), { tone: "faint" }) : "";
    const badge = topVisible(theta)
      ? Ln(path3(F, rounded(D.front - 30, D.front - 20, -half + 12, -half + 40, [1, 1, 1, 1], 2).map(([y, x]) => [x, y, D.top]), true), { tone: "lo" }) +
        Ln(path3(F, [[-half + 15, D.front - 24, D.top], [-half + 34, D.front - 24, D.top]]) + path3(F, [[-half + 15, D.front - 26.4, D.top], [-half + 28, D.front - 26.4, D.top]]), { tone: "lo", free: true })
      : "";
    const grip = topVisible(theta) ? Ln(path3(F, [[-D.handle + 4, D.front + 3.4, 7.5], [D.handle - 4, D.front + 3.4, 7.5]]), { tone: "lo", free: true }) : "";
    if (underVisible(theta)) return knuckles + arms + shell + handle + frame + plate + sym(F);
    return knuckles + arms + frame + plate + shell + handle + top + badge + grip;
  }

  function shapes(theta, A) {
    const F = frameAt(theta);
    const meta = (name) => ({ name, owner: "lid" });
    return [
      A.prism(F, SHELL, -half, half, meta("lid.shell")),
      A.prism(F, HANDLE, -D.handle, D.handle, meta("lid.handle")),
      A.prism(F, FRAME, IX - D.innerHalf, IX + D.innerHalf, meta("lid.frame")),
      A.prism(F, PLATE, IX - D.innerHalf + 2.5, IX + D.innerHalf - 2.5, meta("lid.plate")),
      ...D.knuckles.map(([x0, x1], i) => A.disc(G.frameOf(H, [1, 0, 0], [0, 1, 0], [0, 0, 1]), x0, x1, D.knuckleR, meta(`lid.knuckle${i}`))),

// Mô hình chu trình nhiệt của máy PCR, dùng chung cho bản dựng (Node) và trang (trình duyệt).
// Số liệu:
// - Chu trình 3 bước chuẩn theo Addgene (https://www.addgene.org/protocols/pcr/):
//   biến tính ban đầu 94 °C 2 phút; 30 chu kỳ 94 °C 30 s · 55 °C 30 s · 72 °C 1 phút (sản phẩm 1 kb);
//   kéo dài cuối 72 °C 5 phút; giữ 4 °C.
// - Máy làm mẫu Bio-Rad T100 (Tech Spec Bulletin 6060): tốc độ đổi nhiệt trung bình 2,5 °C/s,
//   nắp gia nhiệt mặc định 105 °C, block 4–100 °C.
// - Số bản sao: giả định 10⁴ bản khuôn ban đầu, hiệu suất mỗi chu kỳ 95 %, bão hoà quanh 5×10¹¹ bản
//   (con số minh hoạ cho một phản ứng 25 µL, không phải thông số của máy).

const PCR = {
  ramp: 2.5,
  lid: 105,
  room: 25,
  cycles: 30,
  initial: { name: "Biến tính ban đầu", T: 94, s: 120 },
  steps: [
    { name: "Biến tính", T: 94, s: 30 },
    { name: "Gắn mồi", T: 55, s: 30 },
    { name: "Kéo dài", T: 72, s: 60 },
  ],
  final: { name: "Kéo dài cuối", T: 72, s: 300 },
  hold: { name: "Giữ", T: 4 },
  copies: { start: 1e4, efficiency: 0.95, plateau: 5e11 },
};

// Dòng thời gian của cả chương trình: mỗi bước là một đoạn đổi nhiệt rồi một đoạn giữ nhiệt.
// Máy chỉ bắt đầu đếm thời gian giữ khi block đã đạt nhiệt độ đặt.
function timeline(pcr = PCR) {
  const list = [{ ...pcr.initial, cycle: 0, step: -1 }];
  for (let c = 1; c <= pcr.cycles; c++) pcr.steps.forEach((s, i) => list.push({ ...s, cycle: c, step: i }));
  list.push({ ...pcr.final, cycle: pcr.cycles, step: 3 });
  list.push({ ...pcr.hold, s: Infinity, cycle: pcr.cycles, step: 4 });
  const segments = [];
  let t = 0;
  let T = pcr.room;
  for (const step of list) {
    const ramp = Math.abs(step.T - T) / pcr.ramp;
    segments.push({ ...step, from: T, t0: t, ramp, hold0: t + ramp, t1: t + ramp + step.s });
    t += ramp + step.s;
    T = step.T;
  }
  return segments;
}

const SEGMENTS = timeline();
const RUN_SECONDS = SEGMENTS[SEGMENTS.length - 1].hold0;

// Trạng thái của máy ở giây thứ t kể từ khi bấm chạy.
function stateAt(t, segments = SEGMENTS, pcr = PCR) {
  if (t <= 0) return { T: pcr.room, rate: 0, index: -1, seg: null, cycle: 0, ramping: false, left: RUN_SECONDS, holdLeft: 0, done: false };
  let i = segments.findIndex((s) => t < s.t1);
  if (i < 0) i = segments.length - 1;
  const seg = segments[i];
  const ramping = t < seg.hold0;
  const k = seg.ramp > 0 ? Math.min(1, (t - seg.t0) / seg.ramp) : 1;
  const T = ramping ? seg.from + (seg.T - seg.from) * k : seg.T;
  const rate = ramping ? Math.sign(seg.T - seg.from) * pcr.ramp : 0;
  const done = seg.step === 4 && !ramping;
  return {
    T,
    rate,
    index: i,
    seg,
    cycle: seg.cycle,
    ramping,
    holdLeft: ramping ? seg.s : Math.max(0, seg.t1 - t),
    left: Math.max(0, RUN_SECONDS - t),
    done,
  };
}

// Số bản sao sau n chu kỳ hoàn tất: mỗi lần kéo dài xong, số bản sao tăng theo hiệu suất,
// hiệu suất giảm dần khi gần bão hoà (cạn mồi, dNTP, enzyme).
function copiesAfter(n, pcr = PCR) {
  const { start, efficiency, plateau } = pcr.copies;
  let N = start;
  for (let c = 0; c < n; c++) N = N * (1 + efficiency * (1 - N / plateau));
  return N;
}

// Số chu kỳ đã hoàn tất ở giây t: một chu kỳ xong khi bước kéo dài của nó kết thúc.
function cyclesDone(t, segments = SEGMENTS) {
  let n = 0;
  for (const s of segments) if (s.step === 2 && t >= s.t1) n = s.cycle;
  return n;
}

// Đường nhiệt độ của một chu kỳ mẫu (để vẽ trục trên màn hình): [giây, °C].
function cycleProfile(pcr = PCR) {
  const pts = [];
  let t = 0;
  let T = pcr.steps[pcr.steps.length - 1].T;
  for (const s of pcr.steps) {
    const ramp = Math.abs(s.T - T) / pcr.ramp;
    pts.push([t, T], [t + ramp, s.T]);
    t += ramp + s.s;
    T = s.T;
    pts.push([t, T]);
  }
  return { points: pts, length: t };
}

const fmtTime = (s) => {
  const m = Math.floor(s / 60);
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
};

const fmtCopies = (N) => {
  const e = Math.floor(Math.log10(N));
  const m = N / 10 ** e;
  const sup = String(e).replace(/\d/g, (d) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
  return `${m.toFixed(1).replace(".", ",")}×10${sup}`;
};

// Phần chạy trong trang: nắp bản lề, chương trình nhiệt, màn hình, quạt, màu nhiệt, vòng giới thiệu.
const D = {"P":{"origin":[323.72070592193336,420.5143539807797],"scale":1.2907291518366717,"azimuth":38,"elevation":30},"lid":{"H":[0,-60,73.5],"rear":7,"front":134,"bottom":-3.5,"top":38,"seam":22,"half":62,"handle":36,"inner":[44,92],"innerHalf":33,"innerX":14,"knuckleR":3.5,"knuckles":[[-58,-47],[47,58]],"lit":false},"lidOpen":1.2217304763960306,"flip":0.7532961786260434,"fan":{"c":[48.5,8,29]},"pcr":{"ramp":2.5,"lid":105,"room":25,"cycles":30,"initial":{"name":"Biến tính ban đầu","T":94,"s":120},"steps":[{"name":"Biến tính","T":94,"s":30},{"name":"Gắn mồi","T":55,"s":30},{"name":"Kéo dài","T":72,"s":60}],"final":{"name":"Kéo dài cuối","T":72,"s":300},"hold":{"name":"Giữ","T":4},"copies":{"start":10000,"efficiency":0.95,"plateau":500000000000}}};
const P = D.P;
const LIDM = makeLid({ iso, pathOf, solidSvg, lineSvg }, G, P, D.lid);
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const $ = (sel) => svgEl.querySelector(sel);
const $$ = (sel) => [...svgEl.querySelectorAll(sel)];
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const el = {
  closed: $('[data-slot="closed"]'),
  open: $('[data-slot="open"]'),
  blades: $('[data-part="blades"]'),
  led: $('[data-part="led"]'),
  block: $$('[data-heat="block"]'),
  sink: $$('[data-heat="sink"]'),
  status: $('[data-part="status"]'),
  cycle: $('[data-part="cycle"]'),
  temp: $('[data-part="temp"]'),
  step: $('[data-part="step"]'),
  foot: $('[data-part="foot"]'),
  trace: $('[data-part="trace"]'),
  sets: $('[data-part="setpoints"]'),
  now: $('[data-part="now"]'),
};

// Ống của người dùng do app truyền qua địa chỉ (…thermocycler.html#run=<JSON>): { name, start, eff }
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
// Số bản sao sau n chu kỳ: theo ống người dùng (số bản khuôn, hiệu suất thật của ống) hoặc theo mô hình mẫu
function copiesOf(n) {
  if (!RUN) return copiesAfter(n);
  let N = RUN.start;
  for (let c = 0; c < n; c++) N *= 1 + RUN.eff * (1 - N / D.pcr.copies.plateau);
  return N;
}
const copyText = (N) => (N >= 1 ? fmtCopies(N) : "0");

const SPEEDS = [30, 60, 120, 240, 600];
const TOUR_SPEED = 2;
const LID_OPEN = D.lidOpen;
const STEP_SHORT = ["Biến tính", "Gắn mồi", "Kéo dài", "Kéo dài cuối", "Giữ"];
const ROOM = D.pcr.room;
const WINDOW = 302; // hai chu kỳ trên màn hình (giây của chương trình)

const state = {
  lid: { x: LID_OPEN, v: 0, target: LID_OPEN },
  run: false,
  done: false,
  t: 0,
  speed: TOUR_SPEED,
  idleT: ROOM,
  fan: 0,
  sinkHeat: 0,
  blink: 0,
};
let lidDrawn = null;
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches;
let tour = { step: "wait", wait: 1.6 };
let idleTimer = 0;
let lastCycle = -1;
let lastPhase = "";

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const decimal = (v, d = 1) => v.toFixed(d).replace(".", ",");

// Nắp: lò xo giảm chấn tới hạn theo góc, vẽ lại mỗi khung hình vào đúng chỗ trong thứ tự vẽ.
function drawLid() {
  const th = state.lid.x;
  const key = th.toFixed(4);
  if (key === lidDrawn) return;
  lidDrawn = key;
  const markup = LIDM.svg(th);
  if (th > D.flip) {
    el.open.innerHTML = markup;
    el.closed.innerHTML = "";
  } else {
    el.closed.innerHTML = markup;
    el.open.innerHTML = "";
  }
}
function stepLid(dt, calm) {
  const L = state.lid;
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const w = 1 / 0.32;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.min(LID_OPEN, Math.max(0, L.x));
  if (Math.abs(L.target - L.x) < 1e-4 && Math.abs(L.v) < 1e-4) { L.x = L.target; L.v = 0; return false; }

}
const lidClosed = () => state.lid.x < 1e-3 && state.lid.target === 0;
const lidOpen = () => state.lid.x > LID_OPEN - 1e-3;

// Nhiệt độ block hiện tại: theo chương trình khi chạy, trôi về nhiệt độ phòng khi tắt.
function blockNow() {
  if (state.run || state.done || state.t > 0) return stateAt(state.t);
  return { T: state.idleT, rate: 0, seg: null, cycle: 0, ramping: false, left: RUN_SECONDS, done: false, holdLeft: 0 };
}

function tint(list, amt, which) {
  const value = `${(amt * 100).toFixed(1)}%`;
  for (const node of list) {
    node.style.setProperty("--amt", value);
    node.style.setProperty("--tint", which);
  }
}

function drawScreen(s) {
  const running = state.run && !s.done;
  const statusText = s.done ? "XONG · GIỮ" : running ? "ĐANG CHẠY" : state.t > 0 ? "TẠM DỪNG" : lidClosed() ? "SẴN SÀNG" : "NẮP MỞ";
  el.status.textContent = statusText;
  el.cycle.textContent = `${s.cycle}/${D.pcr.cycles}`;
  el.temp.textContent = `${decimal(s.T)}°C`;
  el.step.textContent = s.seg ? (s.seg.step < 0 ? "Biến tính đầu" : STEP_SHORT[s.seg.step]) + (s.ramping ? " ·  đổi nhiệt" : ` · còn ${Math.ceil(s.holdLeft)} s`) : "—";
  const lid = state.run ? `${D.pcr.lid}°C` : "tắt";
  el.foot.textContent = `Nắp ${lid} · ×${SPEEDS[state.speed]} · còn ${fmtTime(s.left)}`;
  const wOf = (T) => (16.4 - (T / 100) * 11).toFixed(2);
  const pts = [];
  const sets = [];
  const n = 72;
  const t = state.t;
  for (let i = 0; i <= n; i++) {
    const ti = t - WINDOW + (WINDOW * i) / n;
    const si = ti > 0 ? stateAt(ti) : null;
    const Ti = si ? si.T : t > 0 ? ROOM : s.T;
    pts.push(`${(-26 + (52 * i) / n).toFixed(2)} ${wOf(Ti)}`);
    if (si && si.seg) sets.push(`${(-26 + (52 * i) / n).toFixed(2)} ${wOf(si.seg.T)}`);
  }
  el.trace.setAttribute("d", `M${pts.join("L")}`);
  el.sets.setAttribute("d", sets.length > 1 ? `M${sets.join("L")}` : "");
  el.now.setAttribute("cy", wOf(s.T));
}

function drawReadout(s) {
  const copies = copyText(copiesOf(cyclesDone(state.t)));
  const who = RUN?.name ? ` · ${RUN.name}` : "";
  let text;
  if (s.done) text = `xong · giữ 4 °C · ${copies} bản sao${who}`;
  else if (state.run || state.t > 0) text = `chu kỳ ${s.cycle}/${D.pcr.cycles} · ${decimal(s.T)} °C · ${copies} bản sao${who}`;
  else text = lidOpen() ? "nắp mở · 30 chu kỳ" : state.lid.target === 0 ? "sẵn sàng · 30 chu kỳ" : "đang mở nắp";
  if (readout.textContent !== text) readout.textContent = text;
  const phase = s.done ? "Xong, block giữ 4 °C." : state.run ? `Chu kỳ ${s.cycle}` : "";
  if (phase && phase !== lastPhase && (s.cycle !== lastCycle || s.done)) { lastPhase = phase; lastCycle = s.cycle; say(phase); }
}

function draw(dt, calm) {
  drawLid();
  const s = blockNow();
  // Màu nhiệt của block: ấm trên nhiệt độ phòng, xanh dưới nhiệt độ phòng.
  if (s.T >= ROOM) tint(el.block, Math.min(1, (s.T - ROOM) / 70) * 0.6, "var(--tc-hot)");
  else tint(el.block, Math.min(1, (ROOM - s.T) / 21) * 0.55, "var(--tc-cold)");
  // Mặt nóng của Peltier và tản nhiệt nhận nhiệt khi block hạ nhiệt (Peltier đảo chiều bơm).
  const load = state.run && s.rate < 0 ? 1 : state.run && s.T > 60 ? 0.25 : 0.06;
  state.sinkHeat = calm ? load : state.sinkHeat + (load - state.sinkHeat) * (1 - Math.exp(-dt / 0.6));
  tint(el.sink, state.sinkHeat * 0.5, "var(--tc-hot)");
  // Quạt: quay nhanh hơn khi tản nhiệt nóng.
  if (!calm) {
    state.fan = (state.fan + dt * (3 + 15 * state.sinkHeat)) % (Math.PI * 2);
    el.blades.setAttribute("transform", `rotate(${((state.fan * 180) / Math.PI).toFixed(1)})`);
  }
  // Đèn trạng thái: sáng liên tục khi chạy, nhấp nháy khi chờ.
  state.blink = (state.blink + dt) % 1.2;
  el.led.style.opacity = state.run && !s.done ? "1" : calm || state.blink < 0.7 ? "1" : "0.2";
  drawScreen(s);
  drawReadout(s);
}

function setRun(on) {
  if (on && !lidClosed()) { state.lid.target = 0; state.arm = true; say("Đóng nắp trước khi chạy."); return; }
  if (on && state.done) { state.t = 0; state.done = false; }
  state.run = on;
  if (on) say("Bắt đầu chạy: nắp gia nhiệt lên 105 °C.");
  else say(state.t > 0 ? "Tạm dừng." : "Dừng.");
}
function stopAll() {
  const s = blockNow();
  state.idleT = s.T;
  state.run = false;
  state.done = false;
  state.t = 0;
  lastCycle = -1;
  lastPhase = "";
}
function toggleLid() {
  if (state.run) { say("Đang chạy: dừng chương trình trước khi mở nắp."); return; }
  state.lid.target = state.lid.target > 0 ? 0 : LID_OPEN;
  say(state.lid.target > 0 ? "Mở nắp." : "Đóng nắp.");
}

function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "wait") { state.lid.target = 0; tour = { step: "closing", wait: 0.3 }; }
  else if (tour.step === "closing") { if (lidClosed()) { state.speed = TOUR_SPEED; setRun(true); tour = { step: "running", wait: 0 }; } }
  else if (tour.step === "running") { if (state.done) tour = { step: "hold", wait: 2.6 }; }
  else if (tour.step === "hold") { stopAll(); tour = { step: "opening", wait: 1.2 }; }
  else if (tour.step === "opening") { state.lid.target = LID_OPEN; tour = { step: "rest", wait: 2.4 }; }
  else if (tour.step === "rest") tour = { step: "wait", wait: 0.2 };
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  const lidMoving = stepLid(dt, calm);
  if (state.arm && lidClosed()) { state.arm = false; setRun(true); }
  if (state.run) {
    state.t += dt * SPEEDS[state.speed];
    if (state.t >= RUN_SECONDS) { state.t = RUN_SECONDS + 1; state.done = true; }
  } else if (!state.done) {
    state.idleT = calm ? ROOM : state.idleT + (ROOM - state.idleT) * (1 - Math.exp(-dt / 1.5));
  }
  draw(dt, calm);
  const busy = !calm || lidMoving;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 1.6 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || state.run) return; touring = true; tour = { step: "wait", wait: 0.6 }; run(); }, 9000);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (key === " " || key === "Enter" || key === "Escape" || key.startsWith("Arrow")) event.preventDefault();
  else return;
  takeOver();
  if (key === " ") setRun(!state.run);
  else if (key === "Enter") toggleLid();
  else if (key === "Escape") { stopAll(); say("Dừng và đặt lại."); }
  else if (key === "ArrowRight" || key === "ArrowUp") state.speed = Math.min(SPEEDS.length - 1, state.speed + 1);
  else if (key === "ArrowLeft" || key === "ArrowDown") state.speed = Math.max(0, state.speed - 1);
  if (still.matches && key === " " && state.run) { state.t = Math.min(RUN_SECONDS + 1, state.t + 151.2); state.run = false; }
  run();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest('[data-slot]')) toggleLid();
  else setRun(!state.run);
  stage.focus({ preventScroll: true });
  run();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) {
  // Giảm chuyển động: một khung hình tiêu biểu (nắp đóng, giữa bước gắn mồi của chu kỳ 12).
  state.lid = { x: 0, v: 0, target: 0 };
  state.run = false;
  state.t = timeline().find((s) => s.cycle === 12 && s.step === 1).hold0 + 15;
}
draw(1 / 60, still.matches);
</script></body></html>
