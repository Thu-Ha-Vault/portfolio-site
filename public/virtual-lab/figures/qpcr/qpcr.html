//   khung C1000 Touch, tốc độ đổi nhiệt tối đa 5 °C/s, trung bình 3,3 °C/s, block Peltier 0–100 °C, nắp tới 105 °C,
//   6 LED có kính lọc kích thích, 6 photodiode có kính lọc thu, 450–730 nm, độ nhạy 1 bản sao,
//   khoảng động 10 bậc độ lớn, quét mọi kênh 12 s, quét nhanh một kênh 3 s.
//   Bảng kênh (cùng bulletin, trang 4): kích thích 450–490 / 515–535 / 560–590 / 620–650 / 672–684 nm,
//   thu 510–530 / 560–580 / 610–650 / 675–690 / 705–730 nm; kênh 6 dành cho FRET.
// - Chương trình nhiệt cho máy CFX ở chế độ chỉ SYBR (SsoAdvanced Universal SYBR Green Supermix, manual 10031339, bảng 2,
//   https://www.bio-rad.com/webroot/web/pdf/lsr/literature/10031339.pdf): 95 °C 30 s (cDNA), 35–40 chu kỳ
//   95 °C 5–15 s · 60 °C 10–30 s + đọc đĩa; đường nóng chảy 65–95 °C, bước 0,5 °C, 2–5 s mỗi bước.
//   Cùng manual: sản phẩm đặc hiệu cho một đỉnh nóng chảy quanh 85–87 °C; dimer mồi cho đỉnh quanh giữa 70 °C;
//   hiệu suất 90–110 % (độ dốc −3,6 đến −3,1), E = 10^(−1/độ dốc) − 1; amplicon nên dài 70–150 bp; phản ứng 20 µL.
// - Ngưỡng phát hiện: Bulletin 6093 cho 96 giếng 10⁵ bản plasmid IL-1β có Cq trung bình 19,81 ± 0,10.
//   Với E = 100 %, ngưỡng tương ứng khoảng 10⁵ × 2^19,8 ≈ 9×10¹⁰ bản, nên mô hình lấy ngưỡng ở 10¹¹ bản.
//   Độ lệch 0,10 chu kỳ giữa các giếng tương ứng sai số hút mẫu khoảng 7 % (0,10 × ln 2).
// - Phần không có nguồn trực tiếp (ghi rõ là giả định để minh hoạ): K = 10¹² bản ở nửa mức bão hoà tín hiệu,
//   Fmax = 4 400 RFU, nền 220 RFU trôi 1,2 RFU mỗi chu kỳ, nhiễu 4 RFU; dimer mồi khởi đầu khoảng 60 phân tử
//   hiệu dụng, nhân lên 80 % mỗi chu kỳ và chỉ cho tín hiệu bằng 0,4 lần sản phẩm (ngắn hơn nên gắn ít SYBR Green hơn);
//   độ rộng chuyển pha nóng chảy 0,55 °C cho sản phẩm, 0,9 °C cho dimer.




/** Thông số máy và chương trình chạy mẫu (SYBR Green, 40 chu kỳ hai bước, đường nóng chảy). */
const QPCR = {
  ramp: 3.3, // °C/s trung bình (Bulletin 6093)
  rampMax: 5,
  lid: 105,
  room: 25,
  cycles: 40,
  initial: { name: "Hoạt hoá polymerase", T: 95, s: 30 },
  steps: [
    { name: "Biến tính", T: 95, s: 10 },
    { name: "Gắn mồi + kéo dài", T: 60, s: 30 },
  ],
  readStep: 1, // đọc đĩa ở cuối bước 60 °C
  read: 3, // s, quét nhanh một kênh (SYBR/FAM)
  readAll: 12, // s, quét đủ 6 kênh
  melt: { from: 65, to: 95, step: 0.5, s: 5 },
  volume: 20, // µL
};

/** Năm kênh màu và kênh FRET của CFX96 Touch (nm). Kênh 1 đọc SYBR Green. */
const CHANNELS = [
  { ch: 1, dye: "FAM / SYBR Green", ex: [450, 490], em: [510, 530] },
  { ch: 2, dye: "HEX / VIC", ex: [515, 535], em: [560, 580] },
  { ch: 3, dye: "Texas Red / ROX", ex: [560, 590], em: [610, 650] },
  { ch: 4, dye: "Cy5", ex: [620, 650], em: [675, 690] },
  { ch: 5, dye: "Quasar 705", ex: [672, 684], em: [705, 730] },
  { ch: 6, dye: "FRET", ex: [450, 490], em: [560, 580] },
];

/** Mô hình tín hiệu huỳnh quang. N_th là số bản ở ngưỡng, K là số bản ở nửa mức bão hoà. */
const FLUOR = {
  Fmax: 4400, // RFU
  K: 1e12,
  Nth: 1e11,
  base: 220,
  drift: 1.2,
  noise: 4,
  pipetCV: 0.07,
  product: { Tm: 85.5, width: 0.55, weight: 1 },
  dimer: { Tm: 75.5, width: 0.9, n0: 60, eff: 0.8, weight: 0.4 },
  meltSlope: 0.012, // SYBR Green sáng kém đi khi nóng: giảm 1,2 % mỗi °C (giả định)
  meltBg: 60, // RFU nền không phụ thuộc DNA
};

/** Ngưỡng (RFU, sau khi trừ nền) ứng với N_th bản. */
const THRESHOLD = signalOf(FLUOR.Nth);

/** Dãy pha loãng mẫu: 10⁶ → 10² bản, mỗi bậc 10 lần, và một giếng đối chứng không khuôn (NTC). */
const DEFAULT_WELLS = [
  { name: "10⁶ bản", n0: 1e6, eff: 0.95 },
  { name: "10⁵ bản", n0: 1e5, eff: 0.95 },
  { name: "10⁴ bản", n0: 1e4, eff: 0.95 },
  { name: "10³ bản", n0: 1e3, eff: 0.95 },
  { name: "10² bản", n0: 1e2, eff: 0.95 },
  { name: "NTC", n0: 0 },
];

// ——— Số ngẫu nhiên có seed ———

/** Bộ sinh số ngẫu nhiên mulberry32: trả về hàm cho số trong [0, 1). */
function rng(seed = 1) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Seed lấy từ một chuỗi (tên giếng), để mỗi giếng có nhiễu riêng nhưng lặp lại được. */
function seedOf(text, base = 0) {
  let h = 2166136261 ^ base;
  for (const ch of String(text)) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
  return h >>> 0;
}

/** Phân phối chuẩn (Box–Muller). */
function gauss(rand) {
  const u = Math.max(1e-12, rand());
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand());
}

/** Số phân tử khuôn thật sự rơi vào giếng: Poisson với trung bình λ (ít bản thì có giếng không có bản nào). */
function poisson(lambda, rand) {
  if (lambda <= 0) return 0;
  if (lambda > 200) return Math.max(0, Math.round(lambda + Math.sqrt(lambda) * gauss(rand)));
  const L = Math.exp(-lambda);
  let k = 0;
  let p = 1;
  do { k++; p *= rand(); } while (p > L);
  return k - 1;
}

// ——— Khuếch đại và tín hiệu ———

/** Số bản sau c chu kỳ, nhân lên (1 + E) mỗi chu kỳ (chưa tính bão hoà; bão hoà nằm ở signalOf). */
const copiesAt = (n0, eff, c) => n0 * (1 + eff) ** c;

/** Tín hiệu huỳnh quang (RFU, đã trừ nền) của S bản: Fmax · S / (S + K), tăng tuyến tính rồi bão hoà. */
function signalOf(S, f = FLUOR) {
  return (f.Fmax * S) / (S + f.K);
}

/** Ct lý thuyết: chu kỳ mà N0·(1+E)^Ct = N_th. Bằng −log10(N0)/log10(1+E) + b, với b = log10(N_th)/log10(1+E). */
function ctTheory(n0, eff, f = FLUOR) {
  if (!(n0 > 0)) return null;
  return Math.log10(f.Nth / n0) / Math.log10(1 + eff);
}

/** Độ dốc lý thuyết của đường chuẩn: −1/log10(1 + E); bằng −3,32 khi E = 100 %. */
const slopeOf = (eff) => -1 / Math.log10(1 + eff);
/** Hiệu suất từ độ dốc: E = 10^(−1/độ dốc) − 1. */
const effOf = (slope) => 10 ** (-1 / slope) - 1;

/** Ct từ chuỗi RFU đã trừ nền: chu kỳ đầu tiên vượt ngưỡng, nội suy tuyến tính giữa hai chu kỳ. null nếu không vượt. */
function ctOf(sub, threshold = THRESHOLD) {
  for (let i = 1; i < sub.length; i++) {
    if (sub[i] >= threshold && sub[i - 1] < threshold) return i - 1 + (threshold - sub[i - 1]) / (sub[i] - sub[i - 1]);
  }
  return null;
}

/** Trừ nền như phần mềm của máy: đường thẳng khớp theo các chu kỳ nền (từ chu kỳ 3 tới trước lúc tín hiệu bắt đầu lên). */
function subtractBaseline(raw, f = FLUOR) {
  const n = raw.length - 1; // raw[0] bỏ trống, raw[c] là chu kỳ c
  let end = Math.min(15, n);
  for (let c = 4; c <= Math.min(15, n); c++) {
    if (raw[c] - raw[c - 1] > 8 * f.noise + f.drift) { end = c - 3; break; }
  }
  end = Math.max(end, 5);
  const xs = [];
  const ys = [];
  for (let c = 3; c <= end; c++) { xs.push(c); ys.push(raw[c]); }
  const { slope, intercept } = fitLine(xs, ys);
  return raw.map((v, c) => (c === 0 ? 0 : v - (intercept + slope * c)));
}

/** Hồi quy tuyến tính bình phương nhỏ nhất: { slope, intercept, r2 }. */
function fitLine(xs, ys) {
  const n = xs.length;
  const mx = xs.reduce((a, b) => a + b, 0) / n;
  const my = ys.reduce((a, b) => a + b, 0) / n;
  let sxx = 0;
  let sxy = 0;
  let syy = 0;
  for (let i = 0; i < n; i++) {
    sxx += (xs[i] - mx) ** 2;
    sxy += (xs[i] - mx) * (ys[i] - my);
    syy += (ys[i] - my) ** 2;
  }
  const slope = sxx > 0 ? sxy / sxx : 0;
  const intercept = my - slope * mx;
  const r2 = sxx > 0 && syy > 0 ? (sxy * sxy) / (sxx * syy) : 1;
  return { slope, intercept, r2 };
}

/** Đường chuẩn từ các giếng biết số bản: Ct theo log10(N0). Trả về độ dốc, hệ số chặn, hiệu suất và R². */
function standardCurve(points) {
  const use = points.filter((p) => p.n0 > 0 && p.ct != null);
  if (use.length < 2) return null;
  const fit = fitLine(use.map((p) => Math.log10(p.n0)), use.map((p) => p.ct));
  return { slope: fit.slope, intercept: fit.intercept, eff: effOf(fit.slope), r2: fit.r2, n: use.length };
}

/** Phần sợi đôi còn lại ở nhiệt độ T của một sản phẩm có điểm nóng chảy Tm (đường logistic). */
const dsFraction = (T, Tm, width) => 1 / (1 + Math.exp((T - Tm) / width));

/**
 * Chạy một giếng: số bản thật (Poisson + sai số hút), chuỗi RFU thô theo chu kỳ, RFU đã trừ nền, Ct,
 * rồi đường nóng chảy (RFU và −dF/dT theo nhiệt độ) với các đỉnh.
 * spec: { name, n0 (số bản trung bình), eff (0–1.2, mặc định 0.95), tm (°C, mặc định 85,5), dimer (mặc định true) }
 */
function runWell(spec, { seed = 1, q = QPCR, f = FLUOR } = {}) {
  const rand = rng(seedOf(spec.name ?? "giếng", seed));
  const n0 = Math.max(0, Number(spec.n0) || 0);
  const eff = Math.min(1.2, Math.max(0, spec.eff == null ? 0.95 : Number(spec.eff)));
  // Số bản thật: Poisson khi ít bản, rồi sai số hút mẫu (log-chuẩn)
  const drawn = n0 < 1e4 ? poisson(n0, rand) : n0;
  const actual = drawn * Math.exp(f.pipetCV * gauss(rand));
  // Dimer mồi: chỉ thắng được khi giếng không có khuôn nào
  const dimerOn = spec.dimer !== false && drawn === 0;
  const pd = f.dimer;
  const pd0 = dimerOn ? poisson(pd.n0, rand) : 0;
  const tm = (spec.tm ?? f.product.Tm) + 0.15 * gauss(rand);
  const tmDimer = pd.Tm + 0.2 * gauss(rand);
  const base = f.base * (1 + 0.05 * gauss(rand));
  const raw = [0];
  const parts = [];
  for (let c = 1; c <= q.cycles; c++) {
    const Nt = copiesAt(actual, eff, c);
    const Nd = copiesAt(pd0, pd.eff, c);
    const S = Nt * f.product.weight + Nd * pd.weight;
    const amp = signalOf(S, f);
    raw.push(base + f.drift * c + amp + f.noise * gauss(rand));
    parts.push({ t: S > 0 ? (Nt * f.product.weight) / S : 0, amp });
  }
  const sub = subtractBaseline(raw, f);
  const ct = ctOf(sub);
  // Đường nóng chảy: lượng mỗi sản phẩm lấy từ tín hiệu ở chu kỳ cuối
  const last = parts[parts.length - 1];
  const products = [
    { Tm: tm, width: f.product.width, A: last.amp * last.t },
    { Tm: tmDimer, width: pd.width, A: last.amp * (1 - last.t) },
  ].filter((p) => p.A > 1);
  const melt = meltCurve(products, { q, f, rand });
  return { name: spec.name ?? "", n0, eff, actual, dimer: pd0 > 0, raw, sub, ct, tm, products, melt, peaks: meltPeaks(melt) };
}

/** Đường nóng chảy đọc mỗi bước nhiệt: [{ T, F, dF }], dF = −dF/dT tính bằng sai phân như phần mềm của máy. */
function meltCurve(products, { q = QPCR, f = FLUOR, rand = rng(7) } = {}) {
  const pts = [];
  const { from, to, step } = q.melt;
  const n = Math.round((to - from) / step);
  for (let i = 0; i <= n; i++) {
    const T = from + i * step;
    const dye = 1 - f.meltSlope * (T - from);
    let F = f.meltBg * dye;
    for (const p of products) F += p.A * dsFraction(T, p.Tm, p.width) * dye;
    pts.push({ T, F: F + f.noise * 0.5 * gauss(rand), dF: 0 });
  }
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)];
    const b = pts[Math.min(pts.length - 1, i + 1)];
    pts[i].dF = -(b.F - a.F) / (b.T - a.T);
  }
  return pts;
}

/** Các đỉnh của −dF/dT cao hơn 15 % đỉnh lớn nhất (và trên 20 RFU/°C): [{ T, h }] theo chiều cao giảm dần. */
function meltPeaks(melt) {
  const top = Math.max(...melt.map((p) => p.dF));
  const out = [];
  for (let i = 2; i < melt.length - 2; i++) {
    const p = melt[i];
    if (p.dF > melt[i - 1].dF && p.dF >= melt[i + 1].dF && p.dF > Math.max(20, top * 0.15)) out.push({ T: p.T, h: p.dF });
  }
  return out.sort((a, b) => b.h - a.h);
}

/** Chạy cả đĩa: các giếng, ngưỡng và đường chuẩn từ các giếng có số bản đã biết. */
function runPlate(wells = DEFAULT_WELLS, { seed = 1 } = {}) {
  const list = wells.map((w) => runWell(w, { seed }));
  return { wells: list, threshold: THRESHOLD, curve: standardCurve(list) };
}

// ——— Dòng thời gian của chương trình ———

/**
 * Các đoạn của chương trình: mỗi đoạn có đổi nhiệt (ramp), giữ nhiệt (s) rồi đọc đĩa (read, nếu có).
 * Phần chu kỳ dựng lại từ timeline() của máy PCR thường (figures/thermocycler/model.mjs), thêm thời gian đọc đĩa;
 * sau đó là các bước nóng chảy 65 → 95 °C, mỗi bước giữ 5 s rồi đọc.
 */
function runTimeline(q = QPCR) {
  const base = cycleTimeline({ ...q, final: { name: "Về 65 °C", T: q.melt.from, s: 10 }, hold: { name: "Giữ", T: q.melt.from } });
  const segs = [];
  let t = 0;
  for (const s of base.slice(0, -1)) {
    const read = s.step === q.readStep ? q.read : 0;
    segs.push({ kind: "cycle", name: s.name, T: s.T, from: s.from, cycle: s.cycle, step: s.step, ramp: s.ramp, s: s.s, read, t0: t, hold0: t + s.ramp, read0: t + s.ramp + s.s, t1: t + s.ramp + s.s + read });
    t = segs[segs.length - 1].t1;
  }
  const { from, to, step } = q.melt;
  const n = Math.round((to - from) / step);
  let T = from;
  for (let i = 0; i <= n; i++) {
    const Ti = from + i * step;
    const ramp = Math.abs(Ti - T) / q.ramp;
    segs.push({ kind: "melt", name: "Nóng chảy", T: Ti, from: T, cycle: q.cycles, step: 5, melt: i, ramp, s: q.melt.s, read: q.read, t0: t, hold0: t + ramp, read0: t + ramp + q.melt.s, t1: t + ramp + q.melt.s + q.read });
    t = segs[segs.length - 1].t1;
    T = Ti;
  }
  return segs;
}

const SEGMENTS = runTimeline();
/** Tổng thời gian chương trình mẫu (giây): khoảng 55 phút. */
const RUN_SECONDS = SEGMENTS[SEGMENTS.length - 1].t1;

/**
 * Trạng thái máy ở giây t kể từ khi bấm chạy: nhiệt độ block, đoạn hiện tại, đang đọc hay không và tiến độ đọc (0–1),
 * số lần đọc chu kỳ đã xong (reads) và số bước nóng chảy đã đọc (meltReads).
 */
function stateAt(t, segs = SEGMENTS, q = QPCR) {
  const total = segs[segs.length - 1].t1;
  if (t <= 0) return { T: q.room, rate: 0, seg: null, index: -1, cycle: 0, ramping: false, reading: false, readFrac: 0, reads: 0, meltReads: 0, left: total, done: false, melting: false };
  if (t >= total) {
    const seg = segs[segs.length - 1];
    return { T: seg.T, rate: 0, seg, index: segs.length - 1, cycle: q.cycles, ramping: false, reading: false, readFrac: 0, reads: q.cycles, meltReads: seg.melt + 1, left: 0, done: true, melting: false };
  }
  let i = segs.findIndex((s) => t < s.t1);
  const seg = segs[i];
  const ramping = t < seg.hold0;
  const k = seg.ramp > 0 ? Math.min(1, (t - seg.t0) / seg.ramp) : 1;
  const T = ramping ? seg.from + (seg.T - seg.from) * k : seg.T;
  const reading = seg.read > 0 && t >= seg.read0;
  let reads = 0;
  let meltReads = 0;
  for (let j = 0; j < i; j++) {
    const s = segs[j];
    if (s.kind === "cycle" && s.read > 0) reads++;
    if (s.kind === "melt") meltReads++;
  }
  return {
    T,
    rate: ramping ? Math.sign(seg.T - seg.from) * q.ramp : 0,
    seg,
    index: i,
    cycle: seg.cycle,
    ramping,
    reading,
    readFrac: reading ? (t - seg.read0) / seg.read : 0,
    reads,
    meltReads,
    left: Math.max(0, total - t),
    done: false,
    melting: seg.kind === "melt",
  };
}

/** Vị trí đầu quang học khi quét đĩa 96 giếng theo đường rắn bò (cột 1 → 12, mỗi cột đi hết 8 hàng). frac 0–1 → { col, row } (số thực). */
function scanAt(frac) {
  const f = Math.min(1, Math.max(0, frac)) * 12;
  const col = Math.min(11, Math.floor(f));
  const along = f - col;
  // trong mỗi cột: đi dọc 8 hàng (85 % thời gian) rồi bước sang cột kế (15 %)
  const go = Math.min(1, along / 0.85);
  const r = 7 * (0.5 - 0.5 * Math.cos(Math.PI * go));
  const row = col % 2 === 0 ? r : 7 - r;
  const step = along > 0.85 && col < 11 ? (along - 0.85) / 0.15 : 0;
  return { col: col + (0.5 - 0.5 * Math.cos(Math.PI * step)), row };
}

/** Định dạng Ct kiểu Việt Nam: "21,4" hoặc "—" khi không vượt ngưỡng. */
const fmtCt = (ct) => (ct == null ? "—" : ct.toFixed(1).replace(".", ","));

return { QPCR, FLUOR, THRESHOLD, DEFAULT_WELLS, CHANNELS, runPlate, runTimeline, stateAt, scanAt, fmtCt, fmtTime, RUN_SECONDS, standardCurve };})();
// Phần chạy trong trang: nắp bản lề, chương trình nhiệt, đầu quang học quét khi đọc đĩa, huỳnh quang trên lỗ,
// đường khuếch đại và đường nóng chảy trên màn hình, quạt, màu nhiệt, vòng giới thiệu.
const D = {"P":{"origin":[304.34086512083866,560.9190252411859],"scale":1.2422313850923536,"azimuth":38,"elevation":30},"lid":{"H":[0,-115.5,124],"rear":3.5,"rb":17.5,"nose":153.5,"front":191.5,"bottom":-2,"top":56,"cutX":-38,"strip":50,"half":78,"handle":10,"knuckleR":3.5,"knuckles":[[-70,-58],[58,70]],"rods":{"rear":[21,36,48],"front":[147,42],"r":1.2,"x0":-38,"x1":44},"well":{"x0":-14.75,"y0":79.75,"pitch":4.5},"home":{"col":0,"row":0}},"lidOpen":1.0821041362364843,"flip":0.7532961786260434,"plot":{"u0":-38,"u1":13,"w0":-12.5,"w1":15},"list":{"u":17,"w0":-12,"dw":3.6},"fan":{"c":[46.5,-20,73]}};
const P = D.P;
const LIDM = makeLid({ iso, pathOf, solidSvg, lineSvg, dotsSvg }, G, P, D.lid);
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const machine = svgEl.querySelector(".qp-machine");
const $ = (sel) => svgEl.querySelector(sel);
const $$ = (sel) => [...svgEl.querySelectorAll(sel)];
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

// Giếng của người dùng do app truyền qua địa chỉ (…qpcr.html#run=<JSON>):
// { "wells": [{ "name": "Mẫu 1", "n0": 10000, "eff": 0.95 }, { "name": "NTC", "n0": 0 }], "seed": 1 }
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
const WELL_SPECS = (Array.isArray(RUN?.wells) && RUN.wells.length ? RUN.wells : QM.DEFAULT_WELLS).slice(0, 8).map((w, i) => ({
  name: String(w.name ?? `Giếng ${i + 1}`).slice(0, 12),
  n0: Math.max(0, Number(w.n0) || 0),
  eff: w.eff == null ? 0.95 : Number(w.eff),
  tm: w.tm == null ? undefined : Number(w.tm),
  dimer: w.dimer,
}));
const PLATE = QM.runPlate(WELL_SPECS, { seed: Number(RUN?.seed) || 1 });
const WELLS = PLATE.wells;
// Đường chuẩn chỉ có nghĩa khi có ít nhất 3 giếng biết số bản (dãy pha loãng)
const CURVE = WELLS.filter((w) => w.n0 > 0 && w.ct != null).length >= 3 ? PLATE.curve : null;
const CYCLES = QM.QPCR.cycles;
const YMAX = Math.max(1000, ...WELLS.map((w) => Math.max(...w.sub))) * 1.12;
const DMAX = Math.max(50, ...WELLS.flatMap((w) => w.melt.map((p) => p.dF))) * 1.15;
const MELT = QM.QPCR.melt;

const el = {
  closed: $('[data-slot="closed"]'),
  open: $('[data-slot="open"]'),
  blades: $('[data-part="blades"]'),
  power: $('[data-part="power"]'),
  heat: (name) => $$(`[data-heat="${name}"]`),
  status: $('[data-part="status"]'),
  cycle: $('[data-part="cycle"]'),
  temp: $('[data-part="temp"]'),
  foot: $('[data-part="foot"]'),
  curves: $('[data-part="curves"]'),
  marks: $('[data-part="marks"]'),
  thresh: $('[data-part="threshold"]'),
  xlabel: $('[data-part="xlabel"]'),
  axis: $$("[data-axis]"),
  names: $$("[data-wname]"),
  cts: $$("[data-ct]"),
  keys: $$("[data-row]"),
  ctHead: [...svgEl.querySelectorAll(".qp-small")].find((t) => t.textContent === "Ct"),
};
const blockHeat = el.heat("block");
const sinkHeat = el.heat("sink");

// Đường cong và dấu Ct của từng giếng trên màn hình
el.curves.innerHTML = WELLS.map((_, i) => `<path class="qp-curve" data-c="${i}" d=""/>`).join("");
el.marks.innerHTML = WELLS.map((_, i) => `<circle class="qp-ctmark" data-c="${i}" r="0.8" cx="0" cy="0" style="display:none"/>`).join("");
const curvePaths = [...el.curves.children];
const ctMarks = [...el.marks.children];
el.keys.forEach((g, i) => { g.style.display = i < WELLS.length ? "" : "none"; });
WELLS.forEach((w, i) => { el.names[i].textContent = w.name; });

const SPEEDS = [60, 120, 240, 480, 960];
const TOUR_SPEED = 2;
const READ_WALL = 0.75; // giây trên màn hình cho một lần đọc đĩa ở tốc độ mặc định
const LID_OPEN = D.lidOpen;
const ROOM = QM.QPCR.room;
const PL = D.plot;
const HOME = D.lid.home;

const state = {
  lid: { x: 0, v: 0, target: 0 },
  run: false,
  done: false,
  t: 0,
  speed: TOUR_SPEED,
  idleT: ROOM,
  fan: 0,
  sinkHeat: 0,
  lidHeat: 0,
  blink: 0,
  clock: 0,
  pos: { ...HOME },
  passed: WELLS.map(() => -10), // thời điểm (đồng hồ trang) đầu quang học vừa đọc qua giếng
  level: WELLS.map(() => 0),
};
let lidDrawn = null;
let shuttleDrawn = "";
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches;
let tour = { step: "wait", wait: 1.6 };
let idleTimer = 0;
let lastPhase = "";
let lastCycle = -1;

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const decimal = (v, d = 1) => v.toFixed(d).replace(".", ",");
const lidClosed = () => state.lid.x < 1e-3 && state.lid.target === 0;
const lidOpen = () => state.lid.x > LID_OPEN - 1e-3;

// Nắp: lò xo giảm chấn tới hạn theo góc, vẽ lại vào đúng chỗ trong thứ tự vẽ; chốt khi gần đóng hẳn.
function drawLid() {
  const th = state.lid.x;
  const key = th.toFixed(4);
  if (key === lidDrawn) return;
  lidDrawn = key;
  shuttleDrawn = "";
  const markup = LIDM.svg(th, th === 0 ? state.pos : HOME);
  if (th > D.flip) { el.open.innerHTML = markup; el.closed.innerHTML = ""; }
  else { el.closed.innerHTML = markup; el.open.innerHTML = ""; }
}
function stepLid(dt, calm) {
  const L = state.lid;
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const w = 1 / 0.32;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.min(LID_OPEN, Math.max(0, L.x));
  if (Math.abs(L.target - L.x) < 2e-3 && Math.abs(L.v) < 2e-2) { L.x = L.target; L.v = 0; return false; }
  return true;
}

// Trạng thái block: theo chương trình khi chạy, trôi về nhiệt độ phòng khi tắt.
function blockNow() {
  if (state.run || state.done || state.t > 0) return QM.stateAt(state.t);
  return { T: state.idleT, rate: 0, seg: null, cycle: 0, ramping: false, reading: false, readFrac: 0, reads: 0, meltReads: 0, left: QM.RUN_SECONDS, done: false, melting: false };
}

function tint(list, amt, which) {
  const value = `${(amt * 100).toFixed(1)}%`;
  for (const node of list) {
    node.style.setProperty("--amt", value);
    node.style.setProperty("--tint", which);
  }
}

// Đầu quang học: quét rắn bò khi đọc (lượt chẵn đi, lượt lẻ về), quét liên tục khi nóng chảy, về chỗ đỗ khi chờ.
function shuttleTarget(s) {
  if (s.reading && s.seg.kind === "cycle") {
    const f = s.readFrac;
    return QM.scanAt(s.reads % 2 === 0 ? f : 1 - f);
  }
  if (s.melting && state.run) {
    const f = (state.clock / 1.8) % 2;
    return QM.scanAt(f < 1 ? f : 2 - f);
  }
  if (s.reads % 2 === 1 && !s.done && (state.run || state.t > 0)) return QM.scanAt(1);
  return HOME;
}
function stepShuttle(s, dt, calm) {
  const target = shuttleTarget(s);
  const p = state.pos;
  if (calm || s.reading || (s.melting && state.run)) { p.col = target.col; p.row = target.row; }
  else {
    const a = 1 - Math.exp(-dt / 0.12);
    p.col += (target.col - p.col) * a;
    p.row += (target.row - p.row) * a;
    if (Math.abs(target.col - p.col) < 1e-3 && Math.abs(target.row - p.row) < 1e-3) { p.col = target.col; p.row = target.row; }
  }
  // Giếng mẫu nằm ở cột 1, hàng A trở đi: ghi lại lúc đầu quang học đi qua
  if (s.reading || (s.melting && state.run)) {
    WELLS.forEach((w, i) => {
      if (Math.abs(p.col) < 0.5 && Math.abs(p.row - i) < 0.5) {
        state.passed[i] = state.clock;
        const c = Math.max(1, Math.min(CYCLES, s.reads + (s.melting ? 0 : 1)));
        const melt = s.melting ? w.melt[Math.min(w.melt.length - 1, s.meltReads)] : null;
        const sig = melt ? Math.max(0, melt.F - 60) : Math.max(0, w.sub[c]);
        state.level[i] = Math.min(1, sig / 3000);
      }
    });
  }
  const key = `${p.col.toFixed(3)},${p.row.toFixed(3)}`;
  if (state.lid.x === 0 && key !== shuttleDrawn) {
    shuttleDrawn = key;
    const m = LIDM.live(0, p);
    const sh = el.closed.querySelector('[data-live="shuttle"]');
    const arm = el.closed.querySelector('[data-live="arm"]');
    if (sh) sh.innerHTML = m.shuttle;
    if (arm) arm.innerHTML = m.arm;
  }
}
function drawGlow(calm) {
  const g = el.closed.querySelector('[data-live="glow"]');
  if (!g) return;
  const list = [];
  WELLS.forEach((w, i) => {
    const age = state.clock - state.passed[i];
    const a = calm ? 0 : state.level[i] * Math.max(0, 1 - age / 1.1) * Math.min(1, age / 0.06 + 0.2);
    if (a > 0.02) list.push({ col: 0, row: i, a });
  });
  const markup = LIDM.glow(list);
  if (g.innerHTML !== markup) g.innerHTML = markup;
}

const xOfCycle = (c) => PL.u0 + (c / CYCLES) * (PL.u1 - PL.u0);
const xOfT = (T) => PL.u0 + ((T - MELT.from) / (MELT.to - MELT.from)) * (PL.u1 - PL.u0);
const yOf = (v, max) => PL.w1 - Math.max(-0.03, Math.min(1.02, v / max)) * (PL.w1 - PL.w0);
const AXIS_AMP = ["0", "10", "20", "30", "40"];
const AXIS_MELT = ["65", "72", "80", "87", "95"];
let mode = "";

function drawScreen(s) {
  const running = (state.run || (still.matches && state.t > 0)) && !s.done;
  const melt = s.melting || s.done;
  el.status.textContent = s.done ? "XONG" : running ? (s.reading ? "ĐỌC ĐĨA" : melt ? "NÓNG CHẢY" : "ĐANG CHẠY") : state.t > 0 ? "TẠM DỪNG" : lidClosed() ? "SẴN SÀNG" : "NẮP MỞ";
  el.cycle.textContent = melt ? `đọc ${s.done ? WELLS[0].melt.length : s.meltReads}/${WELLS[0].melt.length}` : `${s.cycle}/${CYCLES}`;
  el.temp.textContent = `${decimal(s.T)}°C`;
  const left = QM.fmtTime(s.left);
  if (s.done && CURVE) el.foot.textContent = `E ${decimal(CURVE.eff * 100)} % · R² ${CURVE.r2.toFixed(4).replace(".", ",")} · độ dốc ${decimal(CURVE.slope, 2)}`;
  else el.foot.textContent = `SYBR Green · kênh 1 · ×${SPEEDS[state.speed]} · còn ${left}`;
  const m = melt ? "melt" : "amp";
  if (m !== mode) {
    mode = m;
    el.axis.forEach((t, i) => { t.textContent = (melt ? AXIS_MELT : AXIS_AMP)[i]; });
    el.xlabel.textContent = melt ? "−dF/dT" : "RFU";
    el.thresh.style.display = melt ? "none" : "";
    if (el.ctHead) el.ctHead.textContent = melt ? "Tm" : "Ct";
  }
  if (!melt) {
    const n = s.reads;
    el.thresh.setAttribute("d", `M${PL.u0} ${yOf(PLATE.threshold, YMAX).toFixed(2)}H${PL.u1}`);
    WELLS.forEach((w, i) => {
      const pts = [];
      for (let c = 1; c <= n; c++) pts.push(`${xOfCycle(c).toFixed(2)} ${yOf(w.sub[c], YMAX).toFixed(2)}`);
      curvePaths[i].setAttribute("d", pts.length > 1 ? `M${pts.join("L")}` : "");
      const crossed = w.ct != null && n >= Math.ceil(w.ct);
      ctMarks[i].style.display = crossed ? "" : "none";
      if (crossed) { ctMarks[i].setAttribute("cx", xOfCycle(w.ct).toFixed(2)); ctMarks[i].setAttribute("cy", yOf(PLATE.threshold, YMAX).toFixed(2)); }
      el.cts[i].textContent = crossed ? QM.fmtCt(w.ct) : n >= CYCLES ? "—" : "";
    });
  } else {
    const n = s.done ? WELLS[0].melt.length : Math.min(WELLS[0].melt.length, s.meltReads);
    WELLS.forEach((w, i) => {
      const pts = [];
      for (let j = 0; j < n; j++) pts.push(`${xOfT(w.melt[j].T).toFixed(2)} ${yOf(w.melt[j].dF, DMAX).toFixed(2)}`);
      curvePaths[i].setAttribute("d", pts.length > 1 ? `M${pts.join("L")}` : "");
      const peak = w.peaks[0];
      const shown = peak && n > (peak.T - MELT.from) / MELT.step + 2;
      ctMarks[i].style.display = shown ? "" : "none";
      if (shown) { ctMarks[i].setAttribute("cx", xOfT(peak.T).toFixed(2)); ctMarks[i].setAttribute("cy", yOf(peak.h, DMAX).toFixed(2)); }
      el.cts[i].textContent = shown ? `${decimal(peak.T)}°` : s.done ? "—" : "";
    });
  }
}

function drawReadout(s) {
  const crossed = WELLS.filter((w) => w.ct != null && s.reads >= Math.ceil(w.ct)).length;
  let text;
  if (s.done) {
    const ntc = WELLS.find((w) => !(w.n0 > 0));
    const dimer = ntc && ntc.peaks[0] ? ` · ${ntc.name}: đỉnh ${decimal(ntc.peaks[0].T)} °C` : "";
    text = CURVE ? `xong · E ${decimal(CURVE.eff * 100)} % · R² ${CURVE.r2.toFixed(4).replace(".", ",")}${dimer}` : `xong · Ct ${WELLS[0].name} = ${QM.fmtCt(WELLS[0].ct)}${dimer}`;
  } else if (s.melting) text = `nóng chảy · ${decimal(s.T)} °C · đọc ${s.meltReads + 1}/${WELLS[0].melt.length}`;
  else if (state.run || state.t > 0) text = `${s.reading ? "đọc đĩa · " : ""}chu kỳ ${s.cycle}/${CYCLES} · ${decimal(s.T)} °C · ${crossed}/${WELLS.length} giếng vượt ngưỡng`;
  else text = lidOpen() ? "nắp mở · 40 chu kỳ · SYBR Green" : state.lid.target === 0 && lidClosed() ? "sẵn sàng · 40 chu kỳ · SYBR Green" : "đang đóng mở nắp";
  if (readout.textContent !== text) readout.textContent = text;
  const phase = s.done ? "Xong: đường chuẩn và đường nóng chảy đã có." : s.melting ? "Đường nóng chảy: 65 → 95 °C." : state.run && s.cycle > 0 ? `Chu kỳ ${s.cycle}` : "";
  if (phase && phase !== lastPhase && (s.cycle !== lastCycle || s.done || s.melting)) { lastPhase = phase; lastCycle = s.cycle; say(phase); }
}

function draw(dt, calm) {
  drawLid();
  const s = blockNow();
  if (s.T >= ROOM) tint(blockHeat, Math.min(1, (s.T - ROOM) / 70) * 0.6, "var(--qp-hot)");
  else tint(blockHeat, Math.min(1, (ROOM - s.T) / 21) * 0.55, "var(--qp-cold)");
  const load = state.run && s.rate < 0 ? 1 : state.run && s.T > 60 ? 0.25 : 0.06;
  state.sinkHeat = calm ? load : state.sinkHeat + (load - state.sinkHeat) * (1 - Math.exp(-dt / 0.6));
  tint(sinkHeat, state.sinkHeat * 0.5, "var(--qp-hot)");
  const lidTarget = state.run ? 1 : 0;
  state.lidHeat = calm ? lidTarget : state.lidHeat + (lidTarget - state.lidHeat) * (1 - Math.exp(-dt / 1.2));
  tint(el.heat("lid"), state.lidHeat * 0.12, "var(--qp-hot)");
  if (!calm) {
    state.fan = (state.fan + dt * (3 + 15 * state.sinkHeat)) % (Math.PI * 2);
    el.blades.setAttribute("transform", `rotate(${((state.fan * 180) / Math.PI).toFixed(1)})`);
  }
  if (state.lid.x === 0) stepShuttle(s, dt, calm);
  drawGlow(calm);
  const reading = state.run && (s.reading || s.melting);
  if (reading) machine.setAttribute("data-reading", ""); else machine.removeAttribute("data-reading");
  state.blink = (state.blink + dt) % 1.2;
  const led = $('[data-part="led"]');
  const on = state.run && !s.done ? "1" : calm || state.blink < 0.7 ? "1" : "0.2";
  if (led) led.style.opacity = on;
  el.power.style.opacity = "1";
  drawScreen(s);
  drawReadout(s);
}

function setRun(on) {
  if (on && !lidClosed()) { state.lid.target = 0; state.arm = true; say("Đóng nắp trước khi chạy."); return; }
  if (on && state.done) { state.t = 0; state.done = false; lastCycle = -1; }
  state.run = on;
  if (on) say("Bắt đầu chạy: nắp gia nhiệt lên 105 °C, hoạt hoá polymerase 95 °C.");
  else say(state.t > 0 ? "Tạm dừng." : "Dừng.");
}
function stopAll() {
  const s = blockNow();
  state.idleT = s.T;
  state.run = false;
  state.done = false;
  state.t = 0;
  lastCycle = -1;
  lastPhase = "";
}
function toggleLid() {
  if (state.run) { say("Đang chạy: dừng chương trình trước khi mở nắp."); return; }
  if (state.lid.target === 0 && (state.pos.col !== HOME.col || state.pos.row !== HOME.row)) { state.pos = { ...HOME }; shuttleDrawn = ""; }
  state.lid.target = state.lid.target > 0 ? 0 : LID_OPEN;
  say(state.lid.target > 0 ? "Mở nắp: đầu quang học về chỗ đỗ." : "Đóng nắp.");
}

function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "wait") { state.lid.target = 0; tour = { step: "closing", wait: 0.3 }; }
  else if (tour.step === "closing") { if (lidClosed()) { state.speed = TOUR_SPEED; setRun(true); tour = { step: "running", wait: 0 }; } }
  else if (tour.step === "running") { if (state.done) tour = { step: "hold", wait: 3.4 }; }
  else if (tour.step === "hold") { stopAll(); tour = { step: "parking", wait: 0.6 }; }
  else if (tour.step === "parking") { toggleLid(); tour = { step: "rest", wait: 2.6 }; }
  else if (tour.step === "rest") tour = { step: "wait", wait: 0.2 };
}

function advance(dt) {
  const s = QM.stateAt(state.t);
  let rate = SPEEDS[state.speed];
  // Chậm lại khi đọc đĩa để thấy đầu quang học quét (thời gian đọc thật 3 s).
  if (s.reading && s.seg.kind === "cycle") rate = Math.min(rate, s.seg.read / (READ_WALL * Math.sqrt(SPEEDS[TOUR_SPEED] / SPEEDS[state.speed])));
  if (s.melting) rate = Math.min(rate, 60);
  state.t += dt * rate;
  if (state.t >= QM.RUN_SECONDS) { state.t = QM.RUN_SECONDS + 1; state.done = true; state.run = false; }
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  state.clock += dt;
  if (touring && !calm) tourStep(dt);
  const lidMoving = stepLid(dt, calm);
  if (state.arm && lidClosed()) { state.arm = false; setRun(true); }
  if (state.run) advance(dt);
  else if (!state.done && state.t === 0) state.idleT = calm ? ROOM : state.idleT + (ROOM - state.idleT) * (1 - Math.exp(-dt / 1.5));
  draw(dt, calm);
  const busy = !calm || lidMoving;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 1.6 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || state.run) return; touring = true; tour = { step: "wait", wait: 0.6 }; run(); }, 9000);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (key === " " || key === "Enter" || key === "Escape" || key.startsWith("Arrow")) event.preventDefault();
  else return;
  takeOver();
  if (key === " ") setRun(!state.run);
  else if (key === "Enter") toggleLid();
  else if (key === "Escape") { stopAll(); say("Dừng và đặt lại."); }
  else if (key === "ArrowRight" || key === "ArrowUp") state.speed = Math.min(SPEEDS.length - 1, state.speed + 1);
  else if (key === "ArrowLeft" || key === "ArrowDown") state.speed = Math.max(0, state.speed - 1);
  // Giảm chuyển động: mỗi lần Space nhảy tới lần đọc kế tiếp sau 5 chu kỳ, rồi tới kết quả cuối.
  if (still.matches && key === " " && state.run) {
    const segs = QM.runTimeline();
    const s = QM.stateAt(state.t);
    const next = segs.find((g) => g.kind === "cycle" && g.read > 0 && g.cycle >= s.cycle + 5);
    state.t = next ? next.t1 + 0.01 : QM.RUN_SECONDS + 1;
    if (!next) state.done = true;
    state.run = false;
  }
  draw(1 / 60, still.matches);
  run();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest("[data-slot]")) toggleLid();
  else setRun(!state.run);
  stage.focus({ preventScroll: true });
  run();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) {
  // Giảm chuyển động: một khung tiêu biểu (nắp đóng, vừa đọc xong chu kỳ 30: bốn giếng đã vượt ngưỡng).
  state.lid = { x: 0, v: 0, target: 0 };
  state.run = false;
  const seg = QM.runTimeline().find((g) => g.kind === "cycle" && g.cycle === 30 && g.read > 0);
  state.t = seg.t1 + 0.01;
  state.pos = QM.scanAt(1);
}
draw(1 / 60, still.matches);
</script></body></html>
