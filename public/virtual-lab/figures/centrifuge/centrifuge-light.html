<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Máy ly tâm</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình máy ly tâm. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt --blur (0–1) trên rotor khi quay nhanh, data-on trên đèn phím open, data-trip trên công tắc lệch tâm. */
.iso {
  --cf-cav-top: #1a1d20;
  --cf-cav-0: #101214;
  --cf-cav-1: #141618;
  --cf-cav-2: #181b1d;
  --cf-cav-3: #1c1f22;
  --cf-void: #07090a;
  --cf-steel-top: #23272a;
  --cf-hollow: #161819;
  --cf-glass: #1d2a33;
  --cf-glint: #6f8796;
  --cf-rlid: #9fb6c4;
  --cf-screw: #d2453a;
  --cf-rubber: #0d0d0d;
  --cf-pcb: #1f4d34;
  --cf-switch: #2a2f6b;
  --cf-trip: #ff5a3c;
  --cf-blur: #7a7f83;
  --cf-lcd-bg: #0d1a14;
  --cf-lcd-ink: #b9f3cf;
  --cf-lcd-dim: #5f8f72;
  --cf-lcd-err: #ff7a5c;
  --cf-bezel: #0f1112;
  --cf-led-off: #2b3134;
  --cf-led: #4aa8ff;
  --cf-start: #3a8f5c;
}
.iso[data-theme="light"] {
  --cf-cav-top: #c7cbce;
  --cf-cav-0: #b3b8bc;
  --cf-cav-1: #bbc0c4;
  --cf-cav-2: #c2c7cb;
  --cf-cav-3: #cacfd2;
  --cf-void: #5b6266;
  --cf-steel-top: #e4e7e9;
  --cf-hollow: #d3d7da;
  --cf-glass: #3b4a55;
  --cf-glint: #c5d6e0;
  --cf-rlid: #7fa3b9;
  --cf-screw: #d63a2c;
  --cf-rubber: #4a4d50;
  --cf-pcb: #3f8a59;
  --cf-switch: #3d47a8;
  --cf-trip: #e63b1d;
  --cf-blur: #6d7378;
  --cf-lcd-bg: #12231a;
  --cf-lcd-ink: #c6f7d8;
  --cf-lcd-dim: #6f9b80;
  --cf-lcd-err: #ff8466;
  --cf-bezel: #3b4044;
  --cf-led-off: #b8c0c4;
  --cf-led: #1f7fe0;
  --cf-start: #2f9b5c;
}

/* Lòng phễu của rotor: tông tối riêng */
.cf-cavity .iso-fill { fill: var(--cf-cav-0); }
.cf-cavity .iso-top { fill: var(--cf-cav-top); }
.cf-cavity .iso-shade[data-shade="0"] { fill: var(--cf-cav-0); stroke: var(--cf-cav-0); stroke-width: 0.4px; }
.cf-cavity .iso-shade[data-shade="1"] { fill: var(--cf-cav-1); stroke: var(--cf-cav-1); stroke-width: 0.4px; }
.cf-cavity .iso-shade[data-shade="2"] { fill: var(--cf-cav-2); stroke: var(--cf-cav-2); stroke-width: 0.4px; }
.cf-cavity .iso-shade[data-shade="3"] { fill: var(--cf-cav-3); stroke: var(--cf-cav-3); stroke-width: 0.4px; }
.cf-bore { fill: var(--cf-void); }
.cf-tube { opacity: calc(1 - var(--blur, 0) * 0.85); }
[data-live="bores"], [data-live="ticks"] { opacity: calc(1 - var(--blur, 0) * 0.9); }
[data-live="blur"] { opacity: calc(var(--blur, 0) * 0.55) !important; }
[data-live="ring"] { opacity: var(--blur, 0) !important; }
.cf-blur { fill: var(--cf-blur); }

/* Nắp rotor kín khí dung: vẽ trong mờ để thấy ống bên dưới */
.cf-screw .iso-top, .cf-screw .iso-shade { fill: color-mix(in oklab, var(--cf-screw) 80%, var(--anatomy-shade-1)); stroke: none; }

/* Thép không gỉ của buồng ly tâm, cao su đệm, bo mạch, công tắc */
.cf-steel .iso-top { fill: var(--cf-steel-top); }
.cf-rubber .iso-top, .cf-rubber .iso-shade { fill: color-mix(in oklab, var(--cf-rubber) 70%, var(--anatomy-shade-0)); stroke: none; }
.cf-pcb .iso-top, .cf-pcb .iso-shade { fill: color-mix(in oklab, var(--cf-pcb) 55%, var(--anatomy-shade-0)); stroke: none; }
.cf-switch .iso-top, .cf-switch .iso-shade { fill: color-mix(in oklab, var(--cf-switch) 60%, var(--anatomy-shade-1)); stroke: none; transition: fill 0.25s var(--anatomy-ease); }
.cf-switch[data-trip] .iso-top, .cf-switch[data-trip] .iso-shade { fill: var(--cf-trip); }
.cf-start .iso-top, .cf-start .iso-shade { fill: color-mix(in oklab, var(--cf-start) 70%, var(--anatomy-shade-1)); stroke: none; }

/* Mặt cắt nắp máy: phần rỗng trong vỏ nhựa */
.cf-hollow { fill: var(--cf-hollow); }
.cf-window { fill: var(--cf-glass); fill-opacity: 0.85; }
.cf-glint { fill: var(--cf-glint); opacity: 0.35; }
.cf-slot { fill: var(--anatomy-shade-0); }

/* Màn hình LCD */
.cf-glass { fill: var(--cf-lcd-bg); }
.cf-bezel { fill: var(--cf-bezel); fill-rule: evenodd; }
.cf-txt, .cf-big, .cf-dim { font-family: var(--anatomy-mono); fill: var(--cf-lcd-ink); }
.cf-big { font-weight: 500; }
.cf-dim { fill: var(--cf-lcd-dim); }
[data-error] .cf-txt[data-part="status"], [data-error] .cf-big[data-part="speed"] { fill: var(--cf-lcd-err); }
.cf-bar-bg { fill: var(--cf-lcd-dim); opacity: 0.3; }
.cf-bar { fill: var(--cf-lcd-ink); }
.cf-lock-body { fill: var(--cf-lcd-ink); }
.cf-lock-arc { fill: none; stroke: var(--cf-lcd-ink); stroke-width: 0.9; }
.cf-ring { fill: none; stroke: var(--cf-led-off); stroke-width: 1.1; transition: stroke 0.25s var(--anatomy-ease); }
.cf-ring[data-on] { stroke: var(--cf-led); }

.cf-stage { touch-action: pan-y; cursor: pointer; }
.cf-stage:focus { outline: none; }
.cf-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.cf-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[data-shake] { transform: translate(var(--sx, 0px), var(--sy, 0px)); }
.cf-rlid-fill { fill: var(--cf-rlid); fill-opacity: 0.16; }
.cf-shine { fill: none; stroke: var(--anatomy-lit); stroke-width: 1.2px; vector-effect: non-scaling-stroke; stroke-linecap: round; opacity: 0.55; }
.cf-lock [data-part="shackle"] { transition: transform 0.2s var(--anatomy-ease); }

hút khoá nắp và bo mạch vẽ theo cấu tạo điển hình, không theo sơ đồ của hãng.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

        upper.push(point);
    }

function runsOf(flags, want) {
    const count = flags.length;

function extrude(ring, z, height, projection, options = {}) {

    const count = ring.length;
    const counter = signedArea(ring) > 0;

    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];

    const y = a[1] + b[1];

function sideOf(meridian) {

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const top = aV > 0 ? facing + Math.PI : facing;

  const R = right.map((point) => iso(point, P));

  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";

    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  const tones = [];
  for (let j = 0; j < n; j++) {

    tones.push(bandOf(dot3(normal, L)));

  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {

    buckets[key].push(d);
    fills.push(d);

    fills.push(d);

function prismOf(F, polygon, s0, s1, P) {

  const HOLLOW = rounded(D.rear + D.wall, D.front - D.wall, D.bottom + 0.01, D.top - D.wall, D.radii.map((r) => Math.max(0.5, r - D.wall)), 9).filter(([, z]) => z > D.bottom + 0.005);
  const HOOK = [[D.hook.y0, D.bottom + 0.4], [D.hook.y1, D.bottom + 0.4], [D.hook.y1, D.hook.z0], [D.hook.y0, D.hook.z0]];
  // Răng ở chân móc chĩa về phía sau (−y'); chốt của cuộn hút đẩy dọc +y qua phía trên răng
  const TOOTH = [[D.hook.y0 - D.hook.reach, D.hook.z0 + D.hook.tooth], [D.hook.y0, D.hook.z0 + D.hook.tooth], [D.hook.y0, D.hook.z0], [D.hook.y0 - D.hook.reach, D.hook.z0]];
  const ARM = [[-0.4, -1.8], [D.rear + 0.6, -1.8], [D.rear + 0.6, 1.8], [-0.4, 1.8]];

  const frameAt = (theta) => {
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    return G.frameOf(H, [1, 0, 0], [0, c, s], [0, -s, c]);
  };
  const local = (F, x, y, z) => G.add3(G.add3(G.add3(F.o, G.mul3(F.a, x)), G.mul3(F.u, y)), G.mul3(F.v, z));
  const path3 = (F, pts, closed = false) => k.pathOf(pts.map(([x, y, z]) => at(local(F, x, y, z))), closed);
  const HF = G.frameOf(H, [1, 0, 0], [0, 1, 0], [0, 0, 1]);

  const topVisible = (theta) => G.dot3(frameAt(theta).v, V) > 0;
  const underVisible = (theta) => !topVisible(theta);
  const cutVisible = G.dot3([1, 0, 0], V) > 0;

  // Cửa sổ quan sát tròn trên mặt nắp (nhìn rotor đã dừng hẳn chưa)
  const W = D.window;
  const circle = (cx, cy, r, z, n = 48) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos((i / n) * 2 * Math.PI), cy + r * Math.sin((i / n) * 2 * Math.PI), z]);
  const windowSvg = (F) =>
    `<path class="cf-window" d="${path3(F, circle(W.x, W.y, W.r, D.top), true)}"/>` +
    Ln(path3(F, circle(W.x, W.y, W.r, D.top), true), { tone: "lo" }) +
    Ln(path3(F, circle(W.x, W.y, W.r + 3.2, D.top), true), { tone: "faint" }) +
    `<path class="cf-glint" d="${path3(F, [[W.x - W.r * 0.5, W.y - W.r * 0.25, D.top], [W.x - W.r * 0.1, W.y - W.r * 0.62, D.top], [W.x + W.r * 0.06, W.y - W.r * 0.5, D.top], [W.x - W.r * 0.34, W.y - W.r * 0.12, D.top]], true)}"/>`;
  // Đường viền lõm trên mặt nắp, ô gờ chỗ ngón tay ở mép trước
  const insetTop = (F) => {
    const ya = D.rear + 30;
    const yb = D.front - 44;
    const xl = D.x0 + 12;
    const r = 8;
    const pts = [[D.cut, ya]];
    for (let i = 0; i <= 6; i++) { const a = -Math.PI / 2 - (i / 6) * (Math.PI / 2); pts.push([xl + r + r * Math.cos(a), ya + r + r * Math.sin(a)]); }
    for (let i = 0; i <= 6; i++) { const a = Math.PI - (i / 6) * (Math.PI / 2); pts.push([xl + r + r * Math.cos(a), yb - r + r * Math.sin(a)]); }
    pts.push([D.cut, yb]);
    return path3(F, pts.map(([x, y]) => [x, y, D.top]));
  };
  // Mặt cắt: phần rỗng bên trong vỏ nắp, vẽ trên mặt đầu x = D.cut
  const sectionSvg = (F) =>
    cutVisible ? `<path class="cf-hollow" d="${path3(F, HOLLOW.map(([y, z]) => [D.cut, y, z]), true)}"/>` + Ln(path3(F, HOLLOW.map(([y, z]) => [D.cut, y, z]), true), { tone: "faint" }) : "";

  // which: "all" (cả nắp), "body" (vỏ, bản lề), "hook" (thanh móc), "tooth" (răng móc) — khi nắp đóng, móc nằm trong khe dưới mặt thân nên vẽ ở chỗ riêng.
  function svg(theta, which = "all") {
    const F = frameAt(theta);
    const prism = (poly, x0, x1) => G.prismOf(F, poly, x0, x1, P);
    const knuckles = D.knuckles.map(([x0, x1]) => S(G.disc(x0, x1, D.knuckleR, HF, P, { steps: 28 }), { tone: "mid" })).join("");
    const arms = D.knuckles.map(([x0, x1]) => S(prism(ARM, x0, x1), { tone: "mid" })).join("");
    const bar = S(prism(HOOK, D.hook.x0, D.hook.x1), { tone: "mid" });
    const tooth = S(prism(TOOTH, D.hook.x0, D.hook.x1), { tone: "mid" });
    const hook = tooth + bar;
    const top = topVisible(theta) ? Ln(insetTop(F), { tone: "faint" }) + windowSvg(F) : "";
    const shell = S(prism(SHELL, D.x0, D.cut), { tone: "hi" });
    const section = `<g class="cf-section">${sectionSvg(F)}</g>`;
    if (which === "hook") return bar;
    if (which === "tooth") return tooth;
    if (which === "body") return knuckles + arms + shell + section + top;
    if (underVisible(theta)) return knuckles + arms + shell + section + hook;
    return knuckles + arms + hook + shell + section + top;
  }

  function shapes(theta, A, which = "all") {
    const F = frameAt(theta);
    const meta = (name) => ({ name, owner: "lid" });
    const hook = [A.prism(F, HOOK, D.hook.x0, D.hook.x1, meta("lid.hook")), A.prism(F, TOOTH, D.hook.x0, D.hook.x1, meta("lid.tooth"))];
    if (which === "hook") return hook.slice(0, 1);
    if (which === "tooth") return hook.slice(1);
    return [
      A.prism(F, SHELL, D.x0, D.cut, meta("lid.shell")),
      ...(which === "all" ? hook : []),
      ...D.knuckles.map(([x0, x1], i) => A.disc(HF, x0, x1, D.knuckleR, meta(`lid.knuckle${i}`))),
      ...D.knuckles.map(([x0, x1], i) => A.prism(F, ARM, x0, x1, meta(`lid.arm${i}`))),
    ];
  }

  // Góc mà mặt nắp nằm dọc theo tia nhìn: dưới góc này nắp phủ lên thân, trên góc này thân phủ lên nắp.
  const flip = Math.atan2(V[2], V[1]);
  return { svg, shapes, topVisible, flip, frameAt };
}
// Rotor góc cố định 24 lỗ (theo dáng Eppendorf FA-24×2) và nắp rotor kín khí dung.
// Dùng chung cho bản dựng (Node: phần tĩnh và hình dạng cho kiểm tra) và trang (dựng lại lỗ, ống, vạch vành mỗi khung).
// Lỗ nghiêng 45°: đáy ống ở bán kính r_max = 84 mm, miệng lỗ nằm trên mặt phễu, nắp ống chúc vào trong.
// Rotor quay theo chiều kim đồng hồ nhìn từ trên.

function makeRotor(k, G, P, D) {
  const V = G.viewOf(P);
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);
  const { cx, cy, z0 } = D;
  const UPF = G.frameOf([cx, cy, z0], [0, 0, 1], [1, 0, 0], [0, 1, 0]);
  const R = D.r; // bán kính ngoài 88
  const RIM = D.rim; // độ cao vành (s)
  const IN = D.inner; // bán kính trong của vành 84
  const FUN = D.funnel; // { r0, s0 } đáy phễu
  const MOUTH = D.mouth; // { r, s } tâm miệng lỗ
  const C45 = Math.SQRT1_2;
  const UP = [0, 0, 1];
  const radial = (phi) => [Math.cos(phi), Math.sin(phi), 0];
  const tangential = (phi) => [-Math.sin(phi), Math.cos(phi), 0];
  const P3 = (r, s, phi) => [cx + r * Math.cos(phi), cy + r * Math.sin(phi), z0 + s];
  const f2 = (v) => Math.round(v * 100) / 100;

  // ——— Phần tĩnh ———
  // Mặt trong phễu: chỉ các mặt nhỏ nhìn thấy (phía xa), tô theo hướng sáng.
  function funnelSvg() {
    const n = 120;
    const buckets = [[], [], [], []];
    const fill = [];
    const ds = RIM - FUN.s0;
    const dr = IN - FUN.r0;
    const len = Math.hypot(ds, dr);
    for (let j = 0; j < n; j++) {
      const a0 = (j / n) * 2 * Math.PI;
      const a1 = ((j + 1) / n) * 2 * Math.PI;
      const am = (a0 + a1) / 2;
      const normal = G.add3(G.mul3(UP, dr / len), G.mul3(radial(am), -ds / len));
      if (G.dot3(normal, V) <= 1e-6) continue;
      const quad = k.pathOf([P3(FUN.r0, FUN.s0, a0), P3(FUN.r0, FUN.s0, a1), P3(IN, RIM, a1), P3(IN, RIM, a0)].map(at), true);
      fill.push(quad);
      buckets[Math.min(3, G.toneOf(normal, P))].push(quad);
    }
    const floor = k.pathOf(Array.from({ length: 72 }, (_, i) => at(P3(FUN.r0, FUN.s0, (i / 72) * 2 * Math.PI))), true);
    return (
      `<g class="cf-cavity"><path class="iso-fill" d="${fill.join("")}"/>` +
      buckets.map((list, i) => (list.length ? `<path class="iso-shade" data-shade="${i}" d="${list.join("")}"/>` : "")).join("") +
      `<path class="iso-top" d="${floor}"/></g>` +
      Ln(floor, { tone: "faint" })
    );
  }
  const drumMeridian = [[0, 0], [0, R - 3], [3, R], [RIM, R], [RIM, IN]];
  // Thân rotor: mặt trụ ngoài và mặt vành; phần tô và mặt vành đều khoét miệng phễu (even-odd).
  function drumSvg() {
    const paths = G.lathe([...drumMeridian.slice(0, 4), [RIM, 0]], UPF, P);
    const ring = (r) => k.pathOf(Array.from({ length: 120 }, (_, i) => at(P3(r, RIM, (i / 120) * 2 * Math.PI))), true);
    const hole = ring(IN);
    const seam = G.arcOf(UPF, RIM - 12, R, P);
    const parts = [
      `<path class="iso-fill" fill-rule="evenodd" d="${paths.fill}${hole}"/>`,
      ...paths.shades.map((d, i) => (d ? `<path class="iso-shade" data-shade="${i}" d="${d}"/>` : "")),
      `<path class="iso-top" fill-rule="evenodd" d="${ring(R)}${hole}"/>`,
      paths.crease ? `<path class="iso-line iso-crease" data-tone="faint" d="${paths.crease}"/>` : "",
      Ln(seam + G.arcOf(UPF, 9, R, P), { tone: "faint" }),
      `<path class="iso-line iso-edge" data-tone="hi" d="${paths.outline}"/>`,
    ];
    return `<g class="iso-solid cf-alu"${paths.seamless ? " data-seamless" : ""}>${parts.join("")}</g>` + Ln(hole, { tone: "lo" });
  }
  // Trục giữa của rotor và cần vít của nắp rotor (vặn từ núm trên nắp xuống trục)
  const hubSvg = () =>
    S(G.disc(FUN.s0, D.hub.s1, D.hub.r, UPF, P), { tone: "mid", inner: Ln(G.arcOf(UPF, D.hub.s1 - 4, D.hub.r, P), { tone: "faint" }) }) +
    S(G.disc(D.hub.s1, L.s1, D.screw, UPF, P, { steps: 24 }), { tone: "mid", inner: Ln(G.arcOf(UPF, D.hub.s1 + 6, D.screw, P) + G.arcOf(UPF, D.hub.s1 + 9, D.screw, P) + G.arcOf(UPF, D.hub.s1 + 12, D.screw, P), { tone: "faint" }) });

  // Nắp rotor: váy trụ trên vành rồi vòm elip, đỉnh phẳng có núm vặn.
  const L = D.lid;
  const domeR = (s) => R * Math.sqrt(Math.max(0, 1 - ((s - L.s0) / L.h) ** 2));
  const domeSlope = (s) => (-R * (s - L.s0)) / (L.h * L.h * Math.max(1e-6, Math.sqrt(Math.max(1e-9, 1 - ((s - L.s0) / L.h) ** 2))));
  const domeProfile = Array.from({ length: 13 }, (_, i) => {
    const s = L.s0 + ((L.s1 - L.s0) * i) / 12;
    return [s, domeR(s)];
  });
  const lidProfile = [[RIM, R], [L.s0, R], ...domeProfile.slice(1), [L.s1, 0]];
  // Nắp trong mờ: chỉ vẽ phần tô nhạt (bao của các vòng mặt cắt), viền ngoài, đường gioăng ở váy và vòng đỉnh.
  function lidSvg() {
    const ringPts = (r, s, n = 120) => Array.from({ length: n }, (_, i) => at(P3(r, s, (i / n) * 2 * Math.PI)));
    const pts = [...ringPts(R, RIM), ...domeProfile.flatMap(([s, r]) => ringPts(r, s, 72))];
    const hull = k.pathOf(G.hullOf(pts), true);
    const crown = k.pathOf(ringPts(domeR(L.s1), L.s1, 72), true);
    const seal = G.arcOf(UPF, L.s0, R, P);
    const shine = G.arcOf(UPF, L.s0 + 2.2, domeR(L.s0 + 2.2) - 2, P, { from: Math.PI * 0.9, to: Math.PI * 1.35 });
    const knob = G.disc(L.s1, L.s1 + L.knob.h, L.knob.r, UPF, P, { steps: 48, bevel: 0.3 });
    return (
      `<g class="cf-rlid"><path class="cf-rlid-fill" d="${hull}"/>${Ln(seal, { tone: "faint" })}${Ln(crown, { tone: "faint" })}${shine ? `<path class="cf-shine" d="${shine}"/>` : ""}${Ln(hull, { tone: "mid" })}</g>` +
      `<g class="cf-screw">${S(knob, { tone: "mid" })}</g>` +
      Ln(k.knurl(cx, cy, L.knob.r, z0 + L.s1 + 0.3, z0 + L.s1 + L.knob.h - 0.3, 28, P), { tone: "lo" })
    );
  }

  // ——— Phần quay: lỗ, ống, vạch trên vành ———
  // Khung của lỗ thứ i ở góc phi: a ra khỏi mặt phễu (lên và vào trong), u dọc mặt phễu về phía vành, v theo chiều quay.
  const boreFrame = (phi) => {
    const er = radial(phi);
    const a = G.add3(G.mul3(er, -C45), G.mul3(UP, C45));
    const u = G.add3(G.mul3(er, C45), G.mul3(UP, C45));
    return G.frameOf(P3(MOUTH.r, MOUTH.s, phi), a, u, tangential(phi));
  };
  const circle3 = (F, s, r, n = 28) => Array.from({ length: n }, (_, i) => G.pointOf(F, s, r, (i / n) * 2 * Math.PI));
  const TAB = [[D.tube.cap.r - 0.6, -2.4], [D.tube.cap.r + 3.2, -1.7], [D.tube.cap.r + 3.2, 1.7], [D.tube.cap.r - 0.6, 2.4]];
  const T = D.tube;

  function boresSvg(theta, loaded) {
    const voids = [];
    for (let i = 0; i < D.slots; i++) {
      if (loaded.has(i)) continue;
      const F = boreFrame(theta + (i / D.slots) * 2 * Math.PI);
      if (G.dot3(F.a, V) <= 0.02) continue;
      voids.push(k.pathOf(circle3(F, 0.02, T.bore).map(at), true));
    }
    return voids.length ? `<path class="cf-bore" d="${voids.join("")}"/>` + Ln(voids.join(""), { tone: "lo" }) : "";
  }
  function tubeParts(F) {
    return [
      ["collar", G.disc(-0.3, T.collar.h, T.collar.r, F, P, { steps: 28 }), "mid"],
      ["cap", G.disc(T.collar.h, T.collar.h + T.cap.h, T.cap.r, F, P, { steps: 28, bevel: 0.2 }), "hi"],
    ];
  }
  // Ống xếp theo chiều sâu cùng với trục giữa (hub), vì nắp ống ở phía xa nằm sau trục, phía gần nằm trước.
  function tubesSvg(theta, load, hub = "") {
    const list = load.map(({ slot }) => {
      const F = boreFrame(theta + (slot / D.slots) * 2 * Math.PI);
      return { F, depth: G.dot3(F.o, V) };
    });
    if (hub) list.push({ hub, depth: G.dot3([cx, cy, z0 + FUN.s0], V) });
    list.sort((a, b) => a.depth - b.depth);
    return list
      .map(({ F, hub: h }) => {
        if (h) return h;
        const [collar, cap] = tubeParts(F);
        const tab = S(G.prismOf(G.frameOf(F.o, F.a, F.u, F.v), TAB, T.collar.h + 0.6, T.collar.h + 1.6, P), { tone: "mid" });
        const face = G.dot3(F.a, V) > 0 ? Ln(k.pathOf(circle3(F, T.collar.h + T.cap.h, T.cap.r - 1.6, 24).map(at), true), { tone: "faint" }) : "";
        return `<g class="cf-tube">${S(collar[1], { tone: collar[2] })}${tab}${S(cap[1], { tone: cap[2], inner: face })}</g>`;
      })
      .join("");
  }
  // Vạch số lỗ trên mặt vành: mỗi vạch chạy hết bề rộng vành (từ mép trong tới mép ngoài).
  function ticksSvg(theta) {
    const d = [];
    for (let i = 0; i < D.slots; i++) {
      const phi = theta + (i / D.slots) * 2 * Math.PI;
      d.push(k.pathOf([at(P3(IN, RIM, phi)), at(P3(R, RIM, phi))]));
    }
    return Ln(d.join(""), { tone: "faint" });
  }
  // Vệt mờ khi quay nhanh: dải vành khuyên trên mặt phễu, đúng chỗ nắp ống đi qua.
  function blurSvg() {
    const ring = (r, lift) => k.pathOf(Array.from({ length: 96 }, (_, i) => at(P3(r, r - (MOUTH.r - MOUTH.s) + lift, (i / 96) * 2 * Math.PI))), true);
    return `<path class="cf-blur" fill-rule="evenodd" d="${ring(MOUTH.r + 9, 2)}${ring(MOUTH.r - 9, 5)}"/>`;
  }

  // ——— Hình dạng để kiểm tra (ở góc theta) ———
  function shapes(theta, load, A) {
    const drum = A.body(UPF, [[0, 0], [0, R - 3], [3, R], [RIM, R], [RIM, IN], [FUN.s0, FUN.r0], [FUN.s0, D.hub.r], [D.hub.s1, D.hub.r], [D.hub.s1, 0]], { name: "rotor.drum", owner: "rotor" });
    const lidOut = [[RIM, R], [L.s0, R], ...domeProfile.slice(1), [L.s1, 0]];
    const lidIn = lidOut.map(([s, r]) => [s - L.wall, Math.max(0, r - L.wall)]).filter(([s]) => s > RIM).reverse();
    const lid = A.body(UPF, [...lidOut, ...lidIn, [RIM, R - L.wall]], { name: "rotor.lid", owner: "rotor" });
    const knob = A.disc(UPF, L.s1, L.s1 + L.knob.h, L.knob.r, { name: "rotor.knob", owner: "rotor" });
    const screw = A.disc(UPF, D.hub.s1, L.s1 - L.wall, D.screw, { name: "rotor.screw", owner: "rotor" });
    const tubes = load.flatMap(({ slot }) => {
      const F = boreFrame(theta + (slot / D.slots) * 2 * Math.PI);
      return [
        A.disc(F, -0.3, T.collar.h, T.collar.r, { name: `tube${slot}.collar`, owner: "rotor" }),
        A.disc(F, T.collar.h, T.collar.h + T.cap.h, T.cap.r, { name: `tube${slot}.cap`, owner: "rotor" }),
        A.prism(F, TAB, T.collar.h + 0.6, T.collar.h + 1.6, { name: `tube${slot}.tab`, owner: "rotor" }),
      ];
    });
    return [drum, lid, knob, screw, ...tubes];
  }

  return { funnelSvg, drumSvg, hubSvg, lidSvg, boresSvg, tubesSvg, ticksSvg, blurSvg, shapes, lidProfile, frame: UPF };
}
// Mô hình máy ly tâm vi lượng, dùng chung cho bản dựng (Node), trang hình (trình duyệt) và lõi mô phỏng của app.
// Module thuần: không DOM, không Three.js.
//
// Máy làm mẫu: Eppendorf Centrifuge 5425 (không làm lạnh) với rotor góc cố định FA-24×2, nắp rotor kín khí dung.
// Nguồn:
// - Operating manual Centrifuge 5425 (Eppendorf, 5405 900 027-03/122021):
//   https://www.eppendorf.com/product-media/doc/en/338022/Centrifugation_Operating-manual_Centrifuge-5425.pdf
//   · mục 3.3: tối đa 21 300 × g hoặc 15 060 rpm, hơn 10 mức tăng tốc/phanh;
//   · mục 11.3: rộng 24 cm, sâu 39 cm, cao 24 cm, nặng 15,6 kg (không rotor); rotor FA-24×2 nặng 797,5 g;
//   · mục 11.5–11.6: tăng tốc 15 s, phanh 15 s (FA-24×2, mức 9 mặc định, theo DIN 58 970);
//     bảng mức 0–9: tăng tốc 360…15 s, phanh 370…15 s;
//   · tốc độ 100–15 060 rpm (bước 10 rpm dưới 5 000, bước 100 rpm trên 5 000);
//     lực 50–21 300 × g (bước 50 × g dưới 3 000, bước 100 × g trên 3 000); thời gian 5 s – 9:59 h hoặc ∞;
//     động năng tối đa 4,136 kJ; tỉ trọng mẫu cho phép 1,2 g/mL;
//   · mục 12.1: FA-24×2, 24 ống 1,5/2 mL, tải tối đa mỗi lỗ 24 × 3,75 g (adapter + ống + mẫu),
//     bán kính lớn nhất 8,4 cm với ống 1,5/2 mL (6,3 cm với adapter ống PCR 0,2 mL, 7,3 cm với ống 0,5 mL);
//   · mục 5 (màn hình): "At set rpm" bắt đầu đếm giờ khi đạt 95 % tốc độ đặt, nếu tắt thì đếm ngay;
//   · mục 9.2: lỗi IMBAL khi rotor nạp lệch; mục 9.1: nắp chưa đóng thì không chạy được;
//     LID ERROR khi mở nắp lúc đang quay; nhả khoá nắp bằng phím open.
// - Công thức RCF theo DIN 58 970 (cũng in trong manual Centrifuge 5424, mục 2.4.1):
//   rcf = 1,118 × 10⁻⁵ × n² × r_max (n: rpm, r_max: cm).
// - Hệ số k của rotor (thời gian lắng): k = 2,53 × 10¹¹ × ln(r_max / r_min) / n², t (giờ) = k / S
//   (S: hệ số lắng tính bằng Svedberg). Hãng không công bố r_min và k của FA-24×2 trong manual;
//   r_min = 5,85 cm là ước tính (chưa xác minh): ống 2 mL đầy, cột mẫu khoảng 36 mm nằm nghiêng 45°.
// - Ngưỡng phát hiện lệch tâm: hãng không công bố. Giả định (chưa xác minh): máy cắt khi lực lệch tâm
//   vượt lực của 0,5 g lệch tâm ở tốc độ tối đa; khối lượng ống 2 mL rỗng giả định 1,0 g.

/** Thông số máy (Eppendorf Centrifuge 5425). */
const MACHINE = {
  model: "Eppendorf Centrifuge 5425",
  size: { width: 240, depth: 390, height: 240 }, // mm
  mass: 15.6, // kg, không rotor
  maxRpm: 15060,
  maxRcf: 21300,
  minRpm: 100,
  minRcf: 50,
  minSeconds: 5,
  maxSeconds: 9 * 3600 + 59 * 60,
  // Thời gian tăng tốc / phanh (giây) theo mức ramp 0–9, rotor FA-24×2 tải tối đa.
  accel: [360, 300, 240, 180, 120, 90, 60, 45, 30, 15],
  brake: [370, 300, 240, 180, 120, 90, 60, 45, 30, 15],
  defaultRamp: 9,
  noise: 51, // dB(A)
  kineticMax: 4136, // J
  atSetFraction: 0.95,
};

/** Rotor góc cố định FA-24×2. Bán kính tính bằng cm. */
const ROTOR = {
  name: "FA-24×2",
  slots: 24,
  angle: 45, // độ, ống nghiêng so với trục quay
  rMax: 8.4,
  rMin: 5.85, // ước tính, chưa xác minh
  maxLoadPerBore: 3.75, // g
  mass: 797.5, // g
  aerosolTight: true,
};

/** Ống mẫu mặc định: ống 2 mL (khối lượng rỗng giả định) chứa 1,5 mL dung dịch nước. */
const TUBE = { empty: 1.0, volume: 1.5, density: 1.0 };

/** Giả định (chưa xác minh): lệch tâm cho phép quy về khối lượng ở r_max, tại tốc độ tối đa. */
const IMBALANCE = { tolerance: 0.5 };

const K_RCF = 1.118e-5;

/** Lực ly tâm tương đối (× g) ở bán kính rCm (cm) khi quay rpm vòng/phút. */
function rcfFromRpm(rpm, rCm = ROTOR.rMax) {
  return K_RCF * rCm * rpm * rpm;
}

/** Tốc độ (rpm) cần để đạt rcf (× g) ở bán kính rCm. */
function rpmFromRcf(rcf, rCm = ROTOR.rMax) {
  return Math.sqrt(Math.max(0, rcf) / (K_RCF * rCm));
}

/** Làm tròn tốc độ theo bước đặt của máy: 10 rpm dưới 5 000 rpm, 100 rpm từ 5 000 rpm. */
function snapRpm(rpm) {
  const step = rpm < 5000 ? 10 : 100;
  return Math.min(MACHINE.maxRpm, Math.max(MACHINE.minRpm, Math.round(rpm / step) * step));
}

/** Làm tròn lực theo bước đặt của máy: 50 × g dưới 3 000, 100 × g từ 3 000. */
function snapRcf(rcf) {
  const step = rcf < 3000 ? 50 : 100;
  return Math.min(MACHINE.maxRcf, Math.max(MACHINE.minRcf, Math.round(rcf / step) * step));
}

/** Hệ số k của rotor ở tốc độ rpm (giờ·Svedberg). */
function kFactor(rpm = MACHINE.maxRpm, rMin = ROTOR.rMin, rMax = ROTOR.rMax) {
  return (2.53e11 * Math.log(rMax / rMin)) / (rpm * rpm);
}

/**
 * Thời gian để hạt có hệ số lắng S (Svedberg) lắng hết xuống đáy ống, tính bằng giây.
 * t = k / S (giờ). Chỉ là ước lượng bậc độ lớn: bỏ qua thời gian tăng/giảm tốc và khuếch tán.
 */
function pelletSeconds(S, rpm = MACHINE.maxRpm) {
  return (kFactor(rpm) / S) * 3600;
}

/** Thời gian tăng tốc và phanh (giây) từ 0 đến tốc độ tối đa theo mức ramp. */
function rampTimes(level = MACHINE.defaultRamp) {
  const i = Math.max(0, Math.min(9, Math.round(level)));
  return { accel: MACHINE.accel[i], brake: MACHINE.brake[i] };
}

/**
 * Chuẩn hoá danh sách ống: nhận chỉ số lỗ (0–23) hoặc { slot, mass } (mass: g, gồm ống và mẫu).
 * Lỗ trùng chỉ tính một lần; lỗ ngoài 0–23 bị bỏ.
 */
function loadOf(tubes = []) {
  const mass0 = TUBE.empty + TUBE.volume * TUBE.density;
  const out = new Map();
  for (const t of tubes) {
    const slot = typeof t === "number" ? t : t?.slot;
    if (!Number.isInteger(slot) || slot < 0 || slot >= ROTOR.slots) continue;
    const mass = typeof t === "object" && Number.isFinite(t.mass) ? t.mass : mass0;
    out.set(slot, Math.min(mass, 10));
  }
  return [...out].sort((a, b) => a[0] - b[0]).map(([slot, mass]) => ({ slot, mass }));
}

/** Góc của lỗ (radian), lỗ 0 ở góc 0, tăng ngược chiều kim đồng hồ nhìn từ trên. */
const slotAngle = (slot) => (slot / ROTOR.slots) * Math.PI * 2;

/** Lệch tâm của tải: độ lớn tổng véc-tơ khối lượng (g, quy về r_max) và góc của nó. */
function imbalanceOf(tubes) {
  let x = 0;
  let y = 0;
  for (const { slot, mass } of loadOf(tubes)) {
    x += mass * Math.cos(slotAngle(slot));
    y += mass * Math.sin(slotAngle(slot));
  }
  const grams = Math.hypot(x, y);
  return { grams: grams < 1e-9 ? 0 : grams, angle: Math.atan2(y, x) };
}

/**
 * Luật nạp của hãng: mỗi ống phải có một ống đối diện (lỗ + 12) cùng loại, cùng lượng mẫu.
 * Trả về các lỗ thiếu ống đối diện hoặc lệch khối lượng quá 0,1 g.
 */
function unpairedSlots(tubes) {
  const load = loadOf(tubes);
  const bySlot = new Map(load.map((t) => [t.slot, t.mass]));
  return load.filter(({ slot, mass }) => {
    const other = bySlot.get((slot + ROTOR.slots / 2) % ROTOR.slots);
    return other === undefined || Math.abs(other - mass) > 0.1;
  }).map((t) => t.slot);
}

/**
 * Tốc độ (rpm) mà tại đó cảm biến lệch tâm cắt máy: lực lệch tâm U·r·ω² vượt ngưỡng
 * (ngưỡng = lực của IMBALANCE.tolerance gam ở tốc độ tối đa). Infinity nếu không bao giờ cắt.
 */
function tripRpm(tubes) {
  const U = imbalanceOf(tubes).grams;
  if (U <= IMBALANCE.tolerance) return Infinity;
  return MACHINE.maxRpm * Math.sqrt(IMBALANCE.tolerance / U);
}

/**
 * Lập chương trình chạy.
 * @param {object} p  { rcf } hoặc { rpm }; { minutes } hoặc { seconds }; { ramp } 0–9; { atSet } true/false;
 *                    { tubes } danh sách lỗ hoặc { slot, mass }.
 * @returns {object}  rpm, rcf, giây chạy, thời gian tăng tốc/phanh, tốc độ cắt lệch tâm, cảnh báo.
 */
function programOf(p = {}) {
  const warnings = [];
  let rpm;
  if (Number.isFinite(p.rpm)) rpm = snapRpm(p.rpm);
  else {
    const want = Number.isFinite(p.rcf) ? p.rcf : 12000;
    const rcf = snapRcf(want);
    if (want > MACHINE.maxRcf) warnings.push(`Vượt ${MACHINE.maxRcf} × g, máy giới hạn ở mức tối đa.`);
    rpm = Math.min(MACHINE.maxRpm, rpmFromRcf(rcf));
  }
  const rawSeconds = Number.isFinite(p.seconds) ? p.seconds : Number.isFinite(p.minutes) ? p.minutes * 60 : 600;
  const seconds = Math.min(MACHINE.maxSeconds, Math.max(MACHINE.minSeconds, rawSeconds));
  const ramp = rampTimes(Number.isFinite(p.ramp) ? p.ramp : MACHINE.defaultRamp);
  const tubes = loadOf(p.tubes ?? []);
  const unpaired = unpairedSlots(tubes);
  if (!tubes.length) warnings.push("Rotor trống.");
  if (unpaired.length) warnings.push(`Lỗ ${unpaired.map((s) => s + 1).join(", ")} thiếu ống đối diện cân bằng.`);
  if (tubes.some((t) => t.mass > ROTOR.maxLoadPerBore)) warnings.push(`Có ống nặng hơn ${ROTOR.maxLoadPerBore} g mỗi lỗ.`);
  const trip = tripRpm(tubes);
  return {
    rpm,
    rcf: rcfFromRpm(rpm),
    seconds,
    atSet: Boolean(p.atSet),
    accel: (ramp.accel * rpm) / MACHINE.maxRpm, // tăng tốc đều: thời gian tỉ lệ với tốc độ đích
    brakeRate: MACHINE.maxRpm / ramp.brake, // rpm mỗi giây khi phanh
    accelRate: MACHINE.maxRpm / ramp.accel,
    tubes,
    unpaired,
    tripRpm: trip,
    imbalanced: trip < rpm,
    warnings,
  };
}

/**
 * Trạng thái máy ở giây t (thời gian thật của chương trình) kể từ khi bấm start.
 * Pha: "accel" tăng tốc, "run" quay ổn định, "brake" phanh, "imbal" phanh khẩn vì lệch tâm, "stop" đã dừng.
 * Đồng hồ: mặc định đếm từ lúc start (cả lúc tăng tốc); với atSet thì đếm từ lúc đạt 95 % tốc độ đặt.
 */
function stateAt(t, prog) {
  const { rpm, accelRate, brakeRate, seconds } = prog;
  const tAccel = rpm / accelRate;
  if (prog.imbalanced) {
    const tTrip = prog.tripRpm / accelRate;
    const tStop = tTrip + prog.tripRpm / brakeRate;
    if (t <= 0) return { phase: "stop", rpm: 0, rcf: 0, timer: 0, left: seconds, error: null };
    if (t < tTrip) return { phase: "accel", rpm: accelRate * t, rcf: rcfFromRpm(accelRate * t), timer: t, left: seconds - t, error: null };
    const v = Math.max(0, prog.tripRpm - brakeRate * (t - tTrip));
    return { phase: t < tStop ? "imbal" : "stop", rpm: v, rcf: rcfFromRpm(v), timer: tTrip, left: seconds - tTrip, error: "IMBAL", done: t >= tStop, tStop };
  }
  const tStart = prog.atSet ? (MACHINE.atSetFraction * rpm) / accelRate : 0;
  const tBrake = tStart + seconds;
  const tStop = tBrake + rpmAtBrake(prog, tBrake, tAccel) / brakeRate;
  if (t <= 0) return { phase: "stop", rpm: 0, rcf: 0, timer: 0, left: seconds, error: null };
  if (t < tBrake) {
    const v = Math.min(rpm, accelRate * t);
    const timer = Math.max(0, t - tStart);
    return { phase: v < rpm ? "accel" : "run", rpm: v, rcf: rcfFromRpm(v), timer, left: seconds - timer, error: null };
  }
  const v0 = rpmAtBrake(prog, tBrake, tAccel);
  const v = Math.max(0, v0 - brakeRate * (t - tBrake));
  return { phase: v > 0 ? "brake" : "stop", rpm: v, rcf: rcfFromRpm(v), timer: seconds, left: 0, error: null, done: v <= 0, tStop };
}

// Tốc độ lúc bắt đầu phanh (chương trình rất ngắn có thể phanh khi chưa đạt tốc độ đặt).
function rpmAtBrake(prog, tBrake, tAccel) {
  return tBrake >= tAccel ? prog.rpm : prog.accelRate * tBrake;
}

/** Tổng thời gian thật của chương trình (giây), từ start tới khi rotor dừng hẳn. */
function totalSeconds(prog) {
  if (prog.imbalanced) return prog.tripRpm / prog.accelRate + prog.tripRpm / prog.brakeRate;
  const tStart = prog.atSet ? (MACHINE.atSetFraction * prog.rpm) / prog.accelRate : 0;
  const tBrake = tStart + prog.seconds;
  return tBrake + rpmAtBrake(prog, tBrake, prog.rpm / prog.accelRate) / prog.brakeRate;
}

/** Hiển thị thời gian như màn hình máy: m:ss dưới 1 giờ, h:mm từ 1 giờ. */
function fmtClock(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s >= 3600) return `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}h`;
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

/** Số có dấu cách hàng nghìn kiểu Việt Nam (12 000). */
const fmtInt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
// Phần chạy trong trang: nắp bản lề, khoá nắp, chương trình quay (tăng tốc, quay, phanh), màn hình, lệch tâm, vòng giới thiệu.
const D = {"P":{"origin":[311.5667041034053,478.37832145882624],"scale":0.6704491443682943,"azimuth":40,"elevation":30},"ramp":9,"lid":{"H":[0,-186,164],"rear":6,"front":336,"bottom":-4,"top":72,"radii":[1,2,36,20],"wall":3,"x0":-113,"cut":0,"window":{"x":-58,"y":166,"r":22},"hook":{"x0":-10,"x1":-2,"y0":313,"y1":321,"z0":-20,"tooth":4,"reach":8},"knuckles":[[-104,-92],[-30,-18]],"knuckleR":4},"lidOpen":1.361356816555577,"flip":0.7318183912720302,"rot":{"cx":0,"cy":-20,"z0":86,"r":88,"rim":60.6,"inner":84,"funnel":{"r0":44,"s0":20.6},"mouth":{"r":55.7,"s":32.3},"hub":{"r":22,"s1":36},"screw":6,"lid":{"s0":63.6,"s1":71,"h":7.4697762948254915,"wall":2,"knob":{"r":11,"h":2.4}},"slots":24,"tube":{"bore":6.4,"collar":{"r":6.4,"h":1.4},"cap":{"r":5.7,"h":3.2}}},"sol":{"x":-6,"z":151,"r":5,"y0":96,"y1":114,"pin":2,"locked":124,"unlocked":117},"demo":{"rcf":12000,"minutes":10,"tubes":[0,12,4,16,8,20]},"extra":2};

const LIDM = makeLid(KIT, G, P, D.lid);

const svgEl = stage.querySelector("svg");
const $ = (sel) => svgEl.querySelector(sel);

const still = matchMedia("(prefers-reduced-motion: reduce)");

// Chương trình của người dùng do app truyền qua địa chỉ (…centrifuge.html#run=<JSON>):
// { "rcf": 12000, "minutes": 10, "tubes": [0, 12] } — hoặc "rpm", "seconds", "ramp" (0–9), "atSet", tubes dạng { slot, mass }.
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
const CFG = { ...D.demo, ...(RUN ?? {}) };
if (RUN && !Number.isFinite(RUN.rcf) && Number.isFinite(RUN.rpm)) delete CFG.rcf;
const BASE = loadOf(Array.isArray(CFG.tubes) ? CFG.tubes : D.demo.tubes);

const el = {
  machine: $('[data-part="machine"]'),
  rotor: $('[data-part="rotor"]'),

  tubes: $('[data-live="tubes"]'),

};
const PIN_F = G.frameOf([D.sol.x, 0, D.sol.z], [0, 1, 0], [0, 0, 1], [1, 0, 0]);
const pinSvg = (tip) => solidSvg(G.disc(D.sol.y1 + 1.5, tip, D.sol.pin, PIN_F, P, { steps: 18 }), { tone: "hi" });

const LID_OPEN = D.lidOpen;
const RATE = { ramp: 3, run: 60 }; // tua nhanh: tăng/giảm tốc ×3, quay ổn định ×60
const state = {
  lid: { x: LID_OPEN, v: 0, target: LID_OPEN },
  pin: 0, // 0 nhả, 1 khoá
  extra: false,
  load: BASE,

};
let frame = 0;

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const lidClosed = () => state.lid.x < 1e-3 && state.lid.target === 0;
const spinning = () => state.phase === "spin" || state.phase === "locking";
const setText = (node, text) => { if (node && node.textContent !== text) node.textContent = text; };
const programNow = () => programOf({ ...CFG, tubes: state.load });

function drawLid() {
  const th = state.lid.x;
  const key = th.toFixed(4);
  if (key === lidDrawn) return;
  lidDrawn = key;
  if (th > D.flip) { el.open.innerHTML = LIDM.svg(th); el.closed.innerHTML = ""; el.hook.innerHTML = ""; el.tooth.innerHTML = ""; }
  else { el.closed.innerHTML = LIDM.svg(th, "body"); el.hook.innerHTML = LIDM.svg(th, "hook"); el.tooth.innerHTML = LIDM.svg(th, "tooth"); el.open.innerHTML = ""; }
}
function stepLid(dt, calm) {
  const L = state.lid;
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const w = 1 / 0.26;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.min(LID_OPEN, Math.max(0, L.x));
  // Chốt lò xo của nắp: về sát thân thì sập hẳn
  if (L.target === 0 && L.x < 0.03) { L.x = 0; L.v = 0; return false; }
  if (Math.abs(L.target - L.x) < 1e-4 && Math.abs(L.v) < 1e-4) { L.x = L.target; L.v = 0; return false; }
  return true;
}

// ——— Lệnh ———
function setLoad() {
  state.load = loadOf(state.extra ? [...BASE.map((t) => t), { slot: D.extra }] : BASE);
  state.error = null;
  drawRotor(true);
}
function start() {
  if (spinning()) return;
  state.error = null;
  state.prog = programNow();
  state.t = 0;
  if (!lidClosed()) { state.lid.target = 0; state.phase = "closing"; say("Đóng nắp."); }
  else { state.phase = "locking"; say("Khoá nắp."); }
}
function stop() {
  if (state.phase === "closing") { state.phase = "idle"; return; }
  if (state.phase !== "spin" && state.phase !== "locking") return;
  if (state.phase === "locking") { state.phase = "unlocking"; return; }
  const s = stateAt(state.t, state.prog);
  if (s.phase === "accel" || s.phase === "run") { state.prog = { ...state.prog, seconds: state.t, atSet: false }; say("Dừng: rotor phanh."); }
}
function toggleLid() {
  if (spinning() || state.pin > 0.02) { say("Rotor đang quay: nắp bị khoá, không mở được."); flashLock(); return; }
  state.lid.target = state.lid.target > 0 ? 0 : LID_OPEN;
  if (state.phase === "closing") state.phase = "idle";
  say(state.lid.target > 0 ? "Mở nắp." : "Đóng nắp.");
}
let lockFlash = 0;
function flashLock() { lockFlash = 0.9; }
function toggleExtra() {
  if (spinning()) { say("Đang quay: không nạp ống được."); return; }
  state.extra = !state.extra;
  setLoad();
  say(state.extra ? `Thêm một ống lẻ ở lỗ ${D.extra + 1}: rotor lệch tâm.` : "Bỏ ống lẻ: rotor cân bằng.");
}

// ——— Cập nhật ———
function update(dt, calm) {
  state.clock += dt;
  // Mỗi khung chỉ chuyển một pha
  if (state.phase === "closing") { if (lidClosed()) { state.phase = "locking"; say("Khoá nắp."); } }
  else if (state.phase === "locking") { if (state.pin > 0.999) { state.phase = "spin"; state.t = 0; say("Bắt đầu quay."); } }
  else if (state.phase === "spin") {
    const s0 = stateAt(state.t, state.prog);
    const rate = s0.phase === "run" ? RATE.run : RATE.ramp;
    state.t += dt * rate;
    const s = stateAt(state.t, state.prog);
    if (s.error && !state.error) { state.error = s.error; say("Lỗi IMBAL: rotor nạp lệch, máy phanh và dừng."); }
    if (s.phase === "stop" && state.t > 0) { state.phase = "unlocking"; say(state.error ? "Rotor đã dừng. Nạp lại ống cho cân rồi chạy lại." : "Xong. Rotor đã dừng, nắp nhả khoá."); }
  } else if (state.phase === "unlocking") { if (state.pin < 0.001) state.phase = "idle"; }
  // Chốt khoá: đẩy ra khi khoá, rút về khi rotor đã dừng
  const wantPin = state.phase === "locking" || state.phase === "spin" ? 1 : 0;
  state.pin = calm ? wantPin : state.pin + (wantPin - state.pin) * (1 - Math.exp(-dt / 0.12));
  if (Math.abs(state.pin - wantPin) < 1e-3) state.pin = wantPin;
  // Rotor: góc vẽ quay tối đa nửa vòng mỗi giây; quay nhanh thì chuyển sang vệt mờ
  const rpm = rpmNow();
  const fvis = 0.5 * Math.tanh(rpm / 60 / 0.5);
  if (!calm) state.theta -= dt * fvis * 2 * Math.PI;
  const b = Math.min(1, Math.max(0, (rpm - 150) / 1050));
  state.blur = b * b * (3 - 2 * b);
  // Rung khi lệch tâm: tăng theo bình phương tốc độ, tắt dần sau khi dừng
  const prog = state.prog;
  const amp = prog && prog.imbalanced && state.phase === "spin" ? Math.min(1, (rpm / prog.tripRpm) ** 2) : 0;
  state.shake = calm ? 0 : state.shake + (amp - state.shake) * (1 - Math.exp(-dt / 0.15));
  lockFlash = Math.max(0, lockFlash - dt);
}
function rpmNow() {
  if (state.phase !== "spin" || !state.prog) return 0;
  return stateAt(state.t, state.prog).rpm;
}

// ——— Vẽ ———
let rotorKey = "";
function drawRotor(force = false) {
  const key = `${state.theta.toFixed(4)}|${state.load.map((t) => t.slot).join(",")}`;
  if (!force && key === rotorKey) return;
  rotorKey = key;
  el.bores.innerHTML = ROTM.boresSvg(state.theta, new Set(state.load.map((t) => t.slot)));
  el.tubes.innerHTML = ROTM.tubesSvg(state.theta, state.load, HUB);
  el.ticks.innerHTML = ROTM.ticksSvg(state.theta);
}
let pinDrawn = -1;
function drawPin() {
  const tip = D.sol.unlocked + (D.sol.locked - D.sol.unlocked) * state.pin;
  if (Math.abs(tip - pinDrawn) < 0.01) return;
  pinDrawn = tip;
  el.pin.innerHTML = pinSvg(tip);
}
function drawScreen() {
  const prog = state.phase === "spin" ? state.prog : programNow();
  const s = state.phase === "spin" ? stateAt(state.t, prog) : null;
  const err = state.error;
  let text;
  if (err) text = s && s.rpm > 0 ? "IMBAL · ĐANG PHANH" : "IMBAL · NẠP LỆCH";
  else if (!lidClosed() && state.phase !== "spin") text = "NẮP MỞ";
  else if (state.phase === "closing" || state.phase === "locking") text = "KHOÁ NẮP";
  else if (s?.phase === "accel") text = "TĂNG TỐC";
  else if (s?.phase === "run") text = "ĐANG QUAY";
  else if (s?.phase === "brake") text = "PHANH";
  else text = "SẴN SÀNG";
  setText(el.status, text);
  const rpm = s ? s.rpm : prog.rpm;
  const shown = state.unit === "rcf" ? fmtInt(Math.round(rcfFromRpm(rpm) / 10) * 10) : fmtInt(Math.round(rpm / 10) * 10);
  setText(el.speed, shown);
  setText(el.unit, state.unit === "rcf" ? "× g" : "rpm");
  setText(el.time, fmtClock(s ? s.left : prog.seconds));
  setText(el.ramp, `ramp ${D.ramp ?? 9}`);
  const frac = s ? Math.min(1, s.timer / prog.seconds) : 0;
  el.bar.setAttribute("d", `M-43 17.4H${(-43 + 86 * frac).toFixed(2)}V19.4H-43Z`);
  el.screen.toggleAttribute("data-error", Boolean(err));
  const locked = state.pin > 0.5;
  el.lock.setAttribute("data-state", locked ? "locked" : "open");
  el.lock.style.opacity = lockFlash > 0 && Math.floor(lockFlash * 6) % 2 === 0 ? "0.25" : "1";
  el.led.toggleAttribute("data-on", lidClosed() && !locked && state.phase === "idle");
  el.sw.toggleAttribute("data-trip", Boolean(err));
}
function drawReadout() {
  const prog = state.phase === "spin" ? state.prog : programNow();
  const s = state.phase === "spin" ? stateAt(state.t, prog) : null;
  const n = state.load.length;
  const unpaired = unpairedSlots(state.load);
  let text;
  if (state.error) text = s && s.rpm > 0 ? `IMBAL · phanh từ ${fmtInt(Math.round(prog.tripRpm / 10) * 10)} rpm` : `IMBAL · lỗ ${unpaired.map((x) => x + 1).join(", ")} lẻ`;
  else if (s && s.phase !== "stop") text = state.unit === "rcf" ? `${fmtInt(Math.round(s.rcf / 10) * 10)} × g · còn ${fmtClock(s.left)}` : `${fmtInt(Math.round(s.rpm / 10) * 10)} rpm · còn ${fmtClock(s.left)}`;
  else if (state.phase === "closing" || state.phase === "locking") text = "đóng và khoá nắp";
  else text = `${lidClosed() ? "nắp đóng" : "nắp mở"} · ${unpaired.length ? `${n} ống, lỗ ${unpaired.map((x) => x + 1).join(", ")} lẻ` : `${n} ống cân bằng`}`;
  if (readout.textContent !== text) readout.textContent = text;
}
function draw() {
  drawLid();
  drawRotor();
  drawPin();
  el.rotor.style.setProperty("--blur", state.blur.toFixed(3));
  const a = state.shake * 1.4;
  el.machine.style.setProperty("--sx", `${(a * Math.sin(state.clock * 71)).toFixed(2)}px`);
  el.machine.style.setProperty("--sy", `${(a * 0.5 * Math.cos(state.clock * 53)).toFixed(2)}px`);
  drawScreen();
  drawReadout();
}

// ——— Vòng giới thiệu ———
function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  const s = tour.step;
  if (s === "wait") { start(); tour = { ...tour, step: "running", wait: 0 }; }
  else if (s === "running") { if (state.phase === "idle") tour = { ...tour, step: "hold", wait: 1.6 }; }
  else if (s === "hold") { toggleLid(); tour = { ...tour, step: "opened", wait: 2.2 }; }
  else if (s === "opened") {
    // Lượt sau thử nạp lệch, rồi trả về cân bằng
    toggleExtra();
    tour = { step: "wait", wait: 1.8, pass: tour.pass + 1 };
  }
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  const lidMoving = stepLid(dt, calm);
  update(dt, calm);
  draw();
  const busy = !calm && (touring || lidMoving || state.phase !== "idle" || state.shake > 1e-3 || lockFlash > 0 || Math.abs(state.pin - Math.round(state.pin)) > 1e-3);
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 1.6, pass: 0 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || spinning()) return; touring = true; tour = { step: "wait", wait: 0.6, pass: 0 }; loop(); }, 9000);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);

// Giảm chuyển động: nhảy thẳng tới kết quả của lệnh (một khung đứng yên mỗi lần bấm)
function settleCalm() {
  if (!still.matches) return;
  stepLid(0, true);
  if (state.phase === "closing" || state.phase === "locking") { state.phase = "spin"; state.pin = 1; state.t = state.prog.accel + 120; }
  else if (state.phase === "spin") {
    const s = stateAt(state.t, state.prog);
    if (s.phase !== "stop") { state.t = 1e6; }
  }
  for (let i = 0; i < 3; i++) update(0, true);
}
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (![" ", "Enter", "Escape", "b", "B", "r", "R"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === " ") { if (spinning()) stop(); else start(); }
  else if (key === "Enter") toggleLid();
  else if (key === "Escape") stop();
  else if (key === "b" || key === "B") toggleExtra();
  else if (key === "r" || key === "R") { state.unit = state.unit === "rcf" ? "rpm" : "rcf"; say(state.unit === "rcf" ? "Hiển thị lực ly tâm (× g)." : "Hiển thị tốc độ (rpm)."); }
  settleCalm();
  draw();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest("[data-slot]")) toggleLid();
  else if (spinning()) stop();
  else start();
  settleCalm();
  draw();
  stage.focus({ preventScroll: true });
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) {
  // Khung tiêu biểu: nắp đóng và khoá, rotor đang quay ổn định ở tốc độ đặt, màn hình đếm ngược.
  state.prog = programNow();
  state.lid = { x: 0, v: 0, target: 0 };
  state.phase = "spin";
  state.pin = 1;
  state.t = state.prog.imbalanced ? state.prog.tripRpm / state.prog.accelRate * 0.9 : state.prog.accel + 120;
  update(0, true);
}
drawRotor(true);
draw();
</script></body></html>
