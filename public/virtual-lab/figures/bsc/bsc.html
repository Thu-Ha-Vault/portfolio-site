<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tủ an toàn sinh học</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>/* Màu riêng của hình tủ an toàn sinh học. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt --uv, --light, --pad (0–1) trên nhóm máy. */
.iso {
  --bs-room: #b9b39a;
  --bs-dirty: #ff6b5e;
  --bs-clean: #5fa8ff;
  --bs-glass: #7fb3c8;
  --bs-filter: #2a2a26;
  --bs-filter-top: #2f2f2a;
  --bs-uv: #8f5cff;
  --bs-uv-tube: #c9b3ff;
  --bs-lamp: #fff4d6;
  --bs-void: #070707;
  --bs-lcd-bg: #0f2a1e;
  --bs-lcd-ink: #8ff0b8;
  --bs-led-off: #2b3330;
  --bs-led-ok: #4be08a;
  --bs-led-alarm: #ff4b3a;
  --bs-key-on: #4be08a;
  --bs-agar: #b88a3a;
  --bs-pad: #dfe6ec;
  --bs-plastic: #c9d6dd;
  --bs-tip: #e8d27a;
  --bs-handle: #3a3a3a;
  --bs-uv-mix-top: 26%;
  --bs-uv-mix: 22%;
}
.iso[data-theme="light"] {
  --bs-room: #8e876b;
  --bs-dirty: #e5484d;
  --bs-clean: #2f6fe0;
  --bs-glass: #9cc8da;
  --bs-filter: #e9e7df;
  --bs-filter-top: #f1efe8;
  --bs-uv: #7a3dff;
  --bs-uv-tube: #b79bff;
  --bs-lamp: #fff1c2;
  --bs-void: #3a3d40;
  --bs-lcd-bg: #12362a;
  --bs-lcd-ink: #9df5c4;
  --bs-led-off: #b9c2bd;
  --bs-led-ok: #23a855;
  --bs-led-alarm: #e2341f;
  --bs-key-on: #23a855;
  --bs-agar: #d9a34a;
  --bs-pad: #ffffff;
  --bs-plastic: #dfe9ee;
  --bs-tip: #e9c94a;
  --bs-handle: #9a9aa0;
  --bs-uv-mix-top: 14%;
  --bs-uv-mix: 12%;

/* Buồng làm việc: ngả tím khi đèn UV chiếu, sáng ấm khi đèn huỳnh quang bật */
.bs-cavity .iso-top { fill: color-mix(in oklab, color-mix(in oklab, var(--anatomy-top), var(--bs-lamp) calc(var(--light, 0) * 10%)), var(--bs-uv) calc(var(--uv, 0) * var(--bs-uv-mix-top))); }
.bs-cavity .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--anatomy-shade-0), var(--bs-uv) calc(var(--uv, 0) * var(--bs-uv-mix))); }
.bs-cavity .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--anatomy-shade-1), var(--bs-uv) calc(var(--uv, 0) * var(--bs-uv-mix))); }
.bs-cavity .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--anatomy-shade-2), var(--bs-uv) calc(var(--uv, 0) * var(--bs-uv-mix))); }
.bs-cavity .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--bs-uv) calc(var(--uv, 0) * var(--bs-uv-mix))); }

.bs-filter .iso-top { fill: var(--bs-filter-top); }
.bs-filter .iso-shade { fill: var(--bs-filter); }

.bs-uvtube .iso-top, .bs-uvtube .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--bs-uv-tube) calc(var(--uv, 0) * 90%)); stroke: none; }
.bs-uvtube { filter: drop-shadow(0 0 calc(var(--uv, 0) * 5px) var(--bs-uv)); }
.bs-lamp .iso-top, .bs-lamp .iso-shade { fill: color-mix(in oklab, var(--anatomy-shade-3), var(--bs-lamp) calc(var(--light, 0) * 85%)); stroke: none; }
.bs-lamp { filter: drop-shadow(0 0 calc(var(--light, 0) * 3px) var(--bs-lamp)); }

/* Kính cường lực: trong mờ để thấy buồng làm việc */
.bs-glass .iso-fill { fill: var(--bs-glass); fill-opacity: 0.08; }
.bs-glass .iso-top, .bs-glass .iso-shade { fill: var(--bs-glass); fill-opacity: 0.16; }
.bs-glass .iso-shade[data-shade="3"], .bs-glass .iso-shade[data-shade="2"] { fill-opacity: 0.12; }
.bs-handle .iso-top, .bs-handle .iso-shade { fill: color-mix(in oklab, var(--bs-handle) 60%, var(--anatomy-shade-1)); }

.bs-void { fill: var(--bs-void); }
.bs-agar-top { fill: color-mix(in oklab, var(--bs-agar) 70%, var(--anatomy-top)); }
/* Vật liệu có màu: pha màu vào từng tông để vẫn còn khối; nét viền tông (seamless) cùng màu với nền tông */
.bs-agar .iso-top { fill: color-mix(in oklab, var(--bs-agar) 70%, var(--anatomy-top)); }
.bs-agar .iso-shade { fill: color-mix(in oklab, var(--bs-agar) 60%, var(--anatomy-shade-1)); }
.bs-dish .iso-fill { fill-opacity: 0.4; }
.bs-dish .iso-top, .bs-dish .iso-shade { fill: var(--bs-plastic); fill-opacity: 0.35; }
.bs-tube .iso-solid[data-seamless] > .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-0)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-0)); }
.bs-tube .iso-solid[data-seamless] > .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-1)); }
.bs-tube .iso-solid[data-seamless] > .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-2)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-2)); }
.bs-tube .iso-solid[data-seamless] > .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-3)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-3)); }
.bs-tube .iso-solid[data-seamless] > .iso-top { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-top)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-top)); }
.bs-bottle .iso-solid[data-seamless] > .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-0)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-0)); }
.bs-bottle .iso-solid[data-seamless] > .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-1)); }
.bs-bottle .iso-solid[data-seamless] > .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-2)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-2)); }
.bs-bottle .iso-solid[data-seamless] > .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-3)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-3)); }
.bs-bottle .iso-solid[data-seamless] > .iso-top { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-top)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-top)); }
.bs-tip .iso-solid[data-seamless] > .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--bs-tip) 50%, var(--anatomy-shade-0)); stroke: color-mix(in oklab, var(--bs-tip) 50%, var(--anatomy-shade-0)); }
.bs-tip .iso-solid[data-seamless] > .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--bs-tip) 50%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--bs-tip) 50%, var(--anatomy-shade-1)); }

.bs-tip .iso-solid[data-seamless] > .iso-top { fill: color-mix(in oklab, var(--bs-tip) 50%, var(--anatomy-top)); stroke: color-mix(in oklab, var(--bs-tip) 50%, var(--anatomy-top)); }

.bs-tube .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-2)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-2)); }

.bs-bottle .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-0)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-0)); }
.bs-bottle .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-shade-1)); }

.bs-bottle .iso-top { fill: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-top)); stroke: color-mix(in oklab, var(--bs-plastic) 35%, var(--anatomy-top)); }

.bs-tip .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--bs-tip) 50%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--bs-tip) 50%, var(--anatomy-shade-1)); }

làm màn khí vỡ. Khoảng 2/3 khí trong buồng áp quay lại qua lọc ULPA thành dòng tầng 0,30 m/s bảo vệ mẫu, 1/3 qua lọc ULPA trên nóc ra phòng; lọc giữ hơn 99,999 % hạt cỡ khó lọc nhất. Đèn UV chỉ bật được khi kính đóng hẳn. Hạt chuyển động chậm khoảng 3 lần so với thật. Bên trong (quạt, tấm ngăn, cảm biến) vẽ theo cấu tạo điển hình; hệ số bảo vệ và tải bụi của lọc trong mô hình là số minh hoạ.</span></figcaption></figure></main><script type="module">// Mô hình tủ an toàn sinh học cấp II kiểu A2, dùng chung cho bản dựng (Node), trang hình (trình duyệt)

  sashTolerance: 13, // mm, giả định

  downflowNominal: 0.30,
  inflowFlow: 473,

  exhaustFlow: 473,

  inflowCap: 1.5, // m/s, giả định: vận tốc lớn nhất qua khe khi kính gần đóng

  filter: { name: "ULPA / H14", efficiency: 0.99999, leakTest: 0.9999 },

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/**
 * Tải bụi của lọc theo thời gian dùng (MINH HOẠ). Chênh áp tăng tuyến tính theo năm; quạt ECM bù được tới
 * gấp đôi chênh áp ban đầu, quá mức đó lưu lượng giảm theo căn bậc hai (quạt và lọc như một trở kháng bậc hai).
 * @param {number} years số năm lọc đã chạy (≥ 0)
 * @returns {{ dp: number, dp0: number, dpMax: number, flowFactor: number, replace: boolean }}
 *   dp: chênh áp qua lọc (Pa), flowFactor: tỉ lệ lưu lượng so với danh định (0–1), replace: nên thay lọc
 */
function filterLoad(years = 0) {
  const dp0 = 125; // Pa, giả định cho lọc ULPA mới
  const dpMax = 2 * dp0;
  const dp = dp0 * (1 + 0.35 * Math.max(0, years));
  const flowFactor = dp <= dpMax ? 1 : Math.sqrt(dpMax / dp);
  return { dp, dp0, dpMax, flowFactor, replace: dp >= dpMax };
}

/**
 * Trạng thái của kính theo độ mở.
 * @param {number} sash độ mở kính (mm, tính từ mặt tựa tay tới mép dưới kính)
 * @returns {"closed"|"low"|"rated"|"high"} đóng hẳn, thấp hơn mức làm việc, đúng mức làm việc, cao quá
 */
function sashState(sash, c = CABINET) {
  if (sash <= 2) return "closed";
  if (Math.abs(sash - c.sashRated) <= c.sashTolerance) return "rated";
  return sash < c.sashRated ? "low" : "high";
}

/**
 * Vận tốc khí vào qua cửa trước: lưu lượng thải chia cho diện tích cửa mở (độ mở × chiều rộng trong).
 * Kính đóng hẳn thì không có dòng vào qua cửa (trả về 0).
 * @param {number} sash độ mở kính (mm)
 * @param {{ fan?: boolean, flowFactor?: number }} [opts] quạt bật, tỉ lệ lưu lượng (từ filterLoad)
 * @returns {number} m/s
 */
function inflowVelocity(sash, { fan = true, flowFactor = 1 } = {}, c = CABINET) {
  if (!fan || sash <= 2) return 0;
  const q = (c.exhaustFlow * flowFactor) / 3600; // m³/s
  const raw = q / ((sash / 1000) * (c.inside.width / 1000));
  // Khe rất hẹp: quạt không đẩy nổi lưu lượng danh định, vận tốc bão hoà quanh c.inflowCap (giả định).
  return raw / (1 + (raw / c.inflowCap) ** 4) ** 0.25;
}

/**
 * Vận tốc dòng tầng đi xuống trên mặt bàn (danh định 0,30 m/s, tỉ lệ với lưu lượng quạt).
 * @param {{ fan?: boolean, flowFactor?: number }} [opts]
 * @returns {number} m/s
 */
function downflowVelocity({ fan = true, flowFactor = 1 } = {}, c = CABINET) {
  return fan ? c.downflowNominal * flowFactor : 0;
}

/**
 * Tỉ lệ hạt lọt qua lọc: P = 1 − hiệu suất.
 * @param {number} [efficiency] hiệu suất lọc (0–1), mặc định ULPA 0,99999
 * @returns {number}
 */
function penetration(efficiency = CABINET.filter.efficiency) {
  return 1 - efficiency;
}

/**
 * Số hạt còn lại sau khi đi qua lọc (kỳ vọng).
 * @param {number} count số hạt trước lọc
 * @param {number} [efficiency]
 * @returns {number}
 */
function afterFilter(count, efficiency = CABINET.filter.efficiency) {
  return count * penetration(efficiency);
}

/**
 * Hệ số bảo vệ người dùng (MINH HOẠ, không phải số đo): tỉ số giữa hạt sinh ra trong tủ và hạt lọt ra phía người.
 * Màn khí vào đủ mạnh (≥ ngưỡng báo động) cho khoảng 10⁵–10⁵·⁵; yếu dần thì giảm theo log tới khoảng 10¹ ở 0,20 m/s;
 * che lưới trước làm màn khí vỡ (giảm 10³ lần); quạt tắt thì không còn bảo vệ.
 * @param {{ inflow: number, grille?: "clear"|"blocked", fan?: boolean, sash: number }} s
 * @returns {{ log10: number, factor: number, pass: boolean }} pass: đạt yêu cầu ≥ 10⁵
 */
function protectionFactor({ inflow, grille = "clear", fan = true, sash }, c = CABINET) {
  if (sash <= 2) return { log10: Infinity, factor: Infinity, pass: true };
  if (!fan) return { log10: 0, factor: 1, pass: false };
  let log10 = inflow >= c.inflowAlarm ? 5 + 0.5 * clamp((inflow - c.inflowAlarm) / (c.inflowNominal - c.inflowAlarm), 0, 1) : 1 + 4 * clamp((inflow - 0.2) / (c.inflowAlarm - 0.2), 0, 1);
  if (grille === "blocked") log10 -= 3;
  log10 = Math.max(0, log10);
  return { log10, factor: 10 ** log10, pass: log10 >= Math.log10(c.apfRequired) - 1e-9 };
}

/**
 * Đèn UV chỉ được bật khi kính đóng hẳn (khoá liên động).
 * @param {number} sash độ mở kính (mm)
 * @returns {boolean}
 */
function uvAllowed(sash) {
  return sash <= 2;
}

/**
 * Toàn bộ trạng thái của tủ cho một lựa chọn của người dùng.
 * @param {{ sash?: number, fan?: boolean, grille?: "clear"|"blocked", uv?: boolean, filterYears?: number }} [input]
 * @returns {{ sash: number, sashState: string, fan: boolean, grille: string, inflow: number, downflow: number,
 *   exhaustFlow: number, filter: object, apf: object, alarms: string[], containment: boolean, product: boolean,
 *   uvOn: boolean, uvBlocked: boolean, light: boolean, message: string }}
 *   alarms: "sash" (kính sai độ cao), "airflow" (khí vào dưới ngưỡng); containment: người dùng được bảo vệ;
 *   product: mẫu được bảo vệ (dòng xuống đủ, qua lọc ULPA); uvBlocked: muốn bật UV nhưng kính chưa đóng.
 */
function cabinetState({ sash = CABINET.sashRated, fan = true, grille = "clear", uv = false, filterYears = 0 } = {}, c = CABINET) {
  sash = clamp(Number(sash) || 0, 0, c.sashMax);
  const filter = filterLoad(filterYears);
  const flowFactor = filter.flowFactor;
  const inflow = inflowVelocity(sash, { fan, flowFactor }, c);
  const downflow = downflowVelocity({ fan, flowFactor }, c);
  const state = sashState(sash, c);
  const apf = protectionFactor({ inflow, grille, fan, sash }, c);
  const alarms = [];
  if (state === "low" || state === "high") alarms.push("sash");
  if (state !== "closed" && (!fan || inflow < c.inflowAlarm)) alarms.push("airflow");
  const containment = state === "closed" || apf.pass;
  const product = fan && downflow >= c.downflowRange[0];
  const uvOn = Boolean(uv) && uvAllowed(sash);
  const uvBlocked = Boolean(uv) && !uvAllowed(sash);
  const light = state !== "closed" && !uvOn;
  let message;
  if (state === "closed") message = uvOn ? "Kính đóng, đèn UV đang khử trùng" : "Kính đóng hẳn";
  else if (!fan) message = "Quạt tắt: không còn màn khí bảo vệ";
  else if (grille === "blocked") message = "Lưới trước bị che: màn khí vỡ, khí dung lọt ra";
  else if (alarms.includes("airflow")) message = "Khí vào dưới 0,40 m/s: mất bảo vệ người";
  else if (alarms.includes("sash")) message = state === "high" ? "Kính cao quá mức làm việc" : "Kính thấp hơn mức làm việc";
  else message = "An toàn";
  return { sash, sashState: state, fan: Boolean(fan), grille, inflow, downflow, exhaustFlow: fan ? c.exhaustFlow * flowFactor : 0, filter, apf, alarms, containment, product, uvOn, uvBlocked, light, message };
}

  inflowBlocked: { count: 24, speed: (m) => m.inflow, on: (m) => m.fan && m.sashState !== "closed" && m.grille === "blocked" },
  downFront: { count: 15, speed: (m) => m.downflow, on: (m) => m.fan && !(m.sashState !== "closed" && m.grille === "blocked") },
  downFrontSpill: { count: 15, speed: (m) => m.downflow, on: (m) => m.fan && m.sashState !== "closed" && m.grille === "blocked" },
  downRear: { count: 15, speed: (m) => m.downflow, on: (m) => m.fan },
  exhaust: { count: 12, speed: (m) => (m.exhaustFlow / 3600) / 0.3, on: (m) => m.fan },
  escape: { count: 12, speed: () => 0.16, on: (m) => (m.sashState === "closed" ? 0 : !m.fan ? 0.7 : Math.max(0, Math.min(1, (5 - m.apf.log10) / 4))) },
};
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const particles = [];
for (const [name, lane] of Object.entries(LANES)) {
  const path = D.paths[name];
  lane.path = path;
  lane.level = 0;
  lane.v = 0;
  lane.parts = [];
  for (let i = 0; i < lane.count; i++) {
    const dots = ["inner", "outer"].map((layer) => {
      const c = document.createElementNS(NS, "path");
      c.setAttribute("class", "bs-p");
      layers[layer].appendChild(c);
      return c;
    });
    const p = { pos: (i + rand() * 0.7) / lane.count, dx: path.spread[0] + rand() * (path.spread[1] - path.spread[0]), dots, kind: -1, side: -1, shown: "" };
    lane.parts.push(p);
    particles.push(p);
  }
}
const KINDS = ["room", "dirty", "clean"];
const TAIL = 3.5; // số mẫu (12 mm mỗi mẫu) của vệt sau hạt
function placeParticles() {
  for (const lane of Object.values(LANES)) {
    const s = lane.path.samples;
    const n = s.length - 1;
    for (const p of lane.parts) {
      const f = p.pos * n;
      const i = Math.min(n - 1, Math.floor(f));
      const t = f - i;
      const a = s[i];
      const b = s[i + 1];
      const x = a[0] + (b[0] - a[0]) * t + D.ex[0] * p.dx;
      const y = a[1] + (b[1] - a[1]) * t + D.ex[1] * p.dx;
      // vệt ngắn phía sau hạt cho thấy hướng chảy cả khi đứng yên
      const f0 = Math.max(0, f - TAIL);
      const i0 = Math.min(n - 1, Math.floor(f0));
      const t0 = f0 - i0;
      const x0 = s[i0][0] + (s[i0 + 1][0] - s[i0][0]) * t0 + D.ex[0] * p.dx;
      const y0 = s[i0][1] + (s[i0 + 1][1] - s[i0][1]) * t0 + D.ex[1] * p.dx;
      const kind = t < 0.5 ? a[2] : b[2];
      const side = t < 0.5 ? a[3] : b[3];
      const edge = Math.min(1, p.pos / 0.06, (1 - p.pos) / 0.06);
      const alpha = Math.max(0, lane.level * edge);
      const dot = p.dots[side];
      const other = p.dots[1 - side];
      if (p.side !== side) {
        other.style.opacity = "0";
        p.side = side;
      }
      if (p.kind !== kind) {
        p.dots.forEach((d) => d.setAttribute("data-k", KINDS[kind]));
        p.kind = kind;
      }
      dot.setAttribute("d", `M${x0.toFixed(1)} ${y0.toFixed(1)}L${x.toFixed(1)} ${y.toFixed(1)}`);
      dot.style.opacity = alpha.toFixed(3);
    }
  }
}

// ——— Kính trượt: dịch theo mặt nghiêng, xếp lại chỗ vẽ theo khoá độ sâu ———
let drawnShare = null;
function drawSash() {
  const s = state.sash.x;
  if (drawnShare !== null && Math.abs(s - drawnShare) < 1e-5) return;
  drawnShare = s;
  const tf = `translate(${(D.move[0] * s).toFixed(2)} ${(D.move[1] * s).toFixed(2)})`;
  const slot = sashParts.map((part) => {
    const key = part.key + D.lift * s;
    let i = 0;
    while (i < staticKeys.length && staticKeys[i] <= key) i++;
    return i;
  });
  // Đặt từ phần kính sau cùng về trước; các phần cùng chỗ giữ thứ tự khoá của chúng.
  for (let j = sashParts.length - 1; j >= 0; j--) {
    const part = sashParts[j];
    part.node.setAttribute("transform", tf);
    const i = slot[j];
    const before = j + 1 < sashParts.length && slot[j + 1] === i ? sashParts[j + 1].node : i < staticNodes.length ? staticNodes[i] : layers.outer;
    if (part.node.nextSibling !== before) doc.insertBefore(part.node, before);
  }
}
function stepSash(dt, calm) {
  const L = state.sash;
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const stiffness = 64;
  const damping = 14.2;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (stiffness * (L.target - L.x) - damping * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.max(0, Math.min(1, L.x));
  // chốt: kính về gần mặt tựa tay thì đóng hẳn
  if (L.target === 0 && L.x < 0.004) { L.x = 0; L.v = 0; return false; }
  if (Math.abs(L.target - L.x) < 2e-4 && Math.abs(L.v) < 2e-4) { L.x = L.target; L.v = 0; return false; }
  return true;
}

const say = (text) => { state.note = null; if (status.textContent !== text) status.textContent = text; };
const note = (text) => { say(text); state.note = { text, until: state.clock + 2.6 }; };
function model() {
  return cabinetState({ sash: state.sash.x * D.sashMax, fan: state.fan, grille: state.grille, uv: state.uv, filterYears: state.filterYears });
}
function setSash(mm) {
  state.sash.target = mm / D.sashMax;
  if (mm > 2 && state.uv) { state.uv = false; note("Mở kính: khoá liên động tắt đèn UV."); }
  else say(mm <= 2 ? "Hạ kính đóng hẳn." : `Kính mở ${mm} mm.`);
}
function sashStep(dir) {
  const now = Math.round(state.sash.target * D.sashMax);
  const list = dir > 0 ? STOPS.filter((s) => s > now + 1) : STOPS.filter((s) => s < now - 1).reverse();
  if (list.length) setSash(list[0]);
}
function toggleFan() { state.fan = !state.fan; say(state.fan ? "Bật quạt." : "Tắt quạt."); }
function toggleGrille() { state.grille = state.grille === "clear" ? "blocked" : "clear"; say(state.grille === "blocked" ? "Đặt khăn thấm che lưới trước." : "Bỏ khăn thấm khỏi lưới trước."); }
function toggleUv() {
  if (state.uv) { state.uv = false; say("Tắt đèn UV."); return; }
  if (!uvAllowed(state.sash.target * D.sashMax) || state.sash.x > 0.004) { note("UV bị khoá: hạ kính xuống đóng hẳn."); return; }
  state.uv = true;
  say("Bật đèn UV.");
}

const ease = (cur, target, dt, tau) => cur + (target - cur) * (1 - Math.exp(-dt / tau));
function update(dt, calm) {
  state.clock += dt;
  const m = model();
  for (const lane of Object.values(LANES)) {
    const on = Number(lane.on(m));
    const speed = lane.speed(m) * (on > 0 ? 1 : 0);
    lane.level = calm ? on : ease(lane.level, on, dt, on > lane.level ? 0.5 : 0.7);
    if (lane.level < 1e-3 && on === 0) lane.level = 0;
    lane.v = calm ? 0 : ease(lane.v, speed, dt, m.fan ? 0.5 : 1.4);
    if (!calm) for (const p of lane.parts) {
      p.pos += (dt * lane.v * 1000 * D.slow) / lane.path.length;
      if (p.pos >= 1) p.pos -= 1;
    }
  }
  state.uvLevel = calm ? Number(m.uvOn) : ease(state.uvLevel, Number(m.uvOn), dt, 0.25);
  state.light = calm ? Number(m.light) : ease(state.light, Number(m.light), dt, 0.18);
  state.pad = calm ? Number(state.grille === "blocked") : ease(state.pad, Number(state.grille === "blocked"), dt, 0.25);
  return m;
}

let shownM = null;
function draw(m) {
  drawSash();
  placeParticles();
  doc.style.setProperty("--uv", state.uvLevel.toFixed(3));
  doc.style.setProperty("--light", state.light.toFixed(3));
  doc.style.setProperty("--pad", state.pad.toFixed(3));
  const closed = m.sashState === "closed";
  const airAlarm = m.alarms.includes("airflow");
  const sashAlarm = m.alarms.includes("sash");
  const alarm = m.alarms.length > 0;
  const lines = !m.fan && closed ? ["QUẠT TẮT", m.uvOn ? "UV BẬT" : "KÍNH ĐÓNG"] : closed ? [m.uvOn ? "KÍNH ĐÓNG · UV" : "KÍNH ĐÓNG", `X ${vn(m.downflow)}`] : !m.fan ? ["QUẠT TẮT", "KHÍ LỖI"] : [`KHÍ ${airAlarm ? "LỖI" : "OK"} KÍNH ${sashAlarm ? "SAI" : "OK"}`, `V ${vn(m.inflow)}  X ${vn(m.downflow)}`];
  lines.forEach((t, i) => { if (lcd[i].textContent !== t) lcd[i].textContent = t; });
  leds.ok.toggleAttribute("data-on", m.fan && !alarm);
  leds.alarm.toggleAttribute("data-on", alarm && (still.matches || Math.floor(state.clock * 2.4) % 2 === 0));
  keyFan?.toggleAttribute("data-on", m.fan);
  keyLight?.toggleAttribute("data-on", m.light);
  keyUv?.toggleAttribute("data-on", m.uvOn);
  let tail;
  if (!m.fan) tail = "quạt tắt · không bảo vệ";
  else if (m.grille === "blocked") tail = "lưới bị che";
  else if (airAlarm) tail = "mất bảo vệ";
  else if (sashAlarm) tail = m.sashState === "high" ? "báo kính cao" : "báo kính thấp";
  else tail = "an toàn";
  let text = closed ? `kính đóng · xuống ${vn(m.downflow)} m/s${m.uvOn ? " · UV bật" : ""}` : !m.fan ? `vào 0 · ${tail}` : `vào ${vn(m.inflow)} · xuống ${vn(m.downflow)} m/s · ${tail}`;
  if (state.note && state.clock < state.note.until) text = state.note.text;
  if (readout.textContent !== text) readout.textContent = text;
  shownM = m;
}

// ——— Vòng lặp, tour tự chạy ———
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches && !RUN;
const TOUR = [
  [3.5, () => setSash(254)],
  [4.5, () => setSash(CABINET.sashMax)],
  [5, () => setSash(CABINET.sashRated)],
  [3.5, () => { if (state.grille === "clear") toggleGrille(); }],
  [5, () => { if (state.grille === "blocked") toggleGrille(); }],
  [3, () => setSash(0)],
  [2.2, () => toggleUv()],
  [4, () => { if (state.uv) toggleUv(); }],
  [1.5, () => setSash(CABINET.sashRated)],
];
let tour = { i: 0, wait: TOUR[0][0] };
let idleTimer = 0;
function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  TOUR[tour.i][1]();
  tour.i = (tour.i + 1) % TOUR.length;
  tour.wait = TOUR[tour.i][0];
}
function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  stepSash(dt, calm);
  const m = update(dt, calm);
  draw(m);
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches) return; tour = { i: 0, wait: 1 }; touring = true; loop(); }, 12000);
}
function settleStill() {
  stepSash(0, true);
  draw(update(0, true));
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  if (!["ArrowUp", "ArrowDown", " ", "g", "u"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === "ArrowUp") sashStep(1);
  else if (key === "ArrowDown") sashStep(-1);
  else if (key === " ") toggleFan();
  else if (key === "g") toggleGrille();
  else toggleUv();
  if (still.matches) settleStill();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest(".bs-sash-part")) {
    const now = Math.round(state.sash.target * D.sashMax);
    const next = STOPS.find((s) => s > now + 1);
    setSash(next ?? 0);
  } else toggleFan();
  stage.focus({ preventScroll: true });
  if (still.matches) settleStill();
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));
settleStill();
</script></body></html>
