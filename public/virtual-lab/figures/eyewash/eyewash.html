<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trạm tắm và rửa mắt khẩn cấp</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>/* Màu riêng của hình trạm tắm và rửa mắt khẩn cấp. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt trên svg: --water (màu nước theo nhiệt độ và độ đục), --shower, --eye, --drain (0–1), --flow (độ lệch nét). */
.iso {
  --ew-pe: #c9742c;
  --ew-abs: #d07a2e;
  --ew-void: #070707;
  --ew-cutwall: #8b8f93;
  --ew-bowl-in: #2a2d30;
  --ew-gs: #3fa86a;
  --ew-sign: #1f8a4c;
  --ew-sign-ink: #f2f5f2;
  --ew-dial-face: #e9ece6;
  --ew-dial-band: #3fa86a;
  --ew-needle: #e0463a;
  --ew-water-ok: #7cc8ee;
  --ew-water-cold: #5d8cff;
  --ew-water-hot: #ff8a5c;
  --ew-water-rust: #b5803e;
  --ew-blue-mark: #7cc8ee;
}
.iso[data-theme="light"] {
  --ew-pe: #e0832f;
  --ew-abs: #e48a38;
  --ew-void: #3a3d40;
  --ew-cutwall: #9aa0a6;
  --ew-bowl-in: #c8ccd0;
  --ew-gs: #2f9a5a;
  --ew-sign: #1d8a4a;
  --ew-sign-ink: #ffffff;
  --ew-dial-face: #ffffff;
  --ew-dial-band: #2f9a5a;
  --ew-needle: #d23a2e;
  --ew-water-ok: #1f8fd0;
  --ew-water-cold: #2f5fe0;
  --ew-water-hot: #e0602a;
  --ew-water-rust: #9a6424;
  --ew-blue-mark: #1f8fd0;
}

/* Chú giải */
.iso-swatch[data-mark="blue"] path { stroke: var(--ew-blue-mark); }
.iso-swatch[data-mark="green"] path { stroke: var(--ew-dial-band); }

/* Vật liệu có màu: pha màu vào từng tông để vẫn còn khối */
.ew-pe .iso-top { fill: color-mix(in oklab, var(--ew-pe) 60%, var(--anatomy-top)); }
.ew-pe .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--ew-pe) 55%, var(--anatomy-shade-0)); }
.ew-pe .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--ew-pe) 55%, var(--anatomy-shade-1)); }
.ew-pe .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--ew-pe) 55%, var(--anatomy-shade-2)); }
.ew-pe .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--ew-pe) 55%, var(--anatomy-shade-3)); }
.ew-abs .iso-solid > .iso-top { fill: color-mix(in oklab, var(--ew-abs) 60%, var(--anatomy-top)); stroke: color-mix(in oklab, var(--ew-abs) 60%, var(--anatomy-top)); }
.ew-abs .iso-solid > .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--ew-abs) 55%, var(--anatomy-shade-0)); stroke: color-mix(in oklab, var(--ew-abs) 55%, var(--anatomy-shade-0)); }
.ew-abs .iso-solid > .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--ew-abs) 55%, var(--anatomy-shade-1)); stroke: color-mix(in oklab, var(--ew-abs) 55%, var(--anatomy-shade-1)); }
.ew-abs .iso-solid > .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--ew-abs) 55%, var(--anatomy-shade-2)); stroke: color-mix(in oklab, var(--ew-abs) 55%, var(--anatomy-shade-2)); }
.ew-abs .iso-solid > .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--ew-abs) 55%, var(--anatomy-shade-3)); stroke: color-mix(in oklab, var(--ew-abs) 55%, var(--anatomy-shade-3)); }
.ew-gs .iso-top { fill: color-mix(in oklab, var(--ew-gs) 55%, var(--anatomy-top)); }
.ew-gs .iso-shade { fill: color-mix(in oklab, var(--ew-gs) 50%, var(--anatomy-shade-1)); }
.ew-cover .iso-top { fill: color-mix(in oklab, var(--ew-gs) 60%, var(--anatomy-top)); }
.ew-cover .iso-shade { fill: color-mix(in oklab, var(--ew-gs) 55%, var(--anatomy-shade-1)); }

.ew-void { fill: var(--ew-void); }
.ew-cutwall { fill: var(--ew-cutwall); }
.ew-bowl-in { fill: color-mix(in oklab, var(--ew-bowl-in) 70%, var(--anatomy-shade-2)); }
.ew-bore { fill: var(--ew-void); }

/* Biển báo */
.ew-sign-bg { fill: var(--ew-sign); }
.ew-sign-ink { fill: var(--ew-sign-ink); }

/* Nhiệt kế */
.ew-dial-face { fill: var(--ew-dial-face); }
.ew-dial-band { fill: var(--ew-dial-band); fill-opacity: 0.75; }
.ew-needle-path { fill: var(--ew-needle); }
.ew-dial-hub { fill: var(--anatomy-shade-3); }

/* Nước: màu theo nhiệt độ và độ đục (live đặt --water), mức hiện theo van */
.ew-water, .ew-pool, .ew-win-water, .ew-win-flow { pointer-events: none; }
.ew-stream { fill: none; stroke: var(--water, var(--ew-water-ok)); stroke-linecap: round; vector-effect: non-scaling-stroke; }
.ew-shower { stroke-width: calc(1.1px + var(--w, 1) * 0.6px); stroke-dasharray: 9 7; stroke-dashoffset: var(--flow-shower, 0); opacity: calc(var(--shower, 0) * (0.35 + var(--w, 1) * 0.45)); }
.ew-jet { stroke-width: calc(0.8px + var(--w, 1) * 0.7px); stroke-dasharray: 5 2.5; stroke-dashoffset: var(--flow-eye, 0); opacity: calc(var(--eye, 0) * (0.4 + var(--w, 1) * 0.5)); }
.ew-pool-path { fill: var(--water, var(--ew-water-ok)); opacity: calc(var(--eye, 0) * 0.55); }
.ew-win-water { fill: var(--water, var(--ew-water-ok)); opacity: 0.55; }
.ew-win-water[data-win="drain"] { opacity: calc(var(--drain, 0) * 0.5); }
.ew-win-flow { fill: none; stroke: var(--ew-sign-ink); stroke-width: 1px; stroke-linecap: round; stroke-dasharray: 3 6; vector-effect: non-scaling-stroke; opacity: 0; }
.ew-win-flow[data-flow="shower"] { stroke-dashoffset: calc(var(--flow-up, 0) * 1); opacity: calc(var(--shower, 0) * 0.85); }
.ew-win-flow[data-flow="eye"] { stroke-dashoffset: var(--flow-down, 0); opacity: calc(var(--eye, 0) * 0.85); }
.ew-win-flow[data-flow="drain"] { stroke-dashoffset: var(--flow-down, 0); opacity: calc(var(--drain, 0) * 0.85); }

.ew-stage { touch-action: pan-y; cursor: pointer; }
.ew-stage:focus { outline: none; }
.ew-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }

"ew-stream ew-jet" style="--w:0.55" d="M287.5 435.3L287 432.4L286.5 429.8L285.9 427.3L285.3 425.1L284.6 423L283.8 421.1L283.1 419.4L282.3 417.9L281.4 416.5L280.5 415.3L279.6 414.2L278.7 413.3L277.8 412.6L276.8 412L275.8 411.5L274.8 411.1L273.8 410.9L272.8 410.8L271.8 410.9L270.8 411L269.8 411.3L268.7 411.6L267.7 412.1L266.7 412.6L265.8 413.2L264.8 414L263.9 414.8L262.9 415.6L262 416.6L261.2 417.6L260.3 418.7L259.5 419.8L258.7 421L258 422.2L257.3 423.4L256.7 424.7L256.1 426.1L255.5 427.4L255.1 428.8"/><path class="ew-stream ew-jet" style="--w:0.55" d="M288.8 434.8L288.4 432.2L288 429.7L287.4 427.5L286.9 425.4L286.3 423.4L285.6 421.7L284.9 420.1L284.2 418.7L283.5 417.4L282.7 416.2L281.9 415.3L281 414.4L280.1 413.7L279.3 413.1L278.4 412.7L277.4 412.3L276.5 412.1L275.6 412L274.6 412L273.7 412.1L272.7 412.3L271.8 412.6L270.8 412.9L269.9 413.4L268.9 413.9L268 414.5L267.1 415.2L266.2 415.9L265.4 416.7L264.6 417.6L263.7 418.5L263 419.4L262.2 420.4L261.5 421.4L260.9 422.4L260.2 423.5L259.6 424.6L259.1 425.7L258.6 426.8"/></g></g></g></svg><span class="ew-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Nước sạch: tia sen hình nón, hai tia rửa mắt, nước trong ống cấp (ô cắt)</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Tay đẩy dạng cờ của van rửa mắt: đẩy về phía tường là mở và giữ mở</span><span class="iso-key"><svg class="iso-swatch" data-mark="green" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Vùng nước ấm 16–38 °C trên nhiệt kế; biển báo khẩn cấp xanh lá</span></span><span class="iso-caption">Trạm vẽ theo Guardian Equipment G1902 (spec sheet rev. 052319): ống thép mạ kẽm Schedule 40 bọc nhựa cam, đế nhôm đúc Ø 229 mm; đầu sen ABS Ø 254 mm, mép dưới cao 2105 mm, cách trục ống 610 mm, bộ điều lưu 20 gpm (75,7 L/phút); van bi 1&quot; stay-open có cần tác động và thanh kéo inox 737 mm với tay kéo tam giác; chậu inox Ø 283 mm, miệng cao 953 mm, hai đầu phun GS-Plus cách nhau 165 mm, mỗi đầu có nắp chống bụi lật; van bi 1/2&quot; mở bằng tay đẩy dạng cờ cao 127 mm. ANSI/ISEA Z358.1-2014: rửa đủ 15 phút với ít nhất 1,5 L/phút (rửa mắt) và 75,7 L/phút (vòi sen), nước ấm 16–38 °C, tới được trong 10 s (khoảng 17 m), đầu sen cao 2083–2438 mm, tia sen rộng ≥ 508 mm ở 1524 mm, kích hoạt thử hằng tuần. Đồng hồ tua nhanh 60 lần (1 s là 1 phút). Ống cấp đi đồng tâm qua ống xả chậu, nút ngăn giữa hai tê dưới chậu và ruột van bi vẽ theo cấu tạo điển hình (van stay-open không có lò xo); lưu lượng của đầu GS-Plus lấy theo mức tối thiểu của tiêu chuẩn; độ loe tia sen, độ đục khi xả kiểm tra là số minh hoạ.</span></figcaption></figure></main><script type="module">// Mô hình trạm tắm và rửa mắt khẩn cấp kết hợp (combination emergency shower + eyewash), dùng chung cho
// bản dựng (Node), trang hình (trình duyệt) và lõi mô phỏng của app. Module thuần: không DOM, không Three.js.
//
// Máy làm mẫu: Guardian Equipment G1902 "Safety Station with Eyewash, Stainless Steel Bowl". Nguồn:
// - Spec sheet G1902 rev. 052319 (https://ww.gesafety.com/downloads/G1902.pdf), bản vẽ dung sai ± 6 mm:
//   · đầu sen ABS Ø 254 mm (10"), bộ điều lưu 20 GPM (75,7 L/phút); mép dưới đầu sen cao 2105 mm (82 7/8");
//     tâm đầu sen cách trục ống đứng 610 mm (24"); cao tổng 2261 mm (89");
//   · van tắm: van bi 1" IPS đồng mạ crôm, "stay-open" (mở rồi giữ nguyên), bi đồng mạ crôm, gioăng PTFE;
//     cần tác động inox và thanh kéo inox 29" (737 mm) có tay kéo tam giác; đầu thanh kéo thấp hơn ống ngang 597 mm (23 5/8");
//   · chậu rửa mắt inox Ø 283 mm (11 1/8"), miệng chậu cao 953 mm (37 1/2"); hai đầu phun GS-Plus cách nhau 165 mm (6 1/2"),
//     mỗi đầu có nắp chống bụi lật ("flip top"), bộ điều lưu và lưới lọc bên trong;
//   · van rửa mắt: van bi 1/2" IPS đồng mạ crôm, stay-open; tay đẩy dạng cờ (flag handle) nhôm đúc sơn tĩnh điện, cao 127 mm (5");
//   · ống và phụ kiện thép mạ kẽm Schedule 40, bọc ống polyethylene màu cam; đế nhôm đúc Ø 229 mm (9"),
//     khe bắt bu lông Ø 7/16" trên vòng Ø 7 5/8" (194 mm);
//   · cấp nước 1 1/4" NPT cái ở đỉnh hoặc ở hông (hông 1645 mm = 64 3/4", nút bịt); thoát 1 1/4" NPT cái ở 235 mm (9 1/4"),
//     đổi hai đoạn ống dưới thì lên 498 mm (19 5/8"); kèm biển báo theo ANSI; tuỳ chọn van trộn ổn nhiệt G6040.
// - ANSI/ISEA Z358.1-2014 (số liệu đã có trong data/safety.json mục "emergency"; bản vẽ lắp đặt Haws 8300-8309
//   https://res.cloudinary.com/dzhpkjoqj/Haws/8300-8300CRP.pdf chép lại các yêu cầu vị trí):
//   · rửa mắt ≥ 1,5 L/phút (0,4 gpm) trong 15 phút; vòi sen ≥ 75,7 L/phút (20 gpm) trong 15 phút;
//   · nước ấm (tepid) 16–38 °C; tới được trong 10 s (phụ lục: khoảng 17 m = 55 ft ở tốc độ đi bộ thường);
//   · đầu sen cao 2083–2438 mm (82–96"); tia sen phủ đường kính ≥ 508 mm (20") ở độ cao 1524 mm (60");
//     tâm tia cách vật cản ≥ 406 mm (16");
//   · dòng rửa mắt nằm trong 838–1346 mm (33–53") tính từ sàn, cách tường ≥ 153 mm (6");
//   · cần gạt van tắm cao không quá 1733 mm (69") (Z358.1 mục 4.2; theo bản tóm tắt, chưa đối chiếu bản gốc);
//   · van mở trong ≤ 1 s và tự giữ mở (rảnh hai tay); kích hoạt thử hằng tuần, kiểm tra toàn bộ hằng năm.
//
// Giả định (chưa xác minh hoặc minh hoạ):
// - Lưu lượng thật của cặp đầu GS-Plus không ghi trên spec sheet: dùng mức tối thiểu của Z358.1 (1,5 L/phút). Chưa xác minh.
// - Ống chia: tầng giữa hai tê dưới chậu ngăn nước cấp (phía trên) với nước thải từ chậu (phía dưới), ống cấp rửa mắt
//   đi đồng tâm lên qua ống xả của chậu, ruột van bi: vẽ theo cấu tạo điển hình, hãng không công bố sơ đồ bên trong.
//   Van bi stay-open không có lò xo (bi giữ vị trí nhờ ma sát gioăng PTFE), nên hình không vẽ lò xo.
// - Độ loe tia sen 0,5 mm đường kính mỗi mm rơi (từ Ø 254 ở 2105 mm thành Ø 544 mm ở 1524 mm, đạt ≥ 508): MINH HOẠ.
// - Độ đục khi xả kiểm tra hằng tuần: giảm theo hàm mũ của thể tích đã xả so với thể tích nước tù trong trạm và nhánh
//   ống cấp (giả định 5 m ống 1 1/4"): MINH HOẠ, chỉ cho đúng chiều hướng "xả đến khi nước trong".
// - Đỉnh tia rửa mắt 1060 mm (khoảng 107 mm trên miệng chậu): MINH HOẠ, nằm trong vùng 838–1346 mm của Z358.1.

const IN = 25.4; // mm cho 1 inch
const GPM = 3.785411784; // L/phút cho 1 US gpm

/** Kích thước và thông số trạm (Guardian G1902). Chiều dài mm, lưu lượng L/phút. */
const STATION = {
  model: "Guardian Equipment G1902",
  height: 89 * IN, // 2261, cao tổng
  head: { d: 10 * IN, bottom: 2105, reach: 24 * IN, flow: 20 * GPM }, // đầu sen Ø 254, mép dưới 2105, tâm cách trục ống 610
  arm: 2228, // tâm ống ngang của vòi sen (suy từ bản vẽ: mép dưới đầu sen + chiều cao cổ đầu sen)
  rod: { length: 29 * IN, belowArm: 597, pull: 268 }, // thanh kéo 737 mm; kéo xuống 268 mm khi cần quay 90°
  bowl: { d: 283, rim: 953, heads: 165, axis: 235 }, // chậu Ø 283, miệng 953, hai đầu phun cách 165, tâm chậu cách trục ống 235
  flag: { h: 5 * IN }, // tay đẩy cao 127 mm
  flange: { d: 9 * IN, boltCircle: 7.625 * IN }, // đế Ø 229, vòng bu lông Ø 194
  sideInlet: 1645, // 64 3/4", nút bịt
  waste: { low: 235, high: 498 }, // cửa thoát 9 1/4" hoặc 19 5/8"
  pipe: { main: 42.2, branch: 33.4, eye: 21.3 }, // đường kính ngoài ống thép Sch 40: 1 1/4", 1", 1/2" (ASME B36.10)
  bore: { main: 35.1, branch: 26.6, eye: 15.8 }, // đường kính trong tương ứng
  eyeFlow: 1.5, // L/phút: mức tối thiểu Z358.1 (lưu lượng thật của GS-Plus chưa xác minh)
};

/** Các ngưỡng của ANSI/ISEA Z358.1-2014. */
const Z358 = {
  eyeFlow: 1.5, // L/phút tối thiểu
  showerFlow: 75.7, // L/phút tối thiểu
  minutes: 15,
  tepid: [16, 38], // °C
  reachSeconds: 10,
  reachMeters: 17, // phụ lục: khoảng 55 ft
  showerHead: [2083, 2438], // mm
  spray: { d: 508, at: 1524, clear: 406 }, // mm
  eyePattern: [838, 1346], // mm
  actuatorMax: 1733, // mm, cần gạt van tắm (chưa đối chiếu bản gốc)
  wall: 153, // mm
};

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/**
 * Lưu lượng theo chế độ (L/phút).
 * @param {"off"|"eyewash"|"shower"|"both"} mode
 * @returns {{ eyewash: number, shower: number, total: number }}
 */
function flowOf(mode, s = STATION) {
  const eyewash = mode === "eyewash" || mode === "both" ? s.eyeFlow : 0;
  const shower = mode === "shower" || mode === "both" ? s.head.flow : 0;
  return { eyewash, shower, total: eyewash + shower };
}

/**
 * Lượng nước đã dùng (L) sau một số phút chạy liên tục.
 * @param {"off"|"eyewash"|"shower"|"both"} mode
 * @param {number} minutes
 */
function waterUsed(mode, minutes, s = STATION) {
  return flowOf(mode, s).total * Math.max(0, minutes);
}

/**
 * Nhiệt độ nước so với khoảng nước ấm 16–38 °C của Z358.1.
 * @param {number} waterC °C
 * @returns {{ state: "cold"|"ok"|"hot", message: string }}
 */
function tempStatus(waterC) {
  if (waterC < Z358.tepid[0]) return { state: "cold", message: "Lạnh dưới 16 °C: người bị nạn run, bỏ dở trước 15 phút, nguy cơ hạ thân nhiệt" };
  if (waterC > Z358.tepid[1]) return { state: "hot", message: "Nóng trên 38 °C: bỏng da, giãn mạch làm hoá chất thấm nhanh hơn" };
  return { state: "ok", message: "Nước ấm trong khoảng 16–38 °C" };
}

/**
 * Khoảng cách đi được trong t giây ở tốc độ đi bộ thường (Z358.1 phụ lục: 10 s ≈ 17 m, tức khoảng 1,7 m/s).
 * @param {number} [seconds]
 * @returns {number} m
 */
function reachDistance(seconds = Z358.reachSeconds) {
  return (Z358.reachMeters / Z358.reachSeconds) * seconds;
}

/**
 * Đường kính tia sen (mm) ở độ cao z (MINH HOẠ: loe 0,5 mm mỗi mm rơi từ mặt đầu sen).
 * @param {number} z mm
 */
function sprayDiameter(z, s = STATION) {
  return s.head.d + 0.5 * Math.max(0, s.head.bottom - z);
}

/** Thể tích nước tù (L) trong trạm và nhánh ống cấp: ống đứng từ tê rửa mắt tới đỉnh, ống ngang 1", 5 m ống cấp (giả định). */
function deadVolume(s = STATION) {
  const area = (d) => (Math.PI * (d / 2) ** 2) / 1e6; // m²
  const column = area(s.bore.main) * ((s.arm - 790) / 1000);
  const arm = area(s.bore.branch) * (s.head.reach / 1000);
  const branch = area(s.bore.main) * 5;
  return (column + arm + branch) * 1000;
}

/**
 * Độ đục còn lại (0–1) sau khi xả V lít (MINH HOẠ): exp(−V / V_tù). "Trong" khi dưới 0,05.
 * @param {number} litres
 */
function turbidity(litres, s = STATION) {
  return Math.exp(-Math.max(0, litres) / deadVolume(s));
}

/**
 * Kiểm tra các độ cao của trạm theo Z358.1.
 * @returns {{ name: string, value: number, range: number[], ok: boolean }[]}
 */
function heightChecks(s = STATION) {
  const actuator = s.arm - s.rod.belowArm;
  const eyePeak = 1060;
  return [
    { name: "đầu sen", value: s.head.bottom, range: Z358.showerHead, ok: s.head.bottom >= Z358.showerHead[0] && s.head.bottom <= Z358.showerHead[1] },
    { name: "tia sen ở 1524 mm", value: sprayDiameter(Z358.spray.at, s), range: [Z358.spray.d, Infinity], ok: sprayDiameter(Z358.spray.at, s) >= Z358.spray.d },
    { name: "dòng rửa mắt", value: eyePeak, range: Z358.eyePattern, ok: eyePeak >= Z358.eyePattern[0] && eyePeak <= Z358.eyePattern[1] },
    { name: "tay kéo", value: actuator, range: [0, Z358.actuatorMax], ok: actuator <= Z358.actuatorMax },
  ];
}

/**
 * Toàn bộ trạng thái trạm cho một lựa chọn của người dùng.
 * @param {{ mode?: "off"|"eyewash"|"shower"|"both", minutes?: number, waterC?: number, flushedL?: number }} [input]
 *   minutes: số phút đã chạy (0–15 hoặc hơn); waterC: nhiệt độ nước; flushedL: số lít đã xả từ lúc nước đứng yên (để tính độ đục).
 * @returns {{ mode: string, minutes: number, remaining: number, waterC: number, flow: object, used: number,
 *   temp: object, turbidity: number, clear: boolean, done: boolean, ok: boolean, message: string }}
 *   done: đã đủ 15 phút; ok: đang chạy, nước ấm và nước trong.
 */
function stationState({ mode = "eyewash", minutes = 0, waterC = 25, flushedL = Infinity } = {}, s = STATION) {
  mode = ["off", "eyewash", "shower", "both"].includes(mode) ? mode : "eyewash";
  minutes = clamp(Number(minutes) || 0, 0, 120);
  waterC = clamp(Number(waterC) || 0, 1, 60);
  const flow = flowOf(mode, s);
  const used = flow.total * minutes;
  const temp = tempStatus(waterC);
  const turb = Number.isFinite(flushedL) ? turbidity(flushedL, s) : 0;
  const clear = turb < 0.05;
  const done = mode !== "off" && minutes >= Z358.minutes;
  let message;
  if (mode === "off") message = "Van đóng";
  else if (!clear) message = "Nước đục: xả tiếp đến khi trong";
  else if (temp.state !== "ok") message = temp.message;
  else if (done) message = "Đủ 15 phút rửa";
  else message = "Đang rửa, cần đủ 15 phút";
  return {
    mode, minutes, remaining: Math.max(0, Z358.minutes - minutes), waterC, flow, used, temp,
    turbidity: turb, clear, done, ok: mode !== "off" && clear && temp.state === "ok", message,
  };
}

/**
 * Định dạng số kiểu Việt Nam (dấu phẩy thập phân).
 * @param {number} v
 * @param {number} [digits]
 */
const vn = (v, digits = 1) => v.toFixed(digits).replace(".", ",");

// Phần chạy trong trang: kéo thanh tam giác (cần quay, bi van quay, thanh đi xuống), đẩy tay cờ, nắp chống bụi bật,
// nước chảy (sen hình nón, hai tia rửa mắt, nước trong ô cắt), đồng hồ 15 phút tua nhanh, nhiệt kế, kiểm tra hằng tuần.
// Mô hình số liệu (STATION, Z358, stationState, flowOf, turbidity, vn…) được nhúng ngay trước file này từ model.mjs.
const D = {"statics":[0.5,0.52,5.804,6.437,12.375,17.044,18.312,24.25,29.375,32.807,33.695,34.5,35.195,47.824,48.177,58.437,62.695,82.375,87.5,91.301,93.125,98.75,102.068,103.875,108.392,111.461,122.884,124.868,125.31,129.562,131.261,131.625,133.925,134.619,136.56,139.748,143.456,148.81,156.57,160,175.312,190.625,195.875,195.895,200.5,205.625,208.912,210.75,218.859,228.804,238.073,242.062,242.726,245.054,250.742,260.679,263.836,268.241,271.62,273.375,273.999,278.5,281.979,283.812,285.5,287.992,300.623,313.054,323.229,323.679,325.937,328.879,352.142,352.162,361.519,366.832,372.582,373.882,376.582],"axes":{"x":[0.21961,0.09887],"y":[-0.19774,0.10981],"z":[0,-0.25593]},"lever":{"frames":9,"len":190,"rest":0.7853981633974483,"open":-0.7853981633974483,"pull":268},"flag":{"frames":9},"cover":{"frames":7},"dial":{"start":225,"sweep":270,"max":60},"lift":-133.99999999999997};
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const $ = (sel) => svgEl.querySelector(sel);
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

// Lựa chọn của người dùng do app truyền qua địa chỉ (…eyewash.html#run=<JSON>):
// { "mode": "eyewash" | "shower" | "both" | "off", "minutes": 15, "waterC": 25, "reachS": 8, "weekly": false }
const RUN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();

const REACH = RUN && Number.isFinite(Number(RUN.reachS)) ? Number(RUN.reachS) : null; // giây đi tới trạm (Z358.1: ≤ 10 s)
const SPEED = 60; // phút ảo mỗi phút thật: 1 s là 1 phút
const WEEKLY_SPEED = 6; // kiểm tra tuần chậm hơn để thấy nước trong dần
const doc = $('[data-part="doc"]');
const waterLayer = $('[data-layer="water"]');
const movers = [...svgEl.querySelectorAll(".ew-moving")].map((node) => ({ node, key: Number(node.dataset.key), mx: Number(node.dataset.mx), my: Number(node.dataset.my), lift: Number(node.dataset.lift) }));
const staticNodes = [...doc.children].filter((n) => n.dataset.key !== undefined && !n.classList.contains("ew-moving"));
const staticKeys = staticNodes.map((n) => Number(n.dataset.key));
const leverFrames = [...svgEl.querySelectorAll("[data-lf]")];
const valveFrames = [...svgEl.querySelectorAll("[data-vf]")];
const flagFrames = [...svgEl.querySelectorAll("[data-ff]")];
const coverFrames = [-1, 1].map((side) => [...svgEl.querySelectorAll(`[data-cover="${side}"] [data-cf]`)]);
const needle = $("[data-needle]");

const TEMPS = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50];
const state = {
  shower: { x: 0, target: 0 }, // độ mở van (0–1)
  eye: { x: 0, target: 0 },
  cover: 0, // nắp chống bụi (0 đậy, 1 bật hết)
  coverTarget: 0,
  waterC: 25,
  dialC: 25,
  minutes: 0, // phút ảo từ lúc mở van
  used: 0, // lít đã dùng
  flushedL: Infinity, // lít đã xả từ lúc nước đứng yên (Infinity: nước đã trong)
  weekly: null, // { start, clearAt } khi đang kiểm tra hằng tuần
  flowT: 0,
  drain: 0,
  clock: 0,
  note: null,
  closeAt: 0,
};
if (RUN) {
  const mode = ["off", "eyewash", "shower", "both"].includes(RUN.mode) ? RUN.mode : "eyewash";
  state.eye.x = state.eye.target = mode === "eyewash" || mode === "both" ? 1 : 0;
  state.shower.x = state.shower.target = mode === "shower" || mode === "both" ? 1 : 0;
  state.cover = state.coverTarget = state.eye.x;
  state.waterC = state.dialC = Math.max(1, Math.min(60, Number(RUN.waterC ?? 25) || 25));
  state.minutes = Math.max(0, Math.min(120, Number(RUN.minutes ?? 0) || 0));
  state.used = waterUsed(mode, state.minutes);
  state.drain = state.eye.x;
  if (RUN.weekly) { state.flushedL = 0; state.weekly = { start: 0 }; }
}
const modeOf = () => {
  const e = state.eye.target > 0.5;
  const s = state.shower.target > 0.5;
  return e && s ? "both" : e ? "eyewash" : s ? "shower" : "off";
};

// ——— Màu nước: theo nhiệt độ (lạnh xanh đậm, ấm xanh nhạt, nóng cam) và độ đục (nâu gỉ) ———
function waterColor(c, turb) {
  const t = tempStatus(c).state;
  const base = t === "cold" ? "var(--ew-water-cold)" : t === "hot" ? "var(--ew-water-hot)" : "var(--ew-water-ok)";
  const rust = Math.round(Math.min(1, turb * 1.4) * 85);
  return rust > 1 ? `color-mix(in oklab, var(--ew-water-rust) ${rust}%, ${base})` : base;
}

// ——— Cần tác động và thanh kéo: cần quay quanh trục van, đầu cần kéo thanh đi xuống (và ra trước một chút) ———
const tipOffset = (t) => {
  const th = D.lever.rest + (D.lever.open - D.lever.rest) * t;
  const y = D.lever.len * (Math.cos(th) - Math.cos(D.lever.rest));
  const z = D.lever.len * (Math.sin(th) - Math.sin(D.lever.rest));
  return { y, z, share: -z / D.lever.pull };
};
const showFrame = (list, i) => list.forEach((node, j) => { const want = j === i ? "" : "none"; if (node.style.display !== want) node.style.display = want; });
let drawnLever = null;
function drawLever() {
  const t = state.shower.x;
  if (drawnLever !== null && Math.abs(t - drawnLever) < 1e-4) return;
  drawnLever = t;
  const i = Math.round(t * (D.lever.frames - 1));
  showFrame(leverFrames, i);
  showFrame(valveFrames, i);
  const { y, z, share } = tipOffset(t);
  const dx = D.axes.y[0] * y + D.axes.z[0] * z;
  const dy = D.axes.y[1] * y + D.axes.z[1] * z;
  // xếp lại chỗ vẽ của các phần thanh kéo theo khoá độ sâu (như kính trượt của tủ hút)
  const slot = movers.map((part) => {
    const key = part.key + part.lift * share;
    let i = 0;
    while (i < staticKeys.length && staticKeys[i] <= key) i++;
    return { part, i, key };
  });
  slot.sort((a, b) => a.key - b.key);
  for (let j = slot.length - 1; j >= 0; j--) {
    const { part, i } = slot[j];
    part.node.setAttribute("transform", `translate(${dx.toFixed(2)} ${dy.toFixed(2)})`);
    const before = j + 1 < slot.length && slot[j + 1].i === i ? slot[j + 1].part.node : i < staticNodes.length ? staticNodes[i] : waterLayer;
    if (part.node.nextSibling !== before) doc.insertBefore(part.node, before);
  }
}
function drawFlag() {
  showFrame(flagFrames, Math.round(state.eye.x * (D.flag.frames - 1)));
  const i = Math.round(state.cover * (D.cover.frames - 1));
  coverFrames.forEach((list) => showFrame(list, i));
}

const say = (text) => { state.note = null; if (status.textContent !== text) status.textContent = text; };
const note = (text, seconds = 2.6) => { say(text); state.note = { text, until: state.clock + seconds }; };
function setEye(on) {
  state.eye.target = on ? 1 : 0;
  if (on) { state.coverTarget = 1; if (modeOf() === "eyewash") resetTimer(); say("Đẩy tay cờ: van rửa mắt mở và giữ mở, nắp chống bụi bật ra."); }
  else say("Kéo tay cờ về: đóng van rửa mắt.");
}
function setShower(on) {
  state.shower.target = on ? 1 : 0;
  if (on && modeOf() === "shower") resetTimer();
  say(on ? "Kéo tay tam giác: van sen mở và giữ mở." : "Đẩy cần lên: đóng van sen.");
}
function resetTimer() { state.minutes = 0; state.used = 0; }
function closeAll() { state.eye.target = 0; state.shower.target = 0; state.weekly = null; say("Đóng tất cả van."); }
function stepTemp(dir) {
  const i = TEMPS.findIndex((c) => c >= state.waterC - 0.1);
  const next = TEMPS[Math.max(0, Math.min(TEMPS.length - 1, (i < 0 ? TEMPS.length - 1 : i) + dir))];
  state.waterC = next;
  const t = tempStatus(next);
  if (t.state === "ok") note(`Nước ${next} °C: trong khoảng ấm 16–38 °C.`);
  else note(`Nước ${next} °C: ${t.state === "cold" ? "lạnh quá" : "nóng quá"}, cảnh báo.`, 3.2);
}
function weeklyTest() {
  state.flushedL = 0;
  state.weekly = { start: state.minutes };
  state.eye.target = 1;
  state.shower.target = 1;
  state.coverTarget = 1;
  resetTimer();
  say("Kiểm tra hằng tuần: mở cả hai van, xả đến khi nước trong.");
}

const ease = (cur, target, dt, tau) => cur + (target - cur) * (1 - Math.exp(-dt / tau));
function update(dt, calm) {
  state.clock += dt;
  // van mở trong dưới 1 s (Z358.1), đóng chậm hơn một chút
  for (const v of [state.shower, state.eye]) {
    v.x = calm ? v.target : ease(v.x, v.target, dt, v.target > v.x ? 0.18 : 0.3);
    if (Math.abs(v.x - v.target) < 2e-3) v.x = v.target;
  }
  // nắp bật khi nước lên (áp lực đẩy nắp), đậy lại sau khi đóng van một lúc
  if (state.eye.target === 0 && state.eye.x === 0 && state.coverTarget === 1 && !RUN) {
    if (!state.closeAt) state.closeAt = state.clock + 1.6;
    if (state.clock >= state.closeAt) { state.coverTarget = 0; state.closeAt = 0; }
  } else state.closeAt = 0;
  const coverGoal = state.coverTarget && state.eye.x > 0.15 ? 1 : state.coverTarget && state.cover > 0.5 ? 1 : 0;
  state.cover = calm ? coverGoal : ease(state.cover, coverGoal, dt, coverGoal > state.cover ? 0.08 : 0.35);
  if (Math.abs(state.cover - coverGoal) < 2e-3) state.cover = coverGoal;
  state.dialC = calm ? state.waterC : ease(state.dialC, state.waterC, dt, 0.6);
  // đồng hồ ảo: chạy khi có van mở
  const mode = modeOf();
  const flow = flowOf(mode);
  const open = Math.max(state.eye.x * (flow.eyewash > 0 ? 1 : 0), state.shower.x * (flow.shower > 0 ? 1 : 0));
  if (!calm && !RUN && mode !== "off" && open > 0.5) {
    const speed = state.weekly ? WEEKLY_SPEED : SPEED;
    const dm = (dt * speed) / 60;
    state.minutes += dm;
    state.used += flow.total * dm;
    if (Number.isFinite(state.flushedL)) state.flushedL += flow.total * dm;
    if (state.weekly && turbidity(state.flushedL) < 0.05 && !state.weekly.clearAt) {
      state.weekly.clearAt = state.clock;
      note(`Nước trong sau ${Math.round(state.flushedL)} L: kiểm tra tuần đạt.`, 3.4);
    }
    if (state.weekly?.clearAt && state.clock - state.weekly.clearAt > 2.2) {
      state.weekly = null;
      state.flushedL = Infinity;
      state.eye.target = 0;
      state.shower.target = 0;
    }
  }
  state.drain = calm ? state.eye.x : ease(state.drain, state.eye.x, dt, state.eye.x > state.drain ? 0.6 : 1.4);
  if (!calm) state.flowT += dt;
}

const mmss = (min) => { const s = Math.round(min * 60); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
function draw() {
  drawLever();
  drawFlag();
  const turb = Number.isFinite(state.flushedL) ? turbidity(state.flushedL) : 0;
  const ramp = (x) => Math.max(0, Math.min(1, (x - 0.15) / 0.6));
  const eyeOn = ramp(state.eye.x) * ramp(state.cover);
  svgEl.style.setProperty("--water", waterColor(state.waterC, turb));
  svgEl.style.setProperty("--shower", ramp(state.shower.x).toFixed(3));
  svgEl.style.setProperty("--eye", eyeOn.toFixed(3));
  svgEl.style.setProperty("--drain", state.drain.toFixed(3));
  // nét đứt chạy theo dòng: sen rơi nhanh, tia rửa mắt chậm (dòng êm), nước trong ống cấp đi lên hoặc xuống
  svgEl.style.setProperty("--flow-shower", (-state.flowT * 60).toFixed(1));
  svgEl.style.setProperty("--flow-eye", (-state.flowT * 18).toFixed(1));
  svgEl.style.setProperty("--flow-up", (state.flowT * 14).toFixed(1));
  svgEl.style.setProperty("--flow-down", (-state.flowT * 14).toFixed(1));
  needle?.setAttribute("transform", `rotate(${(-(D.dial.start - (Math.max(0, Math.min(D.dial.max, state.dialC)) / D.dial.max) * D.dial.sweep)).toFixed(2)})`);
  const m = stationState({ mode: modeOf(), minutes: state.minutes, waterC: state.waterC, flushedL: state.flushedL });
  const label = { off: "Van đóng", eyewash: "Rửa mắt", shower: "Tắm", both: "Tắm+mắt" }[m.mode];
  let tail = "";
  if (state.weekly) tail = turb < 0.05 ? " · nước trong" : ` · đục ${Math.round(turb * 100)} %`;
  else if (m.mode !== "off" && m.temp.state === "cold") tail = " · lạnh quá";
  else if (m.mode !== "off" && m.temp.state === "hot") tail = " · nóng quá";
  else if (m.done) tail = " · đủ 15 phút";
  const litres = m.used >= 100 ? Math.round(m.used) : vn(m.used);
  let text = m.mode === "off"
    ? `${label} · ${state.waterC} °C · ${REACH === null ? "tới trạm ≤ 10 s" : REACH <= Z358.reachSeconds ? `tới trạm ${vn(REACH, 0)} s` : `tới trạm ${vn(REACH, 0)} s: quá 10 s`}`
    : `${state.weekly ? "Thử tuần" : label} ${mmss(Math.min(m.minutes, 99))}/15:00 · ${litres} L · ${state.waterC} °C${tail}`;
  if (state.note && state.clock < state.note.until) text = state.note.text;
  if (readout.textContent !== text) readout.textContent = text;
  svgEl.toggleAttribute("data-warn", m.mode !== "off" && m.temp.state !== "ok");
}

// ——— Vòng lặp, tour tự chạy ———
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches && !RUN;
const TOUR = [
  [2.5, () => setEye(true)],
  [6, () => stepTemp(-1)],
  [2.5, () => { stepTemp(-1); stepTemp(-1); stepTemp(-1); }],
  [3, () => { state.waterC = 25; setEye(false); }],
  [3, () => setShower(true)],
  [5, () => { stepTemp(1); stepTemp(1); stepTemp(1); stepTemp(1); }],
  [3, () => { state.waterC = 25; setShower(false); }],
  [3, () => weeklyTest()],
  [9, () => closeAll()],
];
let tour = { i: 0, wait: TOUR[0][0] };
let idleTimer = 0;
function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  TOUR[tour.i][1]();
  tour.i = (tour.i + 1) % TOUR.length;
  tour.wait = TOUR[tour.i][0];
}
function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  update(dt, calm);
  draw();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || RUN) return; tour = { i: 0, wait: 1 }; touring = true; loop(); }, 14000);
}
function settleStill() { update(0, true); draw(); }
// Giảm chuyển động mà không có #run: một khung tiêu biểu đứng yên (đang rửa mắt, phút thứ 3, nước 25 °C)
if (still.matches && !RUN) { state.eye.target = state.eye.x = 1; state.coverTarget = state.cover = 1; state.minutes = 3; state.used = waterUsed("eyewash", 3); }

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  if (!["e", " ", "s", "ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "w", "0", "Escape"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === "e" || key === " ") setEye(state.eye.target < 0.5);
  else if (key === "s" || key === "ArrowDown") setShower(state.shower.target < 0.5);
  else if (key === "ArrowUp") setShower(false);
  else if (key === "ArrowLeft") stepTemp(-1);
  else if (key === "ArrowRight") stepTemp(1);
  else if (key === "w") weeklyTest();
  else closeAll();
  if (still.matches) settleStill();
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest(".ew-pull")) setShower(state.shower.target < 0.5);
  else setEye(state.eye.target < 0.5);
  stage.focus({ preventScroll: true });
  if (still.matches) settleStill();
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));
settleStill();
</script></body></html>
