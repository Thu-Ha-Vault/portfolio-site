<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Máy LC-MS/MS</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình LC-MS/MS: mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng. */
.iso {
  --lc-glass: #9cc4d6;
  --lc-liquid: #4f8fb0;
  --lc-acn: #8fb7c9;
  --lc-oil: #c9a54a;
  --lc-sample: #e0a33a;
  --lc-ion: #ffd36b;
  --lc-ion-core: #fff4d6;
  --lc-frag: #6fe0b8;
  --lc-other: #8aa0ae;
  --lc-matrix: #b07a8c;
  --lc-electron: #9fc8ff;
  --lc-spray: #a9d4ff;
  --lc-hot: #ff8a4a;
  --lc-led: #4be08a;
  --lc-led-run: #5aa9ff;
  --lc-void: #07090b;
  --lc-window: #0d1419;
  --lc-vial: #3a4a55;
  --lc-screen-bg: #0c161e;
  --lc-screen-bar: #17242f;
  --lc-screen-ink: #d6ebf5;
  --lc-screen-dim: #6c8797;
  --lc-trace: #ffb547;
  --lc-grid: #2a3b48;
}
.iso[data-theme="light"] {
  --lc-glass: #6fa3bb;
  --lc-liquid: #3d86ad;
  --lc-acn: #79a9c0;
  --lc-oil: #b08a2a;
  --lc-sample: #d1871b;
  --lc-ion: #d98a00;
  --lc-ion-core: #ffcf5c;
  --lc-frag: #13a37a;
  --lc-other: #7f909b;
  --lc-matrix: #a2566e;
  --lc-electron: #2f7fd6;
  --lc-spray: #3d86d6;
  --lc-hot: #e0601c;
  --lc-led: #2fb562;
  --lc-led-run: #2f7fd6;
  --lc-void: #2b3238;
  --lc-window: #26323a;
  --lc-vial: #7c8d98;
  --lc-screen-bg: #1d2b36;
  --lc-screen-bar: #263845;
  --lc-screen-ink: #e9f2f7;
  --lc-screen-dim: #8fa6b4;
  --lc-trace: #ffb03b;
  --lc-grid: #3a4e5c;
}

/* Thuỷ tinh (chai, cửa kính buồng nguồn): nền trong mờ, thấy chất lỏng và tia phun bên trong. */
.lc-glass .iso-fill { fill: var(--lc-glass); fill-opacity: 0.1; }
.lc-glass .iso-top { fill: var(--lc-glass); fill-opacity: 0.16; }
.lc-glass .iso-shade { fill: var(--lc-glass); fill-opacity: 0.2; stroke: none; }
.lc-glass .iso-solid[data-seamless] > .iso-shade[data-shade], .lc-glass .iso-solid[data-seamless] > .iso-top,
.lc-liquid .iso-solid[data-seamless] > .iso-shade[data-shade], .lc-liquid .iso-solid[data-seamless] > .iso-top { stroke: none; }
.lc-liquid .iso-fill, .lc-liquid .iso-top, .lc-liquid .iso-shade { fill: var(--lc-liquid); fill-opacity: 0.32; stroke: none; }
.lc-liquid[data-liquid="B"] .iso-fill, .lc-liquid[data-liquid="B"] .iso-top, .lc-liquid[data-liquid="B"] .iso-shade { fill: var(--lc-acn); fill-opacity: 0.26; }
.lc-meniscus { fill: none; stroke: var(--lc-liquid); stroke-width: 0.5px; vector-effect: non-scaling-stroke; opacity: 0.8; }
.lc-oil { fill: var(--lc-oil); opacity: 0.75; }

.lc-slot { fill: var(--anatomy-shade-0); }
.lc-void { fill: var(--lc-void); }
.lc-window { fill: var(--lc-window); }
.lc-vial { fill: var(--lc-vial); }

/* Khối gia nhiệt của DL: dải đỏ cam sáng dần khi máy chạy */
.lc-hot .iso-fill, .lc-hot .iso-top, .lc-hot .iso-shade { fill: var(--lc-hot); stroke: none; }
.lc-hot { opacity: 0.35; transition: opacity 0.6s var(--anatomy-ease); }
.lc-run .lc-hot { opacity: 0.85; }

/* Đèn trạng thái */
.lc-led circle, .lc-led2 circle { fill: var(--lc-led); }
.lc-run .lc-led [data-i="2"] circle, .lc-run .lc-led2 circle { fill: var(--lc-led-run); }

/* Lớp hạt: giọt phun, ion, điện tử (vẽ trên cùng, tắt dưới giảm chuyển động trừ khung tĩnh) */
.lc-ions circle { stroke: none; }
.lc-ions .d { fill: var(--lc-spray); }
.lc-ions .p { fill: var(--lc-ion); }
.lc-ions .f { fill: var(--lc-frag); }
.lc-ions .o { fill: var(--lc-other); }
.lc-ions .m { fill: var(--lc-matrix); }
.lc-ions .e { fill: var(--lc-electron); }
.lc-ions .flash { fill: var(--lc-ion-core); }
.lc-cone { fill: var(--lc-spray); opacity: 0; transition: opacity 0.4s var(--anatomy-ease); }
.lc-run .lc-cone { opacity: 0.9; }
.lc-plug { fill: var(--lc-sample); }

/* Màn hình máy tính */
.lc-scr-bg { fill: var(--lc-screen-bg); }
.lc-scr-bar { fill: var(--lc-screen-bar); }
.lc-scr-title, .lc-scr-text, .lc-scr-dim, .lc-scr-peak { font-family: var(--anatomy-mono); fill: var(--lc-screen-ink); }
.lc-scr-dim { fill: var(--lc-screen-dim); }
.lc-scr-peak { fill: var(--lc-trace); }
.lc-axis { fill: none; stroke: var(--lc-screen-dim); stroke-width: 0.5px; vector-effect: non-scaling-stroke; }
.lc-gridline { fill: none; stroke: var(--lc-grid); stroke-width: 0.4px; vector-effect: non-scaling-stroke; }
.lc-trace { fill: none; stroke: var(--lc-trace); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.lc-other-trace { fill: none; stroke-width: 0.6px; vector-effect: non-scaling-stroke; stroke-linejoin: round; opacity: 0.7; }
.lc-dot { fill: var(--lc-trace); }

.lc-stage { touch-action: pan-y; cursor: pointer; }
.lc-stage:focus { outline: none; }
.lc-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.lc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Màn hình nhỏ của bơm LC (áp suất) */
.lc-lcd { fill: var(--lc-screen-bg); }
.lc-lcd-text { font-family: var(--anatomy-mono); fill: var(--lc-trace); }
.lc-hot .lc-heater { fill: var(--lc-hot); }

/* Điện thoại: tiêu đề dài xuống dòng, không đè lên "Fig 13" */
@media (max-width: 520px) {
  .iso-plate-corner[data-corner="title"] { white-space: normal; text-align: right; max-width: 70%; line-height: 1.35; font-size: 9.5px; }
}

 d="M454.5 303.8L454 303.8L454 301L454.5 301.1Z"/><path class="iso-shade" data-shade="3" d="M454 303.8L451.3 302.9L451.3 300.2L454 301ZM451.3 302.9L450.9 302.7L450.9 300L451.3 300.2ZM450.9 302.7L450.8 302.5L450.8 299.7L450.9 300Z"/><path class="iso-top" d="M465.2 292L465.6 292.2L465.7 292.5L465.5 292.7L455.4 300.8L455 301L454.5 301.1L454 301L451.3 300.2L450.9 300L450.8 299.7L450.9 299.4L461 291.3L461.4 291.1L462 291.1L462.5 291.2Z"/><path class="iso-line iso-crease" data-tone="faint" d="M465.7 292.5L465.5 292.7L455.4 300.8L455 301L454.5 301.1L454 301L451.3 300.2L450.9 300L450.8 299.7"/><path class="iso-line iso-edge" data-tone="mid" d="M450.8 299.7L450.9 299.4L461 291.3L461.4 291.1L462 291.1L462.5 291.2L465.2 292L465.6 292.2L465.7 292.5M465.7 295.2L465.5 295.5L455.4 303.6L455 303.8L454.5 303.8L454 303.8L451.3 302.9L450.9 302.7L450.8 302.5M465.7 292.5L465.7 295.2M450.8 299.7L450.8 302.5"/></g></g></g></svg><span class="lc-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Ion tiền chất được Q1 chọn, vỡ thành ion mảnh trong ô va chạm, Q3 chỉ cho ion mảnh đã chọn tới đầu dò</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Probe ESI có gia nhiệt: giọt tích điện co lại khi dung môi bay hơi, ion đi vào ống khử dung môi</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Bơm tuabin ba cửa hút và bơm quay dầu giữ chân không giảm dần từ nguồn ion tới bộ phân tích</span></span><span class="iso-caption">Máy khối phổ ba tứ cực vẽ theo Shimadzu LCMS-8060 (m/z 2–2 000, độ phân giải đơn vị 0,7 u FWHM, quét tới 30 000 u/s, tới 555 kênh MRM/s, đổi cực 5 ms, DL tối đa 300 °C, heat block tối đa 500 °C, bơm quay 65 m³/giờ, bơm tuabin ba cửa hút 40/260/210 L/s, nitrogen tối đa 24,4 L/phút, argon làm khí CID; 1 180 × 540 × 610 mm). Pha động nước có 0,1 % formic acid với acetonitrile chạy qua cột C18 2,1 × 100 mm, 1,9 µm ở 0,4 mL/phút; mỗi chất ra khỏi cột ở thời gian lưu của nó (mô hình HPLC của Fig 7), được phun thành giọt tích điện ở +4,0 kV, khí nitrogen nóng làm giọt co lại tới khi ion [M+H]⁺ thoát ra. Ở chế độ MRM, Q1 chỉ cho ion tiền chất có m/z đã chọn đi qua (caffeine 195,1), ion va chạm với argon trong ô va chạm và vỡ thành mảnh (138,1 do mất CH₃NCO), Q3 chỉ cho mảnh đã chọn tới đầu dò. Theobromine và theophylline cùng m/z 181,1 nên Q1 không tách được, nhưng mảnh của chúng khác nhau (138,1 và 124,1) nên Q3 tách. Diện tích pic tỉ lệ với nồng độ; nền mẫu làm ức chế ion. Hiệu suất ion hoá, CE, hiệu suất phân mảnh, nền và áp suất các tầng là số minh hoạ; m/z tính từ khối lượng đơn đồng vị. Cấu tạo bên trong (Q-array, đa cực, ô va chạm, đầu dò, đường ống) vẽ theo thiết kế điển hình của máy ba tứ cực; hệ LC vẽ giản lược. Hình chạy nhanh hơn thực tế.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;

const num = (v, d) => (v !== null && v !== "" && Number.isFinite(+v) ? +v : d);

/** Khối lượng đơn đồng vị (u) của một công thức { C, H, N, O, … }. */
function monoMass(formula) {
  return Object.entries(formula).reduce((s, [el, n]) => s + (MASS[el] ?? 0) * n, 0);
}

/** m/z của ion [M+H]⁺ của phân tử có công thức này. */
function protonated(formula) {
  return monoMass(formula) + PROTON;
}

/** m/z của một cation có công thức này (ion mảnh mang điện +1): khối lượng nguyên tử trừ một electron. */
function cationMz(formula) {
  return monoMass(formula) - ELECTRON;
}

/** Viết công thức dạng chữ: C8H10N4O2. */
function formulaText(formula) {
  return ["C", "H", "N", "O", "S", "Cl"].filter((el) => formula[el]).map((el) => `${el}${formula[el] > 1 ? formula[el] : ""}`).join("");
}

/** Tìm chất theo tên (không phân biệt hoa thường, nhận vài tên tiếng Việt). */
function analyteOf(name) {
  const key = String(name ?? "").trim().toLowerCase();
  return ANALYTES[ALIASES[key] ?? key] ?? null;
}

/**
 * Mẫu đồng vị của ion [M+H]⁺: [{ mz, rel }] cho M, M+1, M+2 (rel so với đỉnh M = 1).
 * ¹³C 1,07 % (≈ 1,1 % mỗi carbon), ²H 0,0115 %, ¹⁵N 0,364 %, ¹⁷O 0,038 %, ¹⁸O 0,205 %.
 */
function isotopePattern(formula) {
  const f = { C: 0, H: 0, N: 0, O: 0, ...formula };
  const h = f.H + 1; // thêm proton
  const c1 = (f.C * 1.07) / 98.93;
  const m1 = c1 + (h * 0.0115) / 99.9885 + (f.N * 0.364) / 99.636 + (f.O * 0.038) / 99.757;
  const m2 = (c1 * c1) / 2 + (f.O * 0.205) / 99.757;
  const m0 = protonated(formula);
  return [
    { mz: m0, rel: 1 },
    { mz: m0 + C13, rel: m1 },
    { mz: m0 + 2 * C13, rel: m2 },
  ];
}

/** Phần ion ở đỉnh đơn đồng vị (M) trong cả cụm đồng vị. */
function monoFraction(formula) {
  const p = isotopePattern(formula);
  return 1 / p.reduce((s, x) => s + x.rel, 0);
}

/** Độ truyền qua của tứ cực đặt ở setMz cho ion m/z (0–1), độ phân giải fwhm (u). */
function transmission(mz, setMz, fwhm = LCMS.fwhm) {
  const x = (2 * Math.abs(mz - setMz)) / fwhm;
  return 1 / (1 + x ** 8);
}

/**
 * Điện áp của tứ cực khi lọc m/z ở đỉnh vùng bền: { V (RF, 0-đỉnh, vôn), U (DC, vôn), ratio U/V }.
 * r0 (mm) và tần số (MHz) là số điển hình.
 */
function rfVoltage(mz, quad = LCMS.quad) {
  const m = mz * 1.66053906660e-27;
  const r0 = quad.r0 / 1000;
  const w = 2 * Math.PI * quad.freq * 1e6;
  const e = 1.602176634e-19;
  const V = (quad.qApex * m * r0 * r0 * w * w) / (4 * e);
  const U = (quad.aApex * m * r0 * r0 * w * w) / (8 * e);
  return { V, U, ratio: U / V };
}

/** Danh sách mọi chuyển tiếp của các chất: [{ analyte, index, precursor, product, ce, label, … }]. */
function transitionsOf(names = Object.keys(ANALYTES)) {
  const out = [];
  for (const name of names) {
    const a = analyteOf(name);
    if (!a) continue;
    a.transitions.forEach((t, index) => {
      const precursor = protonated(a.formula);
      const product = cationMz(t.product);
      out.push({ analyte: a.name, index, precursor, product, ce: t.ce, ymax: t.ymax, w: t.w, bg: t.bg, loss: t.loss, role: index === 0 ? "định lượng" : "xác nhận", label: `${a.name} ${fmt(precursor, 1)} > ${fmt(product, 1)}` });
    });
  }
  return out;
}

/** Hiệu suất phân mảnh: phần ion tiền chất của chất a thành ion mảnh thứ i ở năng lượng va chạm ce (V). */
function fragmentYield(a, i, ce) {
  const t = a.transitions[i];
  if (!t) return 0;
  return t.ymax * Math.exp(-(((ce - t.ce) / t.w) ** 2));
}

/** Phần ion tiền chất còn nguyên sau ô va chạm ở năng lượng ce (minh hoạ: giảm dần theo CE). */
function survival(ce) {
  return Math.exp(-ce / 14);
}

/**
 * Đường đi của ion cho một chuyển tiếp: Q1 lọc tiền chất nào, ô va chạm tạo mảnh nào, Q3 cho mảnh nào qua.
 * Trả về { q1, q3, ce, species: [{ name, kind, mz, t1, fragments: [{ mz, y, t3, label }] }] }:
 * kind = "precursor" (tiền chất của mọi chất trong mẫu), "isotope" (đỉnh M+1 của chất chọn) hoặc "matrix" (ion nền).
 * t1, t3 là độ truyền qua Q1, Q3.
 */
function ionPath(analyte = RUN.analyte, transition = RUN.transition, { ce, names = SAMPLE.map((s) => s.name) } = {}) {
  const a = analyteOf(analyte) ?? ANALYTES.caffeine;
  const t = a.transitions[clamp(Math.round(transition), 0, a.transitions.length - 1)];
  const q1 = protonated(a.formula);
  const q3 = cationMz(t.product);
  const e = ce ?? t.ce;
  const species = [];
  const seen = new Set([a.name, ...names]);
  for (const name of seen) {
    const b = analyteOf(name);
    if (!b) continue;
    const mz = protonated(b.formula);
    const fragments = b.transitions.map((bt, i) => { const fm = cationMz(bt.product); return { mz: fm, y: fragmentYield(b, i, e), t3: transmission(fm, q3), label: `${fmt(fm, 1)}` }; });
    fragments.push({ mz, y: survival(e), t3: transmission(mz, q3), label: "còn nguyên" });
    species.push({ name: b.name, kind: "precursor", mz, t1: transmission(mz, q1), fragments });
  }
  const iso = isotopePattern(a.formula)[1];
  species.push({ name: `${a.name} M+1`, kind: "isotope", mz: iso.mz, rel: iso.rel, t1: transmission(iso.mz, q1), fragments: [] });
  // Ion nền (cụm dung môi, chất nền): m/z cố định cho dễ lặp lại, minh hoạ
  for (const mz of [100.0757, 123.0913, 149.0233, 158.9614, 214.0896, 279.1591]) species.push({ name: `nền ${fmt(mz, 1)}`, kind: "matrix", mz, t1: transmission(mz, q1), fragments: [] });
  return { analyte: a.name, transition: a.transitions.indexOf(t), q1, q3, ce: e, rf1: rfVoltage(q1), rf3: rfVoltage(q3), species };
}

/**
 * Chuẩn hoá dữ liệu người dùng (từ địa chỉ #run=… hoặc từ app):
 * { analyte: "caffeine", transition: 0, conc: 50 (ng/mL), matrix: 0.2 (phần tín hiệu bị ức chế, 0–0,95),
 *   volume: 2 (µL), dwell: 20 (ms), ce (V, bỏ trống = tối ưu), seed, sample: [{ name, conc }] (các chất khác trong mẫu) }.
 * Trả về { run, sample, warnings } với giá trị đã kẹp vào giới hạn của máy.
 */
function normalizeRun(input = {}) {
  const r = input && typeof input === "object" ? input : {};
  const warnings = [];
  let a = analyteOf(r.analyte ?? RUN.analyte);
  if (!a) { warnings.push(`không có dữ liệu cho chất "${String(r.analyte)}", dùng caffeine`); a = ANALYTES.caffeine; }
  const run = {
    analyte: a.name,
    transition: clamp(Math.round(num(r.transition, RUN.transition)), 0, a.transitions.length - 1),
    conc: clamp(num(r.conc, RUN.conc), 0, 100000),
    matrix: clamp(num(r.matrix, RUN.matrix), 0, 0.95),
    volume: clamp(num(r.volume, RUN.volume), 0.1, 50),
    dwell: clamp(num(r.dwell, RUN.dwell), LCMS.dwellMin, 500),
    ce: r.ce == null ? null : clamp(num(r.ce, 0), 0, 80),
    seed: Math.floor(num(r.seed, RUN.seed)) || 1,
  };
  for (const key of ["transition", "conc", "matrix", "volume", "dwell"]) if (r[key] != null && +r[key] !== run[key]) warnings.push(`${key} ngoài giới hạn, dùng ${run[key]}`);
  let sample = SAMPLE.map((s) => ({ ...s }));
  if (Array.isArray(r.sample)) {
    sample = [];
    for (const s of r.sample) {
      const b = analyteOf(s?.name);
      if (!b) { warnings.push(`không có dữ liệu cho chất "${String(s?.name ?? "")}"`); continue; }
      sample.push({ name: b.name, conc: clamp(num(s.conc, 0), 0, 100000) });
    }
  }
  const own = sample.find((s) => s.name === a.name);
  if (own) own.conc = run.conc;
  else sample.push({ name: a.name, conc: run.conc });
  return { run, sample, warnings };
}

/** Độ rộng do ngoài cột (ống nối, buồng phun ESI), σ tính bằng giây: số điển hình cho hệ UHPLC–MS, minh hoạ. */
const EXTRA_COLUMN_S = 1.5;

/** Thời gian lưu và độ rộng pic (phút) của các chất trên cột LC-MS, từ mô hình HPLC cộng độ rộng ngoài cột. */
function lcPeaks(sample = SAMPLE, method = LC_METHOD) {
  const list = HP.peaksOf(method, sample.map((s) => ({ name: s.name, conc: Math.max(s.conc, 1e-6) })), LC_COLUMN);
  const out = {};
  for (const p of list) out[p.name] = { tR: p.tR, sigma: Math.sqrt(p.sigma ** 2 + (EXTRA_COLUMN_S / 60) ** 2), N: p.N, k: p.k };
  return out;
}

/** Áp suất cột (bar) và giới hạn của bơm UHPLC. */
function lcPressure(method = LC_METHOD) {
  return { pressure: HP.pressure(method, LC_COLUMN), limit: Math.min(LC_PMAX, LC_COLUMN.pMax), t0: HP.deadTime(method.flow, LC_COLUMN) };
}

/** Chu kỳ MRM (giây) khi đo n kênh với dwell và pause (ms). */
function cycleTime(n, dwell = RUN.dwell, pause = LCMS.pauseMin) {
  return (n * (dwell + pause)) / 1000;
}

/** Nhiễu RMS (cps) của một kênh có nền bg (cps) đo với dwell (ms): Poisson cộng 5 % nhiễu hoá học. */
function noiseOf(bg, dwell = RUN.dwell) {
  const tau = dwell / 1000;
  return Math.sqrt(bg / tau) + 0.05 * bg;
}

/**
 * Kết quả trọn vẹn một lần tiêm cho kênh MRM đã chọn.
 * Trả về { run, sample, analyte, channel, channels, cycle, peaks, tR, sigma, area, height, bg, noise, sn, lod, loq,
 *   me, points, saturated, tEnd, pressure, path }: diện tích (counts), chiều cao và nền (cps), LOD/LOQ (ng/mL),
 *   me (% ảnh hưởng nền), points (số điểm dữ liệu trên pic), path (đường đi của ion, xem ionPath).
 */
function mrmRun(input = {}) {
  const { run, sample, warnings } = input.run && input.sample ? input : normalizeRun(input);
  const a = analyteOf(run.analyte);
  const names = sample.map((s) => s.name);
  const channels = transitionsOf(names);
  const channel = channels.find((c) => c.analyte === a.name && c.index === run.transition);
  const cycle = cycleTime(channels.length, run.dwell);
  const peaks = lcPeaks(sample);
  const lc = lcPressure();
  // Lượng chất trên cột (pg) = ng/mL × µL
  const suppression = run.matrix;
  const ce = run.ce ?? channel.ce;
  const rateOf = (b, conc) => RESPONSE * b.ie * (1 - suppression) * conc * run.volume * monoFraction(b.formula);
  // Đóng góp của mọi chất trong mẫu vào kênh đã chọn (thường chỉ chất chọn; chất đồng phân bị Q3 loại)
  const contrib = [];
  for (const s of sample) {
    const b = analyteOf(s.name);
    const t1 = transmission(protonated(b.formula), channel.precursor);
    if (t1 < 1e-6 || !(s.conc > 0)) continue;
    let y = 0;
    b.transitions.forEach((bt, i) => { y += fragmentYield(b, i, ce) * transmission(cationMz(bt.product), channel.product); });
    y += survival(ce) * transmission(protonated(b.formula), channel.product);
    const area = rateOf(b, s.conc) * t1 * y;
    if (area > 1e-3) contrib.push({ name: b.name, area, ...peaks[b.name] });
  }
  const bg = channel.bg * (1 + 2 * run.matrix);
  const noise = noiseOf(bg, run.dwell);
  const main = contrib.find((c) => c.name === a.name) ?? { area: 0, ...peaks[a.name] };
  const sigmaS = main.sigma * 60;
  const height = main.area / (sigmaS * Math.sqrt(2 * Math.PI));
  const perConc = run.conc > 0 ? height / run.conc : (RESPONSE * a.ie * (1 - suppression) * run.volume * monoFraction(a.formula) * fragmentYield(a, run.transition, ce)) / (sigmaS * Math.sqrt(2 * Math.PI));
  const lod = perConc > 0 ? (3 * noise) / perConc : Infinity;
  const loq = perConc > 0 ? (10 * noise) / perConc : Infinity;
  const tEnd = Math.ceil(Math.max(...Object.values(peaks).map((p) => p.tR + 6 * p.sigma), lc.t0 * 2) * 1.15 * 4) / 4;
  return {
    run,
    sample,
    warnings,
    analyte: a.name,
    hue: a.hue,
    channel: { ...channel, ce },
    channels,
    cycle,
    peaks,
    contrib,
    tR: main.tR,
    sigma: main.sigma,
    area: main.area,
    height,
    bg,
    noise,
    sn: height / noise,
    lod,
    loq,
    me: -suppression * 100,
    points: (4 * sigmaS) / cycle,
    saturated: height + bg > LCMS.saturation,
    tEnd,
    pressure: lc.pressure,
    t0: lc.t0,
    path: ionPath(a.name, run.transition, { ce, names }),
  };
}

function hash(n) {
  let x = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
  x ^= x >>> 13;
  x = Math.imul(x, 0xc2b2ae35);
  x ^= x >>> 16;
  return ((x >>> 0) / 4294967296) * 2 - 1;
}

/** Tín hiệu thật (không nhiễu, cps) của kênh đã chọn ở phút t. */
function idealAt(t, res) {
  let y = res.bg;
  for (const c of res.contrib) {
    const z = (t - c.tR) / c.sigma;
    if (Math.abs(z) < 8) y += (c.area / (c.sigma * 60 * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * z * z);
  }
  return Math.min(y, LCMS.saturation);
}

/**
 * Tín hiệu đo (cps) ở phút t: lấy mẫu theo chu kỳ MRM (mỗi chu kỳ một điểm dữ liệu), cộng nhiễu Poisson và
 * nhiễu hoá học có hạt giống, bão hoà ở 2 × 10⁷ cps.
 */
function signalAt(t, res) {
  const i = Math.floor((t * 60) / res.cycle);
  const ti = (i * res.cycle) / 60;
  const ideal = idealAt(ti, res);
  const tau = res.run.dwell / 1000;
  const sd = Math.sqrt(ideal / tau) + 0.05 * res.bg;
  const g = (hash(res.run.seed * 7919 + i) + hash(res.run.seed * 104729 + i * 3 + 1) + hash(i * 13 + 5)) * 1.0;
  return Math.max(0, Math.min(LCMS.saturation, ideal + sd * g));
}

/** Sắc ký đồ MRM: mảng [phút, cps], một điểm cho mỗi chu kỳ MRM từ 0 tới tEnd. */
function chromatogram(res, tEnd = res.tEnd) {
  const pts = [];
  const n = Math.floor((tEnd * 60) / res.cycle);
  for (let i = 0; i <= n; i++) {
    const t = (i * res.cycle) / 60;
    pts.push([t, signalAt(t, res)]);
  }
  return pts;
}

/** Đường chuẩn: diện tích (counts) ở các nồng độ (ng/mL), cùng kênh và nền mẫu; trả về { points, slope }. */
function calibration(input = {}, concs = [1, 5, 10, 50, 100, 500]) {
  const base = normalizeRun(input);
  const points = concs.map((conc) => {
    const res = mrmRun(normalizeRun({ ...base.run, conc, sample: base.sample }));
    return { conc, area: res.area };
  });
  const slope = points.reduce((s, p) => s + p.conc * p.area, 0) / points.reduce((s, p) => s + p.conc * p.conc, 0);
  return { points, slope };
}

/** Số kiểu Việt Nam: dấu phẩy thập phân. */
const fmt = (v, d = 2) => v.toFixed(d).replace(".", ",");

/** Số lớn gọn: 1,2 × 10⁶. */
function sci(v, d = 1) {
  if (!Number.isFinite(v)) return "∞";
  if (v === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(v)));
  if (e >= -3 && e < 4) return fmt(v, Math.max(0, d - e));
  const sup = String(e).split("").map((c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(c)] ?? "⁻").join("");
  return `${fmt(v / 10 ** e, d)} × 10${sup}`;
}

const still = matchMedia("(prefers-reduced-motion: reduce)");
const NS = "http://www.w3.org/2000/svg";

// Dữ liệu người dùng do app truyền qua địa chỉ (…lcms.html#run=<JSON>):
// { "analyte": "caffeine", "transition": 0, "conc": 50, "matrix": 0.2, "volume": 2, "dwell": 20, "seed": 7,
//   "sample": [{ "name": "theobromine", "conc": 20 }] }
const RUN_IN = (() => {
  try { const m = location.hash.match(/run=([^&]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch { return null; }
})();
const START = normalizeRun(RUN_IN ?? {});

const el = {
  machine: $(".lc-machine"),
  bands: $('[data-part="bands"]'),
  trace: $('[data-part="trace"]'),
  others: $('[data-part="others"]'),
  axes: $('[data-part="axes"]'),
  labels: $('[data-part="labels"]'),
  now: $('[data-part="now"]'),
  state: $('[data-part="scr-state"]'),
  mrm: $('[data-part="scr-mrm"]'),
  stat: $('[data-part="scr-stat"]'),
  lcp: $('[data-part="lcp"]'),
};
// Lớp hạt trên cùng: nón Taylor, giọt mẫu trong ống, giọt phun, ion, điện tử, chớp sáng
const layer = document.createElementNS(NS, "g");
layer.setAttribute("class", "lc-ions");
layer.setAttribute("pointer-events", "none");
el.machine.appendChild(layer);
const cone = document.createElementNS(NS, "path");
cone.setAttribute("class", "lc-cone");
layer.appendChild(cone);
const plugs = [];
const POOL = [];
for (let i = 0; i < 220; i++) {
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("r", "0");
  c.style.display = "none";
  layer.appendChild(c);
  POOL.push(c);
}

const RUN_VIS = 22; // giây trên màn hình cho cả lần chạy
const INJECT_T = 1.0;
const TRANSFER = 0.05; // phút: mẫu đi trong ống PEEK từ cột tới probe (minh hoạ)
const V_ION = 85; // đơn vị/giây trên hình (không phải tốc độ thật)
const CHANNELS = transitionsOf(Object.keys(ANALYTES));
// Thời gian một ion đi từ đầu probe tới ống nhân trên hình (giây), đổi ra phút của lần chạy: ion phát sớm
// chừng đó để lúc chúng tới đầu dò thì sắc ký đồ vẽ đúng đỉnh pic.
const TRANSIT_S = 3.4;
const lead = () => (TRANSIT_S * state.res.tEnd) / RUN_VIS;

const state = {
  run: { ...START.run },
  sample: START.sample,
  phase: "idle", // idle → inject → run → done
  phaseAt: 0,
  res: null,
  t: 0, // phút của lần chạy
  spray: 0, // 0..1 mức phun
};
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches && !RUN_IN;
let tour = { step: "wait", wait: 1.4 };
let idleTimer = 0;
let lastSaid = "";
const say = (text) => { if (text !== lastSaid) { lastSaid = text; status.textContent = text; } };
const dec = (v, d = 1) => fmt(v, d);
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const big = (v) => sci(v, 1);
const grp = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f");
const cps = (v) => (v < 1e4 ? grp(v) : big(v));

// Số giả ngẫu nhiên có hạt giống (để khung tĩnh luôn như nhau)
let seed = 12345;
const rand = () => { seed = (seed + 0x6d2b79f5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

function compute() {
  state.res = mrmRun(normalizeRun({ ...state.run, sample: state.sample }));
  // Kênh định lượng của các chất khác (vết mờ trên màn hình)
  state.others = state.sample.filter((s) => s.name !== state.res.analyte).map((s) => mrmRun(normalizeRun({ ...state.run, analyte: s.name, transition: 0, conc: s.conc, sample: state.sample })));
  axesKey = "";
  traceKey = "";
}

// ——— Dải chất trong cột và giọt mẫu trong ống PEEK ———
const CA = D.col.a;
const axisAt = (f) => [CA[0][0] + (CA[1][0] - CA[0][0]) * f, CA[0][1] + (CA[1][1] - CA[0][1]) * f];
const NRM = (() => { const d = [CA[1][0] - CA[0][0], CA[1][1] - CA[0][1]]; const l = Math.hypot(...d); const s = D.col.r * 1.05 * D.ks; return [(-d[1] / l) * s, (d[0] / l) * s]; })();
const hueOf = (name, light = 0) => `hsl(${ANALYTES[name]?.hue ?? 0} 72% ${(document.body.dataset.theme === "light" ? 44 : 62) + light}%)`;
function drawBands() {
  const r = state.res;
  if (!["run"].includes(state.phase)) { if (el.bands.childElementCount) el.bands.innerHTML = ""; return; }
  const out = [];
  for (const s of state.sample) {
    const p = r.peaks[s.name];
    if (!p) continue;
    const f = state.t / Math.max(0.05, p.tR - TRANSFER - lead());
    if (f > 1.06) continue;
    const sf = Math.sqrt(Math.max(f, 0.004) / p.N) + 0.018;
    for (const [k, a] of [[2, 0.3], [1.2, 0.55], [0.5, 0.9]]) {
      const f0 = Math.max(0, f - k * sf);
      const f1 = Math.min(1, f + k * sf);
      if (f1 <= f0) continue;
      const [a0, a1] = [axisAt(f0), axisAt(f1)];
      out.push(`<path style="fill:${hueOf(s.name)};opacity:${(a * (0.4 + 0.6 * Math.min(1, s.conc / 50))).toFixed(2)}" d="M${(a0[0] + NRM[0]).toFixed(2)} ${(a0[1] + NRM[1]).toFixed(2)}L${(a1[0] + NRM[0]).toFixed(2)} ${(a1[1] + NRM[1]).toFixed(2)}L${(a1[0] - NRM[0]).toFixed(2)} ${(a1[1] - NRM[1]).toFixed(2)}L${(a0[0] - NRM[0]).toFixed(2)} ${(a0[1] - NRM[1]).toFixed(2)}Z"/>`);
    }
  }
  el.bands.innerHTML = out.join("");
}
const along = (pts, u) => {
  const n = pts.length - 1;
  const f = Math.min(n, Math.max(0, u * n));
  const i = Math.min(n - 1, Math.floor(f));
  const k = f - i;
  return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k];
};

// ——— Hạt: giọt phun, ion nguồn, ion trong chân không, điện tử, chớp ———
const parts = [];
const DLIN = D.probe.dl; // đầu vào DL trong buồng nguồn
const TIP = D.probe.tip;
const ROD = (name) => D.rods.find((r) => r.name === name);
const Q1 = D.sections.q1;
const Q3 = D.sections.q3;
const CELL = D.sections.cell;
const DET = D.sections.det;
const DYN = [DET.x, DET.dynY, D.axis.z];
const EMM = [DET.x, DET.emY - 12, D.axis.z];
const rodGap = ROD("q1").R0 - ROD("q1").r; // khoảng từ trục tới mặt thanh
// Pic phát ion trên hình rộng hơn pic thật một chút để mắt kịp theo (pic thật chỉ vài giây)
const gauss = (t, p) => Math.exp(-0.5 * ((t - p.tR) / Math.max(p.sigma, 0.03)) ** 2);

// Trọng số phát ion theo thời gian (phút) của lần chạy
function speciesWeights(t) {
  const r = state.res;
  const list = [];
  const mat = 1.1 * (1 + 3 * state.run.matrix);
  for (const sp of r.path.species) {
    if (sp.kind === "matrix") list.push([sp, mat / 6]);
    else if (sp.kind === "isotope") {
      const p = r.peaks[r.analyte];
      list.push([sp, 0.9 * sp.rel * gauss(t, p) * strength(r.analyte)]);
    } else {
      const p = r.peaks[sp.name];
      if (p) list.push([sp, 8 * gauss(t, p) * strength(sp.name)]);
    }
  }
  return list;
}
function strength(name) {
  const s = state.sample.find((x) => x.name === name);
  const a = ANALYTES[name];
  if (!s || !a) return 0;
  return Math.min(1.6, Math.sqrt((s.conc * a.ie * (1 - state.run.matrix)) / 50));
}
function pick(list) {
  const total = list.reduce((s, [, w]) => s + w, 0);
  let u = rand() * total;
  for (const [sp, w] of list) { u -= w; if (u <= 0) return sp; }
  return list[list.length - 1][0];
}
function classOf(sp) {
  if (sp.kind === "matrix") return "m";
  return sp.name === state.res.analyte ? "p" : "o";
}

function emitDroplet() {
  const th = (rand() * 26 * Math.PI) / 180;
  const ph = rand() * 2 * Math.PI;
  const v = 26 + rand() * 18;
  const dir = [Math.sin(th) * Math.cos(ph) * 0.9 + 0.3, Math.sin(th) * Math.sin(ph) * 0.9 - 0.18, -Math.cos(th)];
  parts.push({ kind: "drop", p: [...TIP], v: dir.map((c) => c * v), age: 0, life: 0.35 + rand() * 0.25, r0: 0.9 + rand() * 0.6 });
}
function emitIon(t) {
  const sp = pick(speciesWeights(t));
  // ion thoát ra từ giọt nhỏ gần tia phun rồi bị hút vào DL
  const start = [TIP[0] + 3 + rand() * 4, TIP[1] - 2 + (rand() - 0.5) * 5, TIP[2] - 4 - rand() * 5];
  parts.push({ kind: "src", sp, cls: classOf(sp), p: start, from: start, age: 0, life: 0.22 });
}
function vacIon(sp, cls) {
  const ang = rand() * 2 * Math.PI;
  return { kind: "ion", sp, cls, x: D.dl.out, r: 0.6 + rand() * 1.2, a: ang, w: (rand() - 0.5) * 9, grow: 0, pass1: rand() < sp.t1, frag: null, age: 0 };
}

function stepParts(dt) {
  const r = state.res;
  const spraying = state.spray > 0.05;
  // phát giọt và ion
  if (spraying) {
    state.dropAcc = (state.dropAcc ?? 0) + dt * 42 * state.spray;
    while (state.dropAcc >= 1) { state.dropAcc -= 1; emitDroplet(); }
    const weights = speciesWeights(state.t + lead()).reduce((s, [, w]) => s + w, 0);
    state.ionAcc = (state.ionAcc ?? 0) + dt * 7 * weights * state.spray;
    while (state.ionAcc >= 1) { state.ionAcc -= 1; emitIon(state.t + lead()); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.age += dt;
    let dead = false;
    if (q.kind === "drop") {
      q.p = q.p.map((c, j) => c + q.v[j] * dt);
      dead = q.age > q.life;
    } else if (q.kind === "src") {
      const u = ease(q.age / q.life);
      q.p = q.from.map((c, j) => c + (DLIN[j] - c) * u);
      if (q.age >= q.life) { dead = true; parts.push({ kind: "dl", sp: q.sp, cls: q.cls, p: [...DLIN], age: 0, life: 0.3 }); }
    } else if (q.kind === "dl") {
      // trong ống khử dung môi: đi thẳng theo trục
      const u = Math.min(1, q.age / q.life);
      q.p = [DLIN[0] + (D.dl.out - DLIN[0]) * u, D.axis.y, D.axis.z];
      if (q.age >= q.life) { dead = true; parts.push(vacIon(q.sp, q.cls)); }
    } else if (q.kind === "ion") {
      const x0 = q.x;
      const inCell = q.x > CELL[0] && q.x < CELL[1];
      q.x += dt * V_ION * (inCell ? 0.55 : 1);
      q.a += dt * q.w;
      const x = q.x;
      if (x < -50) {
        // Q-array: ion hội tụ dần về trục
        const qa = D.qarray.find((p) => p.x > x) ?? D.qarray[D.qarray.length - 1];
        q.r = Math.min(q.r, qa.hole * 0.55) * (1 - dt * 0.6);
      } else if (x < Q1[0]) q.r = Math.max(0.3, q.r * (1 - dt * 1.5));
      else if (x < Q1[1]) {
        if (!q.pass1) { q.grow += dt * 6; q.r = 0.6 * Math.exp(q.grow) ; q.w = 14; if (q.r > rodGap) { dead = true; flash(q, 0.18); } }
        else q.r = 0.4 + 0.25 * Math.sin(x * 0.7);
      } else if (x < CELL[0] + 3) q.r = 0.4;
      else if (x < CELL[1]) {
        if (!q.frag && q.sp.fragments.length) {
          const opts = q.sp.fragments.map((f) => [f, f.y]);
          const f = pick(opts);
          q.frag = f;
          q.pass3 = rand() < f.t3;
          q.cls = q.pass3 ? "f" : q.cls === "m" ? "m" : "o";
          q.w = (rand() - 0.5) * 16;
        }
        q.r = 0.5 + 1.2 * Math.abs(Math.sin(x * 0.45 + q.a));
      } else if (x < Q3[0]) q.r = Math.max(0.3, q.r * (1 - dt * 3));
      else if (x < Q3[1]) {
        if (!q.pass3) { q.grow += dt * 6; q.r = 0.6 * Math.exp(q.grow); q.w = 14; if (q.r > rodGap) { dead = true; flash(q, 0.18); } }
        else q.r = 0.4 + 0.25 * Math.sin(x * 0.7);
      } else if (x < D.sections.exit + 2) q.r = 0.3;
      else {
        dead = true;
        { const from = [D.sections.exit + 2, D.axis.y, D.axis.z]; parts.push({ kind: "det", cls: q.cls, from, p: from, age: 0, life: 0.18 }); }
      }
      if (x0 < CELL[0] && q.x >= CELL[0] && !q.sp.fragments.length) q.frag = null;
    } else if (q.kind === "det") {
      const u = ease(q.age / q.life);
      q.p = q.from.map((c, j) => c + (DYN[j] + (j === 1 ? 2.6 : 0) - c) * u);
      if (q.age >= q.life) {
        dead = true;
        flash({ p: [DYN[0], DYN[1] + 2.6, DYN[2]] }, 0.2);
        for (let e = 0; e < 3; e++) { const from = [DYN[0] + (rand() - 0.5) * 3, DYN[1] + 2.6, DYN[2] + (rand() - 0.5) * 3]; parts.push({ kind: "e", from, p: from, age: -e * 0.03, life: 0.16 }); }
      }
    } else if (q.kind === "e") {
      if (q.age >= 0) {
        const u = q.age / q.life;
        q.p = q.from.map((c, j) => c + (EMM[j] - c) * u);
      }
      if (q.age >= q.life) { dead = true; flash({ p: EMM }, 0.14); state.counts = (state.counts ?? 0) + 1; }
    } else if (q.kind === "flash") dead = q.age > q.life;
    if (dead) parts.splice(i, 1);
  }
  if (parts.length > 200) parts.splice(0, parts.length - 200);
  void r;
}
function flash(q, life) {
  const p = q.p ?? ionPos(q);
  parts.push({ kind: "flash", p, age: 0, life });
}
function ionPos(q) {
  return [q.x, D.axis.y + q.r * Math.cos(q.a), D.axis.z + q.r * Math.sin(q.a)];
}
function drawParts() {
  let n = 0;
  for (const q of parts) {
    if (n >= POOL.length) break;
    let p;
    let rad;
    let cls;
    let op = 1;
    if (q.kind === "drop") { p = q.p; const u = q.age / q.life; rad = q.r0 * (1 - 0.75 * u); cls = "d"; op = 0.85 - 0.5 * u; }
    else if (q.kind === "src" || q.kind === "dl") { p = q.p; rad = 0.75; cls = q.cls; }
    else if (q.kind === "ion") { p = ionPos(q); rad = q.cls === "p" || q.cls === "f" ? 1.25 : 0.9; cls = q.cls; }
    else if (q.kind === "det") { p = q.p; rad = 0.9; cls = q.cls; }
    else if (q.kind === "e") { if (q.age < 0) continue; p = q.p; rad = 0.55; cls = "e"; }
    else if (q.kind === "flash") { p = q.p; const u = q.age / q.life; rad = 1.2 + 1.6 * u; cls = "flash"; op = 1 - u; }
    else continue;
    const [sx, sy] = iso(p, P);
    const c = POOL[n++];
    c.setAttribute("cx", sx.toFixed(2));
    c.setAttribute("cy", sy.toFixed(2));
    c.setAttribute("r", rad.toFixed(2));
    c.setAttribute("class", cls);
    c.style.opacity = op.toFixed(2);
    c.style.display = "";
  }
  for (let i = n; i < POOL.length; i++) if (POOL[i].style.display !== "none") POOL[i].style.display = "none";
  // Nón Taylor ở đầu mao quản
  const s = state.spray;
  if (s > 0.02) {
    const pts = [[TIP[0] - 0.6, TIP[1], TIP[2]], [TIP[0] + 0.6, TIP[1], TIP[2]], [TIP[0] + 0.25 * s, TIP[1], TIP[2] - 2.2 * s]].map((p) => iso(p, P));
    cone.setAttribute("d", `M${pts.map((p) => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join("L")}Z`);
  } else cone.setAttribute("d", "");
  // Giọt mẫu trong ống PEEK khi một chất vừa ra khỏi cột
  const pk = D.paths.peek;
  const live = state.phase === "run" ? state.sample.filter((x) => { const p = state.res.peaks[x.name]; return p && state.t > p.tR - TRANSFER - lead() && state.t < p.tR - lead(); }) : [];
  live.forEach((x, i) => {
    let c = plugs[i];
    if (!c) { c = document.createElementNS(NS, "circle"); c.setAttribute("class", "lc-plug"); c.setAttribute("r", "1.3"); layer.insertBefore(c, cone); plugs[i] = c; }
    const p = state.res.peaks[x.name];
    const [sx, sy] = along(pk, (state.t - (p.tR - TRANSFER - lead())) / TRANSFER);
    c.setAttribute("cx", sx.toFixed(2));
    c.setAttribute("cy", sy.toFixed(2));
    c.style.fill = hueOf(x.name);
    c.style.display = "";
  });
  for (let i = live.length; i < plugs.length; i++) plugs[i].style.display = "none";
  // Giọt mẫu đi từ bộ tiêm vào cột lúc tiêm
  if (state.phase === "inject") {
    let c = plugs[0];
    if (!c) { c = document.createElementNS(NS, "circle"); c.setAttribute("class", "lc-plug"); c.setAttribute("r", "1.3"); layer.insertBefore(c, cone); plugs[0] = c; }
    const [sx, sy] = along(D.paths.column, ease(state.phaseAt / INJECT_T));
    c.setAttribute("cx", sx.toFixed(2));
    c.setAttribute("cy", sy.toFixed(2));
    c.style.fill = "";
    c.style.display = "";
  }
}

// ——— Màn hình: trục, vết MRM, nhãn ———
const PL = D.screen.PLOT;
let axesKey = "";
let traceKey = "";
function niceStep(span, n) {
  const raw = span / n;
  const p = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw) ?? raw;
}
function scaleOf() {
  const r = state.res;
  // Trục y theo kênh đã chọn; vết mờ của các kênh khác được thu nhỏ cho vừa (chỉ để thấy vị trí pic)
  const top = Math.max(r.bg * 8, (r.height + r.bg) * 1.15, 50);
  const ys = niceStep(top, 4);
  const e = Math.floor(Math.log10(Math.ceil(top / ys) * ys));
  return { tEnd: r.tEnd, ymax: Math.ceil(top / ys) * ys, ys, xs: niceStep(r.tEnd, 5), e };
}
const ux = (t, sc) => PL.u0 + ((PL.u1 - PL.u0) * t) / sc.tEnd;
const wy = (v, sc) => PL.w1 - ((PL.w1 - PL.w0) * Math.max(0, Math.min(sc.ymax * 1.02, v))) / sc.ymax;
function drawAxes(sc) {
  const key = `${sc.tEnd}|${sc.ymax}`;
  if (key === axesKey) return;
  axesKey = key;
  const out = [];
  const grid = [];
  const unit = 10 ** sc.e;
  for (let v = sc.ys; v <= sc.ymax + 1e-9; v += sc.ys) {
    grid.push(`M${PL.u0} ${wy(v, sc).toFixed(2)}H${PL.u1}`);
    out.push(`<text class="lc-scr-dim" x="${PL.u0 - 1.2}" y="${(wy(v, sc) + 1.1).toFixed(2)}" font-size="2.9" text-anchor="end">${dec(v / unit, v / unit < 1 || (v / unit) % 1 ? 1 : 0)}</text>`);
  }
  for (let t = sc.xs; t <= sc.tEnd - sc.xs * 0.6 + 1e-9; t += sc.xs) {
    grid.push(`M${ux(t, sc).toFixed(2)} ${PL.w0}V${PL.w1}`);
    out.push(`<text class="lc-scr-dim" x="${ux(t, sc).toFixed(2)}" y="${PL.w1 + 3.6}" font-size="2.9" text-anchor="middle">${dec(t, sc.xs < 1 ? 1 : 0)}</text>`);
  }
  out.unshift(`<path class="lc-gridline" d="${grid.join("")}"/>`, `<path class="lc-axis" d="M${PL.u0} ${PL.w0}V${PL.w1}H${PL.u1}"/>`);
  const sup = String(sc.e).split("").map((c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(c)] ?? "⁻").join("");
  out.push(`<text class="lc-scr-dim" x="${PL.u0 - 1.2}" y="${PL.w0 - 1.6}" font-size="2.9" text-anchor="end">×10${sup}</text>`);
  out.push(`<text class="lc-scr-dim" x="${PL.u1}" y="${PL.w1 + 3.6}" font-size="2.9" text-anchor="end">phút</text>`);
  el.axes.innerHTML = out.join("");
}
function tracePath(res, t, sc, k = 1) {
  const pts = [];
  const n = Math.floor((t * 60) / res.cycle);
  const step = Math.max(1, Math.floor(n / 600));
  for (let i = 0; i <= n; i += step) {
    const ti = (i * res.cycle) / 60;
    pts.push(`${ux(ti, sc).toFixed(2)} ${wy(signalAt(ti, res) * k, sc).toFixed(2)}`);
  }
  return pts.length > 1 ? `M${pts.join("L")}` : "";
}
function drawTrace() {
  const r = state.res;
  const sc = scaleOf();
  drawAxes(sc);
  const running = ["run", "done"].includes(state.phase);
  const t = !running ? 0 : state.phase === "done" ? r.tEnd : state.t;
  const key = `${r.analyte}|${r.channel.index}|${r.run.conc}|${t.toFixed(4)}|${state.phase}`;
  if (key === traceKey) return;
  traceKey = key;
  el.trace.setAttribute("d", running ? tracePath(r, t, sc) : "");
  el.others.innerHTML = running ? state.others.map((o) => `<path class="lc-other-trace" style="stroke:${hueOf(o.analyte)}" d="${tracePath(o, t, sc, Math.min(1, (0.8 * sc.ymax) / (o.height + o.bg)))}"/>`).join("") : "";
  const yNow = running ? signalAt(t, r) : 0;
  el.now.setAttribute("cx", ux(t, sc).toFixed(2));
  el.now.setAttribute("cy", wy(yNow, sc).toFixed(2));
  const labels = [];
  if (running && t > r.tR + 2 * r.sigma) {
    const u = Math.min(PL.u1 - 12, Math.max(PL.u0 + 12, ux(r.tR, sc)));
    const w = Math.max(PL.w0 + 6.5, wy(r.height + r.bg, sc) - 1.4);
    labels.push(`<text class="lc-scr-peak" x="${u.toFixed(2)}" y="${w.toFixed(2)}" font-size="3" text-anchor="middle">${dec(r.tR, 2)}</text>`);
    labels.push(`<text class="lc-scr-dim" x="${u.toFixed(2)}" y="${(w - 3.2).toFixed(2)}" font-size="2.6" text-anchor="middle">${r.analyte}</text>`);
  }
  el.labels.innerHTML = labels.join("");
}
function drawScreen() {
  const r = state.res;
  const ph = state.phase;
  el.state.textContent = ph === "idle" ? "sẵn sàng" : ph === "inject" ? "tiêm mẫu" : ph === "run" ? "đang đo" : "xong";
  el.mrm.textContent = `MRM ${dec(r.channel.precursor, 1)}>${dec(r.channel.product, 1)} · CE ${r.channel.ce} V · ${r.run.dwell} ms`;
  const done = ph === "done" || (ph === "run" && state.t > r.tR + 3 * r.sigma);
  el.stat.textContent = done ? `${r.analyte} S/N ${grp(r.sn)} · LOD ${big(r.lod)}${r.saturated ? " · BÃO HOÀ" : " ng/mL"}` : `${r.analyte} ${dec(r.run.conc, r.run.conc < 1 ? 2 : r.run.conc < 10 ? 1 : 0)} ng/mL · ${r.channels.length} kênh · ${dec(r.cycle * 1000, 0)} ms`;
  drawTrace();
}
function drawPump() {
  const p = state.res.pressure * (1 + 0.004 * Math.sin((state.clock ?? 0) * 3.8));
  const text = `${Math.round(p)} bar`;
  if (el.lcp.textContent !== text) el.lcp.textContent = text;
}
function drawReadout() {
  const r = state.res;
  const ph = state.phase;
  let text;
  if (ph === "idle") text = `sẵn sàng · ${dec(r.channel.precursor, 1)} > ${dec(r.channel.product, 1)}`;
  else if (ph === "inject") text = `tiêm ${dec(r.run.volume, 0)} µL · ${dec(r.pressure, 0)} bar`;
  else if (ph === "run") text = `${dec(state.t, 2)} phút · ${cps(signalAt(state.t, r))} cps`;
  else text = `S/N ${grp(r.sn)} · LOQ ${big(r.loq)} ng/mL`;
  if (readout.textContent !== text) readout.textContent = text;
}

function setPhase(phase) {
  state.phase = phase;
  state.phaseAt = 0;
  const names = { inject: "Tiêm mẫu vào cột.", run: "Bật phun ESI, đo MRM.", done: `Xong. ${state.res.analyte}: tR ${dec(state.res.tR, 2)} phút, S/N ${grp(state.res.sn)}.` };
  if (names[phase]) say(names[phase]);
}
function inject() {
  if (!["idle", "done"].includes(state.phase)) return;
  state.t = 0;
  traceKey = "";
  setPhase("inject");
}
function abort() {
  state.phase = "idle";
  state.t = 0;
  parts.length = 0;
  traceKey = "";
  say("Dừng.");
}
function change(key) {
  const r = state.run;
  if (key === "ArrowRight" || key === "ArrowLeft") {
    const i = CHANNELS.findIndex((c) => c.analyte === r.analyte && c.index === r.transition);
    const n = CHANNELS.length;
    const c = CHANNELS[(i + (key === "ArrowRight" ? 1 : n - 1)) % n];
    r.analyte = c.analyte;
    r.transition = c.index;
    const s = state.sample.find((x) => x.name === c.analyte);
    r.conc = s ? s.conc : r.conc;
  } else if (key === "ArrowUp") r.conc = Math.min(10000, +(r.conc * 2).toPrecision(3));
  else if (key === "ArrowDown") r.conc = Math.max(0.01, +(r.conc / 2).toPrecision(3));
  const s = state.sample.find((x) => x.name === r.analyte);
  if (s) s.conc = r.conc;
  compute();
  const res = state.res;
  say(`${res.analyte}, kênh ${res.channel.role} ${dec(res.channel.precursor, 1)} sang ${dec(res.channel.product, 1)}, ${dec(res.run.conc, 2)} ng/mL.`);
  if (state.phase === "done") traceKey = "";
}

function step(dt) {
  state.clock = (state.clock ?? 0) + dt;
  state.phaseAt += dt;
  const ph = state.phase;
  const u = state.phaseAt;
  const r = state.res;
  if (ph === "inject") { if (u >= INJECT_T) setPhase("run"); }
  else if (ph === "run") {
    state.t += (dt * r.tEnd) / RUN_VIS;
    if (state.t >= r.tEnd) { state.t = r.tEnd; setPhase("done"); }
  }
  const target = ph === "run" ? 1 : 0;
  state.spray += (target - state.spray) * (1 - Math.exp(-dt / 0.25));
  stepParts(dt);
}

function draw() {
  svgEl.classList.toggle("lc-run", ["inject", "run"].includes(state.phase) || state.spray > 0.3);
  drawBands();
  drawParts();
  drawScreen();
  drawPump();
  drawReadout();
}

function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "wait") { inject(); tour = { step: "running", wait: 0 }; }
  else if (tour.step === "running") { if (state.phase === "done") tour = { step: "hold", wait: 3 }; }
  else if (tour.step === "hold") { change("ArrowRight"); tour = { step: "wait", wait: 1.2 }; }
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  if (!calm) step(dt);
  draw();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 1.4 }; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || !["idle", "done"].includes(state.phase)) return; touring = true; tour = { step: "hold", wait: 0.4 }; run(); }, 12000);
}
// Giảm chuyển động: khung tĩnh ở đỉnh pic của chất đã chọn, các hạt đứng yên, sắc ký đồ vẽ đủ
function settleNow() {
  seed = 4242;
  parts.length = 0;
  state.phase = "run";
  state.t = Math.max(0, state.res.tR - lead() - 0.04);
  state.spray = 1;
  for (let i = 0; i < 150; i++) { stepParts(1 / 60); state.t += (1 / 60) * (state.res.tEnd / RUN_VIS); }
  state.phase = "done";
  state.t = state.res.tEnd;
  traceKey = "";
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) { run(); draw(); } }, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (key === " " || key === "Enter" || key === "Escape" || key.startsWith("Arrow")) event.preventDefault();
  else return;
  takeOver();
  if (key === " " || key === "Enter") { if (state.phase === "done" || state.phase === "idle") inject(); }
  else if (key === "Escape") abort();
  else change(key);
  if (still.matches && key !== "Escape") settleNow();
  draw();
  run();
});
svgEl.addEventListener("click", () => {
  takeOver();
  if (state.phase === "done" || state.phase === "idle") inject();
  if (still.matches) settleNow();
  stage.focus({ preventScroll: true });
  draw();
  run();
});
stage.addEventListener("focus", () => say(readout.textContent));

compute();
if (RUN_IN) say(`Dữ liệu từ app: ${state.res.analyte} ${dec(state.res.run.conc, 2)} ng/mL, nền ${dec(state.res.run.matrix * 100, 0)} %${START.warnings.length ? ` (${START.warnings.join("; ")})` : ""}.`);
if (still.matches) settleNow();
draw();
</script></body></html>
