<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tủ ấm lắc ổn nhiệt</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(700px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình tủ ấm lắc. Mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng.
   Live code đặt trên nhóm máy: data-open (cửa mở), data-run (đang lắc), data-heat (đang sưởi), data-lamp (đèn trong bật),
   data-alarm, data-blink; trên mỗi khối dịch: --t (độ đục 0–1 theo OD600).
   Màu vật liệu (vỏ, bảng điều khiển, inox, bọt, nhôm, gang, cao su…) được bản dựng sinh thêm từ các token này. */
.iso {
  --sk-skin: #e4e7e9;
  --sk-fascia: #3b4652;
  --sk-liner: #b7c3cc;
  --sk-foam: #d2b24a;
  --sk-steel: #c5ced5;
  --sk-alu: #a9b3bb;
  --sk-iron: #3a3f44;
  --sk-rubber: #17191b;
  --sk-bench: #2c3a35;
  --sk-dark: #1a1e22;
  --sk-keycap: #2f9e6a;
  --sk-foil: #d8dde1;
  --sk-cap0: #2f6fe0;
  --sk-cap1: #f2c230;
  --sk-glass: #a8d0e0;
  --sk-pp: #e8f0f2;
  --sk-broth: #e6cf7a;
  --sk-turbid: #c9a46a;
  --sk-broth-edge: #b8984c;
  --sk-lcd: #10283a;
  --sk-lcd-ink: #e9f6ff;
  --sk-lcd-dim: #8fb2c9;
  --sk-lcd-alarm: #4a1414;
  --sk-slot: #0b0d0f;
  --sk-void: #07090a;
  --sk-lens: #3a3d33;
  --sk-lens-on: #fff1b8;
  --sk-pool: #fff1b8;
  --sk-led-off: #2b3330;
  --sk-led-on: #4be08a;
  --sk-led-alarm: #ff4b3a;
  --sk-warn: #f2c230;
  --sk-icon: #f4fbf7;
}
.iso[data-theme="light"] {
  --sk-skin: #ffffff;
  --sk-fascia: #4a5663;
  --sk-liner: #d3dde5;
  --sk-foam: #f0cf5c;
  --sk-steel: #d8e0e6;
  --sk-alu: #c3ccd3;
  --sk-iron: #4b5157;
  --sk-rubber: #34393e;
  --sk-bench: #5c6f66;
  --sk-dark: #262b30;
  --sk-keycap: #2a9a63;
  --sk-foil: #eef1f3;
  --sk-cap0: #2c66d8;
  --sk-cap1: #e9b41c;
  --sk-glass: #7fb3c8;
  --sk-pp: #c9d6db;
  --sk-broth: #e2c565;
  --sk-turbid: #b98d4f;
  --sk-broth-edge: #9c7a33;
  --sk-lcd: #0e2233;
  --sk-lcd-ink: #eef7ff;
  --sk-lcd-dim: #9dbbd1;
  --sk-lcd-alarm: #4a1010;
  --sk-slot: #3a4046;
  --sk-void: #2a2f33;
  --sk-lens: #6b6e64;
  --sk-lens-on: #ffe48a;
  --sk-pool: #ffd75a;
  --sk-led-off: #b9c2bd;
  --sk-led-on: #23a855;
  --sk-led-alarm: #e2341f;
  --sk-warn: #e9b41c;
  --sk-icon: #ffffff;
}

/* Thuỷ tinh và nhựa trong: mặt rất mờ, giữ đường viền của bộ công cụ */
.sk-glass .iso-fill { fill: var(--sk-glass); fill-opacity: 0.1; }
.sk-glass .iso-top, .sk-glass .iso-shade { fill: var(--sk-glass); fill-opacity: 0.14; stroke: none; }
.sk-glass .iso-solid[data-seamless] > .iso-shade[data-shade], .sk-glass .iso-solid[data-seamless] > .iso-top { stroke: none; }
.sk-pane .iso-fill { fill-opacity: 0.05; }
.sk-pane .iso-top, .sk-pane .iso-shade { fill-opacity: 0.06; }
.sk-pp .iso-fill { fill: var(--sk-pp); fill-opacity: 0.16; }
.sk-pp .iso-top, .sk-pp .iso-shade { fill: var(--sk-pp); fill-opacity: 0.2; stroke: none; }
.sk-pp .iso-solid[data-seamless] > .iso-shade[data-shade], .sk-pp .iso-solid[data-seamless] > .iso-top { stroke: none; }

/* Dịch nuôi cấy: LB trong màu vàng rơm nhạt, đục dần sang vàng nâu khi OD600 tăng (--t: 0–1) */
.sk-broth { fill: color-mix(in oklab, var(--sk-broth), var(--sk-turbid) calc(var(--t, 0) * 100%)); fill-opacity: calc(0.3 + var(--t, 0) * 0.55); }
.sk-broth-top { fill: color-mix(in oklab, var(--sk-broth), var(--sk-turbid) calc(var(--t, 0) * 70%)); fill-opacity: calc(0.42 + var(--t, 0) * 0.45); stroke: var(--sk-broth-edge); stroke-width: 0.35px; vector-effect: non-scaling-stroke; }

/* Mũ ống nhựa hai màu */
.iso .sk-cap0 { --cap: var(--sk-cap0); }
.iso .sk-cap1 { --cap: var(--sk-cap1); }

.sk-slot { fill: var(--sk-slot); }
.sk-void { fill: var(--sk-void); }
.sk-warn { fill: var(--sk-warn); }
.sk-icon { fill: var(--sk-icon); }

/* Đèn halogen trong buồng: sáng khi cửa mở (chế độ AUTO) hoặc khi xoay núm */
.sk-lens { fill: var(--sk-lens); transition: fill 0.25s var(--anatomy-ease); }
.sk-machine[data-lamp] .sk-lens { fill: var(--sk-lens-on); }
.sk-pool { fill: var(--sk-pool); opacity: 0; transition: opacity 0.4s var(--anatomy-ease); pointer-events: none; }
.sk-machine[data-lamp] .sk-pool { opacity: 0.16; }
.iso[data-theme="light"] .sk-machine[data-lamp] .sk-pool { opacity: 0.22; }

/* Màn hình LCD */
.sk-lcd { fill: var(--sk-lcd); transition: fill 0.3s var(--anatomy-ease); }
.sk-machine[data-alarm] .sk-lcd { fill: var(--sk-lcd-alarm); }
.sk-lcd-ink, .sk-lcd-dim { font-family: var(--anatomy-mono); fill: var(--sk-lcd-ink); }
.sk-lcd-dim { fill: var(--sk-lcd-dim); }

/* Đèn trạng thái: xanh khi đang lắc, đỏ nhấp nháy khi báo động */
.iso .sk-led .iso-shade, .iso .sk-led .iso-top, .iso .sk-led .iso-fill { fill: var(--sk-led-off); transition: fill 0.2s var(--anatomy-ease); }
.iso .sk-machine[data-run] .sk-led .iso-shade, .iso .sk-machine[data-run] .sk-led .iso-top, .iso .sk-machine[data-run] .sk-led .iso-fill { fill: var(--sk-led-on); }
.iso .sk-machine[data-alarm][data-blink] .sk-led .iso-shade, .iso .sk-machine[data-alarm][data-blink] .sk-led .iso-top, .iso .sk-machine[data-alarm][data-blink] .sk-led .iso-fill { fill: var(--sk-led-alarm); }

.sk-stage { touch-action: pan-y; cursor: pointer; }
.sk-stage:focus { outline: none; }
.sk-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.sk-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.sk-skin .iso-top{fill:color-mix(in oklab, var(--anatomy-top), var(--sk-skin) 60%)}.sk-skin .iso-solid[data-seamless]>.iso-top{stroke:color-mix(in oklab, var(--anatomy-top), var(--sk-skin) 60%)}.sk-skin .iso-fill{fill:color-mix(in oklab, var(--anatomy-paper), var(--sk-skin) 60%)}.sk-skin .iso-shade[data-shade="0"]{fill:color-mix(in oklab, var(--anatomy-shade-0), var(--sk-skin) 60%)}.sk-skin .iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:color-mix(in oklab, var(--anatomy-shade-0), var(--sk-skin) 60%)}.sk-skin .iso-shade[data-shade="1"]{fill:color-mix(in oklab, var(--anatomy-shade-1), var(--sk-skin) 60%)}.sk-skin .iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:color-mix(in oklab, var(--anatomy-shade-1), var(--sk-skin) 60%)}.sk-skin .iso-shade[data-shade="2"]{fill:color-mix(in oklab, var(--anatomy-shade-2), var(--sk-skin) 60%)}.sk-skin .iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:color-mix(in oklab, var(--anatomy-shade-2), var(--sk-skin) 60%)}.sk-skin .iso-shade[data-shade="3"]{fill:color-mix(in oklab, var(--anatomy-shade-3), var(--sk-skin) 60%)}.sk-skin .iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:color-mix(in oklab, var(--anatomy-shade-3), var(--sk-skin) 60%)}

2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Dịch nuôi cấy: OD600 thấp thì trong, từ 2 trở lên đục vàng nâu</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Mâm, kẹp, bình và giá ống cùng chạy một quỹ đạo tròn đường kính 2,54 cm</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Thành cắt lớp: vỏ thép sơn, bọt cách nhiệt, vỏ trong inox</span></span><span class="iso-caption">Tủ ấm lắc vẽ theo New Brunswick Innova 42 (ngoài 62 × 75,4 × 82 cm; buồng 51,8 × 51,6 cm, cao 47,7 cm trên mặt mâm; mâm 46 × 46 cm; cửa sổ 25,1 × 34,6 cm kính ba lớp). Cơ cấu lệch tâm ba trục có đối trọng đưa cả mâm chạy trên một vòng tròn đường kính 2,54 cm (bản 1 inch), 25–400 rpm; buồng giữ ±0,1 °C ở 37 °C, từ 5 °C trên nhiệt độ phòng tới 80 °C. Mâm càng nhanh, dịch càng bị hất ra thành bình: ở 200 rpm gia tốc của mâm là 5,6 m/s² (mặt thoáng nghiêng khoảng 30°), ở 250 rpm là 8,7 m/s², nên dịch quét lên thành và hoà oxy tốt hơn; vì thế bình chỉ chứa tới 1/5 thể tích. Bài biến nạp: phục hồi tế bào trong SOC ở 37 °C, 250 rpm, 1 giờ; nuôi qua đêm trong LB có ampicillin. Mở cửa thì máy dừng lắc, tắt sưởi và bật đèn trong (theo manual). Bản lề cửa bên trái, chiều quay theo chiều kim đồng hồ, cơ cấu dưới mâm, kẹp và tốc độ nguội khi mở cửa là cấu tạo điển hình và số minh hoạ, chưa xác minh với hãng; mặt thoáng vẽ gần đúng tĩnh, hình chạy chậm lại khi trên 300 rpm; đồng hồ và nhiệt độ buồng trong hình chạy nhanh 30 lần.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

        }

}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

const cross2 = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
/** Bao lồi của các điểm màn hình (monotone chain). */
function screenHull(points) {
  const pts = [...points].sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  if (pts.length < 3) return pts;
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross2(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross2(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop();
  lower.pop();
  return lower.concat(upper);
}

const pathOfPoints = (pts) => (pts.length > 2 ? `M${pts.map(([x, y]) => `${x.toFixed(2)} ${y.toFixed(2)}`).join("L")}Z` : "");

/**
 * Hình chiếu khối chất lỏng (lồi: phần trong ống cắt bởi mặt thoáng và mặt s ≤ sMax).
 * @returns {{ body: string, top: string, topPoints: number[][] }} body: đường bao lồi; top: đa giác mặt thoáng.
 */
function sampleShape(F, profile, na, nv, c, sMax, at, { angles = 24, step = 1.5 } = {}) {
  const ss = [];
  for (let i = 0; i < profile.length - 1; i++) {
    const [a0] = profile[i];
    const [a1] = profile[i + 1];
    const n = Math.max(1, Math.ceil((a1 - a0) / step));
    for (let j = 0; j < n; j++) ss.push(a0 + ((a1 - a0) * j) / n);
  }
  ss.push(profile[profile.length - 1][0]);
  const world = (s, r, th) => {
    const cu = Math.cos(th) * r;
    const cv = Math.sin(th) * r;
    return [0, 1, 2].map((k) => F.o[k] + F.a[k] * s + F.u[k] * cu + F.v[k] * cv);
  };
  const body = [];
  const top = [];
  for (let k = 0; k < angles; k++) {
    const th = (k / angles) * Math.PI * 2;
    const y = Math.sin(th);
    let prev = null;
    for (const s of ss) {
      const r = sampleRadius(profile, s);
      const f = na * s + nv * r * y - c; // ≤ 0: trong chất lỏng
      const g = s - sMax; // ≤ 0: chưa tới mặt cắt
      const cur = { s, r, f, g };
      if (f <= 0 && g <= 0) body.push(at(world(s, r, th)));
      if (prev) {
        if ((prev.f <= 0) !== (f <= 0)) {
          const t = prev.f / (prev.f - f);
          const sx = prev.s + (s - prev.s) * t;
          const rx = prev.r + (r - prev.r) * t;
          if (sx <= sMax) {
            const p = at(world(sx, rx, th));
            body.push(p);
            top.push([th, p]);
          }
        }
        if ((prev.g <= 0) !== (g <= 0)) {
          const t = prev.g / (prev.g - g);
          const sx = prev.s + (s - prev.s) * t;
          const rx = prev.r + (r - prev.r) * t;
          if (na * sx + nv * rx * y - c <= 0) body.push(at(world(sx, rx, th)));
        }
      }
      prev = cur;
    }
  }
  top.sort((p, q) => p[0] - q[0]);
  const topPoints = top.map(([, p]) => p);
  return { body: pathOfPoints(screenHull(body)), top: topPoints.length > 2 ? pathOfPoints(screenHull(topPoints)) : "", topPoints };
}
// Cửa trước của tủ ấm lắc (theo New Brunswick Innova 42): cửa cách nhiệt quay quanh trục đứng (bản lề trái, chưa xác minh),
// giữa cửa có cửa sổ kính ba lớp 25,1 × 34,6 cm, phía sau có gioăng quanh miệng buồng, bên phải có tay nắm.
// Dùng chung cho bản dựng (Node, ghi hình dạng để kiểm tra) và trang (dựng lại cửa mỗi khung hình).
// Toạ độ trong cửa: u dọc bề rộng tính từ trục bản lề, v theo pháp tuyến mặt trước (v = 0 ở trục), z như thế giới.

function makeDoor(k, G, P, D) {

  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);
  const rect = (u0, u1, v0, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];
  const frameAt = (theta) => {
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    return G.frameOf([D.H[0], D.H[1], 0], [0, 0, 1], [c, s, 0], [-s, c, 0]);
  };

    ["gasket.bottom", rect(g.u[0], g.u[1], ...GV), g.z[0], g.z[0] + g.w],
    ["gasket.top", rect(g.u[0], g.u[1], ...GV), g.z[1] - g.w, g.z[1]],
    ["gasket.hinge", rect(g.u[0], g.u[0] + g.w, ...GV), g.z[0] + g.w, g.z[1] - g.w],

  const HANDLE = [
    ["handle.post0", rect(Hd.u[0] + 1, Hd.u[1] - 1, VF, VF + Hd.reach - 1.4), Hd.z[0] + 3, Hd.z[0] + 7],
    ["handle.post1", rect(Hd.u[0] + 1, Hd.u[1] - 1, VF, VF + Hd.reach - 1.4), Hd.z[1] - 7, Hd.z[1] - 3],
    ["handle.bar", k.roundedPlan({ x: Hd.u[0], y: VF + Hd.reach - 1.4, w: Hd.u[1] - Hd.u[0], d: 1.8, r: 0.8 }, 3), Hd.z[0], Hd.z[1]],
  ];
  const LEAVES = D.knuckles.map(([z0, z1], i) => [`leaf${i}`, rect(0.6, 9, VF - 0.2, VF + 0.8), z0, z1]);

  const KF0 = (z) => G.frameOf([D.H[0], D.H[1], z], [0, 0, 1], [1, 0, 0], [0, 1, 0]);

  // Đường nẹp trên mặt trước (khung kín quanh cửa sổ và quanh mép cửa) và nhãn cảnh báo kẹp tay
  function frontLines(F) {
    const loop = (pts) => k.pathOf(pts.map(([u, z]) => at(local(F, u, VF, z))), true);
    const m = 2.2;
    const outer = loop([[U0 + 3, Z0 + 3], [U1 - 3, Z0 + 3], [U1 - 3, Z1 - 3], [U0 + 3, Z1 - 3]]);
    const win = loop([[Wn.u[0] - m, Wn.z[0] - m], [Wn.u[1] + m, Wn.z[0] - m], [Wn.u[1] + m, Wn.z[1] + m], [Wn.u[0] - m, Wn.z[1] + m]]);

  function backLines(F) {

    return Ln(loop([[g.u[0] + g.w + 2, g.z[0] + g.w + 2], [g.u[1] - g.w - 2, g.z[0] + g.w + 2], [g.u[1] - g.w - 2, g.z[1] - g.w - 2], [g.u[0] + g.w + 2, g.z[1] - g.w - 2]]), { tone: "faint" });

  /** SVG của cả cánh cửa ở góc θ; các mảnh xếp theo độ sâu thật (xa vẽ trước). */

    const prism = (poly, z0, z1) => G.prismOf(F, poly, z0, z1, P);
    const KF = (z) => G.frameOf(local(F, 0, 0, z), [0, 0, 1], F.u, F.v);

    const panes = PANES.map(([, poly, z0, z1]) => ({ d: mid(poly, z0, z1), svg: `<g class="sk-glass sk-pane">${S(prism(poly, z0, z1), { tone: "hi", crease: "none" })}</g>` }));
    const gaskets = GASKET.map(([, poly, z0, z1]) => ({ d: mid(poly, z0, z1), svg: `<g class="sk-rubber">${S(prism(poly, z0, z1), { tone: "lo" })}</g>` }));
    const byD = (xs) => xs.sort((a, b) => a.d - b.d).map((x) => x.svg).join("");
    // Mặt lớn liền một tấm (che đường ghép giữa các mảnh khung): mặt trước hoặc mặt sau có lỗ cửa sổ, và mặt trên
    const paint = (normal) => { const b = G.toneOf(normal, P); return b < 4 ? `class="iso-shade" data-shade="${b}"` : `class="iso-top"`; };
    const face = (v, normal) => {
      const loop = (pts) => k.pathOf(pts.map(([u, z]) => at(local(F, u, v, z))), true);
      const d = loop([[U0, Z0], [U1, Z0], [U1, Z1], [U0, Z1]]) + loop([[Wn.u[0], Wn.z[0]], [Wn.u[1], Wn.z[0]], [Wn.u[1], Wn.z[1]], [Wn.u[0], Wn.z[1]]]);
      return `<g class="sk-door"><g class="iso-solid"><path ${paint(normal)} fill-rule="evenodd" d="${d}"/><path class="iso-line iso-edge" data-tone="mid" d="${d}"/></g></g>`;
    };

    const top = `<g class="sk-door"><g class="iso-solid"><path ${paint([0, 0, 1])} d="${topLoop}"/><path class="iso-line iso-edge" data-tone="mid" d="${topLoop}"/></g></g>`;
    const skin = (front ? face(VF, F.v) : face(VB, G.mul3(F.v, -1))) + top;
    const facade = front ? frontLines(F) : backLines(F);
    const handle = HANDLE.map(([, poly, z0, z1], i) => `<g class="${i === 2 ? "sk-steel" : "sk-door"}">${S(prism(poly, z0, z1), { tone: i === 2 ? "hi" : "mid" })}</g>`).join("");
    const leaves = LEAVES.map(([, poly, z0, z1]) => S(prism(poly, z0, z1), { tone: "lo" })).join("");
    const knuckles = D.knuckles.map(([z0, z1]) => `<g class="sk-steel">${S(G.disc(0, z1 - z0, D.knuckleR, KF(z0), P, { steps: 20 }), { tone: "mid" })}</g>`).join("");
    const fixed = D.knuckles.map(([, z1]) => `<g class="sk-steel">${S(k.slabOf({ x: B.x[0], y: B.y[0], w: B.x[1] - B.x[0], d: B.y[1] - B.y[0], r: 0.6 }, z1, B.h, P, 2), { tone: "lo" })}</g>` + `<g class="sk-steel">${S(G.disc(0, B.h, D.knuckleR, KF0(z1), P, { steps: 20 }), { tone: "mid" })}</g>`).join("");

    const outside = fixed + knuckles + leaves + handle;
    return front ? body + facade + outside : outside + body + facade;
  }

  /** Hình dạng ghi cho bản kiểm tra (cùng hình học với parts). */
  function shapes(theta, A, meta) {
    const F = frameAt(theta);
    const KF = (z) => G.frameOf(local(F, 0, 0, z), [0, 0, 1], F.u, F.v);
    return [
      ...FRAME.map(([name, poly, z0, z1]) => A.prism(F, poly, z0, z1, meta(`door.${name}`))),
      ...PANES.map(([name, poly, z0, z1]) => A.prism(F, poly, z0, z1, meta(`door.${name}`))),
      ...GASKET.map(([name, poly, z0, z1]) => A.prism(F, poly, z0, z1, meta(`door.${name}`))),
      ...HANDLE.map(([name, poly, z0, z1]) => A.prism(F, poly, z0, z1, meta(`door.${name}`))),
      ...LEAVES.map(([name, poly, z0, z1]) => A.prism(F, poly, z0, z1, meta(`door.${name}`))),
      ...D.knuckles.map(([z0, z1], i) => A.disc(KF(z0), 0, z1 - z0, D.knuckleR, meta(`door.knuckle${i}`))),
      ...D.knuckles.flatMap(([, z1], i) => [
        A.slab({ x: B.x[0], y: B.y[0], w: B.x[1] - B.x[0], d: B.y[1] - B.y[0], r: 0.6 }, z1, B.h, meta(`door.bracket${i}`), 2),
        A.disc(KF0(z1), 0, B.h, D.knuckleR, meta(`door.pin${i}`)),
      ]),
    ];

  return { parts, shapes, frameAt, local, frontVisible };
}

// Module thuần (không DOM): bản dựng và trang cùng gọi. Dùng lại phép tính thể tích và hình chiếu chất lỏng

//
// Mặt thoáng (gần đúng tĩnh, minh hoạ): trong hệ quy chiếu của mâm, chất lỏng chịu trọng lực g hướng xuống và lực quán tính
// rω² hướng ra theo độ lệch tâm của mâm, nên mặt thoáng nghiêng góc atan(rω²/g) và dồn về phía lệch tâm (trễ pha một chút).

function makeLiquid(k, P) {

      c = sampleLevel(def.profile, -Math.cos(t), -Math.sin(t), def.volume);

    return c;

   * Hình chiếu khối chất lỏng của một bình.
   * @param def { kind, mouth: [x, y, z], profile: [[s, r], ...] (s từ miệng xuống), volume (đơn vị³) }

   */
  function shape(def, tilt, phi) {
    const t = Math.round(tilt * 400) / 400;
    const v = [Math.cos(phi), Math.sin(phi), 0];
    const u = [-Math.sin(phi), Math.cos(phi), 0];
    const F = { o: def.mouth, a: [0, 0, -1], u, v };
    const c = levelOf(def, t);
    const sMax = def.profile[def.profile.length - 1][0];

  function svg(def, tilt, phi) {
    const s = shape(def, tilt, phi);
    return `<path class="sk-broth" d="${s.body}"/>${s.top ? `<path class="sk-broth-top" d="${s.top}"/>` : ""}`;
  }
  return { shape, svg };
}

// dùng chung cho bản dựng (Node), trang hình (trình duyệt) và sau này cho lõi mô phỏng của app (src/core).

//   tràn, vỏ ổ bi; mục 4: cần 84 cm bề ngang để mở cửa (cửa quay quanh trục đứng).
//
// Các số ước tính, chưa xác minh với hãng (minh hoạ):
// - Phía bản lề cửa (vẽ bên trái), chiều quay của mâm (vẽ theo chiều kim đồng hồ nhìn từ trên).

const TAU_OPEN_S = 240; // minh hoạ
const TAU_CLOSED_S = 360; // minh hoạ
const TILT_MAX = (40 * Math.PI) / 180;
const TILT_LAG = (25 * Math.PI) / 180;
const DIRECTION = -1; // −1: chiều kim đồng hồ nhìn từ trên (chưa xác minh)

// Bình nuôi cấy: bình tam giác 250 mL cổ hẹp (Ø đáy 85 mm, cao 145 mm, cổ Ø 34 mm) chứa 50 mL (quy tắc ≤ 20 %),

const num = (v, fallback) => (Number.isFinite(Number(v)) && v !== null && v !== "" ? Number(v) : fallback);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

const clampRpm = (rpm) => (rpm <= 0 ? 0 : clamp(Math.round(rpm), INNOVA42.rpm[0], INNOVA42.rpm[1]));
const clampSet = (c, ambient = AMBIENT_C) => clamp(Math.round(c * 10) / 10, ambient + INNOVA42.tempAboveAmbient, INNOVA42.tempMax);

/** Chuẩn hoá dữ liệu #run theo hợp đồng { setC, tempC, rpm, door, hours, flasks: [{ label, od, kind }] }. */
function normalizeRun(run) {
  const r = run && typeof run === "object" ? run : DEFAULT_RUN;
  const setC = clampSet(num(r.setC, 37));
  const flasks = (Array.isArray(r.flasks) ? r.flasks : [])
    .slice(0, MAX_VESSELS)
    .map((f, i) => ({
      label: String(f?.label ?? `Bình ${i + 1}`).slice(0, 40),
      od: clamp(num(f?.od, 0), 0, 4),
      kind: f?.kind === "tube" ? "tube" : "flask",
    }));
  return {
    setC,
    tempC: clamp(num(r.tempC, setC), 4, 90),
    rpm: clampRpm(num(r.rpm, 200)),
    door: r.door === "open" ? "open" : "closed",
    hours: clamp(num(r.hours, 0), 0, 99.9),
    flasks,
  };
}

const omegaOf = (rpm) => (2 * Math.PI * rpm) / 60; // rad/s
const periodOf = (rpm) => (rpm > 0 ? 60 / rpm : Infinity); // s
/** Gia tốc hướng tâm của mâm (m/s²) với quỹ đạo của máy. */
const accelOf = (rpm, orbitMm = INNOVA42.orbitMm) => (orbitMm / 2000) * omegaOf(rpm) ** 2;
/** Góc nghiêng mặt thoáng (rad), gần đúng tĩnh, giới hạn TILT_MAX. */
const tiltOf = (rpm) => Math.min(TILT_MAX, Math.atan(accelOf(rpm) / G_ACC));

/** Độ lệch tâm của mâm (mm) ở pha ψ (rad): mọi điểm của mâm đi cùng một vòng tròn bán kính = nửa đường kính quỹ đạo. */
function platformOffset(psi, orbitMm = INNOVA42.orbitMm) {
  const r = orbitMm / 2;
  return [r * Math.cos(psi), r * Math.sin(psi)];
}
/** Pha quỹ đạo sau dt giây ở tốc độ rpm (theo chiều quay của máy). */
const advancePhase = (psi, rpm, dt) => (psi + DIRECTION * omegaOf(rpm) * dt) % (2 * Math.PI);
/** Hướng (rad) mà chất lỏng dồn về: theo hướng lệch tâm, trễ pha TILT_LAG theo chiều quay. */
const sloshAngle = (psi) => psi - DIRECTION * TILT_LAG;

/** Tốc độ thực tiến về tốc độ đích theo mạch tăng/giảm tốc. */
function rampRpm(rpm, target, dt) {
  const d = target - rpm;
  const s = RAMP_RPM_S * dt;
  return Math.abs(d) <= s ? target : rpm + Math.sign(d) * s;
}

/** Nhiệt độ không khí trong buồng sau dt giây: cửa mở thì sưởi tắt, nguội về nhiệt độ phòng. */
function stepTemp(T, dt, { setC, door, ambient = AMBIENT_C }) {
  if (door === "open") return ambient + (T - ambient) * Math.exp(-dt / TAU_OPEN_S);
  return setC + (T - setC) * Math.exp(-dt / TAU_CLOSED_S);
}

/** Độ đục 0–1 theo OD600 (minh hoạ): tăng nhanh ở OD thấp, bão hoà từ OD 2. */
const turbidityOf = (od) => Math.min(1, Math.sqrt(Math.max(0, od) / 2));

/** Báo động theo [DS]/[MAN]: cửa mở, nhiệt độ lệch > 1 °C, tốc độ lệch > 5 rpm khi đã chạy ổn định. */
function alarmsOf({ setC, tempC, rpmSet, rpm, door, running, settled }) {
  const out = [];
  if (door === "open") out.push("cửa mở");
  if (Math.abs(tempC - setC) > INNOVA42.alarmC) out.push(`nhiệt độ lệch ${fmt(tempC - setC, 1, true)} °C`);
  if (running && settled && Math.abs(rpm - rpmSet) > INNOVA42.alarmRpm) out.push("tốc độ lệch");
  return out;
}

const fmt = (v, digits = 1, sign = false) => {
  const s = Math.abs(v).toFixed(digits).replace(".", ",");
  return (v < 0 ? "−" : sign && v > 0 ? "+" : "") + s;
};

const P = D.P;

const slots = []; // { def, node, label, od }
{

const OPEN = D.open;
const spring = (x, target) => ({ x, v: 0, target });
const state = {
  door: spring(RUN.door === "open" ? OPEN : 0, RUN.door === "open" ? OPEN : 0),
  running: RUN.rpm > 0,
  rpmSet: RUN.rpm > 0 ? RUN.rpm : 200,
  rpm: RUN.rpm > 0 && RUN.door !== "open" ? RUN.rpm : 0,
  setC: RUN.setC,
  temp: RUN.tempC,
  hours: RUN.hours,
  psi: 0.9,
  clock: 0,
  lampUntil: 0,
  pick: null,
  pickUntil: 0,
  settledAt: 0,
};
let doorDrawn = null;
let liquidKey = "";
let frame = 0;
let previous = 0;
let visible = false;
let touring = !RAW && !still.matches;

const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const doorOpen = () => state.door.x > 0.02 || state.door.target > 0;
const fmtC = (v) => fmt(v, 1);

function drawDoor() {
  const th = state.door.x;
  const key = th.toFixed(4);
  if (key === doorDrawn) return;
  doorDrawn = key;
  const markup = DM.parts(th);
  if (th > 0.6) { el.open.innerHTML = markup; el.closed.innerHTML = ""; }
  else { el.closed.innerHTML = markup; el.open.innerHTML = ""; }
}

// Mâm: dịch chuyển trên màn hình của độ lệch tâm (mm → đơn vị 4 mm)
function drawDeck() {
  const [ox, oy] = platformOffset(state.psi).map((v) => v * 0.25); // mâm dừng ở đâu thì đứng ở đó
  const [xX, xY, yX, yY] = D.deckScreen;
  const t = `translate(${(ox * xX + oy * yX).toFixed(2)} ${(ox * xY + oy * yY).toFixed(2)})`;
  for (const n of el.deck) n.setAttribute("transform", t);
}
function drawLiquid() {
  const tilt = tiltOf(state.rpm);
  const phi = sloshAngle(state.psi);
  const key = `${tilt.toFixed(3)}:${phi.toFixed(2)}`;
  if (key === liquidKey) return;
  liquidKey = key;
  for (const s of slots) s.node.innerHTML = LQ.svg(s.def, tilt, phi);
}

// Lò xo giảm chấn tới hạn; gần đóng thì chốt hẳn (gioăng hút cửa)
function stepSpring(L, dt, calm, tau, max) {
  if (calm) { L.x = L.target; L.v = 0; return false; }
  const w = 1 / tau;
  for (let i = 0; i < 4; i++) {
    const h = dt / 4;
    L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h;
    L.x += L.v * h;
  }
  L.x = Math.min(max, Math.max(0, L.x));
  if (L.target === 0 && L.x < 0.02 * max) { L.x = 0; L.v = 0; return false; }
  if (Math.abs(L.target - L.x) < 1e-4 * max && Math.abs(L.v) < 1e-4) { L.x = L.target; L.v = 0; return false; }
  return true;
}

function update(dt, calm) {
  state.clock += dt;
  const open = doorOpen();
  // Công tắc cửa: mở cửa thì dừng lắc (giảm tốc êm) và tắt sưởi
  const target = state.running && !open ? state.rpmSet : 0;
  const before = state.rpm;
  state.rpm = calm ? target : rampRpm(state.rpm, target, dt);
  if (state.rpm !== target || before !== target) state.settledAt = state.clock;
  if (!calm && state.rpm > 0) state.psi = advancePhase(state.psi, Math.min(state.rpm, SHOW_MAX), dt);
  const sdt = calm ? 0 : dt * SIM_SPEED;
  state.temp = stepTemp(state.temp, sdt, { setC: state.setC, door: open ? "open" : "closed" });
  if (state.rpm > 0 && !calm) state.hours = Math.min(99.9, state.hours + sdt / 3600);
  if (open) state.lampUntil = state.clock + 15; // chế độ AUTO: đèn sáng khi cửa mở và 15 giây sau khi đóng
}

function text(node, value) { if (node && node.textContent !== value) node.textContent = value; }

function draw(calm) {
  drawDoor();
  drawDeck();
  drawLiquid();
  const open = doorOpen();
  const heat = !open && state.temp < state.setC - 0.05;
  const settled = state.clock - state.settledAt > 3;
  const alarms = alarmsOf({ setC: state.setC, tempC: state.temp, rpmSet: state.rpmSet, rpm: state.rpm, door: open ? "open" : "closed", running: state.running, settled });
  const m = el.machine;
  m.toggleAttribute("data-open", open);
  m.toggleAttribute("data-run", state.rpm > 0.5);
  m.toggleAttribute("data-heat", heat);
  m.toggleAttribute("data-lamp", open || state.clock < state.lampUntil);
  m.toggleAttribute("data-alarm", alarms.length > 0);
  m.toggleAttribute("data-blink", calm || Math.floor(state.clock * 2.5) % 2 === 0);
  text(el.temp, state.temp.toFixed(1));
  text(el.rpm, String(Math.round(state.rpm)));
  text(el.time, `${state.hours.toFixed(1)} h`);
  text(el.flags, [heat ? "HEAT" : "", open ? "DOOR" : "", !state.running ? "STOP" : ""].filter(Boolean).join(" "));
  let line;
  if (state.pick && state.clock < state.pickUntil) line = state.pick;
  else {
    line = `${fmtC(state.temp)} °C · ${Math.round(state.rpm)} rpm · ${fmt(state.hours, 1)} h`;
    if (open) line += " · cửa mở";
    else if (!state.running) line += " · dừng";
    else if (Math.abs(state.rpm - state.rpmSet) > 0.5) line += ` → ${state.rpmSet}`;
    if (state.rpm > SHOW_MAX) line += " · hình chậm lại";
  }
  if (readout.textContent !== line) readout.textContent = line;
  const alarmText = alarms.join(", ");
  if (alarmText !== lastAlarm) {
    lastAlarm = alarmText;
    if (alarmText) say(`Báo động: ${alarmText}.`);
  }
}

function toggleDoor() {
  state.door.target = state.door.target > 0 ? 0 : OPEN;
  say(state.door.target > 0 ? "Mở cửa: máy dừng lắc, tắt sưởi, đèn trong bật." : "Đóng cửa: máy tăng tốc lại về tốc độ đặt, sưởi kéo nhiệt độ về điểm đặt.");
}
function toggleRun() {
  state.running = !state.running;

}
function nudgeRpm(d) {

}
function resetAll() {
  Object.assign(state, { running: RUN.rpm > 0, rpmSet: RUN.rpm > 0 ? RUN.rpm : 200, setC: RUN.setC, temp: RUN.tempC, hours: RUN.hours, pick: null });

// Vòng giới thiệu (không có #run): lắc, mở cửa (dừng lắc, đèn sáng), đóng cửa, tăng tốc lại.
function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "shake") { state.door.target = OPEN; say("Mở cửa: máy dừng lắc, tắt sưởi, đèn trong bật."); tour = { step: "open", wait: 4 }; }
  else if (tour.step === "open") { state.door.target = 0; tour = { step: "shake", wait: 9 }; }
}

function tick(now) {

  stepSpring(state.door, dt, calm, 0.34, OPEN);
  update(dt, calm);
  draw(calm);

}
function loop() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "shake", wait: 7 }; }
  clearTimeout(idleTimer);
  if (RAW) return;
  idleTimer = setTimeout(() => { if (still.matches) return; touring = true; tour = { step: "shake", wait: 2 }; loop(); }, 15000);
}
function settleNow() {
  stepSpring(state.door, 0, true, 1, OPEN);
  update(0, true);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) loop(); else if (still.matches) draw(true); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (![" ", "Enter", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === "Enter") toggleDoor();
  else if (key === " ") toggleRun();
  else if (key === "ArrowUp") nudgeRpm(25);
  else if (key === "ArrowDown") nudgeRpm(-25);
  else if (key === "ArrowRight") nudgeSet(0.5);
  else if (key === "ArrowLeft") nudgeSet(-0.5);
  else { resetAll(); say("Đặt lại theo lượt chạy."); }
  if (still.matches) settleNow();
  draw(still.matches);
  loop();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  const vessel = event.target.closest("[data-vessel]");
  const part = event.target.closest("[data-part]")?.dataset.part ?? "";
  if (vessel?.dataset.label) {
    const s = slots.find((x) => (x.idx < 6 ? `f${x.idx}` : `t${x.idx - 6}`) === vessel.dataset.vessel);
    state.pick = `${s.kind === "tube" ? "Ống" : "Bình"} · ${s.label} · OD600 ${fmt(s.od, 2)}`;
    state.pickUntil = state.clock + 4;
    say(state.pick);
  } else if (["key", "knob-mark", "lcd", "led", "disp-temp", "disp-rpm"].includes(part)) toggleRun();
  else toggleDoor();
  if (still.matches) settleNow();
  stage.focus({ preventScroll: true });
  draw(still.matches);
  loop();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) settleNow();
draw(still.matches);
</script></body></html>
