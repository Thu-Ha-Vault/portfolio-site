<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Điện di protein SDS-PAGE</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>/* Màu riêng của hình SDS-PAGE: mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng. */
.iso {
  --tk-clear: #8fb8cc;
  --tk-glass: #a9cfd9;
  --tk-buffer: #3f86a8;
  --tk-gel: #6f9aa6;
  --tk-core: #3b4146;
  --tk-green: #3fae6a;
  --tk-strip: #8c9aa1;
  --tk-well: #0d1a20;
  --tk-prestained: #5b7cff;
  --tk-protein: #d9e6ea;
  --tk-bpb: #8f6bff;
  --tk-stained: #93acdf;
  --tk-coomassie: #0b1758;
  --tk-destain: #8fb8cc;
  --tk-red: #e4513f;
  --tk-black: #2f3438;
  --tk-void: #050708;
  --tk-lcd: #0c1a14;
  --tk-lcd-text: #8ff0b8;
  --tk-led-off: #22382c;
  --tk-led-on: #5cf08e;
  --tk-bubble: #dcecf3;
}
.iso[data-theme="light"] {
  --tk-clear: #b9d6e3;
  --tk-glass: #c5e0e8;
  --tk-buffer: #7fb6d1;
  --tk-gel: #d7e7ea;
  --tk-core: #4a5056;
  --tk-green: #2f9a58;
  --tk-strip: #9aa7ad;
  --tk-well: #3a5560;
  --tk-prestained: #2a46d6;
  --tk-protein: #6c7f86;
  --tk-bpb: #4b2fc4;
  --tk-stained: #c3d3f2;
  --tk-coomassie: #0f1e78;
  --tk-destain: #b9d6e3;
  --tk-red: #d43a2a;
  --tk-black: #33383c;
  --tk-void: #20262a;
  --tk-lcd: #b9d7a2;
  --tk-lcd-text: #1c2c14;
  --tk-led-off: #5f6e58;
  --tk-led-on: #19b04a;
  --tk-bubble: #ffffff;
}

/* Nhựa trong (bể, nắp, khay nhuộm): nền trong mờ, nét viền giữ nguyên. */
.tk-clear .iso-fill { fill: var(--tk-clear); fill-opacity: 0.05; }
.tk-clear .iso-top { fill: var(--tk-clear); fill-opacity: 0.08; }
.tk-clear .iso-shade { fill: var(--tk-clear); fill-opacity: 0.1; stroke: none; }
/* Kính: trong hơn nhựa một chút, ánh xanh */
.tk-glass .iso-fill { fill: var(--tk-glass); fill-opacity: 0.04; }
.tk-glass .iso-top { fill: var(--tk-glass); fill-opacity: 0.25; }
.tk-glass .iso-shade { fill: var(--tk-glass); fill-opacity: 0.18; stroke: none; }
/* Gel polyacrylamide: trong, hơi đục */
.tk-gel .iso-fill, .tk-gel .iso-top { fill: var(--tk-gel); fill-opacity: 0.22; }
.tk-gel .iso-shade { fill: var(--tk-gel); fill-opacity: 0.45; stroke: none; }
.tk-wellhole { fill: var(--tk-well); fill-opacity: 0.35; }
/* Khối điện cực (nhựa PBT tối), gioăng và tay kẹp xanh, gân đệm của kính */
.tk-core .iso-fill { fill: var(--tk-core); }
.tk-core .iso-top { fill: color-mix(in oklab, var(--tk-core) 80%, white); }
.tk-core .iso-shade { fill: var(--tk-core); stroke: none; }
.tk-green .iso-fill, .tk-green .iso-shade { fill: var(--tk-green); stroke: none; }
.tk-green .iso-top { fill: color-mix(in oklab, var(--tk-green) 78%, white); }
.tk-strip .iso-fill, .tk-strip .iso-shade, .tk-strip .iso-top { fill: var(--tk-strip); fill-opacity: 0.55; stroke: none; }

.tk-buffer { fill: var(--tk-buffer); fill-opacity: 0.14; stroke: none; }
.tk-destain { fill: var(--tk-destain); fill-opacity: 0.12; stroke: none; }
.tk-stained .iso-fill, .tk-stained .iso-top { fill: var(--tk-stained); }
.tk-stained .iso-shade { fill: color-mix(in oklab, var(--tk-stained) 80%, black); stroke: none; }

.tk-prestained { fill: var(--tk-prestained); }
/* Ống mẫu: nhựa mờ, dịch mẫu xanh của bromophenol blue */
.tk-tube .iso-fill, .tk-tube .iso-top, .tk-tube .iso-shade { fill: color-mix(in oklab, var(--tk-bpb) 45%, var(--anatomy-shade-1)); stroke: none; }
.tk-protein { fill: var(--tk-protein); }
.tk-bpb { fill: var(--tk-bpb); opacity: 0.85; }
.tk-coomassie { fill: var(--tk-coomassie); }
.tk-bubble { fill: var(--tk-bubble); stroke: var(--anatomy-lo); stroke-width: 0.25px; vector-effect: non-scaling-stroke; opacity: 0; }

.tk-collar-red { fill: var(--tk-red); }
.tk-collar-black { fill: var(--tk-black); }
.tk-void { fill: var(--tk-void); }
.tk-jack-red .iso-top, .tk-jack-red .iso-shade { fill: color-mix(in oklab, var(--tk-red) 82%, var(--anatomy-shade-1)); stroke: none; }
.tk-jack-black .iso-top, .tk-jack-black .iso-shade { fill: color-mix(in oklab, var(--tk-black) 82%, var(--anatomy-shade-1)); stroke: none; }
.tk-lead-red .tb-body { fill: var(--tk-red); }
.tk-lead-black .tb-body { fill: var(--tk-black); }

.tk-panel { fill: var(--anatomy-shade-1); }
.tk-slot { fill: var(--anatomy-shade-0); }
.tk-lcd { fill: var(--tk-lcd); }
.tk-lcdtext { font-family: var(--anatomy-mono); font-weight: 600; fill: var(--tk-lcd-text); white-space: pre; }
.tk-led { fill: var(--tk-led-off); }
.iso .tk-led[data-on] { fill: var(--tk-led-on); }

.tk-stage { touch-action: pan-y; cursor: pointer; }
.tk-stage:focus { outline: none; }
.tk-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.tk-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

o-Rad Mini-PROTEAN Tetra Cell (16 × 12 × 18 cm, tối đa 600 V) và nguồn theo PowerPac HC (5–250 V, tối đa 300 W). SDS phủ điện âm đều lên protein đã biến tính, nên mọi protein chạy từ giếng ở buồng trong (cathode, đen) xuống đáy gel về buồng ngoài (anode, đỏ), và chỉ còn tách theo khối lượng: gel polyacrylamide là tấm lưới, protein nhỏ luồn qua nhanh. Ở gel cô phía trên, các protein dồn thành một vạch mỏng sát vạch bromophenol blue; sang gel phân tách thì quãng đường gần tuyến tính với log khối lượng. Manual của hãng: chạy 200 V hằng thế khoảng 35 phút, đệm 700 mL cho hai gel (550 mL ở buồng ngoài). Vị trí băng nội suy từ biểu đồ chạy thang Precision Plus Protein của Bio-Rad (minh hoạ); gel 12 % tách tốt khoảng 15–250 kDa. Hình chạy nhanh hơn thực tế: một giây là một phút.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;

function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

function towardViewer(projection) {

    const { sinA, cosA, sinE, cosE } = cameraOf(projection);

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

function pathOf(points, closed = false) {

function roundedPlan({ x, y, w, d, r }, steps = 8) {

        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

function runsOf(flags, want) {

  el.tank.textContent = "";
  nodes = [];
  state.lanes.slice(0, D.lanes).forEach((lane, i) => {
    const bands = (lane.bands ?? []).filter((b) => Number(b.kDa) > 0); // cùng bộ lọc với bandsFor
    bands.forEach((b) => {
      const node = document.createElementNS(NS, "path");
      node.setAttribute("class", lane.ladder ? "tk-prestained" : "tk-protein");
      el.tank.appendChild(node);
      nodes.push({ node, lane: i, kDa: Number(b.kDa), ladder: !!lane.ladder });
    });
    if (bands.length) {
      const node = document.createElementNS(NS, "path");
      node.setAttribute("class", "tk-bpb");
      el.tank.appendChild(node);
      nodes.push({ node, lane: i, dye: true });
    }
  });
}
function drawTank() {
  const r = bandsFor(state.lanes, { percent: state.percent, minutes: state.minutes, volts: state.volts });
  const byLane = r.lanes.map((lane) => [...lane.bands]);
  for (const n of nodes) {
    let mm;
    let h;
    let alpha;
    if (n.dye) { mm = r.frontMm; h = 1.2; alpha = 0.85; }
    else {
      const b = byLane[n.lane].shift();
      mm = b.mm; h = b.width;
      alpha = n.ladder ? 0.35 + 0.6 * b.intensity : 0.1 + 0.15 * b.intensity;
    }
    const off = mm > D.tank.run;
    n.node.style.display = off ? "none" : "";
    if (off) continue;
    const [x0, x1] = laneSpan(n.lane);
    n.node.setAttribute("d", quadTank(x0, x1, D.tank.wellZ - mm, h));
    n.node.style.opacity = alpha.toFixed(2);
  }
  return r;
}
// Gel đã nhuộm: kết quả của lượt chạy người dùng (nếu đã chạy xong) hoặc của lượt chạy đủ thời gian
function drawStain() {
  const minutes = RUN && !RUN.running && RUN.minutes > 0 ? RUN.minutes : endMinutes(base.volts, base.percent);
  const r = bandsFor(base.lanes, { percent: base.percent, minutes, volts: base.volts });
  el.stain.innerHTML = r.lanes
    .map((lane, i) => {
      const [x0, x1] = laneSpan(i, D.stain.cx);
      return lane.bands.filter((b) => !b.off).map((b) => `<path class="tk-coomassie" style="opacity:${(0.3 + 0.65 * b.intensity).toFixed(2)}" d="${quadStain(x0, x1, D.stain.wellY + b.mm, b.width)}"/>`).join("");
    })
    .join("");
}

const SPEED = 1; // một giây trên hình bằng một phút thật
let frame = 0;
let previous = 0;
let visible = false;
let touring = !still.matches && !RUN;
let tour = { step: "wait", wait: 1.2 };
let idleTimer = 0;
const say = (text) => { if (status.textContent !== text) status.textContent = text; };
const clock = (min) => `${String(Math.floor(min)).padStart(2, "0")}:${String(Math.floor((min % 1) * 60)).padStart(2, "0")}`;

function draw(dt, calm) {
  const r = drawTank();
  state.fade = calm ? state.fadeTarget : state.fade + (state.fadeTarget - state.fade) * (1 - Math.exp(-dt / 0.25));
  el.tank.style.opacity = state.fade.toFixed(3);
  // Bọt khí: lượng khí theo dòng điện, cathode (H₂) gấp đôi anode (O₂)
  const mA = state.run ? currentAt(state.minutes, state.volts, state.percent) : 0;
  const gasTarget = state.run && !calm ? 1 : 0;
  state.gas += (gasTarget - state.gas) * (1 - Math.exp(-dt / 0.4));
  state.clock += dt;
  for (const b of el.bubbles) {
    const rise = b.side < 0 ? D.rise.cathode : D.rise.anode;
    const rate = (0.3 + mA / 400) * (0.8 + 0.13 * (b.i % 4)) * (b.side < 0 ? 0.6 : 1.1);
    const p = (b.i * 0.618 + state.clock * rate) % 1;
    const dz = p * rise;
    b.node.setAttribute("transform", `translate(${(D.up[0] * dz).toFixed(2)} ${(D.up[1] * dz).toFixed(2)})`);
    b.node.style.opacity = (state.gas * Math.sin(Math.PI * p) * 0.9).toFixed(3);
  }
  const shownmA = state.run || state.minutes > 0 ? Math.round(state.run ? mA : 0) : 0;
  const l1 = `${String(state.volts).padStart(3, " ")} V  ${String(shownmA).padStart(3, " ")} mA`;
  const l2 = `${clock(state.minutes)}  ${state.done ? "XONG" : state.run ? "CHẠY" : "DỪNG"}`;
  if (el.lcd1.textContent !== l1) el.lcd1.textContent = l1;
  if (el.lcd2.textContent !== l2) el.lcd2.textContent = l2;
  el.led.toggleAttribute("data-on", state.run);
  const cm = fmtNum(Math.min(r.frontMm, D.tank.run) / 10, 1);
  let out;
  if (state.done) out = `xong · ${Math.round(state.minutes)} phút · gel ${fmtNum(state.percent, 0)} %`;
  else if (state.run || state.minutes > 0) out = `${state.volts} V · ${Math.floor(state.minutes)} phút · vạch màu ${cm} cm`;
  else out = `sẵn sàng · ${state.volts} V · gel ${fmtNum(state.percent, 0)} %`;
  if (readout.textContent !== out) readout.textContent = out;
}

function setRun(on) {
  if (on && state.done) reset();
  state.run = on;
  say(on ? `Chạy ở ${state.volts} V.` : "Tạm dừng.");
}
function reset() { state.minutes = 0; state.done = false; state.run = false; }
function setVolt(v) {
  // Đổi điện áp giữa chừng: giữ quãng đường đã đi (đổi phút đã chạy theo tỉ lệ điện áp)
  const f = state.minutes / endOf();
  state.volts = Math.max(50, Math.min(250, v));
  state.minutes = f * endOf();
  say(`${state.volts} V`);
}

function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "wait") { setRun(true); tour = { step: "running", wait: 0 }; }
  else if (tour.step === "running") { if (state.done) tour = { step: "hold", wait: 3 }; }
  else if (tour.step === "hold") { state.fadeTarget = 0; tour = { step: "out", wait: 0.9 }; }
  else if (tour.step === "out") { reset(); state.fadeTarget = 1; tour = { step: "wait", wait: 1.6 }; }
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  if (state.run) {
    state.minutes += dt * SPEED;
    if (state.minutes >= endOf()) { state.minutes = endOf(); state.run = false; state.done = true; say("Xong: vạch bromophenol blue đã tới đáy gel."); }
  }
  draw(dt, calm);
  const busy = !calm && (touring || state.run || state.gas > 0.002 || Math.abs(state.fade - state.fadeTarget) > 0.002);
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  if (touring) { touring = false; tour = { step: "wait", wait: 1.2 }; state.fadeTarget = 1; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || state.run || RUN) return; touring = true; run(); }, 9000);
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (![" ", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Escape"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === " ") setRun(!state.run);
  else if (key === "ArrowRight" || key === "ArrowUp") setVolt(state.volts + (event.shiftKey ? 50 : 10));
  else if (key === "ArrowLeft" || key === "ArrowDown") setVolt(state.volts - (event.shiftKey ? 50 : 10));
  else if (key === "Escape") { reset(); say("Đặt lại."); }
  // Giảm chuyển động: mỗi lần Space nhảy một phần sáu lượt chạy, không có hoạt cảnh
  if (still.matches && key === " " && state.run) { state.minutes = Math.min(endOf(), state.minutes + endOf() / 6); state.run = false; state.done = state.minutes >= endOf(); }
  draw(1 / 60, still.matches);
  run();
});
svgEl.addEventListener("click", () => { takeOver(); setRun(!state.run); stage.focus({ preventScroll: true }); run(); });
stage.addEventListener("focus", () => say(readout.textContent));

buildTank();
drawStain();
if (RUN) {
  state.minutes = Math.min(RUN.minutes, endOf());
  state.done = state.minutes >= endOf();
  state.run = RUN.running && !state.done && !still.matches;
} else if (still.matches) state.minutes = endOf() * 0.55; // khung tiêu biểu: giữa lượt chạy
draw(1 / 60, still.matches);
</script></body></html>
