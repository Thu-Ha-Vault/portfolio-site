<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Máy vortex và ly tâm mini</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Màu riêng của hình máy vortex và ly tâm mini: mỗi màu là một token, có giá trị cho giao diện tối (mặc định) và sáng. */
.iso {
  --vx-clear: #9cc0d0;
  --vx-dome: #9d8cff;
  --vx-liquid: #4f9fd8;
  --vx-liquid-top: #8cc8f0;
  --vx-funnel: #0d2233;
  --vx-drop: #b9e2ff;
  --vx-sweep: #6d7f8c;
  --vx-void: #07090b;
  --vx-glove: #7a86e8;
  --vx-pointer: #ffffff;
  --vx-rubber: #0b0d0f;
  --vx-rubber-mix: 70%;
  --vx-rubber-line: #59616a;
  --vx-rubber-faint: #2c3238;
}
.iso[data-theme="light"] {
  --vx-clear: #b4cfdb;
  --vx-dome: #7a66e6;
  --vx-liquid: #3b8fd0;
  --vx-liquid-top: #9fd0f2;
  --vx-funnel: #16486e;
  --vx-drop: #2f86c8;
  --vx-sweep: #8d9aa3;
  --vx-void: #2a3036;
  --vx-glove: #6a78e0;
  --vx-pointer: #111111;
  --vx-rubber: #5d646b;
  --vx-rubber-mix: 62%;
  --vx-rubber-line: #2f3439;
  --vx-rubber-faint: #4a5056;
}

/* Nhựa trong (ống ly tâm): nền trong mờ, nét viền giữ nguyên. */
.vx-clear .iso-fill { fill: var(--vx-clear); fill-opacity: 0.14; }
.vx-clear .iso-top { fill: var(--vx-clear); fill-opacity: 0.2; }
.vx-clear .iso-shade { fill: var(--vx-clear); fill-opacity: 0.24; stroke: none; }
/* Nắp vòm polycarbonate có màu, trong suốt */
.vx-dome .iso-fill { fill: var(--vx-dome); fill-opacity: 0.1; }
.vx-dome .iso-top { fill: var(--vx-dome); fill-opacity: 0.16; }
.vx-dome .iso-shade { fill: var(--vx-dome); fill-opacity: 0.14; stroke: none; }
.vx-dome .iso-solid[data-seamless] > .iso-shade[data-shade], .vx-dome .iso-solid[data-seamless] > .iso-top,
.vx-clear .iso-solid[data-seamless] > .iso-shade[data-shade], .vx-clear .iso-solid[data-seamless] > .iso-top { stroke: none; }

.vx-liquid { fill: var(--vx-liquid); fill-opacity: 0.55; }
.vx-liquid-top { fill: var(--vx-liquid-top); fill-opacity: 0.8; stroke: var(--vx-liquid); stroke-width: 0.3px; vector-effect: non-scaling-stroke; }
.vx-funnel { fill: var(--vx-funnel); fill-opacity: 0.55; }
.vx-funnel-line { fill: none; stroke: var(--vx-liquid); stroke-width: 0.4px; vector-effect: non-scaling-stroke; }
.vx-streak { fill: none; stroke: var(--vx-liquid-top); stroke-width: 0.6px; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.vx-drop { fill: var(--vx-drop); stroke: var(--vx-liquid); stroke-width: 0.3px; vector-effect: non-scaling-stroke; }
.vx-sweep { fill: var(--vx-sweep); fill-rule: evenodd; }
.vx-void { fill: var(--vx-void); }
.vx-glove .iso-fill, .vx-glove .iso-top { fill: color-mix(in oklab, var(--vx-glove) 55%, var(--anatomy-top)); }
.vx-glove .iso-shade { fill: color-mix(in oklab, var(--vx-glove) 55%, var(--anatomy-shade-1)); stroke: none; }
.vx-glove .iso-solid[data-seamless] > .iso-shade[data-shade], .vx-glove .iso-solid[data-seamless] > .iso-top { stroke: none; }
.vx-pointer-dot { fill: var(--vx-pointer); }
.vx-mark { fill: var(--anatomy-lo); }

/* Công tắc 3 vị trí: chỉ hiện tư thế đang chọn */
[data-vxmode="touch"] [data-mode]:not([data-mode="touch"]),
[data-vxmode="on"] [data-mode]:not([data-mode="on"]),
[data-vxmode="off"] [data-mode]:not([data-mode="off"]) { display: none; }

.vx-stage { touch-action: pan-y; cursor: pointer; }
.vx-stage:focus { outline: none; }
.vx-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.vx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Cao su đen (cup, vành che, chân giác hút) và nhựa đen của rotor: tông tối hơn nhưng vẫn giữ bốn mức sáng. */
.vx-rubber .iso-fill { fill: color-mix(in oklab, var(--vx-rubber) var(--vx-rubber-mix), var(--anatomy-paper)); }
.vx-rubber .iso-top { fill: color-mix(in oklab, var(--vx-rubber) var(--vx-rubber-mix), var(--anatomy-top)); }
.vx-rubber .iso-shade[data-shade="0"] { fill: color-mix(in oklab, var(--vx-rubber) var(--vx-rubber-mix), var(--anatomy-shade-0)); }
.vx-rubber .iso-shade[data-shade="1"] { fill: color-mix(in oklab, var(--vx-rubber) var(--vx-rubber-mix), var(--anatomy-shade-1)); }
.vx-rubber .iso-shade[data-shade="2"] { fill: color-mix(in oklab, var(--vx-rubber) var(--vx-rubber-mix), var(--anatomy-shade-2)); }
.vx-rubber .iso-shade[data-shade="3"] { fill: color-mix(in oklab, var(--vx-rubber) var(--vx-rubber-mix), var(--anatomy-shade-3)); }
.vx-rubber .iso-solid[data-seamless] > .iso-shade[data-shade], .vx-rubber .iso-solid[data-seamless] > .iso-top { stroke: none; }
.vx-rubber .iso-line { stroke: var(--vx-rubber-line); }
.vx-rubber .iso-line[data-tone="faint"] { stroke: var(--vx-rubber-faint); }

: đóng nắp là chạy ở tốc độ cố định 6000 vòng/phút, mở nắp là dừng. Đáy ống cách trục 4,97 cm nên RCF = 1,118 × 10⁻⁵ × r × n² = 2000 × g. Tăng tốc khoảng 3 s, dừng khoảng 7 s, gom hết giọt sau khoảng 5 s là số giả định; độ sâu phễu và thời gian trộn chỉ minh hoạ. Hình quay chậm hơn thực tế (vẽ theo nhịp hoạt nghiệm). Phím M đổi công tắc giữa bật liên tục, tắt và chạm. Mô tơ, cam, đối trọng, công tắc chạm và rotor vẽ theo cấu tạo điển hình, không theo sơ đồ của hãng.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];

      split(s0, s1, 0);

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {

    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;

    const [s0] = meridian[i];

    const b = vertexNormal(i + 1, faces[i]);

      out.to -= TAU;

    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));

      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;

        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;

    for (let index = 0; index < hull.length; index++) {

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;
    if (end >= from && start <= to) {
      const t0 = Math.max(0, (from - start) / (length || 1));
      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));
    }
    walked = end;
  }
  return out;
}

const pointAlong = (points, at) => {
  const piece = cut(points, at, at + 0.01);
  return piece[0] ?? points[points.length - 1];
};

function tangentAlong(points, at) {
  const total = pathLength(points);
  const a = pointAlong(points, Math.max(0, at - 0.6));
  const b = pointAlong(points, Math.min(total, at + 0.6));
  return unit3(sub3(b, a));
}

function spiral(F, s, r0, r1, a0, a1, steps = 28) {
  const out = [];
  for (let index = 0; index <= steps; index++) {
    const t = index / steps;
    out.push(pointOf(F, s, r0 + (r1 - r0) * t, a0 + (a1 - a0) * t));
  }
  return out;
}

function arcPoints(F, s, r, a0, a1, steps = 24) {
  return Array.from({ length: steps + 1 }, (_, index) => pointOf(F, s, r, a0 + ((a1 - a0) * index) / steps));
}

return { viewOf, scaleOf, frameAlong, frameOf, pointOf, disc, ringBand, solidOf, lathe, prismOf, arcOf, circleOf, ribsOf, dot3, add3, sub3, mul3, unit3, cross3, len3, lightOf, toneOf };})();
// Mô hình máy vortex và máy ly tâm mini, dùng chung cho bản dựng (Node), trang hình (trình duyệt) và lõi mô phỏng của app.
// Module thuần: không DOM, không Three.js.
//
// Máy vortex làm mẫu: Scientific Industries Vortex-Genie 2 (SI-0236, 120 V; SI-0256 bản 230 V EU).
// Nguồn:
// - Scientific Industries, Genie Product Catalog (trang 1–2), bảng SPECIFICATIONS của Vortex-Genie 2:
//   https://www.labrepco.com/wp-content/uploads/2018/11/Scientific-Industries-Genie-Product-Catalog.pdf
//   · tốc độ 600–3200 rpm (2700 rpm với bản 50 Hz); kèm cup bật ra (pop-off cup) và đĩa 3 inch;
//   · kích thước 165 × 122 × 165 mm (sâu × rộng × cao), nặng 4 kg; điều khiển "Hands-Free or Touch-On";
//   · cùng catalog, máy Vortex-Genie 2 Platform ghi "Orbit 4mm dia. (Same as Vortex-Genie 2)":
//     quỹ đạo đường kính 4 mm, tức bán kính lệch tâm 2 mm.
// - Listing của các nhà phân phối (Fisher Scientific, Marshall Scientific) ghi công tắc 3 vị trí
//   (bật liên tục / tắt / chạm) và quỹ đạo 4,0 mm. Một tờ quảng cáo cũ của hãng ghi "large 6 mm orbit";
//   con số 4,9 mm không tìm thấy nguồn: dùng 4 mm (chưa xác minh bằng manual của hãng).
// - Thang núm vặn và quan hệ vạch–rpm: hãng không công bố; giả định tuyến tính 0–10 ứng với 600–3200 rpm.
//
// Máy ly tâm mini làm mẫu: Labnet Spectrafuge Mini (C1301, nắp trong có màu).
// Nguồn:
// - Labnet/Remma, trang sản phẩm Spectrafuge Mini C1301: https://remma.fr/en/model/spectrafuge-c1301-centrifuge
//   · tốc độ cố định 6000 rpm, 2000 × g (1177 × g với rotor ống PCR dải); rotor 6 × 1,5/2,0 mL hoặc 2 dải 8 × 0,2 mL;
//   · 15 × 15 × 11,7 cm (rộng × sâu × cao), nặng 0,45 kg;
//   · bật/tắt bằng công tắc bên hông hoặc chỉ cần đóng/mở nắp; bản lề thép không gỉ.
// - SelectScience, Spectrafuge Mini: "can be started and stopped by closing and opening the lid when the switch is on".
//   https://www.selectscience.net/product/spectrafuge-mini-centrifuge
// - Công thức RCF (DIN 58 970): RCF = 1,118 × 10⁻⁵ × r (cm) × n² (rpm).
//   Bán kính lớn nhất suy ra từ hai số của hãng: r = 2000 / (1,118 × 10⁻⁵ × 6000²) ≈ 4,97 cm;
//   rotor ống dải: r = 1177 / (1,118 × 10⁻⁵ × 6000²) ≈ 2,92 cm.
// - Thời gian tăng tốc và dừng (phanh hay quay trơn): hãng không công bố. Giả định (chưa xác minh) tăng tốc
//   hằng số thời gian 1,0 s (đạt 95 % sau khoảng 3 s), dừng hằng số 1,2 s (gần dừng sau khoảng 4–5 s).
//
// Phần minh hoạ (không có nguồn đo, chỉ để hình chạy hợp lý):
// - Phễu xoáy: chất lỏng quay với tốc độ góc bằng η = 0,25 lần tần số quỹ đạo; độ sâu phễu của paraboloid
//   Δ = Ω²R²/(2g). Phễu chỉ hình thành khi gia tốc quỹ đạo ω²e vượt khoảng 1 g (Fr > 1), đầy đủ khi Fr ≥ 3.
// - Thời gian trộn: t = 2 s × (3200/rpm)² × (V/100 µL)^(1/3) khi Fr > 1.
// - Gom giọt khi ly tâm: giọt trên thành ống trượt xuống đáy khi lực ly tâm vượt 50 × g; gom xong khi tích
//   (RCF − 50) × thời gian đạt 6000 g·s (khoảng 3 s ở 2000 × g). Thực hành thường ly tâm nhanh 5–10 s.

const G0 = 9.80665; // m/s²

/** Thông số máy vortex (Vortex-Genie 2). Kích thước tính bằng mm. */
const VORTEX = {
  model: "Scientific Industries Vortex-Genie 2",
  size: { depth: 165, width: 122, height: 165 },
  mass: 4, // kg
  rpmMin: 600,
  rpmMax: 3200,
  rpmMax50Hz: 2700,
  orbitDia: 4, // mm, đường kính quỹ đạo
  dial: [0, 10], // thang núm (giả định)
  modes: ["on", "off", "touch"], // công tắc 3 vị trí
  swirl: 0.25, // η, minh hoạ
};

/** Ống ly tâm 1,5 mL điển hình (polypropylene). mm. */
const TUBE = {
  od: 10.8,
  id: 8.8,
  length: 38.5, // thân, không kể nắp
  cone: 17, // chiều dài phần côn ở đáy
  tipId: 2.2,
  volume: 500, // µL mẫu trong ống trên máy vortex
  spinVolume: 250, // µL mẫu trong mỗi ống của máy ly tâm
  // Profile [s, r] tính từ miệng ống dọc trục về đáy (mm), kích thước ống 1,5 mL điển hình (chưa xác minh theo hãng ống).
  outer: [[0, 5.4], [21.5, 5.15], [37.6, 1.5], [38.5, 0]],
  inner: [[0.6, 4.45], [21.5, 4.2], [37.0, 0.9], [37.6, 0]],
};

/** Thông số máy ly tâm mini (Spectrafuge Mini). */
const SPIN = {
  model: "Labnet Spectrafuge Mini C1301",
  size: { width: 150, depth: 150, height: 117 },
  mass: 0.45, // kg
  rpm: 6000,
  rcf: 2000,
  rcfStrip: 1177,
  places: 6,
  rMax: 2000 / (1.118e-5 * 6000 * 6000), // cm ≈ 4,97
  rStrip: 1177 / (1.118e-5 * 6000 * 6000), // cm ≈ 2,92
  tubeAngle: 45, // độ, rotor góc cố định (điển hình, chưa xác minh)
  tauUp: 1.0, // s, giả định
  tauDown: 1.2, // s, giả định
  slideRcf: 50, // × g, minh hoạ
  collectGs: 6000, // g·s, minh hoạ
};

const vxClamp = (v, a, b) => Math.min(b, Math.max(a, v));
const vxStep = (a, b, x) => {
  const t = vxClamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};

/** Giới hạn rpm của máy vortex trong dải 600–3200 (bản 60 Hz). */
const clampVortexRpm = (rpm, v = VORTEX) => vxClamp(Math.round(rpm), v.rpmMin, v.rpmMax);

/** Vạch núm (0–10) → rpm, giả định tuyến tính. */
const dialToRpm = (d, v = VORTEX) => v.rpmMin + (vxClamp(d, v.dial[0], v.dial[1]) / v.dial[1]) * (v.rpmMax - v.rpmMin);

/** rpm → vạch núm (0–10). */
const rpmToDial = (rpm, v = VORTEX) => ((clampVortexRpm(rpm, v) - v.rpmMin) / (v.rpmMax - v.rpmMin)) * v.dial[1];

/**
 * Chuyển động quỹ đạo của đầu cup ở một tốc độ.
 * @param {number} rpm vòng/phút của mô tơ (bằng số vòng quỹ đạo mỗi phút)
 * @returns {{ hz: number, radius: number, speed: number, accelG: number, froude: number }}
 *   hz: tần số quỹ đạo; radius: bán kính lệch tâm (mm); speed: tốc độ dài của tâm cup (m/s);
 *   accelG: gia tốc hướng tâm (bội số g); froude: Fr = ω²e/g.
 */
function orbitOf(rpm, v = VORTEX) {
  const hz = rpm / 60;
  const w = 2 * Math.PI * hz;
  const e = v.orbitDia / 2 / 1000; // m
  const accel = w * w * e;
  return { hz, radius: v.orbitDia / 2, speed: w * e, accelG: accel / G0, froude: accel / G0 };
}

/**
 * Độ sâu phễu xoáy (mm) trong ống có bán kính trong R, ở tốc độ rpm (minh hoạ).
 * Δ = (η·ω·R)²/(2g), nhân với mức hình thành phễu theo Fr (1 → 3). Không vượt 0,8 chiều cao cột chất lỏng.
 */
function funnelDepth(rpm, fillMm = 20, R = TUBE.id / 2, v = VORTEX) {
  const o = orbitOf(rpm, v);
  const w = 2 * Math.PI * o.hz * v.swirl;
  const d = ((w * R) / 1000) ** 2 / (2 * G0) * 1000;
  return Math.min(0.8 * fillMm, d * vxStep(1, 3, o.froude));
}

/** Thời gian trộn ước lượng (s) cho V µL ở tốc độ rpm (minh hoạ). Infinity khi chưa có xoáy. */
function mixSeconds(rpm, volumeUl = TUBE.volume, v = VORTEX) {
  if (orbitOf(rpm, v).froude <= 1) return Infinity;
  return 2 * (v.rpmMax / rpm) ** 2 * Math.cbrt(volumeUl / 100);
}

/** RCF (× g) ở bán kính r (cm) và tốc độ n (rpm): 1,118 × 10⁻⁵ × r × n². */
const rcfOf = (rpm, rCm = SPIN.rMax) => 1.118e-5 * rCm * rpm * rpm;

/** Tốc độ (rpm) cần để đạt RCF ở bán kính r (cm). */
const rpmOfRcf = (rcf, rCm = SPIN.rMax) => Math.sqrt(rcf / (1.118e-5 * rCm));

/**
 * Một bước tốc độ rotor ly tâm mini: nắp đóng thì tăng về 6000 rpm, nắp mở thì giảm về 0 (giả định bậc nhất).
 * @param {number} rpm tốc độ hiện tại
 * @param {boolean} running nắp đóng và công tắc bật
 * @param {number} dt giây
 */
function spinStep(rpm, running, dt, s = SPIN) {
  const target = running ? s.rpm : 0;
  const tau = running ? s.tauUp : s.tauDown;
  const next = target + (rpm - target) * Math.exp(-dt / tau);
  return !running && next < 20 ? 0 : next;
}

/** Thời gian (s) từ lúc đóng nắp tới khi đạt tỉ lệ f của tốc độ tối đa (giả định bậc nhất). */
const spinUpSeconds = (f = 0.95, s = SPIN) => -s.tauUp * Math.log(1 - f);

/** Thời gian (s) từ lúc mở nắp tới khi rotor gần dừng (dưới 20 rpm). */
const spinDownSeconds = (s = SPIN) => s.tauDown * Math.log(s.rpm / 20);

/**
 * Tiến độ gom giọt trên thành ống về đáy (0–1) sau một bước dt ở RCF hiện tại (minh hoạ).
 * @param {number} progress tiến độ hiện tại
 * @param {number} rcf lực ly tâm tại đáy ống (× g)
 */
function collectStep(progress, rcf, dt, s = SPIN) {
  return Math.min(1, progress + (Math.max(0, rcf - s.slideRcf) * dt) / s.collectGs);
}

/** Thời gian ly tâm (s, tính từ lúc đóng nắp) để gom hết giọt, theo mô phỏng từng bước. */
function collectSeconds(s = SPIN, dt = 0.01) {
  let rpm = 0;
  let p = 0;
  let t = 0;
  while (p < 1 && t < 120) {
    rpm = spinStep(rpm, true, dt, s);
    p = collectStep(p, rcfOf(rpm, s.rMax), dt, s);
    t += dt;
  }
  return t;
}

/** Tiến độ gom giọt sau khi đóng nắp ly tâm `seconds` giây rồi mở nắp (tính cả lúc rotor đang dừng lại). */
function collectAfter(seconds, s = SPIN, dt = 0.01) {
  let rpm = 0;
  let p = 0;
  for (let t = 0; t < seconds; t += dt) {
    rpm = spinStep(rpm, true, dt, s);
    p = collectStep(p, rcfOf(rpm, s.rMax), dt, s);
  }
  for (let t = 0; rpm > 0 && t < 30; t += dt) {
    rpm = spinStep(rpm, false, dt, s);
    p = collectStep(p, rcfOf(rpm, s.rMax), dt, s);
  }
  return p;
}

const fmtInt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const fmtDec = (v, d = 1) => v.toFixed(d).replace(".", ",");
// Chất lỏng trong ống ly tâm 1,5 mL: thể tích dưới một mặt phẳng, mức chất lỏng, và hình chiếu của khối chất lỏng.
// Module thuần (không DOM), dùng chung cho bản dựng và trang. Không import: hàm chiếu `at` được truyền vào.
//
// Toạ độ trong ống: F = { o, a, u, v } với o là tâm miệng ống, a hướng về đáy ống, u và v vuông góc với a.
// Mặt phẳng chất lỏng viết trong toạ độ ống: na·s + nv·y ≤ c, với s đo dọc a, y đo dọc v
// (mặt thoáng không phụ thuộc u vì cả trọng lực lẫn lực ly tâm đều nằm trong mặt phẳng (a, v)).

/** Bán kính trong của ống tại s (mm), nội suy tuyến tính theo profile [[s, r], ...]. */
function sampleRadius(profile, s) {
  if (s <= profile[0][0]) return profile[0][1];
  for (let i = 1; i < profile.length; i++) {
    const [s1, r1] = profile[i];
    const [s0, r0] = profile[i - 1];
    if (s <= s1) return r0 + ((r1 - r0) * (s - s0)) / (s1 - s0 || 1);
  }
  return profile[profile.length - 1][1];
}

// Diện tích phần hình tròn bán kính r có toạ độ x ≤ d.
const segmentArea = (r, d) => {
  if (d <= -r) return 0;
  if (d >= r) return Math.PI * r * r;
  return r * r * Math.acos(-d / r) + d * Math.sqrt(r * r - d * d);
};

/** Thể tích (mm³ = µL) phần trong ống thoả na·s + nv·y ≤ c, cắt lát theo s. */
function sampleVolume(profile, na, nv, c, slices = 240) {
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const ds = (s1 - s0) / slices;
  let vol = 0;
  for (let i = 0; i < slices; i++) {
    const s = s0 + (i + 0.5) * ds;
    const r = sampleRadius(profile, s);
    const rest = c - na * s;
    let area;
    if (Math.abs(nv) < 1e-9) area = rest >= 0 ? Math.PI * r * r : 0;
    else if (nv > 0) area = segmentArea(r, rest / nv);
    else area = Math.PI * r * r - segmentArea(r, rest / nv);
    vol += area * ds;
  }
  return vol;
}

/** Hằng số c của mặt thoáng chứa đúng `volume` µL, với pháp tuyến (na, nv) đã chuẩn hoá. */
function sampleLevel(profile, na, nv, volume) {
  let lo = -200;
  let hi = 200;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (sampleVolume(profile, na, nv, mid, 160) < volume) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

const cross2 = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
/** Bao lồi của các điểm màn hình (monotone chain). */
function screenHull(points) {
  const pts = [...points].sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  if (pts.length < 3) return pts;
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross2(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross2(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop();
  lower.pop();
  return lower.concat(upper);
}

const pathOfPoints = (pts) => (pts.length > 2 ? `M${pts.map(([x, y]) => `${x.toFixed(2)} ${y.toFixed(2)}`).join("L")}Z` : "");

/**
 * Hình chiếu khối chất lỏng (lồi: phần trong ống cắt bởi mặt thoáng và mặt s ≤ sMax).
 * @returns {{ body: string, top: string, topPoints: number[][] }} body: đường bao lồi; top: đa giác mặt thoáng.
 */
function sampleShape(F, profile, na, nv, c, sMax, at, { angles = 24, step = 1.5 } = {}) {
  const ss = [];
  for (let i = 0; i < profile.length - 1; i++) {
    const [a0] = profile[i];
    const [a1] = profile[i + 1];
    const n = Math.max(1, Math.ceil((a1 - a0) / step));
    for (let j = 0; j < n; j++) ss.push(a0 + ((a1 - a0) * j) / n);
  }
  ss.push(profile[profile.length - 1][0]);
  const world = (s, r, th) => {
    const cu = Math.cos(th) * r;
    const cv = Math.sin(th) * r;
    return [0, 1, 2].map((k) => F.o[k] + F.a[k] * s + F.u[k] * cu + F.v[k] * cv);
  };
  const body = [];
  const top = [];
  for (let k = 0; k < angles; k++) {
    const th = (k / angles) * Math.PI * 2;
    const y = Math.sin(th);
    let prev = null;
    for (const s of ss) {
      const r = sampleRadius(profile, s);
      const f = na * s + nv * r * y - c; // ≤ 0: trong chất lỏng
      const g = s - sMax; // ≤ 0: chưa tới mặt cắt
      const cur = { s, r, f, g };
      if (f <= 0 && g <= 0) body.push(at(world(s, r, th)));
      if (prev) {
        if ((prev.f <= 0) !== (f <= 0)) {
          const t = prev.f / (prev.f - f);
          const sx = prev.s + (s - prev.s) * t;
          const rx = prev.r + (r - prev.r) * t;
          if (sx <= sMax) {
            const p = at(world(sx, rx, th));
            body.push(p);
            top.push([th, p]);
          }
        }
        if ((prev.g <= 0) !== (g <= 0)) {
          const t = prev.g / (prev.g - g);
          const sx = prev.s + (s - prev.s) * t;
          const rx = prev.r + (r - prev.r) * t;
          if (na * sx + nv * rx * y - c <= 0) body.push(at(world(sx, rx, th)));
        }
      }
      prev = cur;
    }
  }
  top.sort((p, q) => p[0] - q[0]);
  const topPoints = top.map(([, p]) => p);
  return { body: pathOfPoints(screenHull(body)), top: topPoints.length > 2 ? pathOfPoints(screenHull(topPoints)) : "", topPoints };
}
// Rotor 6 chỗ góc cố định 45° của máy ly tâm mini, sáu ống 1,5 mL có mẫu và giọt bám thành ống.
// Dùng chung cho bản dựng (Node, để ghi hình dạng ở góc 0 cho bước kiểm tra) và trang (dựng lại mỗi khung hình).
// Không import: k (iso-kit), G (lathe) được truyền vào; các hàm sample* lấy từ sample.mjs (trang ghép chung một script).
// Hình dạng rotor (trụ giữa có mặt bích, sáu tay đỡ, sáu cốc đỡ đáy ống) vẽ theo cấu tạo rotor mini điển hình,
// chưa xác minh theo hãng; tay đỡ để hở cho thấy mô tơ bên dưới qua phần cắt.



function makeRotor(k, G, P, D) {
  const V = G.viewOf(P);
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);
  const KS = G.scaleOf(P);
  const [cx, cy] = D.c;
  const al = D.alpha;
  const sa = Math.sin(al);
  const ca = Math.cos(al);
  const UPF = G.frameOf([cx, cy, 0], [0, 0, 1], [1, 0, 0], [0, 1, 0]);

  // Khung của ống thứ i ở góc quay phi: o = tâm miệng ống, a hướng về đáy ống (ra ngoài và xuống dưới).
  function tubeFrame(phi) {
    const rh = [Math.cos(phi), Math.sin(phi), 0];
    const a = [rh[0] * sa, rh[1] * sa, -ca];
    const u = [-Math.sin(phi), Math.cos(phi), 0];
    const v = [rh[0] * ca, rh[1] * ca, sa]; // a × u: ra ngoài và lên trên
    const tip = [cx + rh[0] * D.rTip, cy + rh[1] * D.rTip, D.zTip];
    const o = G.sub3(tip, G.mul3(a, D.L));
    return G.frameOf(o, a, u, v);
  }

  // Phần tĩnh đối xứng tròn: dựng một lần.
  const base = S(G.disc(D.base.z0, D.base.z1, D.base.r, UPF, P, { bevel: 0.5 }), { tone: "lo" });
  // Tay đỡ: hộp dọc bán kính từ trụ giữa tới cốc, mặt cắt ngang trong (tiếp tuyến, z)
  const ARM = [[-D.arm.w / 2, D.arm.z0], [D.arm.w / 2, D.arm.z0], [D.arm.w / 2, D.arm.z1], [-D.arm.w / 2, D.arm.z1]];
  const armFrame = (phi) => G.frameOf([cx, cy, 0], [Math.cos(phi), Math.sin(phi), 0], [-Math.sin(phi), Math.cos(phi), 0], [0, 0, 1]);
  const hub =
    S(G.disc(D.hub.z0, D.hub.z1, D.hub.r, UPF, P), { tone: "lo" }) +
    S(G.disc(D.crown.z0, D.crown.z1, D.crown.r, UPF, P, { bevel: 0.4 }), { tone: "lo" }) +
    S(G.disc(D.nut.z0, D.nut.z1, D.nut.r, UPF, P, { bevel: 0.3 }), { tone: "mid", inner: k.fadedSvg(G.ribsOf(UPF, D.nut.z0, D.nut.z1, D.nut.r, 18, P, { fade: [0.1, 0.55] }), { tone: "lo" }) }) +
    Ln(G.circleOf(UPF, D.nut.z1, 2.2, P), { tone: "lo" });
  const hubCentre = [cx, cy, (D.hub.z0 + D.nut.z1) / 2];

  // Mặt thoáng: lúc đứng yên nằm ngang (pháp tuyến z), lúc quay thì vuông góc với bán kính.

      A.prism(PF, TAB, -8, 8, meta("lid.tab")),
      A.prism(PF, LIP, -8, 8, meta("lid.lip")),

  }

  const EF = G.frameOf([D.vc[0] + e * Math.cos(state.psi), D.vc[1] + e * Math.sin(state.psi), 0], [0, 0, 1], [1, 0, 0], [0, 1, 0]);
  el.ecc.innerHTML = solidSvg(G.disc(D.cw.ez0, D.cw.ez1, D.cw.er, EF, P, { steps: 24 }), { tone: "mid" });
  el.pointer.setAttribute("transform", `rotate(${f2(-135 + 27 * state.dial)})`);
  drawLiquid();
}

// ——— Máy ly tâm ———
function drawLid() {
  const th = state.lid.x;
  const key = th.toFixed(4);
  if (key === state.lidKey) return;
  state.lidKey = key;
  ["shell", "hinge"].forEach((part, i) => {
    const markup = LIDM.svg(th, part);
    if (th > D.flip) { el.open[i].innerHTML = markup; el.closed[i].innerHTML = ""; }
    else { el.closed[i].innerHTML = markup; el.open[i].innerHTML = ""; }
  });
}
function drawRotor() {
  const rcf = rcfOf(state.spin);
  const w = Math.min(1, rcf / 150);
  const blur = ease(Math.max(0, Math.min(1, (state.spin - 400) / 2600)));
  const key = `${state.phi.toFixed(3)}:${w.toFixed(2)}:${blur.toFixed(2)}:${state.collect.toFixed(3)}:${state.dropFade.toFixed(2)}`;
  if (key === state.rotorKey) return;
  state.rotorKey = key;
  el.rotor.innerHTML = ROTM.svg(state.phi, { spin: w, blur, collect: state.collect, dropAlpha: state.dropFade });
}

function drawReadout() {
  let text;
  const o = orbitOf(state.motor);
  if (state.spin > 1) text = `ly tâm ${fmtInt(state.spin)} v/p · ${fmtInt(rcfOf(state.spin))} × g · giọt ${Math.round(state.collect * 100)} %`;
  else if (state.motor > 30) text = `vortex ${fmtInt(state.motor)} v/p · ${fmtDec(o.accelG)} g · trộn ${Math.round(state.mix * 100)} %`;
  else text = `sẵn sàng · vortex ${fmtInt(state.rpmSet)} v/p · ${state.mode === "touch" ? "chạm" : state.mode === "on" ? "bật" : "tắt"}`;
  if (readout.textContent !== text) readout.textContent = text;
  const phase = state.spin > 5900 ? "Rotor đạt 6000 vòng/phút, 2000 × g." : state.collect >= 1 && state.spin === 0 ? "Đã gom hết giọt về đáy ống." : state.mix >= 1 ? "Mẫu đã trộn đều." : "";
  if (phase && phase !== lastPhase) { lastPhase = phase; say(phase); }
}

function draw() {
  drawVortex();
  drawLid();
  drawRotor();
  drawReadout();
}

function step(dt, calm) {
  // Núm vặn và tốc độ mô tơ vortex
  state.dial = follow(state.dial, rpmToDial(state.rpmSet), dt, 0.15, calm);
  const liftTarget = state.held ? 0 : D.lift;
  state.lift = follow(state.lift, liftTarget, dt, 0.18, calm);
  if (Math.abs(state.lift - liftTarget) < 0.02) state.lift = liftTarget;
  state.pressAmt = follow(state.pressAmt, state.held && contact() ? 1 : 0, dt, 0.08, calm);
  const target = vortexOn() ? state.rpmSet : 0;
  state.motor = follow(state.motor, target, dt, target > state.motor ? 0.25 : 0.45, calm);
  if (state.motor < 5 && target === 0) state.motor = 0;
  // Nhịp hoạt nghiệm: quỹ đạo thật 10–53 vòng/giây, vẽ chậm lại còn tối đa khoảng 6 vòng/giây
  if (!calm) state.psi = (state.psi + dt * 2 * Math.PI * 6 * (state.motor / VORTEX.rpmMax)) % (Math.PI * 2);
  const swirl = state.held && contact() && state.motor > 0 ? funnelDepth(state.motor, 18) : 0;
  state.funnel = follow(state.funnel, swirl, dt, 0.35, calm);
  if (state.funnel < 0.02 && swirl === 0) state.funnel = 0;
  if (swirl > 0) state.mix = Math.min(1, state.mix + dt / mixSeconds(state.motor));
  // Nắp máy ly tâm: lò xo giảm chấn tới hạn theo góc, chốt khi gần đóng
  const L = state.lid;
  if (calm) { L.x = L.target; L.v = 0; }
  else {
    const w = 1 / 0.22;
    for (let i = 0; i < 4; i++) { const h = dt / 4; L.v += (w * w * (L.target - L.x) - 2 * w * L.v) * h; L.x += L.v * h; }
    L.x = Math.min(D.lidOpen, Math.max(0, L.x));
    if (Math.abs(L.target - L.x) < 2e-3 && Math.abs(L.v) < 0.05) { L.x = L.target; L.v = 0; }
  }
  // Rotor: đóng nắp là chạy, mở nắp là dừng
  state.spin = spinStep(state.spin, lidClosed(), dt);
  state.collect = collectStep(state.collect, rcfOf(state.spin), dt);
  if (!calm) state.phi = (state.phi + dt * 2 * Math.PI * 1.1 * (state.spin / SPIN.rpm)) % (Math.PI * 2);
  state.dropFade = follow(state.dropFade, 1, dt, 0.5, calm);
}

function busy() {
  return touring || state.motor > 0 || state.spin > 0 || state.held !== contact() || Math.abs(state.lift - (state.held ? 0 : D.lift)) > 0.02 || state.funnel > 0 || Math.abs(state.lid.x - state.lid.target) > 0 || Math.abs(state.dial - rpmToDial(state.rpmSet)) > 0.01 || state.dropFade < 0.999;
}

function tourStep(dt) {
  tour.wait -= dt;
  if (tour.wait > 0) return;
  if (tour.step === "wait") { state.held = true; tour = { step: "vortex", wait: 3.6 }; say("Ấn ống xuống cup: chế độ chạm, mô tơ chạy."); }
  else if (tour.step === "vortex") { state.held = false; tour = { step: "release", wait: 1.0 }; say("Nhả ống: mô tơ dừng."); }
  else if (tour.step === "release") { state.lid.target = 0; tour = { step: "closing", wait: 0 }; say("Đóng nắp máy ly tâm: rotor tự chạy."); }
  else if (tour.step === "closing") { if (lidClosed()) tour = { step: "spinning", wait: SPIN_HOLD }; }
  else if (tour.step === "spinning") { state.lid.target = D.lidOpen; tour = { step: "braking", wait: 0 }; say("Mở nắp: rotor dừng lại."); }
  else if (tour.step === "braking") { if (state.spin === 0) tour = { step: "rest", wait: 2.4 }; }
  else if (tour.step === "rest") { state.collect = 0; state.mix = 0; state.dropFade = 0; tour = { step: "wait", wait: 1.4 }; }
}

function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 30) : 1 / 60;
  previous = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  step(dt, calm);
  draw();
  frame = visible && !calm && busy() ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {
  // Dừng vòng giới thiệu: trả máy về trạng thái nghỉ để phím bấm có tác dụng như người dùng mong đợi.
  if (touring) { touring = false; tour = { step: "wait", wait: 1.4 }; state.held = false; state.lid.target = D.lidOpen; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (still.matches || state.held || state.spin > 0) return; touring = true; tour = { step: "wait", wait: 0.6 }; run(); }, 9000);
}
function calmUpdate() {
  // Giảm chuyển động: nhảy thẳng tới trạng thái cuối của thao tác
  if (!still.matches) return;
  if (lidClosed()) { state.spin = SPIN.rpm; state.collect = collectAfter(SPIN_HOLD); } else { state.spin = 0; }
  step(1 / 60, true);
  draw();
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (![" ", "v", "V", "c", "C", "m", "M", "Escape", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(key)) return;
  event.preventDefault();
  takeOver();
  if (key === " " || key === "v" || key === "V") { state.held = !state.held; say(state.held ? "Ấn ống xuống cup." : "Nhả ống."); }
  else if (key === "c" || key === "C") { state.lid.target = state.lid.target > 0 ? 0 : D.lidOpen; say(state.lid.target > 0 ? "Mở nắp: rotor dừng." : "Đóng nắp: rotor chạy."); }
  else if (key === "m" || key === "M") { state.mode = { touch: "on", on: "off", off: "touch" }[state.mode]; stage.dataset.vxmode = state.mode; say(`Chế độ ${state.mode === "touch" ? "chạm" : state.mode === "on" ? "bật liên tục" : "tắt"}.`); }
  else if (key === "ArrowRight" || key === "ArrowUp") state.rpmSet = clampVortexRpm(state.rpmSet + (event.shiftKey ? 500 : 100));
  else if (key === "ArrowLeft" || key === "ArrowDown") state.rpmSet = clampVortexRpm(state.rpmSet - (event.shiftKey ? 500 : 100));
  else if (key === "Escape") { state.held = false; state.lid.target = D.lidOpen; state.collect = 0; state.mix = 0; state.mode = "touch"; stage.dataset.vxmode = "touch"; say("Đặt lại."); }
  if (still.matches) calmUpdate();
  run();
});
svgEl.addEventListener("click", (event) => {
  takeOver();
  if (event.target.closest('[data-slot^="closed"], [data-slot^="open"], [data-slot="rotor"]')) state.lid.target = state.lid.target > 0 ? 0 : D.lidOpen;
  else state.held = !state.held;
  stage.focus({ preventScroll: true });
  if (still.matches) calmUpdate();
  run();
});
stage.addEventListener("focus", () => say(readout.textContent));

if (still.matches) {
  // Khung tiêu biểu: ống đang ấn trên cup (phễu xoáy), nắp máy ly tâm đóng, rotor ở tốc độ tối đa
  state.held = true;
  state.lift = 0;
  state.lid = { x: 0, v: 0, target: 0 };
  state.spin = SPIN.rpm;
  state.collect = collectAfter(SPIN_HOLD);
  state.mix = 1;
}
step(1 / 60, still.matches);
draw();
</script></body></html>
