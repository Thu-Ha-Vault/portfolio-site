<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7ed8"/>
    </marker>
  </defs>
  <rect width="1000" height="250" rx="14" fill="#fbfaf7"/>

  <!-- vòng nhân đôi -->
  <path d="M 56 129 C 8 18, 172 18, 124 129" fill="none" stroke="#2f7ed8" stroke-width="3" marker-end="url(#b)"/>
  <text x="90" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f7ed8">nhân đôi <tspan font-size="12" font-weight="normal">(replication)</tspan></text>

  <!-- các khối -->
  <rect x="30" y="130" width="120" height="60" rx="14" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <text x="90" y="167" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4f8f">DNA</text>

  <rect x="230" y="130" width="120" height="60" rx="14" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <text x="290" y="167" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a5310">mRNA</text>

  <rect x="430" y="130" width="160" height="60" rx="14" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <text x="510" y="167" text-anchor="middle" font-size="19" font-weight="bold" fill="#246b30">Polypeptide</text>

  <rect x="650" y="130" width="120" height="60" rx="14" fill="#ece3f7" stroke="#7d55b8" stroke-width="2"/>
  <text x="710" y="167" text-anchor="middle" font-size="20" font-weight="bold" fill="#523282">Protein</text>

  <rect x="830" y="130" width="140" height="60" rx="14" fill="#eeeeee" stroke="#777" stroke-width="2"/>
  <text x="900" y="167" text-anchor="middle" font-size="19" font-weight="bold" fill="#444">Tính trạng</text>

  <!-- mũi tên + nhãn -->
  <line x1="152" y1="160" x2="226" y2="160" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="190" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">phiên mã</text>
  <text x="190" y="214" text-anchor="middle" font-size="12" fill="#666">(transcription)</text>

  <line x1="352" y1="160" x2="426" y2="160" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="390" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">dịch mã</text>
  <text x="390" y="214" text-anchor="middle" font-size="12" fill="#666">(translation)</text>

  <line x1="592" y1="160" x2="646" y2="160" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="619" y="118" text-anchor="middle" font-size="13" fill="#333">cuộn xếp</text>

  <line x1="772" y1="160" x2="826" y2="160" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="799" y="118" text-anchor="middle" font-size="13" fill="#333">biểu hiện</text>
</svg>
