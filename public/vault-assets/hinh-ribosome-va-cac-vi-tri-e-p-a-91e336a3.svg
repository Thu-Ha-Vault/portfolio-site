<text x="300" y="330" text-anchor="middle" font-size="12" fill="#666">tRNA khớp bộ ba đối mã (anticodon) với codon trên mRNA</text>
<text x="300" y="350" text-anchor="middle" font-size="12" fill="#666">ribosome trượt trên mRNA theo chiều 5' → 3'</text>
