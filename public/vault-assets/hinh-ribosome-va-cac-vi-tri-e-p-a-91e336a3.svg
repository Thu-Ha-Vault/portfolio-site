<text x="605" y="82" text-anchor="start" font-size="14" fill="#333" font-weight="bold">Ribosome = rRNA + protein, không có màng</text>
<text x="605" y="110" text-anchor="start" font-size="13" fill="#333">• Nhân thực: 80S = 60S (lớn) + 40S (bé)</text>
<text x="605" y="132" text-anchor="start" font-size="13" fill="#333">• Nhân sơ, ti thể, lục lạp: 70S = 50S + 30S</text>
<text x="605" y="172" text-anchor="start" font-size="16" fill="#523282" font-weight="bold">A</text>
<text x="629" y="172" text-anchor="start" font-size="13" fill="#333">tiếp nhận tRNA đang mang amino acid</text>
<text x="629" y="190" text-anchor="start" font-size="13" fill="#333">mới đi vào ribosome</text>
<text x="605" y="226" text-anchor="start" font-size="16" fill="#523282" font-weight="bold">P</text>
<text x="629" y="226" text-anchor="start" font-size="13" fill="#333">giữ tRNA mang chuỗi polypeptide khi</text>
<text x="629" y="244" text-anchor="start" font-size="13" fill="#333">lắp ráp amino acid vào chuỗi</text>
<text x="605" y="280" text-anchor="start" font-size="16" fill="#523282" font-weight="bold">E</text>
<text x="629" y="280" text-anchor="start" font-size="13" fill="#333">lối ra (exit): tRNA đã trao amino acid</text>
<text x="629" y="298" text-anchor="start" font-size="13" fill="#333">rời khỏi ribosome</text>
