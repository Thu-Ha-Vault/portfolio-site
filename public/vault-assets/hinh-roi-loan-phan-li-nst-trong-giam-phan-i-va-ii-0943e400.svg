<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <!-- NST kép (2 chromatid chị em dính ở tâm động) -->
    <g id="dR">
      <rect x="-8" y="-20" width="7" height="40" rx="3.5" fill="#e05a47"/>
      <rect x="1" y="-20" width="7" height="40" rx="3.5" fill="#e05a47"/>
      <circle cx="0" cy="0" r="4" fill="#a63a2b"/>
    </g>
    <g id="dB">
      <rect x="-8" y="-20" width="7" height="40" rx="3.5" fill="#2f7ed8"/>
      <rect x="1" y="-20" width="7" height="40" rx="3.5" fill="#2f7ed8"/>
      <circle cx="0" cy="0" r="4" fill="#1d4f8f"/>
    </g>
    <!-- NST đơn -->
    <g id="sR">
      <rect x="-3.5" y="-16" width="7" height="32" rx="3.5" fill="#e05a47"/>
      <circle cx="0" cy="0" r="3" fill="#a63a2b"/>
    </g>
    <g id="sB">
      <rect x="-3.5" y="-16" width="7" height="32" rx="3.5" fill="#2f7ed8"/>
      <circle cx="0" cy="0" r="3" fill="#1d4f8f"/>
    </g>
  </defs>
  <rect width="960" height="540" rx="14" fill="#fbfaf7"/>

  <line x1="480" y1="24" x2="480" y2="500" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== Panel trái: rối loạn GP I ===== -->
  <text x="240" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Rối loạn giảm phân I</text>
  <text x="240" y="54" text-anchor="middle" font-size="13" fill="#e05a47">cặp NST tương đồng không phân li ở kì sau I</text>

  <circle cx="240" cy="120" r="44" fill="#fff" stroke="#999" stroke-width="2"/>
  <use href="#dR" x="226" y="120"/>
  <use href="#dB" x="254" y="120"/>
  <text x="240" y="90" text-anchor="middle" font-size="12" fill="#666">2n</text>

  <line x1="208" y1="158" x2="158" y2="198" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="272" y1="158" x2="322" y2="198" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="240" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#e05a47">GP I</text>

  <circle cx="140" cy="240" r="42" fill="#fff" stroke="#e05a47" stroke-width="2.5" stroke-dasharray="7 4"/>
  <use href="#dR" x="127" y="240"/>
  <use href="#dB" x="153" y="240"/>
  <circle cx="340" cy="240" r="42" fill="#fff" stroke="#999" stroke-width="2"/>
  <text x="340" y="245" text-anchor="middle" font-size="12" fill="#999">(trống)</text>

  
  <line x1="122" y1="284" x2="102" y2="334" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="158" y1="284" x2="178" y2="334" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="322" y1="284" x2="302" y2="334" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="358" y1="284" x2="378" y2="334" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="140" y="318" text-anchor="middle" font-size="13" fill="#666">GP II</text>
  <text x="340" y="318" text-anchor="middle" font-size="13" fill="#666">GP II</text>

  <circle cx="95" cy="375" r="34" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <use href="#sR" x="86" y="375"/><use href="#sB" x="104" y="375"/>
  <circle cx="185" cy="375" r="34" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <use href="#sR" x="176" y="375"/><use href="#sB" x="194" y="375"/>
  <circle cx="295" cy="375" r="34" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <circle cx="385" cy="375" r="34" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>

  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="95" y="436" fill="#c0631a">n + 1</text>
    <text x="185" y="436" fill="#c0631a">n + 1</text>
    <text x="295" y="436" fill="#1d4f8f">n − 1</text>
    <text x="385" y="436" fill="#1d4f8f">n − 1</text>
  </g>
  <text x="240" y="470" text-anchor="middle" font-size="14" fill="#333">→ 100% giao tử đột biến: ½ (n+1) : ½ (n−1)</text>

  <!-- ===== Panel phải: rối loạn GP II ===== -->
  <text x="720" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Rối loạn giảm phân II</text>
  <text x="720" y="54" text-anchor="middle" font-size="13" fill="#e05a47">NST kép không tách ở tâm động (kì sau II, 1 tế bào)</text>

  <circle cx="720" cy="120" r="44" fill="#fff" stroke="#999" stroke-width="2"/>
  <use href="#dR" x="706" y="120"/>
  <use href="#dB" x="734" y="120"/>
  <text x="720" y="90" text-anchor="middle" font-size="12" fill="#666">2n</text>

  <line x1="688" y1="158" x2="638" y2="198" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="752" y1="158" x2="802" y2="198" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="720" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a9a4a">GP I bình thường</text>

  <circle cx="620" cy="240" r="42" fill="#fff" stroke="#e05a47" stroke-width="2.5" stroke-dasharray="7 4"/>
  <use href="#dR" x="620" y="240"/>
  <circle cx="820" cy="240" r="42" fill="#fff" stroke="#999" stroke-width="2"/>
  <use href="#dB" x="820" y="240"/>

  <line x1="602" y1="284" x2="582" y2="334" stroke="#e05a47" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="638" y1="284" x2="658" y2="334" stroke="#e05a47" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="802" y1="284" x2="782" y2="334" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="838" y1="284" x2="858" y2="334" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="620" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#e05a47">GP II</text>
  <text x="820" y="318" text-anchor="middle" font-size="13" fill="#666">GP II</text>

  <circle cx="575" cy="375" r="34" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <use href="#sR" x="566" y="375"/><use href="#sR" x="584" y="375"/>
  <circle cx="665" cy="375" r="34" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <circle cx="775" cy="375" r="34" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <use href="#sB" x="775" y="375"/>
  <circle cx="865" cy="375" r="34" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <use href="#sB" x="865" y="375"/>

  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="575" y="436" fill="#c0631a">n + 1</text>
    <text x="665" y="436" fill="#1d4f8f">n − 1</text>
    <text x="775" y="436" fill="#246b30">n</text>
    <text x="865" y="436" fill="#246b30">n</text>
  </g>
  <text x="720" y="470" text-anchor="middle" font-size="14" fill="#333">→ ¼ (n+1) : ¼ (n−1) : ½ n (bình thường)</text>

  <!-- chú giải -->
  <g font-size="13" fill="#333">
    <use href="#dR" x="120" y="512" transform="translate(0,0)"/>
    <text x="136" y="517">NST kép</text>
    <use href="#sR" x="220" y="512"/>
    <text x="232" y="517">NST đơn</text>
    <rect x="310" y="503" width="14" height="18" rx="4" fill="#e05a47"/>
    <rect x="328" y="503" width="14" height="18" rx="4" fill="#2f7ed8"/>
    <text x="350" y="517">2 chiếc của 1 cặp NST tương đồng (chỉ vẽ cặp NST đang xét)</text>
  </g>
</svg>
