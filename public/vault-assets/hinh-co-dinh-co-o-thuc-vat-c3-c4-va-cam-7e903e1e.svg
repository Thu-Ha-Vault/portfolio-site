<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a2e"/>
    </marker>
    <g id="calvin">
      <circle cx="0" cy="0" r="31" fill="#ffffff" stroke="#e08a2e" stroke-width="2"/>
      <path d="M 0 -26 A 26 26 0 1 1 -18.4 18.4" fill="none" stroke="#e08a2e" stroke-width="2" marker-end="url(#o)"/>
      <text x="1" y="4" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a5310">Calvin</text>
    </g>
  </defs>
  <rect width="960" height="420" rx="14" fill="#fbfaf7"/>
  <line x1="325" y1="24" x2="325" y2="400" stroke="#ddd" stroke-width="1.5"/>
  <line x1="640" y1="24" x2="640" y2="400" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== C3 ===== -->
  <text x="170" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">C₃</text>
  <text x="170" y="58" text-anchor="middle" font-size="12" fill="#666">1 loại tế bào, 1 chu trình</text>
  <text x="170" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f7ed8">CO₂</text>
  <rect x="45" y="104" width="250" height="246" rx="16" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <line x1="170" y1="88" x2="170" y2="128" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="170" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CO₂ + RuBP → APG (3C)</text>
  <line x1="170" y1="158" x2="170" y2="180" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <use href="#calvin" transform="translate(170,215)"/>
  <line x1="170" y1="248" x2="170" y2="278" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="170" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#246b30">(CH₂O)n</text>
  <text x="170" y="340" text-anchor="middle" font-size="12" fill="#246b30">tế bào mô giậu</text>
  <text x="170" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#e05a47">Có hô hấp sáng</text>
  <text x="170" y="400" text-anchor="middle" font-size="12" fill="#666">rêu, cây gỗ trong rừng</text>

  <!-- ===== C4 ===== -->
  <text x="482" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">C₄</text>
  <text x="482" y="58" text-anchor="middle" font-size="12" fill="#666">tách về không gian (2 loại tế bào)</text>
  <text x="482" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f7ed8">CO₂</text>
  <rect x="357" y="104" width="250" height="78" rx="16" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <line x1="482" y1="88" x2="482" y2="126" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="482" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CO₂ + PEP → AOA (4C)</text>
  <text x="482" y="170" text-anchor="middle" font-size="12" fill="#246b30">tế bào mô giậu</text>
  <text x="492" y="208" font-size="12" fill="#333">malic acid (4C)</text>
  <rect x="357" y="214" width="250" height="136" rx="16" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <line x1="482" y1="184" x2="482" y2="228" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="482" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">malic acid → CO₂</text>
  <use href="#calvin" transform="translate(432,290)"/>
  <line x1="466" y1="290" x2="514" y2="290" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="560" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a5310">(CH₂O)n</text>
  <text x="482" y="340" text-anchor="middle" font-size="12" fill="#9a5310">tế bào bao bó mạch</text>
  <text x="482" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a9a4a">Không hô hấp sáng</text>
  <text x="482" y="400" text-anchor="middle" font-size="12" fill="#666">mía, ngô, rau dền, cao lương, kê</text>

  <!-- ===== CAM ===== -->
  <text x="790" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">CAM</text>
  <text x="790" y="58" text-anchor="middle" font-size="12" fill="#666">tách về thời gian (đêm / ngày)</text>
  <rect x="660" y="104" width="260" height="246" rx="16" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <line x1="790" y1="112" x2="790" y2="272" stroke="#3a9a4a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="672" y="64" width="114" height="38" rx="8" fill="#523282"/>
  <text x="729" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Đêm</text>
  <text x="729" y="96" text-anchor="middle" font-size="12" fill="#ffffff">khí khổng mở</text>
  <rect x="794" y="64" width="114" height="38" rx="8" fill="#e08a2e"/>
  <text x="851" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Ngày</text>
  <text x="851" y="96" text-anchor="middle" font-size="12" fill="#ffffff">khí khổng đóng</text>

  <!-- đêm -->
  <text x="729" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CO₂ + PEP</text>
  <line x1="729" y1="140" x2="729" y2="160" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="729" y="178" text-anchor="middle" font-size="13" fill="#333">AOA (4C)</text>
  <line x1="729" y1="186" x2="729" y2="206" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="729" y="224" text-anchor="middle" font-size="13" fill="#333">malic acid</text>
  <line x1="729" y1="232" x2="729" y2="276" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- không bào -->
  <rect x="690" y="280" width="200" height="44" rx="14" fill="#ece3f7" stroke="#7d55b8" stroke-width="2"/>
  <text x="790" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#523282">không bào</text>
  <text x="790" y="315" text-anchor="middle" font-size="12" fill="#523282">dự trữ malic acid</text>

  <!-- ngày -->
  <line x1="851" y1="278" x2="851" y2="262" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="851" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CO₂</text>
  <line x1="851" y1="244" x2="851" y2="232" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <use href="#calvin" transform="translate(851,198)"/>
  <line x1="851" y1="166" x2="851" y2="146" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="851" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#246b30">(CH₂O)n</text>

  <text x="790" y="342" text-anchor="middle" font-size="12" fill="#246b30">cùng 1 tế bào mô giậu</text>
  <text x="790" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a9a4a">Không hô hấp sáng</text>
  <text x="790" y="400" text-anchor="middle" font-size="12" fill="#666">xương rồng, dứa, thanh long</text>
</svg>
