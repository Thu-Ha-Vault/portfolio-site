<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="880" height="410" rx="14" fill="#fbfaf7"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Mức phản ứng rộng và hẹp (mỗi đường: 1 kiểu gen)</text>
  <line x1="90" y1="340" x2="560" y2="340" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="90" y1="340" x2="90" y2="70" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="74" y="210.0" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 74 210.0)">kiểu hình (giá trị tính trạng)</text>
  <text x="325.0" y="390" text-anchor="middle" font-size="14" fill="#333">điều kiện môi trường (kém → tốt)</text>
  <line x1="150" y1="340" x2="150" y2="346" stroke="#555" stroke-width="2"/>
  <text x="150" y="364" text-anchor="middle" font-size="12" fill="#666">MT 1</text>
  <line x1="250" y1="340" x2="250" y2="346" stroke="#555" stroke-width="2"/>
  <text x="250" y="364" text-anchor="middle" font-size="12" fill="#666">MT 2</text>
  <line x1="350" y1="340" x2="350" y2="346" stroke="#555" stroke-width="2"/>
  <text x="350" y="364" text-anchor="middle" font-size="12" fill="#666">MT 3</text>
  <line x1="450" y1="340" x2="450" y2="346" stroke="#555" stroke-width="2"/>
  <text x="450" y="364" text-anchor="middle" font-size="12" fill="#666">MT n</text>
  <line x1="150" y1="300" x2="505" y2="300" stroke="#2f7ed8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="450" y1="105" x2="505" y2="105" stroke="#2f7ed8" stroke-width="1" stroke-dasharray="4 4"/>
  <polyline points="150,300 250,230 350,165 450,105" fill="none" stroke="#2f7ed8" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="150" cy="300" r="6" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <circle cx="250" cy="230" r="6" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <circle cx="350" cy="165" r="6" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <circle cx="450" cy="105" r="6" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <polyline points="150,218 250,212 350,206 450,200" fill="none" stroke="#e08a2e" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="150" cy="218" r="6" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <circle cx="250" cy="212" r="6" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <circle cx="350" cy="206" r="6" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <circle cx="450" cy="200" r="6" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <path d="M 505 105 L 515 105 L 515 300 L 505 300" fill="none" stroke="#2f7ed8" stroke-width="2.5"/>
  <path d="M 475 200 L 485 200 L 485 218 L 475 218" fill="none" stroke="#e08a2e" stroke-width="2.5"/>
  <text x="560" y="110" font-size="15" font-weight="bold" fill="#2f7ed8">Mức phản ứng rộng</text>
  <text x="560" y="130" font-size="13" fill="#333">tính trạng số lượng</text>
  <text x="560" y="148" font-size="13" fill="#666">VD: sản lượng sữa, khối lượng</text>
  <text x="560" y="166" font-size="13" fill="#666">→ do nhiều gen, phụ thuộc nhiều vào MT</text>
  <text x="560" y="250" font-size="15" font-weight="bold" fill="#e08a2e">Mức phản ứng hẹp</text>
  <text x="560" y="270" font-size="13" fill="#333">tính trạng chất lượng</text>
  <text x="560" y="288" font-size="13" fill="#666">VD: tỉ lệ bơ trong sữa</text>
  <text x="560" y="306" font-size="13" fill="#666">→ do ít gen, ít chịu ảnh hưởng của MT</text>
