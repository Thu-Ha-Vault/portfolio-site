<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a2e"/>
    </marker>
  </defs>
  <rect width="960" height="460" rx="14" fill="#fbfaf7"/>

  <!-- Panel trái: tháp năng lượng -->
  <text x="260" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Tháp năng lượng</text>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#666">(ví dụ minh hoạ, không theo tỉ lệ)</text>

  <!-- mặt trời -->
  <g stroke="#e08a2e" stroke-width="2.5" stroke-linecap="round">
    <line x1="60" y1="222" x2="60" y2="214"/>
    <line x1="60" y1="278" x2="60" y2="286"/>
    <line x1="32" y1="250" x2="24" y2="250"/>
    <line x1="88" y1="250" x2="96" y2="250"/>
    <line x1="40" y1="230" x2="34" y2="224"/>
    <line x1="80" y1="230" x2="86" y2="224"/>
    <line x1="40" y1="270" x2="34" y2="276"/>
    <line x1="80" y1="270" x2="86" y2="276"/>
  </g>
  <circle cx="60" cy="250" r="20" fill="#fde7d4" stroke="#e08a2e" stroke-width="2.5"/>
  <text x="60" y="200" text-anchor="middle" font-size="13" fill="#9a5310">Mặt trời</text>
  <line x1="74" y1="290" x2="96" y2="330" stroke="#e08a2e" stroke-width="2.5" marker-end="url(#o)"/>

  <rect x="60" y="336" width="400" height="64" rx="6" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <text x="260" y="363" text-anchor="middle" font-size="15" font-weight="bold" fill="#246b30">Sinh vật sản xuất</text>
  <text x="260" y="385" text-anchor="middle" font-size="13" fill="#333">10 000 kcal</text>

  <rect x="110" y="268" width="300" height="64" rx="6" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <text x="260" y="295" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4f8f">SV tiêu thụ bậc 1</text>
  <text x="260" y="317" text-anchor="middle" font-size="13" fill="#333">1 000 kcal</text>

  <rect x="160" y="200" width="200" height="64" rx="6" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <text x="260" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a5310">SV tiêu thụ bậc 2</text>
  <text x="260" y="249" text-anchor="middle" font-size="13" fill="#333">100 kcal</text>

  <rect x="200" y="132" width="120" height="64" rx="6" fill="#ece3f7" stroke="#7d55b8" stroke-width="2"/>
  <text x="260" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#523282">SVTT bậc 3</text>
  <text x="260" y="181" text-anchor="middle" font-size="13" fill="#333">10 kcal</text>

  <!-- ~10% lên bậc sau -->
  <g fill="none" stroke="#555" stroke-width="2">
    <path d="M 435 334 C 435 300 428 300 414 300" marker-end="url(#a)"/>
    <path d="M 385 266 C 385 232 378 232 364 232" marker-end="url(#a)"/>
    <path d="M 340 198 C 340 164 334 164 324 164" marker-end="url(#a)"/>
  </g>
  <text x="444" y="310" font-size="13" font-weight="bold" fill="#333">≈10%</text>
  <text x="394" y="242" font-size="13" font-weight="bold" fill="#333">≈10%</text>
  <text x="349" y="174" font-size="13" font-weight="bold" fill="#333">≈10%</text>

  <line x1="510" y1="30" x2="510" y2="430" stroke="#ddd" stroke-width="1.5"/>

  <!-- Panel phải: phân bố năng lượng của 1 bậc -->
  <text x="735" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Năng lượng của 1 bậc dinh dưỡng</text>

  <g fill="none" stroke-linecap="butt">
    <path d="M 640 180 C 700 180 700 112 760 112" stroke="#e05a47" stroke-opacity="0.45" stroke-width="42"/>
    <path d="M 640 228 C 700 228 700 182 760 182" stroke="#777" stroke-opacity="0.55" stroke-width="7"/>
    <path d="M 640 254 C 700 254 700 252 760 252" stroke="#e08a2e" stroke-opacity="0.7" stroke-width="7"/>
    <path d="M 640 280 C 700 280 700 322 760 322" stroke="#3a9a4a" stroke-opacity="0.8" stroke-width="7"/>
  </g>

  <rect x="536" y="150" width="104" height="146" rx="12" fill="#eeeeee" stroke="#777" stroke-width="2"/>
  <text x="588" y="210" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">100%</text>
  <text x="588" y="234" text-anchor="middle" font-size="13" fill="#444">năng lượng</text>
  <text x="588" y="252" text-anchor="middle" font-size="13" fill="#444">ở 1 bậc</text>

  <rect x="760" y="86" width="180" height="52" rx="10" fill="#fbe0dc" stroke="#e05a47" stroke-width="2"/>
  <text x="850" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#a63a2b">Hô hấp: 70%</text>
  <text x="850" y="127" text-anchor="middle" font-size="12" fill="#666">mất dưới dạng nhiệt</text>

  <rect x="760" y="160" width="180" height="44" rx="10" fill="#eeeeee" stroke="#777" stroke-width="2"/>
  <text x="850" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">Bài tiết: 10%</text>

  <rect x="760" y="226" width="180" height="52" rx="10" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <text x="850" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a5310">Rơi rụng: 10%</text>
  <text x="850" y="267" text-anchor="middle" font-size="12" fill="#666">(lá, lông, xác…)</text>

  <rect x="760" y="300" width="180" height="44" rx="10" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <text x="850" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#246b30">Lên bậc sau: 10%</text>

  <text x="735" y="384" text-anchor="middle" font-size="13" fill="#333">Mỗi bậc chỉ chuyển ≈10% lên bậc sau</text>
  <text x="735" y="403" text-anchor="middle" font-size="13" fill="#333">→ tháp năng lượng luôn đáy lớn, đỉnh nhỏ.</text>
  <text x="735" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#e05a47">Dòng năng lượng đi 1 chiều, không quay vòng.</text>
</svg>
