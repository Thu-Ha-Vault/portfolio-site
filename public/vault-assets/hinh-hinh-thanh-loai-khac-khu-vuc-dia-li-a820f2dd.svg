<text x="127.5" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1. Quần thể ban đầu</text>
<text x="127.5" y="264" text-anchor="middle" font-size="12" fill="#666">giao phối tự do,</text>
<text x="127.5" y="281" text-anchor="middle" font-size="12" fill="#666">vốn gen chung</text>
<text x="372.5" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2. Trở ngại địa lí</text>
<text x="372.5" y="264" text-anchor="middle" font-size="12" fill="#666">(sông, núi, biển…) chia cắt</text>
<text x="372.5" y="281" text-anchor="middle" font-size="12" fill="#666">→ cách li địa lí</text>
<text x="617.5" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3. Nòi địa lí</text>
<text x="617.5" y="264" text-anchor="middle" font-size="12" fill="#666">CLTN + nhân tố tiến hoá</text>
<text x="617.5" y="281" text-anchor="middle" font-size="12" fill="#666">tích luỹ biến dị theo hướng ≠</text>
<text x="862.5" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4. Loài mới</text>
<text x="862.5" y="264" text-anchor="middle" font-size="12" fill="#666">gặp lại nhưng không giao phối</text>
<text x="862.5" y="281" text-anchor="middle" font-size="12" fill="#666">→ cách li sinh sản</text>
<text x="500.0" y="326" text-anchor="middle" font-size="12" fill="#666">Diễn ra chậm, qua nhiều dạng trung gian; gặp ở thực vật và động vật có khả năng phát tán mạnh.</text>
