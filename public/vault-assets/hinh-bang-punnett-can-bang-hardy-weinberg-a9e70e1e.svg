<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="460" rx="14" fill="#fbfaf7"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Ngẫu phối: kết hợp ngẫu nhiên các giao tử → p² : 2pq : q²</text>
  <rect x="172" y="112" width="176.0" height="176.0" rx="8" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <text x="260.0" y="198.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4f8f">p²</text>
  <text x="260.0" y="220.0" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic" fill="#1d4f8f">AA</text>
  <rect x="352.0" y="112" width="116.0" height="176.0" rx="8" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <text x="410.0" y="198.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#246b30">pq</text>
  <text x="410.0" y="220.0" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic" fill="#246b30">Aa</text>
  <rect x="172" y="292.0" width="176.0" height="116.0" rx="8" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <text x="260.0" y="348.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#246b30">pq</text>
  <text x="260.0" y="370.0" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic" fill="#246b30">Aa</text>
  <rect x="352.0" y="292.0" width="116.0" height="116.0" rx="8" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <text x="410.0" y="348.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a5310">q²</text>
  <text x="410.0" y="370.0" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic" fill="#9a5310">aa</text>
  <text x="320.0" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">giao tử ♂</text>
  <text x="260.0" y="96" text-anchor="middle" font-size="16" fill="#333"><tspan font-weight="bold" font-style="italic">A</tspan> (p)</text>
  <text x="410.0" y="96" text-anchor="middle" font-size="16" fill="#333"><tspan font-weight="bold" font-style="italic">a</tspan> (q)</text>
  <text x="108" y="260.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#666" transform="rotate(-90 108 260.0)">giao tử ♀</text>
  <text x="158" y="205.0" text-anchor="end" font-size="16" fill="#333"><tspan font-weight="bold" font-style="italic">A</tspan> (p)</text>
  <text x="158" y="355.0" text-anchor="end" font-size="16" fill="#333"><tspan font-weight="bold" font-style="italic">a</tspan> (q)</text>
  <text x="320.0" y="440" text-anchor="middle" font-size="13" fill="#666">(diện tích ô ∝ tần số; vẽ với p = 0,6; q = 0,4)</text>
  <line x1="510" y1="70" x2="510" y2="400" stroke="#ddd" stroke-width="1.5"/>
  <text x="540" y="100" font-size="15" font-weight="bold" fill="#333">Tần số alen: p(A) + q(a) = 1</text>
  <text x="540" y="140" font-size="15" font-weight="bold" fill="#333">Cấu trúc di truyền cân bằng:</text>
  <rect x="540" y="160" width="62" height="30" rx="8" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <text x="571" y="181" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#1d4f8f">AA</text>
  <text x="616" y="181" font-size="17" font-weight="bold" fill="#1d4f8f">p²</text>
  <text x="664" y="181" font-size="14" fill="#666">VD: 0,6² = 0,36</text>
  <rect x="540" y="204" width="62" height="30" rx="8" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <text x="571" y="225" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#246b30">Aa</text>
  <text x="616" y="225" font-size="17" font-weight="bold" fill="#246b30">2pq</text>
  <text x="664" y="225" font-size="14" fill="#666">VD: 2 · 0,6 · 0,4 = 0,48</text>
  <rect x="540" y="248" width="62" height="30" rx="8" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <text x="571" y="269" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#9a5310">aa</text>
  <text x="616" y="269" font-size="17" font-weight="bold" fill="#9a5310">q²</text>
  <text x="664" y="269" font-size="14" fill="#666">VD: 0,4² = 0,16</text>
  <text x="540" y="335" font-size="16" font-weight="bold" fill="#333">p² AA + 2pq Aa + q² aa = 1</text>
  <text x="540" y="362" font-size="13" fill="#666">Kiểm tra cân bằng: d · r = (h/2)²</text>
  <text x="540" y="382" font-size="13" fill="#666">(0,36 · 0,16 = 0,0576 = 0,24²)</text>
</svg>
