<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7ed8"/>
    </marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e05a47"/>
    </marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a2e"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="14" fill="#fbfaf7"/>

  <!-- ===== Panel trái: gen trên X ===== -->
  <text x="225" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Gen trên X → di truyền chéo</text>
  <text x="225" y="58" text-anchor="middle" font-size="13" fill="#666">(ruồi giấm: A mắt đỏ, a mắt trắng)</text>

  <!-- P -->
  <text x="34" y="135" font-size="14" font-weight="bold" fill="#666">P</text>
  <line x1="196" y1="130" x2="268" y2="130" stroke="#555" stroke-width="2"/>
  <circle cx="170" cy="130" r="26" fill="#e05a47" stroke="#a63a2b" stroke-width="2"/>
  <rect x="268" y="104" width="52" height="52" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="134" y="126" text-anchor="end" font-size="15" font-weight="bold" fill="#333">♀ X<tspan dy="-6" font-size="12">a</tspan><tspan dy="6">X</tspan><tspan dy="-6" font-size="12">a</tspan></text>
  <text x="134" y="146" text-anchor="end" font-size="13" fill="#666">mắt trắng</text>
  <text x="334" y="126" font-size="15" font-weight="bold" fill="#333">♂ X<tspan dy="-6" font-size="12">A</tspan><tspan dy="6">Y</tspan></text>
  <text x="334" y="146" font-size="13" fill="#666">mắt đỏ</text>

  <!-- mũi tên chéo -->
  <path d="M 280 160 C 260 210, 220 250, 190 280" fill="none" stroke="#2f7ed8" stroke-width="3" marker-end="url(#mb)"/>
  <path d="M 186 158 C 210 210, 250 250, 280 280" fill="none" stroke="#e05a47" stroke-width="3" marker-end="url(#mr)"/>
  <text x="290" y="215" font-size="15" font-weight="bold" fill="#2f7ed8">X<tspan dy="-6" font-size="12">A</tspan></text>
  <text x="146" y="215" font-size="15" font-weight="bold" fill="#e05a47">X<tspan dy="-6" font-size="12">a</tspan></text>

  <!-- F1 -->
  <text x="30" y="315" font-size="14" font-weight="bold" fill="#666">F1</text>
  <circle cx="170" cy="310" r="26" fill="#fff" stroke="#555" stroke-width="2"/>
  <rect x="268" y="284" width="52" height="52" rx="4" fill="#e05a47" stroke="#a63a2b" stroke-width="2"/>
  <text x="134" y="306" text-anchor="end" font-size="15" font-weight="bold" fill="#333">♀ X<tspan dy="-6" font-size="12">A</tspan><tspan dy="6">X</tspan><tspan dy="-6" font-size="12">a</tspan></text>
  <text x="134" y="326" text-anchor="end" font-size="13" fill="#666">mắt đỏ</text>
  <text x="334" y="306" font-size="15" font-weight="bold" fill="#333">♂ X<tspan dy="-6" font-size="12">a</tspan><tspan dy="6">Y</tspan></text>
  <text x="334" y="326" font-size="13" fill="#666">mắt trắng</text>

  <text x="225" y="372" text-anchor="middle" font-size="13" fill="#333">X của bố → con gái; X của mẹ → con trai</text>
  <text x="225" y="392" text-anchor="middle" font-size="13" fill="#333">→ con trai giống mẹ, con gái giống bố</text>

  <line x1="450" y1="30" x2="450" y2="400" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== Panel phải: gen trên Y ===== -->
  <text x="675" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Gen trên Y → di truyền thẳng</text>
  <text x="675" y="58" text-anchor="middle" font-size="13" fill="#666">(vùng không tương đồng trên Y, VD túm lông ở tai)</text>

  <text x="490" y="113" font-size="14" font-weight="bold" fill="#666">I</text>
  <text x="490" y="213" font-size="14" font-weight="bold" fill="#666">II</text>
  <text x="490" y="313" font-size="14" font-weight="bold" fill="#666">III</text>

  <rect x="578" y="86" width="44" height="44" rx="4" fill="#e08a2e" stroke="#9a5310" stroke-width="2"/>
  <rect x="578" y="186" width="44" height="44" rx="4" fill="#e08a2e" stroke="#9a5310" stroke-width="2"/>
  <rect x="578" y="286" width="44" height="44" rx="4" fill="#e08a2e" stroke="#9a5310" stroke-width="2"/>
  <text x="534" y="113" font-size="14" font-weight="bold" fill="#333">ông</text>
  <text x="534" y="213" font-size="14" font-weight="bold" fill="#333">bố</text>
  <text x="520" y="313" font-size="14" font-weight="bold" fill="#333">cháu</text>

  <line x1="600" y1="134" x2="600" y2="181" stroke="#e08a2e" stroke-width="3" marker-end="url(#mo)"/>
  <line x1="600" y1="234" x2="600" y2="281" stroke="#e08a2e" stroke-width="3" marker-end="url(#mo)"/>
  <text x="612" y="165" font-size="14" font-weight="bold" fill="#9a5310">Y<tspan dy="-6" font-size="12">a</tspan></text>
  <text x="612" y="265" font-size="14" font-weight="bold" fill="#9a5310">Y<tspan dy="-6" font-size="12">a</tspan></text>

  <text x="638" y="104" font-size="14" fill="#333">XY<tspan dy="-6" font-size="12">a</tspan></text>
  <text x="638" y="204" font-size="14" fill="#333">XY<tspan dy="-6" font-size="12">a</tspan></text>
  <text x="638" y="304" font-size="14" fill="#333">XY<tspan dy="-6" font-size="12">a</tspan></text>

  <!-- con gái -->
  <path d="M 626 116 C 700 130, 760 150, 784 180" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mg)"/>
  <text x="724" y="128" font-size="13" fill="#777">X</text>
  <circle cx="800" cy="208" r="22" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="800" y="252" text-anchor="middle" font-size="13" fill="#666">con gái XX</text>
  <text x="800" y="270" text-anchor="middle" font-size="13" fill="#666">không mắc</text>

  <text x="675" y="372" text-anchor="middle" font-size="13" fill="#333">Y chỉ truyền từ bố cho con trai</text>
  <text x="675" y="392" text-anchor="middle" font-size="13" fill="#333">→ tính trạng chỉ biểu hiện ở giới XY</text>
</svg>
