<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7ed8"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7ed8"/>
    </marker>
    <marker id="o2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a2e"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a2e"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a9a4a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e05a47"/>
    </marker>
  </defs>
  <rect width="1000" height="640" rx="14" fill="#fbfaf7"/>

  <!-- đất -->
  <path d="M 0 440 L 1000 440 L 1000 626 Q 1000 640 986 640 L 14 640 Q 0 640 0 626 Z" fill="#f1e6d6"/>
  <line x1="0" y1="440" x2="1000" y2="440" stroke="#a98463" stroke-width="2.5"/>
  <text x="20" y="462" font-size="13" fill="#8b6b4a">mặt đất</text>

  <!-- rễ -->
  <g fill="none" stroke="#a98463" stroke-linecap="round">
    <path d="M 500 440 C 500 500 494 540 500 606" stroke-width="9"/>
    <path d="M 500 466 C 468 494 430 508 404 562" stroke-width="6"/>
    <path d="M 500 466 C 532 494 570 508 596 562" stroke-width="6"/>
    <path d="M 498 518 C 472 538 452 560 444 604" stroke-width="4"/>
    <path d="M 500 518 C 528 538 548 560 556 604" stroke-width="4"/>
  </g>
  <g stroke="#a98463" stroke-width="1.5" stroke-linecap="round">
    <line x1="404" y1="562" x2="392" y2="566"/><line x1="406" y1="556" x2="394" y2="552"/><line x1="402" y1="568" x2="398" y2="580"/>
    <line x1="596" y1="562" x2="608" y2="566"/><line x1="594" y1="556" x2="606" y2="552"/><line x1="598" y1="568" x2="602" y2="580"/>
    <line x1="444" y1="604" x2="434" y2="610"/><line x1="556" y1="604" x2="566" y2="610"/>
  </g>
  <!-- nước, ion khoáng đi vào rễ -->
  <g stroke="#2f7ed8" stroke-width="2.5" fill="none">
    <line x1="352" y1="600" x2="390" y2="574" marker-end="url(#b)"/>
    <line x1="648" y1="600" x2="610" y2="574" marker-end="url(#b)"/>
    <line x1="470" y1="630" x2="490" y2="610" marker-end="url(#b)"/>
  </g>

  <!-- thân -->
  <path d="M 482 442 L 486 250 L 514 250 L 518 442 Z" fill="#a98463" stroke="#8b6b4a" stroke-width="2"/>

  <!-- tán lá: viền trước, nền sau -->
  <g fill="#3a9a4a">
    <circle cx="500" cy="180" r="88"/><circle cx="425" cy="205" r="65"/><circle cx="575" cy="205" r="65"/>
    <circle cx="455" cy="135" r="61"/><circle cx="548" cy="135" r="61"/><circle cx="500" cy="118" r="58"/>
  </g>
  <g fill="#9fd79f">
    <circle cx="500" cy="180" r="85"/><circle cx="425" cy="205" r="62"/><circle cx="575" cy="205" r="62"/>
    <circle cx="455" cy="135" r="58"/><circle cx="548" cy="135" r="58"/><circle cx="500" cy="118" r="55"/>
  </g>

  <!-- dòng nước trong thân và lá -->
  <line x1="493" y1="436" x2="493" y2="262" stroke="#2f7ed8" stroke-width="4" marker-end="url(#b2)"/>
  <line x1="508" y1="270" x2="508" y2="420" stroke="#e08a2e" stroke-width="4" marker-end="url(#o2)"/>
  <g fill="none" stroke="#2f7ed8" stroke-width="3">
    <path d="M 494 250 C 490 220 460 210 440 196" marker-end="url(#b)"/>
    <path d="M 500 250 C 506 220 540 210 560 196" marker-end="url(#b)"/>
    <path d="M 497 248 L 497 150" marker-end="url(#b)"/>
  </g>
  <!-- hơi nước thoát ra -->
  <g fill="none" stroke="#2f7ed8" stroke-width="2.2" stroke-dasharray="4 4">
    <path d="M 392 116 Q 380 104 386 92 Q 392 80 378 68" marker-end="url(#b)"/>
    <path d="M 500 60 Q 488 50 500 40 Q 512 30 500 22" marker-end="url(#b)"/>
    <path d="M 608 116 Q 620 104 614 92 Q 608 80 622 68" marker-end="url(#b)"/>
  </g>
  <text x="514" y="34" font-size="13" fill="#2f7ed8">hơi nước</text>

  <!-- nhãn 3 vùng -->
  <g stroke="#777" stroke-width="1.5" fill="none">
    <line x1="330" y1="318" x2="392" y2="256"/>
    <line x1="616" y1="362" x2="522" y2="362"/>
    <line x1="616" y1="530" x2="600" y2="556"/>
  </g>
  <rect x="40" y="296" width="290" height="44" rx="10" fill="#dbe9fb" stroke="#2f7ed8" stroke-width="2"/>
  <text x="185" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4f8f">1. Thoát hơi nước qua lá</text>

  <rect x="616" y="330" width="368" height="66" rx="10" fill="#fde7d4" stroke="#e08a2e" stroke-width="2"/>
  <text x="800" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a5310">2. Vận chuyển nước và các chất trong thân</text>
  <text x="800" y="380" text-anchor="middle" font-size="12" fill="#444">mạch gỗ ↑ nước, ion khoáng · mạch rây ↓ chất hữu cơ</text>

  <rect x="616" y="498" width="368" height="66" rx="10" fill="#dff2df" stroke="#3a9a4a" stroke-width="2"/>
  <text x="800" y="524" text-anchor="middle" font-size="15" font-weight="bold" fill="#246b30">3. Hấp thụ nước và ion khoáng ở rễ</text>
  <text x="800" y="548" text-anchor="middle" font-size="12" fill="#444">qua lông hút (dưới mặt đất)</text>

  <!-- chú giải mũi tên -->
  <line x1="40" y1="530" x2="80" y2="530" stroke="#2f7ed8" stroke-width="3.5" marker-end="url(#b)"/>
  <text x="90" y="535" font-size="13" fill="#333">nước, ion khoáng (mạch gỗ)</text>
  <line x1="40" y1="560" x2="80" y2="560" stroke="#e08a2e" stroke-width="3.5" marker-end="url(#o)"/>
  <text x="90" y="565" font-size="13" fill="#333">chất hữu cơ (mạch rây)</text>
  <line x1="40" y1="590" x2="80" y2="590" stroke="#2f7ed8" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#b)"/>
  <text x="90" y="595" font-size="13" fill="#333">hơi nước thoát ra</text>

  <!-- Ô trái: khí khổng -->
  <rect x="20" y="20" width="290" height="260" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <text x="165" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Khí khổng</text>
  <path d="M 165 70 C 140 92 140 192 165 214 C 190 192 190 92 165 70 Z" fill="#555" fill-opacity="0.75"/>
  <path d="M 165 70 C 98 70 98 214 165 214 C 140 192 140 92 165 70 Z" fill="#dff2df" stroke="#3a9a4a" stroke-width="2.5"/>
  <path d="M 165 70 C 232 70 232 214 165 214 C 190 192 190 92 165 70 Z" fill="#dff2df" stroke="#3a9a4a" stroke-width="2.5"/>
  <g fill="#3a9a4a">
    <circle cx="128" cy="110" r="4"/><circle cx="124" cy="140" r="4"/><circle cx="128" cy="172" r="4"/><circle cx="140" cy="126" r="3.5"/><circle cx="140" cy="158" r="3.5"/>
    <circle cx="202" cy="110" r="4"/><circle cx="206" cy="140" r="4"/><circle cx="202" cy="172" r="4"/><circle cx="190" cy="126" r="3.5"/><circle cx="190" cy="158" r="3.5"/>
  </g>
  <line x1="84" y1="128" x2="118" y2="150" stroke="#777" stroke-width="1.2"/>
  <text x="58" y="112" text-anchor="middle" font-size="12" fill="#333">tế bào</text>
  <text x="58" y="127" text-anchor="middle" font-size="12" fill="#333">hạt đậu</text>
  <line x1="236" y1="128" x2="170" y2="142" stroke="#777" stroke-width="1.2"/>
  <text x="262" y="112" text-anchor="middle" font-size="12" fill="#333">khe</text>
  <text x="262" y="127" text-anchor="middle" font-size="12" fill="#333">khí khổng</text>
  <text x="165" y="244" text-anchor="middle" font-size="13" fill="#333">No nước → mở</text>
  <text x="165" y="264" text-anchor="middle" font-size="13" fill="#333">Mất nước → đóng</text>

  <!-- Ô phải: lát cắt ngang lá -->
  <rect x="670" y="20" width="315" height="260" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <text x="827" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Lát cắt ngang lá</text>
  <!-- cutin trên -->
  <rect x="682" y="58" width="196" height="5" fill="#e08a2e" fill-opacity="0.6"/>
  <!-- biểu bì trên -->
  <g fill="#f4f4f4" stroke="#999" stroke-width="1">
    <rect x="682" y="63" width="28" height="17"/><rect x="710" y="63" width="28" height="17"/><rect x="738" y="63" width="28" height="17"/><rect x="766" y="63" width="28" height="17"/><rect x="794" y="63" width="28" height="17"/><rect x="822" y="63" width="28" height="17"/><rect x="850" y="63" width="28" height="17"/>
  </g>
  <!-- mô giậu -->
  <g fill="#dff2df" stroke="#3a9a4a" stroke-width="1.2">
    <rect x="684" y="82" width="20" height="50" rx="6"/><rect x="708" y="82" width="20" height="50" rx="6"/><rect x="732" y="82" width="20" height="50" rx="6"/><rect x="756" y="82" width="20" height="50" rx="6"/><rect x="780" y="82" width="20" height="50" rx="6"/><rect x="804" y="82" width="20" height="50" rx="6"/><rect x="828" y="82" width="20" height="50" rx="6"/><rect x="852" y="82" width="20" height="50" rx="6"/>
  </g>
  <!-- mô xốp -->
  <g fill="#dff2df" stroke="#3a9a4a" stroke-width="1.2">
    <ellipse cx="698" cy="150" rx="14" ry="11"/><ellipse cx="736" cy="146" rx="15" ry="10"/><ellipse cx="772" cy="156" rx="13" ry="11"/><ellipse cx="826" cy="148" rx="15" ry="11"/><ellipse cx="864" cy="154" rx="12" ry="11"/>
    <ellipse cx="714" cy="176" rx="13" ry="9"/><ellipse cx="752" cy="178" rx="11" ry="8"/><ellipse cx="840" cy="176" rx="14" ry="9"/><ellipse cx="868" cy="180" rx="9" ry="7"/>
  </g>
  <!-- biểu bì dưới + khí khổng -->
  <g fill="#f4f4f4" stroke="#999" stroke-width="1">
    <rect x="682" y="190" width="28" height="16"/><rect x="710" y="190" width="28" height="16"/><rect x="738" y="190" width="28" height="16"/><rect x="766" y="190" width="10" height="16"/><rect x="796" y="190" width="26" height="16"/><rect x="822" y="190" width="28" height="16"/><rect x="850" y="190" width="28" height="16"/>
  </g>
  <ellipse cx="780" cy="198" rx="5" ry="8" fill="#9fd79f" stroke="#3a9a4a" stroke-width="1.2"/>
  <ellipse cx="792" cy="198" rx="5" ry="8" fill="#9fd79f" stroke="#3a9a4a" stroke-width="1.2"/>
  <rect x="682" y="206" width="94" height="4" fill="#e08a2e" fill-opacity="0.6"/>
  <rect x="796" y="206" width="82" height="4" fill="#e08a2e" fill-opacity="0.6"/>
  <!-- trao đổi khí -->
  <line x1="740" y1="254" x2="780" y2="214" stroke="#3a9a4a" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="786" y1="216" x2="786" y2="252" stroke="#e05a47" stroke-width="2.5" marker-end="url(#r)"/>
  <line x1="792" y1="214" x2="832" y2="252" stroke="#2f7ed8" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="730" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a9a4a">CO₂ vào</text>
  <text x="786" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#e05a47">O₂</text>
  <text x="846" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f7ed8">H₂O ra</text>
  <!-- nhãn lớp -->
  <g font-size="12" fill="#444">
    <text x="886" y="60">cutin</text>
    <text x="886" y="81">biểu bì trên</text>
    <text x="886" y="112">mô giậu</text>
    <text x="886" y="166">mô xốp</text>
    <text x="886" y="202">biểu bì dưới</text>
  </g>
  <text x="930" y="244" text-anchor="middle" font-size="12" fill="#444">khí khổng</text>
  <line x1="900" y1="236" x2="800" y2="206" stroke="#777" stroke-width="1.2"/>
</svg>
