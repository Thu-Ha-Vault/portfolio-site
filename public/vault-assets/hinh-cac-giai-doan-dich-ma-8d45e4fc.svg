<text x="170" y="408" text-anchor="middle" font-size="12.5" fill="#444">Tiểu phần bé gắn mRNA tại mã mở đầu AUG;</text>
<text x="170" y="425" text-anchor="middle" font-size="12.5" fill="#444">tRNA (đối mã UAC) mang aa mở đầu khớp AUG;</text>
<text x="170" y="442" text-anchor="middle" font-size="12.5" fill="#444">tiểu phần lớn gắn vào → ribosome hoàn chỉnh</text>
<text x="500" y="408" text-anchor="middle" font-size="12.5" fill="#444">tRNA mang aa vào vị trí A (đối mã khớp codon);</text>
<text x="500" y="425" text-anchor="middle" font-size="12.5" fill="#444">liên kết peptide hình thành giữa aa ở P và A;</text>
