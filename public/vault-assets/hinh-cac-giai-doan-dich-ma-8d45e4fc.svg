<text x="830" y="408" text-anchor="middle" font-size="12.5" fill="#444">Ribosome gặp bộ ba kết thúc (UAA/UAG/UGA)</text>
<text x="830" y="425" text-anchor="middle" font-size="12.5" fill="#444">→ 2 tiểu phần tách ra, giải phóng polypeptide;</text>
<text x="830" y="442" text-anchor="middle" font-size="12.5" fill="#444">enzyme cắt aa mở đầu → protein hoàn chỉnh</text>
